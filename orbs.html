<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIPPS2 Memory Files</title>
<link rel="stylesheet" href="menu.css">
<style>
  :root { --bg: #01030d; --ink: #d6e4ff; --dim: #7f93c4; --glow: rgba(120, 170, 255, .55); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: var(--menu-font); font-weight: 300; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    opacity: 0; transition: opacity 1.4s ease; }
  canvas[data-orbs="ready"] { opacity: 1; }
  canvas { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none; }


  .panel { position: fixed; left: 0; right: 0; bottom: 28px; display: grid; justify-items: center; gap: 14px;
    padding: 0 16px; }
  /* Fixed columns so the arrows never move, whatever the name length */
  .title { display: grid; grid-template-columns: 48px min(64vw, 32rem) 48px; align-items: center; gap: 16px; }
  .title > div { min-width: 0; }
  .title h2 { margin: 0; text-align: center; white-space: nowrap; overflow: hidden;
    font-size: var(--name-size, clamp(1.2rem, 3vw, 1.9rem)); font-weight: 400; letter-spacing: .18em;
    text-transform: uppercase; line-height: 1.25;
    /* Scanline stripes through the lettering */
    background: repeating-linear-gradient(to bottom, #f2f7ff 0 .085em, rgba(150, 185, 255, .5) .085em .14em);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(120, 170, 255, .45));
    transition: opacity .4s ease; }
  .title h2.swap { opacity: 0; }
  .count { color: var(--dim); font-size: .8rem; letter-spacing: .3em; }

  /* Arrow bubbles: SVG drawn by arrows.js, moved by its springs */
  .arrow { width: 48px; height: 48px; padding: 0; border: 0; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; will-change: transform;
    filter: drop-shadow(0 0 calc(4px + var(--glow-k, 0) * 10px) rgba(120, 170, 255, calc(.25 + var(--glow-k, 0) * .5))); }
  .arrow:focus-visible { outline: none; }
  .arrow svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .arrow .ring { fill: rgba(16, 34, 84, .28); stroke: rgba(170, 200, 255, .36); stroke-width: 1;
    transition: stroke .35s ease, fill .35s ease; }
  .arrow .ticks { fill: none; stroke: rgba(170, 200, 255, .38); stroke-width: 1.3; stroke-linecap: round; }
  .arrow .progress { fill: none; stroke: #e4eeff; stroke-width: 1.5; stroke-linecap: round; }
  .arrow .dot { fill: #f2f7ff; }
  .arrow .chev { fill: none; stroke: #eaf2ff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .arrow .ripple { fill: none; stroke: #c4d9ff; stroke-width: .9; opacity: 0;
    transform-box: fill-box; transform-origin: center; }
  .arrow.hot .ring, .arrow:focus-visible .ring { stroke: rgba(215, 230, 255, .8); fill: rgba(36, 66, 150, .34); }
  .arrow.hot .ticks { stroke: rgba(210, 226, 255, .6); }

  .dots { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(160, 190, 255, .28); transition: background .3s, box-shadow .3s, transform .3s; }
  .dots button[aria-current="true"] { background: #e4eeff; box-shadow: 0 0 10px #9cc0ff; transform: scale(1.3); }


  @media (max-width: 640px) {
    .panel { bottom: 34px; }
  }
  /* Phones on their side: compress the panel so the formation keeps the screen */
  @media (max-height: 500px) {
    .panel { bottom: 10px; gap: 6px; }
    .title { grid-template-columns: 40px min(56vw, 26rem) 40px; gap: 12px; }
    .title h2 { font-size: var(--name-size, 1.15rem); }
    .arrow { width: 40px; height: 40px; }
    .count { font-size: .65rem; }
    .dots button { width: 7px; height: 7px; }
  }
</style>
</head>
<body>

<canvas id="orbs" aria-hidden="true"></canvas>

<nav class="options" aria-label="Sections">
  <a data-item="launch" href="index.html#launch-disc"><span class="label">Launch Disc</span></a>
  <a data-item="storage" href="index.html#storage"><span class="label">Storage</span></a>
  <a data-item="memory" href="orbs.html"><span class="label">Memory Files</span></a>
</nav>

<nav class="panel" aria-label="Formations">
  <div class="title">
    <button class="arrow" id="prev" aria-label="Previous formation"></button>
    <div>
      <h2 id="name" aria-live="polite">&nbsp;</h2>
      <div class="count" id="count" style="text-align:center"></div>
    </div>
    <button class="arrow" id="next" aria-label="Next formation"></button>
  </div>
  <div class="dots" id="dots"></div>
</nav>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
  import { createOrbs, FORMATIONS } from "./orbs.js";
  import { createArrows } from "./arrows.js";
  import { initMenu } from "./menu.js";
  initMenu();

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const dots = FORMATIONS.map((f, i) => {
    const b = document.createElement("button");
    b.title = f.name;
    b.setAttribute("aria-label", f.name);
    b.addEventListener("click", () => { orbs.go(i); });
    $("dots").append(b);
    return b;
  });

  let swapTimer;
  const orbs = createOrbs($("orbs"), {
    start: Number(params.get("f")) || 0,
    startTime: Number(params.get("t")) || 0,
    onChange(i, f) {
      const h = $("name");
      h.classList.add("swap");
      clearTimeout(swapTimer);
      swapTimer = setTimeout(() => { h.textContent = f.name; fitName(); h.classList.remove("swap"); }, 250);
      $("count").textContent = `${String(i + 1).padStart(2, "0")} / ${FORMATIONS.length}`;
      dots.forEach((d, k) => d.setAttribute("aria-current", String(k === i)));
    },
  });

  // Shrink long names until they fit the fixed title column
  function fitName() {
    const h = $("name");
    h.style.removeProperty("--name-size");
    let px = parseFloat(getComputedStyle(h).fontSize);
    while (h.scrollWidth > h.clientWidth && px > 11) {
      px -= 1;
      h.style.setProperty("--name-size", px + "px");
    }
  }
  addEventListener("resize", fitName);

  // Every way of changing formation plays the arrow's press animation
  const arrows = createArrows({ prev: $("prev"), next: $("next") });
  const step = (d) => { arrows.press(d); d < 0 ? orbs.prev() : orbs.next(); };
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));

  // Swipe (touch or mouse drag) across the scene: the arrow ahead fills its ring,
  // and releasing past the threshold switches. Short taps still toggle the outlines.
  const SWIPE = 70;
  let swipe = null;
  const scene = $("orbs");
  scene.addEventListener("pointerdown", (e) => { swipe = { id: e.pointerId, x: e.clientX, y: e.clientY }; });
  addEventListener("pointermove", (e) => {
    if (!swipe || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    const horizontal = Math.abs(dx) > Math.abs(dy);
    arrows.pull(dx < 0 ? 1 : -1, horizontal ? Math.abs(dx) / SWIPE : 0);
  });
  const endSwipe = (e) => {
    if (!swipe || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    arrows.pull(0, 0);
    if (Math.abs(dx) >= SWIPE && Math.abs(dx) > Math.abs(dy) * 1.3) step(dx < 0 ? 1 : -1);
    swipe = null;
  };
  addEventListener("pointerup", endSwipe);
  addEventListener("pointercancel", endSwipe);

  addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { step(1); }
    else if (e.key === "ArrowLeft") { step(-1); }
    else if (e.key === "l" || e.key === "L") { orbs.toggleLines(); }
  });

  // Controller: d-pad left/right or bumpers change formation
  const held = {};
  (function pollPads() {
    for (const pad of navigator.getGamepads?.() || []) {
      if (!pad) continue;
      const left = pad.buttons[14]?.pressed || pad.buttons[4]?.pressed;
      const right = pad.buttons[15]?.pressed || pad.buttons[5]?.pressed;
      if (left && !held[pad.index + "l"]) { step(-1); }
      if (right && !held[pad.index + "r"]) { step(1); }
      const a = pad.buttons[0]?.pressed;
      if (a && !held[pad.index + "a"]) orbs.toggleLines();
      held[pad.index + "l"] = left; held[pad.index + "r"] = right; held[pad.index + "a"] = a;
    }
    requestAnimationFrame(pollPads);
  })();
</script>
</body>
</html>
