name: Build RIPPS2.elf

on:
  push:
    branches: [main]
    paths: ["elf/**", "assets/master.ttf", ".github/workflows/build-elf.yml"]
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug build: LOG output over EE SIO (PCSX2 shows it in its EE console log)"
        type: boolean
        default: false
      flags:
        description: "Extra make flags for a test build (e.g. RIPPS2_CD_TEST=1)"
        type: string
        default: ""

concurrency:
  group: build-elf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # Same pinned toolchain RiptOPL's own pinned build uses
    container: ps2dev/ps2dev@sha256:c64ae69c9817865ed98ff054e4ae5360b9e280ed952c97946bca95d9d35be995
    steps:
      # ps2dev images are Alpine and ship without git, which checkout and the build need
      - name: Install host dependencies
        run: |
          apk add --no-cache bash make git zip unzip tar gzip xz python3 py3-pip py3-yaml \
            gmp mpfr4 mpc1 perl cmake pkgconf coreutils findutils grep sed gawk diffutils

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set -o pipefail
          sh elf/build.sh 2>&1 | tee build.log
        env:
          RIPPS2_MAKE_FLAGS: ${{ inputs.debug && 'DEBUG=1 EESIO_DEBUG=1' || '' }} ${{ inputs.flags }}

      # build 76: RIPPS2's own source files build without a warning (a new one fails the build)
      - name: Warning gate (RIPPS2 files)
        shell: bash
        run: |
          if grep -E "src/ripps2[a-z0-9]*\.c:[0-9]+:[0-9]+: warning" build.log; then
            echo "::error::a RIPPS2 source file builds with a warning"; exit 1
          fi

      - name: Upload RIPPS2.elf
        uses: actions/upload-artifact@v6
        with:
          name: RIPPS2-elf${{ inputs.debug && '-debug' || '' }}${{ inputs.flags && '-test' || '' }}
          path: out/RIPPS2.elf
          if-no-files-found: error
          retention-days: 30

  # build 76: RiptOPL's host checks on the patched tree, plus RIPPS2's own (elf/tests). A plain Ubuntu
  # runner: the checks compile real loader code with the host gcc.
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply the patch series
        run: sh elf/build.sh --prepare-only

      - name: Host tests
        run: python3 elf/tests/run_host_tests.py riptopl
