  RIPPS2 could not read the kept boot program. Nothing was changed.: Dili mabasa sa RIPPS2 ang gitipigang boot program. Walay giusab.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: Dili masulat pagbalik sa RIPPS2 ang boot program. Sulayi pag-usab; wala nahilabti ang gitipigang kopya.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'Busy ang RIPPS2 sa pagbasa sa drive ug dili ma-restart ang I/O processor. Walay giusab: sulayi pag-usab sa makadiyot.'
