  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'I-INSTALL ANG BIBLE SA INTERNAL HDD

    - Gikopya ang RIPPS2 sa %s.

    - Gibasa ang boot program sa HDD nga anaa karon sa __mbr ug gitipigan sa %s/RIPPS2 (ibalik kini sa IBALIK).

    - Isulat ang HDD build sa PS2BBL puli niini, ug i-set ang console aron sugdan kini sa pag-on.

    - Ang config niini (%s) mosugod una sa RIPPS2 gikan sa %s%s%s, naka-on ang BOOT LOCK.

    Kinahanglan niini ang console nga mo-boot gikan sa HDD niini (tambok nga PS2 nga adunay network adapter). Ayaw kini palonga hangtod moingon nga humana.'
  INTERNAL HDD  (its boot area): INTERNAL HDD  (ang boot area niini)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'IBALIK ANG DAAN NGA BOOT PROGRAM SA HDD

    Ang gitipigan sa BIBLE (RIPPS2/MBR-BACKUP.KELF sa HDD) mobalik sa __mbr, puli sa BIBLE. Magpabilin ang RIPPS2 ug ang PS2BBL config kung asa sila.'
