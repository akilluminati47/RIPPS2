  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Wala ibalhin sa memory card sa slot %d ang BIBLE sa kilid, mao nga walay nausab. (Ang DIAG.TXT tupad sa RIPPS2 adunay tubag sa card.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Wala dawata pagbalik sa memory card sa slot %d ang %s, mao nga nagpabilin ang BIBLE. (Ang DIAG.TXT tupad sa RIPPS2 adunay tubag sa card.)
  MUSIC: MUSIKA
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': 'Ang %s%s walay %s. Nakit-an sa RIPPOPS ang PS1 emulator sa Sony sa %s: kopyahon sa START ang %s dinhi ug sugdan ang dula.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'Wala makita sa RIPPS2 ang %s sa %s%s. Kinahanglan sa POPSTARTER ang POPS_IOX.PAK uban sa POPS.PAK, o uban sa POPS.ELF ug IOPRP252.IMG: ang PS1 emulator sa Sony, gikan sa imong kaugalingong console. Mahimong makit-an niya kini diin dili mangita ang RIPPS2 (kon magsugod ang imong mga dula, makit-an niya). Molansad ang START, ug dili na pangutan-on pag-usab kining drive.'
  ' (The configs found were set: %s.)': ' (Gi-set ang nakit-ang mga config: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' I-save makausa ang mga setting niini gamit ang kaugalingon niining configurator, unya i-on pag-usab ang BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : Dili masugdan sa %s ang RIPPS2 gikan sa nahimutangan niini karon (%s), ug dili kopyahon sa RIPPS2 ang kaugalingon. Ibutang ang RIPPS2.ELF sa memory card o USB drive ug sugdi kini gikan didto.
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : Wala masulat sa BOOT LOCK ang config sa boot loader. Susiha nga dili write protected ang memory card o drive, unya sulayi pag-usab.
  BOOT LOCK found no boot loader config to change.: Walay nakit-ang boot loader config ang BOOT LOCK nga usbon.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: Gipalong ang BOOT LOCK. Gisugdan sa imong boot loader ang gisugdan niini kaniadto (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : Gibuksan ang BOOT LOCK. Gisugdan na sa %s ang RIPPS2 sa pag-on (%s), ug kung blangko ang IGR path, mobalik ang EXIT sa dula sa samang dalan. Pindota og dugay ang usa sa mga button niini samtang nagsugod ang console aron makaadto sa uban.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'Gibutang sa BOOT LOCK ang RIPPS2 nga una sa menu sa OSDMenu (%s). Walay gisugdan ang OSDMenu sa kaugalingon: pilia didto ang RIPPS2, ug mobalik sa maong menu ang EXIT sa dula. Para sa console nga dayon mosugod sa RIPPS2, ibutang sa BIBLE ang PS2BBL sa memory card (Boot Loader).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: Molihok ang BOOT LOCK pinaagi sa boot loader sa memory card (PS2BBL, FMCB o OSDMenu), ug walay bisan usa dinhi.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Gisugdan sa memory card sa slot %d ang %s sa pag-on, ug walay nakit-ang config niini ang BOOT LOCK nga usbon (gipangita niini ang %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Gisugdan sa memory card sa slot %d ang %s sa pag-on, nga dili ma-set sa BOOT LOCK: molihok kini pinaagi sa PS2BBL, FMCB ug OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Adunay boot loader nga may lock sa RIPPS2 niining console.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT sa dula: ang browser, unya ang imong boot loader (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'Gigamit: %s, %d ka hulagway, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Gisukod kung unsa kapaspas mobasa ang matag drive sa iyang mga hulagway: %s'
  'None: each picture is read from its own ART folder.': 'Wala: ang matag hulagway basahon gikan sa kaugalingon niining ART folder.'
  REMOVE the pack in %s (the ART folders stay as they are): TANGTANGA ang pack sa %s (magpabilin ang mga ART folder)
  Remove the ART Pack in %s? The ART folders stay as they are.: Tangtangon ang ART Pack sa %s? Magpabilin ang mga ART folder.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Gihunong. Gitangtang ang wala mahuman nga pack, ug ang mga hulagway gikan gihapon sa mga ART folder sama kaniadto.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Dili masulat ang ART Pack sa %s (naa bay luna sa maong drive?). Wala nay laing nausab: ang mga hulagway gikan gihapon sa mga ART folder sama kaniadto.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Natangtang na ang ART Pack sa %s. Ang mga hulagway gikan na usab sa mga ART folder.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Walay ART folder nga adunay mga hulagway sa mga gisugdang drive. Sugdi ang mga drive nga naa ang imong mga hulagway (SELECT sa ilang page), unya balik.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d ka hulagway gikan sa %d ka ART folder ang mosulod sa usa ka file, %s. Magpabilin ang mga ART folder: kopya lang ang pack. Mahimo nimong kopyahon ang art.tar ngadto sa ART folder sa laing drive gamit ang Memory Files, apan pinakapaspas kung buhaton kini sa drive nga imong gi-browse, mao nga una ang pinakapaspas nga drive. Buhaton na karon?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Nahuman na ang ART Pack: %d ka hulagway, %d MB, sa %s (%d s). Sukad karon gikan na niini ang mga hulagway, ug ang %d ka dula nga gibuhatan niini dili na pangutan-on sa ilang ART folder sa matag hulagway. Ang mga hulagway nga gikuha o gi-shoot sa RIPPS2 makita dayon; ang imong gikopya gikan sa PC makita kung buhaton nimo pag-usab ang pack.'
  '%s free': '%s bakante'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: mobasa og %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: mobasa og %s/s, ang pinakapaspas, %s'
