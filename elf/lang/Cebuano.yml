# RIPPS2 in Cebuano. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Cebuano
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE: I-SET UP, I-UPDATE O IBALIK"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "I-UPDATE ANG BIBLE: ANG SLOT %d NAAY MAS DAAN"
  "Background": "Background"
  "Sky": "Langit"
  "Black": "Itom"
  "Splash": "Splash"
  "Logo": "Logo"
  "Logo and Names": "Logo ug mga Ngalan"
  "Button Glyphs": "Mga Glyph sa Button"
  "Face Buttons": "Mga Action Button"
  "All Sixteen": "Tanang Napulog-unom"
  "Info Line": "Linya sa Info"
  "Power-on Wait": "Paghulat sa Pag-on"
  "This console has ROM %d.%02d. Many consoles from ROM 2.30 on no longer run system updates, so a BIBLE bound here may not start at power on. If it does not, start BIBLE as a plain ELF through OpenTuna or FunTuna instead.": "Kini nga console adunay ROM %d.%02d. Daghang console gikan sa ROM 2.30 dili na modagan og system update, busa ang BIBLE nga gihigot dinhi tingali dili magsugod sa pag-on. Kon dili, sugdi ang BIBLE isip yano nga ELF pinaagi sa OpenTuna o FunTuna."
  "Binds the BIBLE RIPPS2 carries to a memory card. On this console's ROM a bound BIBLE may not start at power on: a plain ELF through OpenTuna or FunTuna can.": "Ihigot ang BIBLE nga dala sa RIPPS2 sa memory card. Sa ROM niini nga console, ang gihigot nga BIBLE tingali dili magsugod sa pag-on: ang yano nga ELF pinaagi sa OpenTuna o FunTuna makahimo."
  "Starting that drive...": "Gisugdan ang maong drive..."
  "%s, path %d": "%s, dalan %d"
  "A BIBLE COMMAND": "USA KA SUGO SA BIBLE"
  "ARGUMENTS": "MGA ARGUMENTO"
  "Argument %d": "Argumento %d"
  "Arguments: %s": "Mga argumento: %s"
  "Auto (no button held)": "Awto (walay pinindot nga buton)"
  "BIBLE hands these to the program, in this order.": "Ihatag kini sa BIBLE ngadto sa programa, niini nga han-ay."
  "BIBLE has no way to reach that drive. Choose a program on another one, or type the path.": "Dili maabot sa BIBLE kana nga drive. Pagpili og programa sa lain, o i-type ang dalan."
  "BIBLE keeps this key from PS2BBL, but nothing in this build acts on it, so it changes nothing yet.": "Gitipigan sa BIBLE kini nga key gikan sa PS2BBL, apan walay naggamit niini sa kini nga build, busa wala pa kini nagbag-o."
  "BIBLE needs at least one path in its settings, or it starts in its rescue mode, so this one stays.": "Kinahanglan sa BIBLE ang labing menos usa ka dalan sa settings niini, o magsugod kini sa rescue mode, busa magpabilin kini."
  "BIBLE's Settings": "Settings sa BIBLE"
  "BIBLE's credits": "Mga credit sa BIBLE"
  "BOOT LOCK holds this line. Turn BOOT LOCK off to change it.": "Gigunitan sa BOOT LOCK kini nga linya. Palonga ang BOOT LOCK aron usbon kini."
  "Binds the BIBLE RIPPS2 carries to a memory card, writes it over the one there, or puts back what it replaced.": "Ihigot ang BIBLE nga dala sa RIPPS2 sa memory card, isulat kini ibabaw sa anaa, o ibalik ang gipulihan niini."
  "Boot Sound": "Tingog sa Pagsugod"
  "CHOOSE A PROGRAM": "PAGPILI OG PROGRAMA"
  "CHOOSE AN ELF": "PAGPILI OG ELF"
  "Choose a program from your drives, type a path, or pick one of BIBLE's commands. BIBLE tries the paths in order and starts the first it finds.": "Pagpili og programa gikan sa imong mga drive, pag-type og dalan, o pagpili og sugo sa BIBLE. Sulayan sa BIBLE ang mga dalan sunod-sunod ug sugdan ang una nga makit-an."
  "Follow Color Theme": "Sunda ang Color Theme"
  "How long BIBLE waits for a button before the Auto path. At 0 ms a button held from power on still works.": "Unsa ka dugay maghulat ang BIBLE og buton sa dili pa ang Awto nga dalan. Sa 0 ms, molihok gihapon ang buton nga gipugngan sukad sa pag-on."
  "Launch Keys": "Launch Keys"
  "Launch Keys: %s": "Launch Keys: %s"
  "On shows a disc's game ID on screen as it starts, for RetroGEM video mods.": "Ang Naka-on nagpakita sa game ID sa disc sa screen sa pagsugod, para sa RetroGEM video mods."
  "On shows a program's game ID on screen as it starts, for RetroGEM video mods. It is up to 11 characters from the file name.": "Ang Naka-on nagpakita sa game ID sa programa sa screen sa pagsugod, para sa RetroGEM video mods. Hangtod 11 ka letra gikan sa ngalan sa file."
  "On stops the disc at a launch and waits for the drive to answer. Off skips that wait, about 3 s in the lab, and a disc in the tray keeps spinning.": "Ang Naka-on mohunong sa disc sa pagsugod ug maghulat sa tubag sa drive. Ang Gipalong molaktaw niana, mga 3 s sa lab, ug ang disc sa tray magpadayon sa pagtuyok."
  "Opens the file itself in the text editor, comments and all. Every change here keeps the other lines as they are.": "Ablihan ang file mismo sa text editor, uban sa mga komento. Ang matag kausaban dinhi magpabilin sa ubang mga linya."
  "Path %d": "Dalan %d"
  "Shows the countdown, the clock and the console's details on the splash.": "Ipakita ang countdown, orasan ug mga detalye sa console sa splash."
  "Sky Color": "Kolor sa Langit"
  "TYPE A PATH": "PAG-TYPE OG DALAN"
  "The button pictures under the logo: none, the four face buttons, or all sixteen.": "Mga hulagway sa buton ilalom sa logo: wala, ang upat ka face button, o tanan nga napulo ug unom."
  "The console's browser": "Browser sa console"
  "The disc in the tray": "Ang disc sa tray"
  "The disc, without the PS2 logo": "Ang disc, walay PS2 logo"
  "The name BIBLE's splash shows for this button.": "Ang ngalan nga ipakita sa splash sa BIBLE para niini nga buton."
  "The same setting as in Audio. On (fast) keeps a copy on the memory card, so the sound starts with the first frame. Off is the fastest boot.": "Parehas nga setting sa Audio. Ang On (paspas) magtipig og kopya sa memory card, busa magsugod ang tingog sa unang frame. Ang Gipalong mao ang pinakapaspas nga boot."
  "The shape of BIBLE's splash. Auto follows RIPPS2's Widescreen when its settings are on a memory card.": "Ang porma sa splash sa BIBLE. Ang Awto mosunod sa Widescreen sa RIPPS2 kung ang settings niini anaa sa memory card."
  "The signal BIBLE starts in. Auto uses RIPPS2's Video Mode when its settings are on a memory card, and the console's own mode when they are not.": "Ang signal nga sugdan sa BIBLE. Ang Awto mogamit sa Video Mode sa RIPPS2 kung ang settings niini anaa sa memory card, kung dili ang kaugalingon nga mode sa console."
  "The sky on BIBLE's splash. Follow Color Theme uses the sky RIPPS2 saves with its settings. A color named here stays, whatever the theme.": "Ang langit sa splash sa BIBLE. Ang Sunda ang Color Theme mogamit sa langit nga gitipigan sa RIPPS2. Ang kolor nga gipili dinhi magpabilin bisan unsa ang tema."
  "This BIBLE (%s build) does not read this drive, so it moves on to the next path.": "Kini nga BIBLE (build nga %s) dili mobasa niini nga drive, busa mopadayon kini sa sunod nga dalan."
  "What BIBLE shows while it waits for a button: nothing, its logo, or its logo with the name of what each button starts.": "Unsay ipakita sa BIBLE samtang maghulat og buton: wala, ang logo, o ang logo uban sa ngalan sa sugdan sa matag buton."
  "What BIBLE starts when no button is held at power on.": "Unsay sugdan sa BIBLE kung walay buton nga gipugngan sa pag-on."
  "What BIBLE starts when this button is held at power on. L2 + R2 held at power on shows BIBLE's own page of them all.": "Unsay sugdan sa BIBLE kung kini nga buton gipugngan sa pag-on. Ang L2 + R2 sa pag-on magpakita sa kaugalingon nga panid sa BIBLE sa tanan."
  "What each button starts at power on, each with up to ten paths chosen from your drives.": "Unsay sugdan sa matag buton sa pag-on, matag usa hangtod napulo ka dalan nga gipili gikan sa imong mga drive."
  "What stands behind BIBLE's logo. Auto shows the sky when Sky Color is set or RIPPS2's settings are on a memory card, and black when they are not.": "Unsay naa sa luyo sa logo sa BIBLE. Ang Awto magpakita sa langit kung gibutang ang Kolor sa Langit o ang settings sa RIPPS2 anaa sa memory card, kung dili itom."
  "When a button starts a disc and the tray is empty, On opens the tray for you.": "Kung ang buton magsugod og disc ug walay sulod ang tray, ang Naka-on mag-abli sa tray para nimo."
  "Eject Tray at Launch": "I-eject ang tray sa pagsugod"
  "Read Console History": "Basaha ang kasaysayan sa console"
  "Game ID for Apps": "Game ID para sa mga app"
  "Game ID for Discs": "Game ID para sa mga disc"
  "File name (as it appears in your games list)": "Ngalan sa file (sama sa makita sa imong lista sa dula)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "Kini nga lista nagpakita og mga dula gikan sa ubang drive. I-rename ang dula sa panid sa kaugalingon niini nga drive."
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "Dili ma-rename ang dula nga may bituon. Kuhaa ang bituon (R3), i-rename, unya butangi og bituon pag-usab."
  "This drive cannot rename its files. The details can still be set.": "Kini nga drive dili maka-rename sa mga file niini. Mahimo gihapon ibutang ang mga detalye."
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "Sa APA HDD ang ngalan sa dula sa PS2 anaa sa partition table, busa dili kini ma-rename dinhi. Mahimo gihapon ibutang ang mga detalye niini."
  "Renames the app in your list. Its ELF and its art keep their names.": "Mag-rename sa app sa imong lista. Ang ELF ug art niini magpabilin sa ilang mga ngalan."
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "Mag-rename sa dula sa drive niini. Ang mga dula sa PS1 mangita sa ilang art ug settings pinaagi sa ngalan, busa i-rename usab kini sa RIPPS2. Ang art sa ART Pack nagkinahanglan nga tukuron pag-usab ang pack."
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "Mag-rename sa file sa dula sa drive niini. Ang mga dula sa PS2 mangita sa ilang art ug settings pinaagi sa game ID, busa walay mawala."
  "Stop Disc at Launch": "Ihunong ang disc sa pagsugod"
  "EDIT BIBLE'S SETTINGS FILE": "USBA ANG SETTINGS FILE SA BIBLE"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "Ang settings file sa BIBLE (%s) dili masulatan. Tan-awa nga ang memory card naa ug naay luna, unya sulayi pag-usab."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "Ang settings file sa BIBLE (%s) wala makit-an. Ang BIBLE: I-SET UP, I-UPDATE O IBALIK mosulat ug usa."
  "Boot sound On (fast): %s, handed over by BIBLE": "Boot sound On (paspas): %s, gitunol sa BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: ang fork ni akilluminati47 sa PS2BBL Extended, matag build gipirmahan ni akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "ang IOPRP image niini mohigot sa BIBLE sa imong card (GPL-3): ang console ang mohimo sa crypto, walay key"
  "KELFBinder by El Isra": "KELFBinder ni El Isra"
  "source: github.com/akilluminati47/BIBLE": "source: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Gi-set up ang BIBLE. BIBLE, ang boot loader ni akilluminati47 nga gibase sa PS2BBL ni El Isra, gi-set up sa RIPPS2 sa naandang 8 MB nga PS2 memory card o sa internal HDD: 0 ms nga pagsugod sa pag-on (dili tugotan sa PS2BBL Extended ang 0), una ang RIPPS2 gikan sa kung asa kini (dili gyud kini kopyahon), ug ang button nga gikuptan sa pag-on modala gihapon sa browser (TRIANGLE), sa disc (START) ug sa naa kaniadto (CIRCLE). I-set up, ayohon, o ibalik ang iyang gipulihan?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: Gi-set up ang BIBLE\nAng card sa slot %d usa ka SD2PSX o MMCE card. Ang BOOT card niini makabaton sa BIBLE puli sa PS2BBL nga naa niini (kana ibalhin una sa kilid, tibuok), kon ihigot sa console ang BIBLE niini. Kon isalikway ang paghigot, walay mausab sa card, ug ang card mahimong dili motubag hangtod palongon ug ablihan ang console. Ang START mohigot sa BIBLE niini."
  "BIND BIBLE": "IHIGOT ANG BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(Ang DIAG.TXT tupad sa RIPPS2 adunay tubag sa card.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Alang sa naandang 8 MB nga PS2 memory card (MagicGate card, o SD2PSX o MMCE BOOT card): ang naa sa slot %d. Sa pag-on, basahon sa PS2BBL ang config sa slot 1 una sa slot 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Dili ihigot sa console ang BIBLE sa memory card sa slot %d (napakyas ang MagicGate step niini). Walay giusab sa card. Ang card nga dili tinuod o dili tugma sa MagicGate dili makabaton og system update."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Ang SD2PSX o MMCE card mahimong dili na motubag human sa gisalikway nga paghigot: kon nawala karon ang memory card o ang MMCE drive, palonga ug ablihi pag-usab ang console."
  "RIP THIS CONSOLE'S AUDIO": "I-RIP ANG AUDIO NIINING CONSOLE"
  "sounds or music, from its BIOS": "mga tingog o musika, gikan sa BIOS niini"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Ablihan ang Audio settings sa BIOS Sounds ug BIOS Music: i-rip ang kaugalingong mga tingog niining console o ang menu music niini ngadto sa AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Boot sound On (paspas): %s sa memory card, samtang mobangon ang mga haligi"
  "Boot sound On: %s on the memory card, as the pillars rise": "Boot sound On: %s sa memory card, samtang mobangon ang mga haligi"
  "Boot sound On: %s, once its drive is up": "Boot sound On: %s, kung andam na ang drive niini"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Kini nga dula magsugod pinaagi sa Neutrino, ug walay nakit-an ang RIPPS2: wala sa path sa Settings, sa drive sa dula, sa mga memory card o sa bisan unsang nasugdan nga drive. Ibutang ang Neutrino ni rickgaiser (github.com/rickgaiser/neutrino) sa usa ka neutrino folder sa drive sa dula o sa memory card, o itudlo ang Game Launching > Neutrino niini."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Asa ang imong Neutrino, ang video mode niini, ug ang mga argument nga madawat sa matag Neutrino launch. Kuhaa ang Neutrino sa github.com/rickgaiser/neutrino ug ibutang kini sa usa ka neutrino folder sa drive o memory card."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Mas karaan kini nga Neutrino kaysa 1.3, nga dili makasugod og dula gikan sa APA HDD. Itudlo ang Game Launching > Neutrino sa Neutrino 1.3 o mas bag-o."
  "with rickgaiser's Neutrino as its second game core,": "nga adunay Neutrino ni rickgaiser isip ikaduhang game core,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "ang ikaduhang game core, gigamit gikan sa imong drive o memory card (AFL-3.0)"
  "FILE NAME": "NGALAN SA FILE"
  "GAME LIST": "LISTAHAN SA DULA"
  "%s in %s": "%s sa %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Gipalong ang Write Operations, mao nga dili ma-save sa RIPPS2 ang detalye sa dula o ma-rename kini. I-on ba?"
  "START %s": "SUGDI ANG %s"
  "NETWORK": "NETWORK"
  "%s did not answer. Is it connected?": "Wala motubag ang %s. Nakonektar ba kini?"
