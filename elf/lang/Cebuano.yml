  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Isagol ang bag-ong pack sa laing .tar? Pilion nimo sunod ang .tar nga tipigan ug i-update; didto moadto ang mga hulagway sa bag-ong pack.
