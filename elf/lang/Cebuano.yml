  HINT_COVERFLOW_BUTTON: Gidaghanon sa cover, gidak-on, animation ug pagngitngit alang sa Coverflow nga tema.
  HINT_ARTWORK_BUTTON: 'Unsang art ang i-load: mga cover, disc art, background ug save icon.'
  HINT_COLORS_BUTTON: Mga kolor sa text, highlight, dialog ug background.
  HINT_NOTIFICATIONS: Mubo nga pahibalo kung mag-load ang config, tema o language file.
