  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Nahuman: ang memory card sa slot %d magsugod sa gisugdan niini sa wala pa ang BIBLE. Gitipigan ang BIBLE sa mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): MEMORY CARD SA SLOT %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : Dili masugdan sa PS2BBL ang RIPPS2 gikan sa kung asa kini karon (makaabot kini sa mga memory card, USB drive ug MX4SIO), ug dili kopyahon sa RIPPS2 ang iyang kaugalingon. Ibutang ang RIPPS2.ELF sa memory card o USB drive ug sugdi kini gikan didto, o gamita ang PS2BBL Extended, nga makabasa sa MMCE ug sa HDD.
  RESTORE SLOT %d'S OLD BOOT LOADER: IBALIK ANG DAANG BOOT LOADER SA SLOT %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: Na-set up na ang BIBLE sa memory card sa slot %d (mc%d:/%s/%s), naka-on ang BOOT LOCK: sa pag-on, dayon niini sugdan ang RIPPS2 gikan sa %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: Gi-set up ang BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: Gi-set up ang BIBLE
  
    Nagdagan ang RIPPS2 gikan sa %s, nga dili mabasa sa PS2BBL (nagbasa kini og memory card, USB ug MX4SIO), ug dili kopyahon sa RIPPS2 ang iyang kaugalingon. Mabasa kini sa PS2BBL Extended config niining card (%s): i-on sa START ang BOOT LOCK, aron sugdan niini ang RIPPS2 gikan sa %s sa pag-on. Wala nay laing mausab sa card.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: Gi-set up ang BIBLE
  
    Nagdagan ang RIPPS2 gikan sa %s, nga dili mabasa sa PS2BBL: nagsugod kini og mga programa gikan sa memory card, USB drive o MX4SIO, ug dili kopyahon sa RIPPS2 ang iyang kaugalingon. Ibutang ang RIPPS2.ELF sa usa niini (ang APPS folder sa memory card, o USB drive), sugdi kini gikan didto, unya i-set up pag-usab ang BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: Gi-set up ang BIBLE
  
    Ang memory card sa slot %d: ibalhin sa kilid ang BIBLE (mc%d:/%s), ug mobalik sa iyang dapit ang iyang gipulihan (mc%d:/%s). Walay gipapas. Magpabilin ang PS2BBL config (mapalong sa BOOT LOCK ang lock).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: Gi-set up ang BIBLE (gihigot ang PS2BBL sa memory card)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: Gi-set up ang BIBLE (gibalik ang naa kaniadto)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: Gi-set up ang BIBLE (gi-restart ang I/O processor)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: Gi-set up ang BIBLE (gisulat sa memory card)'
