  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Salamat sa tanan nga nag-test sa Discord ug nag-abli og issues sa GitHub:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'Ang IGR Path %s dili gamiton: human sa dula, file sa memory card o USB ra ang makarga, ug dili gyud ang RIPPS2 mismo'
  an issue is the best way to get RIPPS2 updated.: ang issue mao ang labing maayong paagi aron ma-update ang RIPPS2.
  your Ogg and MP3 music, as RIPPS2 plays it: ang imong Ogg ug MP3 nga musika, sama sa pagpatugtog sa RIPPS2
  Pop In and Name: Pop in ug ngalan
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : Ang %s magsugod human sa mga haligi, mao nga ulahi ang tingog sa pagsugod. Ang START mokopya sa boot.adp (%d KB) tupad sa RIPPS2 sa memory card (%d KB ang bakante), diin kini motingog samtang mosaka ang mga haligi.
  The boot sound could not be copied to %s. It still plays from %s.: Ang tingog sa pagsugod dili makopya sa %s. Motingog gihapon kini gikan sa %s.
