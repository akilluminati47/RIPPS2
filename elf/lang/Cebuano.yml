  HINT_MMCE_PATH_BUTTON: Kung asa sa MMCE card ang mga game folder.
  HINT_MMCE_PREFIX: Subfolder sa MMCE card nga adunay CD, DVD ug ubang OPL folder. Ang root sa card ang gamiton kung blangko.
  HINT_GAME_TYPE_LABELS: Sugdan ang matag ngalan sa dula sa [PS1] o [PS2]. Pagpakita ra.
  HINT_MENU_VMODE: Video output alang sa menu. GSM ang gamit sa mga dula. Pindota og dugay ang Confirm aron tipigan ang bag-ong mode.
