  RIPPS2_LAUNCHERS: Mga launcher
  RIPPS2_LOOK_NOW: Pangitaa karon
  HINT_RIPPS2_LOOK_NOW: Pangitaon sa RIPPS2 sa mga nasugdang drive ang POPSTARTER, ang mga POPS file, ang Ember, ang BIOS sa Ember ug ang Neutrino, ug hinumdoman kung asa ang matag usa. Didto sila basahon sa matag launch.
  RIPPS2_HIDE_GAME: Itago ang dula
  RIPPS2_HIDDEN_GAMES: Mga gitagong dula
  HINT_RIPPS2_HIDDEN_GAMES: Ang mga dula nga gitago gamit ang Itago ang dula, sa mga nasugdang drive. Ipakita pag-usab ang usa, o papasa kini. Ang matag drive adunay kaugalingong lista.
  HINT_RIPPS2_BDM_DEVICES: 'Ang mga drive nga basahan sa BDM og dula: USB, MX4SIO, PC Card CF, ang DVR drive sa DESR ug iLink. Ang internal HDD mosunod sa start mode sa HDD.'
  HINT_RIPPS2_SCREEN: 'Ang hulagway sa menu: video mode, widescreen, asa kini sa TV (H-POS, V-POS) ug overscan.'
  HINT_RIPPS2_LAYOUT: Asa ang mga kategorya ug giunsa pagsulod sa panid, dayon ang mga cover sa RIPFLOW ug ang grid sa RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Kabug-at sa teksto, ang kolor sa tema, ang pagbalhin sa kolor ug matag kolor.
  HINT_RIPPS2_TEXT_WEIGHT: 'Unsa ka baga ang kaugalingong teksto sa RIPPS2: ang tooltips sa Settings, STATUS ug About. Ang Normal sama kaniadto; mas sayon basahon ang Bold sa humok nga hulagway. Ang kaugalingong font sa theme mopabilin sa gibag-on nga gihatag sa theme.'
  HINT_RIPPS2_HDD_START: 'Ang internal HDD, APA o exFAT: basahon kini sa RIPPS2 bisan unsa kini ug ipakita kausa, isip Dula sa HDD. Sugdan kini sa Awto (labing paspas kon naay drive) sa boot; pasagdan kini sa Gipalong.'
  HINT_RIPPS2_THEME_COLOR: Ang kaugalingong kolor sa tema. Pilia ang Kaugalingon isip kolor sa tema aron ikaw ang mopili niini, sama sa mga kolor sa teksto.
  HINT_RIPPS2_SWEEP: Lima ka kolor nga agian sa tema, hinay ug hamis. Balangaw, usa ka pagbalhin gikan sa matag kolor sa tema, o imong kaugalingon. Ang Off magpabilin sa tema nga dili molihok.
  HINT_RIPPS2_SWEEP_COLORS: Ang lima ka kolor sa pagbalhin ug ang kakusog niini. Usba ang usa sa RIPPS2 ug tipigan kini isip imo, sa ngalan nga imong ihatag.
  HINT_RIPPS2_SWEEP_NAME: Unsa ang ngalan sa imong pagbalhin sa listahan sa Pagbalhin sa kolor.
  HINT_RIPPS2_SWEEP_COLOR: Usa sa lima ka kolor nga agian sa pagbalhin, sumala sa han-ay.
  HINT_RIPPS2_SWEEP_SPEED: 'Unsa kadugay ang matag kolor sa dili pa mogawas ang sunod. Bisan ang Buhi nagpabiling hamis: ang mga kolor dili gyud mokidlap.'
  RIPPS2_HIDE_COMPRESS: Itago ang dula ug compression
  HINT_RIPPS2_SELECT_HOLD: 'SELECT gikuptan 4.2 s sa lista sa dula. Lista: ang mga tema sa usa ka panel, pili og usa. Sunod-sunod: ang sunod nga tema. Gipalong: walay mahitabo (ang pagpindot mo-refresh gihapon).'
  RIPPS2_RECENT_GAMES: Bag-o lang nga mga Dula
  RIPPS2_SET_METADATA_RENAME: Ibutang ang Metadata (Ilisi ang Ngalan)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Controller Una (Experimental)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'Nagbasa ang SD2PSX sa bus nga gi-ambit sa controller, ug samtang adunay gibasa dili madungog ang controller: malangan o mawala ang mga pindot samtang nag-load ang mga cover. Naka-on: moabot ang mga cover sa gagmayng bahin nga gibasa ang controller taliwala, mas hinay gamay. Naka-off: kutob sa kapaspas sa card. Kon naa sa Awto ang mga source sa card, kausa ra mo-load ang lista niini, sa boot.'
  HINT_RIPPS2_TRUST_CACHE: 'Ang lista nga gipakita gikan sa cache magpabilin kon unsa kini, andam i-launch, hangtod imong pindoton ang SELECT o usbon mismo sa RIPPS2 kana nga source. Naka-off: basahon pag-usab ang matag source sa background human makita ang cache niini, usa ka paghunong nga mabati sa MMCE o MX4SIO card, nga nag-ambit sa bus sa controller.'
  RIPPS2_STATUS_OPEN: Pag-load ug mga Drive
  HINT_RIPPS2_STATUS_OPEN: 'Abrihan ang STATUS: diin basahon sa boot ang settings ug ang mga lista sa dula, unsang lugar ang labing paspas, asa padulong ang EXIT sa dula, ug ang matag drive. Ang CACHE SETTINGS didto mobalik dinhi.'
  RIPPS2_BADGE_SET: Badge Set
  HINT_RIPPS2_BADGE_SET: 'Ang mga badge sa info page sa dula (rating, magdudula, ESRB, video mode, scan, aspect). RIPPS2: ang kaugalingong set niini, pareho sa matag theme. Theme: ang kaugalingong hulagway sa theme, o ang sa RIPPS2 kon pangayoon sa theme.'
  RIPPS2_HINT_FADE: Fade sa Hints ug Glyphs
  HINT_RIPPS2_HINT_FADE: 'Ang button hint o glyph nga mausab mo-fade in, sama sa mga cover, dayon pag-usab niini; ang nagpabilin dili hilabtan, sa matag page ug mensahe. Naka-off: motungha lang. Theme: ang theme ang modesisyon (naka-on gawas kon hints_fade=0 ang giingon niini).'
  RIPPS2_SIDEBAR_STYLE: Estilo sa Sidebar
  HINT_RIPPS2_SIDEBAR_STYLE: 'Classic (Bahin): ang mga icon sa itom nga bar sa sidebar nga adunay kolor nga linya tupad. XL (Usa ka Piraso): usa ka mas lapad nga bar, ang mga icon sa tunga. Theme: ang theme ang modesisyon.'
  HINT_EXITPATH: 'Asa moadto ang EXIT sa In-Game Menu. Mas maayo nga walay sulod: moadto ang EXIT sa browser, nga magsugod sa imong boot loader (FreeMcBoot, PS2BBL, OSDMenu o BIBLE) kung naay naka-install, ug ang RIPPS2 usab kung naka-on ang BOOT LOCK, sama sa pag-on; kung wala, ang PS2 browser. Ang ELF nga gi-type dinhi gamiton ra kung makarga kini human sa reset (sa memory card o FAT32 USB drive) ug dili kini ang RIPPS2 mismo; ang uban moadto sa browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO ug ang exFAT HDD. Sugdan sila sa Awto sa boot: labing paspas para sa mga drive nga nakasaksak, anaa sa Tanang dula ang ilang mga dula sukad sa sinugdanan. Sugdan sila sa Manwal kon imong ablihan ang ilang page.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Dili magamit sa Neutrino ang VMC sa APA HDD (kaya sa exFAT, USB ug MX4SIO): mosugod kini nga dula gamit ang tinuod nga card niana nga slot.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Sa boot, ang drive lang sa RIPPS2 ang basahon: ang settings ug mga tingog tupad sa RIPPS2.ELF (ang RIPPS2.FB didto mosulti kon asa) ug matag lista gikan sa iyang cache. Maghulat ang ubang drive: ang SELECT sa usa ka page magsugod sa iyang mga drive ug magdala sa ilang mga hulagway (kon naka-on ang Automatic Refresh, magsugod sila sa boot). Ang pag-on niini mokopya sa imong mga tingog, ug sa musika kon adunay luna, ngadto sa AUDIO tupad sa RIPPS2.'
  RIPPS2_ART_PACK: ART Pack
  RIPPS2_ART_PACK_BUILD: Buhata o tangtanga
  HINT_RIPPS2_ART_PACK: Giputos ang ART folder sa matag gisugdang drive ngadto sa usa ka art.tar sa drive nga imong pilion (unang gitanyag ang pinakapaspas). Ang mga cover makuha na gikan sa usa ka file nga adunay usa ka index, dili gyud pinaagi sa pagpangita sa matag dula, mao nga hapsay ang mga menu ug musika. Magpabilin ang mga ART folder.
  RIPPS2_LIST_CFG_TEXT: Titulo ug paghulagway sa lista
  HINT_RIPPS2_LIST_CFG_TEXT: 'Ang titulo ug paghulagway sa dula gikan sa CFG niini tupad sa lista. Theme: sumala sa theme (ang kaugalingong theme sa RIPPS2 dili magpakita niini). Kanunay kining ipakita sa info page.'
  RIPPS2_PS1_PREFER: Mga doble sa PS1
  HINT_RIPPS2_PS1_PREFER: 'Usa ka dula sa PS1 nga parehong POPSTARTER VCD ug Ember image. Duha: duha ka laray. Ember: ang Ember ra. POPSTARTER: ang VCD ra. Ang parehas nga titulo, gawas sa disc ID sa unahan, usa ra ka dula.'
  RIPPS2_MY_PADS: Akong mga controller
  HINT_RIPPS2_MY_PADS: 'Ang mga .pad profile sa PADS folder tupad sa RIPPS2: usa ka text file matag USB pad, ginganlan sumala sa ID niini (2563_0575.pad), ug gisusi ang matag usa. Ang pad nga adunay profile magdumala sa menu ug modula sa mga dula (naka-on ang Pad Emulator).'
  RIPPS2_PAD_SETUP: I-set Up ang USB Pad
  HINT_RIPPS2_PAD_SETUP: Isaksak ang USB pad nga wala mailhi sa RIPPS2, pislita ang matag button nga gipangayo niini, ug isulat sa RIPPS2 ang .pad niini sa PADS. Ang SELECT sa imong PS2 pad molaktaw og usa ka button.
