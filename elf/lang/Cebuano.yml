  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- Ihigot sa console ang PS2BBL niining card ug isulat kini isip %s/%s.
  
    - Ang iyang config, mc%d:/SYS-CONF/PS2BBL.INI, magsugod sa RIPPS2 diin kini naa (%s) nga walay paghulat (0 ms, nga dili tugotan sa PS2BBL Extended), naka-on ang BOOT LOCK. Dili kopyahon ang RIPPS2 mismo.
  
    Mag-restart ang I/O processor alang niini ug mohunong ang matag pagbasa sa drive hangtod mahuman; mobalik ang musika ug mga drive human niini. Ibilin ang card nga nakasulod ug ang console nga naka-on hangtod moingon kini nga nahuman na.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Ang SD2PSX o MMCE card mahimong manalipod sa kaugalingon human sa gisalikway nga pagsulat: kon nawala karon ang memory card o ang MMCE drive, palonga ug ablihi pag-usab ang console.'
