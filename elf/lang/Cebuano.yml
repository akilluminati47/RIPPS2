  HINT_MMCE_MODE: 'Mga dula sa SD2PSX o MemCard PRO2. Sugdan kini sa Awto sa boot: labing paspas para sa nakasaksak nga card, anaa sa Tanang dula ang mga dula niini sukad sa sinugdanan. Sugdan kini sa Manwal kon imong ablihan ang page niini, itago kini sa Gipalong.'
