  HTTP_TEST_NO_ISO: Walay suportadong image sa catalog nga ma-test sa byte range
  HTTP_ERR_CONNECT: Dili maabot ang HTTP server
  HTTP_ERR_CATALOG: Nawala, dili mabasa, o dako kaayo ang games.csv
  HTTP_ERR_RANGE: Wala gibalik sa server ang eksaktong mga byte nga gipangayo
  HTTP_LAUNCH_UNAVAILABLE: 'Wala pa mahimo ang paglansad sa HTTP: ma-browse ra ang catalog'
  HTTP_ERR_COMPRESSED: Dili pa suportado sa HTTP ang mga compressed image (.zso)
  HTTP_NO_VMC: 'Dili magamit sa HTTP ang mga virtual memory card: gamita ang tinuod nga card'
  HTTP_TAB_HINT: Gibasa sa HTTP ang games.csv gikan sa imong server. I-set ang address, port ug base path sa Network settings, unya gamita ang Test.
  RA_DISC_CHECK: 'RA: susiha ang suporta sa disc'
  RA_DISC_LAUNCH: 'RA: ilansad ang disc'
  RA_DISC_CHECKING: Gisusi ang disc alang sa RetroAchievements
  RA_DISC_HASH_FAILED: 'Dili ma-hash ang disc: susiha ang RA/hashes.txt sa settings folder'
  RA_DISC_HOME_ERROR: Dili magamit ang settings path alang sa mga watch list sa disc
  RA_DISC_ENABLE: I-enable una ang RetroAchievements telemetry sa Network settings
  RA_DISC_CHECK_FIRST: 'Walay watch list kining disc: gamita una ang RA check disc support'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d: Nakit-an ang HDD, apan dili mabasa ang APA partition table niini. Ayaw kini i-format: tingali mabawi pa ang imong mga dula.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: Wala na-mount ang usa ka drive tungod kay dili 512 byte ang mga sector niini (pananglitan drive nga 4K ang sector). 512-byte nga sector ra ang mabasa sa OPL.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Kaugalingong APA partition kining title, ug dili gyud usbon sa OPL ang partition table. Ilisi ang ngalan niini sa PC.
  POPS_SETTINGS_UNREADABLE: 'Dili mabasa ang settings sa POPSTARTER: busy o dili mabasa ang memory card. Sulayi pag-usab kung humana ang pag-load.'
  GLOBAL_PS_EMULATION_SETTINGS: Global nga setting sa PS emulation
  RA_NO_LINK_UNTRACKED: 'Dili magamit ang network: ilansad nga walay RetroAchievements karon.'
  IGR_USB_DRIVERS_PROMPT: Anaa sa USB ang IGR Path, apan walay USBD.IRX ug USBHDFSD.IRX ang %s, nga kinahanglan sa console aron maabot ang USB human sa In-Game Reset. Kung wala kini, mahulog ang IGR sa PS2 browser. Kopyahon ang mga driver sa RiptOPL didto karon? Gi-load usab sa FMCB, OpenTuna ug ubang exploit kini nga mga file ug tingali lahi ang ilang lihok niini. Dili gyud ilisan ang anaa nang mga file. FAT32 USB ra.
  IGR_USB_DRIVERS_FAILED: Dili makopya ang mga USB driver sa %s (puno o dili masulatan ang card). Mahulog ang IGR sa PS2 browser.
  OFFICIAL_CFG_NOTIFICATION: Na-load ang opisyal nga settings sa OPL gikan sa %s
  CFM_VMODE_HOLD_KEEP: Pindota og dugay aron tipigan
  BDM_PS2_FOLDERS_UNREADABLE: Dili maablihan ang CD o DVD folder sa %s (error %d), mao nga walay PS2 nga dula nga nalista niadtong device. Pindota ang SELECT sa page niini aron sulayan pag-usab.
  NEUTRINO_BD_NO_DEVICE_NUMBER: Naka-set sa bd ang Neutrino Filesystem, apan wala gyud gi-report niining device ang device number niini, mao nga dili maitudlo ang Neutrino niini. I-set ang Neutrino Filesystem niining dula sa Auto o exfat.
  CFM_VMODE_REVERT_IN: Mobalik sulod sa %d s
  EMBER_DITHER: Ember dithering
  HINT_EMBER_DITHER: Ember dithering (On o Off), gisulat sa EMBER/settings.txt sa gilansad nga device. Mas una ang value sa matag dula.
  EMBER_SHADING: Ember shading
  HINT_EMBER_SHADING: 'Giladmon sa kolor sa Ember: 15-bit, o 24-bit (eksperimental). Gisulat sa EMBER/settings.txt sa gilansad nga device. Mas una ang value sa matag dula.'
  EMBER_CONTROLLER: Ember controller
  HINT_EMBER_CONTROLLER: 'Controller mode sa Ember: Auto, Analog o D2A. Kasagaran mas maayo nga i-set sa matag dula (Triangle > Ember Game Settings), nga mas una niini.'
  EMBER_480P_CONFIRM: Walay hulagway ang Ember 480p sa composite. Gamiton ang 480p?
  EMBER_SHADING_24: 24-bit (eksperimental)
  EMBER_GAME_SETTINGS: Ember game settings
  HINT_EMBER_GAME_SETTING: Kining dula ra. Pindota ang OK aron isulat ang EMBER/games/<name>/settings.txt sa dili pa ilansad. Ang wala gihilabti nga Default magtipig sa anaa nang value sa file; ang pagbalik sa value sa Default motangtang sa override niini.
  EMBER_TIMING: Ember timing
  HINT_EMBER_TIMING: 'Video timing sa Ember: gisundan sa Auto ang region sa disc, gipugos sa NTSC ang 60 Hz, gipugos sa PAL ang 50 Hz. Gisulat sa EMBER/settings.txt sa gilansad nga device.'
  EMBER_GLOBAL_WARNING: Kini nga mga setting sa Ember para sa matag PS1 nga dula, ug adunay mga dula nga mo-crash tungod niini. Aron usbon ang usa ra ka dula, gamita ang Triangle > Ember Game Settings niadtong dula.
  RIPPS2_RANDOM: Random
  RIPPS2_ALL: Tanan
  RIPPS2_RANDOM_GAME: Random nga dula
  HINT_RIPPS2_RANDOM_GAME: Ang L2 ug R2 nga dungan molukso sa random nga dula. Sa pag-boot, maabli usab ang matag lista sa random nga dula.
  RIPPS2_ALL_GAMES: Tanang dula
  RIPPS2_SET_METADATA: I-set ang metadata
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 'Sugdan ang RIPPS2 sa pag-on pinaagi sa imong boot loader: dayon kini sugdan sa PS2BBL ug FMCB, ibutang kini sa OSDMenu nga una sa menu niini, ug mobalik ang EXIT sa dula sa samang dalan. Ibalik sa Off ang naa kaniadto. Wala pa? Mag-install og BIBLE ang Boot Loader.'
  HINT_COLORS_TEXT: Ang kolor sa text sa lista sa dula. Adunay kaugalingong kolor ang mga tema; usbon kini alang sa built-in nga mga tema.
  HINT_COLORS_SELECTED: Ang kolor sa gipiling dula ug sa gipiling row sa mga settings page.
  HINT_COLORS_DIALOG: Ang kolor sa mga settings page ug mga message box.
  HINT_COLORS_TITLE: Ang kolor sa ngalan sa dula sa info page niini.
  HINT_COLORS_BACKGROUND: Ang kolor sa likod sa tanan kung walay art o tore nga gidrowing.
  HINT_COLORS_PLASMA: Ang kolor nga gisagolan sa daan nga OPL plasma background (ang <OPL> nga tema).
  HINT_COLORS_RESET: Ibalik ang unom ka kolor sa ibabaw sa kaugalingong kolor sa tema.
  HINT_COVERFLOW_COUNT: Pila ka cover ang gipakita sa RIPFLOW sa matag kilid sa gipili.
  HINT_COVERFLOW_SCALE: Unsa kadako gidrowing sa RIPFLOW ang gipiling cover kumpara sa uban.
  HINT_COVERFLOW_ANIM: Unsa kapaspas mo-slide ang mga cover samtang naglihok ka sa flow.
  HINT_NARGS_QB: 'Quick Boot: laktawan ang kaugalingong start-up screen sa Neutrino. Kung naka-on dinhi, ipadala kini sa matag dula; kung naka-off, ipadala gihapon kini sa RIPPS2 alang sa USB, iLink ug network nga dula, diin kini kinahanglan.'
  HINT_NARGS_DBC: 'Debug Colors: pun-on sa Neutrino ang screen og kolor sa matag lakang sa pag-load, mao nga makita sa litrato kung asa mihunong ang dula.'
  HINT_NARGS_LOGO: Ipakita ang PS2 logo sa dili pa ang dula (ikaduhang IOP reboot, nga kinahanglan sa pipila ka iLink drive). Kung naka-off dinhi, sundan sa RIPPS2 ang Game Launching > PS2 Logo, ug dili gyud kini ipadala alang sa MMCE o network nga dula.
  HINT_NARGS_CWD: 'Ang folder nga makita sa dula isip iyaha. Blangko: default sa Neutrino.'
  HINT_NARGS_CFG: 'Imong kaugalingong Neutrino config file (-cfg). Blangko: ang sa Neutrino.'
  HINT_NARGS_ELF: 'Sugdan kining ELF puli sa boot file nga ginganlan sa disc. Blangko: ang sa dula mismo.'
  HINT_NARGS_ATA0: HDD image nga i-mount sa Neutrino isip internal HDD sa console, alang sa mga dula nga mogamit sa HDD (-ata0).
  HINT_NARGS_ATA0ID: Ang ID file nga kauban niadtong HDD image (-ata0id).
  HINT_NARGS_ATA1: Ikaduhang HDD image (-ata1).
  RIPPS2_LAST_USED: Katapusang gigamit
  RIPPS2_PAGE_BUTTONS: Mga button sa page
  HINT_RIPPS2_PAGE_BUTTONS: 'Unsang shoulder button ang mobalhin sa page sa lista sa dula. L2 / R2: sila ang mobalhin sa page ug ang L1 / R1 mobalhin sa category. L1 / R1: sila ang mobalhin sa page ug ang L2 / R2 mobalhin sa category. Tema: ang tema ang modesisyon; kung wala, moadto sa taas ang L2 ug sa katapusan ang R2. Ang L2 + R2 nga dungan kanunay mopili og random nga dula.'
  RIPPS2_IGR_MENU: Menu sulod sa dula
  HINT_RIPPS2_IGR_MENU: 'Naka-on: ang L1+L2+R1+R2+SELECT+START mo-pause sa dula: padayon, gawas, pagkuha og screenshot, tan-awa ang achievements, o palonga. Gipalong: ang combo mogawas dayon sa dula, sama kaniadto.'
  RIPPS2_BOOT_LOADER: Boot Loader
  HINT_RIPPS2_BOOT_LOADER: Ipakita kung unsa ang gisugdan sa matag memory card sa pag-on, ug mag-install og BIBLE (PS2BBL nga gi-set alang sa RIPPS2). Gitipigan ang daang boot file sa card.
  RIPPS2_MANAGE: Dumalaha
  RIPPS2_ACHIEVEMENTS: Mga achievement
  RIPPS2_NBD_SERVER: NBD server
  HINT_RIPPS2_NBD_SERVER: Ipaambit ang hard drive sa PC pinaagi sa network. Magpabilin ang status screen samtang nagdagan kini.
  RIPPS2_START: Sugdi
  RIPPS2_COVER_ART: Mga cover
  HINT_RIPPS2_COVER_ART: Mag-download og cover alang sa matag PS2 nga dula sa imong gisugdang mga lista nga wala pay cover, ngadto sa ART folder niadtong drive, gikan sa ps2-covers ni xlenore sa GitHub. Kinahanglan ang network cable ug internet.
  RIPPS2_DOWNLOAD: I-download
  RIPPS2_GLYPHS: Mga D-pad glyph
  HINT_RIPPS2_GLYPHS: 'Mga D-pad glyph tupad sa ngalan sa drive ug formation. Ipakita sila sa Fade In kung mobalhin ka; ipakita sila sa Fade Out samtang maabli ang page. Tema: ang tema ang modesisyon.'
  RIPPS2_COLOR_THEME: Kolor sa tema
  HINT_RIPPS2_COLOR_THEME: 'Usa ka kolor alang sa mga tore, orb, glass, CD player ug file browser, sa tulo ka tab. Tema: ang tema ang modesisyon (asul sa RIPPS2 kung dili kini modesisyon).'
  RIPPS2_HINTS: Mga hint sa button
  HINT_RIPPS2_HINTS: 'Ang mga hint sa button sa ubos. Itago sila sa Fade When Idle hangtod mopindot ka og button. Tema: ang tema ang modesisyon.'
  RIPPS2_CATEGORY_BAR: Category/Sidebar
  HINT_RIPPS2_CATEGORY_BAR: 'LAUNCH DISC, STORAGE ug MEMORY FILES: ang mga ngalan sa ibabaw, o ang sidebar. Ang Fade kung idle mopahanap sa mga ngalan, o motago sa sidebar, hangtod mopindot ka og button; mobalik dayon kini. Theme: ang theme ang modesisyon.'
  RIPPS2_SOURCE_NAME: Ngalan sa source
  RIPPS2_STATUS: Status
  RIPPS2_SOURCE: Source
  HINT_RIPPS2_SOURCE_NAME: 'Ang ngalan sa source ibabaw sa mga dula (TANANG DULA, HDD GAMES ug uban pa). I-fade kini sa Fade When Idle uban sa category bar; ipakita kini sa Pop In nga dako sa tunga sa page, sama sa pagngalan sa L3 sa lista, sa unang lista human sa pag-boot ug matag usab sa source, unya mawala. Ang Pop in ug ngalan mobuhat sa duha. Mahimo sa mga tema nga ang Pop In ang ilang Shown. Tema: ang tema ang modesisyon.'
  RIPPS2_RECENTS: Bag-o lang nga mga Dula
  HINT_RIPPS2_RECENTS: 'Bag-o lang nga mga Dula, usa ka page sa sidebar sa imong kataposang na-launch nga mga dula, pinakabag-o una: pila ang gitipigan, 1 hangtod 99 (i-type sa Triangle ang numero). Ang dula nga naa sa Manwal ang drive mosugod sa drive kon imong pilion. Ang 0 mopalong sa page.'
  RIPPS2_CATEGORY_ORDER: Han-ay sa category
  HINT_RIPPS2_CATEGORY_ORDER: 'Ilisan ang Launch Disc ug Memory files: Memory files una ug Launch Disc sa kataposan, sa mga ngalan sa bar ug sa mga icon sa sidebar. Gihimo para sa RIPFLOW (Interface > Theme). Theme: ang theme ang modesisyon.'
  RIPPS2_MUSIC: Musika
  HINT_RIPPS2_MUSIC: Gitugtog ang mga bgm file sa AUDIO folder tupad sa RIPPS2 ug sa AUDIO folder sa OPL sa matag nasugdang drive (Ogg nga walay tag, o 16-bit nga WAV); una nga motugtog ang ginganlan og Menu. Ang kaugalingong musika sa tema ang motugtog kung naa.
  RIPPS2_BIOS_SOUNDS: Mga tunog sa BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Isulat ang kaugalingong menu sound niining console gikan sa BIOS niini ngadto sa AUDIO folder isip mga tunog sa RIPPS2 (ubos sa 1 MB). Lahi nga rip ang menu music: BIOS Music.'
  RIPPS2_RIP: I-rip
  RIPPS2_HINTS_GLYPHS: Mga hint ug glyph
  HINT_RIPPS2_HINTS_GLYPHS: Ang dagway sa mga hint sa button ug glyph. Magsugod ang matag row sa Tema, ang gipili sa tema; bisan unsang laing pagpili imo ug mas una sa matag tema.
  RIPPS2_HINT_LAYOUT: Layout sa hint
  HINT_RIPPS2_STARSIDE: 'Asa nahimutang ang star sa paborito nga dula sa lista. Wala: kaugalingong column sa sinugdanan sa matag row. Tuo: human sa titulo. Tinago (ang sinugdanan): walay star ug walay column, bug-os ang mga titulo. Theme: kon unsa ang giingon sa theme. Himoon sa R3 nga paborito ang dula bisan unsa; pindota og 4 ka segundo ang R3 sa lista aron itago ang mga star o ibalik kini (himoon usab niini nga paborito ang dula ilawom sa cursor).'
  HINT_RIPPS2_HINT_LAYOUT: 'Row: ang mga hint sa usa ka linya. Column: usa ka hint matag linya, lista sa kilid, sugod kung asa ibutang sa tema ang mga hint niini.'
  RIPPS2_HINT_LABELS: Mga label sa hint
  HINT_RIPPS2_HINT_LABELS: Gidrowing ra sa Glyph ra ang mga button, alang sa mga glyph nga adunay kaugalingong pulong. Gihiusa sa Mga badge ang glyph ug titulo sa matag hint sa usa ka badge.
  RIPPS2_HINT_MENU: Hint sa menu (START)
  RIPPS2_HINT_REFRESH: Hint sa refresh (SELECT)
  RIPPS2_HINT_STAR: Hint sa paborito (R3)
  RIPPS2_HINT_VIEW: Hint sa view (L3)
  HINT_RIPPS2_HINT_SHOW: Ipakita o itago kining hint. Molihok gihapon ang button niini.
  RIPPS2_GLYPH_SET: Glyph set
  HINT_RIPPS2_GLYPH_SET: 'Ang mga glyph sa button sa matag page: ang sa tema, ang sa RIPPS2, Standard (ngitngit nga button, kolor nga simbolo) o Puti (tibuok puti).'
  RIPPS2_HINT_ORDER: Han-ay sa hint
  HINT_RIPPS2_HINT_ORDER: Gihan-ay ang mga hint. Gitipigan sa Tema ang han-ay sa tema; ang Imong pagkasunod mao ang gi-set dinhi.
  RIPPS2_HINT_ORDER_FOLLOW: Han-ay
  RIPPS2_GRID_LAYOUT: Grid layout
  HINT_RIPPS2_GRID_LAYOUT: Pila ka cover ang masulod sa usa ka Grid page, uban ang spacing sa RIPPS2. Gitipigan sa Tema ang kaugalingong layout sa tema.
  RIPPS2_LAUNCH_DISC: Disc sa paglansad
  HINT_RIPPS2_LAUNCH_DISC: Mosulod ang disc sa dula samtang ilansad kini. Mohunong ug mawala ang Pop In; motuyok og mas paspas ang Tuyok hangtod magsugod ang dula; mohunong ang Zoom, unya modako aron klaro nga mabasa ug magpabilin.
  RIPPS2_TRANSITION: Transition sa page
  HINT_RIPPS2_TRANSITION: 'Giunsa pagsulod ang bag-ong page kung moadto ka sa laing category: gikan sa kolor sa background sa tema, o gikan sa flash. Gitipigan sa Tema ang gipili sa tema.'
  RIPPS2_CATEGORY_LAYOUT: Layout sa category
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Asa nahimutang ang tulo ka category: ang ilang mga ngalan sa ibabaw, o mga icon paubos sa sidebar, matag usa adunay drawer sa mga page niini (dad-on ka didto sa Wala sa lista), o Menu: walay bar, anaa sa START menu ang mga category sama sa theme nga gihimo para sa OPL. Ang Theme mopabilin sa iya sa theme.'
  RIPPS2_CACHE: Cache
  HINT_RIPPS2_CACHE: 'Giunsa pagtipig ang lista sa dula sa matag tinubdan aron dayon maabli ang iyang page: Fast Cache, ang lista sa internal HDD ug ang Automatic Refresh.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'Gitipigan sa matag source ang kataposang lista sa dula niini (RIPPS2.LST tupad sa CD ug DVD folder niini) ug ipakita kini dayon pagtubag sa source. Ang Trust Cache ang modesisyon kon basahon pag-usab ang source pagkahuman. Naka-off: basahon una ang matag lista gikan sa source niini, sama kaniadto.'
  HINT_RIPPS2_VIGNETTE: Ngitngitan ang mga ngilit sa matag cover gawas sa gipili, aron mabantog ang gipili. Ang Huyang tunga sa Puno.
  RIPPS2_GRID_WIDE: Widescreen grid layout
  HINT_RIPPS2_GRID_WIDE: Ang Grid page sa 16:9 nga hulagway ra (Widescreen, 720p, 1080i), diin mas niwang ang mga cover ug mas daghan ang masulod. Gigamit sa Tema ang layout sa tema; gisundan sa Pareho ang Grid layout.
  RIPPS2_BGBLUR: Blur sa background
  HINT_RIPPS2_BGBLUR: Unsa kakusog gi-blur sa frosted glass ang background art sa dula. Gigamit sa Tema ang kaugalingong value sa tema (Huyang sa RIPGRID ug Adapt).
  HINT_RIPPS2_HINT_SLOT: Ang hint niining dapit. Mobalhin ang hint nga ania dinhi sa daang dapit sa gipiling hint.
  PS1_SAVE_GUIDANCE: Nagdepende sa Ember o POPSTARTER ang mga PS1 save; dili magamit ang mga PS2 VMC setting.
  NEUTRINO_SHOW_ARGS: Ipakita ang mga launch argument
  HINT_NEUTRINO_SHOW_ARGS: Sa dili pa ang matag paglansad sa Neutrino, ipakita ang matag argument nga madawat sa Neutrino ug mangutana kung magpadayon. Mobalik sa menu ang Back nga walay paglansad.
  NEUTRINO_ARGS_CONFIRM: Magsugod ang Neutrino gamit kini nga mga argument. Ilansad?
  HINT_NARGS_EXTRA: Ubang Neutrino flag, gibulag sa espasyo, nga ipadala human sa tanan sa ibabaw. Kanunay idugang sa RIPPS2 ang -bsd ug -dvd alang sa drive ug ISO sa dula, -mc0 ug -mc1 alang sa mga VMC niini, -gsm alang sa video mode niini, ug ang kaugalingong compatibility mode sa dula. Ang flag nga adunay kaugalingong row sa ibabaw (sama sa -logo) mobalhin sa maong row sa pag-save, ug ipadala gihapon.
  HINT_RIPPS2_THEME: Ang dagway sa matag page. Sa lista sa dula, pindota og dugay ang SELECT sulod sa 4.2 ka segundo aron mobalhin sa sunod nga tema; ang paspas nga pindot sa SELECT mo-refresh gihapon sa lista.
  GAME_TYPE_LABELS: Ipakita ang mga label nga [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Dili ma-save ang cheat list sa Neutrino folder, mao nga dili kini magamit sa Neutrino. Ilansad nga walay cheat?
  AUTO_CREATE_VMC: Paghimo og VMC sa unang paglansad
