  'This disc is not compatible: it is a region %d DVD, and this console plays another region''s DVDs. Start it anyway?': 'Dili tugma kining disc: DVD kini alang sa region %d, ug ang laing region sa DVD ang gipatugtog niining console. Sugdan gihapon?'
  ? 'This disc is not compatible: it reads as DVD video but has no DVD video on it (no VIDEO_TS), so a DVD player cannot play it.'
  : 'Dili tugma kining disc: mabasa kini isip DVD video apan walay DVD video sa sulod (walay VIDEO_TS), mao nga dili kini mapatugtog sa DVD player.'
  This is an ESR-patched PS2 game. Put ESR (esr*.elf) in APPS, BOOT or ESR on a memory card or USB drive to start it.: PS2 nga dula kini nga adunay ESR patch. Ibutang ang ESR (esr*.elf) sa APPS, BOOT o ESR sa memory card o USB drive aron masugdan kini.
