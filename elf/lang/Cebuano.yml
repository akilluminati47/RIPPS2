  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Mihunong ang pagsagol taliwala sa duha ka pag-rename: ang gitipigang .tar mao ang %s ug ang gisagol %s. I-rename sila balik gamit ang Memory files.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
