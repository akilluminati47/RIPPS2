  This MMCE card cannot rename a file, which compression needs for its last step. Update its sd2psXtd firmware to 1.4.0 or newer (sd2psxtd.github.io/download), then try again. Nothing was changed.: Kining MMCE card dili maka-rename og file, nga gikinahanglan sa compression sa katapusang lakang niini. I-update ang sd2psXtd firmware niini ngadto sa 1.4.0 o mas bag-o (sd2psxtd.github.io/download), dayon sulayi pag-usab. Walay nausab.
