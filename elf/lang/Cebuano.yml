  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Mga hulagway nga mosulod: %d (%s). Parehas ug ngalan sa duha: %d (ang gisagol ang modaog).'
  'Reading the archives: %s': 'Gibasa ang mga archive: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Mohunong? Ang gitipigang .tar magpabilin sama sa kaniadto; tangtangon ang wala nahuman nga kopya.
  Stopped. %s is as it was; the unfinished copy was removed.: Mihunong. Ang %s sama sa kaniadto; natangtang ang wala nahuman nga kopya.
  The kept .tar is only replaced once the merged copy is whole.: Ang gitipigang .tar ilisan lang kung kompleto na ang gisagol nga kopya.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Dili masulat ang pagsagol sa drive sa %s (aduna bay luna?). Sama kini sa kaniadto; walay laing nausab.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
