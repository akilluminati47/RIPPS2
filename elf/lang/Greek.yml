  This MMCE card cannot rename a file, which compression needs for its last step. Update its sd2psXtd firmware to 1.4.0 or newer (sd2psxtd.github.io/download), then try again. Nothing was changed.: Αυτή η κάρτα MMCE δεν μπορεί να μετονομάσει αρχείο, κάτι που χρειάζεται η συμπίεση στο τελευταίο της βήμα. Ενημερώστε το υλικολογισμικό sd2psXtd της στην 1.4.0 ή νεότερη (sd2psxtd.github.io/download) και δοκιμάστε ξανά. Δεν άλλαξε τίποτα.
