  The folder %s could not be made. Is the drive full or write-protected? Nothing was written.: Ο φάκελος %s δεν δημιουργήθηκε. Είναι ο δίσκος γεμάτος ή προστατευμένος από εγγραφή; Δεν γράφτηκε τίποτα.
  ? 'The sounds take %d KB and this memory card has %d KB free. Nothing was written. Free some room on the card, or start a drive in Storage and rip them again: RIPPS2 then offers the drive.'
  : 'Οι ήχοι πιάνουν %d KB και αυτή η κάρτα μνήμης έχει %d KB ελεύθερα. Δεν γράφτηκε τίποτα. Ελευθερώστε χώρο στην κάρτα ή ξεκινήστε έναν δίσκο στην Αποθήκευση και εξαγάγετέ τους ξανά: τότε το RIPPS2 προτείνει τον δίσκο.'
  ? The sounds take %d KB and this memory card has %d KB free. START writes them to %sAUDIO/ on the drive instead, and RIPPS2 plays them from there.
  : Οι ήχοι πιάνουν %d KB και αυτή η κάρτα μνήμης έχει %d KB ελεύθερα. Το START τους γράφει αντί γι' αυτό στο %sAUDIO/ στον δίσκο, και το RIPPS2 τους παίζει από εκεί.
  There was not enough memory to make the sounds. Nothing was written.: Δεν υπήρχε αρκετή μνήμη για να φτιαχτούν οι ήχοι. Δεν γράφτηκε τίποτα.
  ? BIBLE could not move %s aside to keep it, so it stopped there. Nothing on the card was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Το BIBLE δεν μπόρεσε να παραμερίσει το %s για να το κρατήσει, οπότε σταμάτησε εκεί. Δεν άλλαξε τίποτα στην κάρτα. (Το DIAG.TXT δίπλα στο RIPPS2 έχει ό,τι απάντησε η κάρτα.)
  ? 'Memory Files opens now, on MEDIA, with the disc on its clipboard (RIPPED). Go to the drive and folder it should be in (any drive: USB, the HDD, the SD2PSX''s MEDIA), press TRIANGLE for ACTIONS and choose PASTE. RIPDISC then asks once more and reads the disc with your PS2''s laser, writing it there.'
  : 'Τα Αρχεία μνήμης ανοίγουν τώρα, στο MEDIA, με τον δίσκο στο πρόχειρο (ΕΞΗΧΘΗ). Πηγαίνετε στον δίσκο και στον φάκελο όπου πρέπει να μπει (οποιονδήποτε δίσκο: USB, τον HDD, το MEDIA του SD2PSX), πατήστε ΤΡΙΓΩΝΟ για ΕΝΕΡΓΕΙΕΣ και διαλέξτε ΕΠΙΚΟΛΛΗΣΗ. Το RIPDISC ρωτά άλλη μία φορά και διαβάζει τον δίσκο με το λέιζερ του PS2 σας, γράφοντάς τον εκεί.'
