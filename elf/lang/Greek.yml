  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : Το %s ξεκινά μετά τις κολόνες, οπότε ο ήχος εκκίνησης παίζει αργά. Το START αντιγράφει το boot.adp (%d KB) δίπλα στο RIPPS2 στην κάρτα μνήμης (%d KB ελεύθερα), όπου παίζει καθώς υψώνονται οι κολόνες.
  The boot sound could not be copied to %s. It still plays from %s.: Ο ήχος εκκίνησης δεν αντιγράφηκε στο %s. Παίζει ακόμα από το %s.
