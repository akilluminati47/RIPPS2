  FAV_REMOVED: Αφαιρέθηκε από τα Αγαπημένα παιχνίδια
  FAV_REMOVE_FAILED: Δεν αφαιρέθηκε από τα Αγαπημένα παιχνίδια
  POPS_UDPFS_SETTINGS: Ρυθμίσεις δικτύου POPS UDPFS
  POPS_UDPFS_DISCOVERY: Αποθηκεύει σε κάθε φάκελο POPS σε USB. Ο διακομιστής 0.0.0.0 χρησιμοποιεί εντοπισμό.
  POPS_UDPFS_NOT_READY: Το POPS UDPFS χρειάζεται έγκυρα και ταιριαστά IPCONFIG.DAT και UDPFSCONFIG.DAT σε κάθε φάκελο POPS σε USB. Ρυθμίστε τα στις Ρυθμίσεις δικτύου POPS.
  HINT_POPS_UDPFS_IP: Στατική IP του PS2 που χρησιμοποιεί ο οδηγός POPS UDPFS μετά την επαναφορά του IOP.
  POPS_UDPFS_ALL_USB_FOLDERS: Όλοι οι φάκελοι POPS σε USB
  POPS_UDPFS_INVALID_SUFFIX: ' (μη έγκυρο)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (ελλιπές)'
  POPS_UDPFS_DRIVER_NOT_READY: Το POPS UDPFS χρειάζεται το ζεύγος οδηγών .udpfs εγκατεστημένο στην κάρτα μνήμης. Εγκαταστήστε το χειροκίνητα ή ενεργοποιήστε το BDMA Εφαρμογή στην εκκίνηση.
  VMC_REPLACE_REQUIRES_DELETE: Η αλλαγή μεγέθους του VMC θα έσβηνε τις αποθηκεύσεις του. Κρατήστε αντίγραφο του υπάρχοντος VMC και χρησιμοποιήστε τη Διαγραφή πριν φτιάξετε νέο μέγεθος.
  VMC_CREATE_FAILED: Το VMC δεν δημιουργήθηκε. Ελέγξτε τη συσκευή, τη σύνδεση και την πρόσβαση εγγραφής. Οι υπάρχουσες αποθηκεύσεις δεν αντικαταστάθηκαν.
  RA_EXPERIMENTAL_CARDS: Πειραματικές κάρτες Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Πειραματικές κάρτες επιτευγμάτων μέσα σε παιχνίδια PS2. Μπορεί να τρεμοπαίζουν ή να παγώνουν παιχνίδια. Μόνο Caduceus· το Ανενεργό χρησιμοποιεί τον χρυσό παλμό. Ισχύει από την επόμενη εκκίνηση παιχνιδιού.
  RA_NEUTRINO_UNTRACKED: Το Neutrino RA δεν είναι διαθέσιμο σε αυτή την εκκίνηση. Ελέγξτε το RA runtime, την IP βοηθού και την αποθηκευμένη λίστα παρακολούθησης. Εκκίνηση χωρίς επιτεύγματα.
  UDPFS_IP_CONFLICT: Μια άλλη συσκευή στο δίκτυό σας χρησιμοποιεί τη διεύθυνση IP αυτού του PS2, οπότε οι απαντήσεις του διακομιστή UDPFS πάνε σε εκείνη. Ορίστε διαφορετική IP στο PS2 στις Ρυθμίσεις δικτύου.
  XERA_ACHIEVEMENTS: Βιβλιοθήκη RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Περιηγηθείτε σε αυτό το παιχνίδι μέσω της βιβλιοθήκης RetroAchievements στο κύριο μενού.
  XERA_OPEN_NETWORK: Δεν υπάρχει πρόσβαση στο xeRAbora. Ενεργοποιήστε το OPEN TO THE NETWORK στις ρυθμίσεις του, ελέγξτε την IP βοηθού RA και το τείχος προστασίας του υπολογιστή.
  XERA_UNKNOWN_GAME: Το xeRAbora δεν ξέρει αυτή την εικόνα. Τρέξτε πρώτα τον έλεγχο υποστήριξης παιχνιδιού RA.
  XERA_NOT_PLAYED: Δεν είναι ακόμα στη βιβλιοθήκη σας RetroAchievements. Παίξτε το μία φορά με επιτεύγματα και πατήστε Select.
  XERA_CONNECTION_ERROR: Δεν διαβάζεται η λίστα από το xeRAbora. Πατήστε Select για νέα δοκιμή.
  CAD_PAIR_UDPFS: Δεν υπάρχει πρόσβαση στο Caduceus. Κάντε σύζευξη του ART/CADUCEUS.KEY στον φάκελο που μοιράζεται το PS2-Servers, και ορίστε την IP βοηθού RA.
  RA_WL_NOT_SAVED: Η λίστα παρακολούθησης δεν αποθηκεύτηκε. Βεβαιωθείτε ότι η συσκευή ή το κοινόχρηστο του παιχνιδιού δέχεται εγγραφή, και ελέγξτε ξανά.
  RA_UDPFS_LOAD_FIRST: Ανοίξτε μία φορά τη σελίδα UDPFS για να φορτωθεί η μονάδα δικτύου της, και δοκιμάστε ξανά.
  CAD_UDPFS_IMG: 'Ο περιηγητής Caduceus χρειάζεται SMB ή UDPFS Αρχεία: το UDPFS IMG δεν έχει κοινόχρηστο φάκελο για το κλειδί του.'
  XERA_SET_CLOCK: Δεν είναι ακόμα στη βιβλιοθήκη σας RetroAchievements. Ρυθμίστε το ρολόι της κονσόλας στις ρυθμίσεις συστήματος για να δείτε την πλήρη λίστα του, ή παίξτε το μία φορά με επιτεύγματα.
  CFG_TITLES: Εμφάνιση τίτλων CFG στις λίστες παιχνιδιών
  HINT_CFG_TITLES: Δείχνει τον Τίτλο από το CFG κάθε παιχνιδιού αντί για το όνομα αρχείου, και ταξινομεί με αυτόν. Διαβάζει κάθε CFG όταν ανανεώνεται μια λίστα, οπότε οι λίστες φορτώνουν πιο αργά. Μόνο εμφάνιση.
  AUTO_VMC_INVALID: Το αρχείο VMC αυτού του παιχνιδιού υπάρχει αλλά δεν είναι έγκυρη κάρτα μνήμης, οπότε δεν χρησιμοποιήθηκε ούτε αντικαταστάθηκε. Το παιχνίδι ξεκινά χωρίς· ελέγξτε το στο μενού VMC.
  AUTO_VMC_STILL_RUNNING: Το VMC αυτού του παιχνιδιού δημιουργείται ακόμα. Ξεκινήστε ξανά το παιχνίδι σε λίγο.
  NEUTRINO_DVR_QUICKBOOT: Η εκκίνηση DVR χρειάζεται τη μετάβαση σε λειτουργία PSX. Αφαιρέστε το -qb από τα γενικά και τα ανά παιχνίδι ορίσματα Neutrino.
  NEUTRINO_DVR_FILE_MISSING: 'Η εγκατάσταση Neutrino για DVR είναι ελλιπής. Λείπει απαραίτητο αρχείο:'
  PARENLOCK_GAME: Γονικό κλείδωμα
  PARENLOCK_GAME_HINT: Ζητά τον κωδικό γονικού κλειδώματος για να ξεκινήσει αυτό το παιχνίδι.
  PARENLOCK_GAME_NO_PASSWORD: Ορίστε κωδικό γονικού κλειδώματος, αλλιώς αυτό το παιχνίδι δεν θα κλειδωθεί.
  HINT_ENABLE_PCCF: CompactFlash σε PC CARD πρώιμων ιαπωνικών PS2. Μόνο εγγενή παιχνίδια PS2· το CF χρειάζεται αποκλειστική πρόσβαση στο PC CARD. Επανεκκινήστε για να απελευθερωθεί.
  PCCF_GAMES: Παιχνίδια PC CARD CF
  PCCF_UNAVAILABLE: 'Το CF δεν είναι διαθέσιμο: χρειάζεται πρώιμο ιαπωνικό PS2 με PC CARD, συμβατή κάρτα, και κανέναν ενεργό οδηγό DEV9/HDD/δικτύου.'
  PCCF_UNSUPPORTED_GAME: Το CF υποστηρίζει προς το παρόν μόνο εγγενή παιχνίδια PS2. Το VMC σε CF, η φόρτωση PS1 και τα επιτεύγματα δικτύου δεν είναι διαθέσιμα.
  HINT_ENABLE_DVR: Πειραματικός εντοπισμός ISO DESR DVR. Χρειάζεται ενεργή πηγή HDD· η εκκίνηση παιχνιδιών χρειάζεται εξωτερικό Neutrino με υποστήριξη DVR.
  HINT_RIPPS2_IGR_PAGE: Το μενού μέσα στο παιχνίδι, το RIPSHOT και η εμφάνιση των λήψεων.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Στιγμιότυπα από το μενού μέσα στο παιχνίδι, στο ART για τα θέματά σου ή στο MEDIA.
  RIPPS2_DEVELOP_SHOTS: Εμφάνιση λήψεων
  HINT_RIPPS2_DEVELOP_SHOTS: Πώς οι λήψεις που περιμένουν στο φιλμ κάθε παιχνιδιού γίνονται PNG.
  RIPPS2_SETTINGS_HOME: Αποθήκευση ρυθμίσεων σε
  HINT_RIPPS2_SETTINGS_HOME: 'Πού κρατά το RIPPS2 τις ρυθμίσεις του: στο δικό του αποθηκευμένο σε κάρτα μνήμης, σε φάκελο RIPPS2 σε μια μονάδα (τον εσωτερικό HDD, USB, MX4SIO, iLink ή MMCE) ή σε φάκελο που γράφεις.'
  RIPPS2_LAUNCHERS: Εκκινητές
  RIPPS2_LOOK_NOW: Αναζήτηση τώρα
  HINT_RIPPS2_LOOK_NOW: Το RIPPS2 ψάχνει στους ξεκινημένους δίσκους για το POPSTARTER, τα αρχεία POPS, το Ember, το BIOS του Ember και το Neutrino, και θυμάται πού είναι το καθένα. Κάθε εκκίνηση τα διαβάζει από εκεί.
  RIPPS2_HIDE_GAME: Απόκρυψη παιχνιδιού
  RIPPS2_HIDDEN_GAMES: Κρυμμένα παιχνίδια
  HINT_RIPPS2_HIDDEN_GAMES: Τα παιχνίδια που κρύφτηκαν με την Απόκρυψη παιχνιδιού, στους ξεκινημένους δίσκους. Δείξτε ένα ξανά, ή διαγράψτε το. Κάθε δίσκος κρατά τη δική του λίστα.
  HINT_RIPPS2_BDM_DEVICES: 'Οι μονάδες από τις οποίες το BDM διαβάζει παιχνίδια: USB, MX4SIO, PC Card CF, η μονάδα DVR ενός DESR και iLink. Ο εσωτερικός HDD ακολουθεί τη λειτουργία έναρξης HDD.'
  HINT_RIPPS2_SCREEN: 'Η εικόνα του μενού: λειτουργία βίντεο, ευρεία οθόνη, η θέση της στην τηλεόραση (H-POS, V-POS) και overscan.'
  HINT_RIPPS2_LAYOUT: Πού βρίσκονται οι κατηγορίες και πώς μπαίνει μια σελίδα, μετά τα εξώφυλλα του RIPFLOW και το πλέγμα του RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Πάχος κειμένου, το χρωματικό θέμα, η εναλλαγή χρωμάτων και κάθε χρώμα.
  HINT_RIPPS2_TEXT_WEIGHT: 'Πόσο έντονο είναι το κείμενο του ίδιου του RIPPS2: οι υποδείξεις των ρυθμίσεων, η ΚΑΤΑΣΤΑΣΗ και τα Σχετικά. Το Κανονικά είναι όπως πριν· τα Έντονα διαβάζονται καλύτερα σε μαλακή εικόνα. Οι δικές γραμματοσειρές ενός θέματος κρατούν τα πάχη που τους δίνει το θέμα.'
  HINT_RIPPS2_HDD_START: 'Ο εσωτερικός HDD, APA ή exFAT: το RIPPS2 τον διαβάζει ό,τι κι αν είναι και τον δείχνει μία φορά, ως Παιχνίδια HDD. Το Αυτόματα (το πιο γρήγορο με δίσκο μέσα) τον ξεκινά στην εκκίνηση· το Όχι τον αφήνει ήσυχο.'
  HINT_RIPPS2_THEME_COLOR: Το δικό χρώμα του θέματος. Επιλέξτε Προσαρμοσμένο ως χρωματικό θέμα για να το διαλέξετε μόνοι σας, όπως τα χρώματα του κειμένου.
  HINT_RIPPS2_SWEEP: Πέντε χρώματα από τα οποία περνά το θέμα, αργά και ομαλά. Ουράνιο τόξο, μια εναλλαγή από κάθε χρωματικό θέμα ή η δική σας. Το Ανενεργό κρατά το θέμα ακίνητο.
  HINT_RIPPS2_SWEEP_COLORS: Τα πέντε χρώματα της εναλλαγής και η ταχύτητά της. Αλλάξτε μία του RIPPS2 και κρατιέται ως δική σας, με το όνομα που της δίνετε.
  HINT_RIPPS2_SWEEP_NAME: Πώς λέγεται η εναλλαγή σας στη λίστα Εναλλαγή χρωμάτων.
  HINT_RIPPS2_SWEEP_COLOR: Ένα από τα πέντε χρώματα από τα οποία περνά η εναλλαγή, με τη σειρά.
  HINT_RIPPS2_SWEEP_SPEED: 'Πόσο διαρκεί κάθε χρώμα πριν εμφανιστεί το επόμενο. Ακόμη και τα Ζωηρά μένουν ομαλά: τα χρώματα δεν αναβοσβήνουν ποτέ.'
  RIPPS2_HIDE_COMPRESS: Απόκρυψη παιχνιδιού και συμπίεση
  HINT_RIPPS2_SELECT_HOLD: 'SELECT πατημένο 4.2 s σε λίστα παιχνιδιών. Λίστα: τα θέματα σε ένα πλαίσιο, διαλέξτε ένα. Εναλλαγή: το επόμενο θέμα. Ανενεργό: τίποτα (ένα πάτημα ανανεώνει ακόμα).'
  RIPPS2_RECENT_GAMES: Πρόσφατα παιχνίδια
  RIPPS2_SET_METADATA_RENAME: Ορισμός μεταδεδομένων (μετονομασία)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Πρώτα το χειριστήριο (πειραματικό)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'Το SD2PSX διαβάζει μέσω του διαύλου που μοιράζεται με το χειριστήριο, και όσο διαρκεί μια ανάγνωση το χειριστήριο δεν ακούγεται: τα πατήματα καθυστερούν ή χάνονται όσο φορτώνουν τα εξώφυλλα. Ναι: τα εξώφυλλα έρχονται σε μικρά κομμάτια με το χειριστήριο να διαβάζεται ανάμεσα, λίγο πιο αργά. Όχι: όσο γρήγορα πάει η κάρτα. Με τις πηγές της κάρτας σε Αυτόματα, η λίστα της φορτώνει μία φορά, στην εκκίνηση.'
  HINT_RIPPS2_TRUST_CACHE: 'Μια λίστα που φαίνεται από την κρυφή μνήμη μένει όπως είναι, έτοιμη για εκκίνηση, μέχρι να πατήσετε SELECT ή να αλλάξει το ίδιο το RIPPS2 αυτή την πηγή. Όχι: κάθε πηγή διαβάζεται ξανά στο παρασκήνιο αφού φανεί η κρυφή μνήμη της, μια παύση που νιώθετε σε κάρτα MMCE ή MX4SIO, που μοιράζονται τον δίαυλο του χειριστηρίου.'
  RIPPS2_STATUS_OPEN: Φόρτωση και δίσκοι
  HINT_RIPPS2_STATUS_OPEN: 'Ανοίγει την ΚΑΤΑΣΤΑΣΗ: από πού διαβάζει η εκκίνηση τις ρυθμίσεις και τις λίστες παιχνιδιών, ποιο μέρος είναι το πιο γρήγορο, πού πηγαίνει το EXIT ενός παιχνιδιού, και κάθε δίσκο. Οι ΡΥΘΜΙΣΕΙΣ ΚΡΥΦΗΣ ΜΝΗΜΗΣ εκεί φέρνουν πίσω εδώ.'
  RIPPS2_BADGE_SET: Σετ σημάτων
  HINT_RIPPS2_BADGE_SET: 'Τα σήματα στη σελίδα πληροφοριών ενός παιχνιδιού (διαβάθμιση, παίκτες, ESRB, λειτουργία βίντεο, σάρωση, αναλογία). RIPPS2: το δικό του σετ, ίδιο σε κάθε θέμα. Θέμα: οι εικόνες του θέματος, ή του RIPPS2 όταν το θέμα τις ζητά.'
  RIPPS2_HINT_FADE: Σταδιακή εμφάνιση υποδείξεων και συμβόλων
  HINT_RIPPS2_HINT_FADE: 'Μια υπόδειξη κουμπιού ή ένα σύμβολο που αλλάζει εμφανίζεται σταδιακά, όπως τα εξώφυλλα, τη στιγμή που αλλάζει· όσα μένουν δεν αγγίζονται, σε κάθε σελίδα και μήνυμα. Όχι: απλώς εμφανίζονται. Θέμα: αποφασίζει το θέμα (ενεργό, εκτός αν λέει hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Στυλ πλαϊνής μπάρας
  HINT_RIPPS2_SIDEBAR_STYLE: 'Κλασικό (χωριστό): τα εικονίδια στη σκούρα λωρίδα της πλαϊνής μπάρας με τη χρωματιστή ταινία δίπλα. XL (ενιαίο): μία φαρδύτερη λωρίδα με τα εικονίδια στη μέση. Θέμα: αποφασίζει το θέμα.'
  HINT_EXITPATH: 'Πού οδηγεί το EXIT στο μενού μέσα στο παιχνίδι. Καλύτερα κενό: το EXIT οδηγεί στον browser, που ξεκινά τον boot loader σου (FreeMcBoot, PS2BBL, OSDMenu ή BIBLE) όταν υπάρχει εγκατεστημένος, και ξανά το RIPPS2 με ενεργό BOOT LOCK, όπως στο άναμμα· χωρίς κανέναν, τον browser του PS2. Ένα ELF που γράφεται εδώ χρησιμοποιείται μόνο όταν η επαναφορά μπορεί να το φορτώσει (σε κάρτα μνήμης ή σε μονάδα USB FAT32) και δεν είναι το ίδιο το RIPPS2· οτιδήποτε άλλο οδηγεί στον browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO και ο exFAT HDD. Το Αυτόματα τους ξεκινά στην εκκίνηση: το πιο γρήγορο για τους δίσκους που έχετε συνδέσει, με τα παιχνίδια τους στο Όλα τα παιχνίδια από την αρχή. Το Μη αυτόματα τους ξεκινά όταν ανοίγετε τη σελίδα τους.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Το Neutrino δεν μπορεί να χρησιμοποιήσει VMC στον APA HDD (exFAT, USB και MX4SIO μπορούν): αυτό το παιχνίδι ξεκινά με την πραγματική κάρτα σε εκείνη την υποδοχή.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Η εκκίνηση διαβάζει μόνο τη μονάδα του RIPPS2: τις ρυθμίσεις και τους ήχους δίπλα στο RIPPS2.ELF (το RIPPS2.FB εκεί λέει πού) και κάθε λίστα από την προσωρινή μνήμη της. Οι άλλες μονάδες περιμένουν: το SELECT σε μια σελίδα ξεκινά τις μονάδες της και φέρνει τις εικόνες τους (με την αυτόματη ανανέωση ξεκινούν στην εκκίνηση). Η ενεργοποίηση αντιγράφει τους ήχους σου, και τη μουσική αν υπάρχει χώρος, στο AUDIO δίπλα στο RIPPS2.'
  RIPPS2_ART_PACK: Πακέτο ART
  RIPPS2_ART_PACK_BUILD: Δημιουργία ή αφαίρεση
  HINT_RIPPS2_ART_PACK: Βάζει τον φάκελο ART κάθε μονάδας που ξεκίνησε σε ένα art.tar στη μονάδα που διαλέγεις (η πιο γρήγορη προτείνεται πρώτη). Τα εξώφυλλα φορτώνονται τότε από ένα αρχείο με ένα ευρετήριο, ποτέ με αναζήτηση ανά παιχνίδι, ώστε τα μενού και η μουσική να μένουν ομαλά. Οι φάκελοι ART μένουν όπως είναι.
  RIPPS2_LIST_CFG_TEXT: Τίτλος και περιγραφή στη λίστα
  HINT_RIPPS2_LIST_CFG_TEXT: 'Ο τίτλος και η περιγραφή του παιχνιδιού από το CFG του δίπλα στη λίστα. Θέμα: όπως τα δείχνει το θέμα (το θέμα του RIPPS2 τα παραλείπει). Η σελίδα πληροφοριών τα κρατά πάντα.'
  RIPPS2_PS1_PREFER: Διπλότυπα PS1
  HINT_RIPPS2_PS1_PREFER: 'Ένα παιχνίδι PS1 που είναι και VCD του POPSTARTER και εικόνα του Ember. Και τα δύο: δύο γραμμές. Ember: μόνο του Ember. POPSTARTER: μόνο το VCD. Ο ίδιος τίτλος, χωρίς ID δίσκου μπροστά, είναι το ίδιο παιχνίδι.'
  RIPPS2_MY_PADS: Τα χειριστήριά μου
  HINT_RIPPS2_MY_PADS: 'Τα προφίλ .pad στον φάκελο PADS δίπλα στο RIPPS2: ένα αρχείο κειμένου ανά χειριστήριο USB, με όνομα το ID του (2563_0575.pad), και το καθένα ελεγμένο. Ένα χειριστήριο με προφίλ οδηγεί το μενού και παίζει στα παιχνίδια (Pad Emulator ενεργό).'
  RIPPS2_PAD_SETUP: Ρύθμιση χειριστηρίου USB
  HINT_RIPPS2_PAD_SETUP: Σύνδεσε ένα χειριστήριο USB που δεν γνωρίζει το RIPPS2, πάτησε κάθε κουμπί που ζητά, και το RIPPS2 γράφει το .pad του στο PADS. Το SELECT στο χειριστήριο PS2 παραλείπει ένα κουμπί.
