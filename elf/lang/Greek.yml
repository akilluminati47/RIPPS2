  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Συγχώνευση του νέου πακέτου σε άλλο .tar; Μετά διαλέγεις το .tar που κρατιέται και ενημερώνεται· οι εικόνες του νέου πακέτου μπαίνουν σε αυτό.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Συγχωνεύτηκε: το %s έχει τώρα %d εικόνες (%d MB), %d δ.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Εικόνες που μπαίνουν: %d (%s). Ίδιο όνομα και στα δύο: %d (κερδίζει αυτό που συγχωνεύεται).'
  'Reading the archives: %s': 'Ανάγνωση των αρχείων: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Διακοπή; Το .tar που κρατιέται μένει όπως ήταν· το ημιτελές αντίγραφο αφαιρείται.
  Stopped. %s is as it was; the unfinished copy was removed.: Διακόπηκε. Το %s είναι όπως ήταν· το ημιτελές αντίγραφο αφαιρέθηκε.
  The kept .tar is only replaced once the merged copy is whole.: Το .tar που κρατιέται αντικαθίσταται μόνο όταν το συγχωνευμένο αντίγραφο είναι ολόκληρο.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Η συγχώνευση δεν γράφτηκε στον δίσκο του %s (υπάρχει χώρος;). Είναι όπως ήταν· τίποτε άλλο δεν άλλαξε.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : Η συγχώνευση χρειάζεται περίπου %s ελεύθερα στον δίσκο του %s (το νέο αρχείο γράφεται πρώτα δίπλα στο παλιό). Ελευθέρωσε λίγο χώρο και δοκίμασε ξανά.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Η συγχώνευση σταμάτησε ανάμεσα σε δύο μετονομασίες: το .tar που κρατιέται είναι το %s και το συγχωνευμένο το %s. Δώσε τους πίσω τα ονόματα με τα Αρχεία μνήμης.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : Το συγχωνευμένο .tar γράφτηκε αλλά δεν πήρε το όνομα %s (μια MMCE μετονομάζει από το firmware 1.4.0 και μετά). Το νέο αρχείο αφαιρέθηκε· το .tar που κρατιέται είναι όπως ήταν.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : Δεν υπάρχει άλλο .tar για συγχώνευση στο %s. Βάλ' το σε αυτόν τον φάκελο, στον φάκελο ART ενός δίσκου ή στη ρίζα ενός δίσκου και δοκίμασε ξανά.
