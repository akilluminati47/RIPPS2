  Where POPSTARTER and Ember are, and how PS1 games start.: Πού είναι το POPSTARTER και το Ember, και πώς ξεκινούν τα παιχνίδια PS1.
  ? Writes what RIPPS2 noted about the pads, the drives, MMCE cards and the last launches to DIAG.TXT beside RIPPS2. Send it with a bug report.
  : Γράφει όσα σημείωσε το RIPPS2 για τα χειριστήρια, τους δίσκους, τις κάρτες MMCE και τις τελευταίες εκκινήσεις στο DIAG.TXT δίπλα στο RIPPS2. Στείλτε το με μια αναφορά σφάλματος.
  back to Cache: πίσω στην Κρυφή μνήμη
  what boot reads first: τι διαβάζει πρώτα η εκκίνηση
  ', the sounds': ', οι ήχοι'
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Το Fast Boot είναι ενεργό. Το RIPPS2 ξεκινά από τη δική του μονάδα (%s): οι ρυθμίσεις%s και κάθε λίστα από την προσωρινή μνήμη της. Οι άλλες μονάδες ξεκινούν όταν πατάς SELECT στη σελίδα τους ή ξεκινάς κάποιο από τα παιχνίδια τους.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Το Fast Boot είναι ενεργό. Οι ήχοι πιάνουν %d KB και η κάρτα μνήμης από την οποία τρέχει το RIPPS2 έχει %d KB ελεύθερα, οπότε μένουν στο %s.
  ' (%d KB free)': ' (%d KB ελεύθερα)'
  ' (%u MB free)': ' (%u MB ελεύθερα)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'ΔΙΠΛΑ ΣΤΟ RIPPS2: %sAUDIO%s, διαβάζεται πρώτο στην εκκίνηση'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- Η κονσόλα δένει το PS2BBL σε αυτή την κάρτα και το γράφει ως %s/%s.
  
    - Οι ρυθμίσεις του, mc%d:/SYS-CONF/PS2BBL.INI, ξεκινούν το RIPPS2 εκεί που βρίσκεται (%s) χωρίς αναμονή (0 ms, που το PS2BBL Extended δεν επιτρέπει), BOOT LOCK ενεργό. Το ίδιο το RIPPS2 δεν αντιγράφεται.
  
    Ο επεξεργαστής εισόδου/εξόδου επανεκκινείται γι'' αυτό και κάθε ανάγνωση μονάδων σταματά μέχρι να τελειώσει· η μουσική και οι μονάδες επιστρέφουν μετά. Άφησε την κάρτα μέσα και την κονσόλα ανοιχτή μέχρι να πει ότι τελείωσε.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Μια κάρτα SD2PSX ή MMCE μπορεί να προστατευτεί μετά από μια εγγραφή που απορρίφθηκε: αν τώρα λείπει η κάρτα μνήμης ή η μονάδα MMCE, σβήσε και άναψε την κονσόλα.'
  BOOT LOCK ON: BOOT LOCK ΕΝΕΡΓΟ
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Έγινε: η κάρτα μνήμης στην υποδοχή %d ξεκινά ό,τι ξεκινούσε πριν από το BIBLE. Το BIBLE φυλάσσεται στο mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): ΚΑΡΤΑ ΜΝΗΜΗΣ ΣΤΗΝ ΥΠΟΔΟΧΗ %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : Το PS2BBL δεν μπορεί να ξεκινήσει το RIPPS2 από εκεί που είναι τώρα (φτάνει σε κάρτες μνήμης, μονάδες USB και MX4SIO), και το RIPPS2 δεν αντιγράφει τον εαυτό του. Βάλε το RIPPS2.ELF σε κάρτα μνήμης ή μονάδα USB και ξεκίνα το από εκεί, ή χρησιμοποίησε το PS2BBL Extended, που διαβάζει MMCE και τον σκληρό δίσκο.
  RESTORE SLOT %d'S OLD BOOT LOADER: ΕΠΑΝΑΦΟΡΑ ΤΟΥ ΠΑΛΙΟΥ ΦΟΡΤΩΤΗ ΣΤΗΝ ΥΠΟΔΟΧΗ %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: το BIBLE στήθηκε στην κάρτα μνήμης της υποδοχής %d (mc%d:/%s/%s), BOOT LOCK ενεργό: στην εκκίνηση ξεκινά αμέσως το RIPPS2 από %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: στήσιμο του BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: στήσιμο του BIBLE
  
    Το RIPPS2 τρέχει από %s, που το PS2BBL δεν μπορεί να διαβάσει (διαβάζει κάρτες μνήμης, USB και MX4SIO), και το RIPPS2 δεν αντιγράφει τον εαυτό του. Οι ρυθμίσεις PS2BBL Extended αυτής της κάρτας (%s) το διαβάζουν: το START ενεργοποιεί το BOOT LOCK, ώστε στην εκκίνηση να ξεκινά το RIPPS2 από %s. Τίποτε άλλο στην κάρτα δεν αλλάζει.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: στήσιμο του BIBLE
  
    Το RIPPS2 τρέχει από %s, που το PS2BBL δεν μπορεί να διαβάσει: ξεκινά προγράμματα από κάρτα μνήμης, μονάδα USB ή MX4SIO, και το RIPPS2 δεν αντιγράφει τον εαυτό του. Βάλε το RIPPS2.ELF σε ένα από αυτά (στον φάκελο APPS μιας κάρτας μνήμης ή σε μονάδα USB), ξεκίνα το από εκεί και μετά στήσε ξανά το BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: στήσιμο του BIBLE
  
    Η κάρτα μνήμης στην υποδοχή %d: το BIBLE (mc%d:/%s) μπαίνει στην άκρη και ό,τι αντικατέστησε (mc%d:/%s) γυρίζει στη θέση του. Τίποτα δεν διαγράφεται. Οι ρυθμίσεις PS2BBL μένουν ως έχουν (το BOOT LOCK μπορεί να κλείσει το κλείδωμα).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: στήσιμο του BIBLE (δέσιμο του PS2BBL στην κάρτα μνήμης)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: στήσιμο του BIBLE (επαναφορά ό,τι υπήρχε)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: στήσιμο του BIBLE (επανεκκίνηση του επεξεργαστή εισόδου/εξόδου)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: στήσιμο του BIBLE (εγγραφή στην κάρτα μνήμης)'
  SET UP BIBLE: ΣΤΗΣΙΜΟ BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Η κάρτα μνήμης στην υποδοχή %d έχει %d KB ελεύθερα και το BIBLE χρειάζεται εκεί %d KB. Ελευθέρωσε λίγο χώρο και δοκίμασε ξανά.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Η κάρτα μνήμης στην υποδοχή %d απέρριψε το PS2BBL, οπότε το RIPPS2 άφησε την κάρτα όπως ήταν. Έλεγξε τον ελεύθερο χώρο και δοκίμασε ξανά. (Το DIAG.TXT δίπλα στο RIPPS2 έχει την απάντηση της κάρτας.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Η κάρτα μνήμης στην υποδοχή %d δεν έβαλε στην άκρη το BIBLE, οπότε δεν άλλαξε τίποτα. (Το DIAG.TXT δίπλα στο RIPPS2 έχει την απάντηση της κάρτας.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Η κάρτα μνήμης στην υποδοχή %d δεν δέχτηκε πίσω το %s, οπότε το BIBLE έμεινε. (Το DIAG.TXT δίπλα στο RIPPS2 έχει την απάντηση της κάρτας.)
  MUSIC: ΜΟΥΣΙΚΗ
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': 'Το %s%s δεν έχει %s. Το RIPPOPS βρήκε τον εξομοιωτή PS1 της Sony στο %s: το START αντιγράφει εδώ το %s και ξεκινά το παιχνίδι.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'Το RIPPS2 δεν βλέπει %s στο %s%s. Το POPSTARTER χρειάζεται POPS_IOX.PAK με POPS.PAK, ή με POPS.ELF και IOPRP252.IMG: τον εξομοιωτή PS1 της Sony, από τη δική σου κονσόλα. Μπορεί να τα βρει εκεί που το RIPPS2 δεν ψάχνει (αν τα παιχνίδια σου ξεκινούν, τα βρίσκει). Το START ξεκινά και γι'' αυτή τη μονάδα δεν θα ξαναρωτήσει.'
  ' (The configs found were set: %s.)': ' (Οι ρυθμίσεις που βρέθηκαν ορίστηκαν: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Αποθηκεύστε μία φορά τις ρυθμίσεις του με τον δικό του διαμορφωτή και ενεργοποιήστε ξανά το BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : Το %s δεν μπορεί να ξεκινήσει το RIPPS2 από εκεί που βρίσκεται τώρα (%s), και το RIPPS2 δεν αντιγράφει τον εαυτό του. Βάλτε το RIPPS2.ELF σε κάρτα μνήμης ή σε δίσκο USB και ξεκινήστε το από εκεί.
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : Το BOOT LOCK δεν μπόρεσε να γράψει τις ρυθμίσεις του φορτωτή εκκίνησης. Ελέγξτε ότι η κάρτα μνήμης ή ο δίσκος δεν έχει προστασία εγγραφής και δοκιμάστε ξανά.
  BOOT LOCK found no boot loader config to change.: Το BOOT LOCK δεν βρήκε ρυθμίσεις φορτωτή εκκίνησης για αλλαγή.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: Το BOOT LOCK είναι ανενεργό. Ο φορτωτής εκκίνησής σας ξεκινά ό,τι ξεκινούσε πριν (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : Το BOOT LOCK είναι ενεργό. Το %s ξεκινά τώρα το RIPPS2 στο άναμμα (%s), και με κενό «Προορισμός Μετά Από IGR» το EXIT ενός παιχνιδιού επιστρέφει από τον ίδιο δρόμο. Κρατήστε ένα από τα κουμπιά του όσο ξεκινά η κονσόλα για να φτάσετε κάπου αλλού.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'Το BOOT LOCK έβαλε το RIPPS2 πρώτο στο μενού του OSDMenu (%s). Το OSDMenu δεν ξεκινά τίποτα μόνο του: επιλέξτε εκεί το RIPPS2, και το EXIT ενός παιχνιδιού επιστρέφει σε εκείνο το μενού. Για κονσόλα που ξεκινά αμέσως το RIPPS2, το BIBLE βάζει το PS2BBL σε κάρτα μνήμης (Φορτωτής εκκίνησης).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: Το BOOT LOCK λειτουργεί μέσω ενός φορτωτή εκκίνησης σε κάρτα μνήμης (PS2BBL, FMCB ή OSDMenu), και εδώ δεν υπάρχει κανένας.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Η κάρτα μνήμης στην υποδοχή %d ξεκινά στο άναμμα το %s, και το BOOT LOCK δεν βρήκε ρυθμίσεις του για αλλαγή (ψάχνει το %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Η κάρτα μνήμης στην υποδοχή %d ξεκινά στο άναμμα το %s, που το BOOT LOCK δεν μπορεί να ρυθμίσει: λειτουργεί μέσω PS2BBL, FMCB και OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Σε αυτή την κονσόλα υπάρχει φορτωτής εκκίνησης με το κλείδωμα του RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT παιχνιδιού: ο περιηγητής, μετά ο φορτωτής εκκίνησής σας (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'Σε χρήση: %s, %d εικόνες, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Μέτρηση του πόσο γρήγορα διαβάζει κάθε μονάδα τις εικόνες της: %s'
  'None: each picture is read from its own ART folder.': 'Κανένα: κάθε εικόνα διαβάζεται από τον δικό της φάκελο ART.'
  REMOVE the pack in %s (the ART folders stay as they are): ΑΦΑΙΡΕΣΗ του πακέτου στο %s (οι φάκελοι ART μένουν όπως είναι)
  Remove the ART Pack in %s? The ART folders stay as they are.: Να αφαιρεθεί το πακέτο ART στο %s; Οι φάκελοι ART μένουν όπως είναι.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Διακόπηκε. Το μισοτελειωμένο πακέτο αφαιρέθηκε και οι εικόνες φορτώνονται από τους φακέλους ART όπως πριν.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Το πακέτο ART δεν μπόρεσε να γραφτεί στο %s (υπάρχει χώρος σε αυτή τη μονάδα;). Τίποτε άλλο δεν άλλαξε: οι εικόνες φορτώνονται από τους φακέλους ART όπως πριν.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Το πακέτο ART στο %s αφαιρέθηκε. Οι εικόνες φορτώνονται ξανά από τους φακέλους ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Δεν υπάρχει φάκελος ART με εικόνες στις μονάδες που ξεκίνησαν. Ξεκίνα τις μονάδες όπου είναι οι εικόνες σου (SELECT στη σελίδα τους) και μετά γύρισε εδώ.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d εικόνες από %d φακέλους ART μπαίνουν σε ένα αρχείο, %s. Οι φάκελοι ART μένουν όπως είναι: το πακέτο είναι αντίγραφο. Μπορείς να αντιγράψεις το art.tar στον φάκελο ART άλλης μονάδας με το Memory Files, αλλά το πιο γρήγορο είναι να το φτιάξεις στη μονάδα από την οποία περιηγείσαι, γι'' αυτό η πιο γρήγορη μονάδα είναι πρώτη. Να φτιαχτεί τώρα;'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Το πακέτο ART είναι έτοιμο: %d εικόνες, %d MB, στο %s (%d s). Από τώρα οι εικόνες φορτώνονται από αυτό, και για τα %d παιχνίδια για τα οποία φτιάχτηκε ο φάκελος ART τους δεν ερωτάται ποτέ ξανά εικόνα προς εικόνα. Οι εικόνες που κατεβάζει ή τραβά το RIPPS2 εμφανίζονται αμέσως· όσες αντιγράφεις από υπολογιστή εμφανίζονται όταν ξαναφτιάξεις το πακέτο.'
  '%s free': '%s ελεύθερα'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: διαβάζει %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: διαβάζει %s/s, η πιο γρήγορη, %s'
