  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Ευχαριστούμε όσους δοκιμάζουν στο Discord και ανοίγουν issues στο GitHub:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'Το IGR Path %s δεν χρησιμοποιείται: μετά από παιχνίδι φορτώνει μόνο αρχείο σε κάρτα μνήμης ή USB, και ποτέ το ίδιο το RIPPS2'
  an issue is the best way to get RIPPS2 updated.: ένα issue είναι ο καλύτερος τρόπος να ενημερωθεί το RIPPS2.
