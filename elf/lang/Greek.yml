  : Το Fast Cache δείχνει την τελευταία λίστα παιχνιδιών κάθε δίσκου μόλις ο δίσκος απαντήσει· το Trust Cache την κρατά μέχρι να πατήσετε SELECT. Και τα δύο ενεργά, με τις ρυθμίσεις στην κάρτα μνήμης από την οποία ξεκινά το RIPPS2, δίνουν την πιο γρήγορη εκκίνηση.
