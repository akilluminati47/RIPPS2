  The red screen music (%s) is in %s as %s. Audio settings > Music lists it as Red Screen.: Η μουσική της κόκκινης οθόνης (%s) είναι στο %s ως %s. Οι Ρυθμίσεις ήχου > Μουσική τη δείχνουν ως Red Screen.
  ? RIPPS2 plays this console's red screen music, the disc warning's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : Το RIPPS2 παίζει τη μουσική της κόκκινης οθόνης αυτής της κονσόλας, το ατμοσφαιρικό κομμάτι της προειδοποίησης δίσκου (%d:%02d), από τις νότες του ίδιου του BIOS και τη γράφει ως WAV %s στο %s· καμία κάρτα μνήμης δεν τη χωράει. Ένα %s που υπάρχει ήδη εκεί αντικαθίσταται. Χρειάζεται ένα με δύο λεπτά.
  ? RIPPS2 plays this console's menu music (%d:%02d) and its red screen music (%d:%02d) from the BIOS's own notes and writes them as two WAVs, %s in all, to %s; no memory card has room for them. Files of those names already there are replaced. Each takes a minute or two.
  : Το RIPPS2 παίζει τη μουσική μενού αυτής της κονσόλας (%d:%02d) και τη μουσική της κόκκινης οθόνης της (%d:%02d) από τις νότες του ίδιου του BIOS και τις γράφει ως δύο WAV, συνολικά %s, στο %s· καμία κάρτα μνήμης δεν τις χωράει. Αρχεία με αυτά τα ονόματα που υπάρχουν ήδη εκεί αντικαθίστανται. Το καθένα χρειάζεται ένα με δύο λεπτά.
