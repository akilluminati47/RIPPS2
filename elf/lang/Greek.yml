  RetroAchievements, as xeRAbora had it at each game's last check: RetroAchievements, όπως τα είχε το xeRAbora στον τελευταίο έλεγχο κάθε παιχνιδιού
  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Τρέξτε τον πελάτη xeRAbora σε υπολογιστή στο ίδιο δίκτυο, συνδεδεμένο στον λογαριασμό σας RetroAchievements. Μετά, για παιχνίδι σε USB, MMCE, SMB ή HDD: ανοίξτε το μενού του παιχνιδιού (ΤΡΙΓΩΝΟ) και διαλέξτε ΕΛΕΓΧΟΣ ΥΠΟΣΤΗΡΙΞΗΣ ΠΑΙΧΝΙΔΙΟΥ. Ένα παρακολουθούμενο παιχνίδι παίρνει το σήμα RA· με την ΤΗΛΕΜΕΤΡΙΑ ενεργή, ξεκινήστε το και τα ξεκλειδώματα εμφανίζονται πάνω από το παιχνίδι. Για δίσκο στη θήκη, χρησιμοποιήστε ΕΛΕΓΧΟΣ ΔΙΣΚΟΥ, και μετά ΠΑΙΧΝΙΔΙ ΜΕ ΤΟΝ ΔΙΣΚΟ ΜΕ ΕΠΙΤΕΥΓΜΑΤΑ. Παιχνίδια που ξεκινούν μέσω Neutrino, POPSTARTER ή Ember δεν παρακολουθούνται ακόμα.'
