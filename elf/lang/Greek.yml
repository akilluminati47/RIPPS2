  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: Το RIPPS2 δεν ξέρει πού είναι ο φάκελός του, οπότε δεν υπάρχει πού να μπουν οι ήχοι.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : Το RIPPS2 παίζει τη μουσική μενού αυτής της κονσόλας, το ατμοσφαιρικό κομμάτι του περιηγητή της (%d:%02d), από τις νότες του ίδιου του BIOS και τη γράφει ως WAV %s στο %s· καμία κάρτα μνήμης δεν τη χωράει. Ένα %s που υπάρχει ήδη εκεί αντικαθίσταται. Χρειάζεται ένα με δύο λεπτά.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'Το RIPPS2 διαβάζει τους ήχους από το ίδιο το BIOS αυτής της κονσόλας και τους γράφει στο %s ως δικούς του ήχους: δρομέας, επιβεβαίωση, ακύρωση, σελίδες, κατηγορία, μηνύματα, δίσκος, σφάλμα, αποθήκευση, δίσκοι και τυχαίο, μαζί με τη μουσική εκκίνησης και έναρξης παιχνιδιού, παιγμένη από τις νότες του ίδιου του BIOS. Αρχεία με αυτά τα ονόματα που υπάρχουν ήδη εκεί αντικαθίστανται.'
  Reading this console's menu music: Ανάγνωση της μουσικής μενού αυτής της κονσόλας
  'Ripping this console''s menu music: %d%%': 'Εξαγωγή της μουσικής μενού αυτής της κονσόλας: %d%%'
