  'Ripping this console''s sounds: %s': 'Εξαγωγή των ήχων αυτής της κονσόλας: %s'
  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: Η μουσική μενού (%s) είναι στο %s ως %s. Οι Ρυθμίσεις ήχου > Μουσική τη δείχνουν ως Menu· παίζει όταν δεν έχει επιλεγεί άλλο κομμάτι.
  The menu music could not be written to %s (%s). Is the drive full?: Η μουσική μενού δεν γράφτηκε στο %s (%s). Είναι ο δίσκος γεμάτος;
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : 'Η μουσική μενού είναι WAV %s, και καμία κάρτα μνήμης δεν τη χωράει. Το RIPPS2 τρέχει εδώ από κάρτα μνήμης και δεν έχει ξεκινήσει δίσκος με φάκελο OPL: ξεκινήστε έναν στην Αποθήκευση και μετά εξαγάγετε εκεί τη μουσική.'
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: Η μουσική μενού αυτού του BIOS δεν είναι αυτή που ξέρει το RIPPS2. Δεν γράφτηκε τίποτα.
  This BIOS's sound bank is not the one RIPPS2 knows. Nothing was written.: Η τράπεζα ήχων αυτού του BIOS δεν είναι αυτή που ξέρει το RIPPS2. Δεν γράφτηκε τίποτα.
  ? This console's BIOS has no SNDIMAGE. Consoles from SCPH-30000 on carry one; the first models keep their sounds another way, which RIPPS2 does not read yet.
  : Το BIOS αυτής της κονσόλας δεν έχει SNDIMAGE. Οι κονσόλες από το SCPH-30000 και μετά έχουν· τα πρώτα μοντέλα κρατούν τους ήχους τους αλλιώς, κάτι που το RIPPS2 δεν διαβάζει ακόμα.
