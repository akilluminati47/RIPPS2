  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: Το BIBLE δεν μπόρεσε να αντιγράψει το RIPPS2 στο διαμέρισμα %s του HDD. Ελέγξτε τον ελεύθερο χώρο. Δεν άλλαξε τίποτε άλλο.
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : Το BIBLE δεν μπόρεσε να κρατήσει αντίγραφο του προγράμματος εκκίνησης του HDD, οπότε σταμάτησε πριν το αλλάξει. Το RIPPS2 αντιγράφηκε στον HDD· δεν άλλαξε τίποτε άλλο.
  BIBLE could not write its config (%s). The boot program was not changed.: Το BIBLE δεν μπόρεσε να γράψει τις ρυθμίσεις του (%s). Το πρόγραμμα εκκίνησης δεν άλλαξε.
  BIBLE could not write the HDD's boot program (step %d). %s: Το BIBLE δεν μπόρεσε να γράψει το πρόγραμμα εκκίνησης του HDD (βήμα %d). %s
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'Το BIBLE εγκαταστάθηκε στον εσωτερικό HDD και το BOOT LOCK είναι ενεργό: στο άναμμα η κονσόλα ξεκινά αμέσως το RIPPS2 από %s%s%s%s. Ρυθμίσεις: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : Το BIBLE είναι στην κάρτα μνήμης %d, αλλά οι ρυθμίσεις του (%s) δεν γράφτηκαν, οπότε ξεκινά τον περιηγητή. Ελευθερώστε λίγο χώρο και τρέξτε ξανά τη ΔΙΑΧΕΙΡΙΣΗ για να ολοκληρωθεί.
  BIBLE ran out of memory before it started. Nothing was changed.: Το BIBLE έμεινε από μνήμη πριν ξεκινήσει. Δεν άλλαξε τίποτα.
  BIBLE ran out of memory. Nothing on the memory card was changed.: Το BIBLE έμεινε από μνήμη. Δεν άλλαξε τίποτα στην κάρτα μνήμης.
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: αντιγραφή του RIPPS2 στο %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: φύλαξη του προγράμματος εκκίνησης του HDD'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: επαναφορά του προγράμματος εκκίνησης του HDD'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: εγγραφή του PS2BBL στην περιοχή εκκίνησης του HDD'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'ΕΓΚΑΤΑΣΤΑΣΗ BIBLE ΣΤΟΝ ΕΣΩΤΕΡΙΚΟ HDD

    - Το RIPPS2 αντιγράφεται στο %s.

    - Το πρόγραμμα εκκίνησης του HDD που είναι τώρα στο __mbr διαβάζεται και φυλάγεται στο %s/RIPPS2 (η ΕΠΑΝΑΦΟΡΑ το επιστρέφει).

    - Η έκδοση HDD του PS2BBL γράφεται στη θέση του, και η κονσόλα ρυθμίζεται να το ξεκινά στο άναμμα.

    - Οι ρυθμίσεις του (%s) ξεκινούν το RIPPS2 πρώτα από %s%s%s, BOOT LOCK ενεργό.

    Χρειάζεται κονσόλα που ξεκινά από τον HDD της (χοντρό PS2 με τον προσαρμογέα δικτύου). Κρατήστε την αναμμένη μέχρι να γράψει ολοκληρώθηκε.'
  INTERNAL HDD  (its boot area): ΕΣΩΤΕΡΙΚΟΣ HDD  (η περιοχή εκκίνησής του)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'ΕΠΙΣΤΡΟΦΗ ΤΟΥ ΠΑΛΙΟΥ ΠΡΟΓΡΑΜΜΑΤΟΣ ΕΚΚΙΝΗΣΗΣ ΤΟΥ HDD

    Αυτό που κράτησε το BIBLE (RIPPS2/MBR-BACKUP.KELF στον HDD) επιστρέφει στο __mbr, στη θέση του BIBLE. Το RIPPS2 και οι ρυθμίσεις PS2BBL μένουν εκεί που είναι.'
  RESTORE: ΕΠΑΝΑΦΟΡΑ
  RESTORE THE HDD'S OLD BOOT PROGRAM: ΕΠΑΝΑΦΟΡΑ ΤΟΥ ΠΑΛΙΟΥ ΠΡΟΓΡΑΜΜΑΤΟΣ ΕΚΚΙΝΗΣΗΣ ΤΟΥ HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : Το RIPPS2 δεν μπορεί να καταλάβει την περιοχή αυτής της κονσόλας από τη ROM της, οπότε δεν ξέρει ποιον φάκελο ενημέρωσης συστήματος διαβάζει. Το BIBLE δεν εγκαταστάθηκε.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : Το RIPPS2 δεν μπόρεσε να ανοίξει το διαμέρισμα __sysconf ή __common του HDD (σφάλμα %d), οπότε το BIBLE δεν έχει πού να κρατήσει εκεί το RIPPS2 και τις ρυθμίσεις του. Δεν άλλαξε τίποτα.
  RIPPS2 could not read the kept boot program. Nothing was changed.: Το RIPPS2 δεν μπόρεσε να διαβάσει το φυλαγμένο πρόγραμμα εκκίνησης. Δεν άλλαξε τίποτα.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: Το RIPPS2 δεν μπόρεσε να γράψει πίσω το πρόγραμμα εκκίνησης. Δοκιμάστε ξανά· το φυλαγμένο αντίγραφο έμεινε ανέγγιχτο.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'Το RIPPS2 ήταν απασχολημένο με ανάγνωση δίσκου και δεν μπόρεσε να επανεκκινήσει τον επεξεργαστή I/O. Δεν άλλαξε τίποτα: δοκιμάστε ξανά σε λίγο.'
  Reading the memory cards: Ανάγνωση των καρτών μνήμης
  The HDD partition BIBLE uses went away. Nothing was changed.: Το διαμέρισμα HDD που χρησιμοποιεί το BIBLE εξαφανίστηκε. Δεν άλλαξε τίποτα.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Το παλιό πρόγραμμα εκκίνησης του HDD επέστρεψε. Το BIBLE δεν ξεκινά πια από τον HDD.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Αυτό που υπήρχε φυλάγεται στο RIPPS2/MBR-BACKUP.KELF στον HDD: το ΦΟΡΤΩΤΗΣ ΕΚΚΙΝΗΣΗΣ > ΔΙΑΧΕΙΡΙΣΗ > ΕΠΑΝΑΦΟΡΑ το επιστρέφει.'
  The security module would not start on this console. Nothing on the memory card was changed.: Η μονάδα ασφαλείας δεν ξεκίνησε σε αυτή την κονσόλα. Δεν άλλαξε τίποτα στην κάρτα μνήμης.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Δεν υπάρχει διαμορφωμένη κάρτα μνήμης PS2 σε καμία υποδοχή, ούτε εσωτερικός HDD. Το BIBLE ζει σε κάρτα μνήμης ή στον HDD: βάλτε μια κάρτα και δοκιμάστε ξανά.'
  There is no kept boot program on this HDD. Nothing was changed.: Δεν υπάρχει φυλαγμένο πρόγραμμα εκκίνησης σε αυτόν τον HDD. Δεν άλλαξε τίποτα.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Αυτός ο HDD δεν έχει διαμέρισμα __sysconf, οπότε οι ρυθμίσεις του BIBLE πρέπει να πάνε σε κάρτα μνήμης (το PS2BBL διαβάζει πρώτα της κάρτας), και δεν υπάρχει κάρτα σε καμία υποδοχή. Βάλτε μία και δοκιμάστε ξανά.
