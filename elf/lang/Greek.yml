# RIPPS2 in Greek. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Greek
strings:
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: στήσιμο του BIBLE\nΗ κάρτα στην υποδοχή %d είναι κάρτα SD2PSX ή MMCE. Η κάρτα BOOT της μπορεί να κρατήσει το BIBLE στη θέση του PS2BBL που έχει (αυτό μετακινείται πρώτα στην άκρη, ολόκληρο), αν η κονσόλα δέσει το BIBLE σε αυτή. Αν το δέσιμο απορριφθεί, τίποτα δεν αλλάζει στην κάρτα, και η κάρτα μπορεί να σταματήσει να απαντά μέχρι να σβήσει και να ανάψει η κονσόλα. Το START δένει το BIBLE σε αυτή."
  "BIND BIBLE": "ΔΕΣΙΜΟ BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(Το DIAG.TXT δίπλα στο RIPPS2 έχει την απάντηση της κάρτας.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Για μια κοινή κάρτα μνήμης PS2 των 8 MB (κάρτα MagicGate, ή κάρτα BOOT SD2PSX ή MMCE): αυτή στην υποδοχή %d. Στην εκκίνηση το PS2BBL διαβάζει τις ρυθμίσεις της υποδοχής 1 πριν από αυτές της υποδοχής 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Η κονσόλα δεν έδεσε το BIBLE με την κάρτα μνήμης στην υποδοχή %d (το βήμα MagicGate απέτυχε). Δεν άλλαξε τίποτα στην κάρτα. Μια κάρτα που δεν είναι γνήσια ή συμβατή με MagicGate δεν μπορεί να κρατήσει ενημέρωση συστήματος."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Μια κάρτα SD2PSX ή MMCE μπορεί να σταματήσει να απαντά μετά από δέσιμο που απορρίφθηκε: αν τώρα λείπει η κάρτα μνήμης ή η μονάδα MMCE, σβήσε και άναψε την κονσόλα."
  "RIP THIS CONSOLE'S AUDIO": "ΕΞΑΓΩΓΗ ΤΟΥ ΗΧΟΥ ΑΥΤΗΣ ΤΗΣ ΚΟΝΣΟΛΑΣ"
  "sounds or music, from its BIOS": "ήχοι ή μουσική, από το BIOS της"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Ανοίγει τις Ρυθμίσεις ήχου στους Ήχους BIOS και τη Μουσική BIOS: εξάγετε τους ήχους αυτής της κονσόλας ή τη μουσική του μενού της στο AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Ήχος εκκίνησης Ναι (γρήγορα): %s στην κάρτα μνήμης, καθώς υψώνονται οι πυλώνες"
  "Boot sound On: %s on the memory card, as the pillars rise": "Ήχος εκκίνησης Ναι: %s στην κάρτα μνήμης, καθώς υψώνονται οι πυλώνες"
  "Boot sound On: %s, once its drive is up": "Ήχος εκκίνησης Ναι: %s, μόλις ο δίσκος του είναι έτοιμος"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "ΥΠΟΔΟΧΗ 0: %s\nΥΠΟΔΟΧΗ 1: %s\n%s\nRIPPS2: στήσιμο του BIBLE. Το PS2BBL του El Isra, στημένο από το RIPPS2 σε κοινή κάρτα μνήμης PS2 των 8 MB ή στον εσωτερικό σκληρό δίσκο: εκκίνηση σε 0 ms (το PS2BBL Extended δεν επιτρέπει 0), πρώτα το RIPPS2 από εκεί που είναι (δεν αντιγράφεται ποτέ), και ένα κουμπί πατημένο στην εκκίνηση οδηγεί ακόμα στον browser (TRIANGLE), σε δίσκο (START) και σε ό,τι υπήρχε πριν (CIRCLE). Να στηθεί, να επισκευαστεί ή να επανέλθει ό,τι αντικατέστησε;"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Αυτό το παιχνίδι ξεκινά μέσω Neutrino, και το RIPPS2 δεν βρήκε κανένα: ούτε στη διαδρομή των Ρυθμίσεων, ούτε στον δίσκο του παιχνιδιού, ούτε στις κάρτες μνήμης, ούτε σε κάποιον δίσκο που ξεκίνησε. Βάλτε το Neutrino του rickgaiser (github.com/rickgaiser/neutrino) σε φάκελο neutrino στον δίσκο του παιχνιδιού ή σε κάρτα μνήμης, ή στρέψτε την Εκκίνηση παιχνιδιών > Neutrino σε αυτό."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Πού είναι το Neutrino σας, η λειτουργία βίντεο και τα ορίσματα που παίρνει κάθε εκκίνηση με Neutrino. Κατεβάστε το Neutrino από το github.com/rickgaiser/neutrino και βάλτε το σε φάκελο neutrino σε δίσκο ή κάρτα μνήμης."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Αυτό το Neutrino είναι παλαιότερο από το 1.3, που δεν μπορεί να ξεκινήσει παιχνίδια από τον APA HDD. Στρέψτε την Εκκίνηση παιχνιδιών > Neutrino σε Neutrino 1.3 ή νεότερο."
  "with rickgaiser's Neutrino as its second game core,": "με το Neutrino του rickgaiser ως δεύτερο πυρήνα παιχνιδιών,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "ο δεύτερος πυρήνας παιχνιδιών, από τον δίσκο ή την κάρτα μνήμης σας (AFL-3.0)"
  "FILE NAME": "ΟΝΟΜΑ ΑΡΧΕΙΟΥ"
  "GAME LIST": "ΛΙΣΤΑ ΠΑΙΧΝΙΔΙΩΝ"
  "%s in %s": "%s στο %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Οι εγγραφές είναι απενεργοποιημένες, οπότε το RIPPS2 δεν μπορεί να αποθηκεύσει τα στοιχεία ενός παιχνιδιού ή να το μετονομάσει. Να ενεργοποιηθούν;"
  "BIBLE is built on El Isra's PS2BBL, its card and HDD builds signed for RIPPS2 (GPL-3)": "Το BIBLE βασίζεται στο PS2BBL του El Isra, με τις εκδόσεις για κάρτα και HDD υπογεγραμμένες για το RIPPS2 (GPL-3)"
  "START %s": "ΕΝΑΡΞΗ %s"
