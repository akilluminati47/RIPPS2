  ' A SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it was removed.': ' Αφαιρέθηκε ένα SYS-CONF/PS2BBL.INI που έγραψε η έκδοση 68 για έναν φορτωτή που δεν το διαβάζει ποτέ.'
  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' Μια κάρτα μνήμης εδώ έχει δικό της PS2BBL/CONFIG.INI, που το PS2BBL το διαβάζει πριν από αυτό του HDD: βγάλτε αυτή την κάρτα στο άναμμα, ή ξεκινήστε το RIPPS2 από την κάρτα και εγκαταστήστε ξανά.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' Κρατήστε το ΤΡΙΓΩΝΟ στο άναμμα για τον περιηγητή, το START για δίσκο.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' Κρατήστε το ΤΡΙΓΩΝΟ για τον περιηγητή, το START για δίσκο. Ρυθμίσεις: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' Το RIPPS2 μπορεί να εγκαταστήσει το BIBLE, το PS2BBL ρυθμισμένο να ξεκινά το RIPPS2, σε κάρτα μνήμης· ό,τι ξεκινά τώρα από αυτήν φυλάγεται σε φάκελο αντιγράφων ασφαλείας. Εγκατάσταση του BIBLE;'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' Το παλιό πρόγραμμα εκκίνησης του HDD φυλάχτηκε (ΔΙΑΧΕΙΡΙΣΗ > ΕΠΑΝΑΦΟΡΑ).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' Η κονσόλα δεν δέχτηκε τη ρύθμιση που ξεκινά τον HDD της στο άναμμα: ορίστε την με το βοηθητικό πρόγραμμα HDD, ή εγκαταστήστε ξανά.'
  ' What was there before is kept in mc%d:/%s%s.': ' Ό,τι υπήρχε πριν φυλάγεται στο mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' Οι δικές σας ρυθμίσεις PS2BBL κρατήθηκαν (%s), με το BOOT LOCK ορισμένο μέσα τους: τα κουμπιά τους είναι όπως τα ορίσατε.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' Οι δικές σας ρυθμίσεις PS2BBL κρατήθηκαν, με το BOOT LOCK ορισμένο μέσα τους.'
