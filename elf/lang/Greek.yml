  Starts every drive now (USB, the HDD, MMCE, MX4SIO and the network), so each one and its space shows here.: Ξεκινά τώρα κάθε δίσκο (USB, τον HDD, MMCE, MX4SIO και το δίκτυο), ώστε να φαίνεται εδώ ο καθένας και ο χώρος του.
  The IP and SMB share POPSTARTER uses for PS1 games over the network.: Η IP και ο κοινόχρηστος φάκελος SMB που χρησιμοποιεί το POPSTARTER για παιχνίδια PS1 μέσω δικτύου.
