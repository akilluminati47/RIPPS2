  "Auto (no button held)": "自動 (不按按鈕)"
  "BIBLE hands these to the program, in this order.": "BIBLE 依此順序傳給程式。"
  "BIBLE has no way to reach that drive. Choose a program on another one, or type the path.": "BIBLE 無法存取該磁碟機。請選擇其他磁碟機上的程式,或輸入路徑。"
  "BIBLE keeps this key from PS2BBL, but nothing in this build acts on it, so it changes nothing yet.": "BIBLE 保留了 PS2BBL 的這個鍵,但此版本沒有任何功能使用它,所以目前不起作用。"
  "BIBLE needs at least one path in its settings, or it starts in its rescue mode, so this one stays.": "BIBLE 的設定中至少需要一個路徑,否則會以救援模式啟動,因此保留此路徑。"
  "BIBLE's Settings": "BIBLE 設定"
  "BIBLE's credits": "BIBLE 製作人員"
  "BOOT LOCK holds this line. Turn BOOT LOCK off to change it.": "此行由 BOOT LOCK 保留。關閉 BOOT LOCK 後才能變更。"
  "Binds the BIBLE RIPPS2 carries to a memory card, writes it over the one there, or puts back what it replaced.": "將 RIPPS2 攜帶的 BIBLE 綁定到記憶卡,覆寫現有的,或還原被它取代的內容。"
  "Boot Sound": "開機音效"
  "CHOOSE A PROGRAM": "選擇程式"
  "CHOOSE AN ELF": "請選擇 ELF"
  "Choose a program from your drives, type a path, or pick one of BIBLE's commands. BIBLE tries the paths in order and starts the first it finds.": "從磁碟機選擇程式、輸入路徑或選擇 BIBLE 指令。BIBLE 依序嘗試路徑,並啟動找到的第一個。"
  "Follow Color Theme": "跟隨色彩主題"
  "How long BIBLE waits for a button before the Auto path. At 0 ms a button held from power on still works. A boot sound beside BIBLE is read first: about 2 s at 0 ms.": "BIBLE 在自動路徑前等待按鈕的時間。0 ms 時,開機起按住的按鈕仍然有效。BIBLE 旁的開機音效會先讀取: 0 ms 時約 2 s。"
  "Launch Keys": "啟動按鈕"
  "Launch Keys: %s": "啟動按鈕: %s"
  "On shows a disc's game ID on screen as it starts, for RetroGEM video mods.": "開啟後,啟動時在畫面上顯示光碟的遊戲 ID,供 RetroGEM 視訊改裝使用。"
  "On shows a program's game ID on screen as it starts, for RetroGEM video mods. It is up to 11 characters from the file name.": "開啟後,啟動時在畫面上顯示程式的遊戲 ID,供 RetroGEM 視訊改裝使用。取自檔名,最多 11 個字元。"
  "On stops the disc at a launch and waits for the drive to answer. Off skips that wait, about 3 s in the lab, and a disc in the tray keeps spinning.": "開啟時在啟動時停止光碟並等待光碟機回應。關閉時略過該等待 (實驗室約 3 s),托盤中的光碟繼續旋轉。"
  "Opens the file itself in the text editor, comments and all. Every change here keeps the other lines as they are.": "用文字編輯器開啟檔案本身,包括註解。這裡的每次變更都保留其他行不變。"
  "Path %d": "路徑 %d"
  "Shows the countdown, the clock and the console's details on the splash.": "在啟動畫面上顯示倒數、時鐘和主機資訊。"
  "Sky Color": "天空顏色"
  "TYPE A PATH": "輸入路徑"
  "The button pictures under the logo: none, the four face buttons, or all sixteen.": "標誌下方的按鈕圖片: 無、四個動作鍵或全部十六個。"
  "The console's browser": "主機瀏覽器"
  "The disc in the tray": "托盤中的光碟"
  "The disc, without the PS2 logo": "光碟,不顯示 PS2 標誌"
  "The name BIBLE's splash shows for this button.": "BIBLE 啟動畫面為此按鈕顯示的名稱。"
  "The same setting as in Audio. On (fast) keeps a copy on the memory card, so the sound starts with the first frame. Off is the fastest boot.": "與音訊中的設定相同。開(快速) 在記憶卡上保留副本,聲音隨第一格開始。關閉是最快的開機。"
  "The shape of BIBLE's splash. Auto follows RIPPS2's Widescreen when its settings are on a memory card.": "BIBLE 啟動畫面的形狀。自動在 RIPPS2 設定位於記憶卡時跟隨其寬螢幕設定。"
  "The signal BIBLE starts in. Auto uses RIPPS2's Video Mode when its settings are on a memory card, and the console's own mode when they are not.": "BIBLE 啟動時的訊號。自動在 RIPPS2 設定位於記憶卡時使用其視訊模式,否則使用主機本身的模式。"
  "The sky on BIBLE's splash. Follow Color Theme uses the sky RIPPS2 saves with its settings. A color named here stays, whatever the theme.": "BIBLE 啟動畫面的天空。跟隨色彩主題使用 RIPPS2 隨設定儲存的天空。這裡選擇的顏色不隨主題改變。"
  "This BIBLE (%s build) does not read this drive, so it moves on to the next path.": "此 BIBLE (%s 版本) 無法讀取此磁碟機,因此轉到下一個路徑。"
  "What BIBLE shows while it waits for a button: nothing, its logo, or its logo with the name of what each button starts.": "BIBLE 等待按鈕時顯示的內容: 無、標誌,或標誌加每個按鈕啟動內容的名稱。"
  "What BIBLE starts when no button is held at power on.": "開機時未按任何按鈕,BIBLE 啟動的內容。"
  "What BIBLE starts when this button is held at power on. L2 + R2 held at power on shows BIBLE's own page of them all.": "開機時按住此按鈕,BIBLE 啟動的內容。開機時按住 L2 + R2 可在 BIBLE 自己的頁面查看全部。"
  "What each button starts at power on, each with up to ten paths chosen from your drives.": "開機時每個按鈕啟動的內容,每個按鈕最多可從磁碟機選擇十個路徑。"
  "What stands behind BIBLE's logo. Auto shows the sky when Sky Color is set or RIPPS2's settings are on a memory card, and black when they are not.": "BIBLE 標誌背後的內容。自動在設定了天空顏色或 RIPPS2 設定位於記憶卡時顯示天空,否則顯示黑色。"
  "When a button starts a disc and the tray is empty, On opens the tray for you.": "按鈕啟動光碟而托盤為空時,開啟會為你打開托盤。"
  "Eject Tray at Launch": "啟動時退出托盤"
  "Read Console History": "讀取主機歷史記錄"
  "Game ID for Apps": "應用程式的遊戲 ID"
  "Game ID for Discs": "光碟的遊戲 ID"
  "File name (as it appears in your games list)": "檔案名稱 (顯示在遊戲清單中的名稱)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "此清單顯示其他磁碟機上的遊戲。請在遊戲所在磁碟機的頁面上重新命名。"
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "加星號的遊戲無法重新命名。請先取消星號 (R3)，重新命名後再加上星號。"
  "This drive cannot rename its files. The details can still be set.": "此磁碟機無法重新命名其檔案。仍可設定詳細資料。"
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "在 APA 硬碟上，PS2 遊戲的名稱存放在分割表中，因此無法在此重新命名。仍可設定其詳細資料。"
  "Renames the app in your list. Its ELF and its art keep their names.": "重新命名清單中的應用程式。其 ELF 與圖片的名稱不變。"
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "重新命名磁碟機上的遊戲。PS1 遊戲依名稱尋找圖片與設定，因此 RIPPS2 會一併重新命名。ART Pack 中的圖片需要重新建立套件。"
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "重新命名磁碟機上的遊戲檔案。PS2 遊戲依遊戲 ID 尋找圖片與設定，因此不會遺失任何內容。"
  "Stop Disc at Launch": "啟動時停止光碟"
  "EDIT BIBLE'S SETTINGS FILE": "編輯 BIBLE 的設定檔"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "無法寫入 BIBLE 的設定檔（%s）。請確認記憶卡已插好且有空間，然後再試一次。"
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "找不到 BIBLE 的設定檔（%s）。BIBLE：安裝、更新或還原 會寫入一個。"
  "Boot sound On (fast): %s, handed over by BIBLE": "開機音 開(快速):%s,由 BIBLE 移交"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE：akilluminati47 的 PS2BBL Extended 分支，每個版本都由 akilluminati47 簽署（GPL-3）"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "它的 IOPRP 映像把 BIBLE 綁定到你的記憶卡（GPL-3）：加密由主機完成，不需要金鑰"
  "KELFBinder by El Isra": "El Isra的 KELFBinder"
  "source: github.com/akilluminati47/BIBLE": "原始碼：github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "插槽 0：%s\n插槽 1：%s\n%s\nRIPPS2：正在設定 BIBLE。BIBLE（akilluminati47 以 El Isra 的 PS2BBL 為基礎製作的開機載入程式），由 RIPPS2 設定在標準 8 MB PS2 記憶卡或內建硬碟上：開機 0 ms 啟動 (PS2BBL Extended 不允許 0)，先從 RIPPS2 所在的位置啟動它 (從不複製)，開機時按住按鈕仍可進入瀏覽器 (TRIANGLE)、光碟 (START) 和原本的內容 (CIRCLE)。要設定、修復，還是還原被它取代的內容？"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2：正在設定 BIBLE\n插槽 %d 中的卡是 SD2PSX 或 MMCE 卡。如果主機把 BIBLE 綁定到這張卡，它的 BOOT 卡就能用 BIBLE 取代現有的 PS2BBL（現有的會先整個移到一旁）。如果綁定被拒絕，卡上不會有任何變更，但在主機關機再開機之前，這張卡可能不再回應。按 START 把 BIBLE 綁定到這張卡。"
  "BIND BIBLE": "綁定 BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(卡的回應在 RIPPS2 旁邊的 DIAG.TXT 裡。)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "適用於標準 8 MB PS2 記憶卡 (MagicGate 卡，或 SD2PSX、MMCE 的 BOOT 卡)：插槽 %d 中的那張。開機時 PS2BBL 先讀插槽 1 的設定，再讀插槽 0 的。\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "主機不肯把 BIBLE 綁定到插槽 %d 的記憶卡（MagicGate 步驟失敗）。記憶卡上沒有任何變更。非原廠或不相容 MagicGate 的記憶卡無法存放系統更新。"
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "SD2PSX 或 MMCE 卡在綁定被拒後可能不再回應：如果現在記憶卡或 MMCE 磁碟不見了，請關閉主機再開啟。"
  "RIP THIS CONSOLE'S AUDIO": "擷取這台主機的音訊"
  "sounds or music, from its BIOS": "音效或音樂，來自它的 BIOS"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "開啟音訊設定的 BIOS 聲音和 BIOS 音樂：把這台主機的音效或選單音樂擷取到 AUDIO。"
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "開機音 開(快速):記憶卡上的 %s,光柱升起時"
  "Boot sound On: %s on the memory card, as the pillars rise": "開機音 開:記憶卡上的 %s,光柱升起時"
  "Boot sound On: %s, once its drive is up": "開機音 開:%s,其磁碟就緒後"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "這個遊戲透過 Neutrino 啟動，但 RIPPS2 沒有找到：設定中的路徑、遊戲所在的磁碟、記憶卡和任何已啟動的磁碟上都沒有。請把 rickgaiser 的 Neutrino（github.com/rickgaiser/neutrino）放進遊戲所在磁碟或記憶卡上的 neutrino 資料夾，或在遊戲啟動 > Neutrino 中指向它。"
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "你的 Neutrino 的位置、影像模式，以及每次用 Neutrino 啟動時傳入的參數。 從 github.com/rickgaiser/neutrino 取得 Neutrino，放進磁碟或記憶卡上的 neutrino 資料夾。"
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "這個 Neutrino 早於 1.3，無法從 APA 硬碟啟動遊戲。請把遊戲啟動 > Neutrino 指向 Neutrino 1.3 或更新版本。"
  "with rickgaiser's Neutrino as its second game core,": "以 rickgaiser 的 Neutrino 作為第二個遊戲核心，"
  "the second game core, used from your drive or memory card (AFL-3.0)": "第二個遊戲核心，從你的磁碟或記憶卡使用（AFL-3.0）"
  "FILE NAME": "檔案名稱"
