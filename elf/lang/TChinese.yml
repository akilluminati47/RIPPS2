  '%d ITEM   %d MARKED   %s   %s FREE': '%d 項   已標記 %d   %s   可用 %s'
  '%d ITEMS   %d MARKED   %s': '%d 項   已標記 %d   %s'
  '%d ITEMS   %d MARKED   %s   %s FREE': '%d 項   已標記 %d   %s   可用 %s'
