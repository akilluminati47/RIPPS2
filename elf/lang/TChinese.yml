  This MMCE card cannot rename a file, which compression needs for its last step. Update its sd2psXtd firmware to 1.4.0 or newer (sd2psxtd.github.io/download), then try again. Nothing was changed.: 這張 MMCE 卡無法重新命名檔案，而壓縮的最後一步需要這樣做。請將其 sd2psXtd 韌體更新到 1.4.0 或更新版本（sd2psxtd.github.io/download），然後重試。未做任何變更。
