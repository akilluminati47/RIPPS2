# RIPPS2 in TChinese. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: TChinese
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE：安裝、更新或還原"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "更新 BIBLE：插槽 %d 中是舊版"
  "Background": "背景"
