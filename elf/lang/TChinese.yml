  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : 開(快速)把開機音放在啟動所用記憶卡上的 RIPPS2 旁,但 RIPPS2 並非從記憶卡啟動。開機音按「開」播放。
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 還沒有可複製的開機音:音訊設定 > BIOS 聲音可擷取本機的聲音。
  '%d COPIED OUT': 已複製出 %d
