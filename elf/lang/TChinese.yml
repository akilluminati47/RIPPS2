  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE 無法把 RIPPS2 複製到硬碟的 %s 分割區。請檢查可用空間。其他內容沒有變更。
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE 無法保留硬碟開機程式的副本，因此在變更它之前就停止了。RIPPS2 已複製到硬碟；其他內容沒有變更。
