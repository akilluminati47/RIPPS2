  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 原本的那個保存在硬碟上的 RIPPS2/MBR-BACKUP.KELF：開機程式 > 管理 > 還原 會把它放回。
