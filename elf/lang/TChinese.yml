  Down: 下
  Down on the d-pad: 方向鍵下
  Found %04X:%04X. Let go of everything on it, sticks too, and wait.: 找到 %04X:%04X。放開上面所有按鍵，包括類比搖桿，然後稍候。
  Got it. Let go.: 收到。放開。
