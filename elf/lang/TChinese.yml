  This is an ESR-patched PS2 game. Put ESR (esr*.elf) in APPS, BOOT or ESR on a memory card or USB drive to start it.: 這是打過 ESR 修補的 PS2 遊戲。請把 ESR（esr*.elf）放到記憶卡或隨身碟上的 APPS、BOOT 或 ESR 資料夾來啟動它。
