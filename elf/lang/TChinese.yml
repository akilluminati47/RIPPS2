  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : 遊戲內選單的 CHEATS 可在遊戲中逐一開關該遊戲的金手指。變更於 RESUME 時生效;關閉的金手指停止寫入,已寫入的保留。需為該遊戲開啟 Cheats。
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 遊戲內選單沒有 CHEATS:啟動前勾選的金手指照舊全程生效。
  BOOT SOUND WITH THE PILLARS: 開機音隨光柱響起
  'Boot Sound: On (fast)': 開機音:開(快速)
  'Boot sound On: from the AUDIO folder, once its drive is up': 開機音 開:來自 AUDIO 資料夾,其磁碟就緒後
  Boot sound off (Audio settings > Boot Sound): 開機音 關(音訊設定 > 開機音)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: 將 boot.adp 複製到啟動所用記憶卡上的 RIPPS2 旁,開機時先於任何磁碟讀取。
  '%s could not be written.': 無法寫入 %s。
  '%s is there already and could not be put aside, so it was left as it was.': '%s 已存在且無法移到一旁，所以維持原樣。'
