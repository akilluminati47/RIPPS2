  'All Games: no master list yet; %s is written once the games are listed (Fast Cache on)': 全部遊戲：尚無主清單；遊戲列出後會寫入 %s（Fast Cache 開啟）
  CACHE SETTINGS: 快取設定
  DIAG.TXT, for a bug report: DIAG.TXT，用於錯誤回報
  Drives, loading, launchers and homebrew: 磁碟機、載入、啟動器與自製程式
  ? Fast Cache shows each drive's last game list the moment the drive answers; Trust Cache keeps it until you press SELECT. Both on, with the settings on the memory card RIPPS2 starts from, is the quickest boot.
  : Fast Cache 在磁碟機回應的瞬間顯示其上次的遊戲清單；Trust Cache 會保留它，直到你按 SELECT。兩者都開啟，並把設定放在 RIPPS2 啟動所用的記憶卡上，就是最快的開機。
  Fast Cache, Trust Cache: Fast Cache、Trust Cache
  'Game lists: Fast Cache off, so each one is read from its drive at boot': 遊戲清單：Fast Cache 關閉，因此開機時各自從磁碟機讀取
  'Game lists: each shows at once from its cache and stands until SELECT': 遊戲清單：立即從快取顯示，保持到按 SELECT
  'Game lists: each shows at once from its cache, then is read again': 遊戲清單：立即從快取顯示，然後重新讀取
  LOADING: 載入
  'No music yet: Audio settings > BIOS Music rips this console''s menu music.': 還沒有音樂：音訊設定 > BIOS 音樂可擷取這台主機的選單音樂。
  SAVE DIAGNOSTICS: 儲存診斷資訊
  Searches the drives for POPSTARTER, the POPS files, Ember, Ember's BIOS and Neutrino, and remembers where each one is.: 在各磁碟機上尋找 POPSTARTER、POPS 檔案、Ember、Ember 的 BIOS 和 Neutrino，並記住各自的位置。
  'Settings: %s, on a drive the boot waits for (a memory card is quicker)': 設定：%s，在開機需要等待的磁碟機上（記憶卡較快）
  'Settings: %s, read first (the quickest place)': 設定：%s，最先讀取（最快的位置）
  Starts every drive now (USB, the HDD, MMCE, MX4SIO and the network), so each one and its space shows here.: 立即啟動每個磁碟機（USB、硬碟、MMCE、MX4SIO 與網路），讓每個磁碟機及其空間顯示在這裡。
  The IP and SMB share POPSTARTER uses for PS1 games over the network.: POPSTARTER 透過網路執行 PS1 遊戲所用的 IP 與 SMB 共用。
  The diagnostics are in %s.: 診斷資訊在 %s。
  The diagnostics could not be written to %s.: 無法把診斷資訊寫入 %s。
  What each memory card starts at power on; install or repair BIBLE, PS2BBL set up to start RIPPS2.: 每張記憶卡開機時啟動的內容；安裝或修復 BIBLE，即設定為啟動 RIPPS2 的 PS2BBL。
  Where POPSTARTER and Ember are, and how PS1 games start.: POPSTARTER 與 Ember 的位置，以及 PS1 遊戲的啟動方式。
  ? Writes what RIPPS2 noted about the pads, the drives, MMCE cards and the last launches to DIAG.TXT beside RIPPS2. Send it with a bug report.
  : 把 RIPPS2 記下的關於控制器、磁碟機、MMCE 卡和最近幾次啟動的資訊寫入 RIPPS2 旁的 DIAG.TXT。請隨錯誤回報一起傳送。
  back to Cache: 返回快取
  what boot reads first: 開機最先讀取的內容
  ', the sounds': 、音效
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : Fast Boot 已開啟。RIPPS2 從自己的磁碟 (%s) 啟動：設定%s 和每個清單都從快取讀取。其他磁碟要等你在其頁面按 SELECT 或啟動其中的遊戲時才啟動。
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot 已開啟。音效需要 %d KB，而 RIPPS2 所在的記憶卡只剩 %d KB，所以音效留在 %s。
  ' (%d KB free)': ' (剩餘 %d KB)'
  ' (%u MB free)': ' (剩餘 %u MB)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': RIPPS2 旁邊：%sAUDIO%s，啟動時最先讀取
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- 主機把 PS2BBL 綁定到這張卡，寫為 %s/%s。
  
    - 它的設定 mc%d:/SYS-CONF/PS2BBL.INI 從 RIPPS2 目前的位置 (%s) 無等待啟動它 (0 ms，PS2BBL Extended 不允許)，BOOT LOCK 開啟。RIPPS2 本身不會被複製。
  
    為此 I/O 處理器會重新啟動，所有磁碟讀取會暫停直到完成；音樂和磁碟隨後恢復。在提示完成之前，請保持卡插著、主機開著。'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : SD2PSX 或 MMCE 卡在寫入被拒後可能會自我保護：如果現在記憶卡或 MMCE 磁碟不見了，請關閉主機再開啟。
  BOOT LOCK ON: BOOT LOCK 開啟
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 完成：插槽 %d 的記憶卡會啟動 BIBLE 之前啟動的內容。BIBLE 保留在 mc%d:/%s。
  MEMORY CARD IN SLOT %d  (%s): 插槽 %d 的記憶卡  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL 無法從 RIPPS2 目前的位置啟動它 (它只能存取記憶卡、USB 磁碟和 MX4SIO)，而 RIPPS2 不會複製自己。請把 RIPPS2.ELF 放到記憶卡或 USB 磁碟上並從那裡啟動，或使用能讀取 MMCE 和硬碟的 PS2BBL Extended。
  RESTORE SLOT %d'S OLD BOOT LOADER: 還原插槽 %d 原本的開機程式
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : RIPPS2：BIBLE 已設定在插槽 %d 的記憶卡上 (mc%d:/%s/%s)，BOOT LOCK 開啟：開機時立即從 %s 啟動 RIPPS2。
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2：正在設定 BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2：正在設定 BIBLE
  
    RIPPS2 正從 %s 執行，而 PS2BBL 讀不了那裡 (它讀取記憶卡、USB 和 MX4SIO)，RIPPS2 也不會複製自己。這張卡上的 PS2BBL Extended 設定 (%s) 可以讀取：START 會開啟 BOOT LOCK，讓它在開機時從 %s 啟動 RIPPS2。卡上的其他內容不變。'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2：正在設定 BIBLE
  
    RIPPS2 正從 %s 執行，而 PS2BBL 讀不了那裡：它只從記憶卡、USB 磁碟或 MX4SIO 啟動程式，RIPPS2 也不會複製自己。請把 RIPPS2.ELF 放到其中之一 (記憶卡的 APPS 資料夾或 USB 磁碟)，從那裡啟動，然後再設定一次 BIBLE。'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2：正在設定 BIBLE
  
    插槽 %d 的記憶卡：BIBLE (mc%d:/%s) 會移到一旁，它取代的內容 (mc%d:/%s) 回到原位。不會刪除任何東西。PS2BBL 設定保持不變 (BOOT LOCK 可以關閉鎖定)。'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': RIPPS2：正在設定 BIBLE (正在把 PS2BBL 綁定到記憶卡)
  'RIPPS2: Setting up BIBLE (putting back what was there)': RIPPS2：正在設定 BIBLE (正在放回原本的內容)
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': RIPPS2：正在設定 BIBLE (正在重新啟動 I/O 處理器)
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': RIPPS2：正在設定 BIBLE (正在寫入記憶卡)
  SET UP BIBLE: 設定 BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: 插槽 %d 的記憶卡剩餘 %d KB，而 BIBLE 需要 %d KB。請騰出一些空間後再試。
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : 插槽 %d 的記憶卡拒絕了 PS2BBL，所以 RIPPS2 讓卡保持原樣。請檢查剩餘空間後再試。(卡的回應在 RIPPS2 旁邊的 DIAG.TXT 裡。)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : 插槽 %d 的記憶卡沒能把 BIBLE 移開，所以沒有任何改動。(卡的回應在 RIPPS2 旁邊的 DIAG.TXT 裡。)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): 插槽 %d 的記憶卡沒能取回 %s，所以 BIBLE 保留了下來。(卡的回應在 RIPPS2 旁邊的 DIAG.TXT 裡。)
  MUSIC: 音樂
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s 裡沒有 %s。RIPPOPS 在 %s 找到了 Sony 的 PS1 模擬器：START 會把 %s 複製到這裡並啟動遊戲。'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : RIPPS2 沒有看到 %s (在 %s%s)。POPSTARTER 需要 POPS_IOX.PAK 加 POPS.PAK，或 POPS_IOX.PAK 加 POPS.ELF 和 IOPRP252.IMG：來自你自己主機的 Sony PS1 模擬器。它可能在 RIPPS2 不找的地方找到它們 (如果你的遊戲能啟動，就是找到了)。START 啟動，之後不會再詢問這個磁碟。
  ' (The configs found were set: %s.)': ' （找到的設定已設好：%s。）'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' 請先用它自己的設定工具儲存一次設定，再開啟 BOOT LOCK。'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s 無法從 RIPPS2 現在所在的位置（%s）啟動它，而 RIPPS2 不會複製自己。請把 RIPPS2.ELF 放到記憶卡或 USB 磁碟機上，再從那裡啟動。'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK 無法寫入開機程式的設定。請確認記憶卡或磁碟機沒有防寫，然後再試一次。
  BOOT LOCK found no boot loader config to change.: BOOT LOCK 找不到可變更的開機程式設定。
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK 已關閉。你的開機程式會啟動它以前啟動的內容（%s）。
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK 已開啟。%s 現在開機時啟動 RIPPS2（%s），IGR 位置留空時，遊戲的 EXIT 也會沿同一條路返回。主機啟動時按住它的任一按鍵可進入其他內容。%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : BOOT LOCK 已把 RIPPS2 放在 OSDMenu 選單的第一項（%s）。OSDMenu 自己不會啟動任何東西：請在那裡選擇 RIPPS2，遊戲的 EXIT 會回到那個選單。若要主機開機直接啟動 RIPPS2，BIBLE 會把 PS2BBL 裝到記憶卡上（開機程式）。
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK 透過記憶卡上的開機程式運作（PS2BBL、FMCB 或 OSDMenu），而這裡一個也沒有。
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: 插槽 %d 的記憶卡開機時啟動 %s，但 BOOT LOCK 找不到它可變更的設定（它會尋找 %s）。
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 插槽 %d 的記憶卡開機時啟動 %s，BOOT LOCK 無法設定它：BOOT LOCK 透過 PS2BBL、FMCB 和 OSDMenu 運作。
  A boot loader with RIPPS2's lock is on this console.: 這台主機上有帶 RIPPS2 鎖定的開機程式。
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 遊戲的 EXIT：瀏覽器，然後是你的開機程式（BOOT LOCK）
  'In use: %s, %d pictures, %d MB': 使用中：%s，%d 張圖片，%d MB
  'Measuring how fast each drive reads its art: %s': 正在測量每個磁碟讀取圖片的速度：%s
  'None: each picture is read from its own ART folder.': 無：每張圖片都從它自己的 ART 資料夾讀取。
  REMOVE the pack in %s (the ART folders stay as they are): 刪除 %s 中的包（ART 資料夾保持原樣）
  Remove the ART Pack in %s? The ART folders stay as they are.: 要刪除 %s 中的 ART 包嗎？ART 資料夾保持原樣。
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: 已停止。未完成的包已刪除，圖片照舊從 ART 資料夾讀取。
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 無法把 ART 包寫入 %s（該磁碟還有空間嗎？）。其他沒有任何改變：圖片照舊從 ART 資料夾讀取。
  The ART Pack in %s is removed. Art loads from the ART folders again.: '%s 中的 ART 包已刪除。圖片重新從 ART 資料夾讀取。'
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : 已啟動的磁碟上沒有含圖片的 ART 資料夾。請先啟動存放圖片的磁碟（在其頁面按 SELECT），然後再回來。
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d 張圖片（來自 %d 個 ART 資料夾）將放進一個檔案 %s。ART 資料夾保持原樣：包只是副本。你可以用 Memory Files 把 art.tar 複製到其他磁碟的 ART 資料夾，但在你平常瀏覽的磁碟上建立最快，所以最快的磁碟排在最前面。現在建立嗎？'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : ART 包已建立：%d 張圖片，%d MB，位於 %s（%d 秒）。今後圖片從包中讀取，它所對應的 %d 款遊戲再也不會逐張查詢各自的 ART 資料夾。RIPPS2 下載或拍下的圖片會立即顯示；從電腦複製進去的圖片在重新建立包之後顯示。
  '%s free': 剩餘 %s
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar：讀取 %s/s，%s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar：讀取 %s/s，最快，%s'
  ART PACK: ART 包
  About %d min: 約 %d 分鐘
  'Looking at the ART folders: %d pictures, %s': 正在查看 ART 資料夾：%d 張圖片，%s
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 已啟動的磁碟都沒有空間放 ART 包：約需 %s。請在你平常瀏覽的磁碟上騰出空間，然後再試。
  PACKING THE ART: 正在打包圖片
  PICTURE %d OF %d: 圖片 %d / %d
  'Pictures: %d (%s). ART folders: %d.': 圖片：%d 張（%s）。ART 資料夾：%d 個。
  Stop? The unfinished pack is removed; the ART folders stay as they are.: 要停止嗎？未完成的包會被刪除；ART 資料夾保持原樣。
  'The ART folders stay as they are: the pack is a copy.': ART 資料夾保持原樣：包只是副本。
  Under a minute: 不到一分鐘
  free space unknown: 剩餘空間未知
  'A game''s EXIT: the browser, or your boot loader when one is installed': 遊戲的 EXIT：瀏覽器，或已安裝的開機載入程式
