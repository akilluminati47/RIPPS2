  RA_NET_BUSY: Das Netzwerk wird von einem UDP-Transport benutzt
  RA_NET_BUSY2: RA braucht den SMB-Stack -- wechsle das Protokoll oder erstelle die .wl auf dem PC
  RA_NET_BUSY_HASH: Der Hash steht in RA/hashes.txt -- xeRAbora kann daraus die .wl erstellen
  RA_NO_IP: Die Konsole hat keine IP-Adresse
  RA_NO_IP2: Prüfe DHCP oder die feste Adresse in den Netzwerkeinstellungen
  RA_TEST_NO_ANSWER: Kein PC-Client hat innerhalb von 3 Sekunden geantwortet
  RA_TEST_NO_ANSWER2: Konsole%s. Prüfe, ob xeRAbora läuft und UDP 18194 offen ist
  RA_TEST_FOUND: PC-Client gefunden%s%s %s
  RA_TEST_FOUND2: Antwort in %u ms, Konsole%s
  RA_NA_NEUTRINO: RA-Verfolgung braucht den <OPL>-Kern -- Neutrino-Starts laden nie ee_core
  RA_NA_UDPFS: RA-Verfolgung gibt es nicht über UDPFS -- Spiele starten dort über Neutrino
  RA_NA_PS1: RA-Verfolgung gibt es nicht für PS1-Spiele
  RA_NA_HDD: APA-Spielinfo oder Einstellungsordner der Festplatte nicht verfügbar
  RA_NA_HDD2: Lege einen gültigen Einstellungsordner auf der Festplatte fest und aktualisiere vor der Prüfung
  RA_TELEMETRY: RetroAchievements-Telemetrie
  RA_BADGES: RetroAchievements-Abzeichen
  HTTP_GAMES: HTTP-Spiele
  HTTP_SERVER: HTTP-Server
  HTTP_PORT: HTTP-Port
  HTTP_BASE_PATH: HTTP-Basispfad
  HTTP_TEST: HTTP-Server testen
  HTTP_TEST_OK: Server OK -- Spiele gelistet
  HTTP_TEST_EMPTY: Der Katalog ist leer -- gültig, aber das beweist nichts über Bytebereiche
  HTTP_TEST_NO_ISO: Der Katalog hat kein unterstütztes Abbild, um einen Bytebereich zu testen
  HTTP_ERR_CONNECT: Der HTTP-Server ist nicht erreichbar
  HTTP_ERR_CATALOG: games.csv fehlt, ist unlesbar oder zu groß
  HTTP_ERR_RANGE: Der Server lieferte nicht genau die angeforderten Bytes
  HTTP_LAUNCH_UNAVAILABLE: Der HTTP-Start ist noch nicht umgesetzt -- der Katalog lässt sich nur durchsuchen
  HTTP_ERR_COMPRESSED: Komprimierte Abbilder (.zso) werden über HTTP noch nicht unterstützt
  HTTP_NO_VMC: Virtuelle Speicherkarten gibt es über HTTP nicht -- nutze eine echte Karte
  HTTP_TAB_HINT: HTTP liest games.csv von deinem Server. Lege Adresse, Port und Basispfad in den Netzwerkeinstellungen fest und nutze dann Testen.
  RA_DISC_CHECK: 'RA: Disc-Unterstützung prüfen'
  RA_DISC_LAUNCH: 'RA: Disc starten'
  RA_DISC_CHECKING: Prüfe die Disc für RetroAchievements
  RA_DISC_HASH_FAILED: Der Hash der Disc konnte nicht berechnet werden -- siehe RA/hashes.txt im Einstellungsordner
  RA_DISC_HOME_ERROR: Der Einstellungsordner kann nicht für Disc-Beobachtungslisten genutzt werden
  RA_DISC_ENABLE: Schalte zuerst die RetroAchievements-Telemetrie in den Netzwerkeinstellungen ein
  RA_DISC_CHECK_FIRST: 'Keine Beobachtungsliste für diese Disc -- nutze zuerst RA: Disc-Unterstützung prüfen'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d: Festplatte gefunden, aber ihre APA-Partitionstabelle ist unlesbar. Nicht formatieren -- deine Spiele sind vielleicht zu retten.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: Ein Laufwerk wurde nicht eingebunden, weil seine Sektoren nicht 512 Byte groß sind (z. B. ein Laufwerk mit 4K-Sektoren). OPL kann nur 512-Byte-Sektoren lesen.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Dieser Titel ist eine eigene APA-Partition, und OPL ändert nie die Partitionstabelle. Benenne ihn am PC um.
  POPS_SETTINGS_UNREADABLE: POPSTARTERs Einstellungen ließen sich nicht lesen -- die Speicherkarte ist beschäftigt oder unlesbar. Versuche es nach dem Laden erneut.
  GLOBAL_PS_EMULATION_SETTINGS: Globale PS-Emulationseinstellungen
  RA_NO_LINK_UNTRACKED: Netzwerk nicht verfügbar -- diesmal ohne RetroAchievements gestartet.
  IGR_USB_DRIVERS_PROMPT: Der IGR-Pfad liegt auf USB, aber in %s fehlen USBD.IRX und USBHDFSD.IRX, die die Konsole braucht, um nach einem In-Game Reset USB zu erreichen. Ohne sie fällt das IGR in den PS2-Browser zurück. RiptOPLs Treiber jetzt dorthin kopieren? FMCB, OpenTuna und andere Exploits laden diese Dateien auch und können sich damit anders verhalten. Vorhandene Dateien werden nie ersetzt. Nur FAT32-USB.
  IGR_USB_DRIVERS_FAILED: Die USB-Treiber konnten nicht nach %s kopiert werden (Karte voll oder nicht beschreibbar). Das IGR fällt in den PS2-Browser zurück.
  OFFICIAL_CFG_NOTIFICATION: Offizielle OPL-Einstellungen geladen von %s
  CFM_VMODE_HOLD_KEEP: Halten zum Behalten
  BDM_PS2_FOLDERS_UNREADABLE: Der Ordner CD oder DVD in %s ließ sich nicht öffnen (Fehler %d), also listet dieses Laufwerk keine PS2-Spiele. Drücke auf seiner Seite SELECT, um es erneut zu versuchen.
  NEUTRINO_BD_NO_DEVICE_NUMBER: Das Neutrino-Dateisystem steht auf bd, aber dieses Laufwerk hat nie seine Gerätenummer gemeldet, also kann Neutrino nicht darauf zeigen. Stelle das Neutrino-Dateisystem dieses Spiels auf Auto oder exfat.
  CFM_VMODE_REVERT_IN: Zurück in %d s
  EMBER_DITHER: Ember-Dithering
  HINT_EMBER_DITHER: Embers Dithering (an oder aus), geschrieben in EMBER/settings.txt des Startlaufwerks. Ein Wert pro Spiel hat Vorrang.
  EMBER_SHADING: Ember-Schattierung
  HINT_EMBER_SHADING: 'Embers Farbtiefe: 15 Bit oder 24 Bit (experimentell). Geschrieben in EMBER/settings.txt des Startlaufwerks. Ein Wert pro Spiel hat Vorrang.'
  EMBER_CONTROLLER: Ember-Controller
  HINT_EMBER_CONTROLLER: 'Embers Controller-Modus: Auto, Analog oder D2A. Meist besser pro Spiel einstellen (Dreieck > Ember-Spieleinstellungen), was Vorrang hat.'
  EMBER_480P_CONFIRM: Ember in 480p zeigt über Composite kein Bild. 480p verwenden?
  EMBER_SHADING_24: 24 Bit (experimentell)
  EMBER_GAME_SETTINGS: Ember-Spieleinstellungen
  HINT_EMBER_GAME_SETTING: Nur dieses Spiel. Drücke OK, um vor dem Start EMBER/games/<name>/settings.txt zu schreiben. Ein unberührter Standard behält einen vorhandenen Dateiwert; einen Wert auf Standard zurückzustellen entfernt seine Überschreibung.
  EMBER_TIMING: Ember-Timing
  HINT_EMBER_TIMING: 'Embers Video-Timing: Auto folgt der Region der Disc, NTSC erzwingt 60 Hz, PAL erzwingt 50 Hz. Geschrieben in EMBER/settings.txt des Startlaufwerks.'
  EMBER_GLOBAL_WARNING: Diese Ember-Einstellungen gelten für jedes PS1-Spiel, und manche Spiele stürzen damit ab. Um nur ein Spiel zu ändern, nutze Dreieck > Ember-Spieleinstellungen bei diesem Spiel.
  RIPPS2_RANDOM: Zufall
  RIPPS2_ALL: Alle
  RIPPS2_RANDOM_GAME: Zufallsspiel
  HINT_RIPPS2_RANDOM_GAME: L2 und R2 zusammen springen zu einem zufälligen Spiel. Beim Start öffnet außerdem jede Liste auf einem zufälligen Spiel.
  RIPPS2_ALL_GAMES: Alle Spiele
  RIPPS2_SET_METADATA: Metadaten setzen
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 'Startet RIPPS2 beim Einschalten über deinen Bootloader: PS2BBL und FMCB starten es sofort, OSDMenu setzt es an die erste Stelle seines Menüs, und das EXIT eines Spiels führt auf demselben Weg zurück. Aus stellt wieder her, was vorher da war. Noch keiner? Bootloader installiert BIBLE.'
  HINT_COLORS_TEXT: Die Farbe des Texts der Spieleliste. Designs haben ihre eigene; dies ändert sie für die eingebauten Designs.
  HINT_COLORS_SELECTED: Die Farbe des gewählten Spiels und der gewählten Zeile auf Einstellungsseiten.
  HINT_COLORS_DIALOG: Die Farbe der Einstellungsseiten und Meldungsfenster.
  HINT_COLORS_TITLE: Die Farbe des Spielnamens auf seiner Infoseite.
  HINT_COLORS_BACKGROUND: Die Farbe hinter allem, wenn keine Bilder oder Türme gezeichnet werden.
  HINT_COLORS_PLASMA: Die Farbe, zu der der alte OPL-Plasmahintergrund hin mischt (das Design <OPL>).
  HINT_COLORS_RESET: Setzt die sechs Farben oben auf die des Designs zurück.
  HINT_COVERFLOW_COUNT: Wie viele Cover RIPFLOW auf jeder Seite des gewählten zeigt.
  HINT_COVERFLOW_SCALE: Wie groß RIPFLOW das gewählte Cover gegenüber den anderen zeichnet.
  HINT_COVERFLOW_ANIM: Wie schnell die Cover gleiten, wenn du dich durch den Fluss bewegst.
  HINT_NARGS_QB: 'Quick Boot: überspringt Neutrinos eigenen Startbildschirm. Hier an, wird es für jedes Spiel gesendet; aus, sendet RIPPS2 es trotzdem selbst für USB-, iLink- und Netzwerkspiele, wo es nötig ist.'
  HINT_NARGS_DBC: 'Debug-Farben: Neutrino füllt den Bildschirm bei jedem Ladeschritt mit einer Farbe, damit ein Foto zeigt, wo ein Spiel hängen bleibt.'
  HINT_NARGS_LOGO: Zeigt vor dem Spiel das PS2-Logo (ein zweiter IOP-Neustart, den manche iLink-Laufwerke brauchen). Hier aus, folgt RIPPS2 Spielstart > PS2-Logo und sendet es nie für MMCE- oder Netzwerkspiele.
  HINT_NARGS_CWD: 'Der Ordner, den das Spiel als seinen eigenen sieht. Leer: Neutrinos Standard.'
  HINT_NARGS_CFG: 'Eine eigene Neutrino-Konfigurationsdatei (-cfg). Leer: die von Neutrino.'
  HINT_NARGS_ELF: 'Startet diese ELF statt der Bootdatei, die die Disc nennt. Leer: die des Spiels.'
  HINT_NARGS_ATA0: Ein Festplattenabbild, das Neutrino als interne Festplatte der Konsole einbindet, für Spiele, die die Festplatte nutzen (-ata0).
  HINT_NARGS_ATA0ID: Die ID-Datei zu diesem Festplattenabbild (-ata0id).
  HINT_NARGS_ATA1: Ein zweites Festplattenabbild (-ata1).
  RIPPS2_LAST_USED: Zuletzt benutzt
  RIPPS2_PAGE_BUTTONS: Seitentasten
  HINT_RIPPS2_PAGE_BUTTONS: 'Welche Schultertasten die Seiten der Spieleliste umblättern. L2 / R2: Sie blättern, und L1 / R1 wechseln die Kategorie. L1 / R1: Sie blättern, und L2 / R2 wechseln die Kategorie. Design: Das Design entscheidet; ohne eines springt L2 an den Anfang und R2 ans Ende. L2 + R2 zusammen wählen immer ein zufälliges Spiel.'
  RIPPS2_IGR_MENU: Menü im Spiel
  HINT_RIPPS2_IGR_MENU: 'An: L1+L2+R1+R2+SELECT+START pausiert das Spiel: weiter, beenden, Bildschirmfoto, Erfolge ansehen oder ausschalten. Aus: die Kombination verlässt das Spiel sofort, wie bisher.'
  RIPPS2_BOOT_LOADER: Bootloader
  HINT_RIPPS2_BOOT_LOADER: Zeigt, was jede Speicherkarte beim Einschalten startet, und installiert BIBLE (PS2BBL eingerichtet für RIPPS2). Die alten Bootdateien der Karte werden aufbewahrt.
  RIPPS2_MANAGE: Verwalten
  RIPPS2_ACHIEVEMENTS: Erfolge
  RIPPS2_NBD_SERVER: NBD-Server
  HINT_RIPPS2_NBD_SERVER: Teilt die Festplatte über das Netzwerk mit einem PC. Solange er läuft, bleibt ein Statusbildschirm stehen.
  RIPPS2_START: Starten
  RIPPS2_COVER_ART: Cover
  HINT_RIPPS2_COVER_ART: Lädt für jedes PS2-Spiel in deinen gestarteten Listen ohne Cover eines in den ART-Ordner dieses Laufwerks, von xlenores ps2-covers auf GitHub. Braucht das Netzwerkkabel und das Internet.
  RIPPS2_DOWNLOAD: Herunterladen
  RIPPS2_GLYPHS: Steuerkreuz-Symbole
  HINT_RIPPS2_GLYPHS: 'Steuerkreuz-Symbole neben Laufwerks- und Formationsnamen. Einblenden zeigt sie beim Wechseln; Ausblenden zeigt sie beim Öffnen einer Seite. Design: Das Design entscheidet.'
  RIPPS2_COLOR_THEME: Farbschema
  HINT_RIPPS2_COLOR_THEME: 'Eine Farbe für Türme, Kugeln, Glas, CD-Player und Dateibrowser, auf allen drei Reitern. Design: Das Design entscheidet (sonst RIPPS2-Blau).'
  RIPPS2_HINTS: Tastenhinweise
  HINT_RIPPS2_HINTS: 'Die Tastenhinweise unten. Bei Ruhe ausblenden versteckt sie, bis du eine Taste drückst. Design: Das Design entscheidet.'
  RIPPS2_CATEGORY_BAR: Kategorie/Seitenleiste
  HINT_RIPPS2_CATEGORY_BAR: 'DISC STARTEN, SPEICHER und SPEICHERDATEIEN: die Namen oben entlang oder die Seitenleiste. Bei Ruhe ausblenden blendet die Namen aus oder schiebt die Seitenleiste weg, bis du eine Taste drückst; sie kommt sofort zurück. Design: das Design entscheidet.'
  RIPPS2_SOURCE_NAME: Quellenname
  RIPPS2_STATUS: Status
  RIPPS2_SOURCE: Quelle
  HINT_RIPPS2_SOURCE_NAME: 'Der Name der Quelle über den Spielen (ALLE SPIELE, FESTPLATTENSPIELE usw.). Bei Ruhe ausblenden blendet ihn mit der Kategorieleiste aus; Einblendung zeigt ihn stattdessen groß in der Seitenmitte, so wie L3 die Liste benennt, bei der ersten Liste nach dem Start und bei jedem Quellenwechsel, dann blendet er aus. Einblendung und Name macht beides. Designs können Einblendung zu ihrem Sichtbar machen. Design: Das Design entscheidet.'
  RIPPS2_RECENTS: Zuletzt gespielt
  HINT_RIPPS2_RECENTS: 'Zuletzt gespielt, eine Seite in der Seitenleiste mit deinen zuletzt gestarteten Spielen, das neueste zuerst: wie viele sie behält, 1 bis 99 (Dreieck tippt die Zahl). Ein Spiel, dessen Laufwerk auf Manuell steht, startet es, wenn du es wählst. 0 schaltet die Seite ab.'
  RIPPS2_CATEGORY_ORDER: Kategoriereihenfolge
  HINT_RIPPS2_CATEGORY_ORDER: 'Tauscht Disc starten und Speicherdateien: Speicherdateien zuerst und Disc starten zuletzt, bei den Namen der Leiste wie bei den Symbolen der Seitenleiste. Gemacht für RIPFLOW (Oberfläche > Design). Design: das Design entscheidet.'
  RIPPS2_MUSIC: Musik
  HINT_RIPPS2_MUSIC: Spielt die bgm-Dateien im AUDIO-Ordner neben RIPPS2 und in OPLs AUDIO-Ordner auf jedem gestarteten Laufwerk (Ogg ohne Tags oder 16-Bit-WAV); eine namens Menu spielt zuerst. Die eigene Musik eines Designs spielt stattdessen.
  RIPPS2_BIOS_SOUNDS: BIOS-Sounds
  HINT_RIPPS2_BIOS_SOUNDS: 'Schreibt die Menüsounds dieser Konsole aus ihrem BIOS als RIPPS2s Sounds in den AUDIO-Ordner (unter 1 MB). Die Menümusik hat ihren eigenen Rip: BIOS-Musik.'
  RIPPS2_RIP: Rippen
  RIPPS2_HINTS_GLYPHS: Hinweise und Symbole
  HINT_RIPPS2_HINTS_GLYPHS: Wie die Tastenhinweise und Symbole aussehen. Jede Zeile beginnt bei Design, der Wahl des Designs; jede andere Wahl ist deine und gilt über jedem Design.
  RIPPS2_HINT_LAYOUT: Hinweis-Layout
  HINT_RIPPS2_STARSIDE: 'Wo der Stern eines Lieblingsspiels in der Liste steht. Links: eine eigene Spalte am Anfang jeder Zeile. Rechts: hinter dem Titel. Versteckt (der Standard): kein Stern und keine Spalte, die Titel in voller Länge. Design: wie das Design es sagt. R3 markiert ein Spiel so oder so; halte R3 4 Sekunden auf einer Liste, um die Sterne zu verstecken oder zurückzuholen (das markiert auch das Spiel unter dem Cursor).'
  HINT_RIPPS2_HINT_LAYOUT: 'Zeile: die Hinweise in einer Zeile. Spalte: ein Hinweis pro Zeile, eine Liste an der Seite, beginnend dort, wo das Design seine Hinweise hinsetzt.'
  RIPPS2_HINT_LABELS: Hinweis-Beschriftung
  HINT_RIPPS2_HINT_LABELS: Nur Symbol zeichnet nur die Tasten, für Symbole mit eigenen Worten. Abzeichen setzt Symbol und Titel jedes Hinweises auf ein gemeinsames Abzeichen.
  RIPPS2_HINT_MENU: Menü-Hinweis (START)
  RIPPS2_HINT_REFRESH: Aktualisieren-Hinweis (SELECT)
  RIPPS2_HINT_STAR: Favorit-Hinweis (R3)
  RIPPS2_HINT_VIEW: Ansicht-Hinweis (L3)
  HINT_RIPPS2_HINT_SHOW: Zeigt oder versteckt diesen Hinweis. Seine Taste wirkt in jedem Fall.
  RIPPS2_GLYPH_SET: Symbolsatz
  HINT_RIPPS2_GLYPH_SET: 'Die Tastensymbole auf jeder Seite: die des Designs, die von RIPPS2, Standard (dunkle Tasten, farbige Zeichen) oder Weiß (reines Weiß).'
  RIPPS2_HINT_ORDER: Hinweis-Reihenfolge
  HINT_RIPPS2_HINT_ORDER: Ordnet die Hinweise. Design behält die Reihenfolge des Designs; Deine Reihenfolge ist die hier eingestellte.
  RIPPS2_HINT_ORDER_FOLLOW: Reihenfolge
  RIPPS2_GRID_LAYOUT: Rasterlayout
  HINT_RIPPS2_GRID_LAYOUT: Wie viele Cover eine Rasterseite fasst, mit RIPPS2s Abständen. Design behält das des Designs.
  RIPPS2_LAUNCH_DISC: Start-Disc
  HINT_RIPPS2_LAUNCH_DISC: Die Disc eines Spiels erscheint beim Start. Einblendung setzt sich und blendet aus; Drehen dreht sich immer schneller, bis das Spiel startet; Zoomen setzt sich, wird dann groß genug zum Lesen und bleibt stehen.
  RIPPS2_TRANSITION: Seitenübergang
  HINT_RIPPS2_TRANSITION: 'Wie eine neue Seite beim Wechsel der Kategorie hereinkommt: aus der Hintergrundfarbe des Designs oder aus einem Blitz. Design behält die Wahl des Designs.'
  RIPPS2_CATEGORY_LAYOUT: Kategorie-Anordnung
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Wo die drei Kategorien stehen: ihre Namen oben entlang oder Symbole die Seitenleiste hinab, jede mit einer Schublade ihrer Seiten (Links in einer Liste führt dorthin), oder Menü: gar keine Leiste, die Kategorien im START-Menü wie bei einem Design für OPL. Design behält das des Designs.'
  RIPPS2_CACHE: Cache
  HINT_RIPPS2_CACHE: 'Wie die Spieleliste jeder Quelle aufbewahrt wird, damit ihre Seite sofort öffnet: Fast Cache, die Liste der internen Festplatte und Automatisch aktualisieren.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: Jede Quelle behält ihre letzte Spieleliste (RIPPS2.LST neben ihren CD- und DVD-Ordnern) und zeigt sie, sobald die Quelle antwortet. Trust Cache entscheidet, ob die Quelle danach neu gelesen wird. Aus liest jede Liste zuerst von ihrer Quelle, wie früher.
  HINT_RIPPS2_VIGNETTE: Dunkelt die Ränder jedes Covers außer dem gewählten ab, damit es hervorsticht. Schwach ist die Hälfte von Voll.
  RIPPS2_GRID_WIDE: Breitbild-Rasterlayout
  HINT_RIPPS2_GRID_WIDE: Die Rasterseite nur bei einem 16:9-Bild (Breitbild, 720p, 1080i), wo Cover schmaler sind und mehr nebeneinander passen. Design nutzt das des Designs; Wie folgt dem Rasterlayout.
  RIPPS2_BGBLUR: Hintergrundunschärfe
  HINT_RIPPS2_BGBLUR: Wie stark mattes Glas das Hintergrundbild des Spiels verwischt. Design nutzt die des Designs (Schwach bei RIPGRID und Adapt).
  HINT_RIPPS2_HINT_SLOT: Der Hinweis an diesem Platz. Der Hinweis, der hier war, rückt an den alten Platz des gewählten.
  PS1_SAVE_GUIDANCE: PS1-Spielstände hängen von Ember oder POPSTARTER ab; PS2-VMC-Einstellungen gelten nicht.
  NEUTRINO_SHOW_ARGS: Startargumente zeigen
  HINT_NEUTRINO_SHOW_ARGS: Zeigt vor jedem Neutrino-Start alle Argumente, die Neutrino bekommt, und fragt, ob es weitergehen soll. Zurück kehrt ohne Start ins Menü zurück.
  NEUTRINO_ARGS_CONFIRM: Neutrino startet mit diesen Argumenten. Starten?
  HINT_NARGS_EXTRA: Weitere Neutrino-Optionen, durch Leerzeichen getrennt, gesendet nach allem oben. RIPPS2 fügt immer -bsd und -dvd für Laufwerk und ISO des Spiels hinzu, -mc0 und -mc1 für seine VMCs, -gsm für seinen Videomodus und die eigenen Kompatibilitätsmodi des Spiels. Eine Option mit eigener Zeile oben (etwa -logo) wandert beim Speichern in diese Zeile und wird weiter gesendet.
  HINT_RIPPS2_THEME: Das Aussehen jeder Seite. Halte in der Spieleliste SELECT 4,2 Sekunden, um zum nächsten Design zu wechseln; ein kurzer Druck auf SELECT aktualisiert weiterhin die Liste.
  GAME_TYPE_LABELS: Beschriftungen [PS1]/[PS2] zeigen
  NEUTRINO_CHEATS_WRITE_FAILED: Die Cheatliste konnte nicht im Neutrino-Ordner gespeichert werden, also kann Neutrino sie nicht nutzen. Ohne Cheats starten?
  AUTO_CREATE_VMC: VMC beim ersten Start anlegen
  HINT_AUTO_CREATE_VMC: "Ein PS2-Spiel ohne VMC in Steckplatz 0 zu starten, legt auf dem Laufwerk des Spiels eine 8-MB-Karte an, benannt wie der VMC-Bildschirm vorschlägt (geteilt von allen Discs des Spiels), und weist sie zu. Unter Neutrino nicht auf der APA-Festplatte (eine exFAT-Festplatte geht)."
  AUTO_VMC_CREATING: Lege die VMC dieses Spiels an...
  AUTO_VMC_FAILED: Die VMC dieses Spiels konnte nicht angelegt werden. Das Spiel startet ohne.
  RIPPS2_BIOS_MUSIC: BIOS-Musik
  HINT_RIPPS2_BIOS_MUSIC: 'Schreibt die Menümusik dieser Konsole (das Ambient-Stück ihres Browsers, etwa 15 MB als WAV) in einen AUDIO-Ordner deiner Wahl: neben RIPPS2 oder OPLs auf einem gestarteten Laufwerk. Zu groß für eine Speicherkarte. Die Größe wird zuerst gezeigt.'
  SAVE_ICONS: 3D-Spielstandsymbole
  HINT_SAVE_ICONS: Zeigt das Spielstandsymbol des gewählten Spiels, sich drehend, wo das Design einen Platz dafür hat. Liest zuerst die VMC des Spiels, dann die Speicherkarten.
  NETBOOT_RESTART_NOW: Das Netzwerkprotokoll ändert sich nach einem Neustart. Einstellungen speichern und OPL jetzt neu starten?
  HINT_NET_PROTOCOL: 'Welchen Netzwerkdienst RiptOPL nutzt: eine SMB-Freigabe, UDPFS, UDPBD oder HTTP. Von einem laufenden Dienst wegzuwechseln braucht einen Neustart.'
  HINT_UDPFS_ACCESS: Nur UDPFS. Dateien liest einzelne ISOs aus dem Spieleordner des Servers; IMG liest ein Festplattenabbild als Laufwerk. SMB und HTTP nutzen immer Dateien, UDPBD immer IMG.
  HINT_SMB_VERSION: Welche SMB-Version mit der PC-Freigabe gesprochen wird.
  HINT_NET_ADVANCED: Gibt Ethernet-Verbindungsmodus und SMB-Port zum Bearbeiten frei.
  HINT_ETH_LINK_MODE: Erzwingt Geschwindigkeit und Duplex der Netzwerkverbindung. Lass es auf Auto, außer die Verbindung bricht ständig ab.
  HINT_IP_ADDR_TYPE: Fest nutzt die Adresse unten; DHCP fragt deinen Router. UDPFS und UDPBD nutzen immer Fest.
  HINT_PS2_IP: Die eigene IP-Adresse der PS2. Wähle eine, die kein anderes Gerät nutzt, im selben Bereich wie dein PC.
  HINT_NETMASK: Subnetzmaske, meist 255.255.255.0.
  HINT_GATEWAY: Die Adresse deines Routers, meist dieselben ersten drei Zahlen mit .1 am Ende.
  HINT_DNS: Adresse des DNS-Servers. Meist dieselbe wie das Gateway.
  HINT_SMB_ADDR_TYPE: Den PC über seine IP-Adresse oder seinen NetBIOS-Namen (Computernamen) erreichen.
  HINT_SMB_ADDRESS: 'Der PC, der deine Spiele freigibt: seine IP-Adresse oder sein Computername, wenn der Adresstyp NetBIOS ist.'
  HINT_SMB_PORT: 'SMB-Port. Er muss zum PC passen: PS2 Servers nutzt 1111, Windows- und Samba-Freigaben nutzen 445.'
