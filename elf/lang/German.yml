  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Starte den xeRAbora-Client auf einem PC im selben Netzwerk, angemeldet bei deinem RetroAchievements-Konto. Dann für ein Spiel auf USB, MMCE, SMB oder der Festplatte: Öffne sein Spielmenü (DREIECK) und PRÜFE DIE SPIELUNTERSTÜTZUNG. Ein verfolgtes Spiel bekommt das RA-Abzeichen; mit TELEMETRIE an starte es, und Freischaltungen erscheinen über dem Spiel. Für eine Disc im Fach nutze DISC PRÜFEN, dann DISC MIT ERFOLGEN SPIELEN. Über Neutrino, POPSTARTER oder Ember gestartete Spiele werden noch nicht verfolgt.'
