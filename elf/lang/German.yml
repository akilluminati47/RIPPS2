  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Das neue Paket in ein anderes .tar einfügen? Danach wählst du das .tar, das behalten und aktualisiert wird; die Bilder des neuen Pakets kommen hinein.
