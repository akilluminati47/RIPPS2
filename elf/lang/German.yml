# RIPPS2 in German. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: German
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE: EINRICHTEN, AKTUALISIEREN ODER WIEDERHERSTELLEN"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "BIBLE AKTUALISIEREN: STECKPLATZ %d HAT EIN ÄLTERES"
  "Background": "Hintergrund"
  "Sky": "Himmel"
  "Black": "Schwarz"
  "Splash": "Startbild"
  "Logo": "Logo"
  "Logo and Names": "Logo und Namen"
  "Button Glyphs": "Tastensymbole"
  "Face Buttons": "Aktionstasten"
  "All Sixteen": "Alle sechzehn"
  "Info Line": "Infozeile"
  "Power-on Wait": "Wartezeit beim Einschalten"
  "This console has ROM %d.%02d. Many consoles from ROM 2.30 on no longer run system updates, so a BIBLE bound here may not start at power on. If it does not, start BIBLE as a plain ELF through OpenTuna or FunTuna instead.": "Diese Konsole hat ROM %d.%02d. Viele Konsolen ab ROM 2.30 führen keine Systemupdates mehr aus, daher startet ein hier gebundenes BIBLE beim Einschalten vielleicht nicht. Falls nicht, starte BIBLE als einfaches ELF über OpenTuna oder FunTuna."
  "Binds the BIBLE RIPPS2 carries to a memory card. On this console's ROM a bound BIBLE may not start at power on: a plain ELF through OpenTuna or FunTuna can.": "Bindet das BIBLE, das RIPPS2 mitbringt, an eine Speicherkarte. Auf dem ROM dieser Konsole startet ein gebundenes BIBLE beim Einschalten vielleicht nicht: Ein einfaches ELF über OpenTuna oder FunTuna kann es."
  "Starting that drive...": "Starte dieses Laufwerk..."
  "%s, path %d": "%s, Pfad %d"
  "A BIBLE COMMAND": "EIN BIBLE-BEFEHL"
  "ARGUMENTS": "ARGUMENTE"
  "Argument %d": "Argument %d"
  "Arguments: %s": "Argumente: %s"
  "Auto (no button held)": "Auto (keine Taste gehalten)"
  "BIBLE hands these to the program, in this order.": "BIBLE gibt sie dem Programm in dieser Reihenfolge."
  "BIBLE has no way to reach that drive. Choose a program on another one, or type the path.": "BIBLE kann dieses Laufwerk nicht erreichen. Wähle ein Programm auf einem anderen oder tippe den Pfad."
  "BIBLE keeps this key from PS2BBL, but nothing in this build acts on it, so it changes nothing yet.": "BIBLE behält diesen Schlüssel von PS2BBL, aber nichts in dieser Version nutzt ihn, also ändert er noch nichts."
  "BIBLE needs at least one path in its settings, or it starts in its rescue mode, so this one stays.": "BIBLE braucht mindestens einen Pfad in seinen Einstellungen, sonst startet es im Rettungsmodus, also bleibt dieser."
  "BIBLE's Settings": "BIBLE-Einstellungen"
  "BIBLE's credits": "BIBLE-Credits"
  "BOOT LOCK holds this line. Turn BOOT LOCK off to change it.": "BOOT LOCK hält diese Zeile. Schalte BOOT LOCK aus, um sie zu ändern."
  "Binds the BIBLE RIPPS2 carries to a memory card, writes it over the one there, or puts back what it replaced.": "Bindet das BIBLE, das RIPPS2 mitbringt, an eine Speicherkarte, schreibt es über das vorhandene oder stellt wieder her, was es ersetzt hat."
  "Boot Sound": "Startsound"
  "CHOOSE A PROGRAM": "PROGRAMM WÄHLEN"
  "CHOOSE AN ELF": "ELF WÄHLEN"
  "Choose a program from your drives, type a path, or pick one of BIBLE's commands. BIBLE tries the paths in order and starts the first it finds.": "Wähle ein Programm von deinen Laufwerken, tippe einen Pfad oder nimm einen BIBLE-Befehl. BIBLE probiert die Pfade der Reihe nach und startet den ersten, den es findet."
  "Follow Color Theme": "Farbthema folgen"
  "How long BIBLE waits for a button before the Auto path. At 0 ms a button held from power on still works.": "Wie lange BIBLE vor dem Auto-Pfad auf eine Taste wartet. Bei 0 ms wirkt eine seit dem Einschalten gehaltene Taste weiter."
  "Launch Keys": "Starttasten"
  "Launch Keys: %s": "Starttasten: %s"
  "On shows a disc's game ID on screen as it starts, for RetroGEM video mods.": "An zeigt beim Start die Spiele-ID der Disc auf dem Bildschirm, für RetroGEM-Videomods."
  "On shows a program's game ID on screen as it starts, for RetroGEM video mods. It is up to 11 characters from the file name.": "An zeigt beim Start die Spiele-ID des Programms auf dem Bildschirm, für RetroGEM-Videomods. Bis zu 11 Zeichen aus dem Dateinamen."
  "On stops the disc at a launch and waits for the drive to answer. Off skips that wait, about 3 s in the lab, and a disc in the tray keeps spinning.": "An hält die Disc beim Start an und wartet auf die Antwort des Laufwerks. Aus überspringt das, etwa 3 s im Labor, und eine Disc im Fach dreht sich weiter."
  "Opens the file itself in the text editor, comments and all. Every change here keeps the other lines as they are.": "Öffnet die Datei selbst im Texteditor, samt Kommentaren. Jede Änderung hier lässt die anderen Zeilen, wie sie sind."
  "Path %d": "Pfad %d"
  "Shows the countdown, the clock and the console's details on the splash.": "Zeigt Countdown, Uhr und Konsolendaten auf dem Startbildschirm."
  "Sky Color": "Himmelsfarbe"
  "TYPE A PATH": "PFAD TIPPEN"
  "The button pictures under the logo: none, the four face buttons, or all sixteen.": "Die Tastenbilder unter dem Logo: keine, die vier Aktionstasten oder alle sechzehn."
  "The console's browser": "Der Browser der Konsole"
  "The disc in the tray": "Die Disc im Fach"
  "The disc, without the PS2 logo": "Die Disc, ohne PS2-Logo"
  "The name BIBLE's splash shows for this button.": "Der Name, den BIBLEs Startbildschirm für diese Taste zeigt."
  "The same setting as in Audio. On (fast) keeps a copy on the memory card, so the sound starts with the first frame. Off is the fastest boot.": "Dieselbe Einstellung wie unter Audio. An (schnell) hält eine Kopie auf der Speicherkarte, sodass der Sound mit dem ersten Bild startet. Aus ist der schnellste Start."
  "The shape of BIBLE's splash. Auto follows RIPPS2's Widescreen when its settings are on a memory card.": "Die Form von BIBLEs Startbildschirm. Auto folgt dem Breitbild von RIPPS2, wenn dessen Einstellungen auf einer Speicherkarte liegen."
  "The signal BIBLE starts in. Auto uses RIPPS2's Video Mode when its settings are on a memory card, and the console's own mode when they are not.": "Das Signal, in dem BIBLE startet. Auto nutzt den Videomodus von RIPPS2, wenn dessen Einstellungen auf einer Speicherkarte liegen, sonst den der Konsole."
  "The sky on BIBLE's splash. Follow Color Theme uses the sky RIPPS2 saves with its settings. A color named here stays, whatever the theme.": "Der Himmel auf BIBLEs Startbildschirm. Farbthema folgen nutzt den Himmel, den RIPPS2 mit seinen Einstellungen speichert. Eine hier gewählte Farbe bleibt, egal welches Thema."
  "This BIBLE (%s build) does not read this drive, so it moves on to the next path.": "Dieses BIBLE (%s-Version) liest dieses Laufwerk nicht und geht zum nächsten Pfad."
  "What BIBLE shows while it waits for a button: nothing, its logo, or its logo with the name of what each button starts.": "Was BIBLE zeigt, während es auf eine Taste wartet: nichts, sein Logo oder sein Logo mit dem Namen dessen, was jede Taste startet."
  "What BIBLE starts when no button is held at power on.": "Was BIBLE startet, wenn beim Einschalten keine Taste gehalten wird."
  "What BIBLE starts when this button is held at power on. L2 + R2 held at power on shows BIBLE's own page of them all.": "Was BIBLE startet, wenn diese Taste beim Einschalten gehalten wird. L2 + R2 beim Einschalten zeigen BIBLEs eigene Seite mit allen."
  "What each button starts at power on, each with up to ten paths chosen from your drives.": "Was jede Taste beim Einschalten startet, jede mit bis zu zehn Pfaden von deinen Laufwerken."
  "What stands behind BIBLE's logo. Auto shows the sky when Sky Color is set or RIPPS2's settings are on a memory card, and black when they are not.": "Was hinter BIBLEs Logo steht. Auto zeigt den Himmel, wenn Himmelsfarbe gesetzt ist oder die Einstellungen von RIPPS2 auf einer Speicherkarte liegen, sonst Schwarz."
  "When a button starts a disc and the tray is empty, On opens the tray for you.": "Wenn eine Taste eine Disc startet und das Fach leer ist, öffnet An das Fach für dich."
  "Eject Tray at Launch": "Lade beim Start auswerfen"
  "Read Console History": "Konsolenverlauf lesen"
  "Game ID for Apps": "Spiel-ID für Apps"
  "Game ID for Discs": "Spiel-ID für Discs"
  "File name (as it appears in your games list)": "Dateiname (wie in deiner Spieleliste)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "Diese Liste zeigt Spiele von anderen Laufwerken. Benenne ein Spiel auf der Seite seines Laufwerks um."
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "Ein Spiel mit Stern kann nicht umbenannt werden. Entferne den Stern (R3), benenne es um und vergib den Stern wieder."
  "This drive cannot rename its files. The details can still be set.": "Dieses Laufwerk kann seine Dateien nicht umbenennen. Die Angaben lassen sich trotzdem setzen."
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "Auf einer APA-Festplatte steht der Name eines PS2-Spiels in der Partitionstabelle, daher lässt es sich hier nicht umbenennen. Die Angaben lassen sich trotzdem setzen."
  "Renames the app in your list. Its ELF and its art keep their names.": "Benennt die App in deiner Liste um. Ihre ELF und Bilder behalten ihre Namen."
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "Benennt das Spiel auf seinem Laufwerk um. PS1-Spiele finden Bilder und Einstellungen über den Namen, daher benennt RIPPS2 sie mit um. Für Bilder in einem ART Pack muss das Paket neu erstellt werden."
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "Benennt die Datei des Spiels auf seinem Laufwerk um. PS2-Spiele finden Bilder und Einstellungen über die Spiel-ID, also geht nichts verloren."
  "Stop Disc at Launch": "Disc beim Start anhalten"
  "EDIT BIBLE'S SETTINGS FILE": "BIBLES EINSTELLUNGSDATEI BEARBEITEN"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "BIBLEs Einstellungsdatei (%s) konnte nicht geschrieben werden. Prüfe, ob die Speicherkarte steckt und Platz hat, dann versuche es erneut."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "BIBLEs Einstellungsdatei (%s) wurde nicht gefunden. BIBLE: EINRICHTEN, AKTUALISIEREN ODER WIEDERHERSTELLEN schreibt eine."
  "Boot sound On (fast): %s, handed over by BIBLE": "Startton An (schnell): %s, von BIBLE übergeben"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: akilluminati47s Fork von PS2BBL Extended, jeder Build von akilluminati47 signiert (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "sein IOPRP-Image bindet BIBLE an deine Karte (GPL-3): die Konsole macht die Kryptografie, ohne Schlüssel"
  "KELFBinder by El Isra": "KELFBinder von El Isra"
  "source: github.com/akilluminati47/BIBLE": "Quellcode: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "STECKPLATZ 0: %s\nSTECKPLATZ 1: %s\n%s\nRIPPS2: BIBLE wird eingerichtet. BIBLE, der Bootloader von akilluminati47 auf Basis von PS2BBL von El Isra, von RIPPS2 auf einer normalen 8-MB-PS2-Speicherkarte oder der internen Festplatte eingerichtet: ein Start mit 0 ms beim Einschalten (PS2BBL Extended erlaubt keine 0), RIPPS2 zuerst von seinem Ort (es wird nie kopiert), und eine beim Einschalten gehaltene Taste erreicht weiter den Browser (TRIANGLE), eine Disc (START) und das Vorherige (CIRCLE). Einrichten, reparieren oder das Ersetzte zurückholen?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: BIBLE wird eingerichtet\nDie Karte in Steckplatz %d ist eine SD2PSX- oder MMCE-Karte. Ihre BOOT-Karte kann BIBLE statt ihres PS2BBL tragen (das wird vorher ganz beiseitegelegt), wenn die Konsole BIBLE an sie bindet. Wird die Bindung abgelehnt, ändert sich nichts auf der Karte, und die Karte antwortet womöglich nicht mehr, bis die Konsole aus- und eingeschaltet wird. START bindet BIBLE an sie."
  "BIND BIBLE": "BIBLE BINDEN"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT neben RIPPS2 enthält, was die Karte gemeldet hat.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Für eine normale 8-MB-PS2-Speicherkarte (eine MagicGate-Karte oder eine SD2PSX- oder MMCE-BOOT-Karte): die in Steckplatz %d. Beim Einschalten liest PS2BBL die Konfiguration von Steckplatz 1 vor der von Steckplatz 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Die Konsole wollte BIBLE nicht an die Speicherkarte in Steckplatz %d binden (der MagicGate-Schritt schlug fehl). Auf der Karte wurde nichts geändert. Eine Karte, die nicht original oder MagicGate-kompatibel ist, kann kein Systemupdate aufnehmen."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Eine SD2PSX- oder MMCE-Karte kann nach einer abgelehnten Bindung nicht mehr antworten: Fehlen jetzt die Speicherkarte oder das MMCE-Laufwerk, schalte die Konsole aus und wieder ein."
  "RIP THIS CONSOLE'S AUDIO": "AUDIO DIESER KONSOLE RIPPEN"
  "sounds or music, from its BIOS": "Sounds oder Musik, aus ihrem BIOS"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Öffnet die Audio-Einstellungen bei BIOS-Sounds und BIOS-Musik: Rippe die eigenen Sounds dieser Konsole oder ihre Menümusik nach AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Startton An (schnell): %s auf der Speicherkarte, wenn die Säulen steigen"
  "Boot sound On: %s on the memory card, as the pillars rise": "Startton An: %s auf der Speicherkarte, wenn die Säulen steigen"
  "Boot sound On: %s, once its drive is up": "Startton An: %s, sobald sein Laufwerk bereit ist"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Dieses Spiel startet über Neutrino, und RIPPS2 hat keins gefunden: weder am Pfad in den Einstellungen noch auf dem Laufwerk des Spiels, den Memory Cards oder einem gestarteten Laufwerk. Leg rickgaisers Neutrino (github.com/rickgaiser/neutrino) in einen Ordner neutrino auf dem Laufwerk des Spiels oder einer Memory Card, oder stell Spielstart > Neutrino darauf."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Wo dein Neutrino ist, sein Videomodus und die Argumente, die jeder Neutrino-Start bekommt. Neutrino gibt es unter github.com/rickgaiser/neutrino; leg es in einen Ordner neutrino auf einem Laufwerk oder einer Memory Card."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Dieses Neutrino ist älter als 1.3 und kann keine Spiele von der APA-Festplatte starten. Stell Spielstart > Neutrino auf Neutrino 1.3 oder neuer."
  "with rickgaiser's Neutrino as its second game core,": "mit rickgaisers Neutrino als zweitem Spielkern,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "der zweite Spielkern, genutzt von deinem Laufwerk oder deiner Memory Card (AFL-3.0)"
  "FILE NAME": "DATEINAME"
  "GAME LIST": "SPIELELISTE"
  "%s in %s": "%s in %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Schreibvorgänge sind aus, darum kann RIPPS2 die Angaben eines Spiels nicht speichern und es nicht umbenennen. Einschalten?"
  "START %s": "%s STARTEN"
  "NETWORK": "NETZWERK"
  "%s did not answer. Is it connected?": "%s hat nicht geantwortet. Ist es angeschlossen?"
