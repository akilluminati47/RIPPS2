  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'BIBLE AUF DER INTERNEN FESTPLATTE INSTALLIEREN

    - RIPPS2 wird nach %s kopiert.

    - Das Bootprogramm der Festplatte, das jetzt in __mbr liegt, wird ausgelesen und in %s/RIPPS2 aufbewahrt (WIEDERHERSTELLEN legt es zurück).

    - Der Festplatten-Build von PS2BBL wird an seine Stelle geschrieben und die Konsole so eingestellt, dass sie ihn beim Einschalten startet.

    - Seine Konfiguration (%s) startet RIPPS2 zuerst von %s%s%s, BOOT LOCK an.

    Das braucht eine Konsole, die von ihrer Festplatte bootet (eine Fat-PS2 mit dem Netzwerkadapter). Lass sie an, bis es fertig meldet.'
  INTERNAL HDD  (its boot area): INTERNE FESTPLATTE  (ihr Bootbereich)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'ALTES BOOTPROGRAMM DER FESTPLATTE ZURÜCKLEGEN

    Das von BIBLE aufbewahrte (RIPPS2/MBR-BACKUP.KELF auf der Festplatte) kommt zurück in __mbr, an BIBLEs Stelle. RIPPS2 und die PS2BBL-Konfiguration bleiben, wo sie sind.'
  RESTORE: WIEDERHERSTELLEN
  RESTORE THE HDD'S OLD BOOT PROGRAM: ALTES BOOTPROGRAMM DER FESTPLATTE WIEDERHERSTELLEN
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
