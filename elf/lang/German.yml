  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Die Zusammenführung konnte nicht auf das Laufwerk von %s geschrieben werden (ist Platz da?). Es ist, wie es war; sonst wurde nichts geändert.
