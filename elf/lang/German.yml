  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Pad zuerst (experimentell)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'Der SD2PSX liest über den Bus, den sich der Controller teilt, und während ein Lesevorgang läuft, wird das Pad nicht gehört: Eingaben hängen nach oder gehen verloren, während Cover laden. An: Cover kommen in kleinen Stücken, dazwischen wird das Pad gelesen, etwas langsamer. Aus: so schnell, wie die Karte kann. Stehen die Quellen der Karte auf Auto, lädt ihre Liste einmal, beim Booten.'
  HINT_RIPPS2_TRUST_CACHE: Eine aus dem Cache gezeigte Liste bleibt, wie sie ist, startbereit, bis du SELECT drückst oder RIPPS2 diese Quelle selbst ändert. Aus liest jede Quelle nach dem Anzeigen ihres Caches im Hintergrund neu, eine spürbare Pause auf einer MMCE- oder MX4SIO-Karte, die sich den Bus des Controllers teilen.
  RIPPS2_STATUS_OPEN: Laden und Laufwerke
  HINT_RIPPS2_STATUS_OPEN: 'Öffnet STATUS: wo der Start die Einstellungen und die Spielelisten liest, welcher Ort am schnellsten ist, wohin das EXIT eines Spiels führt, und jedes Laufwerk. Sein CACHE-EINSTELLUNGEN führt hierher zurück.'
  RIPPS2_BADGE_SET: Abzeichen-Satz
  HINT_RIPPS2_BADGE_SET: 'Die Abzeichen auf der Infoseite eines Spiels (Bewertung, Spieler, ESRB, Videomodus, Scan, Seitenverhältnis). RIPPS2: sein eigener Satz, auf jedem Design gleich. Design: die eigenen Bilder des Designs, oder die von RIPPS2, wenn das Design sie verlangt.'
  RIPPS2_HINT_FADE: Hinweise und Symbole einblenden
  HINT_RIPPS2_HINT_FADE: 'Ein Tastenhinweis oder Symbol, das sich ändert, blendet im Moment der Änderung ein, wie die Cover; gleichbleibende bleiben unberührt, auf jeder Seite und in jeder Meldung. Aus: sie erscheinen einfach. Design: das Design entscheidet (an, außer es sagt hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Seitenleisten-Stil
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klassisch (geteilt): die Symbole in der dunklen Leiste der Seitenleiste, mit dem farbigen Streifen daneben. XL (ein Stück): eine breitere Leiste, die Symbole in ihrer Mitte. Design: das Design entscheidet.'
  HINT_EXITPATH: 'Wohin EXIT im Menü im Spiel führt. Am besten leer: EXIT führt zum Browser, der deinen Bootloader startet (FreeMcBoot, PS2BBL, OSDMenu oder BIBLE), wenn einer installiert ist, und mit BOOT LOCK wieder RIPPS2, wie beim Einschalten; ohne einen den PS2-Browser. Ein hier eingetipptes ELF wird nur genutzt, wenn der Reset es laden kann (auf einer Speicherkarte oder einem FAT32-USB-Laufwerk) und es nicht RIPPS2 selbst ist; alles andere führt zum Browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO und die exFAT-Festplatte. Auto startet sie beim Booten: am schnellsten für die Laufwerke, die du angeschlossen hast, ihre Spiele von Anfang an in Alle Spiele. Manuell startet sie, wenn du ihre Seite öffnest.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino kann keine VMC auf der APA-Festplatte nutzen (exFAT, USB und MX4SIO können es): Dieses Spiel startet mit der echten Karte in diesem Steckplatz.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Der Start liest nur RIPPS2s eigenes Laufwerk: die Einstellungen und die Sounds neben RIPPS2.ELF (RIPPS2.FB dort sagt, wo) und jede Liste aus ihrem Cache. Die anderen Laufwerke warten: SELECT auf einer Seite startet ihre Laufwerke und holt ihre Bilder (mit Automatischer Aktualisierung starten sie beim Start). Einschalten kopiert deine Sounds und, wenn Platz ist, die Musik nach AUDIO neben RIPPS2.'
  RIPPS2_ART_PACK: ART-Paket
  RIPPS2_ART_PACK_BUILD: Bauen oder entfernen
  HINT_RIPPS2_ART_PACK: Packt den ART-Ordner jedes gestarteten Laufwerks in eine art.tar auf dem Laufwerk deiner Wahl (das schnellste wird zuerst angeboten). Die Cover kommen dann aus einer Datei mit einem Index, nie mit einer Suche pro Spiel, sodass die Menüs und die Musik flüssig bleiben. Die ART-Ordner bleiben, wie sie sind.
  RIPPS2_LIST_CFG_TEXT: Titel und Beschreibung in der Liste
  HINT_RIPPS2_LIST_CFG_TEXT: 'Titel und Beschreibung des Spiels aus seiner CFG neben der Spieleliste. Theme: wie das Theme sie zeigt (das eigene Theme von RIPPS2 lässt sie weg). Die Infoseite behält sie in jedem Fall.'
  RIPPS2_PS1_PREFER: PS1-Duplikate
  HINT_RIPPS2_PS1_PREFER: 'Ein PS1-Spiel, das sowohl als POPSTARTER-VCD als auch als Ember-Abbild vorliegt. Beide: zwei Zeilen. Ember: nur das Ember-Abbild. POPSTARTER: nur die VCD. Derselbe Titel, eine vorangestellte Disc-ID beiseite, ist dasselbe Spiel.'
  RIPPS2_MY_PADS: Meine Pads
  HINT_RIPPS2_MY_PADS: 'Die .pad-Profile im Ordner PADS neben RIPPS2: eine Textdatei pro USB-Pad, nach seiner ID benannt (2563_0575.pad), jede geprüft. Ein Pad mit Profil steuert das Menü und spielt in Spielen (Pad-Emulator an).'
  RIPPS2_PAD_SETUP: USB-Pad einrichten
  HINT_RIPPS2_PAD_SETUP: Steck ein USB-Pad ein, das RIPPS2 nicht kennt, drück jede Taste, nach der es fragt, und RIPPS2 schreibt seine .pad in PADS. SELECT auf deinem PS2-Pad überspringt eine Taste.
