  HINT_NEUTRINO_AUTO_ELF: Übergibt die Boot-ELF des Spiels an Neutrino, um seine Konfiguration pro Titel zu finden. Standardmäßig an; eine von Hand gesetzte Boot-ELF-Option hat Vorrang.
  HINT_POPSTARTER_PATH: Wo POPSTARTER.ELF liegt. Leer gelassen trägt RIPPS2 eine ein, die es auf einem Laufwerk findet; überschreibe sie, um eine andere zu nutzen, etwa usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Die Neutrino-Argumente sind länger als speicherbar. Kürze ein Feld vor dem Speichern.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Die Neutrino-Startargumente überschreiten die sichere Grenze. Kürze die globalen oder die Spielargumente.
  NEUTRINO_AUTO_ELF: Automatische Boot-ELF (-elf)
  HINT_NEUTRINO_PATH: 'Wo liegt neutrino.elf? <nicht gesetzt> = Spiellaufwerk -> mc0/mc1. Ein eigener vollständiger Pfad wird zuerst versucht. Beispiele: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
