  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'Der IGR Path %s wird nicht genutzt: Nach einem Spiel lädt nur eine Datei auf einer Speicherkarte oder USB, und nie RIPPS2 selbst'
  an issue is the best way to get RIPPS2 updated.: ein Issue ist der beste Weg, RIPPS2 voranzubringen.
