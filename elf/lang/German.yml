  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Die Zusammenführung hielt zwischen zwei Umbenennungen an: das behaltene .tar ist %s und das eingefügte %s. Benenne sie mit Speicherdateien zurück.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
