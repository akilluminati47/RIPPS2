  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Fertig: Die Speicherkarte in Steckplatz %d startet, was sie vor BIBLE gestartet hat. BIBLE bleibt in mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): SPEICHERKARTE IN STECKPLATZ %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL kann RIPPS2 von seinem jetzigen Ort nicht starten (es erreicht Speicherkarten, USB-Laufwerke und MX4SIO), und RIPPS2 kopiert sich nicht selbst. Lege RIPPS2.ELF auf eine Speicherkarte oder ein USB-Laufwerk und starte es von dort, oder nutze PS2BBL Extended, das MMCE und die Festplatte liest.
  RESTORE SLOT %d'S OLD BOOT LOADER: ALTEN BOOTLOADER IN STECKPLATZ %d ZURÜCKHOLEN
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE ist auf der Speicherkarte in Steckplatz %d eingerichtet (mc%d:/%s/%s), BOOT LOCK an: Beim Einschalten startet es RIPPS2 sofort von %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: BIBLE wird eingerichtet
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: BIBLE wird eingerichtet
  
    RIPPS2 läuft von %s, das PS2BBL nicht lesen kann (es liest Speicherkarten, USB und MX4SIO), und RIPPS2 kopiert sich nicht selbst. Die PS2BBL-Extended-Konfiguration auf dieser Karte (%s) liest es: START schaltet BOOT LOCK an, sodass sie RIPPS2 beim Einschalten von %s startet. Sonst ändert sich nichts auf der Karte.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: BIBLE wird eingerichtet
  
    RIPPS2 läuft von %s, das PS2BBL nicht lesen kann: Es startet Programme von einer Speicherkarte, einem USB-Laufwerk oder MX4SIO, und RIPPS2 kopiert sich nicht selbst. Lege RIPPS2.ELF auf eines davon (den APPS-Ordner einer Speicherkarte oder ein USB-Laufwerk), starte es von dort und richte BIBLE dann erneut ein.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: BIBLE wird eingerichtet
  
    Die Speicherkarte in Steckplatz %d: BIBLE (mc%d:/%s) wird beiseitegelegt, und was es ersetzt hat (mc%d:/%s), kommt an seinen Platz zurück. Nichts wird gelöscht. Die PS2BBL-Konfiguration bleibt, wie sie ist (BOOT LOCK kann die Sperre ausschalten).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: BIBLE wird eingerichtet (PS2BBL wird an die Speicherkarte gebunden)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: BIBLE wird eingerichtet (das Vorherige kommt zurück)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: BIBLE wird eingerichtet (der I/O-Prozessor startet neu)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: BIBLE wird eingerichtet (es wird auf die Speicherkarte geschrieben)'
  SET UP BIBLE: BIBLE EINRICHTEN
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Die Speicherkarte in Steckplatz %d hat %d KB frei, und BIBLE braucht dort %d KB. Mach etwas Platz frei und versuche es dann erneut.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Die Speicherkarte in Steckplatz %d hat PS2BBL abgelehnt, also hat RIPPS2 die Karte so zurückgelassen, wie sie war. Prüfe ihren freien Platz und versuche es erneut. (DIAG.TXT neben RIPPS2 enthält, was die Karte gemeldet hat.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Die Speicherkarte in Steckplatz %d wollte BIBLE nicht beiseitelegen, also wurde nichts geändert. (DIAG.TXT neben RIPPS2 enthält, was die Karte gemeldet hat.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Die Speicherkarte in Steckplatz %d wollte %s nicht zurücknehmen, also ist BIBLE geblieben. (DIAG.TXT neben RIPPS2 enthält, was die Karte gemeldet hat.)
  MUSIC: MUSIK
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s hat kein %s. RIPPOPS hat Sonys PS1-Emulator auf %s gefunden: START kopiert %s hierher und startet das Spiel.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 sieht %s nicht in %s%s. POPSTARTER braucht POPS_IOX.PAK mit POPS.PAK oder mit POPS.ELF und IOPRP252.IMG: Sonys PS1-Emulator, von deiner eigenen Konsole. Es findet sie vielleicht dort, wo RIPPS2 nicht sucht (wenn deine Spiele starten, tut es das). START startet, und nach diesem Laufwerk wird nicht mehr gefragt.'
  ' (The configs found were set: %s.)': ' (Die gefundenen Konfigurationen wurden gesetzt: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Speichere seine Einstellungen einmal mit seinem eigenen Konfigurator und schalte BOOT LOCK dann wieder ein.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s kann RIPPS2 nicht von seinem jetzigen Ort (%s) starten, und RIPPS2 kopiert sich nicht selbst. Lege RIPPS2.ELF auf eine Speicherkarte oder ein USB-Laufwerk und starte es von dort.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK konnte die Konfiguration des Bootloaders nicht schreiben. Prüfe, ob die Speicherkarte oder das Laufwerk schreibgeschützt ist, und versuche es erneut.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK fand keine Bootloader-Konfiguration zum Ändern.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK ist aus. Dein Bootloader startet wieder, was er vorher gestartet hat (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK ist an. %s startet jetzt beim Einschalten RIPPS2 (%s), und ein leerer IGR-Pfad schickt das EXIT eines Spiels auf demselben Weg zurück. Halte beim Start der Konsole eine seiner Tasten, um etwas anderes zu erreichen.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK hat RIPPS2 an die erste Stelle im Menü von OSDMenu gesetzt (%s). OSDMenu startet von sich aus nichts: Wähle dort RIPPS2, und das EXIT eines Spiels führt zurück in dieses Menü. Für eine Konsole, die RIPPS2 sofort startet, legt BIBLE PS2BBL auf eine Speicherkarte (Bootloader).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK arbeitet über einen Bootloader auf einer Speicherkarte (PS2BBL, FMCB oder OSDMenu), und hier gibt es keinen.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Die Speicherkarte in Steckplatz %d startet beim Einschalten %s, und BOOT LOCK fand keine Konfiguration davon zum Ändern (gesucht wird %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Die Speicherkarte in Steckplatz %d startet beim Einschalten %s, das BOOT LOCK nicht einstellen kann: Es arbeitet über PS2BBL, FMCB und OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Auf dieser Konsole ist ein Bootloader mit der Sperre von RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT eines Spiels: der Browser, dann dein Bootloader (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'In Gebrauch: %s, %d Bilder, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Es wird gemessen, wie schnell jedes Laufwerk seine Bilder liest: %s'
  'None: each picture is read from its own ART folder.': 'Keins: Jedes Bild wird aus seinem eigenen ART-Ordner gelesen.'
  REMOVE the pack in %s (the ART folders stay as they are): Das Paket in %s ENTFERNEN (die ART-Ordner bleiben, wie sie sind)
  Remove the ART Pack in %s? The ART folders stay as they are.: Das ART-Paket in %s entfernen? Die ART-Ordner bleiben, wie sie sind.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Angehalten. Das unfertige Paket wurde entfernt, und die Bilder kommen wie zuvor aus den ART-Ordnern.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Das ART-Paket konnte nicht nach %s geschrieben werden (ist auf dem Laufwerk Platz?). Sonst hat sich nichts geändert: Die Bilder kommen wie zuvor aus den ART-Ordnern.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Das ART-Paket in %s ist entfernt. Die Bilder kommen wieder aus den ART-Ordnern.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Auf den gestarteten Laufwerken gibt es keinen ART-Ordner mit Bildern. Starte die Laufwerke mit deinen Bildern (SELECT auf ihrer Seite) und komm dann zurück.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d Bilder aus %d ART-Ordnern kommen in eine Datei, %s. Die ART-Ordner bleiben, wie sie sind: Das Paket ist eine Kopie. Du kannst art.tar mit Memory Files in den ART-Ordner eines anderen Laufwerks kopieren, aber am schnellsten ist es, das Paket auf dem Laufwerk zu bauen, auf dem du stöberst, deshalb steht das schnellste Laufwerk oben. Jetzt bauen?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Das ART-Paket ist gebaut: %d Bilder, %d MB, in %s (%d s). Die Bilder kommen ab jetzt daraus, und bei den %d Spielen, für die es gebaut wurde, wird ihr ART-Ordner nie mehr Bild für Bild gefragt. Bilder, die RIPPS2 holt oder aufnimmt, erscheinen sofort; Bilder, die du am PC hineinkopierst, erscheinen, wenn du das Paket neu baust.'
  '%s free': '%s frei'
