  HINT_GAME_VIEW_MODE: Alle listet PS2- und PS1-Spiele zusammen, und L3 wechselt zwischen Alle, PS1 und PS2. PS2 oder PS1 zeigt nur diesen Typ und schaltet L3 ab. APPS und Lieblingsspiele haben eigene Anzeigeregeln.
