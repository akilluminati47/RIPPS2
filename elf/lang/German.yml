  'This disc is not compatible: it is a region %d DVD, and this console plays another region''s DVDs. Start it anyway?': 'Diese Disc ist nicht kompatibel: Sie ist eine DVD der Region %d, und diese Konsole spielt DVDs einer anderen Region. Trotzdem starten?'
  ? 'This disc is not compatible: it reads as DVD video but has no DVD video on it (no VIDEO_TS), so a DVD player cannot play it.'
