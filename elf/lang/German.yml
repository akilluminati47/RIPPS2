  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL wird von der Konsole an diese Karte gebunden und als %s/%s geschrieben.
  
    - Seine Konfiguration, mc%d:/SYS-CONF/PS2BBL.INI, startet RIPPS2 dort, wo es liegt (%s), ohne Wartezeit (0 ms, was PS2BBL Extended nicht erlaubt), BOOT LOCK an. RIPPS2 selbst wird nicht kopiert.
  
    Der I/O-Prozessor startet dafür neu, und jedes Lesen von Laufwerken stoppt, bis es fertig ist; Musik und Laufwerke kommen danach zurück. Lass die Karte drin und die Konsole an, bis es fertig meldet.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Eine SD2PSX- oder MMCE-Karte kann sich nach einem abgelehnten Schreiben schützen: Fehlen jetzt die Speicherkarte oder das MMCE-Laufwerk, schalte die Konsole aus und wieder ein.'
