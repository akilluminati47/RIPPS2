  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 toca a música do menú desta consola, a peza ambiental do seu navegador (%d:%02d), a partir das propias notas da BIOS e escríbea como un WAV de %s en %s; ningunha tarxeta de memoria ten sitio para ela. Substitúese o %s que xa estea alí. Leva un ou dous minutos.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 le os sons da propia BIOS desta consola e escríbeos en %s como os seus sons: cursor, confirmar, cancelar, páxinas, categoría, mensaxes, disco, erro, gardar, unidades e aleatorio, e a música de arranque e de inicio de xogo, tocadas coas propias notas da BIOS. Substitúense os ficheiros con eses nomes que xa estean alí.'
