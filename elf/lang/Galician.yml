  Starts every drive now (USB, the HDD, MMCE, MX4SIO and the network), so each one and its space shows here.: Inicia agora cada unidade (USB, o disco duro, MMCE, MX4SIO e a rede), para que cada unha e o seu espazo aparezan aquí.
