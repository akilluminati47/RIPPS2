  ', the sounds': ', os sons'
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'O Fast Boot está activado. RIPPS2 arranca desde a súa propia unidade (%s): a configuración%s e cada lista desde a súa caché. As outras unidades inícianse cando premes SELECT na súa páxina ou inicias un dos seus xogos.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: O Fast Boot está activado. Os sons ocupan %d KB e a tarxeta de memoria desde a que funciona RIPPS2 ten %d KB libres, así que quedan en %s.
  ' (%d KB free)': ' (%d KB libres)'
  ' (%u MB free)': ' (%u MB libres)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'XUNTO A RIPPS2: %sAUDIO%s, lese primeiro ao arrancar'
  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- A consola vincula PS2BBL 1.2.0 a esta tarxeta e escríbeo como %s/%s.
  
    - A súa configuración, mc%d:/PS2BBL/CONFIG.INI, inicia RIPPS2 onde está (%s) sen espera (0 ms, que PS2BBL Extended non permite), BOOT LOCK activado. RIPPS2 non se copia.
  
    O procesador de E/S reiníciase para isto e toda lectura de unidades detense ata rematar; a música e as unidades volven despois. Deixa a tarxeta posta e a consola acendida ata que diga que rematou.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Unha tarxeta SD2PSX ou MMCE pode protexerse tras unha escritura rexeitada: se agora falta a tarxeta de memoria ou a unidade MMCE, apaga e acende a consola.'
  BOOT LOCK ON: BOOT LOCK ACTIVADO
  'Done: the memory card in slot %d starts what it started before BBL 1.20. BBL 1.20 is kept in mc%d:/%s.': 'Feito: a tarxeta de memoria da rañura %d inicia o que iniciaba antes de BBL 1.20. BBL 1.20 gárdase en mc%d:/%s.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
    '
  : 'Para unha tarxeta de memoria PS2 estándar de 8 MB (unha MagicGate, ou unha tarxeta BOOT de SD2PSX ou MMCE): a da rañura %d. Ao acender, PS2BBL le a configuración da rañura 2 antes que a da rañura 1.
  
    '
  MEMORY CARD IN SLOT %d  (%s): TARXETA DE MEMORIA NA RAÑURA %d  (%s)
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL 1.2.0 non pode iniciar RIPPS2 desde onde está agora (chega a tarxetas de memoria, unidades USB e MX4SIO), e RIPPS2 non se copia a si mesmo. Pon RIPPS2.ELF nunha tarxeta de memoria ou nunha unidade USB e iníciao desde alí, ou usa PS2BBL Extended, que le MMCE e o disco duro.
  RESTORE SLOT %d'S OLD BOOT LOADER: RESTAURAR O CARGADOR ANTERIOR DA RAÑURA %d
  ? 'RIPPS2: BBL 1.20 is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BBL 1.20 está instalado na tarxeta de memoria da rañura %d (mc%d:/%s/%s), BOOT LOCK activado: ao acender inicia RIPPS2 desde %s, ao momento.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    '
  : 'RIPPS2: instalando BBL 1.20
  
    '
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: instalando BBL 1.20
  
    RIPPS2 funciona desde %s, que PS2BBL 1.2.0 non pode ler (le tarxetas de memoria, USB e MX4SIO), e RIPPS2 non se copia a si mesmo. A configuración de PS2BBL Extended desta tarxeta (%s) si o le: START activa BOOT LOCK para que inicie RIPPS2 desde %s ao acender. Nada máis cambia na tarxeta.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: instalando BBL 1.20
  
    RIPPS2 funciona desde %s, que PS2BBL 1.2.0 non pode ler: inicia programas desde unha tarxeta de memoria, unha unidade USB ou MX4SIO, e RIPPS2 non se copia a si mesmo. Pon RIPPS2.ELF nun deles (o cartafol APPS dunha tarxeta de memoria ou unha unidade USB), iníciao desde alí e volve instalar BIBLE.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    The memory card in slot %d: BBL 1.20 (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: instalando BBL 1.20
  
    A tarxeta de memoria da rañura %d: BBL 1.20 (mc%d:/%s) ponse a un lado e o que substituíu (mc%d:/%s) volve ao seu sitio. Non se borra nada. A configuración de PS2BBL queda como está (BOOT LOCK pode quitar o bloqueo).'
  'RIPPS2: Setting up BBL 1.20 (binding PS2BBL to the memory card)': 'RIPPS2: instalando BBL 1.20 (vinculando PS2BBL á tarxeta de memoria)'
  'RIPPS2: Setting up BBL 1.20 (putting back what was there)': 'RIPPS2: instalando BBL 1.20 (devolvendo o que había)'
  'RIPPS2: Setting up BBL 1.20 (restarting the I/O processor)': 'RIPPS2: instalando BBL 1.20 (reiniciando o procesador de E/S)'
  'RIPPS2: Setting up BBL 1.20 (writing it to the memory card)': 'RIPPS2: instalando BBL 1.20 (escribíndoo na tarxeta de memoria)'
  SET UP BBL 1.20: INSTALAR BBL 1.20
  ? 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: Setting up BBL 1.20. PS2BBL 1.2.0 by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?'
  : 'RAÑURA 1: %s
  
    RAÑURA 2: %s
  
    %s
  
    RIPPS2: instalando BBL 1.20. PS2BBL 1.2.0 de El Isra, instalado por RIPPS2 nunha tarxeta de memoria PS2 estándar de 8 MB ou no disco duro interno: un inicio de 0 ms ao acender (PS2BBL Extended non permite 0), RIPPS2 primeiro desde onde está (nunca se copia), e un botón mantido ao acender aínda leva ao navegador (TRIANGLE), a un disco (START) e ao que había antes (CIRCLE). Instalalo, reparalo ou restaurar o que substituíu?'
  The memory card in slot %d has %d KB free, and BBL 1.20 needs %d KB there. Free some space, then try again.: A tarxeta de memoria da rañura %d ten %d KB libres e BBL 1.20 precisa %d KB nela. Libera espazo e volve tentalo.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : A tarxeta de memoria da rañura %d rexeitou PS2BBL, así que RIPPS2 deixou a tarxeta como estaba. Comproba o seu espazo libre e volve tentalo. (DIAG.TXT xunto a RIPPS2 ten o que dixo a tarxeta.)
  ? The memory card in slot %d would not move BBL 1.20 aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : A tarxeta de memoria da rañura %d non quixo apartar BBL 1.20, así que non cambiou nada. (DIAG.TXT xunto a RIPPS2 ten o que dixo a tarxeta.)
  The memory card in slot %d would not take %s back, so BBL 1.20 stayed. (DIAG.TXT beside RIPPS2 has what the card said.): A tarxeta de memoria da rañura %d non quixo recuperar %s, así que BBL 1.20 quedou. (DIAG.TXT xunto a RIPPS2 ten o que dixo a tarxeta.)
  MUSIC: MÚSICA
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s non ten %s. RIPPOPS atopou o emulador de PS1 de Sony en %s: START copia %s aquí e inicia o xogo.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 non ve %s en %s%s. POPSTARTER precisa POPS_IOX.PAK con POPS.PAK, ou con POPS.ELF e IOPRP252.IMG: o emulador de PS1 de Sony, da túa propia consola. Pode atopalos onde RIPPS2 non mira (se os teus xogos arrancan, atópaos). START inicia, e non se volve preguntar por esta unidade.'
  ' (The configs found were set: %s.)': ' (Axustáronse as configuracións atopadas: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Garda os seus axustes unha vez co seu propio configurador e volve activar BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s non pode iniciar RIPPS2 desde onde está agora (%s), e RIPPS2 non se copia a si mesmo. Pon RIPPS2.ELF nunha tarxeta de memoria ou nunha unidade USB e inícialo desde alí.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK non puido escribir a configuración do cargador de arranque. Comproba que a tarxeta de memoria ou a unidade non estea protexida contra escritura e volve tentalo.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK non atopou ningunha configuración de cargador de arranque que cambiar.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK está desactivado. O teu cargador de arranque inicia o que iniciaba antes (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK está activado. %s inicia agora RIPPS2 ao acender (%s), e unha Ruta do IGR baleira devolve o EXIT dun xogo polo mesmo camiño. Mantén un dos seus botóns mentres a consola arrinca para chegar a calquera outra cousa.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL 1.2.0 on a memory card (Boot Loader).'
  : 'BOOT LOCK puxo RIPPS2 o primeiro no menú de OSDMenu (%s). OSDMenu non inicia nada por si mesmo: escolle alí RIPPS2, e o EXIT dun xogo volve a ese menú. Para unha consola que inicie RIPPS2 de inmediato, BIBLE pon PS2BBL 1.2.0 nunha tarxeta de memoria (Cargador de arranque).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK funciona a través dun cargador de arranque nunha tarxeta de memoria (PS2BBL, FMCB ou OSDMenu), e aquí non hai ningún.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: A tarxeta de memoria da rañura %d inicia %s ao acender, e BOOT LOCK non atopou ningunha configuración súa que cambiar (busca %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'A tarxeta de memoria da rañura %d inicia %s ao acender, que BOOT LOCK non pode axustar: funciona a través de PS2BBL, FMCB e OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Nesta consola hai un cargador de arranque co bloqueo de RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT dun xogo: o navegador, despois o teu cargador de arranque (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'En uso: %s, %d imaxes, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Medindo a que velocidade le cada unidade as súas imaxes: %s'
  'None: each picture is read from its own ART folder.': 'Ningún: cada imaxe lese do seu propio cartafol ART.'
  REMOVE the pack in %s (the ART folders stay as they are): QUITAR o paquete de %s (os cartafoles ART quedan como están)
  Remove the ART Pack in %s? The ART folders stay as they are.: Quitar o paquete ART de %s? Os cartafoles ART quedan como están.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Detido. Quitouse o paquete sen rematar, e as imaxes cárganse dos cartafoles ART coma antes.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Non se puido escribir o paquete ART en %s (hai espazo nesa unidade?). Nada máis cambiou: as imaxes cárganse dos cartafoles ART coma antes.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Quitouse o paquete ART de %s. As imaxes volven cargarse dos cartafoles ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Non hai ningún cartafol ART con imaxes nas unidades iniciadas. Inicia as unidades onde están as túas imaxes (SELECT na súa páxina) e despois volve.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d imaxes de %d cartafoles ART van a un só ficheiro, %s. Os cartafoles ART quedan como están: o paquete é unha copia. Podes copiar art.tar ao cartafol ART doutra unidade con Memory Files, pero crealo na unidade desde a que navegas é o máis rápido, por iso a unidade máis rápida aparece primeiro. Crealo agora?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'O paquete ART está listo: %d imaxes, %d MB, en %s (%d s). As imaxes cárganse del a partir de agora, e aos %d xogos para os que se creou nunca máis se lles pregunta ao seu cartafol ART imaxe por imaxe. As imaxes que RIPPS2 descarga ou captura aparecen ao momento; as que copias desde un PC aparecen cando volves crear o paquete.'
  '%s free': '%s libres'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: le %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: le %s/s, a máis rápida, %s'
  ART PACK: PAQUETE ART
  About %d min: Uns %d min
  'Looking at the ART folders: %d pictures, %s': 'Revisando os cartafoles ART: %d imaxes, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 'Ningunha unidade iniciada ten espazo para o paquete ART: precisa uns %s. Libera espazo na unidade desde a que navegas e téntao de novo.'
  PACKING THE ART: EMPAQUETANDO AS IMAXES
  PICTURE %d OF %d: IMAXE %d DE %d
  'Pictures: %d (%s). ART folders: %d.': 'Imaxes: %d (%s). Cartafoles ART: %d.'
