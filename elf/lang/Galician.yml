  RA_WL_NOT_SAVED: Non se puido gardar a lista de seguimento. Asegúrese de que o dispositivo ou recurso do xogo admite escritura e comprobe de novo.
  RA_UDPFS_LOAD_FIRST: Abra unha vez a páxina UDPFS para que cargue o seu módulo de rede e inténteo de novo.
  CAD_UDPFS_IMG: 'O navegador de Caduceus precisa SMB ou UDPFS Ficheiros: UDPFS IMG non ten cartafol compartido para a súa clave.'
  XERA_SET_CLOCK: Aínda non está na súa biblioteca de RetroAchievements. Axuste o reloxo da consola na configuración do sistema para ver a lista completa, ou xógueo unha vez con logros.
  CFG_TITLES: Mostrar os títulos CFG nas listas de xogos
  HINT_CFG_TITLES: Mostra o título do CFG de cada xogo en vez do nome do ficheiro, e ordena por el. Le cada CFG ao actualizar unha lista, así que as listas cargan máis amodo. Só para a vista.
  AUTO_VMC_INVALID: O ficheiro VMC deste xogo existe pero non é unha tarxeta de memoria válida, así que non se usou nin se substituíu. O xogo comeza sen el; compróbeo no menú VMC.
  AUTO_VMC_STILL_RUNNING: O VMC deste xogo aínda se está a crear. Inicie o xogo de novo nun momento.
  NEUTRINO_DVR_QUICKBOOT: O inicio DVR require a transición ao modo PSX. Quite -qb dos argumentos de Neutrino globais e por xogo.
  NEUTRINO_DVR_FILE_MISSING: 'A instalación de Neutrino para DVR está incompleta. Falta un ficheiro necesario:'
  LOGOART: Imaxe do logotipo
  HINT_LOGOART: Mostra o logotipo dun xogo (<ID>_LGO) cando o tema o usa. Desactivado oculta tamén a súa imaxe predeterminada, pero mantén portadas, imaxes de disco e fondos.
  PARENLOCK_GAME: Control parental
  PARENLOCK_GAME_HINT: Pide o contrasinal do control parental para iniciar este xogo.
  PARENLOCK_GAME_NO_PASSWORD: Defina un contrasinal de control parental, ou este xogo non quedará bloqueado.
  HINT_ENABLE_PCCF: CompactFlash por PC CARD das primeiras PS2 xaponesas. Só xogos nativos de PS2; CF precisa acceso exclusivo á PC CARD. Reinicie para liberalo.
  PCCF_GAMES: Xogos PC CARD CF
  PCCF_UNAVAILABLE: 'CF non dispoñible: require unha PS2 xaponesa temperá con PC CARD, unha tarxeta compatible e ningún controlador DEV9/HDD/rede activo.'
  PCCF_UNSUPPORTED_GAME: CF admite agora só xogos nativos de PS2. Non están dispoñibles VMC en CF, a carga de PS1 nin os logros en rede.
  HINT_ENABLE_DVR: Descubrimento experimental de ISO de DESR DVR. Require a orixe HDD activada; iniciar un xogo require un Neutrino externo compatible con DVR.
  HINT_RIPPS2_IGR_PAGE: O menú no xogo, RIPSHOT e como se revelan as fotos.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Capturas dende o menú no xogo, a ART para os teus temas ou a MEDIA.
  RIPPS2_DEVELOP_SHOTS: Revelar fotos
  HINT_RIPPS2_DEVELOP_SHOTS: Como as fotos que agardan no rolo de cada xogo se fan PNG.
  RIPPS2_SETTINGS_HOME: Gardar axustes en
  HINT_RIPPS2_SETTINGS_HOME: 'Onde garda o RIPPS2 os seus axustes: o seu propio gardado nunha tarxeta de memoria, un cartafol RIPPS2 nunha unidade (o HDD interno, USB, MX4SIO, iLink ou MMCE) ou un cartafol que escribas.'
  RIPPS2_LAUNCHERS: Lanzadores
  RIPPS2_LOOK_NOW: Buscar agora
  HINT_RIPPS2_LOOK_NOW: RIPPS2 busca nas unidades iniciadas POPSTARTER, os ficheiros POPS, Ember, a BIOS de Ember e Neutrino, e lembra onde está cada un. Cada inicio léeos de aí.
  RIPPS2_HIDE_GAME: Ocultar xogo
  RIPPS2_HIDDEN_GAMES: Xogos ocultos
  HINT_RIPPS2_HIDDEN_GAMES: Os xogos ocultos con Ocultar xogo, nas unidades iniciadas. Volva mostrar un, ou bórreo. Cada unidade garda a súa propia lista.
  HINT_RIPPS2_BDM_DEVICES: 'As unidades das que BDM le xogos: USB, MX4SIO, unha PC Card CF, a unidade DVR dun DESR e iLink. O HDD interno segue o modo de inicio do HDD.'
  HINT_RIPPS2_SCREEN: 'A imaxe do menú: modo de vídeo, pantalla ancha, onde queda na televisión (H-POS, V-POS) e overscan.'
  HINT_RIPPS2_LAYOUT: Onde van as categorías e como entra unha páxina, despois as portadas de RIPFLOW e a grade de RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Grosor do texto, a cor do tema, a transición de cores e cada cor.
  HINT_RIPPS2_TEXT_WEIGHT: 'O grosor do texto propio de RIPPS2: as axudas da configuración, ESTADO e Acerca de. Normal é coma antes; Negra lese mellor sobre unha imaxe suave. As fontes propias dun tema conservan os grosores que este lles dá.'
  HINT_RIPPS2_HDD_START: 'O disco duro interno, APA ou exFAT: RIPPS2 le o que sexa e amósao unha vez, como Xogos Disco duro. Automático (o máis rápido cun disco posto) iníciao no arranque; Desactivado déixao en paz.'
  HINT_RIPPS2_THEME_COLOR: A cor propia do tema. Escolle Personalizada como cor do tema para escollela ti, como as cores do texto.
  HINT_RIPPS2_SWEEP: Cinco cores polas que pasa o tema, amodo e suavemente. Arco da vella, unha transición feita de cada cor de tema ou a túa. Desactivado deixa o tema quedo.
  HINT_RIPPS2_SWEEP_COLORS: As cinco cores da transición e a súa velocidade. Cambia unha das de RIPPS2 e gárdase como túa, co nome que lle deas.
  HINT_RIPPS2_SWEEP_NAME: Como se chama a túa transición na lista Transición de cores.
  HINT_RIPPS2_SWEEP_COLOR: Unha das cinco cores polas que pasa a transición, en orde.
  HINT_RIPPS2_SWEEP_SPEED: 'Canto dura cada cor antes de que entre a seguinte. Mesmo Vivo segue suave: as cores nunca escintilan.'
  RIPPS2_HIDE_COMPRESS: Ocultar xogo e compresión
  HINT_RIPPS2_SELECT_HOLD: 'SELECT mantido 4.2 s nunha lista de xogos. Lista: os temas nun panel, escolle un. Rotación: o tema seguinte. Desactivado: nada (unha pulsación aínda actualiza).'
  RIPPS2_RECENT_GAMES: Xogos recentes
  RIPPS2_SET_METADATA_RENAME: Fixar metadatos (renomear)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Mando primeiro (experimental)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'O SD2PSX le polo bus que comparte o mando, e mentres dura unha lectura o mando non se oe: as pulsacións atrásanse ou pérdense mentres cargan as portadas. Activado: as portadas chegan en anacos pequenos co mando lido entre eles, algo máis lento. Desactivado: tan rápido como vai a tarxeta. Coas fontes da tarxeta en Automático, a súa lista cárgase unha vez, no arranque.'
  HINT_RIPPS2_TRUST_CACHE: 'Unha lista amosada desde a súa caché queda como está, lista para iniciar, ata que prema SELECT ou RIPPS2 cambie esa fonte por si mesmo. Desactivado: cada fonte vólvese ler en segundo plano despois de amosar a súa caché, unha pausa que se nota nunha tarxeta MMCE ou MX4SIO, que comparten o bus do mando.'
  RIPPS2_STATUS_OPEN: Carga e unidades
  HINT_RIPPS2_STATUS_OPEN: 'Abre ESTADO: onde le o arranque a configuración e as listas de xogos, que lugar é o máis rápido, a onde vai o EXIT dun xogo, e cada unidade. O seu CONFIGURACIÓN DA CACHÉ volve aquí.'
  RIPPS2_BADGE_SET: Xogo de insignias
  HINT_RIPPS2_BADGE_SET: 'As insignias da páxina de información dun xogo (clasificación, xogadores, ESRB, modo de vídeo, varrido, aspecto). RIPPS2: o seu propio xogo, igual en todos os temas. Tema: as imaxes propias do tema, ou as de RIPPS2 cando o tema as pide.'
  RIPPS2_HINT_FADE: Esvaecer axudas e glifos
  HINT_RIPPS2_HINT_FADE: 'Unha axuda de botón ou un glifo que cambia aparece esvaecendo, coma as portadas, no momento en que cambia; os que quedan non se tocan, en cada páxina e mensaxe. Desactivado: simplemente aparecen. Tema: decide o tema (activado salvo que diga hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Estilo da barra lateral
  HINT_RIPPS2_SIDEBAR_STYLE: 'Clásico (dividido): as iconas na franxa escura da barra lateral, coa tira de cor ao lado. XL (unha peza): unha soa franxa máis ancha, coas iconas no medio. Tema: decide o tema.'
  HINT_EXITPATH: 'Onde leva EXIT no menú no xogo. Mellor baleiro: EXIT leva ao navegador, que inicia o teu cargador de arranque (FreeMcBoot, PS2BBL, OSDMenu ou BIBLE) se hai un instalado, e de novo RIPPS2 con BOOT LOCK activado, como ao acender; sen ningún, o navegador da PS2. Un ELF escrito aquí só se usa cando o reinicio pode cargalo (nunha tarxeta de memoria ou nunha unidade USB FAT32) e non é o propio RIPPS2; todo o demais leva ao navegador.'
  HINT_BDM_START: 'USB, iLink, MX4SIO e o disco duro exFAT. Automático iníciaos no arranque: o máis rápido para as unidades que teña conectadas, cos seus xogos en Todos os xogos desde o comezo. Manual iníciaos ao abrir a súa páxina.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'O arranque só le a unidade de RIPPS2: a configuración e os sons xunto a RIPPS2.ELF (RIPPS2.FB alí di onde) e cada lista desde a súa caché. As outras unidades agardan: SELECT nunha páxina inicia as súas unidades e trae as imaxes (coa actualización automática inícianse ao arrancar). Activalo copia os teus sons, e a música se hai espazo, a AUDIO xunto a RIPPS2.'
  RIPPS2_ART_PACK: Paquete ART
  RIPPS2_ART_PACK_BUILD: Crear ou quitar
  HINT_RIPPS2_ART_PACK: Xunta o cartafol ART de cada unidade iniciada nun só art.tar na unidade que escollas (a máis rápida ofrécese primeiro). As portadas cárganse entón dun ficheiro cun índice, nunca cunha procura por xogo, e os menús e a música van fluídos. Os cartafoles ART quedan como están.
  RIPPS2_LIST_CFG_TEXT: Título e descrición na lista
  HINT_RIPPS2_LIST_CFG_TEXT: 'O título e a descrición do xogo da súa CFG xunto á lista. Tema: como os mostre o tema (o tema propio de RIPPS2 ocúltaos). A páxina de información consérvaos sempre.'
  RIPPS2_PS1_PREFER: Duplicados de PS1
  HINT_RIPPS2_PS1_PREFER: 'Un xogo de PS1 que é á vez un VCD de POPSTARTER e unha imaxe de Ember. Ambos: dúas filas. Ember: só a de Ember. POPSTARTER: só o VCD. O mesmo título, sen a ID de disco diante, é o mesmo xogo.'
  RIPPS2_MY_PADS: Os meus mandos
  HINT_RIPPS2_MY_PADS: 'Os perfís .pad do cartafol PADS xunto a RIPPS2: un ficheiro de texto por mando USB, co nome da súa ID (2563_0575.pad), cada un comprobado. RIPPS2 lidera o formato; PADEMU léos nunha build posterior.'
