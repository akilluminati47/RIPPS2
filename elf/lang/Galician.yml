  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS no menú do xogo activa ou desactiva cada truco do xogo mentres xogas. Os cambios aplícanse en RESUME; un truco desactivado deixa de escribir, o que escribiu queda. Precisa os Cheats activados para o xogo.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Sen CHEATS no menú do xogo: os trucos marcados antes do inicio funcionan todo o xogo, como antes.'
