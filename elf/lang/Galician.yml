  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: escribindo PS2BBL na zona de arranque do HDD'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALAR BIBLE NO HDD INTERNO

    - RIPPS2 cópiase en %s.

    - O programa de arranque do HDD que hai agora en __mbr lese e gárdase en %s/RIPPS2 (RESTAURAR repóñeo).

    - No seu lugar escríbese a compilación para HDD de PS2BBL 1.2.0, e axústase a consola para inicialo ao acender.

    - A súa configuración (%s) inicia RIPPS2 primeiro desde %s%s%s, con BOOT LOCK activado.

    Isto require unha consola que arranque desde o seu HDD (unha PS2 grosa co adaptador de rede). Manteña a consola acesa ata que diga feito.'
  INTERNAL HDD  (its boot area): HDD INTERNO  (a súa zona de arranque)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'REPOÑER O PROGRAMA DE ARRANQUE ANTIGO DO HDD

    O que gardou BIBLE (RIPPS2/MBR-BACKUP.KELF no HDD) volve a __mbr, no lugar de BIBLE. RIPPS2 e a configuración de PS2BBL quedan onde están.'
  RESTORE: RESTAURAR
