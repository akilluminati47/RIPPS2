  RIPFLOW's type, and every message and notification: a letra de RIPFLOW, e de cada mensaxe e aviso
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Grazas a todos os que proban en Discord e abren issues en GitHub:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'O IGR Path %s non se usa: tras un xogo só pode cargar un ficheiro dunha tarxeta de memoria ou USB, e nunca o propio RIPPS2'
  an issue is the best way to get RIPPS2 updated.: unha issue é a mellor maneira de que RIPPS2 se actualice.
  your Ogg and MP3 music, as RIPPS2 plays it: a túa música Ogg e MP3, tal como a reproduce RIPPS2
  Pop In and Name: Emerxer e nome
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s arrinca despois dos piares, así que o son de arranque soa tarde. START copia boot.adp (%d KB) xunto a RIPPS2 na tarxeta de memoria (%d KB libres), onde soa mentres se erguen os piares.'
  The boot sound could not be copied to %s. It still plays from %s.: Non se puido copiar o son de arranque a %s. Aínda soa desde %s.
  Zoom: Zoom
  '%s could not be deleted; it stays as it was.': Non se puido borrar %s; queda como estaba.
  '%s could not be read as a .tar archive. Nothing was changed.': Non se puido ler %s como arquivo .tar. Non se cambiou nada.
  '%s is deleted. %s is kept.': '%s está borrado. %s consérvase.'
  Art loads from it from now on.: As imaxes cárganse del a partir de agora.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : 'Borrar o .tar fusionado?
  
    BÓRRASE: %s
  
    CONSÉRVASE: %s (o destino, agora con todas as imaxes dos dous)'
  Into %s (%s): En %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : 'CONSÉRVASE e actualízase: %s (%d imaxes)
  
    FUSIÓNASE: %s (%d imaxes)
  
    Imaxes nos dous: %d. Gaña a fusionada. O .tar conservado escríbese de novo como ficheiro novo e só se troca cando está completo, así que unha parada ou unha unidade chea déixao como estaba. Fusionar agora?'
  MERGE .TAR: FUSIONAR .TAR
  MERGE a .tar into the pack in %s: FUSIONAR un .tar no paquete de %s
  MERGING THE ART: FUSIONANDO AS IMAXES
  Merge in %s (%s): Fusionar %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Fusionar o paquete novo noutro .tar? Despois escolles o .tar que se conserva e actualiza; as imaxes do paquete novo van nel.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Fusionado: %s agora ten %d imaxes (%d MB), %d s.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Imaxes que entran: %d (%s). Mesmo nome nos dous: %d (gaña a fusionada).'
  'Reading the archives: %s': 'Lendo os arquivos: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Parar? O .tar conservado queda como estaba; quítase a copia sen rematar.
  Stopped. %s is as it was; the unfinished copy was removed.: Parado. %s está como estaba; quitouse a copia sen rematar.
  The kept .tar is only replaced once the merged copy is whole.: O .tar conservado só se substitúe cando a copia fusionada está completa.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Non se puido escribir a fusión na unidade de %s (hai espazo?). Está como estaba; non cambiou nada máis.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : A fusión precisa uns %s libres na unidade de %s (o arquivo novo escríbese primeiro xunto ao vello). Libera algo de espazo e volve tentalo.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'A fusión parou entre dous cambios de nome: o .tar conservado é %s e o fusionado %s. Devólvelles o nome con Ficheiros da memoria.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : O .tar fusionado escribiuse pero non puido tomar o nome %s (unha MMCE cambia nomes desde o firmware 1.4.0). Quitouse o ficheiro novo; o .tar conservado está como estaba.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : Non hai outro .tar que fusionar en %s. Ponno neste cartafol, no cartafol ART dunha unidade ou na raíz dunha unidade e volve tentalo.
