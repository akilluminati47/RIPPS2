  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : Activado (rápido) garda o son de inicio xunto a RIPPS2 na tarxeta de memoria desde a que arranca, e RIPPS2 non arrancou desde unha. O son de inicio soa como Activado.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'Aínda non hai son de inicio para copiar: Axustes de audio > Sons da BIOS extrae os desta consola.'
  ? This is RIPPS2 lite, which carries no PS2BBL, so it cannot set up BIBLE. The full RIPPS2.elf installs and repairs it; a boot loader already set up keeps starting RIPPS2 lite as it is.
  : Isto é RIPPS2 lite, que non leva PS2BBL, así que non pode instalar BIBLE. O RIPPS2.elf completo instálao e repárao; un cargador xa instalado segue arrancando RIPPS2 lite tal cal.
