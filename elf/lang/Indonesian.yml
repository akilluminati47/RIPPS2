  : Kartu memori di slot %d menolak PS2BBL, jadi RIPPS2 membiarkan kartu seperti semula. Periksa ruang kosongnya, lalu coba lagi. (DIAG.TXT di samping RIPPS2 berisi jawaban kartu.)
  ? The memory card in slot %d would not move BBL 1.20 aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Kartu memori di slot %d tidak mau memindahkan BBL 1.20, jadi tidak ada yang berubah. (DIAG.TXT di samping RIPPS2 berisi jawaban kartu.)
  The memory card in slot %d would not take %s back, so BBL 1.20 stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Kartu memori di slot %d tidak mau menerima kembali %s, jadi BBL 1.20 tetap ada. (DIAG.TXT di samping RIPPS2 berisi jawaban kartu.)
