  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTAL BIBLE DI HDD INTERNAL

    - RIPPS2 disalin ke %s.

    - Program boot HDD yang sekarang ada di __mbr dibaca dan disimpan di %s/RIPPS2 (PULIHKAN mengembalikannya).

    - Build HDD PS2BBL 1.2.0 ditulis di tempatnya, dan konsol diatur untuk menjalankannya saat menyala.

    - Konfigurasinya (%s) menjalankan RIPPS2 dari %s%s%s lebih dulu, BOOT LOCK menyala.

    Ini butuh konsol yang boot dari HDD-nya (PS2 tebal dengan adaptor jaringan). Biarkan menyala sampai muncul tulisan selesai.'
  INTERNAL HDD  (its boot area): HDD INTERNAL  (area boot-nya)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'KEMBALIKAN PROGRAM BOOT LAMA HDD

    Yang disimpan BIBLE (RIPPS2/MBR-BACKUP.KELF di HDD) kembali ke __mbr, menggantikan BIBLE. RIPPS2 dan konfigurasi PS2BBL tetap di tempatnya.'
