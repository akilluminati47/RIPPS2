  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL 1.2.0 on a memory card (Boot Loader).'
  : 'BOOT LOCK menaruh RIPPS2 di urutan pertama menu OSDMenu (%s). OSDMenu tidak menjalankan apa pun sendiri: pilih RIPPS2 di sana, dan EXIT dari game kembali ke menu itu. Untuk konsol yang langsung menjalankan RIPPS2, BIBLE memasang PS2BBL 1.2.0 di kartu memori (Boot Loader).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK bekerja lewat boot loader di kartu memori (PS2BBL, FMCB, atau OSDMenu), dan di sini tidak ada.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: 'Kartu memori di slot %d menjalankan %s saat menyala, dan BOOT LOCK tidak menemukan konfigurasinya untuk diubah (yang dicari: %s).'
