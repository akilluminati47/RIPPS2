  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 memainkan musik menu konsol ini, lagu suasana peramban (%d:%02d), dari not milik BIOS sendiri dan menulisnya sebagai WAV berukuran %s ke %s; tidak ada kartu memori yang muat. %s yang sudah ada di sana akan diganti. Butuh satu atau dua menit.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 membaca suara dari BIOS milik konsol ini dan menulisnya ke %s sebagai suaranya: kursor, terima, batal, halaman, kategori, pesan, disk, galat, simpan, drive, dan acak, serta musik boot dan peluncuran game, dimainkan dari not milik BIOS sendiri. File bernama sama yang sudah ada di sana akan diganti.'
