  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 sedang sibuk membaca drive dan tidak bisa memulai ulang prosesor I/O. Tidak ada yang diubah: coba lagi sebentar lagi.'
