  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: memasang BBL 1.20
  
    RIPPS2 berjalan dari %s, yang tidak bisa dibaca PS2BBL 1.2.0 (ia membaca kartu memori, USB, dan MX4SIO), dan RIPPS2 tidak menyalin dirinya sendiri. Konfigurasi PS2BBL Extended di kartu ini (%s) bisa membacanya: START menyalakan BOOT LOCK, sehingga ia menjalankan RIPPS2 dari %s saat dinyalakan. Tidak ada hal lain di kartu yang berubah.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: memasang BBL 1.20
  
    RIPPS2 berjalan dari %s, yang tidak bisa dibaca PS2BBL 1.2.0: ia menjalankan program dari kartu memori, drive USB, atau MX4SIO, dan RIPPS2 tidak menyalin dirinya sendiri. Taruh RIPPS2.ELF di salah satunya (folder APPS di kartu memori, atau drive USB), jalankan dari sana, lalu pasang BIBLE lagi.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    The memory card in slot %d: BBL 1.20 (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: memasang BBL 1.20
  
    Kartu memori di slot %d: BBL 1.20 (mc%d:/%s) dipindah ke samping, dan yang digantikannya (mc%d:/%s) kembali ke tempatnya. Tidak ada yang dihapus. Konfigurasi PS2BBL tetap seperti adanya (BOOT LOCK bisa mematikan kuncinya).'
  'RIPPS2: Setting up BBL 1.20 (binding PS2BBL to the memory card)': 'RIPPS2: memasang BBL 1.20 (mengikat PS2BBL ke kartu memori)'
  'RIPPS2: Setting up BBL 1.20 (putting back what was there)': 'RIPPS2: memasang BBL 1.20 (mengembalikan yang sebelumnya)'
  'RIPPS2: Setting up BBL 1.20 (restarting the I/O processor)': 'RIPPS2: memasang BBL 1.20 (memulai ulang prosesor I/O)'
  'RIPPS2: Setting up BBL 1.20 (writing it to the memory card)': 'RIPPS2: memasang BBL 1.20 (menulisnya ke kartu memori)'
