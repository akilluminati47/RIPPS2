  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL 1.2.0 tidak bisa menjalankan RIPPS2 dari tempatnya sekarang (ia menjangkau kartu memori, drive USB, dan MX4SIO), dan RIPPS2 tidak menyalin dirinya sendiri. Taruh RIPPS2.ELF di kartu memori atau drive USB lalu jalankan dari sana, atau gunakan PS2BBL Extended, yang membaca MMCE dan hard disk.
  RESTORE SLOT %d'S OLD BOOT LOADER: PULIHKAN BOOT LOADER LAMA DI SLOT %d
  ? 'RIPPS2: BBL 1.20 is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BBL 1.20 terpasang di kartu memori slot %d (mc%d:/%s/%s), BOOT LOCK aktif: saat dinyalakan ia langsung menjalankan RIPPS2 dari %s.'
