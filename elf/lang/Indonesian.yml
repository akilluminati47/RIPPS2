  HINT_RIPPS2_IGR_MENU: 'Nyala: L1+L2+R1+R2+SELECT+START menjeda game: lanjutkan, keluar, ambil tangkapan layar, lihat pencapaian, atau matikan. Mati: kombinasi langsung keluar dari game, seperti sebelumnya.'
  RIPPS2_BOOT_LOADER: Boot Loader
  HINT_RIPPS2_BOOT_LOADER: Menunjukkan apa yang dijalankan setiap kartu memori saat menyala, dan menginstal BIBLE (PS2BBL yang diatur untuk RIPPS2). File boot lama di kartu tetap disimpan.
  RIPPS2_MANAGE: Kelola
  RIPPS2_ACHIEVEMENTS: Pencapaian
  RIPPS2_NBD_SERVER: Server NBD
  HINT_RIPPS2_NBD_SERVER: Membagikan hard disk ke PC lewat jaringan. Layar status tetap tampil selama berjalan.
  RIPPS2_START: Mulai
  RIPPS2_COVER_ART: Sampul
  HINT_RIPPS2_COVER_ART: Mengunduh sampul untuk setiap game PS2 tanpa sampul di daftar yang sudah dimulai, ke folder ART di drive itu, dari ps2-covers milik xlenore di GitHub. Butuh kabel jaringan dan internet.
  RIPPS2_DOWNLOAD: Unduh
  RIPPS2_GLYPHS: Simbol D-pad
  HINT_RIPPS2_GLYPHS: 'Simbol D-pad di samping nama drive dan formasi. Muncul Perlahan menampilkannya saat kamu berganti; Hilang Perlahan menampilkannya saat halaman dibuka. Tema: tema yang memutuskan.'
  RIPPS2_COLOR_THEME: Tema Warna
  HINT_RIPPS2_COLOR_THEME: 'Satu warna untuk menara, bola, kaca, pemutar CD, dan peramban file, di ketiga tab. Tema: tema yang memutuskan (biru RIPPS2 jika tidak).'
  RIPPS2_HINTS: Petunjuk Tombol
  HINT_RIPPS2_HINTS: 'Petunjuk tombol di bagian bawah. Pudar Saat Diam menyembunyikannya sampai kamu menekan tombol. Tema: tema yang memutuskan.'
  RIPPS2_CATEGORY_BAR: Kategori/Bilah Samping
  HINT_RIPPS2_CATEGORY_BAR: 'LUNCURKAN DISK, PENYIMPANAN, dan FILE MEMORI: nama di atas, atau bilah samping. Pudar Saat Diam memudarkan nama, atau menggeser bilah samping, sampai kamu menekan tombol; langsung kembali. Tema: tema yang menentukan.'
  RIPPS2_SOURCE_NAME: Nama Sumber
  RIPPS2_STATUS: Status
  RIPPS2_SOURCE: Sumber
  HINT_RIPPS2_SOURCE_NAME: 'Nama sumber di atas game (SEMUA GAME, GAME HDD, dan seterusnya). Pudar Saat Diam memudarkannya bersama bilah kategori; Muncul justru menampilkannya besar di tengah halaman, seperti L3 menyebut nama daftar, di daftar pertama setelah boot dan setiap kali sumber berganti, lalu memudar. Muncul dan nama melakukan keduanya. Tema bisa menjadikan Muncul sebagai Tampil miliknya. Tema: tema yang memutuskan.'
  RIPPS2_RECENTS: Game Terbaru
  HINT_RIPPS2_RECENTS: 'Game Terbaru, halaman di bilah samping berisi game yang terakhir kamu luncurkan, terbaru di depan: berapa yang disimpan, 1 sampai 99 (Segitiga mengetik angkanya). Game yang drive-nya di Manual memulai drive itu saat kamu memilihnya. 0 mematikan halaman.'
  RIPPS2_CATEGORY_ORDER: Urutan Kategori
  HINT_RIPPS2_CATEGORY_ORDER: 'Menukar Luncurkan Disk dan File Memori: File Memori pertama dan Luncurkan Disk terakhir, di nama bilah maupun ikon bilah samping. Dibuat untuk RIPFLOW (Antarmuka > Tema). Tema: tema yang menentukan.'
  RIPPS2_MUSIC: Musik
  HINT_RIPPS2_MUSIC: Memutar file bgm di folder AUDIO di samping RIPPS2 dan di folder AUDIO milik OPL di setiap drive yang dimulai (Ogg tanpa tag, atau WAV 16-bit); yang bernama Menu diputar lebih dulu. Musik milik tema diputar sebagai gantinya.
  RIPPS2_BIOS_SOUNDS: Suara BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Menulis suara menu milik konsol ini dari BIOS-nya ke folder AUDIO sebagai suara RIPPS2 (di bawah 1 MB). Musik menu punya rip sendiri: Musik BIOS.'
  RIPPS2_RIP: Rip
  RIPPS2_HINTS_GLYPHS: Petunjuk dan Simbol
  HINT_RIPPS2_HINTS_GLYPHS: Tampilan petunjuk tombol dan simbol. Setiap baris dimulai dengan Tema, pilihan tema; pilihan lain apa pun adalah milikmu dan mengalahkan setiap tema.
  RIPPS2_HINT_LAYOUT: Tata Letak Petunjuk
  HINT_RIPPS2_STARSIDE: 'Letak bintang game favorit di daftar game. Kiri: kolomnya sendiri di awal setiap baris. Kanan: setelah judul. Tersembunyi (awal): tanpa bintang dan kolom, judul tampil penuh. Tema: sesuai tema. R3 memfavoritkan game apa pun pilihannya; tahan R3 4 detik di daftar untuk menyembunyikan bintang atau memunculkannya lagi (ini juga memfavoritkan game di bawah kursor).'
  HINT_RIPPS2_HINT_LAYOUT: 'Baris: petunjuk dalam satu garis. Kolom: satu petunjuk per baris, daftar menurun di samping, dimulai di tempat tema menaruh petunjuknya.'
  RIPPS2_HINT_LABELS: Label Petunjuk
  HINT_RIPPS2_HINT_LABELS: Simbol Saja hanya menggambar tombolnya, untuk simbol yang membawa kata-katanya sendiri. Lencana menyatukan simbol dan judul setiap petunjuk dalam satu lencana.
  RIPPS2_HINT_MENU: Petunjuk Menu (START)
  RIPPS2_HINT_REFRESH: Petunjuk Segarkan (SELECT)
  RIPPS2_HINT_STAR: Petunjuk Bintang (R3)
  RIPPS2_HINT_VIEW: Petunjuk Tampilan (L3)
  HINT_RIPPS2_HINT_SHOW: Menampilkan atau menyembunyikan petunjuk ini. Tombolnya tetap berfungsi.
  RIPPS2_GLYPH_SET: Set Simbol
  HINT_RIPPS2_GLYPH_SET: 'Simbol tombol di setiap halaman: milik tema, milik RIPPS2, Standar (tombol gelap, simbol berwarna), atau Putih (putih polos).'
  RIPPS2_HINT_ORDER: Urutan Petunjuk
  HINT_RIPPS2_HINT_ORDER: Menata petunjuk. Tema mempertahankan urutan tema; Urutanmu adalah yang diatur di sini.
  RIPPS2_HINT_ORDER_FOLLOW: Urutan
  RIPPS2_GRID_LAYOUT: Tata Letak Kisi
  HINT_RIPPS2_GRID_LAYOUT: Berapa sampul yang muat di satu halaman Kisi, dengan jarak ala RIPPS2. Tema mempertahankan milik tema sendiri.
  RIPPS2_LAUNCH_DISC: Disk Peluncuran
  HINT_RIPPS2_LAUNCH_DISC: Disk sebuah game muncul saat game diluncurkan. Muncul mendarat lalu memudar; Putar berputar makin cepat sampai game mulai; Zoom mendarat, lalu membesar agar jelas terbaca dan tetap tampil.
  RIPPS2_TRANSITION: Transisi Halaman
  HINT_RIPPS2_TRANSITION: 'Bagaimana halaman baru masuk saat kamu pindah ke kategori lain: dari warna latar tema, atau keluar dari kilatan. Tema mempertahankan pilihan tema.'
  RIPPS2_CATEGORY_LAYOUT: Tata Letak Kategori
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Letak tiga kategori: namanya di atas, atau ikon di sepanjang bilah samping, masing-masing dengan laci halamannya (Kiri di daftar menuju ke sana), atau Menu: tanpa bilah, kategori di menu START seperti tema buatan untuk OPL. Tema memakai milik tema.'
  RIPPS2_CACHE: Cache
  HINT_RIPPS2_CACHE: 'Cara daftar game setiap sumber disimpan agar halamannya langsung terbuka: Fast Cache, daftar HDD internal, dan Penyegaran Otomatis.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'Setiap sumber menyimpan daftar game terakhirnya (RIPPS2.LST di samping folder CD dan DVD) dan menampilkannya begitu sumber menjawab. Trust Cache menentukan apakah sumber dibaca ulang sesudahnya. Mati: setiap daftar dibaca dulu dari sumbernya, seperti sebelumnya.'
  HINT_RIPPS2_VIGNETTE: Menggelapkan tepi setiap sampul kecuali yang dipilih, sehingga yang dipilih menonjol. Lemah adalah separuh Penuh.
  RIPPS2_GRID_WIDE: Tata Letak Kisi Layar Lebar
  HINT_RIPPS2_GRID_WIDE: Halaman Kisi khusus gambar 16:9 (Layar lebar, 720p, 1080i), tempat sampul digambar lebih sempit dan lebih banyak yang muat ke samping. Tema memakai milik tema; Sama mengikuti Tata Letak Kisi.
  RIPPS2_BGBLUR: Blur Latar
  HINT_RIPPS2_BGBLUR: Seberapa kuat kaca buram mengaburkan gambar latar game. Tema memakai milik tema sendiri (Lemah di RIPGRID dan Adapt).
  HINT_RIPPS2_HINT_SLOT: Petunjuk di tempat ini. Petunjuk yang tadinya di sini pindah ke tempat lama petunjuk yang dipilih.
  PS1_SAVE_GUIDANCE: Simpanan PS1 bergantung pada Ember atau POPSTARTER; pengaturan VMC PS2 tidak berlaku.
  NEUTRINO_SHOW_ARGS: Tampilkan Argumen Peluncuran
  HINT_NEUTRINO_SHOW_ARGS: Sebelum setiap peluncuran Neutrino, tampilkan semua argumen yang akan diterima Neutrino dan tanyakan apakah lanjut. Kembali kembali ke menu tanpa meluncurkan.
  NEUTRINO_ARGS_CONFIRM: Neutrino akan mulai dengan argumen ini. Luncurkan?
  HINT_NARGS_EXTRA: Flag Neutrino lainnya, dipisahkan spasi, dikirim setelah semua yang di atas. RIPPS2 selalu menambahkan -bsd dan -dvd untuk drive dan ISO game, -mc0 dan -mc1 untuk VMC-nya, -gsm untuk mode videonya, dan mode kompatibilitas milik game. Flag yang punya baris sendiri di atas (seperti -logo) dipindah ke baris itu saat disimpan, dan tetap dikirim.
  HINT_RIPPS2_THEME: Tampilan setiap halaman. Di daftar game, tahan SELECT selama 4,2 detik untuk beralih ke tema berikutnya; menekan SELECT sebentar tetap menyegarkan daftar.
  GAME_TYPE_LABELS: Tampilkan Label [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Daftar cheat tidak bisa disimpan ke folder Neutrino, jadi Neutrino tidak bisa memakainya. Luncurkan tanpa cheat?
  AUTO_CREATE_VMC: Buat VMC saat Peluncuran Pertama
  HINT_AUTO_CREATE_VMC: Meluncurkan game PS2 tanpa VMC di slot 1 membuat kartu 8 MB di perangkat game, dinamai sesuai saran layar VMC (dipakai bersama semua disk game itu), lalu menetapkannya. Dengan Neutrino tidak di HDD APA (HDD exFAT bisa).
  AUTO_VMC_CREATING: Membuat VMC game ini...
  AUTO_VMC_FAILED: Tidak bisa membuat VMC game ini. Game dimulai tanpa VMC.
  RIPPS2_BIOS_MUSIC: Musik BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'Menulis musik menu konsol ini (lagu suasana peramban, sekitar 15 MB sebagai WAV) ke folder AUDIO yang kamu pilih: di samping RIPPS2, atau milik OPL di drive yang dimulai. Terlalu besar untuk kartu memori. Ukurannya ditampilkan lebih dulu.'
  SAVE_ICONS: Ikon Simpanan 3D
  HINT_SAVE_ICONS: Menampilkan ikon simpanan game yang dipilih, berputar, di tempat yang disediakan tema. Membaca VMC milik game lebih dulu, lalu kartu memori.
  NETBOOT_RESTART_NOW: Protokol jaringan berubah setelah mulai ulang. Simpan pengaturan dan mulai ulang OPL sekarang?
  HINT_NET_PROTOCOL: 'Layanan jaringan yang dipakai RiptOPL: share SMB, UDPFS, UDPBD, atau HTTP. Beralih dari layanan yang sudah berjalan butuh mulai ulang.'
  HINT_UDPFS_ACCESS: Hanya UDPFS. File membaca ISO lepas dari folder game di server; IMG membaca image disk sebagai drive. SMB dan HTTP selalu memakai File, UDPBD selalu IMG.
  HINT_SMB_VERSION: Versi SMB yang dipakai untuk berbicara dengan share PC.
  HINT_NET_ADVANCED: Membuka Mode Link Ethernet dan Port SMB untuk diedit.
  HINT_ETH_LINK_MODE: Memaksa kecepatan link jaringan dan duplex. Biarkan Otomatis kecuali link terus putus.
  HINT_IP_ADDR_TYPE: Statis memakai alamat di bawah; DHCP meminta ke router-mu. UDPFS dan UDPBD selalu memakai Statis.
  HINT_PS2_IP: Alamat IP milik PS2 sendiri. Pilih yang tidak dipakai perangkat lain, dalam rentang yang sama dengan PC-mu.
  HINT_NETMASK: Subnet mask, biasanya 255.255.255.0.
  HINT_GATEWAY: Alamat router-mu, biasanya tiga angka pertamanya sama dan berakhir .1.
  HINT_DNS: Alamat server DNS. Biasanya sama dengan gateway.
  HINT_SMB_ADDR_TYPE: Menjangkau PC lewat alamat IP-nya atau nama NetBIOS (komputer)-nya.
  HINT_SMB_ADDRESS: 'PC yang membagikan game-gamemu: alamat IP-nya, atau nama komputernya saat Tipe Alamat adalah NetBIOS.'
  HINT_SMB_PORT: 'Port SMB. Harus sama dengan PC: PS2 Servers memakai 1111, share Windows dan Samba memakai 445.'
  HINT_SMB_USER: Nama pengguna SMB. guest bisa dipakai untuk kebanyakan share.
  HINT_HTTP_SERVER: Alamat IP server game HTTP.
  HINT_HTTP_PORT: Port yang didengarkan server game HTTP.
  HINT_HTTP_BASE: Folder di server HTTP yang berisi games.csv. / adalah root server.
  HINT_HTTP_TEST: Mencoba server HTTP dengan nilai di atas dan melaporkan hasilnya.
  HINT_RA_TELEMETRY: Sakelar utama RetroAchievements. Mati meluncurkan game tanpa stack jaringan atau snapshot, sama seperti build biasa.
  HINT_RA_BADGES: Menandai game yang punya pencapaian di daftar. Tetap gelap selama telemetri mati.
  HINT_POPS_NET_BUTTON: Mengedit file jaringan milik POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), yang dibutuhkan game PS1 lewat SMB.
  HINT_POPS_IP_TYPE: 'Cara PS2 mendapat alamat saat game PS1 berjalan lewat SMB: Statis atau DHCP.'
  HINT_POPS_IP: Alamat IP PS2 saat game PS1 berjalan lewat SMB.
  HINT_POPS_SMB_IP: Alamat IP PC yang membagikan game PS1-mu.
  HINT_POPS_SMB_SHARE: Nama share di PC itu yang berisi folder POPS.
  HINT_LASTPLAYED: Mulai dari game yang terakhir kamu luncurkan.
  HINT_LANGUAGE: Bahasa menu. Tambah lagi dengan menaruh file lang_*.lng di folder LNG.
  HINT_GSM_DEFAULTS_BUTTON: Perbaikan mode video yang didapat setiap game kecuali punya pengaturan GSM sendiri.
  HINT_DEFDEVICE: Halaman yang dibuka RiptOPL saat boot.
  HINT_MMCE_MODE: 'Game di SD2PSX atau MemCard PRO2. Otomatis memulainya saat boot: tercepat untuk kartu yang tertancap, game-nya ada di Semua Game sejak awal. Manual memulainya saat kamu membuka halamannya, Mati menyembunyikannya.'
  HINT_MMCE_SETTINGS_BUTTON: Slot, IGR bootcard, GameID, dan opsi timing untuk MMCE.
  HINT_ENABLE_USB: Memuat driver penyimpanan USB.
  HINT_ENABLE_MX4SIO: Memuat driver adaptor kartu SD MX4SIO.
  HINT_ENABLE_ILINK: Memuat driver penyimpanan iLink (FireWire).
  HINT_NETSTART: 'Memulai jaringan: Otomatis saat boot, Manual saat kamu membuka halamannya. Mati tidak menyentuh adaptor jaringan.'
  HINT_APPMODE: Halaman Aplikasi. Otomatis mulai saat boot, Manual saat kamu membukanya, Mati menyembunyikannya.
  HINT_FAVMODE: Halaman Game Berbintang. Otomatis mulai saat boot, Manual saat kamu membukanya, Mati menyembunyikannya.
  HINT_BDMA_BUTTON: Driver exFAT yang dipakai POPSTARTER untuk game PS1 di USB, MX4SIO, MMCE, HDD, atau iLink.
  HINT_VCD_LIST_BUTTON: 'Cara game PS1 ditampilkan: sembunyikan ID game, hanya tampilkan disk 1, tampilkan partisi PP di HDD.'
  HINT_MMCE_SLOT: Slot kartu memori tempat perangkat MMCE berada. Otomatis menemukannya.
  HINT_MMCE_GAMEID: Memberi tahu perangkat MMCE game mana yang dimulai, supaya bisa berganti ke kartu memori game itu.
  HINT_MMCE_COMM_BUTTON: Opsi timing untuk link MMCE. Ubah hanya jika game macet atau dimuat lambat.
  HINT_MMCE_PATH_BUTTON: Letak folder game di kartu MMCE.
  HINT_MMCE_PREFIX: Subfolder di kartu MMCE yang berisi CD, DVD, dan folder OPL lainnya. Kosong memakai root kartu.
  HINT_GAME_TYPE_LABELS: Mengawali setiap nama game dengan [PS1] atau [PS2]. Hanya tampilan.
  HINT_MENU_VMODE: Keluaran video untuk menu. Game memakai GSM sebagai gantinya. Tahan Terima untuk mempertahankan mode baru.
  HINT_THEME: Tampilan menu. Tema dibaca dari folder THM di setiap perangkat.
  HINT_COVERFLOW_BUTTON: Jumlah sampul, ukuran, animasi, dan peredupan untuk tema Coverflow.
  HINT_ARTWORK_BUTTON: 'Gambar yang dimuat: sampul, gambar disk, latar, dan ikon simpanan.'
  HINT_COLORS_BUTTON: Warna teks, sorotan, dialog, dan latar.
  HINT_NOTIFICATIONS: Pemberitahuan singkat saat file konfigurasi, tema, atau bahasa dimuat.
  HINT_AUTOSORT: Mengurutkan daftar game dari A ke Z. Mati mempertahankan urutan saat ditemukan.
  HINT_AUTOREFRESH: Menambahkan game dari perangkat yang baru dihubungkan tanpa penyegaran manual.
  HINT_COVERART: Memuat sampul dari folder ART.
  HINT_DISCART: Menampilkan gambar disk (<ID>_ICO). Mati menyembunyikan disk tetapi mempertahankan sampul dan latar.
  HINT_BGART: Menampilkan latar game (<ID>_BG) saat tema memakainya.
  HINT_ART_TAR: Juga membaca gambar yang dikemas dalam ART/art.tar.
  HINT_ART_DELAY: Berapa lama kursor diam di sebuah game sebelum gambarnya dimuat. Makin tinggi, makin banyak gambar dilewati saat kamu menggulir cepat.
  HINT_TXTCOLOR: Warna teks menu biasa.
  HINT_SELCOLOR: Warna item yang disorot.
  HINT_UICOLOR: Rona latar kotak dialog.
  HINT_TITLECOLOR: Warna judul game di daftar.
  HINT_BGCOLOR: Warna latar menu.
  HINT_PLASCOLOR: Warna yang dicampur ke latar animasi.
  HINT_RESETCOLOR: Mengembalikan warna bawaan RiptOPL, bukan warna tema.
  HINT_WIDESCREEN: Menggambar menu untuk TV 16:9.
  HINT_XOFF: Menggeser menu ke kiri atau kanan di layar. Disimpan untuk setiap mode video.
  HINT_YOFF: Menggeser menu ke atas atau bawah di layar. Disimpan untuk setiap mode video.
  HINT_MENU_OVERSCAN: Mengecilkan menu ke dalam jika TV memotong tepinya. Disimpan untuk setiap mode video.
  HINT_APPLYGAMEID: Menampilkan barcode saat game dimulai, supaya perangkat Pixel FX, RetroGEM, dan PS2Digital berganti profil.
  HINT_NEUTRINO_DEFAULTS_BUTTON: Jalur, mode video, dan argumen Neutrino untuk setiap game.
  HINT_OSD_DEFAULTS_BUTTON: Bahasa konsol, ukuran layar, dan mode video yang diberikan ke game.
  HINT_ENWRITEOP: Mengizinkan mengganti nama dan menghapus game serta membuat VMC. Tidak pernah menyentuh tabel partisi HDD.
  HINT_DEBUG: 'Bantuan pengembang: layar berwarna saat game boot, dan penghitung pemuatan gambar di menu.'
  HINT_BDMPREFIX: Subfolder di drive USB, MX4SIO, iLink, dan exFAT yang berisi folder game. Kosong memakai root drive.
  HINT_ETHPREFIX: Subfolder di share SMB yang berisi folder game. Kosong memakai root share.
  HINT_HDDGAMELISTCACHE: Mengingat daftar game HDD APA untuk mempercepat pemindaian berikutnya.
  HINT_BDMCACHE: Cache baca-dulu untuk USB dan drive BDM lain saat bermain. Makin besar bisa memperhalus streaming tetapi memakai lebih banyak memori.
  HINT_HDDCACHE: Cache baca-dulu untuk HDD internal saat bermain.
  HINT_SMBCACHE: Cache baca-dulu untuk SMB saat bermain.
  HINT_CORE_LOADER: Inti untuk game ini jika keduanya didukung. UDPFS/UDPBD hanya Neutrino; SMB/HTTP hanya <OPL>. Bawaan mengikuti Peluncuran Game.
  HINT_DMA_MODE: Mode transfer HDD internal untuk game ini. Turunkan jika game tersendat atau macet.
  HINT_DNAS_GAMEID: ID disk untuk game online DNAS. Muat dari Disk membacanya dari disk asli.
  HINT_LOAD_FROM_DISC: Membaca ID DNAS dari disk asli di drive.
  HINT_ALTSTARTUP: Mem-boot ELF ini dari image disk alih-alih yang ditunjuk SYSTEM.CNF.
  HINT_VMC_DEFINE: Pilih, buat, atau ubah ukuran kartu memori virtual slot ini.
  HINT_VMC_ACTION: Pakai Umum memberi slot ini kartu bersama; Setel Ulang menghapus pilihan.
  HINT_VMC_NAME: Nama file kartu, disimpan di folder VMC.
  HINT_VMC_CREATE: Membuat kartu, atau menerapkan ukuran baru padanya.
  HINT_VMC_DELETE: Menghapus file kartu ini.
  HINT_SETTINGS_SOURCE: Global memakai pengaturan bersama; Per Game menyimpannya hanya untuk game ini.
  HINT_PADMACRO_TOGGLE: Saat Tombol Ditekan melambatkan stik hanya selama kamu menahan tombol; Diganti dengan Tombol menyalakan dan mematikannya.
  HINT_SFX: Efek suara menu.
  HINT_BOOT_SND: 'Suara boot saat RIPPS2 dimulai. Aktif: dari folder AUDIO, setelah drive-nya siap. Aktif (cepat): salinan di samping RIPPS2 pada kartu memori tempat ia mulai (ditawarkan saat dipilih), diputar saat pilar naik. Tetap diputar walau efek suara mati.'
  HINT_BGM: Memutar musik tema, atau file Musik Tema Bawaan milikmu.
  HINT_SFX_VOLUME: Volume efek suara menu.
  HINT_BOOT_SND_VOLUME: Volume suara awal.
  HINT_BGM_VOLUME: Volume musik latar.
  HINT_SCROLL: Seberapa cepat daftar menggulir saat kamu menahan arah.
  HINT_SELECTBUTTON: 'Tombol yang menerima: Silang atau Lingkaran.'
  HINT_XSENSITIVITY: Seberapa mudah stik kiri menggerakkan kursor ke kiri dan kanan. Mati mengabaikannya.
  HINT_YSENSITIVITY: Seberapa mudah stik kiri menggerakkan kursor ke atas dan bawah. Mati mengabaikannya.
  HINT_PADEMU_GLOBAL: DualShock 3/4 lewat USB atau Bluetooth, dan multitap, untuk setiap game.
  HINT_PADMACRO_GLOBAL: Perlambatan stik, pembalikan sumbu, dan turbo untuk setiap game.
  HINT_COVERFLOW_DIM: Menggelapkan sampul samping.
  HINT_OSD_ENABLE: Memberikan pengaturan di bawah ke game. Mati memakai milik konsol sendiri.
  HINT_OSD_TVASPECT: Bentuk TV yang diberikan ke game.
  HINT_OSD_VMODE: Mode video yang diberikan ke game.
  DNAS_ID: ID DNAS
  NEUTRINO_PADEMU_WARN: Emulasi pad tidak tersedia dengan Neutrino. Pakai kontroler PS2 atau sumber yang mendukung inti <OPL>.
  RA_MODE: Mode RA
  RA_HOST_IP: IP pendamping RA (0.0.0.0 = otomatis)
  HINT_RA_HOST_IP: IPv4 opsional untuk PC khusus RetroAchievements. Pakai 0.0.0.0 untuk cadangan SMB/HTTP lama atau penemuan Xerabora. Tidak mengubah pengaturan server game.
  HINT_RA_MODE: Pilih klien PC. Xerabora adalah bawaan; Caduceus memeriksa sesi masuknya lebih dulu.
  RA_CADUCEUS_OFFLINE: Sesi RA Caduceus sedang offline.
  RA_CADUCEUS_SIGN_IN: Masuk ke RetroAchievements di Caduceus, lalu coba lagi.
  FAV_SAVING: Menyimpan ke Game Berbintang...
  FAV_SAVED: Disimpan ke Game Berbintang
  FAV_SAVE_FAILED: Tidak bisa menyimpan ke Game Berbintang
  CAD_ACHIEVEMENTS: Pencapaian Caduceus
  CAD_VIEW_ACHIEVEMENTS: Lihat pencapaian
  CAD_USE_LIBRARY: Jelajahi game ini lewat pencapaian Caduceus di menu utama.
  CAD_HASH_UNSUPPORTED: Format ini tidak bisa di-hash. Jelajahi pustaka akun sebagai gantinya.
  CAD_HEADING: PENCAPAIAN
  CAD_LIBRARY: Pustaka akun RetroAchievements
  CAD_FILTER_ALL: Semua
  CAD_EARNED: Diraih
  CAD_LOCKED: Terkunci
  CAD_HARDCORE: Hardcore
  CAD_PROGRESS: '%d / %d diraih  |  %s'
  CAD_ONE_GAME: '%d game di akun'
  CAD_GAMES: '%d game di akun'
  CAD_GAME_PROGRESS: '%d / %d pencapaian  |  %d hardcore'
  CAD_POINTS: '%d poin  |  %s'
  CAD_EMPTY_LIBRARY: Tidak ada game dengan kemajuan di akun ini.
  CAD_EMPTY_FILTER: Tidak ada pencapaian yang cocok dengan filter ini.
  CAD_LOADING: Memuat pencapaian...
  CAD_PAIR: Masuk ke Caduceus dan pasangkan ART/CADUCEUS.KEY di share SMB-mu.
  CAD_UNKNOWN_GAME: Game ini tidak ada di katalog Caduceus. Segarkan katalog di PC.
  CAD_CONNECTION_ERROR: Tidak bisa menghubungi Caduceus. Periksa koneksi, lalu tekan Select untuk mencoba lagi.
  CAD_BACK_REFRESH: Kembali kembali ke OPL. Select menyegarkan halaman ini.
  CAD_LIBRARY_CONTROLS: 'L1/R1: halaman   Terima: buka   Select: segarkan'
  CAD_GAME_CONTROLS: 'L1/R1: halaman   Kotak: filter   Select: segarkan'
  CAD_BACK: Kembali
  CAD_UNTRACKED: Caduceus belum siap. Kali ini diluncurkan tanpa pencapaian.
  PS1_RA_USB_REQUIRED: Pencapaian PS1 butuh VCD di USB lewat POPStarter
  PS1_RA_REMOVE_PREVIOUS: Tidak bisa menghapus modul pencapaian PS1 sebelumnya
  PS1_RA_PREPARE_FAILED: Tidak bisa menyiapkan pencapaian PS1. Simpan atau pindahkan POPS/MODULE_9.IRX dan periksa izin tulis perangkat.
  PS1_RA_CLEAN_DELETE: 'Modul RA RiptOPL yang tak terpakai: POPS/MODULE_9.IRX. Hapus agar peluncuran bersih?'
  PS1_RA_CLEAN_FAILED: Tidak bisa menghapus modul RA yang tak terpakai.
  PS1_RA_CLEAN_CONTINUE: Tetap lanjutkan? Modul RA yang tertinggal bisa menjalankan telemetri usang. Tidak membatalkan peluncuran.
  FAV_REMOVED: Dihapus dari Game Berbintang
  FAV_REMOVE_FAILED: Tidak bisa menghapus dari Game Berbintang
  POPS_UDPFS_SETTINGS: Pengaturan Jaringan POPS UDPFS
  POPS_UDPFS_DISCOVERY: Menyimpan ke setiap folder POPS di USB. Server 0.0.0.0 memakai penemuan otomatis.
  POPS_UDPFS_NOT_READY: POPS UDPFS butuh IPCONFIG.DAT dan UDPFSCONFIG.DAT yang valid dan cocok di setiap folder POPS di USB. Atur di Pengaturan Jaringan POPS.
  HINT_POPS_UDPFS_IP: IP statis PS2 yang dipakai driver POPS UDPFS setelah reset IOP-nya.
  POPS_UDPFS_ALL_USB_FOLDERS: Semua folder POPS di USB
  POPS_UDPFS_INVALID_SUFFIX: ' (tidak valid)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (tidak lengkap)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS butuh pasangan driver .udpfs terpasang di kartu memori. Pasang manual atau nyalakan BDMA Terapkan saat Peluncuran.
  VMC_REPLACE_REQUIRES_DELETE: Mengubah ukuran VMC akan menghapus game yang tersimpan di dalamnya. Cadangkan VMC yang ada dan pakai Hapus sebelum membuat ukuran baru.
  VMC_CREATE_FAILED: Tidak bisa membuat VMC. Periksa perangkat, koneksi, dan izin tulis. Simpanan yang ada tidak diganti.
  RA_EXPERIMENTAL_CARDS: Kartu eksperimental Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Kartu pencapaian eksperimental di dalam game PS2. Bisa berkedip atau membuat game macet. Hanya Caduceus; Mati memakai denyut emas. Berlaku di peluncuran game berikutnya.
  RA_NEUTRINO_UNTRACKED: Neutrino RA tidak tersedia untuk peluncuran ini. Periksa runtime RA, IP pendamping, dan daftar pantau yang disimpan. Diluncurkan tanpa pencapaian.
  UDPFS_IP_CONFLICT: Perangkat lain di jaringanmu memakai alamat IP PS2 ini, jadi jawaban server UDPFS sampai ke sana. Atur IP PS2 yang berbeda di Pengaturan Jaringan.
  XERA_ACHIEVEMENTS: Pustaka RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Jelajahi game ini lewat pustaka RetroAchievements di menu utama.
  XERA_OPEN_NETWORK: Tidak bisa menjangkau xeRAbora. Nyalakan OPEN TO THE NETWORK di pengaturannya, periksa IP pendamping RA dan firewall PC.
  XERA_UNKNOWN_GAME: xeRAbora tidak mengenal image ini. Jalankan pemeriksaan dukungan game RA lebih dulu.
  XERA_NOT_PLAYED: Belum ada di pustaka RetroAchievements-mu. Mainkan sekali dengan pencapaian, lalu tekan Select.
  XERA_CONNECTION_ERROR: Tidak bisa membaca daftar dari xeRAbora. Tekan Select untuk mencoba lagi.
  CAD_PAIR_UDPFS: Tidak bisa menjangkau Caduceus. Pasangkan ART/CADUCEUS.KEY di folder yang dibagikan PS2-Servers, dan atur IP pendamping RA.
  RA_WL_NOT_SAVED: Tidak bisa menyimpan daftar pantau. Pastikan perangkat atau share game bisa ditulisi, lalu periksa lagi.
  RA_UDPFS_LOAD_FIRST: Buka halaman UDPFS sekali agar modul jaringannya dimuat, lalu coba lagi.
  CAD_UDPFS_IMG: 'Peramban Caduceus butuh SMB atau UDPFS File: UDPFS IMG tidak punya folder bersama untuk kuncinya.'
  XERA_SET_CLOCK: Belum ada di pustaka RetroAchievements-mu. Atur jam konsol di pengaturan sistem untuk melihat daftar lengkapnya, atau mainkan sekali dengan pencapaian.
  CFG_TITLES: Tampilkan Judul CFG di Daftar Game
  HINT_CFG_TITLES: Menampilkan Judul dari CFG setiap game alih-alih nama filenya, dan mengurutkan berdasarkan itu. Membaca setiap CFG saat daftar disegarkan, jadi daftar dimuat lebih lambat. Hanya tampilan.
  AUTO_VMC_INVALID: File VMC game ini ada tetapi bukan kartu memori yang valid, jadi tidak dipakai atau diganti. Game dimulai tanpa VMC; periksa di menu VMC.
  AUTO_VMC_STILL_RUNNING: VMC game ini masih dibuat. Luncurkan game lagi sebentar lagi.
  NEUTRINO_DVR_QUICKBOOT: Peluncuran DVR butuh transisi ke mode PSX. Hapus -qb dari argumen Neutrino global dan per game.
  NEUTRINO_DVR_FILE_MISSING: 'Instalasi Neutrino untuk DVR tidak lengkap. File wajib tidak ada:'
  PARENLOCK_GAME: Kunci Orang Tua
  PARENLOCK_GAME_HINT: Minta kata sandi kunci orang tua untuk menjalankan game ini.
  PARENLOCK_GAME_NO_PASSWORD: Atur kata sandi kunci orang tua, kalau tidak game ini tidak akan terkunci.
  HINT_ENABLE_PCCF: CompactFlash PC CARD di PS2 Jepang awal. Hanya game PS2 asli; CF butuh akses eksklusif ke PC CARD. Mulai ulang untuk melepasnya.
  PCCF_GAMES: Game PC CARD CF
  PCCF_UNAVAILABLE: 'CF tidak tersedia: butuh PS2 Jepang awal dengan PC CARD, kartu yang kompatibel, dan tanpa driver DEV9/HDD/jaringan yang aktif.'
  PCCF_UNSUPPORTED_GAME: CF saat ini hanya mendukung game PS2 asli. VMC di CF, pemuatan PS1, dan pencapaian jaringan tidak tersedia.
  HINT_ENABLE_DVR: Penemuan ISO DESR DVR eksperimental. Butuh sumber HDD menyala; peluncuran game butuh Neutrino eksternal yang mendukung DVR.
  HINT_RIPPS2_IGR_PAGE: Menu dalam game, RIPSHOT, dan cara jepretan dicetak.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Tangkapan layar dari menu dalam game, ke ART untuk tema Anda atau ke MEDIA.
  RIPPS2_DEVELOP_SHOTS: Cetak jepretan
  HINT_RIPPS2_DEVELOP_SHOTS: Cara jepretan yang menunggu di rol tiap game menjadi PNG.
  RIPPS2_SETTINGS_HOME: Simpan pengaturan ke
  HINT_RIPPS2_SETTINGS_HOME: 'Tempat RIPPS2 menyimpan pengaturannya: save miliknya di kartu memori, folder RIPPS2 di sebuah drive (HDD internal, USB, MX4SIO, iLink, atau MMCE), atau folder yang Anda ketik.'
  RIPPS2_LAUNCHERS: Peluncur
  RIPPS2_LOOK_NOW: Cari sekarang
  HINT_RIPPS2_LOOK_NOW: RIPPS2 mencari POPSTARTER, file POPS, Ember, BIOS Ember, dan Neutrino di drive yang sudah dimulai, lalu mengingat letak masing-masing. Setiap peluncuran membacanya dari sana.
  RIPPS2_HIDE_GAME: Sembunyikan game
  RIPPS2_HIDDEN_GAMES: Game tersembunyi
  HINT_RIPPS2_HIDDEN_GAMES: Game yang disembunyikan dengan Sembunyikan game, di drive yang sudah dimulai. Tampilkan satu lagi, atau hapus. Setiap drive menyimpan daftarnya sendiri.
  HINT_RIPPS2_BDM_DEVICES: 'Drive tempat BDM membaca game: USB, MX4SIO, PC Card CF, drive DVR milik DESR, dan iLink. HDD internal mengikuti Mode Mulai HDD.'
  HINT_RIPPS2_SCREEN: 'Gambar menu: mode video, layar lebar, letaknya di TV (H-POS, V-POS) dan overscan.'
  HINT_RIPPS2_LAYOUT: Letak kategori dan cara halaman masuk, lalu sampul RIPFLOW dan kisi RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Ketebalan teks, tema warna, peralihan warna, dan setiap warna.
  HINT_RIPPS2_TEXT_WEIGHT: 'Seberapa tebal teks milik RIPPS2: tooltip Pengaturan, STATUS, dan Tentang. Normal seperti sebelumnya; Tebal lebih mudah dibaca di gambar yang lembut. Font milik tema mempertahankan ketebalan yang diberikan tema.'
  HINT_RIPPS2_HDD_START: 'HDD internal, APA atau exFAT: RIPPS2 membaca apa pun jenisnya dan menampilkannya sekali, sebagai Game HDD. Otomatis (tercepat jika ada disk) memulainya saat boot; Mati membiarkannya.'
  HINT_RIPPS2_THEME_COLOR: Warna milik tema itu sendiri. Pilih Kustom sebagai tema warna untuk memilihnya sendiri, seperti warna teks.
  HINT_RIPPS2_SWEEP: Lima warna yang dilalui tema, perlahan dan halus. Pelangi, peralihan dari tiap tema warna, atau milikmu. Mati menjaga tema tetap diam.
  HINT_RIPPS2_SWEEP_COLORS: Lima warna peralihan dan kecepatannya. Ubah salah satu milik RIPPS2 dan itu disimpan sebagai milikmu, dengan nama yang kamu berikan.
  HINT_RIPPS2_SWEEP_NAME: Nama peralihanmu di daftar Peralihan Warna.
  HINT_RIPPS2_SWEEP_COLOR: Salah satu dari lima warna yang dilalui peralihan, berurutan.
  HINT_RIPPS2_SWEEP_SPEED: 'Berapa lama tiap warna bertahan sebelum warna berikutnya muncul. Bahkan Lincah tetap halus: warnanya tidak pernah berkedip.'
  RIPPS2_HIDE_COMPRESS: Sembunyikan game dan kompresi
  HINT_RIPPS2_SELECT_HOLD: 'SELECT ditahan 4.2 dtk di daftar game. Daftar: tema dalam panel, pilih satu. Bergilir: tema berikutnya. Mati: tidak ada (tekan tetap menyegarkan).'
  RIPPS2_RECENT_GAMES: Game Terbaru
  RIPPS2_SET_METADATA_RENAME: Atur Metadata (Ganti Nama)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Kontroler Dulu (Eksperimental)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX membaca lewat bus yang dipakai bersama kontroler, dan selama pembacaan berlangsung kontroler tidak terdengar: tekanan tombol terlambat atau hilang saat sampul dimuat. Hidup: sampul datang dalam potongan kecil dengan kontroler dibaca di sela-selanya, sedikit lebih lambat. Mati: secepat kartunya. Dengan sumber kartu di Otomatis, daftarnya dimuat sekali, saat boot.'
  HINT_RIPPS2_TRUST_CACHE: 'Daftar yang tampil dari cache tetap seperti apa adanya, siap diluncurkan, sampai kamu menekan SELECT atau RIPPS2 sendiri mengubah sumber itu. Mati: setiap sumber dibaca ulang di latar belakang setelah cache-nya tampil, jeda yang terasa pada kartu MMCE atau MX4SIO, yang berbagi bus kontroler.'
  RIPPS2_STATUS_OPEN: Pemuatan dan Drive
  HINT_RIPPS2_STATUS_OPEN: 'Membuka STATUS: tempat boot membaca pengaturan dan daftar game, tempat mana yang tercepat, ke mana EXIT game pergi, dan setiap drive. PENGATURAN CACHE di sana kembali ke sini.'
  RIPPS2_BADGE_SET: Set Lencana
  HINT_RIPPS2_BADGE_SET: 'Lencana di halaman info game (rating, pemain, ESRB, mode video, pindai, rasio). RIPPS2: set miliknya, sama di setiap tema. Tema: gambar milik tema, atau milik RIPPS2 jika tema memintanya.'
  RIPPS2_HINT_FADE: Petunjuk dan Glif Memudar
  HINT_RIPPS2_HINT_FADE: 'Petunjuk tombol atau glif yang berubah muncul memudar, seperti sampul, saat berubah; yang tetap dibiarkan, di setiap halaman dan pesan. Mati: muncul begitu saja. Tema: tema yang menentukan (hidup kecuali tema menulis hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Gaya Bilah Samping
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klasik (terpisah): ikon di bilah gelap bilah samping dengan strip berwarna di sebelahnya. XL (satu bagian): satu bilah lebih lebar, ikon di tengahnya. Tema: tema yang menentukan.'
  HINT_EXITPATH: 'Ke mana EXIT di Menu Dalam Game pergi. Sebaiknya kosong: EXIT pergi ke browser, yang memulai boot loader-mu (FreeMcBoot, PS2BBL, OSDMenu, atau BIBLE) bila ada yang terpasang, lalu RIPPS2 lagi dengan BOOT LOCK menyala, seperti saat dinyalakan; tanpa itu, browser PS2. ELF yang diketik di sini hanya dipakai bila reset bisa memuatnya (di kartu memori atau drive USB FAT32) dan bukan RIPPS2 itu sendiri; selain itu pergi ke browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO, dan HDD exFAT. Otomatis memulainya saat boot: tercepat untuk drive yang tertancap, game-nya ada di Semua Game sejak awal. Manual memulainya saat kamu membuka halamannya.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino tidak bisa memakai VMC di HDD APA (exFAT, USB, dan MX4SIO bisa): game ini dimulai dengan kartu asli di slot itu.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Saat mulai, hanya drive RIPPS2 yang dibaca: pengaturan dan suara di samping RIPPS2.ELF (RIPPS2.FB di sana menunjukkan letaknya) dan setiap daftar dari cache-nya. Drive lain menunggu: SELECT di sebuah halaman memulai drive-nya dan memuat gambarnya (dengan penyegaran otomatis, drive dimulai saat mulai). Menyalakannya menyalin suaramu, dan musik jika ada ruang, ke AUDIO di samping RIPPS2.'
  RIPPS2_ART_PACK: Paket ART
  RIPPS2_ART_PACK_BUILD: Buat atau hapus
  HINT_RIPPS2_ART_PACK: Mengemas folder ART setiap drive yang dimulai ke satu art.tar di drive yang kamu pilih (yang tercepat ditawarkan lebih dulu). Sampul lalu dimuat dari satu berkas dengan satu indeks, tidak pernah dengan pencarian per game, sehingga menu dan musik tetap lancar. Folder ART tetap seperti adanya.
  RIPPS2_LIST_CFG_TEXT: Judul dan deskripsi di daftar
  HINT_RIPPS2_LIST_CFG_TEXT: 'Judul dan deskripsi game dari CFG-nya di samping daftar. Tema: seperti yang ditampilkan tema (tema RIPPS2 sendiri tidak menampilkannya). Halaman info selalu menampilkannya.'
  RIPPS2_PS1_PREFER: Duplikat PS1
  HINT_RIPPS2_PS1_PREFER: 'Game PS1 yang sekaligus VCD POPSTARTER dan image Ember. Keduanya: dua baris. Ember: hanya baris Ember. POPSTARTER: hanya VCD. Judul yang sama, tanpa ID disk di depannya, adalah game yang sama.'
  RIPPS2_MY_PADS: Kontroler saya
  HINT_RIPPS2_MY_PADS: 'Profil .pad di folder PADS di samping RIPPS2: satu file teks per pad USB, diberi nama sesuai ID-nya (2563_0575.pad), dan masing-masing diperiksa. Pad yang punya profil mengendalikan menu dan bermain di game (Pad Emulator aktif).'
  RIPPS2_PAD_SETUP: Atur Pad USB
  HINT_RIPPS2_PAD_SETUP: Colokkan pad USB yang belum dikenal RIPPS2, tekan setiap tombol yang diminta, dan RIPPS2 menulis .pad-nya di PADS. SELECT pada pad PS2 melewati satu tombol.
