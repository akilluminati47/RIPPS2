  The security module would not start on this console. Nothing on the memory card was changed.: Modul keamanan tidak mau mulai di konsol ini. Tidak ada yang diubah di kartu memori.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
