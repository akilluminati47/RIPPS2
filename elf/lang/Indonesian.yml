  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL 1.2.0 diikat ke kartu ini oleh konsol dan ditulis sebagai %s/%s.
  
    - Konfigurasinya, mc%d:/PS2BBL/CONFIG.INI, menjalankan RIPPS2 di tempatnya (%s) tanpa menunggu (0 ms, yang tidak diizinkan PS2BBL Extended), BOOT LOCK aktif. RIPPS2 sendiri tidak disalin.
  
    Prosesor I/O dimulai ulang untuk ini dan setiap pembacaan drive berhenti sampai selesai; musik dan drive kembali setelahnya. Biarkan kartu terpasang dan konsol menyala sampai ia bilang selesai.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Kartu SD2PSX atau MMCE bisa melindungi dirinya setelah penulisan ditolak: jika kartu memori atau drive MMCE sekarang hilang, matikan lalu nyalakan konsol.'
  BOOT LOCK ON: BOOT LOCK AKTIF
  'Done: the memory card in slot %d starts what it started before BBL 1.20. BBL 1.20 is kept in mc%d:/%s.': 'Selesai: kartu memori di slot %d menjalankan apa yang dijalankannya sebelum BBL 1.20. BBL 1.20 disimpan di mc%d:/%s.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
