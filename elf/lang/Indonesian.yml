  : 'Untuk kartu memori PS2 standar 8 MB (kartu MagicGate, atau kartu BOOT SD2PSX atau MMCE): yang di slot %d. Saat dinyalakan, PS2BBL membaca konfigurasi slot 2 sebelum slot 1.
  
