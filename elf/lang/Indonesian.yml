  BOOT LOCK found no boot loader config to change.: BOOT LOCK tidak menemukan konfigurasi boot loader untuk diubah.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK mati. Boot loader-mu menjalankan apa yang dijalankannya sebelumnya (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
