  ? 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: Setting up BBL 1.20. PS2BBL 1.2.0 by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?'
  : 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: memasang BBL 1.20. PS2BBL 1.2.0 karya El Isra, dipasang oleh RIPPS2 di kartu memori PS2 standar 8 MB atau hard disk internal: mulai dalam 0 ms saat dinyalakan (PS2BBL Extended tidak mengizinkan 0), RIPPS2 lebih dulu dari tempatnya (tidak pernah disalin), dan tombol yang ditahan saat dinyalakan tetap membawa ke browser (TRIANGLE), ke disk (START), dan ke yang sebelumnya (CIRCLE). Pasang, perbaiki, atau pulihkan yang digantikannya?'
  The memory card in slot %d has %d KB free, and BBL 1.20 needs %d KB there. Free some space, then try again.: Kartu memori di slot %d punya %d KB kosong, dan BBL 1.20 butuh %d KB di sana. Kosongkan sedikit ruang, lalu coba lagi.
