  'Ripping this console''s sounds: %s': 'ກຳລັງຖອດ ສຽງ ຂອງເຄື່ອງນີ້: %s'
  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: ເພງເມນູ (%s) ຢູ່ໃນ %s ຊື່ %s. ການຕັ້ງຄ່າສຽງ > ເພງ ສະແດງມັນເປັນ Menu; ມັນຫຼິ້ນ ເມື່ອບໍ່ໄດ້ເລືອກເພງອື່ນ.
  The menu music could not be written to %s (%s). Is the drive full?: ຂຽນເພງເມນູ ໄວ້ໃນ %s ບໍ່ໄດ້ (%s). ໄດຣຟ໌ເຕັມ ບໍ?
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : 'ເພງເມນູ ແມ່ນ WAV ຂະໜາດ %s, ແລະ ບໍ່ມີເມມໂມຣີກາດໃດ ມີບ່ອນພໍ. ຢູ່ນີ້ RIPPS2 ເລີ່ມຈາກເມມໂມຣີກາດ ແລະ ບໍ່ມີໄດຣຟ໌ທີ່ມີໂຟນເດີ OPL ເລີ່ມຢູ່: ເລີ່ມໄດຣຟ໌ໜຶ່ງ ໃນບ່ອນເກັບຂໍ້ມູນ, ແລ້ວຖອດເພງ ໄປໃສ່ມັນ.'
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: ເພງເມນູ ຂອງ BIOS ນີ້ ບໍ່ແມ່ນອັນທີ່ RIPPS2 ຮູ້ຈັກ. ບໍ່ໄດ້ຂຽນຫຍັງ.
  This BIOS's sound bank is not the one RIPPS2 knows. Nothing was written.: ຄັງສຽງ ຂອງ BIOS ນີ້ ບໍ່ແມ່ນອັນທີ່ RIPPS2 ຮູ້ຈັກ. ບໍ່ໄດ້ຂຽນຫຍັງ.
  ? This console's BIOS has no SNDIMAGE. Consoles from SCPH-30000 on carry one; the first models keep their sounds another way, which RIPPS2 does not read yet.
  : BIOS ຂອງເຄື່ອງນີ້ ບໍ່ມີ SNDIMAGE. ເຄື່ອງຕັ້ງແຕ່ SCPH-30000 ມີມັນ; ລຸ້ນທຳອິດ ເກັບສຽງໄວ້ ແບບອື່ນ, ເຊິ່ງ RIPPS2 ຍັງອ່ານບໍ່ໄດ້.
  ' (hold CIRCLE at power on to start it)': ' (ກົດ ວົງມົນ ຄ້າງໄວ້ ຕອນເປີດເຄື່ອງ ເພື່ອເລີ່ມມັນ)'
  ' (then ': ' (ແລ້ວ '
  ' A SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it was removed.': ' ໄດ້ລົບ SYS-CONF/PS2BBL.INI ທີ່ບິວ 68 ຂຽນໄວ້ ສຳລັບໂຕໂຫຼດ ທີ່ບໍ່ເຄີຍອ່ານມັນ.'
  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' ເມມໂມຣີກາດໜຶ່ງ ຢູ່ນີ້ ມີ PS2BBL/CONFIG.INI ຂອງມັນເອງ, ເຊິ່ງ PS2BBL ອ່ານກ່ອນ ອັນຂອງ HDD: ຖອດກາດນັ້ນອອກ ຕອນເປີດເຄື່ອງ, ຫຼື ເລີ່ມ RIPPS2 ຈາກກາດ ແລ້ວ ຕິດຕັ້ງໃໝ່.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' ກົດ ສາມຫຼ່ຽມ ຄ້າງໄວ້ ຕອນເປີດເຄື່ອງ ສຳລັບໂຕທ່ອງ, START ສຳລັບແຜ່ນ.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' ກົດ ສາມຫຼ່ຽມ ຄ້າງໄວ້ ສຳລັບໂຕທ່ອງ, START ສຳລັບແຜ່ນ. ການຕັ້ງຄ່າ: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 ຕິດຕັ້ງ BIBLE ໄດ້, ຄື PS2BBL ທີ່ຕັ້ງໃຫ້ເລີ່ມ RIPPS2, ເທິງເມມໂມຣີກາດ; ສິ່ງທີ່ເລີ່ມຈາກມັນດຽວນີ້ ຈະຖືກເກັບໄວ້ ໃນໂຟນເດີສຳຮອງ. ຕິດຕັ້ງ BIBLE ບໍ?'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' ໂປຣແກຣມບູດເກົ່າ ຂອງ HDD ຖືກເກັບໄວ້ (ຈັດການ > ກູ້ຄືນ).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' ເຄື່ອງ ບໍ່ຮັບການຕັ້ງຄ່າ ທີ່ເລີ່ມ HDD ຂອງມັນ ຕອນເປີດເຄື່ອງ: ຕັ້ງມັນດ້ວຍເຄື່ອງມື HDD, ຫຼື ຕິດຕັ້ງໃໝ່.'
  ' What was there before is kept in mc%d:/%s%s.': ' ສິ່ງທີ່ເຄີຍຢູ່ນັ້ນ ຖືກເກັບໄວ້ໃນ mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' ການຕັ້ງຄ່າ PS2BBL ຂອງທ່ານເອງ ຖືກເກັບໄວ້ (%s), ຕັ້ງ BOOT LOCK ໃນມັນແລ້ວ: ປຸ່ມຕ່າງໆ ຂອງມັນ ຄືທີ່ທ່ານຕັ້ງ.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' ການຕັ້ງຄ່າ PS2BBL ຂອງທ່ານເອງ ຖືກເກັບໄວ້, ຕັ້ງ BOOT LOCK ໃນມັນແລ້ວ.'
