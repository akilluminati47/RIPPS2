  : RIPPS2 ຫຼິ້ນເພງເມນູ ຂອງເຄື່ອງນີ້, ເພງບັນຍາກາດ ຂອງໂຕທ່ອງ (%d:%02d), ຈາກໂນ້ດຂອງ BIOS ເອງ ແລະ ຂຽນເປັນ WAV ຂະໜາດ %s ໄວ້ໃນ %s; ບໍ່ມີເມມໂມຣີກາດໃດ ມີບ່ອນພໍ. %s ທີ່ມີຢູ່ແລ້ວ ຈະຖືກແທນທີ່. ໃຊ້ເວລາ ໜຶ່ງ ຫຼື ສອງນາທີ.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 ອ່ານສຽງ ຈາກ BIOS ຂອງເຄື່ອງນີ້ເອງ ແລະ ຂຽນໄວ້ໃນ %s ເປັນສຽງຂອງມັນ: ເຄີເຊີ, ຢືນຢັນ, ຍົກເລີກ, ໜ້າ, ໝວດ, ຂໍ້ຄວາມ, ແຜ່ນ, ຂໍ້ຜິດພາດ, ເຊບ, ໄດຣຟ໌ ແລະ ສຸ່ມ, ພ້ອມ ເພງເປີດເຄື່ອງ ແລະ ເພງເປີດເກມ, ຫຼິ້ນຈາກໂນ້ດຂອງ BIOS ເອງ. ໄຟລ໌ຊື່ດຽວກັນ ທີ່ມີຢູ່ແລ້ວ ຈະຖືກແທນທີ່.'
  Reading this console's menu music: ກຳລັງອ່ານ ເພງເມນູ ຂອງເຄື່ອງນີ້
  'Ripping this console''s menu music: %d%%': 'ກຳລັງຖອດ ເພງເມນູ ຂອງເຄື່ອງນີ້: %d%%'
