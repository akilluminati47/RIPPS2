  HINT_ENABLE_PCCF: PC CARD CompactFlash ຂອງ PS2 ຍີ່ປຸ່ນ ລຸ້ນທຳອິດ. ເກມ PS2 ແທ້ ເທົ່ານັ້ນ; CF ຕ້ອງການ ການເຂົ້າເຖິງ PC CARD ແຕ່ຜູ້ດຽວ. ເລີ່ມໃໝ່ ເພື່ອປ່ອຍມັນ.
  PCCF_GAMES: ເກມ PC CARD CF
  PCCF_UNAVAILABLE: 'CF ໃຊ້ບໍ່ໄດ້: ຕ້ອງການ PS2 ຍີ່ປຸ່ນ ລຸ້ນທຳອິດ ທີ່ມີ PC CARD, ກາດທີ່ເຂົ້າກັນໄດ້, ແລະ ບໍ່ມີໄດຣເວີ DEV9/HDD/ເຄືອຂ່າຍ ທີ່ເຮັດວຽກ.'
  PCCF_UNSUPPORTED_GAME: ດຽວນີ້ CF ຮອງຮັບ ເກມ PS2 ແທ້ ເທົ່ານັ້ນ. CF VMC, ການໂຫຼດ PS1 ແລະ ຄວາມສຳເລັດ ຜ່ານເຄືອຂ່າຍ ໃຊ້ບໍ່ໄດ້.
  HINT_ENABLE_DVR: ການຄົ້ນຫາ ISO ຂອງ DESR DVR ແບບທົດລອງ. ຕ້ອງເປີດ ແຫຼ່ງ HDD; ການເລີ່ມເກມ ຕ້ອງການ Neutrino ພາຍນອກ ທີ່ຮອງຮັບ DVR.
  HINT_RIPPS2_IGR_PAGE: ເມນູ ໃນເກມ, RIPSHOT ແລະ ວິທີລ້າງພາບ.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: ພາບໜ້າຈໍຈາກເມນູ ໃນເກມ, ໄປ ART ສຳລັບທີມຂອງທ່ານ ຫຼື ໄປ MEDIA.
  RIPPS2_DEVELOP_SHOTS: ລ້າງພາບ
  HINT_RIPPS2_DEVELOP_SHOTS: ວິທີທີ່ພາບລໍຖ້າໃນມ້ວນຂອງແຕ່ລະເກມກາຍເປັນ PNG.
  RIPPS2_SETTINGS_HOME: ບັນທຶກການຕັ້ງຄ່າໃສ່
  HINT_RIPPS2_SETTINGS_HOME: 'ບ່ອນທີ່ RIPPS2 ເກັບການຕັ້ງຄ່າ: ບ່ອນບັນທຶກຂອງມັນເທິງເມມໂມຣີກາດ, ໂຟນເດີ RIPPS2 ເທິງໄດຣຟ໌ (HDD ພາຍໃນ, USB, MX4SIO, iLink ຫຼື MMCE), ຫຼື ໂຟນເດີທີ່ທ່ານພິມ.'
  RIPPS2_LAUNCHERS: ຕົວເປີດ
  RIPPS2_LOOK_NOW: ຊອກຫາດຽວນີ້
  HINT_RIPPS2_LOOK_NOW: RIPPS2 ຊອກຫາ POPSTARTER, ໄຟລ໌ POPS, Ember, BIOS ຂອງ Ember ແລະ Neutrino ໃນໄດຣຟ໌ທີ່ເລີ່ມແລ້ວ, ແລະ ຈື່ບ່ອນຂອງແຕ່ລະອັນ. ທຸກການເປີດໃຊ້ອ່ານພວກມັນຈາກບ່ອນນັ້ນ.
  RIPPS2_HIDE_GAME: ເຊື່ອງເກມ
  RIPPS2_HIDDEN_GAMES: ເກມທີ່ເຊື່ອງໄວ້
  HINT_RIPPS2_HIDDEN_GAMES: ເກມທີ່ເຊື່ອງດ້ວຍ ເຊື່ອງເກມ, ໃນໄດຣຟ໌ທີ່ເລີ່ມແລ້ວ. ສະແດງອັນໜຶ່ງອີກ, ຫຼື ລົບມັນ. ແຕ່ລະໄດຣຟ໌ເກັບລາຍການຂອງຕົນເອງ.
  HINT_RIPPS2_BDM_DEVICES: 'ໄດຣທີ່ BDM ອ່ານເກມ: USB, MX4SIO, PC Card CF, ໄດຣ DVR ຂອງ DESR ແລະ iLink. HDD ພາຍໃນເຮັດຕາມໂໝດເລີ່ມຕົ້ນ HDD.'
  HINT_RIPPS2_SCREEN: 'ພາບຂອງເມນູ: ໂໝດວິດີໂອ, ຈໍກວ້າງ, ບ່ອນມັນຢູ່ເທິງໂທລະທັດ (H-POS, V-POS) ແລະ overscan.'
  HINT_RIPPS2_LAYOUT: ບ່ອນທີ່ໝວດໝູ່ຢູ່ ແລະ ໜ້າເຂົ້າມາແນວໃດ, ແລ້ວໜ້າປົກຂອງ RIPFLOW ແລະ ຕາຂ່າຍຂອງ RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: ຄວາມໜາຂອງຕົວອັກສອນ, ທີມສີ, ການປ່ຽນສີ ແລະ ທຸກສີ.
  HINT_RIPPS2_TEXT_WEIGHT: 'ຕົວໜັງສືຂອງ RIPPS2 ເອງ ໜາເທົ່າໃດ: ຄຳແນະນຳໃນ ການຕັ້ງຄ່າ, ສະຖານະ ແລະ ກ່ຽວກັບ. ປົກກະຕິ ຄືເກົ່າ; ໜາ ອ່ານງ່າຍກວ່າ ເທິງຮູບທີ່ອ່ອນ. ຟອນຂອງທີມເອງ ຮັກສາຄວາມໜາທີ່ທີມໃຫ້.'
  HINT_RIPPS2_HDD_START: 'HDD ພາຍໃນ, APA ຫຼື exFAT: RIPPS2 ອ່ານມັນ ບໍ່ວ່າຈະເປັນແບບໃດ ແລະ ສະແດງມັນເທື່ອດຽວ, ເປັນ ຫຼິ້ນເກມຜ່ານ Hard Disk. ອັດຕະໂນມັດ (ໄວທີ່ສຸດ ເມື່ອມີ HDD) ເລີ່ມມັນຕອນບູດ; ປິດ ປ່ອຍມັນໄວ້.'
  HINT_RIPPS2_THEME_COLOR: ສີຂອງທີມເອງ. ເລືອກ ກຳນົດເອງ ເປັນທີມສີ ເພື່ອເລືອກເອງ ຄືກັບສີຂໍ້ຄວາມ.
  HINT_RIPPS2_SWEEP: ຫ້າສີທີ່ທີມຜ່ານໄປຊ້າໆ ແລະ ລຽບ. ຮຸ້ງ, ການປ່ຽນຈາກແຕ່ລະທີມສີ, ຫຼື ຂອງເຈົ້າເອງ. ປິດ ຈະໃຫ້ທີມສີຢູ່ນິ້ງ.
  HINT_RIPPS2_SWEEP_COLORS: ຫ້າສີຂອງການປ່ຽນ ແລະ ຄວາມໄວຂອງມັນ. ປ່ຽນອັນໜຶ່ງຂອງ RIPPS2 ແລ້ວມັນຈະຖືກເກັບເປັນຂອງເຈົ້າ ດ້ວຍຊື່ທີ່ເຈົ້າຕັ້ງ.
  HINT_RIPPS2_SWEEP_NAME: ຊື່ຂອງການປ່ຽນຂອງເຈົ້າໃນລາຍຊື່ ການປ່ຽນສີ.
  HINT_RIPPS2_SWEEP_COLOR: ໜຶ່ງໃນຫ້າສີທີ່ການປ່ຽນຜ່ານ, ຕາມລຳດັບ.
  HINT_RIPPS2_SWEEP_SPEED: 'ແຕ່ລະສີຢູ່ດົນເທົ່າໃດກ່ອນສີຕໍ່ໄປຈະເຂົ້າມາ. ເຖິງ ມີຊີວິດຊີວາ ກໍຍັງລຽບ: ສີບໍ່ເຄີຍກະພິບ.'
  RIPPS2_HIDE_COMPRESS: ເຊື່ອງເກມ ແລະ ບີບອັດ
  HINT_RIPPS2_SELECT_HOLD: 'ກົດ SELECT ຄ້າງ 4.2 ວິ ໃນລາຍການເກມ. ລາຍການ: ທີມໃນແຜງ, ເລືອກອັນໜຶ່ງ. ໝຸນວຽນ: ທີມຖັດໄປ. ປິດ: ບໍ່ມີຫຍັງ (ກົດຍັງໂຫຼດຄືນ).'
  RIPPS2_RECENT_GAMES: ເກມຫຼ້າສຸດ
  RIPPS2_SET_METADATA_RENAME: ຕັ້ງ Metadata (ປ່ຽນຊື່)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: ຈອຍກ່ອນ (ທົດລອງ)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX ອ່ານຜ່ານບັສທີ່ໃຊ້ຮ່ວມກັບຈອຍ, ແລະ ລະຫວ່າງການອ່ານ ຈອຍບໍ່ຖືກໄດ້ຍິນ: ການກົດຊ້າ ຫຼື ຫາຍ ຂະນະໜ້າປົກໂຫຼດ. ເປີດ: ໜ້າປົກມາເປັນສ່ວນນ້ອຍ ໂດຍອ່ານຈອຍລະຫວ່າງນັ້ນ, ຊ້າລົງໜ້ອຍໜຶ່ງ. ປິດ: ໄວເທົ່າທີ່ກາດໄປໄດ້. ເມື່ອແຫຼ່ງຂອງກາດເປັນ ອັດຕະໂນມັດ, ລາຍການຂອງມັນໂຫຼດເທື່ອດຽວ, ຕອນບູດ.'
  HINT_RIPPS2_TRUST_CACHE: 'ລາຍການທີ່ສະແດງຈາກ cache ຢູ່ຄືເກົ່າ, ພ້ອມເປີດ, ຈົນກວ່າທ່ານກົດ SELECT ຫຼື RIPPS2 ປ່ຽນແຫຼ່ງນັ້ນເອງ. ປິດ: ອ່ານແຕ່ລະແຫຼ່ງໃໝ່ໃນພື້ນຫຼັງ ຫຼັງຈາກ cache ຂຶ້ນ, ເຊິ່ງຢຸດໃຫ້ຮູ້ສຶກໄດ້ ໃນກາດ MMCE ຫຼື MX4SIO ທີ່ໃຊ້ບັສຂອງຈອຍຮ່ວມກັນ.'
  RIPPS2_STATUS_OPEN: ການໂຫຼດ ແລະ ໄດຣຟ໌
  HINT_RIPPS2_STATUS_OPEN: 'ເປີດ ສະຖານະ: ບູດອ່ານການຕັ້ງຄ່າ ແລະ ລາຍການເກມຈາກໃສ, ບ່ອນໃດໄວທີ່ສຸດ, EXIT ຂອງເກມໄປໃສ, ແລະ ທຸກໄດຣຟ໌. ການຕັ້ງຄ່າ CACHE ຢູ່ນັ້ນ ພາກັບມານີ້.'
  RIPPS2_BADGE_SET: ຊຸດປ້າຍ
  HINT_RIPPS2_BADGE_SET: 'ປ້າຍໃນໜ້າຂໍ້ມູນຂອງເກມ (ເລດ, ຜູ້ຫຼິ້ນ, ESRB, ໂໝດວິດີໂອ, ສະແກນ, ອັດຕາສ່ວນ). RIPPS2: ຊຸດຂອງມັນເອງ, ຄືກັນທຸກທີມ. ທີມ: ຮູບຂອງທີມເອງ, ຫຼື ຂອງ RIPPS2 ເມື່ອທີມຂໍ.'
  RIPPS2_HINT_FADE: ຄຳແນະນຳ ແລະ ສັນຍາລັກ ຄ່ອຍໆຂຶ້ນ
  HINT_RIPPS2_HINT_FADE: 'ຄຳແນະນຳປຸ່ມ ຫຼື ສັນຍາລັກທີ່ປ່ຽນ ຈະຄ່ອຍໆຂຶ້ນ, ຄືໜ້າປົກ, ທັນທີທີ່ມັນປ່ຽນ; ອັນທີ່ຄືເກົ່າ ບໍ່ຖືກແຕະ, ໃນທຸກໜ້າ ແລະ ຂໍ້ຄວາມ. ປິດ: ພວກມັນພຽງແຕ່ຂຶ້ນມາ. ທີມ: ທີມຕັດສິນ (ເປີດ ເວັ້ນແຕ່ມັນບອກ hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: ຮູບແບບແຖບຂ້າງ
  HINT_RIPPS2_SIDEBAR_STYLE: 'ຄລາສສິກ (ແຍກ): ໄອຄອນໃນແຖບມືດຂອງແຖບຂ້າງ ມີແຖບສີຢູ່ຂ້າງ. XL (ຊິ້ນດຽວ): ແຖບກວ້າງອັນດຽວ, ໄອຄອນຢູ່ກາງ. ທີມ: ທີມຕັດສິນ.'
  HINT_EXITPATH: 'ບ່ອນທີ່ EXIT ໃນເມນູໃນເກມໄປ. ດີທີ່ສຸດແມ່ນປ່ອຍຫວ່າງ: EXIT ໄປຫາໂຕທ່ອງ, ເຊິ່ງເລີ່ມໂຕໂຫຼດບູດຂອງທ່ານ (FreeMcBoot, PS2BBL, OSDMenu ຫຼື BIBLE) ເມື່ອມີຕິດຕັ້ງ, ແລະ RIPPS2 ອີກເມື່ອເປີດ BOOT LOCK, ຄືຕອນເປີດເຄື່ອງ; ຖ້າບໍ່ມີ, ໂຕທ່ອງ PS2. ELF ທີ່ພິມຢູ່ນີ້ ຈະໃຊ້ພຽງເມື່ອການຣີເຊັດໂຫຼດມັນໄດ້ (ໃນບັດໜ່ວຍຄວາມຈຳ ຫຼື ໄດຣ USB FAT32) ແລະ ບໍ່ແມ່ນ RIPPS2 ເອງ; ອື່ນໆໄປຫາໂຕທ່ອງ.'
  HINT_BDM_START: 'USB, iLink, MX4SIO ແລະ HDD exFAT. ອັດຕະໂນມັດ ເລີ່ມພວກມັນຕອນບູດ: ໄວທີ່ສຸດ ສຳລັບໄດຣຟ໌ທີ່ສຽບໄວ້, ເກມຂອງພວກມັນຢູ່ໃນ ທຸກເກມ ຕັ້ງແຕ່ຕົ້ນ. ເລືອກເອງ ເລີ່ມພວກມັນ ເມື່ອທ່ານເປີດໜ້າຂອງພວກມັນ.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino ໃຊ້ VMC ໃນ HDD APA ບໍ່ໄດ້ (exFAT, USB ແລະ MX4SIO ໄດ້): ເກມນີ້ເລີ່ມດ້ວຍກາດແທ້ໃນຊ່ອງນັ້ນ.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'ຕອນເລີ່ມ ຈະອ່ານສະເພາະໄດຣຟ໌ຂອງ RIPPS2: ການຕັ້ງຄ່າ ແລະ ສຽງຂ້າງ RIPPS2.ELF (RIPPS2.FB ຢູ່ນັ້ນບອກບ່ອນ) ແລະ ທຸກລາຍການຈາກແຄຊຂອງມັນ. ໄດຣຟ໌ອື່ນລໍຖ້າ: SELECT ໃນໜ້າໃດໜຶ່ງເລີ່ມໄດຣຟ໌ຂອງໜ້ານັ້ນ ແລະ ໂຫຼດຮູບຂອງມັນ (ເມື່ອເປີດການໂຫຼດຄືນອັດຕະໂນມັດ ພວກມັນເລີ່ມຕອນເລີ່ມ). ການເປີດຈະສຳເນົາສຽງຂອງທ່ານ, ແລະ ດົນຕີຖ້າມີບ່ອນ, ໄປໄວ້ໃນ AUDIO ຂ້າງ RIPPS2.'
  RIPPS2_ART_PACK: ແພັກ ART
  RIPPS2_ART_PACK_BUILD: ສ້າງ ຫຼື ລຶບ
  HINT_RIPPS2_ART_PACK: ລວມໂຟນເດີ ART ຂອງທຸກໄດຣຟ໌ທີ່ເລີ່ມແລ້ວ ເຂົ້າເປັນ art.tar ດຽວໃນໄດຣຟ໌ທີ່ທ່ານເລືອກ (ໄດຣຟ໌ທີ່ໄວທີ່ສຸດຖືກສະເໜີກ່ອນ). ໜ້າປົກຈະຖືກໂຫຼດຈາກໄຟລ໌ດຽວດ້ວຍດັດຊະນີດຽວ, ບໍ່ເຄີຍຊອກຫາເທື່ອລະເກມ, ສະນັ້ນເມນູ ແລະ ເພງຈຶ່ງລື່ນໄຫຼ. ໂຟນເດີ ART ຄົງຢູ່ຄືເກົ່າ.
  RIPPS2_LIST_CFG_TEXT: ຫົວຂໍ້ ແລະ ຄຳອະທິບາຍໃນລາຍການ
  HINT_RIPPS2_LIST_CFG_TEXT: 'ຫົວຂໍ້ ແລະ ຄຳອະທິບາຍຂອງເກມຈາກ CFG ຂ້າງລາຍການເກມ. ທີມ: ຕາມທີ່ທີມສະແດງ (ທີມຂອງ RIPPS2 ບໍ່ສະແດງ). ໜ້າຂໍ້ມູນສະແດງສະເໝີ.'
  RIPPS2_PS1_PREFER: ເກມ PS1 ຊ້ຳ
  HINT_RIPPS2_PS1_PREFER: 'ເກມ PS1 ທີ່ເປັນທັງ VCD ຂອງ POPSTARTER ແລະ ອິມເມດ Ember. ທັງສອງ: ສອງແຖວ. Ember: ສະເພາະ Ember. POPSTARTER: ສະເພາະ VCD. ຫົວຂໍ້ດຽວກັນ ໂດຍບໍ່ນັບ ID ແຜ່ນທາງໜ້າ ແມ່ນເກມດຽວກັນ.'
  RIPPS2_MY_PADS: ຈອຍຂອງຂ້ອຍ
  HINT_RIPPS2_MY_PADS: 'ໂປຣໄຟລ໌ .pad ໃນໂຟນເດີ PADS ຂ້າງ RIPPS2: ໄຟລ໌ຂໍ້ຄວາມໜຶ່ງຕໍ່ຈອຍ USB ໜຶ່ງ, ຕັ້ງຊື່ຕາມ ID ຂອງມັນ (2563_0575.pad), ແລະ ກວດແຕ່ລະອັນແລ້ວ. ຈອຍທີ່ມີໂປຣໄຟລ໌ຄວບຄຸມເມນູ ແລະ ຫຼິ້ນໃນເກມ (ເປີດ Pad Emulator).'
  RIPPS2_PAD_SETUP: ຕັ້ງຄ່າຈອຍ USB
  HINT_RIPPS2_PAD_SETUP: ສຽບຈອຍ USB ທີ່ RIPPS2 ບໍ່ຮູ້ຈັກ, ກົດແຕ່ລະປຸ່ມທີ່ມັນຂໍ, ແລ້ວ RIPPS2 ຈະຂຽນ .pad ຂອງມັນໄວ້ໃນ PADS. SELECT ເທິງຈອຍ PS2 ຂອງທ່ານຂ້າມໜຶ່ງປຸ່ມ.
