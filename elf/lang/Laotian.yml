# RIPPS2 in Laotian. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Laotian
strings:
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "ຊ່ອງ 0: %s\nຊ່ອງ 1: %s\n%s\nRIPPS2: ກຳລັງຕັ້ງ BIBLE. BIBLE, ບູດໂຫຼດເດີຂອງ akilluminati47 ທີ່ສ້າງຈາກ PS2BBL ຂອງ El Isra, ທີ່ RIPPS2 ຕັ້ງໄວ້ໃນເມມໂມຣີກາດ PS2 ມາດຕະຖານ 8 MB ຫຼື ຮາດດິດພາຍໃນ: ເລີ່ມໃນ 0 ms ຕອນເປີດເຄື່ອງ (PS2BBL Extended ບໍ່ອະນຸຍາດ 0), RIPPS2 ກ່ອນຈາກບ່ອນທີ່ມັນຢູ່ (ບໍ່ເຄີຍສຳເນົາ), ແລະ ປຸ່ມທີ່ກົດຄ້າງຕອນເປີດເຄື່ອງຍັງພາໄປຫາບຣາວເຊີ (TRIANGLE), ແຜ່ນດິສກ໌ (START) ແລະ ສິ່ງທີ່ມີກ່ອນ (CIRCLE). ຕັ້ງ, ສ້ອມແປງ ຫຼື ກູ້ຄືນສິ່ງທີ່ມັນແທນ?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: ກຳລັງຕັ້ງ BIBLE\nກາດໃນຊ່ອງ %d ແມ່ນກາດ SD2PSX ຫຼື MMCE. ກາດ BOOT ຂອງມັນເກັບ BIBLE ແທນ PS2BBL ທີ່ມີຢູ່ໄດ້ (ອັນນັ້ນຖືກຍ້າຍອອກໄປກ່ອນ, ທັງໝົດ), ຖ້າເຄື່ອງຜູກ BIBLE ກັບມັນ. ຖ້າການຜູກຖືກປະຕິເສດ, ບໍ່ມີຫຍັງເທິງກາດປ່ຽນ, ແລະ ກາດອາດບໍ່ຕອບຈົນກວ່າຈະປິດແລະເປີດເຄື່ອງໃໝ່. START ຜູກ BIBLE ກັບມັນ."
  "BIND BIBLE": "ຜູກ BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT ຂ້າງ RIPPS2 ມີຄຳຕອບຂອງກາດ.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "ສຳລັບເມມໂມຣີກາດ PS2 ມາດຕະຖານ 8 MB (ກາດ MagicGate, ຫຼື ກາດ BOOT ຂອງ SD2PSX ຫຼື MMCE): ອັນທີ່ຢູ່ໃນຊ່ອງ %d. ຕອນເປີດເຄື່ອງ, PS2BBL ອ່ານການຕັ້ງຄ່າຂອງຊ່ອງ 1 ກ່ອນຊ່ອງ 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "ເຄື່ອງ ບໍ່ຍອມຜູກ BIBLE ກັບເມມໂມຣີກາດໃນຊ່ອງ %d (ຂັ້ນ MagicGate ລົ້ມເຫຼວ). ບໍ່ມີຫຍັງ ເທິງກາດ ຖືກປ່ຽນ. ກາດທີ່ບໍ່ແມ່ນຂອງແທ້ ຫຼື ບໍ່ເຂົ້າກັບ MagicGate ເກັບອັບເດດລະບົບ ບໍ່ໄດ້."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "ກາດ SD2PSX ຫຼື MMCE ອາດບໍ່ຕອບອີກຫຼັງຈາກການຜູກຖືກປະຕິເສດ: ຖ້າຕອນນີ້ເມມໂມຣີກາດ ຫຼື ໄດຣຟ໌ MMCE ຫາຍໄປ, ໃຫ້ປິດເຄື່ອງແລ້ວເປີດໃໝ່."
  "RIP THIS CONSOLE'S AUDIO": "ຖອດສຽງທັງໝົດ ຂອງເຄື່ອງນີ້"
  "sounds or music, from its BIOS": "ສຽງ ຫຼື ເພງ, ຈາກ BIOS ຂອງມັນ"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "ເປີດ ການຕັ້ງຄ່າສຽງ ທີ່ ສຽງ BIOS ແລະ ເພງ BIOS: ຖອດສຽງຂອງເຄື່ອງນີ້ ຫຼື ເພງເມນູຂອງມັນ ໄປໃສ່ AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "ສຽງເປີດ ເປີດ (ໄວ): %s ໃນເມມໂມຣີກາດ, ເມື່ອເສົາຂຶ້ນ"
  "Boot sound On: %s on the memory card, as the pillars rise": "ສຽງເປີດ ເປີດ: %s ໃນເມມໂມຣີກາດ, ເມື່ອເສົາຂຶ້ນ"
  "Boot sound On: %s, once its drive is up": "ສຽງເປີດ ເປີດ: %s, ເມື່ອໄດຣຟ໌ພ້ອມ"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "ເກມນີ້ເລີ່ມຜ່ານ Neutrino, ແລະ RIPPS2 ບໍ່ພົບເລີຍ: ບໍ່ມີທີ່ເສັ້ນທາງໃນການຕັ້ງຄ່າ, ໃນໄດຣຟ໌ຂອງເກມ, ໃນບັດຄວາມຈຳ ຫຼື ໃນໄດຣຟ໌ໃດທີ່ເລີ່ມແລ້ວ. ວາງ Neutrino ຂອງ rickgaiser (github.com/rickgaiser/neutrino) ໃນໂຟນເດີ neutrino ໃນໄດຣຟ໌ຂອງເກມ ຫຼື ບັດຄວາມຈຳ, ຫຼື ຊີ້ ການເປີດເກມ > Neutrino ໄປຫາມັນ."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Neutrino ຂອງທ່ານຢູ່ໃສ, ໂໝດວິດີໂອຂອງມັນ ແລະ ອາກິວເມັນ ທີ່ທຸກການເປີດ Neutrino ໄດ້ຮັບ. ເອົາ Neutrino ທີ່ github.com/rickgaiser/neutrino ແລະ ວາງໃນໂຟນເດີ neutrino ໃນໄດຣຟ໌ ຫຼື ບັດຄວາມຈຳ."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Neutrino ນີ້ເກົ່າກວ່າ 1.3, ເຊິ່ງເລີ່ມເກມຈາກ HDD APA ບໍ່ໄດ້. ຊີ້ ການເປີດເກມ > Neutrino ໄປຫາ Neutrino 1.3 ຫຼື ໃໝ່ກວ່າ."
  "with rickgaiser's Neutrino as its second game core,": "ມີ Neutrino ຂອງ rickgaiser ເປັນແກນເກມທີສອງ,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "ແກນເກມທີສອງ, ໃຊ້ຈາກໄດຣຟ໌ ຫຼື ບັດຄວາມຈຳຂອງທ່ານ (AFL-3.0)"
  "FILE NAME": "ຊື່ໄຟລ໌"
  "GAME LIST": "ລາຍຊື່ເກມ"
  "%s in %s": "%s ໃນ %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "ການຂຽນຖືກປິດຢູ່, ສະນັ້ນ RIPPS2 ບໍ່ສາມາດບັນທຶກລາຍລະອຽດຂອງເກມ ຫຼື ປ່ຽນຊື່ໄດ້. ເປີດບໍ?"
  "BIBLE is built on El Isra's PS2BBL, its card and HDD builds signed for RIPPS2 (GPL-3)": "BIBLE ສ້າງຂຶ້ນຈາກ PS2BBL ຂອງ El Isra, ສະບັບສຳລັບກາດ ແລະ HDD ຖືກເຊັນສຳລັບ RIPPS2 (GPL-3)"
  "START %s": "ເລີ່ມ %s"
  "NETWORK": "ເຄືອຂ່າຍ"
  "%s did not answer. Is it connected?": "%s ບໍ່ຕອບ. ເຊື່ອມຕໍ່ແລ້ວບໍ?"
  ENTER ACCEPTS, ESC CANCELS. ANY BUTTON SHOWS THE KEYS.: ENTER ເພື່ອຍອມຮັບ, ESC ເພື່ອຍົກເລີກ. ປຸ່ມໃດກໍໄດ້ ສະແດງປຸ່ມຕ່າງໆ.
