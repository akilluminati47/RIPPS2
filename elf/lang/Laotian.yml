  'This disc is not compatible: it is a region %d DVD, and this console plays another region''s DVDs. Start it anyway?': 'ແຜ່ນນີ້ ໃຊ້ບໍ່ໄດ້: ມັນແມ່ນ DVD ພາກພື້ນ %d, ແລະ ເຄື່ອງນີ້ ຫຼິ້ນ DVD ຂອງພາກພື້ນອື່ນ. ເລີ່ມມັນຢູ່ບໍ່?'
  ? 'This disc is not compatible: it reads as DVD video but has no DVD video on it (no VIDEO_TS), so a DVD player cannot play it.'
  : 'ແຜ່ນນີ້ ໃຊ້ບໍ່ໄດ້: ມັນອ່ານເປັນ DVD ວິດີໂອ ແຕ່ບໍ່ມີ DVD ວິດີໂອຢູ່ໃນ (ບໍ່ມີ VIDEO_TS), ດັ່ງນັ້ນ ເຄື່ອງຫຼິ້ນ DVD ຫຼິ້ນມັນບໍ່ໄດ້.'
  This is an ESR-patched PS2 game. Put ESR (esr*.elf) in APPS, BOOT or ESR on a memory card or USB drive to start it.: ນີ້ແມ່ນເກມ PS2 ທີ່ແພັດດ້ວຍ ESR. ວາງ ESR (esr*.elf) ໃນ APPS, BOOT ຫຼື ESR ເທິງເມມໂມຣີກາດ ຫຼື USB ເພື່ອເລີ່ມມັນ.
