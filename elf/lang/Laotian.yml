  HINT_EMBER_SHADING: 'ຄວາມເລິກສີ Ember: 15-bit, ຫຼື 24-bit (ທົດລອງ). ຂຽນໄວ້ໃນ EMBER/settings.txt ຂອງອຸປະກອນທີ່ເລີ່ມ. ຄ່າຂອງແຕ່ລະເກມ ມີສິດກ່ອນ.'
  EMBER_CONTROLLER: ຈອຍ Ember
  HINT_EMBER_CONTROLLER: 'ໂໝດຈອຍ Ember: Auto, Analog ຫຼື D2A. ປົກກະຕິ ຕັ້ງແຕ່ລະເກມ ດີທີ່ສຸດ (ສາມຫຼ່ຽມ > ການຕັ້ງຄ່າເກມ Ember), ເຊິ່ງມີສິດກ່ອນອັນນີ້.'
  EMBER_480P_CONFIRM: Ember 480p ບໍ່ສະແດງພາບ ຜ່ານສາຍ composite. ໃຊ້ 480p ບໍ?
  EMBER_SHADING_24: 24-bit (ທົດລອງ)
  EMBER_GAME_SETTINGS: ການຕັ້ງຄ່າເກມ Ember
  HINT_EMBER_GAME_SETTING: ເກມນີ້ເທົ່ານັ້ນ. ກົດ OK ເພື່ອຂຽນ EMBER/games/<name>/settings.txt ກ່ອນເລີ່ມ. ຄ່າເລີ່ມຕົ້ນ ທີ່ບໍ່ໄດ້ແຕະ ເກັບຄ່າທີ່ມີໃນໄຟລ໌ໄວ້; ປ່ຽນຄ່າກັບເປັນ ຄ່າເລີ່ມຕົ້ນ ຈະເອົາການແທນທີ່ ຂອງມັນອອກ.
  EMBER_TIMING: ຈັງຫວະ Ember
  HINT_EMBER_TIMING: 'ຈັງຫວະວິດີໂອ Ember: Auto ເຮັດຕາມພາກພື້ນ ຂອງແຜ່ນ, NTSC ບັງຄັບ 60 Hz, PAL ບັງຄັບ 50 Hz. ຂຽນໄວ້ໃນ EMBER/settings.txt ຂອງອຸປະກອນທີ່ເລີ່ມ.'
  EMBER_GLOBAL_WARNING: ການຕັ້ງຄ່າ Ember ເຫຼົ່ານີ້ ໃຊ້ກັບທຸກເກມ PS1, ແລະ ບາງເກມ ຂັດຂ້ອງ ກັບມັນ. ເພື່ອປ່ຽນເກມດຽວ, ໃຊ້ ສາມຫຼ່ຽມ > ການຕັ້ງຄ່າເກມ Ember ເທິງເກມນັ້ນ.
  RIPPS2_RANDOM: ສຸ່ມ
  RIPPS2_ALL: ທັງໝົດ
  RIPPS2_RANDOM_GAME: ເກມສຸ່ມ
  HINT_RIPPS2_RANDOM_GAME: L2 ແລະ R2 ພ້ອມກັນ ໂດດໄປເກມສຸ່ມ. ຕອນເປີດເຄື່ອງ ແຕ່ລະລາຍຊື່ ກໍເປີດທີ່ເກມສຸ່ມ.
  RIPPS2_ALL_GAMES: ທຸກເກມ
  RIPPS2_SET_METADATA: ຕັ້ງ ເມຕາເດຕາ
  RIPPS2_BOOT_LOCK: ລັອກ ການບູດ
  HINT_RIPPS2_BOOT_LOCK: 'ເລີ່ມ RIPPS2 ຕອນເປີດເຄື່ອງ ຜ່ານໂຕໂຫຼດບູດຂອງທ່ານ: PS2BBL ແລະ FMCB ເລີ່ມມັນທັນທີ, OSDMenu ວາງມັນໄວ້ອັນທຳອິດໃນເມນູ, ແລະ EXIT ຂອງເກມ ກັບມາທາງດຽວກັນ. ປິດ ຄືນສິ່ງທີ່ເຄີຍມີ. ຍັງບໍ່ມີ? ໂຕໂຫຼດບູດ ຕິດຕັ້ງ BIBLE.'
  HINT_COLORS_TEXT: ສີຂໍ້ຄວາມ ຂອງລາຍຊື່ເກມ. ທີມ ຕັ້ງສີຂອງມັນເອງ; ອັນນີ້ ປ່ຽນມັນ ສຳລັບທີມໃນໂຕ.
  HINT_COLORS_SELECTED: ສີ ຂອງເກມທີ່ເລືອກ ແລະ ແຖວທີ່ເລືອກ ໃນໜ້າການຕັ້ງຄ່າ.
  HINT_COLORS_DIALOG: ສີ ຂອງໜ້າການຕັ້ງຄ່າ ແລະ ກ່ອງຂໍ້ຄວາມ.
  HINT_COLORS_TITLE: ສີ ຂອງຊື່ເກມ ໃນໜ້າຂໍ້ມູນ ຂອງມັນ.
  HINT_COLORS_BACKGROUND: ສີ ທາງຫຼັງທຸກຢ່າງ ເມື່ອບໍ່ມີຮູບ ຫຼື ຫໍຄອຍ ແຕ້ມ.
  HINT_COLORS_PLASMA: ສີ ທີ່ພື້ນຫຼັງ plasma ເກົ່າຂອງ OPL ປົນໄປຫາ (ທີມ <OPL>).
  HINT_COLORS_RESET: ຄືນສີທັງຫົກ ຂ້າງເທິງ ເປັນສີ ຂອງທີມເອງ.
  HINT_COVERFLOW_COUNT: RIPFLOW ສະແດງໜ້າປົກ ຈັກອັນ ໃນແຕ່ລະຂ້າງ ຂອງອັນທີ່ເລືອກ.
  HINT_COVERFLOW_SCALE: RIPFLOW ແຕ້ມໜ້າປົກທີ່ເລືອກ ໃຫຍ່ປານໃດ ທຽບກັບອັນອື່ນ.
  HINT_COVERFLOW_ANIM: ໜ້າປົກ ເລື່ອນໄວປານໃດ ເມື່ອທ່ານເລື່ອນໄປຕາມ flow.
  HINT_NARGS_QB: 'ບູດໄວ: ຂ້າມໜ້າເລີ່ມຕົ້ນ ຂອງ Neutrino. ເປີດຢູ່ນີ້, ມັນຖືກສົ່ງ ສຳລັບທຸກເກມ; ປິດ, RIPPS2 ຍັງສົ່ງມັນເອງ ສຳລັບເກມ USB, iLink ແລະ ເຄືອຂ່າຍ, ບ່ອນທີ່ຕ້ອງການ.'
  HINT_NARGS_DBC: 'ສີດີບັກ: Neutrino ເຕັມຈໍ ດ້ວຍສີ ໃນແຕ່ລະຂັ້ນການໂຫຼດ, ດັ່ງນັ້ນ ຮູບຖ່າຍ ສະແດງວ່າ ເກມຢຸດຢູ່ໃສ.'
  HINT_NARGS_LOGO: ສະແດງໂລໂກ້ PS2 ກ່ອນເກມ (ການເລີ່ມ IOP ໃໝ່ ເທື່ອທີສອງ, ເຊິ່ງບາງໄດຣຟ໌ iLink ຕ້ອງການ). ປິດຢູ່ນີ້, RIPPS2 ເຮັດຕາມ ການເປີດເກມ > ໂລໂກ້ PS2, ແລະ ບໍ່ເຄີຍສົ່ງມັນ ສຳລັບເກມ MMCE ຫຼື ເຄືອຂ່າຍ.
  HINT_NARGS_CWD: 'ໂຟນເດີ ທີ່ເກມເຫັນເປັນຂອງມັນເອງ. ວ່າງ: ຄ່າເລີ່ມຕົ້ນ ຂອງ Neutrino.'
  HINT_NARGS_CFG: 'ໄຟລ໌ການຕັ້ງຄ່າ Neutrino ຂອງທ່ານເອງ (-cfg). ວ່າງ: ຂອງ Neutrino.'
  HINT_NARGS_ELF: 'ເລີ່ມ ELF ນີ້ ແທນໄຟລ໌ບູດ ທີ່ແຜ່ນລະບຸ. ວ່າງ: ຂອງເກມເອງ.'
  HINT_NARGS_ATA0: ຮູບ HDD ທີ່ Neutrino ເມົາເປັນ HDD ພາຍໃນ ຂອງເຄື່ອງ, ສຳລັບເກມທີ່ໃຊ້ HDD (-ata0).
  HINT_NARGS_ATA0ID: ໄຟລ໌ ID ທີ່ຄູ່ກັບຮູບ HDD ນັ້ນ (-ata0id).
  HINT_NARGS_ATA1: ຮູບ HDD ທີສອງ (-ata1).
  RIPPS2_LAST_USED: ໃຊ້ຫຼ້າສຸດ
  RIPPS2_PAGE_BUTTONS: ປຸ່ມ ປ່ຽນໜ້າ
  HINT_RIPPS2_PAGE_BUTTONS: 'ປຸ່ມບ່າ ອັນໃດ ປ່ຽນໜ້າ ລາຍຊື່ເກມ. L2 / R2: ພວກມັນປ່ຽນໜ້າ ແລະ L1 / R1 ປ່ຽນໝວດ. L1 / R1: ພວກມັນປ່ຽນໜ້າ ແລະ L2 / R2 ປ່ຽນໝວດ. ທີມ: ທີມຕັດສິນ; ຖ້າບໍ່ມີ, L2 ໄປເທິງສຸດ ແລະ R2 ໄປທ້າຍ. L2 + R2 ພ້ອມກັນ ເລືອກເກມສຸ່ມສະເໝີ.'
  RIPPS2_IGR_MENU: ເມນູ ໃນເກມ
  HINT_RIPPS2_IGR_MENU: 'ເປີດ: L1+L2+R1+R2+SELECT+START ຢຸດເກມຊົ່ວຄາວ: ສືບຕໍ່, ອອກ, ຖ່າຍພາບໜ້າຈໍ, ເບິ່ງຜົນງານ ຫຼື ປິດເຄື່ອງ. ປິດ: ປຸ່ມລວມຈະອອກຈາກເກມທັນທີ ຄືເກົ່າ.'
  RIPPS2_BOOT_LOADER: ໂຕໂຫຼດບູດ
  HINT_RIPPS2_BOOT_LOADER: ສະແດງວ່າ ແຕ່ລະເມມໂມຣີກາດ ເລີ່ມຫຍັງ ຕອນເປີດເຄື່ອງ, ແລະ ຕິດຕັ້ງ BIBLE (PS2BBL ທີ່ຕັ້ງສຳລັບ RIPPS2). ໄຟລ໌ບູດເກົ່າ ຂອງກາດ ຖືກເກັບໄວ້.
  RIPPS2_MANAGE: ຈັດການ
  RIPPS2_ACHIEVEMENTS: ຄວາມສຳເລັດ
  RIPPS2_NBD_SERVER: ເຊີບເວີ NBD
  HINT_RIPPS2_NBD_SERVER: ແບ່ງປັນ ຮາດດິສ ກັບ PC ຜ່ານເຄືອຂ່າຍ. ໜ້າສະຖານະ ຢູ່ ໃນຂະນະທີ່ມັນເຮັດວຽກ.
  RIPPS2_START: ເລີ່ມ
  RIPPS2_COVER_ART: ໜ້າປົກ
  HINT_RIPPS2_COVER_ART: ດາວໂຫຼດໜ້າປົກ ສຳລັບທຸກເກມ PS2 ໃນລາຍຊື່ທີ່ເລີ່ມແລ້ວ ທີ່ຍັງບໍ່ມີ, ໄປໂຟນເດີ ART ຂອງໄດຣຟ໌ນັ້ນ, ຈາກ ps2-covers ຂອງ xlenore ເທິງ GitHub. ຕ້ອງການສາຍເຄືອຂ່າຍ ແລະ ອິນເຕີເນັດ.
  RIPPS2_DOWNLOAD: ດາວໂຫຼດ
  RIPPS2_GLYPHS: ສັນຍາລັກ D-pad
  HINT_RIPPS2_GLYPHS: 'ສັນຍາລັກ D-pad ຂ້າງຊື່ໄດຣຟ໌ ແລະ ຮູບແບບ. ຄ່ອຍໆ ປາກົດ ສະແດງພວກມັນ ເມື່ອທ່ານປ່ຽນ; ຄ່ອຍໆ ຫາຍໄປ ສະແດງພວກມັນ ເມື່ອໜ້າເປີດ. ທີມ: ທີມຕັດສິນ.'
  RIPPS2_COLOR_THEME: ທີມສີ
  HINT_RIPPS2_COLOR_THEME: 'ສີດຽວ ສຳລັບຫໍຄອຍ, ລູກແກ້ວ, ແກ້ວ, ເຄື່ອງຫຼິ້ນ CD ແລະ ໂຕທ່ອງໄຟລ໌, ໃນທັງສາມແຖບ. ທີມ: ທີມຕັດສິນ (ສີຟ້າ RIPPS2 ບ່ອນທີ່ມັນບໍ່ຕັດສິນ).'
  RIPPS2_HINTS: ຄຳແນະນຳ ປຸ່ມ
  HINT_RIPPS2_HINTS: 'ຄຳແນະນຳປຸ່ມ ຢູ່ລຸ່ມສຸດ. ຈາງ ເມື່ອບໍ່ໄດ້ໃຊ້ ເຊື່ອງພວກມັນ ຈົນທ່ານກົດປຸ່ມ. ທີມ: ທີມຕັດສິນ.'
  RIPPS2_CATEGORY_BAR: ໝວດ/ແຖບຂ້າງ
  HINT_RIPPS2_CATEGORY_BAR: 'ເປີດແຜ່ນ, ບ່ອນເກັບຂໍ້ມູນ ແລະ ໄຟລ໌ໃນໜ່ວຍຄວາມຈຳ: ຊື່ຢູ່ເທິງ, ຫຼື ແຖບຂ້າງ. ຈາງ ເມື່ອບໍ່ໄດ້ໃຊ້ ເຮັດໃຫ້ຊື່ຈາງ, ຫຼື ເລື່ອນແຖບຂ້າງອອກ, ຈົນກວ່າທ່ານກົດປຸ່ມ; ມັນກັບມາທັນທີ. ທີມ: ທີມຕັດສິນ.'
  RIPPS2_SOURCE_NAME: ຊື່ແຫຼ່ງ
  RIPPS2_STATUS: ສະຖານະ
  RIPPS2_SOURCE: ແຫຼ່ງ
  HINT_RIPPS2_SOURCE_NAME: 'ຊື່ແຫຼ່ງ ເທິງເກມ (ທຸກເກມ, ເກມ HDD ແລະ ອື່ນໆ). ຈາງ ເມື່ອບໍ່ໄດ້ໃຊ້ ເຮັດໃຫ້ມັນຈາງ ພ້ອມແຖບໝວດ; ປາກົດຂຶ້ນທັນທີ ສະແດງມັນໃຫຍ່ ກາງໜ້າແທນ, ຄືທີ່ L3 ບອກຊື່ລາຍຊື່, ໃນລາຍຊື່ທຳອິດ ຫຼັງເປີດເຄື່ອງ ແລະ ທຸກເທື່ອທີ່ແຫຼ່ງປ່ຽນ, ແລ້ວຈາງໄປ. ປາກົດຂຶ້ນທັນທີ ແລະ ຊື່ ເຮັດທັງສອງຢ່າງ. ທີມ ເຮັດໃຫ້ ປາກົດຂຶ້ນທັນທີ ເປັນ ສະແດງ ຂອງມັນໄດ້. ທີມ: ທີມຕັດສິນ.'
  RIPPS2_RECENTS: ເກມຫຼ້າສຸດ
  HINT_RIPPS2_RECENTS: 'ເກມຫຼ້າສຸດ, ໜ້າໜຶ່ງໃນແຖບຂ້າງ ທີ່ມີເກມທີ່ທ່ານເປີດຫຼ້າສຸດ, ໃໝ່ສຸດກ່ອນ: ເກັບຈັກອັນ, 1 ຫາ 99 (ສາມຫຼ່ຽມ ພິມຕົວເລກ). ເກມທີ່ໄດຣຟ໌ເປັນ ເລືອກເອງ ຈະເລີ່ມໄດຣຟ໌ນັ້ນ ເມື່ອທ່ານເລືອກມັນ. 0 ປິດໜ້ານີ້.'
  RIPPS2_CATEGORY_ORDER: ລຳດັບໝວດ
  HINT_RIPPS2_CATEGORY_ORDER: 'ສະຫຼັບ ເປີດແຜ່ນ ແລະ ໄຟລ໌ໃນໜ່ວຍຄວາມຈຳ: ໄຟລ໌ໃນໜ່ວຍຄວາມຈຳ ກ່ອນ ແລະ ເປີດແຜ່ນ ສຸດທ້າຍ, ທັງໃນຊື່ຂອງແຖບ ແລະ ໄອຄອນຂອງແຖບຂ້າງ. ເຮັດສຳລັບ RIPFLOW (ໜ້າຕາ > ທີມ). ທີມ: ທີມຕັດສິນ.'
  RIPPS2_MUSIC: ເພງ
  HINT_RIPPS2_MUSIC: ຫຼິ້ນໄຟລ໌ bgm ໃນໂຟນເດີ AUDIO ຂ້າງ RIPPS2 ແລະ ໃນໂຟນເດີ AUDIO ຂອງ OPL ເທິງແຕ່ລະໄດຣຟ໌ທີ່ເລີ່ມ (Ogg ທີ່ບໍ່ມີແທັກ, ຫຼື WAV 16-bit); ອັນທີ່ຊື່ Menu ຫຼິ້ນກ່ອນ. ເພງຂອງທີມເອງ ຫຼິ້ນແທນ ຖ້າມີ.
  RIPPS2_BIOS_SOUNDS: ສຽງ BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'ຂຽນສຽງເມນູ ຂອງເຄື່ອງນີ້ເອງ ຈາກ BIOS ຂອງມັນ ໃສ່ໂຟນເດີ AUDIO ເປັນສຽງຂອງ RIPPS2 (ຕ່ຳກວ່າ 1 MB). ເພງເມນູ ແມ່ນການຖອດ ແຍກຕ່າງຫາກ: ເພງ BIOS.'
  RIPPS2_RIP: ຖອດ
  RIPPS2_HINTS_GLYPHS: ຄຳແນະນຳ ແລະ ສັນຍາລັກ
  HINT_RIPPS2_HINTS_GLYPHS: ຄຳແນະນຳປຸ່ມ ແລະ ສັນຍາລັກ ເບິ່ງຄືແນວໃດ. ແຕ່ລະແຖວ ເລີ່ມທີ່ ທີມ, ສິ່ງທີ່ທີມເລືອກ; ການເລືອກອື່ນ ເປັນຂອງທ່ານ ແລະ ມີສິດກ່ອນ ທຸກທີມ.
  RIPPS2_HINT_LAYOUT: ການຈັດ ຄຳແນະນຳ
  HINT_RIPPS2_STARSIDE: 'ດາວຂອງເກມທີ່ມັກ ຢູ່ໃສໃນລາຍການ. ຊ້າຍ: ຖັນຂອງມັນເອງ ຢູ່ຕົ້ນແຕ່ລະແຖວ. ຂວາ: ຫຼັງຊື່. ເຊື່ອງ (ເລີ່ມຕົ້ນ): ບໍ່ມີດາວ ແລະ ບໍ່ມີຖັນ, ຊື່ເຕັມ. ທີມ: ຕາມທີ່ທີມບອກ. R3 ໝາຍເກມວ່າມັກ ບໍ່ວ່າແນວໃດ; ກົດ R3 ຄ້າງ 4 ວິນາທີ ໃນລາຍການ ເພື່ອເຊື່ອງດາວ ຫຼື ເອົາກັບມາ (ອັນນີ້ ໝາຍເກມທີ່ຢູ່ໃຕ້ເຄີເຊີດ້ວຍ).'
  HINT_RIPPS2_HINT_LAYOUT: 'ແຖວ: ຄຳແນະນຳ ໃນແຖວດຽວ. ຖັນ: ໜຶ່ງຄຳແນະນຳ ຕໍ່ແຖວ, ລາຍການ ຢູ່ຂ້າງ, ເລີ່ມຈາກບ່ອນ ທີ່ທີມວາງຄຳແນະນຳ.'
  RIPPS2_HINT_LABELS: ປ້າຍ ຄຳແນະນຳ
  HINT_RIPPS2_HINT_LABELS: ສັນຍາລັກ ຢ່າງດຽວ ແຕ້ມແຕ່ປຸ່ມ, ສຳລັບສັນຍາລັກ ທີ່ມີຄຳຂອງມັນເອງ. ປ້າຍ ວາງສັນຍາລັກ ແລະ ຫົວຂໍ້ ຂອງແຕ່ລະຄຳແນະນຳ ນຳກັນ ເທິງປ້າຍດຽວ.
  RIPPS2_HINT_MENU: ຄຳແນະນຳ ເມນູ (START)
  RIPPS2_HINT_REFRESH: ຄຳແນະນຳ ເອີ້ນຄືນໃໝ່ (SELECT)
  RIPPS2_HINT_STAR: ຄຳແນະນຳ ໂປດ (R3)
  RIPPS2_HINT_VIEW: ຄຳແນະນຳ ມຸມມອງ (L3)
  HINT_RIPPS2_HINT_SHOW: ສະແດງ ຫຼື ເຊື່ອງ ຄຳແນະນຳນີ້. ປຸ່ມຂອງມັນ ເຮັດວຽກ ທັງສອງແບບ.
  RIPPS2_GLYPH_SET: ຊຸດສັນຍາລັກ
  HINT_RIPPS2_GLYPH_SET: 'ສັນຍາລັກປຸ່ມ ໃນທຸກໜ້າ: ຂອງທີມເອງ, ຂອງ RIPPS2, ມາດຕະຖານ (ປຸ່ມສີເຂັ້ມ, ສັນຍາລັກມີສີ) ຫຼື ຂາວ (ຂາວລ້ວນ).'
  RIPPS2_HINT_ORDER: ລຳດັບ ຄຳແນະນຳ
  HINT_RIPPS2_HINT_ORDER: ຈັດລຳດັບ ຄຳແນະນຳ. ທີມ ເກັບລຳດັບຂອງທີມ; ລຳດັບຂອງທ່ານ ແມ່ນອັນທີ່ຕັ້ງຢູ່ນີ້.
  RIPPS2_HINT_ORDER_FOLLOW: ລຳດັບ
  RIPPS2_GRID_LAYOUT: ການຈັດ ຕາຕະລາງ
  HINT_RIPPS2_GRID_LAYOUT: ໜ້າຕາຕະລາງ ໃສ່ໜ້າປົກໄດ້ ຈັກອັນ, ດ້ວຍໄລຍະຫ່າງ ຂອງ RIPPS2. ທີມ ເກັບອັນຂອງທີມເອງ.
  RIPPS2_LAUNCH_DISC: ແຜ່ນ ຕອນເປີດເກມ
  HINT_RIPPS2_LAUNCH_DISC: ແຜ່ນຂອງເກມ ເຂົ້າມາ ເມື່ອມັນເລີ່ມ. ປາກົດຂຶ້ນທັນທີ ຢຸດ ແລະ ຈາງ; ໝູນ ໝູນໄວຂຶ້ນເລື້ອຍໆ ຈົນເກມເລີ່ມ. ຂະຫຍາຍ ຢຸດ ແລ້ວ ໃຫຍ່ຂຶ້ນ ໃຫ້ອ່ານໄດ້ຊັດ ແລະ ຢູ່ຕໍ່.
  RIPPS2_TRANSITION: ການປ່ຽນໜ້າ
  HINT_RIPPS2_TRANSITION: 'ໜ້າໃໝ່ ເຂົ້າມາແນວໃດ ເມື່ອທ່ານໄປໝວດອື່ນ: ຈາກສີພື້ນຫຼັງ ຂອງທີມ, ຫຼື ຈາກການກະພິບ. ທີມ ເກັບການເລືອກຂອງທີມ.'
  RIPPS2_CATEGORY_LAYOUT: ການຈັດວາງໝວດ
  HINT_RIPPS2_CATEGORY_LAYOUT: 'ສາມໝວດ ຢູ່ໃສ: ຊື່ຂອງພວກມັນຢູ່ເທິງ, ຫຼື ໄອຄອນລົງຕາມແຖບຂ້າງ, ແຕ່ລະອັນມີລິ້ນຊັກ ຂອງໜ້າຂອງມັນ (ຊ້າຍ ໃນລາຍການ ໄປບ່ອນນັ້ນ), ຫຼື ເມນູ: ບໍ່ມີແຖບເລີຍ, ໝວດຢູ່ໃນເມນູ START ຄືທີມທີ່ເຮັດສຳລັບ OPL. ທີມ ໃຊ້ຂອງທີມເອງ.'
  RIPPS2_CACHE: ແຄຊ
  HINT_RIPPS2_CACHE: 'ວິທີເກັບລາຍຊື່ເກມຂອງແຕ່ລະແຫຼ່ງ ເພື່ອໃຫ້ໜ້າຂອງມັນເປີດທັນທີ: Fast Cache, ລາຍຊື່ຂອງ HDD ພາຍໃນ ແລະ ການໂຫຼດຄືນອັດຕະໂນມັດ.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'ແຕ່ລະແຫຼ່ງ ເກັບລາຍການເກມຫຼ້າສຸດຂອງມັນ (RIPPS2.LST ຂ້າງໂຟນເດີ CD ແລະ DVD) ແລະ ສະແດງມັນ ທັນທີທີ່ແຫຼ່ງຕອບ. Trust Cache ຕັດສິນວ່າ ຈະອ່ານແຫຼ່ງໃໝ່ຫຼັງຈາກນັ້ນ ຫຼື ບໍ່. ປິດ: ອ່ານແຕ່ລະລາຍການຈາກແຫຼ່ງກ່ອນ, ຄືເກົ່າ.'
  HINT_RIPPS2_VIGNETTE: ເຮັດໃຫ້ຂອບ ຂອງທຸກໜ້າປົກ ມືດລົງ ຍົກເວັ້ນອັນທີ່ເລືອກ, ເພື່ອໃຫ້ອັນທີ່ເລືອກ ເດັ່ນ. ອ່ອນ ແມ່ນເຄິ່ງໜຶ່ງ ຂອງ ເຕັມ.
  RIPPS2_GRID_WIDE: ການຈັດຕາຕະລາງ ຈໍກວ້າງ
  HINT_RIPPS2_GRID_WIDE: ໜ້າຕາຕະລາງ ເທິງພາບ 16:9 ເທົ່ານັ້ນ (ຈໍກວ້າງ, 720p, 1080i), ບ່ອນທີ່ໜ້າປົກ ແຄບລົງ ແລະ ໃສ່ໄດ້ຫຼາຍຂຶ້ນ. ທີມ ໃຊ້ອັນຂອງທີມ; ຄືກັນ ເຮັດຕາມ ການຈັດຕາຕະລາງ.
  RIPPS2_BGBLUR: ຄວາມມົວ ພື້ນຫຼັງ
  HINT_RIPPS2_BGBLUR: ແກ້ວຝ້າ ເຮັດໃຫ້ຮູບພື້ນຫຼັງ ຂອງເກມ ມົວແຮງປານໃດ. ທີມ ໃຊ້ຄ່າຂອງທີມເອງ (ອ່ອນ ເທິງ RIPGRID ແລະ Adapt).
  HINT_RIPPS2_HINT_SLOT: ຄຳແນະນຳ ໃນບ່ອນນີ້. ຄຳແນະນຳ ທີ່ເຄີຍຢູ່ນີ້ ຍ້າຍໄປບ່ອນເກົ່າ ຂອງຄຳແນະນຳທີ່ເລືອກ.
  PS1_SAVE_GUIDANCE: ເຊບ PS1 ຂຶ້ນກັບ Ember ຫຼື POPSTARTER; ການຕັ້ງຄ່າ VMC ຂອງ PS2 ບໍ່ໃຊ້.
  NEUTRINO_SHOW_ARGS: ສະແດງ ອາກິວເມັນເລີ່ມ
  HINT_NEUTRINO_SHOW_ARGS: ກ່ອນເລີ່ມ Neutrino ແຕ່ລະເທື່ອ, ສະແດງທຸກອາກິວເມັນ ທີ່ Neutrino ຈະໄດ້ຮັບ ແລະ ຖາມວ່າ ສືບຕໍ່ ບໍ. ກັບຄືນ ກັບໄປເມນູ ໂດຍບໍ່ເລີ່ມ.
  NEUTRINO_ARGS_CONFIRM: Neutrino ຈະເລີ່ມ ດ້ວຍອາກິວເມັນເຫຼົ່ານີ້. ເລີ່ມ ບໍ?
  HINT_NARGS_EXTRA: ແຟລັກ Neutrino ອື່ນ, ແຍກດ້ວຍຍະຫວ່າງ, ສົ່ງຫຼັງທຸກຢ່າງ ຂ້າງເທິງ. RIPPS2 ເພີ່ມສະເໝີ -bsd ແລະ -dvd ສຳລັບໄດຣຟ໌ ແລະ ISO ຂອງເກມ, -mc0 ແລະ -mc1 ສຳລັບ VMC ຂອງມັນ, -gsm ສຳລັບໂໝດວິດີໂອ ຂອງມັນ, ແລະ ໂໝດຄວາມເຂົ້າກັນໄດ້ ຂອງເກມເອງ. ແຟລັກທີ່ມີແຖວ ຂອງມັນເອງ ຂ້າງເທິງ (ເຊັ່ນ -logo) ຍ້າຍໄປແຖວນັ້ນ ຕອນບັນທຶກ, ແລະ ຍັງຖືກສົ່ງ.
  HINT_RIPPS2_THEME: ໜ້າຕາ ຂອງທຸກໜ້າ. ໃນລາຍຊື່ເກມ, ກົດ SELECT ຄ້າງໄວ້ 4.2 ວິນາທີ ເພື່ອປ່ຽນໄປທີມຕໍ່ໄປ; ການກົດ SELECT ໄວໆ ຍັງເອີ້ນລາຍຊື່ຄືນໃໝ່.
  GAME_TYPE_LABELS: ສະແດງປ້າຍ [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: ບັນທຶກລາຍການສູດໂກງ ໃສ່ໂຟນເດີ Neutrino ບໍ່ໄດ້, ດັ່ງນັ້ນ Neutrino ໃຊ້ມັນບໍ່ໄດ້. ເລີ່ມ ໂດຍບໍ່ມີສູດໂກງ ບໍ?
  AUTO_CREATE_VMC: ສ້າງ VMC ຕອນເປີດເທື່ອທຳອິດ
  HINT_AUTO_CREATE_VMC: "ການເປີດເກມ PS2 ທີ່ບໍ່ມີ VMC ໃນຊ່ອງ 0 ຈະສ້າງກາດ 8 MB ໃນອຸປະກອນຂອງເກມ, ຕັ້ງຊື່ຕາມທີ່ໜ້າຈໍ VMC ແນະນຳ (ໃຊ້ຮ່ວມກັນທຸກແຜ່ນຂອງເກມ), ແລະ ກຳນົດມັນ. ພາຍໃຕ້ Neutrino ບໍ່ແມ່ນໃນ HDD APA (HDD exFAT ໃຊ້ໄດ້)."
  AUTO_VMC_CREATING: ກຳລັງສ້າງ VMC ຂອງເກມນີ້...
  AUTO_VMC_FAILED: ສ້າງ VMC ຂອງເກມນີ້ ບໍ່ໄດ້. ເກມເລີ່ມ ໂດຍບໍ່ມີມັນ.
  RIPPS2_BIOS_MUSIC: ເພງ BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'ຂຽນເພງເມນູ ຂອງເຄື່ອງນີ້ (ເພງບັນຍາກາດ ຂອງໂຕທ່ອງ, ປະມານ 15 MB ເປັນ WAV) ໃສ່ໂຟນເດີ AUDIO ທີ່ທ່ານເລືອກ: ຂ້າງ RIPPS2, ຫຼື ຂອງ OPL ເທິງໄດຣຟ໌ທີ່ເລີ່ມ. ໃຫຍ່ເກີນ ສຳລັບເມມໂມຣີກາດ. ຂະໜາດຂອງມັນ ສະແດງກ່ອນ.'
  SAVE_ICONS: ໄອຄອນເຊບ 3D
  HINT_SAVE_ICONS: ສະແດງໄອຄອນເຊບ ຂອງເກມທີ່ເລືອກ, ໝູນຢູ່, ບ່ອນທີ່ທີມມີບ່ອນໃຫ້ມັນ. ອ່ານ VMC ຂອງເກມເອງ ກ່ອນ, ແລ້ວ ເມມໂມຣີກາດ.
  NETBOOT_RESTART_NOW: ໂປໂຕຄອນເຄືອຂ່າຍ ປ່ຽນ ຫຼັງເລີ່ມໃໝ່. ບັນທຶກການຕັ້ງຄ່າ ແລະ ເລີ່ມ OPL ໃໝ່ ດຽວນີ້ ບໍ?
  HINT_NET_PROTOCOL: 'ບໍລິການເຄືອຂ່າຍ ທີ່ RiptOPL ໃຊ້: ແຊ SMB, UDPFS, UDPBD ຫຼື HTTP. ການປ່ຽນຈາກອັນທີ່ກຳລັງເຮັດວຽກ ຕ້ອງເລີ່ມໃໝ່.'
  HINT_UDPFS_ACCESS: UDPFS ເທົ່ານັ້ນ. ໄຟລ໌ ອ່ານ ISO ແຍກ ຈາກໂຟນເດີເກມ ຂອງເຊີບເວີ; IMG ອ່ານຮູບດິສ ເປັນໄດຣຟ໌. SMB ແລະ HTTP ໃຊ້ ໄຟລ໌ ສະເໝີ, UDPBD ໃຊ້ IMG ສະເໝີ.
  HINT_SMB_VERSION: ເວີຊັນ SMB ທີ່ໃຊ້ ສື່ສານກັບແຊ ຂອງ PC.
  HINT_NET_ADVANCED: ປົດລັອກ ໂໝດລິ້ງ Ethernet ແລະ ພອດ SMB ເພື່ອແກ້ໄຂ.
  HINT_ETH_LINK_MODE: ບັງຄັບ ຄວາມໄວ ແລະ duplex ຂອງລິ້ງເຄືອຂ່າຍ. ປ່ອຍເປັນ Auto ເວັ້ນແຕ່ລິ້ງ ຂາດເລື້ອຍໆ.
  HINT_IP_ADDR_TYPE: ຄົງທີ່ ໃຊ້ທີ່ຢູ່ ຂ້າງລຸ່ມ; DHCP ຖາມ ເຣົາເຕີ ຂອງທ່ານ. UDPFS ແລະ UDPBD ໃຊ້ ຄົງທີ່ ສະເໝີ.
  HINT_PS2_IP: ທີ່ຢູ່ IP ຂອງ PS2 ເອງ. ເລືອກອັນທີ່ບໍ່ມີອຸປະກອນອື່ນໃຊ້, ໃນຊ່ວງດຽວກັນ ກັບ PC ຂອງທ່ານ.
  HINT_NETMASK: Subnet mask, ປົກກະຕິ 255.255.255.0.
  HINT_GATEWAY: ທີ່ຢູ່ ເຣົາເຕີຂອງທ່ານ, ປົກກະຕິ ສາມຕົວເລກທຳອິດ ຄືກັນ ລົງທ້າຍດ້ວຍ .1.
  HINT_DNS: ທີ່ຢູ່ ເຊີບເວີ DNS. ປົກກະຕິ ຄືກັບ gateway.
  HINT_SMB_ADDR_TYPE: ເຂົ້າເຖິງ PC ດ້ວຍທີ່ຢູ່ IP ຂອງມັນ ຫຼື ຊື່ NetBIOS (ຊື່ຄອມພິວເຕີ).
  HINT_SMB_ADDRESS: 'PC ທີ່ແບ່ງປັນເກມຂອງທ່ານ: ທີ່ຢູ່ IP ຂອງມັນ, ຫຼື ຊື່ຄອມພິວເຕີ ເມື່ອ ປະເພດທີ່ຢູ່ ແມ່ນ NetBIOS.'
  HINT_SMB_PORT: 'ພອດ SMB. ຕ້ອງກົງກັບ PC: PS2 Servers ໃຊ້ 1111, ແຊ Windows ແລະ Samba ໃຊ້ 445.'
  HINT_SMB_USER: ຊື່ຜູ້ໃຊ້ SMB. guest ໃຊ້ໄດ້ ກັບແຊສ່ວນໃຫຍ່.
  HINT_HTTP_SERVER: ທີ່ຢູ່ IP ຂອງ ເຊີບເວີເກມ HTTP.
  HINT_HTTP_PORT: ພອດ ທີ່ເຊີບເວີເກມ HTTP ຮັບຟັງ.
  HINT_HTTP_BASE: ໂຟນເດີ ເທິງເຊີບເວີ HTTP ທີ່ມີ games.csv. / ແມ່ນຮາກ ຂອງເຊີບເວີ.
  HINT_HTTP_TEST: ລອງ ເຊີບເວີ HTTP ດ້ວຍຄ່າ ຂ້າງເທິງ ແລະ ລາຍງານ ສິ່ງທີ່ພົບ.
  HINT_RA_TELEMETRY: ສະວິດຫຼັກ ສຳລັບ RetroAchievements. ປິດ ເລີ່ມເກມ ໂດຍບໍ່ມີ network stack ຫຼື snapshot, ຄືກັບບິວທຳມະດາ.
  HINT_RA_BADGES: ໝາຍເກມ ທີ່ມີຄວາມສຳເລັດ ໃນລາຍຊື່. ຍັງມືດ ໃນຂະນະທີ່ ເທເລເມທຣີ ປິດ.
  HINT_POPS_NET_BUTTON: ແກ້ໄຂໄຟລ໌ເຄືອຂ່າຍ ຂອງ POPSTARTER ເອງ (IPCONFIG.DAT, SMBCONFIG.DAT), ເຊິ່ງເກມ PS1 ຜ່ານ SMB ຕ້ອງການ.
  HINT_POPS_IP_TYPE: 'PS2 ໄດ້ທີ່ຢູ່ ແນວໃດ ໃນຂະນະທີ່ເກມ PS1 ເຮັດວຽກ ຜ່ານ SMB: ຄົງທີ່ ຫຼື DHCP.'
  HINT_POPS_IP: ທີ່ຢູ່ IP ຂອງ PS2 ໃນຂະນະທີ່ເກມ PS1 ເຮັດວຽກ ຜ່ານ SMB.
  HINT_POPS_SMB_IP: ທີ່ຢູ່ IP ຂອງ PC ທີ່ແບ່ງປັນເກມ PS1 ຂອງທ່ານ.
  HINT_POPS_SMB_SHARE: ຊື່ແຊ ເທິງ PC ນັ້ນ ທີ່ມີໂຟນເດີ POPS.
  HINT_LASTPLAYED: ເລີ່ມທີ່ເກມ ທີ່ທ່ານເປີດເທື່ອກ່ອນ.
  HINT_LANGUAGE: ພາສາເມນູ. ເພີ່ມອີກ ໂດຍວາງໄຟລ໌ lang_*.lng ໃນໂຟນເດີ LNG.
  HINT_GSM_DEFAULTS_BUTTON: ການແກ້ໂໝດວິດີໂອ ທີ່ທຸກເກມໄດ້ ເວັ້ນແຕ່ມັນມີ ການຕັ້ງຄ່າ GSM ຂອງມັນເອງ.
  HINT_DEFDEVICE: ໜ້າ ທີ່ RiptOPL ເປີດ ຕອນເປີດເຄື່ອງ.
  HINT_MMCE_MODE: 'ເກມໃນ SD2PSX ຫຼື MemCard PRO2. ອັດຕະໂນມັດ ເລີ່ມມັນຕອນບູດ: ໄວທີ່ສຸດ ສຳລັບກາດທີ່ສຽບໄວ້, ເກມຂອງມັນຢູ່ໃນ ທຸກເກມ ຕັ້ງແຕ່ຕົ້ນ. ເລືອກເອງ ເລີ່ມມັນ ເມື່ອທ່ານເປີດໜ້າຂອງມັນ, ປິດ ເຊື່ອງມັນ.'
  HINT_MMCE_SETTINGS_BUTTON: ຕົວເລືອກ ຊ່ອງ, ກາດບູດ IGR, GameID ແລະ ຈັງຫວະ ສຳລັບ MMCE.
  HINT_ENABLE_USB: ໂຫຼດ ໄດຣເວີ USB storage.
  HINT_ENABLE_MX4SIO: ໂຫຼດ ໄດຣເວີ ອະແດັບເຕີກາດ SD MX4SIO.
  HINT_ENABLE_ILINK: ໂຫຼດ ໄດຣເວີ storage iLink (FireWire).
  HINT_NETSTART: 'ເລີ່ມເຄືອຂ່າຍ: Auto ຕອນເປີດເຄື່ອງ, Manual ເມື່ອທ່ານເປີດໜ້າຂອງມັນ. ປິດ ບໍ່ແຕະ ອະແດັບເຕີເຄືອຂ່າຍ.'
  HINT_APPMODE: ໜ້າໂປຣແກຣມ. Auto ເລີ່ມ ຕອນເປີດເຄື່ອງ, Manual ເມື່ອທ່ານເປີດມັນ, ປິດ ເຊື່ອງມັນ.
  HINT_FAVMODE: ໜ້າ ເກມທີ່ມັກ. Auto ເລີ່ມ ຕອນເປີດເຄື່ອງ, Manual ເມື່ອທ່ານເປີດມັນ, ປິດ ເຊື່ອງມັນ.
  HINT_BDMA_BUTTON: ໄດຣເວີ exFAT ອັນໃດ ທີ່ POPSTARTER ໃຊ້ ສຳລັບເກມ PS1 ເທິງ USB, MX4SIO, MMCE, HDD ຫຼື iLink.
  HINT_VCD_LIST_BUTTON: 'ເກມ PS1 ສະແດງແນວໃດ: ເຊື່ອງ ID ເກມ, ສະແດງແຕ່ແຜ່ນ 1, ສະແດງພາທິຊັນ PP ຂອງ HDD.'
  HINT_MMCE_SLOT: ອຸປະກອນ MMCE ຢູ່ຊ່ອງ ເມມໂມຣີກາດ ອັນໃດ. Auto ຊອກມັນ.
  HINT_MMCE_GAMEID: ບອກອຸປະກອນ MMCE ວ່າ ເກມໃດກຳລັງເລີ່ມ, ເພື່ອໃຫ້ມັນປ່ຽນໄປ ເມມໂມຣີກາດ ຂອງເກມນັ້ນ.
  HINT_MMCE_COMM_BUTTON: ຕົວເລືອກຈັງຫວະ ສຳລັບລິ້ງ MMCE. ປ່ຽນມັນ ສະເພາະຖ້າເກມຄ້າງ ຫຼື ໂຫຼດຊ້າ.
  HINT_MMCE_PATH_BUTTON: ໂຟນເດີເກມ ຢູ່ໃສ ເທິງກາດ MMCE.
  HINT_MMCE_PREFIX: ໂຟນເດີຍ່ອຍ ເທິງກາດ MMCE ທີ່ມີ CD, DVD ແລະ ໂຟນເດີ OPL ອື່ນ. ວ່າງ ໃຊ້ຮາກ ຂອງກາດ.
