  what boot reads first: ສິ່ງທີ່ບູດອ່ານກ່ອນ
  ', the sounds': ', ສຽງ'
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot ເປີດຢູ່. RIPPS2 ເລີ່ມຈາກໄດຣຟ໌ຂອງມັນເອງ (%s): ການຕັ້ງຄ່າ%s ແລະ ທຸກລາຍການຈາກແຄຊຂອງມັນ. ໄດຣຟ໌ອື່ນຈະເລີ່ມເມື່ອທ່ານກົດ SELECT ໃນໜ້າຂອງມັນ ຫຼື ເປີດເກມໃດໜຶ່ງຂອງມັນ.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot ເປີດຢູ່. ສຽງໃຊ້ພື້ນທີ່ %d KB ແລະ ເມມໂມຣີກາດທີ່ RIPPS2 ແລ່ນຢູ່ມີບ່ອນຫວ່າງ %d KB, ສະນັ້ນມັນຍັງຢູ່ໃນ %s.
  ' (%d KB free)': ' (ຫວ່າງ %d KB)'
  ' (%u MB free)': ' (ຫວ່າງ %u MB)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'ຂ້າງ RIPPS2: %sAUDIO%s, ອ່ານກ່ອນໝູ່ຕອນເລີ່ມ'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- ເຄື່ອງຈະຜູກ PS2BBL ກັບກາດນີ້ ແລະ ຂຽນເປັນ %s/%s.
  
    - ການຕັ້ງຄ່າຂອງມັນ, mc%d:/SYS-CONF/PS2BBL.INI, ເລີ່ມ RIPPS2 ຈາກບ່ອນທີ່ມັນຢູ່ (%s) ໂດຍບໍ່ລໍຖ້າ (0 ms, ເຊິ່ງ PS2BBL Extended ບໍ່ອະນຸຍາດ), BOOT LOCK ເປີດ. ບໍ່ສຳເນົາ RIPPS2 ເອງ.
  
    ໂປຣເຊສເຊີ I/O ຈະເລີ່ມໃໝ່ເພື່ອການນີ້ ແລະ ການອ່ານໄດຣຟ໌ທັງໝົດຈະຢຸດຈົນກວ່າຈະແລ້ວ; ດົນຕີ ແລະ ໄດຣຟ໌ຈະກັບມາຫຼັງຈາກນັ້ນ. ໃຫ້ສຽບກາດໄວ້ ແລະ ເປີດເຄື່ອງໄວ້ຈົນກວ່າມັນບອກວ່າແລ້ວ.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'ກາດ SD2PSX ຫຼື MMCE ອາດປ້ອງກັນຕົວເອງຫຼັງຈາກການຂຽນຖືກປະຕິເສດ: ຖ້າຕອນນີ້ເມມໂມຣີກາດ ຫຼື ໄດຣຟ໌ MMCE ຫາຍໄປ, ໃຫ້ປິດເຄື່ອງແລ້ວເປີດໃໝ່.'
  BOOT LOCK ON: BOOT LOCK ເປີດ
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'ແລ້ວ: ເມມໂມຣີກາດໃນຊ່ອງ %d ເລີ່ມສິ່ງທີ່ມັນເຄີຍເລີ່ມກ່ອນ BIBLE. ເກັບ BIBLE ໄວ້ໃນ mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): ເມມໂມຣີກາດໃນຊ່ອງ %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL ເລີ່ມ RIPPS2 ຈາກບ່ອນທີ່ມັນຢູ່ຕອນນີ້ບໍ່ໄດ້ (ມັນເຂົ້າເຖິງເມມໂມຣີກາດ, ໄດຣຟ໌ USB ແລະ MX4SIO), ແລະ RIPPS2 ບໍ່ສຳເນົາຕົວເອງ. ໃຫ້ວາງ RIPPS2.ELF ໄວ້ໃນເມມໂມຣີກາດ ຫຼື ໄດຣຟ໌ USB ແລ້ວເລີ່ມຈາກບ່ອນນັ້ນ, ຫຼື ໃຊ້ PS2BBL Extended ທີ່ອ່ານ MMCE ແລະ ຮາດດິດໄດ້.
  RESTORE SLOT %d'S OLD BOOT LOADER: ກູ້ຄືນຕົວໂຫຼດບູດເກົ່າຂອງຊ່ອງ %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: ຕັ້ງ BIBLE ໄວ້ໃນເມມໂມຣີກາດຊ່ອງ %d ແລ້ວ (mc%d:/%s/%s), BOOT LOCK ເປີດ: ຕອນເປີດເຄື່ອງມັນເລີ່ມ RIPPS2 ຈາກ %s ທັນທີ.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: ກຳລັງຕັ້ງ BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: ກຳລັງຕັ້ງ BIBLE
  
    RIPPS2 ແລ່ນຈາກ %s, ເຊິ່ງ PS2BBL ອ່ານບໍ່ໄດ້ (ມັນອ່ານເມມໂມຣີກາດ, USB ແລະ MX4SIO), ແລະ RIPPS2 ບໍ່ສຳເນົາຕົວເອງ. ການຕັ້ງຄ່າ PS2BBL Extended ໃນກາດນີ້ (%s) ອ່ານມັນໄດ້: START ເປີດ BOOT LOCK, ເພື່ອໃຫ້ມັນເລີ່ມ RIPPS2 ຈາກ %s ຕອນເປີດເຄື່ອງ. ບໍ່ມີຫຍັງອື່ນໃນກາດປ່ຽນ.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: ກຳລັງຕັ້ງ BIBLE
  
    RIPPS2 ແລ່ນຈາກ %s, ເຊິ່ງ PS2BBL ອ່ານບໍ່ໄດ້: ມັນເລີ່ມໂປຣແກຣມຈາກເມມໂມຣີກາດ, ໄດຣຟ໌ USB ຫຼື MX4SIO, ແລະ RIPPS2 ບໍ່ສຳເນົາຕົວເອງ. ໃຫ້ວາງ RIPPS2.ELF ໄວ້ໃນອັນໃດອັນໜຶ່ງ (ໂຟນເດີ APPS ຂອງເມມໂມຣີກາດ, ຫຼື ໄດຣຟ໌ USB), ເລີ່ມຈາກບ່ອນນັ້ນ, ແລ້ວຕັ້ງ BIBLE ອີກຄັ້ງ.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: ກຳລັງຕັ້ງ BIBLE
  
    ເມມໂມຣີກາດໃນຊ່ອງ %d: ຍ້າຍ BIBLE (mc%d:/%s) ໄປໄວ້ຂ້າງໆ, ແລະ ສິ່ງທີ່ມັນແທນ (mc%d:/%s) ກັບໄປບ່ອນເດີມ. ບໍ່ລຶບຫຍັງ. ການຕັ້ງຄ່າ PS2BBL ຍັງຄືເກົ່າ (BOOT LOCK ປິດການລັອກໄດ້).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: ກຳລັງຕັ້ງ BIBLE (ກຳລັງຜູກ PS2BBL ກັບເມມໂມຣີກາດ)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: ກຳລັງຕັ້ງ BIBLE (ກຳລັງເອົາຂອງເກົ່າຄືນ)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: ກຳລັງຕັ້ງ BIBLE (ກຳລັງເລີ່ມໂປຣເຊສເຊີ I/O ໃໝ່)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: ກຳລັງຕັ້ງ BIBLE (ກຳລັງຂຽນລົງເມມໂມຣີກາດ)'
  SET UP BIBLE: ຕັ້ງ BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: ເມມໂມຣີກາດໃນຊ່ອງ %d ມີບ່ອນຫວ່າງ %d KB, ແລະ BIBLE ຕ້ອງການ %d KB ຢູ່ນັ້ນ. ໃຫ້ລ້າງພື້ນທີ່ບາງສ່ວນ ແລ້ວລອງໃໝ່.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : ເມມໂມຣີກາດໃນຊ່ອງ %d ປະຕິເສດ PS2BBL, ສະນັ້ນ RIPPS2 ປ່ອຍກາດໄວ້ຄືເກົ່າ. ກວດບ່ອນຫວ່າງຂອງມັນ ແລ້ວລອງໃໝ່. (DIAG.TXT ຂ້າງ RIPPS2 ມີຄຳຕອບຂອງກາດ.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : ເມມໂມຣີກາດໃນຊ່ອງ %d ບໍ່ຍອມຍ້າຍ BIBLE ໄປຂ້າງໆ, ສະນັ້ນບໍ່ມີຫຍັງປ່ຽນ. (DIAG.TXT ຂ້າງ RIPPS2 ມີຄຳຕອບຂອງກາດ.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): ເມມໂມຣີກາດໃນຊ່ອງ %d ບໍ່ຍອມຮັບ %s ຄືນ, ສະນັ້ນ BIBLE ຍັງຢູ່. (DIAG.TXT ຂ້າງ RIPPS2 ມີຄຳຕອບຂອງກາດ.)
  MUSIC: ດົນຕີ
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s ບໍ່ມີ %s. RIPPOPS ພົບໂປຣແກຣມຈຳລອງ PS1 ຂອງ Sony ຢູ່ %s: START ສຳເນົາ %s ມາບ່ອນນີ້ ແລ້ວເລີ່ມເກມ.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 ບໍ່ເຫັນ %s ໃນ %s%s. POPSTARTER ຕ້ອງການ POPS_IOX.PAK ກັບ POPS.PAK, ຫຼື ກັບ POPS.ELF ແລະ IOPRP252.IMG: ໂປຣແກຣມຈຳລອງ PS1 ຂອງ Sony ຈາກເຄື່ອງຂອງທ່ານເອງ. ມັນອາດພົບພວກມັນຢູ່ບ່ອນທີ່ RIPPS2 ບໍ່ໄດ້ຊອກ (ຖ້າເກມຂອງທ່ານເລີ່ມໄດ້, ມັນພົບ). START ເລີ່ມ, ແລະ ຈະບໍ່ຖາມເຖິງໄດຣຟ໌ນີ້ອີກ.'
  ' (The configs found were set: %s.)': ' (ການຕັ້ງຄ່າທີ່ພົບ ໄດ້ຕັ້ງແລ້ວ: %s.)'
