  Searches the drives for POPSTARTER, the POPS files, Ember, Ember's BIOS and Neutrino, and remembers where each one is.: ຊອກຫາ POPSTARTER, ໄຟລ໌ POPS, Ember, BIOS ຂອງ Ember ແລະ Neutrino ໃນໄດຣຟ໌, ແລະ ຈື່ວ່າແຕ່ລະອັນຢູ່ໃສ.
  'Settings: %s, on a drive the boot waits for (a memory card is quicker)': 'ການຕັ້ງຄ່າ: %s, ໃນໄດຣຟ໌ທີ່ບູດລໍຖ້າ (ເມມໂມຣີກາດໄວກວ່າ)'
  'Settings: %s, read first (the quickest place)': 'ການຕັ້ງຄ່າ: %s, ອ່ານກ່ອນ (ບ່ອນໄວທີ່ສຸດ)'
  Starts every drive now (USB, the HDD, MMCE, MX4SIO and the network), so each one and its space shows here.: ເລີ່ມທຸກໄດຣຟ໌ດຽວນີ້ (USB, HDD, MMCE, MX4SIO ແລະ ເຄືອຂ່າຍ), ເພື່ອໃຫ້ແຕ່ລະອັນ ແລະ ບ່ອນວ່າງຂອງມັນ ຂຶ້ນຢູ່ນີ້.
  The IP and SMB share POPSTARTER uses for PS1 games over the network.: IP ແລະ SMB share ທີ່ POPSTARTER ໃຊ້ ສຳລັບເກມ PS1 ຜ່ານເຄືອຂ່າຍ.
  The diagnostics are in %s.: ຂໍ້ມູນວິນິດໄສຢູ່ໃນ %s.
  The diagnostics could not be written to %s.: ຂຽນຂໍ້ມູນວິນິດໄສໃສ່ %s ບໍ່ໄດ້.
  What each memory card starts at power on; install or repair BIBLE, PS2BBL set up to start RIPPS2.: ສິ່ງທີ່ແຕ່ລະເມມໂມຣີກາດເລີ່ມ ຕອນເປີດເຄື່ອງ; ຕິດຕັ້ງ ຫຼື ສ້ອມແປງ BIBLE, PS2BBL ທີ່ຕັ້ງໄວ້ເພື່ອເລີ່ມ RIPPS2.
  Where POPSTARTER and Ember are, and how PS1 games start.: POPSTARTER ແລະ Ember ຢູ່ໃສ, ແລະ ເກມ PS1 ເລີ່ມແນວໃດ.
  ? Writes what RIPPS2 noted about the pads, the drives, MMCE cards and the last launches to DIAG.TXT beside RIPPS2. Send it with a bug report.
  : ຂຽນສິ່ງທີ່ RIPPS2 ບັນທຶກໄວ້ ກ່ຽວກັບ ຈອຍ, ໄດຣຟ໌, ກາດ MMCE ແລະ ການເປີດຫຼ້າສຸດ ໃສ່ DIAG.TXT ຂ້າງ RIPPS2. ສົ່ງມັນພ້ອມກັບລາຍງານບັນຫາ.
