  : RIPPS2 没有看到 %s (在 %s%s)。POPSTARTER 需要 POPS_IOX.PAK 加 POPS.PAK，或 POPS_IOX.PAK 加 POPS.ELF 和 IOPRP252.IMG：来自你自己主机的 Sony PS1 模拟器。它可能在 RIPPS2 不找的地方找到它们 (如果你的游戏能启动，就是找到了)。START 启动，之后不会再询问这个驱动器。
  ' (The configs found were set: %s.)': ' （找到的配置已设置：%s。）'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' 请先用它自己的配置工具保存一次设置，然后再打开 BOOT LOCK。'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s 无法从 RIPPS2 现在所在的位置（%s）启动它，而 RIPPS2 不会复制自己。请把 RIPPS2.ELF 放到记忆卡或 USB 驱动器上，再从那里启动。'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK 无法写入引导程序的配置。请检查记忆卡或驱动器没有写保护，然后重试。
  BOOT LOCK found no boot loader config to change.: BOOT LOCK 没有找到可更改的引导程序配置。
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK 已关闭。你的引导程序会启动它以前启动的内容（%s）。
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK 已开启。%s 现在开机时启动 RIPPS2（%s），IGR路径留空时，游戏的 EXIT 也会沿同一条路返回。主机启动时按住它的任一按键可以进入其他内容。%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : BOOT LOCK 已把 RIPPS2 放在 OSDMenu 菜单的第一项（%s）。OSDMenu 自己不会启动任何东西：请在那里选择 RIPPS2，游戏的 EXIT 会回到那个菜单。若要主机开机直接启动 RIPPS2，BIBLE 会把 PS2BBL 装到记忆卡上（引导程序）。
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK 通过记忆卡上的引导程序工作（PS2BBL、FMCB 或 OSDMenu），而这里一个也没有。
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: 插槽 %d 的记忆卡开机时启动 %s，但 BOOT LOCK 没有找到它可更改的配置（它查找 %s）。
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 插槽 %d 的记忆卡开机时启动 %s，BOOT LOCK 无法设置它：BOOT LOCK 通过 PS2BBL、FMCB 和 OSDMenu 工作。
  A boot loader with RIPPS2's lock is on this console.: 这台主机上有带 RIPPS2 锁定的引导程序。
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 游戏的 EXIT：浏览器，然后是你的引导程序（BOOT LOCK）
  'In use: %s, %d pictures, %d MB': 使用中：%s，%d 张图片，%d MB
  'Measuring how fast each drive reads its art: %s': 正在测量每个驱动器读取图片的速度：%s
  'None: each picture is read from its own ART folder.': 无：每张图片都从它自己的 ART 文件夹读取。
  REMOVE the pack in %s (the ART folders stay as they are): 删除 %s 中的包（ART 文件夹保持原样）
  Remove the ART Pack in %s? The ART folders stay as they are.: 删除 %s 中的 ART 包吗？ART 文件夹保持原样。
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: 已停止。未完成的包已删除，图片照旧从 ART 文件夹读取。
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 无法把 ART 包写入 %s（该驱动器还有空间吗？）。其他没有任何变化：图片照旧从 ART 文件夹读取。
  The ART Pack in %s is removed. Art loads from the ART folders again.: '%s 中的 ART 包已删除。图片重新从 ART 文件夹读取。'
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : 已启动的驱动器上没有含图片的 ART 文件夹。请先启动存放图片的驱动器（在其页面按 SELECT），然后再回来。
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d 张图片（来自 %d 个 ART 文件夹）将放进一个文件 %s。ART 文件夹保持原样：包只是副本。你可以用 Memory Files 把 art.tar 复制到其他驱动器的 ART 文件夹，但在你平时浏览的驱动器上生成最快，所以最快的驱动器排在最前。现在生成吗？'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : ART 包已生成：%d 张图片，%d MB，位于 %s（%d 秒）。今后图片从包中读取，它所针对的 %d 款游戏再也不会逐张查询各自的 ART 文件夹。RIPPS2 下载或拍下的图片会立即显示；从电脑复制进去的图片在重新生成包后显示。
  '%s free': 剩余 %s
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar：读取 %s/s，%s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar：读取 %s/s，最快，%s'
  ART PACK: ART 包
  About %d min: 约 %d 分钟
  'Looking at the ART folders: %d pictures, %s': 正在查看 ART 文件夹：%d 张图片，%s
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 已启动的驱动器都没有空间放 ART 包：约需 %s。请在你平时浏览的驱动器上腾出空间，然后再试。
  PACKING THE ART: 正在打包图片
  PICTURE %d OF %d: 图片 %d / %d
  'Pictures: %d (%s). ART folders: %d.': 图片：%d 张（%s）。ART 文件夹：%d 个。
  Stop? The unfinished pack is removed; the ART folders stay as they are.: 要停止吗？未完成的包会被删除；ART 文件夹保持原样。
  'The ART folders stay as they are: the pack is a copy.': ART 文件夹保持原样：包只是副本。
  Under a minute: 不到一分钟
  free space unknown: 剩余空间未知
  'A game''s EXIT: the browser, or your boot loader when one is installed': 游戏的 EXIT：浏览器，或已安装的引导程序
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): Ogg Vorbis：Xiph.Org（BSD），minimp3：lieff（CC0）
  RIPFLOW's type, and every message and notification: RIPFLOW 的字体，以及每条消息和通知
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 感谢所有在 Discord 测试、在 GitHub 提交 issue 的朋友：
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': IGR Path %s 不会使用：游戏结束后只能加载记忆卡或 USB 上的文件，且绝不会是 RIPPS2 本身
  an issue is the best way to get RIPPS2 updated.: 提交 issue 是让 RIPPS2 更新的最好方式。
  your Ogg and MP3 music, as RIPPS2 plays it: 你的 Ogg 和 MP3 音乐，按 RIPPS2 的方式播放
  Pop In and Name: 弹出和名称
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s 在柱子之后才启动，所以开机音效会晚到。START 会把 boot.adp（%d KB）复制到记忆卡上 RIPPS2 旁边（剩余 %d KB），这样它会在柱子升起时响起。'
  The boot sound could not be copied to %s. It still plays from %s.: 无法将开机音效复制到 %s。它仍从 %s 播放。
  Zoom: 放大
  '%s could not be deleted; it stays as it was.': 无法删除 %s；它保持原样。
  '%s could not be read as a .tar archive. Nothing was changed.': 无法将 %s 作为 .tar 归档读取。没有任何改动。
  '%s is deleted. %s is kept.': '%s 已删除。%s 保留。'
  Art loads from it from now on.: 从现在起图片从它加载。
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : '删除并入的 .tar？
  
    删除：%s
  
    保留：%s（目标，现已包含两者的所有图片）'
  Into %s (%s): 并入 %s（%s）
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : '保留并更新：%s（%d 张图片）
  
    并入：%s（%d 张图片）
  
    两者都有的图片：%d。以并入的为准。保留的 .tar 会作为新文件重新写入，完整后才替换，所以中途停止或驱动器已满都会让它保持原样。现在合并？'
  MERGE .TAR: 合并 .TAR
  MERGE a .tar into the pack in %s: 将 .tar 合并到 %s 中的包
  MERGING THE ART: 正在合并图片
  Merge in %s (%s): 并入 %s（%s）
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: 把新包合并到另一个 .tar？接下来选择要保留并更新的 .tar；新包的图片会放进去。
  'Merged: %s now holds %d pictures (%d MB), %d s.': 已合并：%s 现有 %d 张图片（%d MB），%d 秒。
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 并入的图片：%d（%s）。两者同名：%d（以并入的为准）。
  'Reading the archives: %s': 正在读取归档：%s
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: 停止？保留的 .tar 保持原样；未完成的副本会被删除。
  Stopped. %s is as it was; the unfinished copy was removed.: 已停止。%s 保持原样；未完成的副本已删除。
  The kept .tar is only replaced once the merged copy is whole.: 只有合并后的副本完整时才会替换保留的 .tar。
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: 无法把合并结果写入 %s 所在的驱动器（空间够吗？）。它保持原样；其他也没有改动。
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : 合并需要约 %s 的可用空间，位于 %s 所在的驱动器（新归档先写在旧归档旁边）。请腾出一些空间后重试。
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 合并在两次重命名之间停止：保留的 .tar 现在是 %s，并入的是 %s。请用记忆文件把名字改回来。
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : 合并后的 .tar 已写入，但无法改名为 %s（MMCE 从固件 1.4.0 起支持重命名）。新文件已删除；保留的 .tar 保持原样。
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : 没有其他 .tar 可以合并到 %s。请把它放在此文件夹、某个驱动器的 ART 文件夹或驱动器根目录，然后重试。
  MERGE A .TAR INTO THIS: 将 .TAR 合并到此
  ? '
  
    %d game button maps in GAMES'
  : '
  
    GAMES 中有 %d 个游戏按键映射'
  ? '
  
    1 game button map in GAMES'
  : '
  
    GAMES 中有 1 个游戏按键映射'
  (no name): (无名称)
  Both: 两者
  ? 'None yet. A profile is a text file named after the pad''s ID, like 2563_0575.pad: the format is in RIPPS2''s repo (docs/plans/pad-spec.md).'
  : 还没有。配置文件是以手柄 ID 命名的文本文件,如 2563_0575.pad:格式见 RIPPS2 仓库(docs/plans/pad-spec.md)。
  On (fast): 开(快速)
  'Pad profiles in %s:': '%s 中的手柄配置:'
  RIPPS2 cannot tell where its folder is, so it cannot look for PADS.: RIPPS2 不知道自己的文件夹在哪,无法查找 PADS。
  could not be read: 无法读取
  About %d seconds left: 约剩 %d 秒
  About 1 second left: 约剩 1 秒
  Taking longer than its last start (%d s so far): 比上次启动慢(已 %d 秒)
  ? 'Download the covers in HD (280 x 400)? Sharper on an HD screen, about 70 KB each. START: Standard (140 x 200, as Open PS2 Loader''s), about 20 KB each. A game that already has a cover keeps it.'
  : 以 HD(280 x 400)下载封面?在 HD 屏幕上更清晰,每张约 70 KB。START:标准(140 x 200,与 Open PS2 Loader 相同),每张约 20 KB。已有封面的游戏保留原封面。
  STANDARD: 标准
  '%d IN': 已加入 %d
  '%d IN, %d REPLACED': 已加入 %d,已替换 %d
  COULD NOT WRITE: 无法写入
  'Getting it ready: %s': 正在准备:%s
  NOT A .TAR: 不是 .TAR
  NOTHING CHANGED: 没有变化
  NOTHING TO PUT IN: 没有可加入的
  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : 开(快速)把开机音放在启动所用记忆卡上的 RIPPS2 旁,但 RIPPS2 并非从记忆卡启动。开机音按「开」播放。
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 还没有可复制的开机音:音频设置 > BIOS 声音可提取本机的声音。
  '%d COPIED OUT': 已复制出 %d
  '%d ITEM   %d MARKED   %s': '%d 项   已标记 %d   %s'
  '%d ITEM   %d MARKED   %s   %s FREE': '%d 项   已标记 %d   %s   可用 %s'
  '%d ITEMS   %d MARKED   %s': '%d 项   已标记 %d   %s'
  '%d ITEMS   %d MARKED   %s   %s FREE': '%d 项   已标记 %d   %s   可用 %s'
  '%s IN %d': '%s / %d 项'
  '%s IN %d, %s FREE': '%s / %d 项,可用 %s'
  ', %d LEFT OUT': ',略过 %d'
  COPY IT OUT TO OPEN IT: 复制出来才能打开
  'Copying out: %s': 正在复制出:%s
  INVERT MARKS: 反选标记
  NO FILES ON THE CLIPBOARD: 剪贴板中没有文件
  SIZE AND FREE SPACE: 大小和可用空间
  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : 游戏内菜单的 CHEATS 可在游戏中逐个开关该游戏的金手指。更改在 RESUME 时生效;关闭的金手指停止写入,已写入的保留。需为该游戏开启 Cheats。
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 游戏内菜单没有 CHEATS:启动前勾选的金手指照旧全程生效。
  BOOT SOUND WITH THE PILLARS: 开机音随光柱响起
  'Boot Sound: On (fast)': 开机音:开(快速)
  'Boot sound On: from the AUDIO folder, once its drive is up': 开机音 开:来自 AUDIO 文件夹,其驱动器就绪后
  Boot sound off (Audio settings > Boot Sound): 开机音 关(音频设置 > 开机音)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: 将 boot.adp 复制到启动所用记忆卡上的 RIPPS2 旁,开机时先于任何驱动器读取。
  '%s could not be written.': 无法写入 %s。
  '%s is there already and could not be put aside, so it was left as it was.': '%s 已存在且无法移到一边，所以保持原样。'
  Circle: 圆圈
  Cross: 叉
  Down: 下
  Down on the d-pad: 方向键下
  Found %04X:%04X. Let go of everything on it, sticks too, and wait.: 找到 %04X:%04X。松开上面所有按键，包括摇杆，然后稍等。
  Got it. Let go.: 收到。松开。
  L3 (press the left stick in): L3（按下左摇杆）
  Left on the d-pad: 方向键左
  Nothing was set up, so no file was written.: 什么都没有设置，所以没有写入文件。
  ? Plug in the USB pad you want to set up. If it is in already, take it out and plug it in again. Then press any button on it once.
  : 插上你要设置的 USB 手柄。如果已经插着，请拔下再插上。然后随便按一次它上面的任意按键。
  Press %s on the USB pad and hold it.: 按住 USB 手柄上的 %s。
  Push %s and hold it.: 推%s并保持。
  R3 (press the right stick in): R3（按下右摇杆）
  Right on the d-pad: 方向键右
  Save: 保存
  Saved as %s. The pad now steers the menu, and plays in games with the Pad Emulator on.: 已保存为 %s。现在这个手柄可以操作菜单，开启 Pad Emulator 后也能在游戏中使用。
  Skip: 跳过
  Square: 方块
  This pad cannot be described in a .pad yet (%s), so no file was written.: 这个手柄还无法用 .pad 描述（%s），所以没有写入文件。
  Triangle: 三角
  'Try it. What you hold shows here:': 试试看。你按住的会显示在这里：
  Up: 上
  Up on the d-pad: 方向键上
  the left stick down: 左摇杆向下
  the left stick to the right: 左摇杆向右
  the right stick down: 右摇杆向下
  the right stick to the right: 右摇杆向右
labels:
  MTAP_ENABLE: 多分插模拟
  HINT_PADEMU_WORKAROUND: 部分仿制 DS3 需要变通处理，此选项会启用它。
  HINT_NEUTRINO_AUTO_ELF: 把游戏的启动 ELF 传给 Neutrino，用于查找该游戏的配置。默认开启；手动设置的 Boot ELF 选项优先。
  HINT_POPSTARTER_PATH: POPSTARTER.ELF 的位置。留空时，RIPPS2 会填入在驱动器上找到的那个；改写可使用别的，例如 usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Neutrino 参数超过可保存的长度。请先缩短某个字段再保存。
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Neutrino 启动参数超过安全上限。请缩短全局参数或游戏参数。
  NEUTRINO_AUTO_ELF: 自动 Boot ELF（-elf）
  HINT_NEUTRINO_PATH: neutrino.elf 在哪里？<未设置> = 游戏所在设备 -> mc0/mc1。会优先尝试自定义完整路径。示例：mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf
  GAME_VIEW_MODE: PS2/PS1 游戏显示
  HINT_GAME_VIEW_MODE: “全部”把 PS2 和 PS1 游戏列在一起，L3 在全部、PS1、PS2 之间切换。PS2 或 PS1 只显示该类型并禁用 L3。APPS 和收藏游戏有各自的规则。
  VIEW_MIXED: 显示 PS2 + PS1 游戏
  VIEW_PS1_ELF: 显示 PS1 ELF 应用
  APPS_DISPLAY: 应用程序显示
  HINT_APPS_DISPLAY: “全部”把每个 ELF 放在同一个 APPS 列表中并禁用 L3。“应用 / PS1ELF”把带 [PS1] 的标题分到 L3 的第二页；启动方式不变。
  VIEW: 视图
  VIEW_PS2: 显示收藏的 PS2 游戏
  VIEW_PS1: 显示收藏的 PS1 游戏
  VIEW_ELF: 显示收藏的 ELF
  VIEW_ALL: 显示全部收藏游戏
  VMC_FRAGMENTED_ON_CREATE: VMC 已创建，但存在碎片。记忆卡模拟需要一个连续的文件，所以启动时会跳过这个 VMC，改用实体记忆卡。请腾出空间后重新创建，或从其他设备复制一个。
  KEYB_MOVE_CURSOR: 移动光标
  TITLECOLOR: 游戏标题颜色
  RA_CHECK_GAME: 检查 RetroAchievements 支持
  RA_TEST_LINK: 测试 RetroAchievements 电脑连接
  RA_CHECKING_IMAGE: 正在检查镜像，需要几秒钟...
  RA_CHECK_RUNNING: 已有一个镜像检查正在进行
