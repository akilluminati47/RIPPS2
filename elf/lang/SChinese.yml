  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d：有一个驱动器未挂载，因为它的扇区不是 512 字节（例如 4K 扇区的硬盘）。OPL 只能读取 512 字节的扇区。'
  HDD_PARTITION_RENAME_UNSUPPORTED: 这个游戏自成一个 APA 分区，而 OPL 从不修改分区表。请在电脑上重命名。
  POPS_SETTINGS_UNREADABLE: 无法读取 POPSTARTER 的设置 -- 记忆卡正忙或无法读取。请在加载完成后重试。
  GLOBAL_PS_EMULATION_SETTINGS: 全局 PS 模拟设置
  RA_NO_LINK_UNTRACKED: 网络不可用 -- 这次不带 RetroAchievements 启动。
  IGR_USB_DRIVERS_PROMPT: IGR 路径在 USB 上，但 %s 中缺少 USBD.IRX 和 USBHDFSD.IRX，主机在游戏内重置后需要它们来访问 USB。没有它们，IGR 会回到 PS2 浏览器。现在复制 RiptOPL 的驱动过去吗？FMCB、OpenTuna 等漏洞程序也会加载这些文件，表现可能有所不同。已有文件不会被替换。仅限 FAT32 的 USB。
  IGR_USB_DRIVERS_FAILED: 无法把 USB 驱动复制到 %s（记忆卡已满或不可写）。IGR 将回到 PS2 浏览器。
