  RA_DISC_CHECKING: 正在为 RetroAchievements 检查光盘
  RA_DISC_HASH_FAILED: 无法计算光盘的哈希 -- 请查看设置目录中的 RA/hashes.txt
  RA_DISC_HOME_ERROR: 设置目录不能用于光盘的追踪列表
  RA_DISC_ENABLE: 请先在网络设置中开启 RetroAchievements 遥测
