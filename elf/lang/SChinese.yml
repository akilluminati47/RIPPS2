  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' 这里的一张记忆卡有自己的 PS2BBL/CONFIG.INI，PS2BBL 会先读它再读硬盘的：开机时取出这张卡，或从这张卡启动 RIPPS2 后重新安装。'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' 开机时按住三角键进入浏览器，按住 START 进入光盘。'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' 按住三角键进入浏览器，START 进入光盘。配置：%s。'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 可以在记忆卡上安装 BIBLE（为启动 RIPPS2 而设置的 PS2BBL）；当前从这张卡启动的内容会保存在备份文件夹中。安装 BIBLE 吗？'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' 硬盘原来的引导程序已保留（管理 > 恢复）。'
