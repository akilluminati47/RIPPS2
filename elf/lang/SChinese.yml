  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE 在开始前就内存不足。未作任何更改。
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE 内存不足。记忆卡上没有任何更改。
  'BIBLE: copying RIPPS2 to %s (%d%%)': BIBLE：正在把 RIPPS2 复制到 %s（%d%%）
  'BIBLE: keeping the HDD''s boot program': BIBLE：正在保留硬盘的引导程序
  'BIBLE: putting the HDD''s boot program back': BIBLE：正在恢复硬盘的引导程序
  'BIBLE: writing PS2BBL to the HDD''s boot area': BIBLE：正在把 PS2BBL 写入硬盘引导区
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : '在内置硬盘上安装 BIBLE

    - RIPPS2 复制到 %s。

    - 读出当前位于 __mbr 的硬盘引导程序，保存在 %s/RIPPS2（恢复会把它放回）。

    - 在它的位置写入 PS2BBL 的硬盘版，并把主机设置为开机时启动它。

    - 它的配置（%s）先从 %s%s%s 启动 RIPPS2，开启 BOOT LOCK。

    这需要能从硬盘启动的主机（带网络适配器的厚机 PS2）。在显示完成之前请保持开机。'
  INTERNAL HDD  (its boot area): 内置硬盘  （其引导区）
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : '放回硬盘原来的引导程序

    BIBLE 保留的那个（硬盘上的 RIPPS2/MBR-BACKUP.KELF）会回到 __mbr，取代 BIBLE。RIPPS2 和 PS2BBL 配置保持原位。'
