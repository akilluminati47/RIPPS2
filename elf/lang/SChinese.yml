  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE 无法把 RIPPS2 复制到硬盘的 %s 分区。请检查剩余空间。其他内容未作更改。
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE 无法保留硬盘引导程序的副本，因此在更改它之前就停止了。RIPPS2 已复制到硬盘；其他内容未作更改。
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE 无法写入它的配置（%s）。引导程序未更改。
