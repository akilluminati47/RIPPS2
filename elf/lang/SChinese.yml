  "File name (as it appears in your games list)": "文件名 (显示在游戏列表中的名称)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "此列表显示其他驱动器上的游戏。请在游戏所在驱动器的页面上重命名。"
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "带星标的游戏无法重命名。请先取消星标 (R3)，重命名后再加上星标。"
  "This drive cannot rename its files. The details can still be set.": "此驱动器无法重命名其文件。仍可设置详细信息。"
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "在 APA 硬盘上，PS2 游戏的名称保存在分区表中，因此无法在此重命名。仍可设置其详细信息。"
  "Renames the app in your list. Its ELF and its art keep their names.": "重命名列表中的应用。其 ELF 和图片的名称不变。"
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "重命名驱动器上的游戏。PS1 游戏按名称查找图片和设置，因此 RIPPS2 会一并重命名。ART Pack 中的图片需要重新构建数据包。"
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "重命名驱动器上的游戏文件。PS2 游戏按游戏 ID 查找图片和设置，因此不会丢失任何内容。"
  "Stop Disc at Launch": "启动时停止光盘"
  "EDIT BIBLE'S SETTINGS FILE": "编辑 BIBLE 的设置文件"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "无法写入 BIBLE 的设置文件（%s）。请确认记忆卡已插好且有空间，然后重试。"
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "找不到 BIBLE 的设置文件（%s）。BIBLE：安装、更新或还原 会写入一个。"
  "Boot sound On (fast): %s, handed over by BIBLE": "开机音 开(快速):%s,由 BIBLE 移交"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE：akilluminati47 的 PS2BBL Extended 分支，每个版本都由 akilluminati47 签名（GPL-3）"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "它的 IOPRP 映像把 BIBLE 绑定到你的记忆卡（GPL-3）：加密由主机完成，无需密钥"
  "KELFBinder by El Isra": "El Isra的 KELFBinder"
  "source: github.com/akilluminati47/BIBLE": "源代码：github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "插槽 0：%s\n插槽 1：%s\n%s\nRIPPS2：正在设置 BIBLE。BIBLE（akilluminati47 基于 El Isra 的 PS2BBL 制作的引导程序），由 RIPPS2 设置在标准 8 MB PS2 记忆卡或内置硬盘上：开机 0 ms 启动 (PS2BBL Extended 不允许 0)，先从 RIPPS2 所在的位置启动它 (从不复制)，开机时按住按钮仍可进入浏览器 (TRIANGLE)、光盘 (START) 和原来的内容 (CIRCLE)。要设置、修复，还是恢复被它替换的内容？"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2：正在设置 BIBLE\n插槽 %d 中的卡是 SD2PSX 或 MMCE 卡。如果主机把 BIBLE 绑定到这张卡，它的 BOOT 卡就能用 BIBLE 替换现有的 PS2BBL（现有的会先整个移到一旁）。如果绑定被拒绝，卡上不会有任何改变，但在主机关机再开机之前，这张卡可能不再响应。按 START 把 BIBLE 绑定到这张卡。"
  "BIND BIBLE": "绑定 BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(卡的回应在 RIPPS2 旁边的 DIAG.TXT 里。)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "适用于标准 8 MB PS2 记忆卡 (MagicGate 卡，或 SD2PSX、MMCE 的 BOOT 卡)：插槽 %d 中的那张。开机时 PS2BBL 先读插槽 1 的设置，再读插槽 0 的。\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "主机不肯把 BIBLE 绑定到插槽 %d 的记忆卡（MagicGate 步骤失败）。记忆卡上没有任何更改。非原装或不兼容 MagicGate 的记忆卡无法存放系统更新。"
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "SD2PSX 或 MMCE 卡在绑定被拒后可能不再响应：如果现在记忆卡或 MMCE 驱动器不见了，请关闭主机再打开。"
  "RIP THIS CONSOLE'S AUDIO": "提取这台主机的音频"
  "sounds or music, from its BIOS": "音效或音乐，来自它的 BIOS"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "打开音频设置的 BIOS 声音和 BIOS 音乐：把这台主机的音效或菜单音乐提取到 AUDIO。"
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "开机音 开(快速):记忆卡上的 %s,光柱升起时"
  "Boot sound On: %s on the memory card, as the pillars rise": "开机音 开:记忆卡上的 %s,光柱升起时"
  "Boot sound On: %s, once its drive is up": "开机音 开:%s,其驱动器就绪后"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "这个游戏通过 Neutrino 启动，但 RIPPS2 没有找到：设置中的路径、游戏所在的驱动器、记忆卡和任何已启动的驱动器上都没有。请把 rickgaiser 的 Neutrino（github.com/rickgaiser/neutrino）放进游戏所在驱动器或记忆卡上的 neutrino 文件夹，或在游戏启动 > Neutrino 中指向它。"
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "你的 Neutrino 的位置、视频模式，以及每次用 Neutrino 启动时传入的参数。 从 github.com/rickgaiser/neutrino 获取 Neutrino，放进驱动器或记忆卡上的 neutrino 文件夹。"
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "这个 Neutrino 早于 1.3，无法从 APA 硬盘启动游戏。请把游戏启动 > Neutrino 指向 Neutrino 1.3 或更新版本。"
