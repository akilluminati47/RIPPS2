  CFM_VMODE_HOLD_KEEP: 按住以保留
  BDM_PS2_FOLDERS_UNREADABLE: 无法打开 %s 中的 CD 或 DVD 文件夹（错误 %d），所以该设备不列出 PS2 游戏。在其页面按 SELECT 重试。
  NEUTRINO_BD_NO_DEVICE_NUMBER: Neutrino 文件系统设为 bd，但这个驱动器从未报告设备编号，所以 Neutrino 无法指向它。请把此游戏的 Neutrino 文件系统设为 Auto 或 exfat。
  CFM_VMODE_REVERT_IN: '%d 秒后恢复'
  EMBER_DITHER: Ember 抖动
  HINT_EMBER_DITHER: Ember 的抖动（开或关），写入启动设备上的 EMBER/settings.txt。单个游戏的设置优先。
  EMBER_SHADING: Ember 着色
  HINT_EMBER_SHADING: Ember 的色深：15 位或 24 位（实验性）。写入启动设备上的 EMBER/settings.txt。单个游戏的设置优先。
  EMBER_CONTROLLER: Ember 手柄
  HINT_EMBER_CONTROLLER: Ember 的手柄模式：自动、模拟或 D2A。通常最好按游戏设置（三角 > Ember 游戏设置），它会优先。
  EMBER_480P_CONFIRM: Ember 在 480p 下通过复合视频没有画面。要使用 480p 吗？
  EMBER_SHADING_24: 24 位（实验性）
  EMBER_GAME_SETTINGS: Ember 游戏设置
  HINT_EMBER_GAME_SETTING: 仅此游戏。按 OK 在启动前写入 EMBER/games/<名称>/settings.txt。未改动的“默认”保留文件中已有的值；把某个值改回“默认”会移除其覆盖。
  EMBER_TIMING: Ember 时序
  HINT_EMBER_TIMING: Ember 的视频时序：自动跟随光盘区域，NTSC 强制 60 Hz，PAL 强制 50 Hz。写入启动设备上的 EMBER/settings.txt。
  EMBER_GLOBAL_WARNING: 这些 Ember 设置对每个 PS1 游戏生效，有些游戏会因此崩溃。若只想改一个游戏，请在该游戏上使用 三角 > Ember 游戏设置。
  RIPPS2_RANDOM: 随机
  RIPPS2_ALL: 全部
  RIPPS2_RANDOM_GAME: 随机游戏
  HINT_RIPPS2_RANDOM_GAME: 同时按 L2 和 R2 跳到随机游戏。“开机时”还会让每个列表打开在一个随机游戏上。
  RIPPS2_ALL_GAMES: 全部游戏
  RIPPS2_SET_METADATA: 设置元数据
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 开机时通过你的引导程序启动 RIPPS2：PS2BBL 和 FMCB 会立即启动它，OSDMenu 会把它放在菜单第一项，游戏的 EXIT 也沿同一条路返回。关闭会恢复以前的内容。还没有？“引导程序”会安装 BIBLE。
  HINT_COLORS_TEXT: 游戏列表的文字颜色。主题有自己的颜色；这里修改的是内置主题的。
  HINT_COLORS_SELECTED: 所选游戏以及设置页面中所选行的颜色。
  HINT_COLORS_DIALOG: 设置页面和消息框的颜色。
  HINT_COLORS_TITLE: 游戏信息页面上游戏名称的颜色。
  HINT_COLORS_BACKGROUND: 没有绘制图片或塔楼时最底层的颜色。
  HINT_COLORS_PLASMA: 旧版 OPL 等离子背景混合的目标颜色（<OPL> 主题）。
  HINT_COLORS_RESET: 把上面六种颜色恢复为主题自己的颜色。
  HINT_COVERFLOW_COUNT: RIPFLOW 在所选封面两侧各显示多少个封面。
  HINT_COVERFLOW_SCALE: RIPFLOW 中所选封面相对于其他封面的大小。
  HINT_COVERFLOW_ANIM: 在封面流中移动时封面滑动的速度。
  HINT_NARGS_QB: Quick Boot：跳过 Neutrino 自己的启动画面。在这里开启时，每个游戏都会发送；关闭时，RIPPS2 仍会为需要它的 USB、iLink 和网络游戏自动发送。
  HINT_NARGS_DBC: 调试颜色：Neutrino 在每个加载步骤用一种颜色填满屏幕，拍张照片就能看出游戏停在哪里。
  HINT_NARGS_LOGO: 在游戏前显示 PS2 标志（再重启一次 IOP，某些 iLink 驱动器需要）。在这里关闭时，RIPPS2 遵循 游戏启动 > PS2 标志，并且从不为 MMCE 或网络游戏发送。
  HINT_NARGS_CWD: 游戏视为自己目录的文件夹。留空：Neutrino 的默认值。
  HINT_NARGS_CFG: 你自己的 Neutrino 配置文件（-cfg）。留空：Neutrino 自带的。
  HINT_NARGS_ELF: 启动这个 ELF，而不是光盘指定的启动文件。留空：游戏自己的。
  HINT_NARGS_ATA0: Neutrino 挂载为主机内置硬盘的硬盘镜像，用于使用硬盘的游戏（-ata0）。
  HINT_NARGS_ATA0ID: 与该硬盘镜像配套的 ID 文件（-ata0id）。
  HINT_NARGS_ATA1: 第二个硬盘镜像（-ata1）。
  RIPPS2_LAST_USED: 上次使用
  RIPPS2_PAGE_BUTTONS: 翻页按键
  HINT_RIPPS2_PAGE_BUTTONS: 用哪对肩键翻游戏列表的页。L2 / R2：它们翻页，L1 / R1 切换分类。L1 / R1：它们翻页，L2 / R2 切换分类。主题：由主题决定；没有主题时 L2 到开头，R2 到结尾。同时按 L2 + R2 始终选择随机游戏。
  RIPPS2_IGR_MENU: 游戏内菜单
  HINT_RIPPS2_IGR_MENU: 开：L1+L2+R1+R2+SELECT+START 暂停游戏：继续、退出、截图、查看成就或关机。关：组合键像以前一样立即退出游戏。
  RIPPS2_BOOT_LOADER: 引导程序
  HINT_RIPPS2_BOOT_LOADER: 显示每张记忆卡开机时启动的内容，并安装 BIBLE（为 RIPPS2 设置的 PS2BBL）。记忆卡原有的启动文件会保留。
  RIPPS2_MANAGE: 管理
  RIPPS2_ACHIEVEMENTS: 成就
  RIPPS2_NBD_SERVER: NBD 服务器
  HINT_RIPPS2_NBD_SERVER: 通过网络把硬盘共享给电脑。运行期间会一直显示状态画面。
  RIPPS2_START: 启动
  RIPPS2_COVER_ART: 封面
  HINT_RIPPS2_COVER_ART: 为你已启动列表中每个没有封面的 PS2 游戏下载封面，存到该驱动器的 ART 文件夹，来源是 GitHub 上 xlenore 的 ps2-covers。需要网线和互联网。
  RIPPS2_DOWNLOAD: 下载
  RIPPS2_GLYPHS: 方向键图标
  HINT_RIPPS2_GLYPHS: 驱动器和阵列名称旁边的方向键图标。淡入在切换时显示；淡出在打开页面时显示。主题：由主题决定。
  RIPPS2_COLOR_THEME: 配色
  HINT_RIPPS2_COLOR_THEME: 为塔楼、光球、玻璃、CD 播放器和文件浏览器统一一种颜色，作用于全部三个页签。主题：由主题决定（否则为 RIPPS2 蓝）。
  RIPPS2_HINTS: 按键提示
  HINT_RIPPS2_HINTS: 底部的按键提示。“闲置时淡出”会隐藏它们，直到你按下按键。主题：由主题决定。
  RIPPS2_CATEGORY_BAR: 分类/侧边栏
  HINT_RIPPS2_CATEGORY_BAR: 启动光盘、存储和记忆文件：顶部的名称，或侧边栏。闲置时淡出会让名称变淡，或把侧边栏滑开，直到你按下按键；它会立即回来。主题：由主题决定。
  RIPPS2_SOURCE_NAME: 来源名称
  RIPPS2_STATUS: 状态
  RIPPS2_SOURCE: 来源
  HINT_RIPPS2_SOURCE_NAME: 游戏上方的来源名称（全部游戏、硬盘游戏等）。“闲置时淡出”会让它随分类栏一起淡出；“弹出”则像 L3 显示列表名那样，在开机后的第一个列表和每次切换来源时把它大大地显示在页面中央，然后淡出。“弹出和名称”两者都做。主题可以把“弹出”作为它的“显示”。主题：由主题决定。
  RIPPS2_RECENTS: 最近的游戏
  HINT_RIPPS2_RECENTS: 最近的游戏：侧边栏中的一个页面，按新到旧列出你最近启动的游戏：保留多少个，1 到 99（按三角输入数字）。驱动器设为手动的游戏，选中时会启动该驱动器。0 关闭该页面。
  RIPPS2_CATEGORY_ORDER: 分类顺序
  HINT_RIPPS2_CATEGORY_ORDER: 交换启动光盘和记忆文件：记忆文件在前，启动光盘在后，栏中的名称和侧边栏的图标都一样。为 RIPFLOW 设计（界面 > 主题）。主题：由主题决定。
  RIPPS2_MUSIC: 音乐
  HINT_RIPPS2_MUSIC: 播放 RIPPS2 旁边 AUDIO 文件夹以及每个已启动驱动器上 OPL 的 AUDIO 文件夹中的 bgm 文件（无标签的 Ogg 或 16 位 WAV）；名为 Menu 的先播放。主题自带的音乐会取而代之。
  RIPPS2_BIOS_SOUNDS: BIOS 音效
  HINT_RIPPS2_BIOS_SOUNDS: 把这台主机 BIOS 中的菜单音效作为 RIPPS2 的音效写入 AUDIO 文件夹（不到 1 MB）。菜单音乐有单独的提取：BIOS 音乐。
  RIPPS2_RIP: 提取
  RIPPS2_HINTS_GLYPHS: 提示与图标
  HINT_RIPPS2_HINTS_GLYPHS: 按键提示和图标的样式。每一行都从“主题”开始，即主题的选择；你的任何其他选择都优先于所有主题。
  RIPPS2_HINT_LAYOUT: 提示布局
  HINT_RIPPS2_STARSIDE: 星标游戏的星标在列表中的位置。左：每行开头单独一列。右：在标题后面。隐藏（初始值）：没有星标也没有该列，标题完整显示。主题：按主题所写。R3 在任何情况下都会给游戏加星标；在列表上按住 R3 4 秒可隐藏或恢复星标（这也会给光标下的游戏加星标）。
  HINT_RIPPS2_HINT_LAYOUT: 横排：所有提示排成一行。竖列：每行一个提示，在一侧排成列表，从主题放提示的位置开始。
  RIPPS2_HINT_LABELS: 提示文字
  HINT_RIPPS2_HINT_LABELS: “仅图标”只画按键，适合自带文字的图标。“徽章”把每个提示的图标和名称合在一个徽章上。
  RIPPS2_HINT_MENU: 菜单提示（START）
  RIPPS2_HINT_REFRESH: 刷新提示（SELECT）
  RIPPS2_HINT_STAR: 收藏提示（R3）
  RIPPS2_HINT_VIEW: 视图提示（L3）
  HINT_RIPPS2_HINT_SHOW: 显示或隐藏这个提示。它的按键照常有效。
  RIPPS2_GLYPH_SET: 图标套装
  HINT_RIPPS2_GLYPH_SET: 每个页面上的按键图标：主题自带的、RIPPS2 的、标准（深色按键、彩色符号）或白色（纯白）。
  RIPPS2_HINT_ORDER: 提示顺序
  HINT_RIPPS2_HINT_ORDER: 排列提示。“主题”保持主题的顺序；“你的顺序”是这里设置的顺序。
  RIPPS2_HINT_ORDER_FOLLOW: 顺序
  RIPPS2_GRID_LAYOUT: 网格布局
  HINT_RIPPS2_GRID_LAYOUT: 一页网格容纳多少个封面，使用 RIPPS2 的间距。“主题”保持主题自己的。
  RIPPS2_LAUNCH_DISC: 启动时的光盘
  HINT_RIPPS2_LAUNCH_DISC: 游戏启动时光盘会出现。“弹出”落定后淡出；“旋转”越转越快，直到游戏开始；“放大”落定后变大到清晰可读，并一直显示。
  RIPPS2_TRANSITION: 页面过渡
  HINT_RIPPS2_TRANSITION: 切换到其他分类时新页面如何出现：从主题的背景色中浮现，或从闪光中出现。“主题”保持主题的选择。
  RIPPS2_CATEGORY_LAYOUT: 分类布局
  HINT_RIPPS2_CATEGORY_LAYOUT: 三个分类的位置：名称排在顶部，或图标沿侧边栏排列，每个都有一个装着其页面的抽屉（在列表上按左进入），或菜单：没有栏，分类放在 START 菜单中，就像为 OPL 制作的主题。主题使用主题自己的布局。
  RIPPS2_CACHE: 缓存
  HINT_RIPPS2_CACHE: 如何保存每个来源的游戏列表，让它的页面立刻打开：Fast Cache、内置硬盘的列表和自动刷新。
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 每个来源都会保存上次的游戏列表（放在其 CD 和 DVD 文件夹旁的 RIPPS2.LST），并在来源响应的瞬间显示。之后是否重新读取来源由 Trust Cache 决定。关闭：像以前一样，先从来源读取每个列表。
  HINT_RIPPS2_VIGNETTE: 让除所选封面外的每个封面边缘变暗，以突出所选的那个。“弱”是“完全”的一半。
  RIPPS2_GRID_WIDE: 宽屏网格布局
  HINT_RIPPS2_GRID_WIDE: 仅在 16:9 画面（宽屏、720p、1080i）下的网格页面，封面更窄、一行能放更多。“主题”使用主题自己的；“相同”跟随网格布局。
  RIPPS2_BGBLUR: 背景模糊
  HINT_RIPPS2_BGBLUR: 磨砂玻璃对游戏背景图的模糊程度。“主题”使用主题自己的（RIPGRID 和 Adapt 上为“弱”）。
  HINT_RIPPS2_HINT_SLOT: 此位置上的提示。原来在这里的提示会移到所选提示原来的位置。
  PS1_SAVE_GUIDANCE: PS1 存档取决于 Ember 或 POPSTARTER；PS2 的 VMC 设置不适用。
  NEUTRINO_SHOW_ARGS: 显示启动参数
