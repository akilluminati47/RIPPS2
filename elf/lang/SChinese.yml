  CAD_PAIR_UDPFS: 无法连接 Caduceus。请在 PS2-Servers 共享的文件夹中配对 ART/CADUCEUS.KEY，并设置 RA 伴侣 IP。
  RA_WL_NOT_SAVED: 无法保存追踪列表。请确认游戏所在设备或共享可写，然后再检查一次。
  RA_UDPFS_LOAD_FIRST: 请先打开一次 UDPFS 页面以加载其网络模块，然后重试。
  CAD_UDPFS_IMG: Caduceus 浏览器需要 SMB 或 UDPFS“文件”：UDPFS IMG 没有可存放其密钥的共享文件夹。
  XERA_SET_CLOCK: 尚不在你的 RetroAchievements 游戏库中。请在系统设置中设置主机时钟以查看完整列表，或带成就玩一次。
  CFG_TITLES: 在游戏列表中显示 CFG 标题
  HINT_CFG_TITLES: 显示每个游戏 CFG 中的标题而不是文件名，并按它排序。刷新列表时会读取每个 CFG，所以列表加载更慢。仅影响显示。
  AUTO_VMC_INVALID: 这个游戏的 VMC 文件存在，但不是有效的记忆卡，因此既未使用也未替换。游戏将不带 VMC 启动；请在 VMC 菜单中检查它。
  AUTO_VMC_STILL_RUNNING: 这个游戏的 VMC 仍在创建中。请稍后再次启动游戏。
  NEUTRINO_DVR_QUICKBOOT: DVR 启动需要切换到 PSX 模式。请从 Neutrino 的全局参数和游戏参数中去掉 -qb。
  NEUTRINO_DVR_FILE_MISSING: Neutrino 的 DVR 安装不完整。缺少必需文件：
  PARENLOCK_GAME: 家长锁
  PARENLOCK_GAME_HINT: 启动这个游戏时需要家长锁密码。
  PARENLOCK_GAME_NO_PASSWORD: 请设置家长锁密码，否则这个游戏不会被锁定。
  HINT_ENABLE_PCCF: 早期日版 PS2 的 PC CARD CompactFlash。仅限原生 PS2 游戏；CF 需要独占 PC CARD。重启后释放。
  PCCF_GAMES: PC CARD CF 游戏
  PCCF_UNAVAILABLE: CF 不可用：需要带 PC CARD 的早期日版 PS2、兼容的卡，并且没有已启用的 DEV9/硬盘/网络驱动。
  PCCF_UNSUPPORTED_GAME: CF 目前只支持原生 PS2 游戏。CF 上的 VMC、PS1 加载和网络成就不可用。
  HINT_ENABLE_DVR: 实验性的 DESR DVR ISO 发现。需要开启硬盘来源；启动游戏需要外部支持 DVR 的 Neutrino。
  HINT_RIPPS2_IGR_PAGE: 游戏内菜单、RIPSHOT 以及照片如何冲洗。
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: 从游戏内菜单截图，存到供主题使用的 ART 或 MEDIA。
  RIPPS2_DEVELOP_SHOTS: 冲洗照片
  HINT_RIPPS2_DEVELOP_SHOTS: 各游戏胶卷上等待的照片如何变成 PNG。
  RIPPS2_SETTINGS_HOME: 设置保存到
  HINT_RIPPS2_SETTINGS_HOME: RIPPS2 存放设置的位置：记忆卡上它自己的存档、驱动器（内置硬盘、USB、MX4SIO、iLink 或 MMCE）上的 RIPPS2 文件夹，或你输入的文件夹。
  RIPPS2_LAUNCHERS: 启动器
  RIPPS2_LOOK_NOW: 立即查找
  HINT_RIPPS2_LOOK_NOW: RIPPS2 会在已启动的驱动器上查找 POPSTARTER、POPS 文件、Ember、Ember 的 BIOS 和 Neutrino，并记住每一个的位置。每次启动都从那里读取。
  RIPPS2_HIDE_GAME: 隐藏游戏
  RIPPS2_HIDDEN_GAMES: 隐藏的游戏
  HINT_RIPPS2_HIDDEN_GAMES: 用“隐藏游戏”隐藏的游戏，在已启动的驱动器上。可以重新显示其中一个，或删除它。每个驱动器各有自己的列表。
  HINT_RIPPS2_BDM_DEVICES: BDM 读取游戏的驱动器：USB、MX4SIO、PC Card CF、DESR 的 DVR 驱动器和 iLink。内置硬盘跟随硬盘启动方式。
  HINT_RIPPS2_SCREEN: 菜单的画面：视频模式、宽屏、在电视上的位置（H-POS、V-POS）和过扫描。
  HINT_RIPPS2_LAYOUT: 分类所在的位置和页面进入的方式，然后是 RIPFLOW 的封面和 RIPGRID 的网格。
  HINT_RIPPS2_COLORS_TEXT: 文字粗细、配色、颜色渐变和每种颜色。
  HINT_RIPPS2_TEXT_WEIGHT: RIPPS2 自身文字的粗细：设置中的提示、状态和关于。常规与以前相同；粗体在柔和的画面上更易读。主题自己的字体保持主题设定的粗细。
  HINT_RIPPS2_HDD_START: 内置硬盘，APA 或 exFAT：RIPPS2 会读取它是哪一种，并以 HDD游戏 显示一次。自动（装有硬盘时最快）在开机时启动；关闭则不碰它。
  HINT_RIPPS2_THEME_COLOR: 配色本身的颜色。把配色选为自定义，就能像文字颜色一样自己挑选。
  HINT_RIPPS2_SWEEP: 主题缓慢平滑地经过的五种颜色。彩虹、由每种配色做成的渐变，或你自己的。关闭让配色保持不动。
  HINT_RIPPS2_SWEEP_COLORS: 渐变的五种颜色和速度。改动 RIPPS2 的某个渐变，它会以你起的名字作为你自己的保存下来。
  HINT_RIPPS2_SWEEP_NAME: 你的渐变在颜色渐变列表中的名字。
  HINT_RIPPS2_SWEEP_COLOR: 渐变依次经过的五种颜色之一。
  HINT_RIPPS2_SWEEP_SPEED: 每种颜色停留多久后下一种淡入。即使活泼也很平滑：颜色从不闪烁。
  RIPPS2_HIDE_COMPRESS: 隐藏游戏和压缩
  HINT_RIPPS2_SELECT_HOLD: 在游戏列表上按住 SELECT 4.2 秒。列表：在面板中列出主题，选一个。轮换：下一个主题。关：不做任何事（按一下仍会刷新）。
  RIPPS2_RECENT_GAMES: 最近的游戏
  RIPPS2_SET_METADATA_RENAME: 设置元数据（重命名）
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: 手柄优先（实验性）
  HINT_RIPPS2_MMCE_PAD_FIRST: SD2PSX 通过与手柄共用的总线读取，读取期间听不到手柄：加载封面时按键会延迟或丢失。开启：封面分成小块传来，中间读取手柄，稍慢一些。关闭：按记忆卡的最快速度。记忆卡的来源设为自动时，其列表在开机时只加载一次。
  HINT_RIPPS2_TRUST_CACHE: 从缓存显示的列表会保持原样、随时可启动，直到你按 SELECT 或 RIPPS2 自己更改该来源。关闭：缓存显示后在后台重新读取每个来源，在与手柄共用总线的 MMCE 或 MX4SIO 卡上会感到停顿。
  RIPPS2_STATUS_OPEN: 加载和驱动器
  HINT_RIPPS2_STATUS_OPEN: 打开状态：开机从哪里读取设置和游戏列表、哪个位置最快、游戏的 EXIT 去哪里，以及每个驱动器。其中的缓存设置会回到这里。
  RIPPS2_BADGE_SET: 徽章组
  HINT_RIPPS2_BADGE_SET: 游戏信息页上的徽章（分级、人数、ESRB、视频模式、扫描、画面比例）。RIPPS2：自己的一组，所有主题都一样。主题：主题自己的图片，或在主题要求时使用 RIPPS2 的。
  RIPPS2_HINT_FADE: 提示和图标淡入
  HINT_RIPPS2_HINT_FADE: 变化的按键提示或图标会像封面一样在变化时淡入；不变的保持原样，在每个页面和消息中都是如此。关闭：直接出现。主题：由主题决定（除非写有 hints_fade=0，否则开启）。
  RIPPS2_SIDEBAR_STYLE: 侧边栏样式
  HINT_RIPPS2_SIDEBAR_STYLE: 经典（分体）：图标在侧边栏的深色条中，旁边是彩色条带。XL（一体）：一条更宽的条，图标在中间。主题：由主题决定。
  HINT_EXITPATH: 游戏内菜单中 EXIT 的去向。最好留空：EXIT 会进入浏览器，若已安装引导程序（FreeMcBoot、PS2BBL、OSDMenu 或 BIBLE）则由它启动，开启 BOOT LOCK 时会像开机一样回到 RIPPS2；没有引导程序时则是 PS2 浏览器。在此输入的 ELF 只有在重置后能被加载（位于记忆卡或 FAT32 USB 驱动器上）且不是 RIPPS2 本身时才会使用；其他情况都进入浏览器。
  HINT_BDM_START: USB、iLink、MX4SIO 和 exFAT 硬盘。自动在开机时启动它们：对已插入的驱动器最快，其游戏从一开始就在全部游戏中。手动在你打开其页面时启动。
  NEUTRINO_VMC_HDD_UNSUPPORTED: Neutrino 无法使用 APA 硬盘上的 VMC（exFAT、USB 和 MX4SIO 可以）：这个游戏将使用该插槽中的真实记忆卡启动。
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 启动时只读取 RIPPS2 自己的驱动器：RIPPS2.ELF 旁边的设置和音效 (位置由那里的 RIPPS2.FB 说明)，以及每个列表的缓存。其他驱动器会等待：在页面上按 SELECT 会启动其驱动器并载入图片 (开启自动刷新时它们在启动时就会启动)。开启后会把你的音效，以及空间足够时的音乐，复制到 RIPPS2 旁边的 AUDIO。
  RIPPS2_ART_PACK: ART 包
  RIPPS2_ART_PACK_BUILD: 生成或删除
  HINT_RIPPS2_ART_PACK: 把每个已启动驱动器的 ART 文件夹打包成你所选驱动器上的一个 art.tar（最快的驱动器优先推荐）。封面随后从一个文件凭一个索引读取，不再逐个游戏查找，菜单和音乐都保持流畅。ART 文件夹保持原样。
  RIPPS2_LIST_CFG_TEXT: 列表中的标题和描述
  HINT_RIPPS2_LIST_CFG_TEXT: 在游戏列表旁显示游戏 CFG 中的标题和描述。主题:按主题设置(RIPPS2 自带主题不显示)。信息页始终显示。
  RIPPS2_PS1_PREFER: PS1 重复项
  HINT_RIPPS2_PS1_PREFER: 同时有 POPSTARTER VCD 和 Ember 镜像的 PS1 游戏。两者:两行。Ember:只显示 Ember。POPSTARTER:只显示 VCD。除开头的光盘 ID 外标题相同即为同一游戏。
  RIPPS2_MY_PADS: 我的手柄
  HINT_RIPPS2_MY_PADS: RIPPS2 旁边 PADS 文件夹中的 .pad 配置：每个 USB 手柄一个以其 ID 命名的文本文件（2563_0575.pad），每个都经过检查。有配置的手柄可以操作菜单，也能在游戏中使用（开启 Pad Emulator）。
  RIPPS2_PAD_SETUP: 设置 USB 手柄
  HINT_RIPPS2_PAD_SETUP: 插上一个 RIPPS2 不认识的 USB 手柄，按它要求的每个按键，RIPPS2 就会把它的 .pad 写到 PADS。PS2 手柄上的 SELECT 可跳过一个按键。
