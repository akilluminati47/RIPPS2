  HDD_PARTITION_RENAME_UNSUPPORTED: 이 타이틀은 그 자체가 APA 파티션이고, OPL은 파티션 테이블을 편집하지 않습니다. PC에서 이름을 바꾸세요.
  POPS_SETTINGS_UNREADABLE: POPSTARTER의 설정을 읽을 수 없었습니다 -- 메모리 카드가 사용 중이거나 읽을 수 없습니다. 불러오기가 끝나면 다시 시도하세요.
  GLOBAL_PS_EMULATION_SETTINGS: 전역 PS 에뮬레이션 설정
