  IGR_USB_DRIVERS_PROMPT: IGR 경로가 USB에 있지만 %s에 USBD.IRX와 USBHDFSD.IRX가 없습니다. 본체는 게임 내 리셋 뒤에 USB에 접근하려면 이것들이 필요합니다. 없으면 IGR이 PS2 브라우저로 떨어집니다. 지금 RiptOPL의 드라이버를 그곳에 복사할까요? FMCB, OpenTuna 같은 익스플로잇도 이 파일을 불러오며 동작이 달라질 수 있습니다. 기존 파일은 절대 교체하지 않습니다. FAT32 USB만 해당됩니다.
  IGR_USB_DRIVERS_FAILED: USB 드라이버를 %s에 복사할 수 없었습니다 (카드가 가득 찼거나 쓸 수 없음). IGR은 PS2 브라우저로 떨어집니다.
  OFFICIAL_CFG_NOTIFICATION: '%s에서 공식 OPL 설정을 불러왔습니다'
  CFM_VMODE_HOLD_KEEP: 누르고 있으면 유지
  BDM_PS2_FOLDERS_UNREADABLE: '%s의 CD 또는 DVD 폴더를 열 수 없어서(오류 %d) 그 장치에는 PS2 게임이 나열되지 않습니다. 그 페이지에서 SELECT를 눌러 다시 시도하세요.'
  NEUTRINO_BD_NO_DEVICE_NUMBER: Neutrino 파일 시스템이 bd로 설정되어 있지만 이 장치가 장치 번호를 알리지 않아 Neutrino가 가리킬 수 없습니다. 이 게임의 Neutrino 파일 시스템을 Auto나 exfat로 바꾸세요.
  CFM_VMODE_REVERT_IN: '%d초 후 되돌림'
  EMBER_DITHER: Ember 디더링
  HINT_EMBER_DITHER: Ember 디더링(켜기 또는 끄기). 실행하는 장치의 EMBER/settings.txt에 씁니다. 게임별 값이 이것보다 우선합니다.
  EMBER_SHADING: Ember 셰이딩
  HINT_EMBER_SHADING: 'Ember 색 깊이: 15비트 또는 24비트(실험적). 실행하는 장치의 EMBER/settings.txt에 씁니다. 게임별 값이 이것보다 우선합니다.'
  EMBER_CONTROLLER: Ember 컨트롤러
  HINT_EMBER_CONTROLLER: 'Ember 컨트롤러 모드: 자동, 아날로그, D2A. 보통은 게임별로 정하는 것이 가장 좋으며(세모 > Ember 게임 설정) 그쪽이 우선합니다.'
  EMBER_480P_CONFIRM: Ember의 480p는 컴포지트로는 화면이 나오지 않습니다. 480p를 쓸까요?
  EMBER_SHADING_24: 24비트 (실험적)
  EMBER_GAME_SETTINGS: Ember 게임 설정
  HINT_EMBER_GAME_SETTING: 이 게임만. OK를 누르면 실행 전에 EMBER/games/<이름>/settings.txt에 씁니다. 건드리지 않은 기본값은 파일의 기존 값을 유지하고, 값을 기본값으로 되돌리면 그 덮어쓰기를 없앱니다.
  EMBER_TIMING: Ember 타이밍
  HINT_EMBER_TIMING: 'Ember 영상 타이밍: 자동은 디스크 지역을 따르고, NTSC는 60 Hz, PAL은 50 Hz로 고정합니다. 실행하는 장치의 EMBER/settings.txt에 씁니다.'
  EMBER_GLOBAL_WARNING: 이 Ember 설정은 모든 PS1 게임에 적용되며, 일부 게임은 이 설정에서 멈춥니다. 한 게임만 바꾸려면 그 게임에서 세모 > Ember 게임 설정을 쓰세요.
  RIPPS2_RANDOM: 무작위
  RIPPS2_ALL: 전체
  RIPPS2_RANDOM_GAME: 무작위 게임
  HINT_RIPPS2_RANDOM_GAME: L2와 R2를 함께 누르면 무작위 게임으로 이동합니다. 부팅 시에는 각 목록도 무작위 게임에서 열립니다.
  RIPPS2_ALL_GAMES: 모든 게임
  RIPPS2_SET_METADATA: 메타데이터 설정
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 전원을 켤 때 부트 로더를 통해 RIPPS2를 시작합니다. PS2BBL과 FMCB는 바로 시작하고, OSDMenu는 메뉴 맨 위에 둡니다. 게임의 EXIT도 같은 길로 돌아옵니다. 끄면 이전 상태로 되돌립니다. 아직 없나요? 부트 로더에서 BIBLE을 설치하세요.
  HINT_COLORS_TEXT: 게임 목록 글자의 색. 테마는 자체 색을 정하며, 이것은 내장 테마의 색을 바꿉니다.
  HINT_COLORS_SELECTED: 고른 게임과 설정 페이지에서 고른 줄의 색.
  HINT_COLORS_DIALOG: 설정 페이지와 메시지 상자의 색.
  HINT_COLORS_TITLE: 정보 페이지에 나오는 게임 이름의 색.
  HINT_COLORS_BACKGROUND: 아트나 타워를 그리지 않을 때 가장 뒤의 색.
  HINT_COLORS_PLASMA: 옛 OPL 플라스마 배경이 섞여 드는 색 (<OPL> 테마).
  HINT_COLORS_RESET: 위의 여섯 색을 테마 자체의 색으로 되돌립니다.
  HINT_COVERFLOW_COUNT: RIPFLOW가 고른 표지 양쪽에 각각 몇 개의 표지를 보여 줄지.
  HINT_COVERFLOW_SCALE: RIPFLOW가 고른 표지를 다른 표지보다 얼마나 크게 그릴지.
  HINT_COVERFLOW_ANIM: 흐름을 따라 움직일 때 표지가 미끄러지는 속도.
  HINT_NARGS_QB: 'Quick Boot: Neutrino 자체의 시작 화면을 건너뜁니다. 여기서 켜면 모든 게임에 보냅니다. 꺼도 RIPPS2는 필요한 USB, iLink, 네트워크 게임에는 알아서 보냅니다.'
  HINT_NARGS_DBC: '디버그 색: Neutrino가 불러오기 단계마다 화면을 한 색으로 채우므로, 사진을 찍으면 게임이 어디서 멈추는지 알 수 있습니다.'
  HINT_NARGS_LOGO: 게임 전에 PS2 로고를 보여 줍니다 (두 번째 IOP 재부팅으로, 일부 iLink 드라이브에 필요). 여기서 끄면 RIPPS2는 게임 실행 > PS2 로고를 따르며, MMCE나 네트워크 게임에는 보내지 않습니다.
  HINT_NARGS_CWD: 게임이 자기 것으로 여기는 폴더. 비워 두면 Neutrino의 기본값.
  HINT_NARGS_CFG: 내 Neutrino 설정 파일 (-cfg). 비워 두면 Neutrino의 것.
  HINT_NARGS_ELF: 디스크가 지정한 부트 파일 대신 이 ELF를 시작합니다. 비워 두면 게임 자체의 것.
  HINT_NARGS_ATA0: Neutrino가 본체의 내장 HDD로 마운트하는 HDD 이미지. HDD를 쓰는 게임용 (-ata0).
  HINT_NARGS_ATA0ID: 그 HDD 이미지와 짝을 이루는 ID 파일 (-ata0id).
  HINT_NARGS_ATA1: 두 번째 HDD 이미지 (-ata1).
  RIPPS2_LAST_USED: 마지막 사용
  RIPPS2_PAGE_BUTTONS: 페이지 버튼
  HINT_RIPPS2_PAGE_BUTTONS: '어느 숄더 버튼으로 게임 목록의 페이지를 넘길지. L2 / R2: 페이지를 넘기고 L1 / R1로 카테고리를 바꿉니다. L1 / R1: 페이지를 넘기고 L2 / R2로 카테고리를 바꿉니다. 테마: 테마가 정하며, 테마가 없으면 L2는 처음으로, R2는 끝으로 갑니다. L2 + R2를 함께 누르면 항상 무작위 게임을 고릅니다.'
  RIPPS2_IGR_MENU: 게임 내 메뉴
  HINT_RIPPS2_IGR_MENU: '켜기: L1+L2+R1+R2+SELECT+START로 게임을 일시 정지: 계속, 나가기, 스크린샷, 업적 보기 또는 전원 끄기. 끄기: 조합키로 예전처럼 바로 게임을 나갑니다.'
  RIPPS2_BOOT_LOADER: 부트 로더
  HINT_RIPPS2_BOOT_LOADER: 각 메모리 카드가 전원을 켤 때 무엇을 시작하는지 보여 주고, BIBLE(RIPPS2용으로 설정한 PS2BBL)을 설치합니다. 카드의 원래 부트 파일은 보관됩니다.
  RIPPS2_MANAGE: 관리
  RIPPS2_ACHIEVEMENTS: 업적
  RIPPS2_NBD_SERVER: NBD 서버
  HINT_RIPPS2_NBD_SERVER: 네트워크로 하드 드라이브를 PC와 공유합니다. 실행 중에는 상태 화면이 계속 표시됩니다.
  RIPPS2_START: 시작
  RIPPS2_COVER_ART: 표지
  HINT_RIPPS2_COVER_ART: 시작한 목록에서 표지가 없는 모든 PS2 게임의 표지를 GitHub의 xlenore ps2-covers에서 내려받아 그 드라이브의 ART 폴더에 넣습니다. 네트워크 케이블과 인터넷이 필요합니다.
  RIPPS2_DOWNLOAD: 다운로드
  RIPPS2_GLYPHS: 방향 버튼 글리프
  HINT_RIPPS2_GLYPHS: '드라이브와 대형 이름 옆의 방향 버튼 글리프. 페이드 인은 전환할 때, 페이드 아웃은 페이지가 열릴 때 보여 줍니다. 테마: 테마가 정합니다.'
  RIPPS2_COLOR_THEME: 색 테마
  HINT_RIPPS2_COLOR_THEME: '타워, 구슬, 유리, CD 플레이어, 파일 브라우저를 세 탭 모두에서 한 가지 색으로. 테마: 테마가 정합니다 (정하지 않으면 RIPPS2 파랑).'
  RIPPS2_HINTS: 버튼 도움말
  HINT_RIPPS2_HINTS: '아래쪽의 버튼 도움말. 조작이 없을 때 페이드는 버튼을 누를 때까지 숨깁니다. 테마: 테마가 정합니다.'
  RIPPS2_CATEGORY_BAR: 카테고리/사이드바
  HINT_RIPPS2_CATEGORY_BAR: '디스크 실행, 저장소, 메모리 파일: 위에 있는 이름, 또는 사이드바. 조작이 없을 때 페이드는 버튼을 누를 때까지 이름을 흐리게 하거나 사이드바를 밀어 둡니다. 바로 돌아옵니다. 테마: 테마가 정합니다.'
  RIPPS2_SOURCE_NAME: 소스 이름
  RIPPS2_STATUS: 상태
  RIPPS2_SOURCE: 소스
  HINT_RIPPS2_SOURCE_NAME: '게임 위의 소스 이름 (모든 게임, HDD 게임 등). 조작이 없을 때 페이드는 카테고리 막대와 함께 흐려지게 합니다. 팝인은 대신 L3가 목록 이름을 보여 주듯, 부팅 후 첫 목록과 소스가 바뀔 때마다 페이지 가운데에 크게 보여 준 뒤 흐려집니다. 팝인과 이름은 둘 다 합니다. 테마는 팝인을 자신의 표시로 삼을 수 있습니다. 테마: 테마가 정합니다.'
  RIPPS2_RECENTS: 최근 게임
  HINT_RIPPS2_RECENTS: '최근 게임: 최근에 실행한 게임을 새것부터 보여 주는 사이드바 페이지. 몇 개를 남길지, 1~99(세모로 숫자 입력). 드라이브가 수동인 게임은 고르면 그 드라이브를 시작합니다. 0이면 페이지가 꺼집니다.'
  RIPPS2_CATEGORY_ORDER: 카테고리 순서
  HINT_RIPPS2_CATEGORY_ORDER: '디스크 실행과 메모리 파일을 바꿉니다: 메모리 파일이 먼저, 디스크 실행이 마지막. 바의 이름과 사이드바의 아이콘 모두. RIPFLOW용입니다(인터페이스 > 테마). 테마: 테마가 정합니다.'
  RIPPS2_MUSIC: 음악
  HINT_RIPPS2_MUSIC: RIPPS2 옆의 AUDIO 폴더와 시작한 각 드라이브의 OPL AUDIO 폴더에 있는 bgm 파일(태그 없는 Ogg 또는 16비트 WAV)을 재생합니다. Menu라는 이름의 파일이 먼저 재생됩니다. 테마 자체의 음악이 있으면 대신 그것이 재생됩니다.
  RIPPS2_BIOS_SOUNDS: BIOS 사운드
  HINT_RIPPS2_BIOS_SOUNDS: '이 본체 BIOS의 메뉴 사운드를 RIPPS2의 사운드로 AUDIO 폴더에 씁니다 (1 MB 미만). 메뉴 음악은 따로 추출합니다: BIOS 음악.'
  RIPPS2_RIP: 추출
  RIPPS2_HINTS_GLYPHS: 도움말과 글리프
  HINT_RIPPS2_HINTS_GLYPHS: 버튼 도움말과 글리프의 모양. 모든 줄은 테마, 즉 테마가 고른 것으로 시작합니다. 다른 선택은 내 것이며 모든 테마보다 우선합니다.
  RIPPS2_HINT_LAYOUT: 도움말 배치
  HINT_RIPPS2_STARSIDE: '즐겨찾는 게임의 별이 목록에서 놓이는 곳. 왼쪽: 각 줄 앞의 전용 열. 오른쪽: 제목 뒤. 숨김(처음 값): 별도 열도 없이 제목을 끝까지 표시. 테마: 테마대로. R3는 어떤 경우든 게임을 즐겨찾기에 넣습니다. 목록에서 R3를 4초 누르고 있으면 별을 숨기거나 되돌립니다(커서 아래 게임도 즐겨찾기에 들어감).'
  HINT_RIPPS2_HINT_LAYOUT: '가로: 도움말을 한 줄로. 세로: 한 줄에 도움말 하나씩, 테마가 도움말을 두는 곳에서 시작해 옆에 목록으로 나열합니다.'
  RIPPS2_HINT_LABELS: 도움말 라벨
  HINT_RIPPS2_HINT_LABELS: 글리프만은 버튼만 그립니다. 글자가 들어 있는 글리프용입니다. 배지는 각 도움말의 글리프와 이름을 배지 하나로 묶습니다.
  RIPPS2_HINT_MENU: 메뉴 도움말 (START)
  RIPPS2_HINT_REFRESH: 새로 고침 도움말 (SELECT)
  RIPPS2_HINT_STAR: 즐겨찾기 도움말 (R3)
  RIPPS2_HINT_VIEW: 보기 도움말 (L3)
  HINT_RIPPS2_HINT_SHOW: 이 도움말을 보이거나 숨깁니다. 버튼은 어느 쪽이든 작동합니다.
  RIPPS2_GLYPH_SET: 글리프 세트
  HINT_RIPPS2_GLYPH_SET: '모든 페이지의 버튼 글리프: 테마 자체의 것, RIPPS2의 것, 표준(어두운 버튼에 색 있는 기호), 흰색(완전한 흰색).'
  RIPPS2_HINT_ORDER: 도움말 순서
  HINT_RIPPS2_HINT_ORDER: 도움말을 정렬합니다. 테마는 테마의 순서를, 내 순서는 여기서 정한 순서를 씁니다.
  RIPPS2_HINT_ORDER_FOLLOW: 순서
  RIPPS2_GRID_LAYOUT: 그리드 레이아웃
  HINT_RIPPS2_GRID_LAYOUT: 그리드 한 페이지에 들어가는 표지 수를 RIPPS2의 간격으로. 테마는 테마 자체의 것을 씁니다.
  RIPPS2_LAUNCH_DISC: 실행 디스크
  HINT_RIPPS2_LAUNCH_DISC: 게임이 실행될 때 디스크가 나타납니다. 팝인은 자리 잡은 뒤 흐려지고, 회전은 게임이 시작될 때까지 점점 빨리 돕니다. 줌은 자리 잡은 뒤 또렷이 읽히도록 커지고 그대로 남습니다.
  RIPPS2_TRANSITION: 페이지 전환
  HINT_RIPPS2_TRANSITION: '다른 카테고리로 갈 때 새 페이지가 나타나는 방식: 테마의 배경색에서, 또는 플래시에서. 테마는 테마의 선택을 씁니다.'
  RIPPS2_CATEGORY_LAYOUT: 카테고리 배치
  HINT_RIPPS2_CATEGORY_LAYOUT: '세 카테고리의 위치: 이름을 위에 나란히, 또는 사이드바를 따라 아이콘을 세로로 두고 각각 페이지 서랍을 둡니다(목록에서 왼쪽을 누르면 그곳으로). 메뉴: 바 없이, OPL용 테마처럼 카테고리를 START 메뉴에. 테마는 테마 자체의 배치를 씁니다.'
  RIPPS2_CACHE: 캐시
  HINT_RIPPS2_CACHE: '각 소스의 게임 목록을 보관해 페이지가 바로 열리게 하는 방법: Fast Cache, 내장 HDD 목록, 자동 새로고침.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 각 소스는 마지막 게임 목록(CD와 DVD 폴더 옆의 RIPPS2.LST)을 저장하고 소스가 응답하는 순간 보여 줍니다. 그 뒤 소스를 다시 읽을지는 Trust Cache가 정합니다. 끄면 예전처럼 각 목록을 먼저 소스에서 읽습니다.
  HINT_RIPPS2_VIGNETTE: 고른 표지를 뺀 모든 표지의 가장자리를 어둡게 해 고른 표지를 돋보이게 합니다. 약하게는 최대의 절반입니다.
  RIPPS2_GRID_WIDE: 와이드스크린 그리드 레이아웃
  HINT_RIPPS2_GRID_WIDE: 16:9 화면(와이드스크린, 720p, 1080i)에서만 쓰는 그리드 페이지로, 표지가 좁아지고 가로로 더 많이 들어갑니다. 테마는 테마 자체의 것을, 같음은 그리드 레이아웃을 따릅니다.
  RIPPS2_BGBLUR: 배경 흐림
  HINT_RIPPS2_BGBLUR: 반투명 유리가 게임의 배경 아트를 얼마나 흐리게 할지. 테마는 테마 자체의 것을 씁니다 (RIPGRID와 Adapt에서는 약하게).
  HINT_RIPPS2_HINT_SLOT: 이 자리의 도움말. 여기 있던 도움말은 고른 도움말이 있던 자리로 옮겨 갑니다.
  PS1_SAVE_GUIDANCE: PS1 세이브는 Ember나 POPSTARTER에 따라 다릅니다. PS2 VMC 설정은 적용되지 않습니다.
  NEUTRINO_SHOW_ARGS: 실행 인수 표시
  HINT_NEUTRINO_SHOW_ARGS: Neutrino로 실행할 때마다 Neutrino가 받을 모든 인수를 보여 주고 계속할지 묻습니다. 뒤로를 누르면 실행하지 않고 메뉴로 돌아갑니다.
  NEUTRINO_ARGS_CONFIRM: Neutrino가 이 인수로 시작합니다. 실행할까요?
  HINT_NARGS_EXTRA: 그 밖의 Neutrino 플래그를 공백으로 구분해 적으며, 위의 모든 것 다음에 보냅니다. RIPPS2는 항상 게임의 드라이브와 ISO에 -bsd와 -dvd, VMC에 -mc0과 -mc1, 영상 모드에 -gsm, 그리고 게임 자체의 호환 모드를 붙입니다. 위에 전용 줄이 있는 플래그(-logo 등)는 저장할 때 그 줄로 옮겨지며, 보내는 것은 그대로입니다.
  HINT_RIPPS2_THEME: 모든 페이지의 모양. 게임 목록에서 SELECT를 4.2초 누르고 있으면 다음 테마로 바뀝니다. SELECT를 짧게 누르면 여전히 목록을 새로 고칩니다.
  GAME_TYPE_LABELS: '[PS1]/[PS2] 라벨 표시'
  NEUTRINO_CHEATS_WRITE_FAILED: 치트 목록을 Neutrino 폴더에 저장할 수 없어서 Neutrino가 쓸 수 없습니다. 치트 없이 실행할까요?
  AUTO_CREATE_VMC: 처음 실행할 때 VMC 만들기
  HINT_AUTO_CREATE_VMC: 슬롯 1에 VMC 없이 PS2 게임을 실행하면 게임의 장치에 8 MB 카드를 만들고, VMC 화면이 제안하는 이름(그 게임의 모든 디스크가 함께 씀)을 붙여 지정합니다. Neutrino에서는 APA HDD 불가(exFAT HDD는 가능).
  AUTO_VMC_CREATING: 이 게임의 VMC를 만드는 중...
  AUTO_VMC_FAILED: 이 게임의 VMC를 만들 수 없었습니다. 게임은 VMC 없이 시작합니다.
  RIPPS2_BIOS_MUSIC: BIOS 음악
  HINT_RIPPS2_BIOS_MUSIC: 이 본체의 메뉴 음악(브라우저의 배경 음악, WAV로 약 15 MB)을 고른 AUDIO 폴더(RIPPS2 옆, 또는 시작한 드라이브의 OPL 폴더)에 씁니다. 메모리 카드에는 너무 큽니다. 크기를 먼저 보여 줍니다.
  SAVE_ICONS: 3D 세이브 아이콘
  HINT_SAVE_ICONS: 테마에 자리가 있으면 고른 게임의 세이브 아이콘을 회전시켜 보여 줍니다. 먼저 게임 자체의 VMC를, 다음에 메모리 카드를 읽습니다.
  NETBOOT_RESTART_NOW: 네트워크 프로토콜은 재시작 후에 바뀝니다. 지금 설정을 저장하고 OPL을 재시작할까요?
  HINT_NET_PROTOCOL: 'RiptOPL이 쓰는 네트워크 서비스: SMB 공유, UDPFS, UDPBD, HTTP. 이미 실행 중인 것에서 바꾸려면 재시작해야 합니다.'
  HINT_UDPFS_ACCESS: UDPFS 전용. 파일은 서버의 게임 폴더에서 낱개 ISO를 읽고, IMG는 디스크 이미지를 드라이브로 읽습니다. SMB와 HTTP는 항상 파일, UDPBD는 항상 IMG를 씁니다.
  HINT_SMB_VERSION: PC 공유와 통신할 SMB 버전.
  HINT_NET_ADVANCED: 이더넷 연결 모드와 SMB 포트를 편집할 수 있게 합니다.
  HINT_ETH_LINK_MODE: 네트워크 연결 속도와 이중 모드를 고정합니다. 연결이 계속 끊기는 게 아니라면 자동으로 두세요.
  HINT_IP_ADDR_TYPE: 고정은 아래 주소를 쓰고, DHCP는 공유기에 묻습니다. UDPFS와 UDPBD는 항상 고정을 씁니다.
  HINT_PS2_IP: PS2 자체의 IP 주소. PC와 같은 범위에서 다른 기기가 쓰지 않는 주소를 고르세요.
  HINT_NETMASK: 서브넷 마스크, 보통 255.255.255.0.
  HINT_GATEWAY: 공유기의 주소, 보통 앞의 세 숫자가 같고 .1로 끝납니다.
  HINT_DNS: DNS 서버 주소. 보통 게이트웨이와 같습니다.
  HINT_SMB_ADDR_TYPE: PC에 IP 주소로 연결할지, NetBIOS(컴퓨터) 이름으로 연결할지.
  HINT_SMB_ADDRESS: '게임을 공유하는 PC: 그 IP 주소, 또는 주소 유형이 NetBIOS일 때는 컴퓨터 이름.'
  HINT_SMB_PORT: 'SMB 포트. PC와 같아야 합니다: PS2 Servers는 1111, Windows와 Samba 공유는 445를 씁니다.'
  HINT_SMB_USER: SMB 사용자 이름. 대부분의 공유는 guest로 됩니다.
  HINT_HTTP_SERVER: HTTP 게임 서버의 IP 주소.
  HINT_HTTP_PORT: HTTP 게임 서버가 듣는 포트.
  HINT_HTTP_BASE: HTTP 서버에서 games.csv가 있는 폴더. /는 서버의 루트입니다.
  HINT_HTTP_TEST: 위의 값으로 HTTP 서버를 시험하고 결과를 알려 줍니다.
  HINT_RA_TELEMETRY: RetroAchievements의 주 스위치. 끄면 네트워크 스택이나 스냅샷 없이 게임을 실행해 일반 빌드와 같습니다.
  HINT_RA_BADGES: 목록에서 업적이 있는 게임을 표시합니다. 텔레메트리가 꺼져 있는 동안에는 어둡게 남습니다.
  HINT_POPS_NET_BUTTON: SMB로 PS1 게임을 할 때 필요한 POPSTARTER 자체의 네트워크 파일(IPCONFIG.DAT, SMBCONFIG.DAT)을 편집합니다.
  HINT_POPS_IP_TYPE: 'PS1 게임을 SMB로 실행하는 동안 PS2가 주소를 얻는 방법: 고정 또는 DHCP.'
  HINT_POPS_IP: PS1 게임을 SMB로 실행하는 동안의 PS2 IP 주소.
  HINT_POPS_SMB_IP: PS1 게임을 공유하는 PC의 IP 주소.
  HINT_POPS_SMB_SHARE: 그 PC에서 POPS 폴더가 있는 공유 이름.
  HINT_LASTPLAYED: 지난번에 실행한 게임에서 시작합니다.
  HINT_LANGUAGE: 메뉴 언어. lang_*.lng 파일을 LNG 폴더에 넣으면 더 추가할 수 있습니다.
  HINT_GSM_DEFAULTS_BUTTON: 자체 GSM 설정이 없는 한 모든 게임에 적용되는 영상 모드 수정.
  HINT_DEFDEVICE: 부팅할 때 RiptOPL이 여는 페이지.
  HINT_MMCE_MODE: 'SD2PSX나 MemCard PRO2의 게임. 자동은 부팅 때 시작합니다: 꽂힌 카드에 가장 빠르며, 그 게임이 처음부터 모든 게임에 있습니다. 수동은 페이지를 열 때 시작하고, 끄기는 숨깁니다.'
  HINT_MMCE_SETTINGS_BUTTON: MMCE의 슬롯, IGR bootcard, GameID, 타이밍 옵션.
  HINT_ENABLE_USB: USB 저장 장치 드라이버를 불러옵니다.
  HINT_ENABLE_MX4SIO: MX4SIO SD 카드 어댑터 드라이버를 불러옵니다.
  HINT_ENABLE_ILINK: iLink(FireWire) 저장 장치 드라이버를 불러옵니다.
  HINT_NETSTART: '네트워크를 시작합니다: 자동은 부팅할 때, 수동은 그 페이지를 열 때. 끄기는 네트워크 어댑터를 건드리지 않습니다.'
  HINT_APPMODE: 앱 페이지. 자동은 부팅할 때, 수동은 열 때 시작하고, 끄기는 숨깁니다.
  HINT_FAVMODE: 즐겨찾기 게임 페이지. 자동은 부팅할 때, 수동은 열 때 시작하고, 끄기는 숨깁니다.
  HINT_BDMA_BUTTON: USB, MX4SIO, MMCE, HDD, iLink의 PS1 게임에 POPSTARTER가 쓰는 exFAT 드라이버.
  HINT_VCD_LIST_BUTTON: 'PS1 게임을 나열하는 방식: 게임 ID 숨기기, 디스크 1만 표시, HDD PP 파티션 표시.'
  HINT_MMCE_SLOT: MMCE 장치가 꽂힌 메모리 카드 슬롯. 자동으로 찾습니다.
  HINT_MMCE_GAMEID: 어떤 게임이 시작되는지 MMCE 장치에 알려, 그 게임의 메모리 카드로 바꿀 수 있게 합니다.
  HINT_MMCE_COMM_BUTTON: MMCE 연결의 타이밍 옵션. 게임이 멈추거나 느리게 불러올 때만 바꾸세요.
  HINT_MMCE_PATH_BUTTON: MMCE 카드에서 게임 폴더가 있는 곳.
  HINT_MMCE_PREFIX: MMCE 카드에서 CD, DVD 및 다른 OPL 폴더가 있는 하위 폴더. 비워 두면 카드의 루트를 씁니다.
  HINT_GAME_TYPE_LABELS: 각 게임 이름 앞에 [PS1] 또는 [PS2]를 붙입니다. 표시만 바뀝니다.
  HINT_MENU_VMODE: 메뉴의 영상 출력. 게임은 대신 GSM을 씁니다. 새 모드를 유지하려면 확인을 누르고 있으세요.
  HINT_THEME: 메뉴의 모양. 테마는 각 장치의 THM 폴더에서 읽습니다.
  HINT_COVERFLOW_BUTTON: Coverflow 테마의 표지 수, 크기, 애니메이션, 어둡게 하기.
  HINT_ARTWORK_BUTTON: '불러올 아트: 표지, 디스크 아트, 배경, 세이브 아이콘.'
  HINT_COLORS_BUTTON: 글자, 강조, 대화 상자, 배경의 색.
  HINT_NOTIFICATIONS: 설정, 테마, 언어 파일을 불러올 때 나오는 짧은 알림.
  HINT_AUTOSORT: 게임 목록을 가나다/A~Z 순으로 정렬합니다. 끄면 찾은 순서를 유지합니다.
  HINT_AUTOREFRESH: 직접 새로 고치지 않아도 새로 연결한 장치의 게임을 추가합니다.
  HINT_COVERART: ART 폴더에서 표지를 불러옵니다.
  HINT_DISCART: 디스크 아트(<ID>_ICO)를 보여 줍니다. 끄면 디스크는 숨기고 표지와 배경은 남깁니다.
  HINT_BGART: 테마가 배경을 쓸 때 게임의 배경(<ID>_BG)을 보여 줍니다.
  HINT_ART_TAR: ART/art.tar에 묶인 아트도 읽습니다.
  HINT_ART_DELAY: 커서가 게임에 머문 뒤 아트를 불러오기까지의 시간. 길수록 빠르게 스크롤할 때 아트를 건너뜁니다.
  HINT_TXTCOLOR: 일반 메뉴 글자의 색.
  HINT_SELCOLOR: 강조된 항목의 색.
  HINT_UICOLOR: 대화 상자의 배경 색조.
  HINT_TITLECOLOR: 목록의 게임 제목 색.
  HINT_BGCOLOR: 메뉴 배경색.
  HINT_PLASCOLOR: 움직이는 배경에 섞는 색.
  HINT_RESETCOLOR: 테마의 색이 아닌 RiptOPL의 내장 색으로 되돌립니다.
  HINT_WIDESCREEN: 16:9 TV에 맞게 메뉴를 그립니다.
  HINT_XOFF: 화면에서 메뉴를 왼쪽이나 오른쪽으로 옮깁니다. 비디오 모드마다 따로 저장됩니다.
  HINT_YOFF: 화면에서 메뉴를 위나 아래로 옮깁니다. 비디오 모드마다 따로 저장됩니다.
  HINT_MENU_OVERSCAN: TV가 가장자리를 자르면 메뉴를 안쪽으로 줄입니다. 비디오 모드마다 따로 저장됩니다.
  HINT_APPLYGAMEID: 게임이 시작될 때 바코드를 보여 주어 Pixel FX, RetroGEM, PS2Digital 기기가 프로필을 바꾸게 합니다.
  HINT_NEUTRINO_DEFAULTS_BUTTON: 모든 게임에 쓰는 Neutrino의 경로, 영상 모드, 인수.
  HINT_OSD_DEFAULTS_BUTTON: 게임에 넘기는 본체 언어, 화면 크기, 영상 모드.
  HINT_ENWRITEOP: 게임 이름 바꾸기와 삭제, VMC 만들기를 허용합니다. HDD 파티션 테이블은 절대 건드리지 않습니다.
  HINT_DEBUG: '개발자 도구: 게임이 부팅하는 동안 색 화면을 보여 주고, 메뉴에 아트 불러오기 카운터를 표시합니다.'
  HINT_BDMPREFIX: USB, MX4SIO, iLink, exFAT 드라이브에서 게임 폴더가 있는 하위 폴더. 비워 두면 드라이브의 루트를 씁니다.
  HINT_ETHPREFIX: SMB 공유에서 게임 폴더가 있는 하위 폴더. 비워 두면 공유의 루트를 씁니다.
  HINT_HDDGAMELISTCACHE: APA HDD 게임 목록을 기억해 이후 검색을 빠르게 합니다.
  HINT_BDMCACHE: 게임 중 USB 및 다른 BDM 드라이브의 미리 읽기 캐시. 클수록 스트리밍이 부드러워질 수 있지만 메모리를 더 씁니다.
  HINT_HDDCACHE: 게임 중 내장 HDD의 미리 읽기 캐시.
  HINT_SMBCACHE: 게임 중 SMB의 미리 읽기 캐시.
  HINT_CORE_LOADER: 둘 다 지원할 때 이 게임에 쓸 코어. UDPFS/UDPBD는 Neutrino 전용, SMB/HTTP는 <OPL> 전용입니다. 기본값은 게임 실행 설정을 따릅니다.
  HINT_DMA_MODE: 이 게임의 내장 HDD 전송 모드. 게임이 끊기거나 멈추면 낮추세요.
  HINT_DNAS_GAMEID: DNAS 온라인 게임의 디스크 ID. 디스크에서 불러오기는 원본 디스크에서 읽습니다.
  HINT_LOAD_FROM_DISC: 드라이브에 있는 원본 디스크에서 DNAS ID를 읽습니다.
  HINT_ALTSTARTUP: SYSTEM.CNF가 지정한 것 대신 디스크 이미지에서 이 ELF를 부팅합니다.
  HINT_VMC_DEFINE: 이 슬롯의 가상 메모리 카드를 고르거나, 만들거나, 크기를 바꿉니다.
  HINT_VMC_ACTION: 공용 사용은 이 슬롯에 공유 카드를 주고, 초기화는 선택을 지웁니다.
  HINT_VMC_NAME: VMC 폴더에 두는 카드 파일의 이름.
