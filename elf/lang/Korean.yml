  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL은 RIPPS2를 지금 위치에서 시작할 수 없습니다(닿는 곳은 메모리 카드, USB 드라이브, MX4SIO). 그리고 RIPPS2는 자신을 복사하지 않습니다. RIPPS2.ELF를 메모리 카드나 USB 드라이브에 넣고 거기서 시작하거나, MMCE와 HDD를 읽는 PS2BBL Extended를 쓰세요.
  RESTORE SLOT %d'S OLD BOOT LOADER: 슬롯 %d의 예전 부트 로더로 되돌리기
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: 슬롯 %d의 메모리 카드에 BIBLE을 설정했습니다(mc%d:/%s/%s). BOOT LOCK 켜짐: 전원을 켜면 바로 %s에서 RIPPS2를 시작합니다.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: BIBLE 설정 중
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: BIBLE 설정 중
  
    RIPPS2는 %s에서 실행 중인데, PS2BBL은 그곳을 읽지 못합니다(메모리 카드, USB, MX4SIO만 읽음). 그리고 RIPPS2는 자신을 복사하지 않습니다. 이 카드의 PS2BBL Extended 설정(%s)은 읽을 수 있습니다: START로 BOOT LOCK을 켜면 전원을 켤 때 %s에서 RIPPS2를 시작합니다. 카드의 다른 것은 바뀌지 않습니다.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: BIBLE 설정 중
  
    RIPPS2는 %s에서 실행 중인데, PS2BBL은 그곳을 읽지 못합니다: 프로그램은 메모리 카드, USB 드라이브, MX4SIO에서만 시작하며, RIPPS2는 자신을 복사하지 않습니다. RIPPS2.ELF를 그중 하나(메모리 카드의 APPS 폴더 또는 USB 드라이브)에 넣고 거기서 시작한 다음 BIBLE을 다시 설정하세요.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: BIBLE 설정 중
  
    슬롯 %d의 메모리 카드: BIBLE(mc%d:/%s)을 옆으로 옮기고, 그것이 대신했던 것(mc%d:/%s)을 제자리로 돌립니다. 아무것도 지우지 않습니다. PS2BBL 설정은 그대로입니다(잠금은 BOOT LOCK으로 끌 수 있습니다).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: BIBLE 설정 중(PS2BBL을 메모리 카드에 묶는 중)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: BIBLE 설정 중(이전 것을 되돌리는 중)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: BIBLE 설정 중(I/O 프로세서를 다시 시작하는 중)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: BIBLE 설정 중(메모리 카드에 쓰는 중)'
  SET UP BIBLE: BIBLE 설정
  ? 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: Setting up BIBLE. PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?'
  : '슬롯 1: %s
  
    슬롯 2: %s
  
    %s
  
    RIPPS2: BIBLE 설정 중. El Isra의 PS2BBL을 RIPPS2가 표준 8 MB PS2 메모리 카드나 내장 HDD에 설정합니다: 전원을 켜고 0 ms 만에 시작(PS2BBL Extended는 0 불가), 먼저 RIPPS2를 지금 있는 곳에서(복사하지 않음). 전원을 켤 때 버튼을 누르고 있으면 브라우저(TRIANGLE), 디스크(START), 이전 것(CIRCLE)으로도 갈 수 있습니다. 설정할까요, 고칠까요, 아니면 대신했던 것을 되돌릴까요?'
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: 슬롯 %d의 메모리 카드 여유 공간은 %d KB이고, BIBLE에는 %d KB가 필요합니다. 공간을 확보한 뒤 다시 시도하세요.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : 슬롯 %d의 메모리 카드가 PS2BBL을 거부해서 RIPPS2가 카드를 원래대로 두었습니다. 여유 공간을 확인하고 다시 시도하세요. (카드의 응답은 RIPPS2 옆의 DIAG.TXT에 있습니다.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : 슬롯 %d의 메모리 카드가 BIBLE을 옮기지 못해서 아무것도 바뀌지 않았습니다. (카드의 응답은 RIPPS2 옆의 DIAG.TXT에 있습니다.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): 슬롯 %d의 메모리 카드가 %s을(를) 되돌려 받지 못해서 BIBLE이 남아 있습니다. (카드의 응답은 RIPPS2 옆의 DIAG.TXT에 있습니다.)
  MUSIC: 음악
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s에 %s이(가) 없습니다. RIPPOPS가 %s에서 Sony의 PS1 에뮬레이터를 찾았습니다: START를 누르면 %s을(를) 여기로 복사하고 게임을 시작합니다.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2에서 %s이(가) 보이지 않습니다(%s%s). POPSTARTER에는 POPS_IOX.PAK과 POPS.PAK, 또는 POPS_IOX.PAK과 POPS.ELF와 IOPRP252.IMG가 필요합니다: 여러분 콘솔의 Sony PS1 에뮬레이터입니다. RIPPS2가 찾지 않는 곳에서 찾을 수도 있습니다(게임이 시작된다면 찾은 것입니다). START로 실행하며, 이 드라이브는 다시 묻지 않습니다.'
  ' (The configs found were set: %s.)': ' (찾은 설정을 변경했습니다: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' 그 설정을 자체 설정 도구로 한 번 저장한 다음 BOOT LOCK을 다시 켜세요.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s은(는) 지금 있는 곳(%s)에서 RIPPS2를 시작할 수 없으며, RIPPS2는 자신을 복사하지 않습니다. RIPPS2.ELF를 메모리 카드나 USB 드라이브에 두고 거기서 시작하세요.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK이 부트 로더의 설정을 쓰지 못했습니다. 메모리 카드나 드라이브가 쓰기 보호되어 있지 않은지 확인한 뒤 다시 시도하세요.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK이 바꿀 부트 로더 설정을 찾지 못했습니다.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK이 꺼져 있습니다. 부트 로더는 이전에 시작하던 것(%s)을 시작합니다.
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK이 켜져 있습니다. 이제 %s은(는) 전원을 켤 때 RIPPS2를 시작하며 (%s), IGR 경로가 비어 있으면 게임의 EXIT도 같은 길로 돌아옵니다. 다른 것으로 가려면 본체가 시작될 때 그 버튼 중 하나를 누르고 있으세요.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : BOOT LOCK이 RIPPS2를 OSDMenu 메뉴의 맨 위에 두었습니다 (%s). OSDMenu는 스스로 아무것도 시작하지 않으니 거기서 RIPPS2를 고르세요. 게임의 EXIT는 그 메뉴로 돌아옵니다. RIPPS2를 바로 시작하는 본체가 되려면 BIBLE이 PS2BBL을 메모리 카드에 넣습니다(부트 로더).
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK은 메모리 카드의 부트 로더(PS2BBL, FMCB 또는 OSDMenu)를 통해 작동하는데, 여기에는 하나도 없습니다.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: 슬롯 %d의 메모리 카드는 전원을 켤 때 %s을(를) 시작하는데, BOOT LOCK이 바꿀 그 설정을 찾지 못했습니다(%s을(를) 찾습니다).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 슬롯 %d의 메모리 카드는 전원을 켤 때 %s을(를) 시작하는데, BOOT LOCK은 이를 설정할 수 없습니다. BOOT LOCK은 PS2BBL, FMCB, OSDMenu를 통해 작동합니다.
  A boot loader with RIPPS2's lock is on this console.: 이 본체에는 RIPPS2 잠금이 있는 부트 로더가 있습니다.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': '게임의 EXIT: 브라우저, 그다음 부트 로더 (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': '사용 중: %s, 이미지 %d개, %d MB'
  'Measuring how fast each drive reads its art: %s': '각 드라이브가 이미지를 읽는 속도를 재는 중: %s'
  'None: each picture is read from its own ART folder.': '없음: 각 이미지는 자기 ART 폴더에서 읽습니다.'
  REMOVE the pack in %s (the ART folders stay as they are): '%s의 팩 삭제 (ART 폴더는 그대로 남습니다)'
  Remove the ART Pack in %s? The ART folders stay as they are.: '%s의 ART 팩을 삭제할까요? ART 폴더는 그대로 남습니다.'
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: 멈췄습니다. 만들다 만 팩은 삭제되었고, 이미지는 전처럼 ART 폴더에서 읽습니다.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'ART 팩을 %s에 쓸 수 없었습니다(그 드라이브에 공간이 있나요?). 그 밖에는 바뀐 것이 없습니다: 이미지는 전처럼 ART 폴더에서 읽습니다.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: '%s의 ART 팩을 삭제했습니다. 이미지는 다시 ART 폴더에서 읽습니다.'
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : 시작된 드라이브에 이미지가 있는 ART 폴더가 없습니다. 이미지가 있는 드라이브를 시작한 뒤(해당 페이지에서 SELECT) 다시 오세요.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '이미지 %d개(ART 폴더 %d개에서)가 하나의 파일 %s에 들어갑니다. ART 폴더는 그대로 남습니다: 팩은 사본입니다. Memory Files로 art.tar를 다른 드라이브의 ART 폴더에 복사할 수도 있지만, 평소 탐색하는 드라이브에서 만드는 것이 가장 빠르므로 가장 빠른 드라이브가 맨 위에 있습니다. 지금 만들까요?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'ART 팩이 완성되었습니다: 이미지 %d개, %d MB, %s (%d초). 이제부터 이미지는 팩에서 읽으며, 팩이 만들어진 대상인 게임 %d개는 ART 폴더에 이미지를 하나씩 묻지 않습니다. RIPPS2가 받아 오거나 찍은 이미지는 바로 나타나고, PC에서 복사해 넣은 이미지는 팩을 다시 만들면 나타납니다.'
  '%s free': '%s 여유'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: 읽기 %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: 읽기 %s/s, 가장 빠름, %s'
  ART PACK: ART 팩
  About %d min: 약 %d분
  'Looking at the ART folders: %d pictures, %s': 'ART 폴더를 살펴보는 중: 이미지 %d개, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : '시작된 드라이브에 ART 팩을 둘 공간이 없습니다: 약 %s이(가) 필요합니다. 평소 탐색하는 드라이브의 공간을 비운 뒤 다시 시도하세요.'
  PACKING THE ART: 이미지를 모으는 중
  PICTURE %d OF %d: 이미지 %d / %d
  'Pictures: %d (%s). ART folders: %d.': '이미지: %d개 (%s). ART 폴더: %d개.'
  Stop? The unfinished pack is removed; the ART folders stay as they are.: 멈출까요? 만들다 만 팩은 삭제되고, ART 폴더는 그대로 남습니다.
  'The ART folders stay as they are: the pack is a copy.': 'ART 폴더는 그대로 남습니다: 팩은 사본입니다.'
  Under a minute: 1분 이내
  free space unknown: 여유 공간 알 수 없음
  'A game''s EXIT: the browser, or your boot loader when one is installed': '게임의 EXIT: 브라우저, 또는 설치되어 있으면 부트 로더'
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): 'Ogg Vorbis: Xiph.Org (BSD), minimp3: lieff (CC0)'
  RIPFLOW's type, and every message and notification: RIPFLOW의 서체, 그리고 모든 메시지와 알림
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Discord에서 테스트하고 GitHub에 이슈를 올려 주는 모두에게 감사합니다:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'IGR Path %s 은(는) 쓰이지 않습니다: 게임 후에는 메모리 카드나 USB의 파일만 불러올 수 있고, RIPPS2 자신은 절대 아닙니다'
  an issue is the best way to get RIPPS2 updated.: 이슈가 RIPPS2를 업데이트하는 가장 좋은 방법입니다.
  your Ogg and MP3 music, as RIPPS2 plays it: RIPPS2가 재생하는 그대로의 Ogg와 MP3 음악
  Pop In and Name: 팝인과 이름
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s은(는) 기둥보다 늦게 시작되어 부팅 소리가 늦게 납니다. START는 boot.adp(%d KB)를 메모리 카드의 RIPPS2 옆에 복사합니다(여유 %d KB). 그러면 기둥이 솟을 때 소리가 납니다.'
  The boot sound could not be copied to %s. It still plays from %s.: 부팅 소리를 %s에 복사하지 못했습니다. 계속 %s에서 재생됩니다.
  Zoom: 줌
  '%s could not be deleted; it stays as it was.': '%s을(를) 삭제하지 못했습니다. 그대로 남습니다.'
  '%s could not be read as a .tar archive. Nothing was changed.': '%s을(를) .tar 아카이브로 읽지 못했습니다. 아무것도 바뀌지 않았습니다.'
  '%s is deleted. %s is kept.': '%s을(를) 삭제했습니다. %s은(는) 남깁니다.'
  Art loads from it from now on.: 이제부터 이미지를 여기에서 불러옵니다.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : '합쳐 넣은 .tar를 삭제할까요?
  
    삭제: %s
  
    남김: %s (대상, 이제 두 파일의 모든 이미지가 들어 있음)'
  Into %s (%s): 대상 %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : '남기고 업데이트: %s (%d개 이미지)
  
    합쳐 넣음: %s (%d개 이미지)
  
    둘 다에 있는 이미지: %d. 합쳐 넣는 쪽이 우선합니다. 남기는 .tar는 새 파일로 다시 쓰고 완성된 뒤에만 바꾸므로, 중지하거나 드라이브가 가득 차도 그대로 남습니다. 지금 합칠까요?'
  MERGE .TAR: .TAR 합치기
  MERGE a .tar into the pack in %s: '%s의 팩에 .tar 합치기'
  MERGING THE ART: 이미지를 합치는 중
  Merge in %s (%s): 합쳐 넣기 %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: 새 팩을 다른 .tar에 합칠까요? 다음에 남기고 업데이트할 .tar를 고릅니다. 새 팩의 이미지가 그곳에 들어갑니다.
  'Merged: %s now holds %d pictures (%d MB), %d s.': '합쳤습니다: %s에 이제 %d개 이미지 (%d MB), %d초.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': '들어가는 이미지: %d (%s). 둘 다에 같은 이름: %d (합쳐 넣는 쪽이 우선).'
  'Reading the archives: %s': '아카이브를 읽는 중: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: 중지할까요? 남기는 .tar는 그대로이고, 끝나지 않은 복사본은 지웁니다.
  Stopped. %s is as it was; the unfinished copy was removed.: 중지했습니다. %s은(는) 그대로입니다. 끝나지 않은 복사본은 지웠습니다.
  The kept .tar is only replaced once the merged copy is whole.: 남기는 .tar는 합친 복사본이 완성된 뒤에만 바뀝니다.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: 합친 파일을 %s의 드라이브에 쓰지 못했습니다 (공간이 있나요?). 그대로이며 다른 것은 바뀌지 않았습니다.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
