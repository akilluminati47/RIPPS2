  ', the sounds': ', 사운드'
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot가 켜져 있습니다. RIPPS2는 자신의 드라이브(%s)에서 시작합니다: 설정%s 및 모든 목록은 캐시에서 읽습니다. 다른 드라이브는 해당 페이지에서 SELECT를 누르거나 그 게임을 실행하면 시작됩니다.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot가 켜져 있습니다. 사운드는 %d KB이고 RIPPS2가 실행 중인 메모리 카드의 여유 공간은 %d KB라서, 사운드는 %s에 그대로 둡니다.
  ' (%d KB free)': ' (여유 %d KB)'
  ' (%u MB free)': ' (여유 %u MB)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'RIPPS2 옆: %sAUDIO%s, 시작할 때 가장 먼저 읽음'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- 콘솔이 PS2BBL을 이 카드에 묶고 %s/%s(으)로 기록합니다.
  
    - 그 설정 mc%d:/SYS-CONF/PS2BBL.INI는 RIPPS2를 지금 있는 곳(%s)에서 기다림 없이 시작합니다(0 ms, PS2BBL Extended에서는 불가). BOOT LOCK 켜짐. RIPPS2 자체는 복사하지 않습니다.
  
    이를 위해 I/O 프로세서가 다시 시작되고 끝날 때까지 모든 드라이브 읽기가 멈춥니다. 음악과 드라이브는 그 뒤에 돌아옵니다. 완료라고 나올 때까지 카드를 꽂고 콘솔을 켜 두세요.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'SD2PSX 또는 MMCE 카드는 쓰기가 거부된 뒤 스스로를 보호할 수 있습니다: 지금 메모리 카드나 MMCE 드라이브가 보이지 않으면 콘솔을 껐다 켜세요.'
  BOOT LOCK ON: BOOT LOCK 켜짐
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': '완료: 슬롯 %d의 메모리 카드는 BIBLE 전에 시작하던 것을 시작합니다. BIBLE은 mc%d:/%s에 남겨 둡니다.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
    '
  : '표준 8 MB PS2 메모리 카드(MagicGate 카드, 또는 SD2PSX나 MMCE의 BOOT 카드)용입니다: 슬롯 %d의 카드. 전원을 켜면 PS2BBL은 슬롯 2의 설정을 슬롯 1보다 먼저 읽습니다.
  
    '
