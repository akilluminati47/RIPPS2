  'This disc is not compatible: it is a region %d DVD, and this console plays another region''s DVDs. Start it anyway?': '이 디스크는 호환되지 않습니다: 지역 %d DVD인데, 이 본체는 다른 지역의 DVD를 재생합니다. 그래도 시작할까요?'
  ? 'This disc is not compatible: it reads as DVD video but has no DVD video on it (no VIDEO_TS), so a DVD player cannot play it.'
  : '이 디스크는 호환되지 않습니다: DVD 비디오로 읽히지만 DVD 비디오가 들어 있지 않아(VIDEO_TS 없음) DVD 플레이어로 재생할 수 없습니다.'
  This is an ESR-patched PS2 game. Put ESR (esr*.elf) in APPS, BOOT or ESR on a memory card or USB drive to start it.: ESR 패치가 적용된 PS2 게임입니다. 시작하려면 메모리 카드나 USB 드라이브의 APPS, BOOT 또는 ESR에 ESR(esr*.elf)을 넣으세요.
