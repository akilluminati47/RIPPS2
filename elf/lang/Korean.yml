# RIPPS2 in Korean. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Korean
strings:
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "이 게임은 Neutrino로 시작하는데, RIPPS2가 찾지 못했습니다. 설정의 경로, 게임의 드라이브, 메모리 카드, 시작된 드라이브 어디에도 없습니다. rickgaiser의 Neutrino(github.com/rickgaiser/neutrino)를 게임의 드라이브나 메모리 카드의 neutrino 폴더에 넣거나, 게임 실행 > Neutrino에서 그 위치를 지정하세요."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Neutrino의 위치, 비디오 모드, Neutrino로 실행할 때마다 받는 인수. Neutrino는 github.com/rickgaiser/neutrino 에서 받아 드라이브나 메모리 카드의 neutrino 폴더에 넣으세요."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "이 Neutrino는 1.3보다 오래되어 APA HDD에서 게임을 시작할 수 없습니다. 게임 실행 > Neutrino를 Neutrino 1.3 이상으로 지정하세요."
  "with rickgaiser's Neutrino as its second game core,": "rickgaiser의 Neutrino를 두 번째 게임 코어로 쓰고,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "두 번째 게임 코어, 사용자의 드라이브나 메모리 카드에서 사용 (AFL-3.0)"
