  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: 컨트롤러 우선 (실험적)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX는 컨트롤러와 함께 쓰는 버스로 읽으며, 읽는 동안에는 컨트롤러가 들리지 않습니다: 커버를 불러오는 동안 입력이 늦거나 빠집니다. 켜기: 커버를 작게 나눠 받고 사이사이 컨트롤러를 읽습니다(조금 느림). 끄기: 카드가 낼 수 있는 최고 속도. 카드의 소스가 자동이면 목록은 부팅 때 한 번만 불러옵니다.'
  HINT_RIPPS2_TRUST_CACHE: '캐시에서 보여 준 목록은 SELECT를 누르거나 RIPPS2가 직접 그 소스를 바꿀 때까지 그대로, 바로 실행할 수 있게 남습니다. 끄기: 캐시를 보여 준 뒤 각 소스를 백그라운드에서 다시 읽으며, 컨트롤러와 버스를 함께 쓰는 MMCE나 MX4SIO 카드에서는 멈춤이 느껴집니다.'
  RIPPS2_STATUS_OPEN: 불러오기와 드라이브
  HINT_RIPPS2_STATUS_OPEN: '상태를 엽니다: 부팅이 설정과 게임 목록을 어디서 읽는지, 어디가 가장 빠른지, 게임의 EXIT가 어디로 가는지, 그리고 모든 드라이브. 거기의 캐시 설정에서 여기로 돌아옵니다.'
  RIPPS2_BADGE_SET: 배지 세트
  HINT_RIPPS2_BADGE_SET: '게임 정보 페이지의 배지(등급, 인원, ESRB, 비디오 모드, 스캔, 화면비). RIPPS2: 자체 세트로, 모든 테마에서 같음. 테마: 테마 자체의 그림, 테마가 원하면 RIPPS2의 것.'
  RIPPS2_HINT_FADE: 힌트와 아이콘 페이드
  HINT_RIPPS2_HINT_FADE: '바뀌는 버튼 힌트나 아이콘은 커버처럼 바뀌는 순간 페이드인합니다. 그대로인 것은 건드리지 않습니다(모든 페이지와 메시지에서). 끄기: 그냥 나타납니다. 테마: 테마가 정합니다(hints_fade=0이 없으면 켜짐).'
  RIPPS2_SIDEBAR_STYLE: 사이드바 스타일
  HINT_RIPPS2_SIDEBAR_STYLE: '클래식 (분리형): 사이드바의 어두운 띠에 아이콘, 옆에 색 띠. XL (일체형): 더 넓은 띠 하나, 가운데에 아이콘. 테마: 테마가 정합니다.'
  HINT_EXITPATH: '게임 내 메뉴의 EXIT가 가는 곳. 비워 두는 것이 가장 좋습니다: EXIT는 브라우저로 가며, 부트 로더(FreeMcBoot, PS2BBL, OSDMenu 또는 BIBLE)가 설치되어 있으면 그것이 시작되고, BOOT LOCK이 켜져 있으면 전원을 켤 때처럼 다시 RIPPS2로 돌아옵니다. 없으면 PS2 브라우저입니다. 여기에 입력한 ELF는 리셋 후 불러올 수 있고(메모리 카드나 FAT32 USB 드라이브) RIPPS2 자신이 아닐 때만 쓰입니다. 그 밖에는 브라우저로 갑니다.'
  HINT_BDM_START: 'USB, iLink, MX4SIO, exFAT HDD. 자동은 부팅 때 시작합니다: 꽂아 둔 드라이브에 가장 빠르며, 그 게임이 처음부터 모든 게임에 있습니다. 수동은 페이지를 열 때 시작합니다.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino는 APA HDD의 VMC를 쓸 수 없습니다(exFAT, USB, MX4SIO는 가능): 이 게임은 그 슬롯의 실제 카드로 시작합니다.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: '시작할 때 RIPPS2 자신의 드라이브만 읽습니다: RIPPS2.ELF 옆의 설정과 사운드(위치는 그곳의 RIPPS2.FB가 알려 줌), 그리고 모든 목록은 캐시에서. 다른 드라이브는 기다립니다: 페이지에서 SELECT를 누르면 그 드라이브가 시작되고 이미지를 불러옵니다(자동 새로 고침을 켜면 시작할 때 함께 시작). 켜면 사운드와, 공간이 있으면 음악을 RIPPS2 옆 AUDIO로 복사합니다.'
  RIPPS2_ART_PACK: ART 팩
  RIPPS2_ART_PACK_BUILD: 만들기 또는 삭제
  HINT_RIPPS2_ART_PACK: 시작된 모든 드라이브의 ART 폴더를 고른 드라이브의 art.tar 하나로 묶습니다(가장 빠른 드라이브를 먼저 제안). 커버는 하나의 파일에서 하나의 색인으로 읽히고 게임마다 찾는 일이 없어서 메뉴와 음악이 매끄럽습니다. ART 폴더는 그대로 남습니다.
  RIPPS2_LIST_CFG_TEXT: 목록의 제목과 설명
  HINT_RIPPS2_LIST_CFG_TEXT: '게임 목록 옆에 게임 CFG의 제목과 설명을 표시합니다. 테마: 테마 설정대로(RIPPS2 테마는 숨김). 정보 페이지에는 항상 표시됩니다.'
  RIPPS2_PS1_PREFER: PS1 중복
  HINT_RIPPS2_PS1_PREFER: 'POPSTARTER VCD와 Ember 이미지가 모두 있는 PS1 게임. 둘 다: 두 줄. Ember: Ember만. POPSTARTER: VCD만. 앞의 디스크 ID를 빼고 제목이 같으면 같은 게임입니다.'
  RIPPS2_MY_PADS: 내 패드
  HINT_RIPPS2_MY_PADS: 'RIPPS2 옆 PADS 폴더의 .pad 프로필: USB 패드마다 ID로 이름 붙은 텍스트 파일 하나(2563_0575.pad), 모두 검사됨. 프로필이 있는 패드는 메뉴를 조작하고 게임에서도 쓰입니다(Pad Emulator 켬).'
  RIPPS2_PAD_SETUP: USB 패드 설정
  HINT_RIPPS2_PAD_SETUP: RIPPS2가 모르는 USB 패드를 연결하고 요청하는 버튼을 하나씩 누르면 RIPPS2가 그 .pad를 PADS에 씁니다. PS2 패드의 SELECT는 버튼을 건너뜁니다.
