  '%s could not be made. Is the drive write-protected?': '%s을(를) 만들 수 없었습니다. 드라이브가 쓰기 금지되어 있나요?'
  '%u.%u MB': '%u.%u MB'
  RIP: 추출
  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2가 자신의 폴더 위치를 알 수 없어서 사운드를 둘 곳이 없습니다.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2는 이 본체의 메뉴 음악(브라우저의 배경 음악, %d:%02d)을 BIOS 자체의 음표로 연주해 %s 크기의 WAV로 %s에 씁니다. 메모리 카드에는 들어가지 않습니다. 이미 있는 %s은(는) 교체됩니다. 1~2분 걸립니다.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2는 이 본체의 BIOS에서 사운드를 읽어 자신의 사운드로 %s에 씁니다: 커서, 확인, 취소, 페이지, 카테고리, 메시지, 디스크, 오류, 저장, 드라이브, 무작위, 그리고 BIOS 자체의 음표로 연주한 부팅 음악과 게임 실행 음악입니다. 이미 있는 같은 이름의 파일은 교체됩니다.'
  Reading this console's menu music: 이 본체의 메뉴 음악을 읽는 중
  'Ripping this console''s menu music: %d%%': '이 본체의 메뉴 음악을 추출하는 중: %d%%'
  Ripping this console's sounds: 이 본체의 사운드를 추출하는 중
  'Ripping this console''s sounds: %s': '이 본체의 사운드를 추출하는 중: %s'
  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: 메뉴 음악(%s)은 %s에 %s(으)로 있습니다. 오디오 설정 > 음악에 Menu로 표시되며, 다른 곡을 고르지 않았을 때 재생됩니다.
  The menu music could not be written to %s (%s). Is the drive full?: 메뉴 음악을 %s에 쓸 수 없었습니다 (%s). 드라이브가 가득 찼나요?
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : 메뉴 음악은 %s 크기의 WAV라서 메모리 카드에는 들어가지 않습니다. 여기서 RIPPS2는 메모리 카드에서 실행 중이고 OPL 폴더가 있는 드라이브도 시작되지 않았습니다. 저장소에서 하나를 시작한 뒤 그곳으로 음악을 추출하세요.
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: 이 BIOS의 메뉴 음악은 RIPPS2가 아는 것이 아닙니다. 아무것도 쓰지 않았습니다.
  This BIOS's sound bank is not the one RIPPS2 knows. Nothing was written.: 이 BIOS의 사운드 뱅크는 RIPPS2가 아는 것이 아닙니다. 아무것도 쓰지 않았습니다.
  ? This console's BIOS has no SNDIMAGE. Consoles from SCPH-30000 on carry one; the first models keep their sounds another way, which RIPPS2 does not read yet.
  : 이 본체의 BIOS에는 SNDIMAGE가 없습니다. SCPH-30000 이후 본체에는 있지만, 초기 모델은 다른 방식으로 사운드를 보관하며 RIPPS2는 아직 이를 읽지 못합니다.
  ' (hold CIRCLE at power on to start it)': ' (시작하려면 전원을 켤 때 동그라미를 누르고 있기)'
  ' (then ': ' (그다음 '
  ' A SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it was removed.': ' 빌드 68이 그것을 읽지 않는 로더용으로 쓴 SYS-CONF/PS2BBL.INI를 삭제했습니다.'
  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' 여기 있는 메모리 카드에 자체 PS2BBL/CONFIG.INI가 있어서, PS2BBL은 HDD의 것보다 먼저 그것을 읽습니다. 전원을 켤 때 그 카드를 빼거나, 그 카드에서 RIPPS2를 시작해 다시 설치하세요.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' 전원을 켤 때 세모를 누르고 있으면 브라우저, START는 디스크.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' 세모를 누르고 있으면 브라우저, START는 디스크. 설정: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2는 메모리 카드에 BIBLE(RIPPS2를 시작하도록 설정된 PS2BBL)을 설치할 수 있습니다. 지금 그 카드에서 시작되는 것은 백업 폴더에 보관됩니다. BIBLE을 설치할까요?'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' HDD의 원래 부트 프로그램은 보관되어 있습니다 (관리 > 복원).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' 본체가 전원을 켤 때 HDD를 시작하는 설정을 받지 않았습니다. HDD 유틸리티로 설정하거나 다시 설치하세요.'
  ' What was there before is kept in mc%d:/%s%s.': ' 원래 있던 것은 mc%d:/%s%s에 보관되어 있습니다.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' 내 PS2BBL 설정(%s)은 그대로 두고 그 안에서 BOOT LOCK을 켰습니다. 버튼은 설정한 그대로입니다.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' 내 PS2BBL 설정은 그대로 두고 그 안에서 BOOT LOCK을 켰습니다.'
  ? '(Removed a SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it.)

    '
  : '(빌드 68이 그것을 읽지 않는 로더용으로 쓴 SYS-CONF/PS2BBL.INI를 삭제했습니다.)

    '
  ', for another console model': ', 다른 본체 모델용'
  ', starts at power on': ', 전원을 켤 때 시작'
  ', then ': ', 그다음 '
  ? '- %s (%s) moves to a backup folder first, whole.

    '
  : '- %s(%s)을(를) 먼저 통째로 백업 폴더로 옮김.

    '
  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE이 RIPPS2를 HDD의 %s 파티션에 복사할 수 없었습니다. 남은 공간을 확인하세요. 다른 것은 바꾸지 않았습니다.
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE이 HDD 부트 프로그램의 사본을 보관할 수 없어서 바꾸기 전에 멈췄습니다. RIPPS2는 HDD에 복사되었고, 다른 것은 바꾸지 않았습니다.
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE이 설정(%s)을 쓸 수 없었습니다. 부트 프로그램은 바꾸지 않았습니다.
  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE이 HDD의 부트 프로그램을 쓸 수 없었습니다 (%d단계). %s
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'BIBLE이 내장 HDD에 설치되었고 BOOT LOCK이 켜져 있습니다: 전원을 켜면 본체가 곧바로 %s%s%s%s에서 RIPPS2를 시작합니다. 설정: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE은 메모리 카드 %d에 있지만 설정(%s)을 쓸 수 없어서 브라우저를 시작합니다. 공간을 비운 뒤 관리를 다시 실행해 마무리하세요.
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE이 시작하기 전에 메모리가 부족해졌습니다. 아무것도 바꾸지 않았습니다.
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE의 메모리가 부족해졌습니다. 메모리 카드에서는 아무것도 바꾸지 않았습니다.
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: RIPPS2를 %s에 복사하는 중 (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: HDD의 부트 프로그램을 보관하는 중'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: HDD의 부트 프로그램을 되돌리는 중'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: PS2BBL을 HDD 부트 영역에 쓰는 중'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : '내장 HDD에 BIBLE 설치

    - RIPPS2를 %s에 복사.

    - 지금 __mbr에 있는 HDD 부트 프로그램을 읽어 %s/RIPPS2에 보관 (복원으로 되돌릴 수 있음).

    - 그 자리에 PS2BBL의 HDD 빌드를 쓰고, 본체가 전원을 켤 때 그것을 시작하도록 설정.

    - 그 설정(%s)이 먼저 %s%s%s에서 RIPPS2를 시작하며 BOOT LOCK은 켜짐.

    HDD로 부팅하는 본체(네트워크 어댑터가 있는 구형 PS2)가 필요합니다. 완료라고 표시될 때까지 켜 두세요.'
  INTERNAL HDD  (its boot area): 내장 HDD  (부트 영역)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'HDD의 원래 부트 프로그램 되돌리기

    BIBLE이 보관한 것(HDD의 RIPPS2/MBR-BACKUP.KELF)을 BIBLE 대신 __mbr로 되돌립니다. RIPPS2와 PS2BBL 설정은 그대로 남습니다.'
  RESTORE: 복원
  RESTORE THE HDD'S OLD BOOT PROGRAM: HDD의 원래 부트 프로그램 복원
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2가 ROM에서 이 본체의 지역을 알 수 없어서 어떤 시스템 업데이트 폴더를 읽는지 모릅니다. BIBLE을 설치하지 않았습니다.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2가 HDD의 __sysconf 또는 __common 파티션을 열 수 없어서(오류 %d) BIBLE이 그곳에 RIPPS2와 설정을 둘 수 없습니다. 아무것도 바꾸지 않았습니다.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2가 보관된 부트 프로그램을 읽을 수 없었습니다. 아무것도 바꾸지 않았습니다.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2가 부트 프로그램을 되돌려 쓸 수 없었습니다. 다시 시도하세요. 보관된 사본은 그대로입니다.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': RIPPS2가 드라이브를 읽느라 바빠서 I/O 프로세서를 재시작할 수 없었습니다. 아무것도 바꾸지 않았습니다. 잠시 후 다시 시도하세요.
  Reading the memory cards: 메모리 카드를 읽는 중
  The HDD partition BIBLE uses went away. Nothing was changed.: BIBLE이 쓰는 HDD 파티션이 사라졌습니다. 아무것도 바꾸지 않았습니다.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: HDD의 원래 부트 프로그램이 돌아왔습니다. BIBLE은 더 이상 HDD에서 시작하지 않습니다.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : 본체가 BIBLE을 메모리 카드 %d에 연결하지 않았습니다 (MagicGate 단계 실패). 카드에서는 아무것도 바꾸지 않았습니다. 정품이 아니거나 MagicGate와 호환되지 않는 카드에는 시스템 업데이트를 넣을 수 없습니다.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 원래 있던 것은 HDD의 RIPPS2/MBR-BACKUP.KELF에 보관되어 있습니다. 부트 로더 > 관리 > 복원으로 되돌릴 수 있습니다.
  The security module would not start on this console. Nothing on the memory card was changed.: 이 본체에서 보안 모듈이 시작되지 않았습니다. 메모리 카드에서는 아무것도 바꾸지 않았습니다.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 두 슬롯 모두에 포맷된 PS2 메모리 카드가 없고 내장 HDD도 없습니다. BIBLE은 메모리 카드나 HDD에 놓입니다. 카드를 넣은 뒤 다시 시도하세요.
  There is no kept boot program on this HDD. Nothing was changed.: 이 HDD에는 보관된 부트 프로그램이 없습니다. 아무것도 바꾸지 않았습니다.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : 이 HDD에는 __sysconf 파티션이 없어서 BIBLE의 설정은 메모리 카드에 있어야 하는데(PS2BBL은 카드의 것을 먼저 읽음), 두 슬롯 모두에 카드가 없습니다. 하나를 넣은 뒤 다시 시도하세요.
