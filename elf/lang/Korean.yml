  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "쓰기 작업이 꺼져 있어 RIPPS2가 게임 정보를 저장하거나 이름을 바꿀 수 없습니다. 켤까요?"
  "BIBLE is built on El Isra's PS2BBL, its card and HDD builds signed for RIPPS2 (GPL-3)": "BIBLE은 El Isra의 PS2BBL을 바탕으로 만들어졌으며, 카드용과 HDD용은 RIPPS2용으로 서명되었습니다 (GPL-3)"
