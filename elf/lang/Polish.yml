  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' Karta pamięci ma tu własny PS2BBL/CONFIG.INI, który PS2BBL czyta przed tym z HDD: wyjmij tę kartę przy włączaniu albo uruchom RIPPS2 z tej karty i zainstaluj ponownie.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' Przytrzymaj TRÓJKĄT przy włączaniu, aby otworzyć przeglądarkę, START dla płyty.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' Przytrzymaj TRÓJKĄT dla przeglądarki, START dla płyty. Konfiguracja: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 może zainstalować na karcie pamięci BIBLE, czyli PS2BBL ustawiony tak, by uruchamiał RIPPS2; to, co teraz startuje z tej karty, trafi do folderu kopii zapasowej. Zainstalować BIBLE?'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' Stary program rozruchowy HDD został zachowany (ZARZĄDZAJ > PRZYWRÓĆ).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' Konsola nie przyjęła ustawienia, które uruchamia jej HDD przy włączaniu: ustaw je narzędziem HDD albo zainstaluj ponownie.'
  ' What was there before is kept in mc%d:/%s%s.': ' To, co było tam wcześniej, jest zachowane w mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' Twoja własna konfiguracja PS2BBL została zachowana (%s), a BOOT LOCK w niej ustawiony: jej przyciski są takie, jak je ustawiłeś.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' Twoja własna konfiguracja PS2BBL została zachowana, a BOOT LOCK w niej ustawiony.'
