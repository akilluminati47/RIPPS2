  There is no kept boot program on this HDD. Nothing was changed.: Na tym HDD nie ma zachowanego programu rozruchowego. Nic nie zmieniono.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Ten HDD nie ma partycji __sysconf, więc konfiguracja BIBLE musi trafić na kartę pamięci (PS2BBL czyta najpierw tę z karty), a w żadnym gnieździe nie ma karty. Włóż jedną i spróbuj ponownie.
