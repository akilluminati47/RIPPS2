  CAD_UNKNOWN_GAME: Tej gry nie ma w katalogu Caduceus. Odśwież katalog na PC.
  CAD_CONNECTION_ERROR: Nie można odpytać Caduceus. Sprawdź połączenie, a potem naciśnij Select, aby spróbować ponownie.
