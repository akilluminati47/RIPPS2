  This MMCE card cannot rename a file, which compression needs for its last step. Update its sd2psXtd firmware to 1.4.0 or newer (sd2psxtd.github.io/download), then try again. Nothing was changed.: Ta karta MMCE nie potrafi zmienić nazwy pliku, czego kompresja potrzebuje w ostatnim kroku. Zaktualizuj jej firmware sd2psXtd do 1.4.0 lub nowszego (sd2psxtd.github.io/download) i spróbuj ponownie. Nic nie zostało zmienione.
  BIOS Sounds > Rip plays them as the SPU2 does; no BIOS ships: Dźwięki BIOS > Zgraj odtwarza je tak jak SPU2; żaden BIOS nie jest dołączony
