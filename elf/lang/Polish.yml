  PS1_RA_REMOVE_PREVIOUS: Nie można usunąć poprzedniego modułu osiągnięć PS1
  PS1_RA_PREPARE_FAILED: Nie można przygotować osiągnięć PS1. Zachowaj lub przenieś POPS/MODULE_9.IRX i sprawdź prawo zapisu na urządzeniu.
  PS1_RA_CLEAN_DELETE: 'Nieużywany moduł RA RiptOPL: POPS/MODULE_9.IRX. Usunąć dla czystego uruchomienia?'
  PS1_RA_CLEAN_FAILED: Nie można usunąć nieużywanego modułu RA.
  PS1_RA_CLEAN_CONTINUE: Kontynuować mimo to? Pozostały moduł RA może uruchomić nieaktualną telemetrię. Nie anuluje uruchomienie.
  FAV_REMOVED: Usunięto z Ulubionych gier
  FAV_REMOVE_FAILED: Nie udało się usunąć z Ulubionych gier
  POPS_UDPFS_SETTINGS: Ustawienia sieci POPS UDPFS
  POPS_UDPFS_DISCOVERY: Zapisuje do każdego folderu POPS na USB. Serwer 0.0.0.0 używa wykrywania.
  POPS_UDPFS_NOT_READY: POPS UDPFS potrzebuje pasujących, poprawnych IPCONFIG.DAT i UDPFSCONFIG.DAT w każdym folderze POPS na USB. Skonfiguruj je w Ustawieniach sieci POPS.
  HINT_POPS_UDPFS_IP: Statyczny IP PS2 używany przez sterownik POPS UDPFS po resecie IOP.
  POPS_UDPFS_ALL_USB_FOLDERS: Wszystkie foldery POPS na USB
  POPS_UDPFS_INVALID_SUFFIX: ' (nieprawidłowe)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (niekompletne)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS potrzebuje pary sterowników .udpfs zainstalowanej na karcie pamięci. Wgraj ją ręcznie albo włącz BDMA Zastosuj przy uruchomieniu.
  VMC_REPLACE_REQUIRES_DELETE: Zmiana rozmiaru VMC wymazałaby zapisane gry. Zrób kopię istniejącego VMC i użyj Usuń przed utworzeniem nowego rozmiaru.
  VMC_CREATE_FAILED: Nie udało się utworzyć VMC. Sprawdź urządzenie, połączenie i prawo zapisu. Istniejące zapisy nie zostały zastąpione.
  RA_EXPERIMENTAL_CARDS: Eksperymentalne karty Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Eksperymentalne karty osiągnięć w grach PS2. Mogą migać lub zawieszać gry. Tylko Caduceus; Wył. używa złotego pulsu. Działa od następnego uruchomienia gry.
  RA_NEUTRINO_UNTRACKED: Neutrino RA jest niedostępne dla tego uruchomienia. Sprawdź środowisko RA, IP pomocnika i zapisaną listę śledzenia. Uruchamianie bez osiągnięć.
  UDPFS_IP_CONFLICT: Inne urządzenie w twojej sieci używa adresu IP tej PS2, więc odpowiedzi serwera UDPFS trafiają do niego. Ustaw inny IP PS2 w Ustawieniach sieci.
  XERA_ACHIEVEMENTS: Biblioteka RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Przeglądaj tę grę przez bibliotekę RetroAchievements w menu głównym.
  XERA_OPEN_NETWORK: Nie można połączyć się z xeRAbora. Włącz OPEN TO THE NETWORK w jego ustawieniach, sprawdź IP pomocnika RA i zaporę PC.
  XERA_UNKNOWN_GAME: xeRAbora nie zna tego obrazu. Najpierw uruchom sprawdzanie obsługi gry RA.
  XERA_NOT_PLAYED: Jeszcze nie ma w twojej bibliotece RetroAchievements. Zagraj raz z osiągnięciami, a potem naciśnij Select.
  XERA_CONNECTION_ERROR: Nie można odczytać listy z xeRAbora. Naciśnij Select, aby spróbować ponownie.
  CAD_PAIR_UDPFS: Nie można połączyć się z Caduceus. Sparuj ART/CADUCEUS.KEY w folderze udostępnianym przez PS2-Servers i ustaw IP pomocnika RA.
  RA_WL_NOT_SAVED: Nie udało się zapisać listy śledzenia. Upewnij się, że urządzenie lub udział gry jest zapisywalny, a potem sprawdź ponownie.
  RA_UDPFS_LOAD_FIRST: Otwórz raz stronę UDPFS, aby wczytał się jej moduł sieciowy, a potem spróbuj ponownie.
  CAD_UDPFS_IMG: 'Przeglądarka Caduceus potrzebuje SMB lub UDPFS Pliki: UDPFS IMG nie ma udostępnionego folderu na jej klucz.'
  XERA_SET_CLOCK: Jeszcze nie ma w twojej bibliotece RetroAchievements. Ustaw zegar konsoli w ustawieniach systemu, aby zobaczyć pełną listę, albo zagraj raz z osiągnięciami.
  CFG_TITLES: Pokaż tytuły CFG na listach gier
  HINT_CFG_TITLES: Pokazuje Tytuł z CFG każdej gry zamiast nazwy pliku i sortuje według niego. Czyta każdy CFG przy odświeżaniu listy, więc listy wczytują się wolniej. Tylko wyświetlanie.
  AUTO_VMC_INVALID: Plik VMC tej gry istnieje, ale nie jest prawidłową kartą pamięci, więc nie został użyty ani zastąpiony. Gra uruchomi się bez niego; sprawdź go w menu VMC.
  AUTO_VMC_STILL_RUNNING: VMC tej gry wciąż jest tworzony. Uruchom grę ponownie za chwilę.
  NEUTRINO_DVR_QUICKBOOT: Uruchomienie DVR wymaga przejścia w tryb PSX. Usuń -qb z globalnych i przypisanych do gry argumentów Neutrino.
  NEUTRINO_DVR_FILE_MISSING: 'Instalacja Neutrino dla DVR jest niekompletna. Brak wymaganego pliku:'
  PARENLOCK_GAME: Blokada rodzicielska
  PARENLOCK_GAME_HINT: Wymagaj hasła blokady rodzicielskiej, aby uruchomić tę grę.
  PARENLOCK_GAME_NO_PASSWORD: Ustaw hasło blokady rodzicielskiej, inaczej ta gra nie będzie zablokowana.
  HINT_ENABLE_PCCF: CompactFlash w PC CARD wczesnych japońskich PS2. Tylko natywne gry PS2; CF potrzebuje wyłącznego dostępu do PC CARD. Uruchom ponownie, aby go zwolnić.
  PCCF_GAMES: Gry PC CARD CF
  PCCF_UNAVAILABLE: 'CF niedostępne: wymaga wczesnej japońskiej PS2 z PC CARD, zgodnej karty i braku aktywnego sterownika DEV9/HDD/sieci.'
  PCCF_UNSUPPORTED_GAME: CF obecnie obsługuje tylko natywne gry PS2. VMC na CF, wczytywanie PS1 i osiągnięcia sieciowe są niedostępne.
  HINT_ENABLE_DVR: Eksperymentalne wykrywanie ISO DESR DVR. Wymaga włączonego źródła HDD; uruchamianie gier wymaga zewnętrznego Neutrino z obsługą DVR.
  HINT_RIPPS2_IGR_PAGE: Menu w grze, RIPSHOT i sposób wywoływania zdjęć.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Zrzuty ekranu z menu w grze, do ART dla twoich motywów lub do MEDIA.
  RIPPS2_DEVELOP_SHOTS: Wywoływanie zdjęć
  HINT_RIPPS2_DEVELOP_SHOTS: Jak zdjęcia czekające na rolce każdej gry stają się plikami PNG.
  RIPPS2_SETTINGS_HOME: Zapisuj ustawienia na
  HINT_RIPPS2_SETTINGS_HOME: 'Gdzie RIPPS2 trzyma ustawienia: we własnym zapisie na karcie pamięci, w folderze RIPPS2 na dysku (wewnętrznym HDD, USB, MX4SIO, iLink lub MMCE) lub w folderze, który wpiszesz.'
  RIPPS2_LAUNCHERS: Programy startowe
  RIPPS2_LOOK_NOW: Szukaj teraz
  HINT_RIPPS2_LOOK_NOW: RIPPS2 szuka na uruchomionych dyskach POPSTARTER, plików POPS, Embera, BIOS-u Embera i Neutrino, i zapamiętuje, gdzie jest każdy z nich. Każde uruchomienie odczytuje je stamtąd.
  RIPPS2_HIDE_GAME: Ukryj grę
  RIPPS2_HIDDEN_GAMES: Ukryte gry
  HINT_RIPPS2_HIDDEN_GAMES: Gry ukryte opcją Ukryj grę, na uruchomionych dyskach. Pokaż którąś znowu albo ją usuń. Każdy dysk ma własną listę.
  HINT_RIPPS2_BDM_DEVICES: 'Napędy, z których BDM czyta gry: USB, MX4SIO, PC Card CF, napęd DVR w DESR i iLink. Wewnętrzny HDD podąża za trybem startu HDD.'
  HINT_RIPPS2_SCREEN: 'Obraz menu: tryb wideo, panorama, jego położenie na telewizorze (H-POS, V-POS) i overscan.'
  HINT_RIPPS2_LAYOUT: Gdzie są kategorie i jak wchodzi strona, potem okładki RIPFLOW i siatka RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Grubość tekstu, motyw kolorów, przejście kolorów i każdy kolor.
  HINT_RIPPS2_TEXT_WEIGHT: 'Jak gruby jest własny tekst RIPPS2: podpowiedzi w ustawieniach, STAN i O programie. Normalny jest taki jak dawniej; Pogrubiony czyta się lepiej na miękkim obrazie. Własne czcionki motywu zachowują grubości, które motyw im nadaje.'
  HINT_RIPPS2_HDD_START: 'Wewnętrzny dysk HDD, APA lub exFAT: RIPPS2 czyta go, jakikolwiek jest, i pokazuje raz, jako Gry HDD. Automatyczny (najszybciej z włożonym dyskiem) uruchamia go przy starcie; Wyłącz zostawia go w spokoju.'
  HINT_RIPPS2_THEME_COLOR: Własny kolor motywu. Wybierz Własny jako motyw kolorów, aby wybrać go samemu, jak kolory tekstu.
  HINT_RIPPS2_SWEEP: Pięć kolorów, przez które motyw przechodzi powoli i płynnie. Tęcza, przejście z każdego motywu kolorów lub twoje własne. Wyłączone trzyma motyw w miejscu.
  HINT_RIPPS2_SWEEP_COLORS: Pięć kolorów przejścia i jego szybkość. Zmień jedno z RIPPS2, a zostanie zapisane jako twoje, pod nadaną nazwą.
  HINT_RIPPS2_SWEEP_NAME: Jak twoje przejście nazywa się na liście Przejście kolorów.
  HINT_RIPPS2_SWEEP_COLOR: Jeden z pięciu kolorów, przez które kolejno przechodzi przejście.
  HINT_RIPPS2_SWEEP_SPEED: 'Jak długo trwa każdy kolor, zanim wejdzie następny. Nawet Żywo pozostaje płynne: kolory nigdy nie migają.'
  RIPPS2_HIDE_COMPRESS: Ukryj grę i kompresja
  HINT_RIPPS2_SELECT_HOLD: 'SELECT przytrzymany 4.2 s na liście gier. Lista: motywy w panelu, wybierz jeden. Po kolei: następny motyw. Wył.: nic (naciśnięcie nadal odświeża).'
  RIPPS2_RECENT_GAMES: Ostatnie gry
  RIPPS2_SET_METADATA_RENAME: Ustaw metadane (zmień nazwę)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Najpierw kontroler (eksperymentalne)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX czyta przez magistralę, którą dzieli z kontrolerem, a w trakcie odczytu kontroler nie jest słyszany: naciśnięcia się opóźniają lub giną, gdy ładują się okładki. Włączone: okładki przychodzą w małych kawałkach, a między nimi czytany jest kontroler, nieco wolniej. Wyłączone: tak szybko, jak pozwala karta. Gdy źródła karty są na Automatyczny, jej lista ładuje się raz, przy starcie.'
  HINT_RIPPS2_TRUST_CACHE: 'Lista pokazana z pamięci podręcznej zostaje taka, jaka jest, gotowa do uruchomienia, aż naciśniesz SELECT albo RIPPS2 sam zmieni to źródło. Wyłączone: każde źródło jest czytane ponownie w tle po pokazaniu pamięci podręcznej, co daje odczuwalną przerwę na karcie MMCE lub MX4SIO, które dzielą magistralę kontrolera.'
  RIPPS2_STATUS_OPEN: Ładowanie i dyski
  HINT_RIPPS2_STATUS_OPEN: 'Otwiera STAN: gdzie start czyta ustawienia i listy gier, które miejsce jest najszybsze, dokąd prowadzi EXIT gry, i każdy dysk. Jego USTAWIENIA PAMIĘCI PODRĘCZNEJ wracają tutaj.'
  RIPPS2_BADGE_SET: Zestaw odznak
  HINT_RIPPS2_BADGE_SET: 'Odznaki na stronie informacji gry (klasyfikacja, gracze, ESRB, tryb wideo, skanowanie, proporcje). RIPPS2: własny zestaw, taki sam w każdym motywie. Motyw: obrazy motywu albo RIPPS2, gdy motyw o nie prosi.'
  RIPPS2_HINT_FADE: Przenikanie podpowiedzi i ikon
  HINT_RIPPS2_HINT_FADE: 'Podpowiedź przycisku lub ikona, która się zmienia, pojawia się płynnie, jak okładki, w chwili zmiany; te, które zostają, pozostają nietknięte, na każdej stronie i w każdym komunikacie. Wyłączone: po prostu się pojawiają. Motyw: decyduje motyw (włączone, chyba że ma hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Styl paska bocznego
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klasyczny (dzielony): ikony w ciemnym pasie paska bocznego z kolorowym paskiem obok. XL (jednolity): jeden szerszy pas z ikonami pośrodku. Motyw: decyduje motyw.'
  HINT_EXITPATH: 'Dokąd prowadzi EXIT w menu w grze. Najlepiej puste: EXIT prowadzi do przeglądarki, która uruchamia twój bootloader (FreeMcBoot, PS2BBL, OSDMenu lub BIBLE), jeśli jest zainstalowany, a z włączonym BOOT LOCK znów RIPPS2, jak po włączeniu; bez niego przeglądarkę PS2. Wpisany tu ELF jest używany tylko wtedy, gdy reset może go wczytać (z karty pamięci lub dysku USB FAT32) i nie jest to sam RIPPS2; wszystko inne prowadzi do przeglądarki.'
  HINT_BDM_START: 'USB, iLink, MX4SIO i dysk HDD exFAT. Automatyczny uruchamia je przy starcie: najszybciej dla podłączonych dysków, z ich grami we Wszystkich grach od początku. Ręcznie uruchamia je, gdy otworzysz ich stronę.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino nie może używać VMC na dysku APA (exFAT, USB i MX4SIO mogą): ta gra uruchomi się z prawdziwą kartą w tym gnieździe.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Start czyta tylko napęd RIPPS2: ustawienia i dźwięki obok RIPPS2.ELF (RIPPS2.FB tam mówi gdzie) oraz każdą listę z jej pamięci podręcznej. Pozostałe napędy czekają: SELECT na stronie uruchamia jej napędy i wczytuje ich obrazy (z automatycznym odświeżaniem uruchamiają się przy starcie). Włączenie kopiuje twoje dźwięki, a muzykę, gdy jest miejsce, do AUDIO obok RIPPS2.'
  RIPPS2_ART_PACK: Paczka ART
  RIPPS2_ART_PACK_BUILD: Zbuduj lub usuń
  HINT_RIPPS2_ART_PACK: Pakuje folder ART każdego uruchomionego dysku do jednego art.tar na wybranym dysku (najszybszy jest proponowany pierwszy). Okładki są wtedy wczytywane z jednego pliku z jednym indeksem, nigdy z wyszukiwaniem dla każdej gry, więc menu i muzyka działają płynnie. Foldery ART zostają bez zmian.
  RIPPS2_LIST_CFG_TEXT: Tytuł i opis na liście
  HINT_RIPPS2_LIST_CFG_TEXT: 'Tytuł i opis gry z jej CFG obok listy. Motyw: tak, jak pokazuje motyw (własny motyw RIPPS2 je pomija). Strona informacji zawsze je zachowuje.'
  RIPPS2_PS1_PREFER: Duplikaty PS1
  HINT_RIPPS2_PS1_PREFER: 'Gra PS1, która jest zarazem VCD dla POPSTARTER i obrazem Ember. Oba: dwa wiersze. Ember: tylko wiersz Ember. POPSTARTER: tylko VCD. Ten sam tytuł, bez ID płyty na początku, to ta sama gra.'
  RIPPS2_MY_PADS: Moje pady
  HINT_RIPPS2_MY_PADS: 'Profile .pad w folderze PADS obok RIPPS2: jeden plik tekstowy na pad USB, nazwany jego ID (2563_0575.pad), każdy sprawdzony. Pad z profilem steruje menu i gra w grach (Pad Emulator włączony).'
  RIPPS2_PAD_SETUP: Ustaw pad USB
  HINT_RIPPS2_PAD_SETUP: Podłącz pad USB, którego RIPPS2 nie zna, naciskaj każdy przycisk, o który prosi, a RIPPS2 zapisze jego .pad w PADS. SELECT na padzie PS2 pomija przycisk.
