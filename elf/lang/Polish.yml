  The IP and SMB share POPSTARTER uses for PS1 games over the network.: IP i udział SMB, których POPSTARTER używa do gier PS1 przez sieć.
  The diagnostics are in %s.: Diagnostyka jest w %s.
  The diagnostics could not be written to %s.: Nie udało się zapisać diagnostyki w %s.
  What each memory card starts at power on; install or repair BIBLE, PS2BBL set up to start RIPPS2.: Co każda karta pamięci uruchamia po włączeniu; zainstaluj lub napraw BIBLE, PS2BBL ustawiony tak, by uruchamiał RIPPS2.
  Where POPSTARTER and Ember are, and how PS1 games start.: Gdzie są POPSTARTER i Ember oraz jak uruchamiają się gry PS1.
  ? Writes what RIPPS2 noted about the pads, the drives, MMCE cards and the last launches to DIAG.TXT beside RIPPS2. Send it with a bug report.
  : Zapisuje to, co RIPPS2 zanotował o kontrolerach, dyskach, kartach MMCE i ostatnich uruchomieniach, w DIAG.TXT obok RIPPS2. Wyślij go ze zgłoszeniem błędu.
  back to Cache: z powrotem do Pamięci podręcznej
  what boot reads first: co start czyta najpierw
  ', the sounds': ', dźwięki'
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot jest włączony. RIPPS2 uruchamia się z własnego napędu (%s): ustawienia%s i każda lista z jej pamięci podręcznej. Pozostałe napędy uruchamiają się, gdy naciśniesz SELECT na ich stronie lub uruchomisz jedną z ich gier.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot jest włączony. Dźwięki zajmują %d KB, a karta pamięci, z której działa RIPPS2, ma %d KB wolnego miejsca, więc zostają w %s.
  ' (%d KB free)': ' (%d KB wolne)'
  ' (%u MB free)': ' (%u MB wolne)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'OBOK RIPPS2: %sAUDIO%s, czytane jako pierwsze przy starcie'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- Konsola wiąże PS2BBL z tą kartą i zapisuje go jako %s/%s.
  
    - Jego konfiguracja, mc%d:/SYS-CONF/PS2BBL.INI, uruchamia RIPPS2 tam, gdzie jest (%s), bez czekania (0 ms, na co PS2BBL Extended nie pozwala), BOOT LOCK włączony. Sam RIPPS2 nie jest kopiowany.
  
    Procesor wejścia/wyjścia uruchamia się w tym celu ponownie i każde czytanie napędów zatrzymuje się do końca; muzyka i napędy wracają potem. Nie wyjmuj karty i nie wyłączaj konsoli, dopóki nie pokaże, że skończył.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Karta SD2PSX lub MMCE może się zabezpieczyć po odrzuconym zapisie: jeśli teraz brakuje karty pamięci lub napędu MMCE, wyłącz i włącz konsolę.'
  BOOT LOCK ON: BOOT LOCK WŁĄCZONY
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Gotowe: karta pamięci w gnieździe %d uruchamia to, co uruchamiała przed BIBLE. BIBLE zostaje w mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): KARTA PAMIĘCI W GNIEŹDZIE %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL nie może uruchomić RIPPS2 z miejsca, w którym jest teraz (sięga do kart pamięci, napędów USB i MX4SIO), a RIPPS2 nie kopiuje sam siebie. Umieść RIPPS2.ELF na karcie pamięci lub napędzie USB i uruchom go stamtąd albo użyj PS2BBL Extended, który czyta MMCE i dysk twardy.
  RESTORE SLOT %d'S OLD BOOT LOADER: PRZYWRÓĆ STARY PROGRAM ROZRUCHOWY Z GNIAZDA %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE jest skonfigurowany na karcie pamięci w gnieździe %d (mc%d:/%s/%s), BOOT LOCK włączony: przy włączaniu od razu uruchamia RIPPS2 z %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: konfiguracja BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: konfiguracja BIBLE
  
    RIPPS2 działa z %s, czego PS2BBL nie potrafi czytać (czyta karty pamięci, USB i MX4SIO), a RIPPS2 nie kopiuje sam siebie. Konfiguracja PS2BBL Extended na tej karcie (%s) to czyta: START włącza BOOT LOCK, więc przy włączaniu uruchomi RIPPS2 z %s. Nic innego na karcie się nie zmienia.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: konfiguracja BIBLE
  
    RIPPS2 działa z %s, czego PS2BBL nie potrafi czytać: uruchamia programy z karty pamięci, napędu USB lub MX4SIO, a RIPPS2 nie kopiuje sam siebie. Umieść RIPPS2.ELF na jednym z nich (w folderze APPS karty pamięci lub na napędzie USB), uruchom go stamtąd, a potem ponownie skonfiguruj BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: konfiguracja BIBLE
  
    Karta pamięci w gnieździe %d: BIBLE (mc%d:/%s) zostaje odsunięty, a to, co zastąpił (mc%d:/%s), wraca na swoje miejsce. Nic nie jest usuwane. Konfiguracja PS2BBL zostaje bez zmian (BOOT LOCK może wyłączyć blokadę).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: konfiguracja BIBLE (wiązanie PS2BBL z kartą pamięci)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: konfiguracja BIBLE (przywracanie tego, co było)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: konfiguracja BIBLE (ponowne uruchamianie procesora wejścia/wyjścia)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: konfiguracja BIBLE (zapis na kartę pamięci)'
  SET UP BIBLE: SKONFIGURUJ BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Karta pamięci w gnieździe %d ma %d KB wolnego miejsca, a BIBLE potrzebuje na niej %d KB. Zwolnij trochę miejsca i spróbuj ponownie.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Karta pamięci w gnieździe %d odrzuciła PS2BBL, więc RIPPS2 zostawił kartę bez zmian. Sprawdź wolne miejsce i spróbuj ponownie. (DIAG.TXT obok RIPPS2 zawiera odpowiedź karty.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Karta pamięci w gnieździe %d nie chciała odsunąć BIBLE, więc nic nie zmieniono. (DIAG.TXT obok RIPPS2 zawiera odpowiedź karty.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Karta pamięci w gnieździe %d nie chciała przyjąć z powrotem %s, więc BIBLE został. (DIAG.TXT obok RIPPS2 zawiera odpowiedź karty.)
  MUSIC: MUZYKA
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s nie ma %s. RIPPOPS znalazł emulator PS1 Sony na %s: START kopiuje %s tutaj i uruchamia grę.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 nie widzi %s w %s%s. POPSTARTER potrzebuje POPS_IOX.PAK z POPS.PAK albo z POPS.ELF i IOPRP252.IMG: emulatora PS1 Sony z twojej własnej konsoli. Może je znaleźć tam, gdzie RIPPS2 nie szuka (jeśli twoje gry się uruchamiają, to znajduje). START uruchamia, a o ten napęd nie będzie już pytania.'
  ' (The configs found were set: %s.)': ' (Ustawiono znalezione konfiguracje: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Zapisz raz jego ustawienia w jego własnym konfiguratorze, a potem włącz BOOT LOCK ponownie.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s nie może uruchomić RIPPS2 z miejsca, w którym jest teraz (%s), a RIPPS2 nie kopiuje się sam. Umieść RIPPS2.ELF na karcie pamięci lub dysku USB i uruchom go stamtąd.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK nie mógł zapisać konfiguracji programu rozruchowego. Sprawdź, czy karta pamięci lub dysk nie jest chroniony przed zapisem, i spróbuj ponownie.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK nie znalazł konfiguracji programu rozruchowego do zmiany.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK jest wyłączony. Twój program rozruchowy uruchamia to, co uruchamiał wcześniej (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK jest włączony. %s uruchamia teraz RIPPS2 przy włączaniu (%s), a pusta Ścieżka Dla IGR odsyła EXIT z gry tą samą drogą. Przytrzymaj jeden z jego przycisków podczas startu konsoli, aby dostać się do czegoś innego.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK umieścił RIPPS2 na pierwszym miejscu w menu OSDMenu (%s). OSDMenu samo niczego nie uruchamia: wybierz tam RIPPS2, a EXIT z gry wraca do tego menu. Aby konsola od razu uruchamiała RIPPS2, BIBLE instaluje PS2BBL na karcie pamięci (Program rozruchowy).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK działa przez program rozruchowy na karcie pamięci (PS2BBL, FMCB lub OSDMenu), a tutaj nie ma żadnego.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Karta pamięci w gnieździe %d uruchamia przy włączaniu %s, a BOOT LOCK nie znalazł jego konfiguracji do zmiany (szuka %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Karta pamięci w gnieździe %d uruchamia przy włączaniu %s, którego BOOT LOCK nie potrafi ustawić: działa przez PS2BBL, FMCB i OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Na tej konsoli jest program rozruchowy z blokadą RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT z gry: przeglądarka, potem twój program rozruchowy (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'W użyciu: %s, %d obrazów, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Pomiar szybkości, z jaką każdy dysk czyta swoje obrazy: %s'
  'None: each picture is read from its own ART folder.': 'Brak: każdy obraz jest czytany z własnego folderu ART.'
  REMOVE the pack in %s (the ART folders stay as they are): USUŃ paczkę w %s (foldery ART zostają bez zmian)
  Remove the ART Pack in %s? The ART folders stay as they are.: Usunąć paczkę ART w %s? Foldery ART zostają bez zmian.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Zatrzymano. Niedokończona paczka została usunięta, a obrazy są wczytywane z folderów ART jak wcześniej.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Nie udało się zapisać paczki ART w %s (czy na tym dysku jest miejsce?). Nic innego się nie zmieniło: obrazy są wczytywane z folderów ART jak wcześniej.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Paczka ART w %s została usunięta. Obrazy znów są wczytywane z folderów ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Na uruchomionych dyskach nie ma folderu ART z obrazami. Uruchom dyski, na których są twoje obrazy (SELECT na ich stronie), a potem wróć.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d obrazów z %d folderów ART trafia do jednego pliku, %s. Foldery ART zostają bez zmian: paczka jest kopią. Możesz skopiować art.tar do folderu ART innego dysku w Memory Files, ale najszybciej jest zbudować ją na dysku, z którego przeglądasz, dlatego najszybszy dysk jest pierwszy. Zbudować teraz?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Paczka ART jest gotowa: %d obrazów, %d MB, w %s (%d s). Od teraz obrazy są wczytywane z niej, a dla %d gier, dla których ją zbudowano, ich folder ART nigdy więcej nie jest pytany obraz po obrazie. Obrazy, które RIPPS2 pobiera lub robi, pojawiają się od razu; te skopiowane z komputera pojawią się po ponownym zbudowaniu paczki.'
  '%s free': '%s wolne'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: czyta %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: czyta %s/s, najszybszy, %s'
  ART PACK: PACZKA ART
  About %d min: Około %d min
  'Looking at the ART folders: %d pictures, %s': 'Sprawdzanie folderów ART: %d obrazów, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 'Żaden uruchomiony dysk nie ma miejsca na paczkę ART: potrzebuje około %s. Zwolnij miejsce na dysku, z którego przeglądasz, i spróbuj ponownie.'
  PACKING THE ART: PAKOWANIE OBRAZÓW
  PICTURE %d OF %d: OBRAZ %d Z %d
  'Pictures: %d (%s). ART folders: %d.': 'Obrazy: %d (%s). Foldery ART: %d.'
  Stop? The unfinished pack is removed; the ART folders stay as they are.: Zatrzymać? Niedokończona paczka zostanie usunięta; foldery ART zostają bez zmian.
  'The ART folders stay as they are: the pack is a copy.': 'Foldery ART zostają bez zmian: paczka jest kopią.'
  Under a minute: Mniej niż minuta
  free space unknown: wolne miejsce nieznane
  'A game''s EXIT: the browser, or your boot loader when one is installed': 'EXIT z gry: przeglądarka albo twój bootloader, jeśli jest zainstalowany'
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): Ogg Vorbis od Xiph.Org (BSD), minimp3 od lieff (CC0)
  RIPFLOW's type, and every message and notification: krój RIPFLOW oraz każdego komunikatu i powiadomienia
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Dzięki wszystkim, którzy testują na Discordzie i zgłaszają issues na GitHubie:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'IGR Path %s nie jest używana: po grze da się wczytać tylko plik z karty pamięci lub USB, i nigdy samego RIPPS2'
  an issue is the best way to get RIPPS2 updated.: zgłoszenie issue to najlepszy sposób, by RIPPS2 się rozwijał.
  your Ogg and MP3 music, as RIPPS2 plays it: twoja muzyka Ogg i MP3, tak jak gra ją RIPPS2
  Pop In and Name: Wyskakiwanie i nazwa
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s startuje po filarach, więc dźwięk startowy gra za późno. START kopiuje boot.adp (%d KB) obok RIPPS2 na kartę pamięci (%d KB wolne), gdzie gra, gdy filary się wznoszą.'
  The boot sound could not be copied to %s. It still plays from %s.: Nie udało się skopiować dźwięku startowego do %s. Nadal gra z %s.
  Zoom: Przybliżenie
  '%s could not be deleted; it stays as it was.': Nie udało się usunąć %s; zostaje bez zmian.
  '%s could not be read as a .tar archive. Nothing was changed.': Nie udało się odczytać %s jako archiwum .tar. Nic nie zmieniono.
  '%s is deleted. %s is kept.': '%s usunięto. %s zostaje.'
  Art loads from it from now on.: Odtąd obrazy wczytują się z niego.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : 'Usunąć dołączony .tar?
  
    USUWANY: %s
  
    ZOSTAJE: %s (cel, teraz z każdym obrazem z obu)'
  Into %s (%s): Do %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : 'ZOSTAJE i jest aktualizowany: %s (%d obrazów)
  
    DOŁĄCZANY: %s (%d obrazów)
  
    Obrazy w obu: %d. Wygrywa dołączany. Zachowany .tar zapisuje się od nowa jako nowy plik i podmienia dopiero, gdy jest cały, więc zatrzymanie lub pełny dysk zostawia go bez zmian. Scalić teraz?'
  MERGE .TAR: SCAL .TAR
  MERGE a .tar into the pack in %s: SCAL .tar z paczką w %s
  MERGING THE ART: SCALANIE OBRAZÓW
  Merge in %s (%s): Dołącz %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Dołączyć nową paczkę do innego .tar? Potem wybierasz .tar, który zostaje i jest aktualizowany; obrazy nowej paczki trafiają do niego.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Scalono: %s ma teraz %d obrazów (%d MB), %d s.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Wchodzące obrazy: %d (%s). Ta sama nazwa w obu: %d (wygrywa dołączany).'
  'Reading the archives: %s': 'Odczyt archiwów: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Zatrzymać? Zachowany .tar zostaje bez zmian; niedokończona kopia jest usuwana.
  Stopped. %s is as it was; the unfinished copy was removed.: Zatrzymano. %s jest bez zmian; niedokończoną kopię usunięto.
  The kept .tar is only replaced once the merged copy is whole.: Zachowany .tar jest podmieniany dopiero, gdy scalona kopia jest cała.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Nie udało się zapisać scalenia na dysku %s (jest miejsce?). Jest bez zmian; nic innego się nie zmieniło.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : Scalenie potrzebuje około %s wolnego miejsca na dysku %s (nowe archiwum zapisuje się najpierw obok starego). Zwolnij trochę miejsca i spróbuj ponownie.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Scalanie zatrzymało się między dwiema zmianami nazwy: zachowany .tar to %s, a dołączany %s. Przywróć im nazwy w Plikach pamięci.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : Scalony .tar został zapisany, ale nie mógł przyjąć nazwy %s (MMCE zmienia nazwy od firmware 1.4.0). Nowy plik usunięto; zachowany .tar jest bez zmian.
