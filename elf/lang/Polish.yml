  'This disc is not compatible: it is a region %d DVD, and this console plays another region''s DVDs. Start it anyway?': 'Ta płyta nie jest zgodna: to DVD z regionu %d, a ta konsola odtwarza DVD z innego regionu. Uruchomić mimo to?'
  ? 'This disc is not compatible: it reads as DVD video but has no DVD video on it (no VIDEO_TS), so a DVD player cannot play it.'
  : 'Ta płyta nie jest zgodna: odczytuje się jako DVD wideo, ale nie ma na niej DVD wideo (brak VIDEO_TS), więc odtwarzacz DVD nie może jej odtworzyć.'
  This is an ESR-patched PS2 game. Put ESR (esr*.elf) in APPS, BOOT or ESR on a memory card or USB drive to start it.: To gra PS2 z łatką ESR. Aby ją uruchomić, umieść ESR (esr*.elf) w APPS, BOOT lub ESR na karcie pamięci albo pendrivie USB.
