  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE nie mógł skopiować RIPPS2 na partycję %s dysku HDD. Sprawdź wolne miejsce. Nic innego nie zmieniono.
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE nie mógł zachować kopii programu rozruchowego HDD, więc zatrzymał się przed jego zmianą. RIPPS2 został skopiowany na HDD; nic innego nie zmieniono.
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE nie mógł zapisać swojej konfiguracji (%s). Program rozruchowy nie został zmieniony.
  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE nie mógł zapisać programu rozruchowego HDD (krok %d). %s
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'BIBLE jest zainstalowany na wewnętrznym HDD, a BOOT LOCK jest włączony: przy włączaniu konsola od razu uruchamia RIPPS2 z %s%s%s%s. Konfiguracja: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE jest na karcie pamięci %d, ale nie udało się zapisać jego konfiguracji (%s), więc uruchamia przeglądarkę. Zwolnij trochę miejsca i uruchom ZARZĄDZAJ ponownie, aby dokończyć.
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE zabrakło pamięci, zanim zaczął. Nic nie zmieniono.
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE zabrakło pamięci. Na karcie pamięci nic nie zmieniono.
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: kopiowanie RIPPS2 do %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: zachowywanie programu rozruchowego HDD'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: przywracanie programu rozruchowego HDD'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: zapisywanie PS2BBL w obszarze rozruchowym HDD'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'ZAINSTALUJ BIBLE NA WEWNĘTRZNYM HDD

    - RIPPS2 zostaje skopiowany do %s.

    - Program rozruchowy HDD obecny w __mbr zostaje odczytany i zachowany w %s/RIPPS2 (PRZYWRÓĆ wkłada go z powrotem).

    - W jego miejsce trafia wersja HDD PS2BBL, a konsola zostaje ustawiona, by uruchamiała ją przy włączaniu.

    - Jej konfiguracja (%s) uruchamia RIPPS2 najpierw z %s%s%s, BOOT LOCK włączony.

    Potrzebna jest konsola, która startuje z HDD (gruba PS2 z adapterem sieciowym). Nie wyłączaj jej, aż pojawi się informacja o zakończeniu.'
  INTERNAL HDD  (its boot area): WEWNĘTRZNY HDD  (jego obszar rozruchowy)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'PRZYWRÓĆ STARY PROGRAM ROZRUCHOWY HDD

    Ten zachowany przez BIBLE (RIPPS2/MBR-BACKUP.KELF na HDD) wraca do __mbr w miejsce BIBLE. RIPPS2 i konfiguracja PS2BBL zostają tam, gdzie są.'
  RESTORE: PRZYWRÓĆ
  RESTORE THE HDD'S OLD BOOT PROGRAM: PRZYWRÓĆ STARY PROGRAM ROZRUCHOWY HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 nie potrafi rozpoznać regionu tej konsoli z jej ROM-u, więc nie wie, który folder aktualizacji systemu ona czyta. BIBLE nie został zainstalowany.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 nie mógł otworzyć partycji __sysconf ani __common na HDD (błąd %d), więc BIBLE nie ma tam gdzie trzymać RIPPS2 i swojej konfiguracji. Nic nie zmieniono.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 nie mógł odczytać zachowanego programu rozruchowego. Nic nie zmieniono.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 nie mógł zapisać z powrotem programu rozruchowego. Spróbuj ponownie; zachowana kopia jest nietknięta.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 był zajęty odczytem dysku i nie mógł uruchomić ponownie procesora I/O. Nic nie zmieniono: spróbuj ponownie za chwilę.'
