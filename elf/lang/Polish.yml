# RIPPS2 in Polish. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Polish
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE: ZAINSTALUJ, ZAKTUALIZUJ LUB PRZYWRÓĆ"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "ZAKTUALIZUJ BIBLE: W GNIEŹDZIE %d JEST STARSZY"
  "Background": "Tło"
  "Sky": "Niebo"
  "Black": "Czarne"
  "Splash": "Ekran startowy"
  "Logo": "Logo"
  "Logo and Names": "Logo i nazwy"
  "Button Glyphs": "Symbole przycisków"
  "Face Buttons": "Przyciski akcji"
  "All Sixteen": "Wszystkie szesnaście"
  "Info Line": "Wiersz informacji"
  "Power-on Wait": "Czekanie po włączeniu"
  "%s, path %d": "%s, ścieżka %d"
  "A BIBLE COMMAND": "POLECENIE BIBLE"
  "ARGUMENTS": "ARGUMENTY"
  "Argument %d": "Argument %d"
  "Arguments: %s": "Argumenty: %s"
  "Auto (no button held)": "Auto (bez trzymanego przycisku)"
  "BIBLE hands these to the program, in this order.": "BIBLE przekazuje je programowi w tej kolejności."
  "BIBLE has no way to reach that drive. Choose a program on another one, or type the path.": "BIBLE nie ma dostępu do tego dysku. Wybierz program na innym lub wpisz ścieżkę."
  "BIBLE keeps this key from PS2BBL, but nothing in this build acts on it, so it changes nothing yet.": "BIBLE zachowuje ten klucz z PS2BBL, ale nic w tej wersji go nie używa, więc na razie niczego nie zmienia."
  "BIBLE needs at least one path in its settings, or it starts in its rescue mode, so this one stays.": "BIBLE potrzebuje co najmniej jednej ścieżki w ustawieniach, inaczej startuje w trybie ratunkowym, więc ta zostaje."
  "BIBLE's Settings": "Ustawienia BIBLE"
  "BIBLE's credits": "Twórcy BIBLE"
  "BOOT LOCK holds this line. Turn BOOT LOCK off to change it.": "Ten wiersz trzyma BOOT LOCK. Wyłącz BOOT LOCK, aby go zmienić."
  "Binds the BIBLE RIPPS2 carries to a memory card, writes it over the one there, or puts back what it replaced.": "Wiąże BIBLE zawarty w RIPPS2 z kartą pamięci, zapisuje go na istniejącym lub przywraca to, co zastąpił."
  "Boot Sound": "Dźwięk startowy"
  "CHOOSE A PROGRAM": "WYBIERZ PROGRAM"
  "CHOOSE AN ELF": "WYBIERZ ELF"
  "Choose a program from your drives, type a path, or pick one of BIBLE's commands. BIBLE tries the paths in order and starts the first it finds.": "Wybierz program z dysków, wpisz ścieżkę lub wybierz polecenie BIBLE. BIBLE próbuje ścieżek po kolei i uruchamia pierwszą znalezioną."
  "Follow Color Theme": "Według motywu kolorów"
  "How long BIBLE waits for a button before the Auto path. At 0 ms a button held from power on still works. A boot sound beside BIBLE is read first: about 2 s at 0 ms.": "Jak długo BIBLE czeka na przycisk przed ścieżką Auto. Przy 0 ms przycisk trzymany od włączenia nadal działa. Dźwięk startowy obok BIBLE jest czytany najpierw: około 2 s przy 0 ms."
  "Launch Keys": "Przyciski startu"
  "Launch Keys: %s": "Przyciski startu: %s"
  "On shows a disc's game ID on screen as it starts, for RetroGEM video mods.": "Wł. pokazuje ID gry z płyty na ekranie przy starcie, dla modów wideo RetroGEM."
  "On shows a program's game ID on screen as it starts, for RetroGEM video mods. It is up to 11 characters from the file name.": "Wł. pokazuje ID programu na ekranie przy starcie, dla modów wideo RetroGEM. Do 11 znaków z nazwy pliku."
  "On stops the disc at a launch and waits for the drive to answer. Off skips that wait, about 3 s in the lab, and a disc in the tray keeps spinning.": "Wł. zatrzymuje płytę przy starcie i czeka na odpowiedź napędu. Wył. pomija to czekanie, około 3 s w laboratorium, a płyta w tacy dalej się kręci."
  "Opens the file itself in the text editor, comments and all. Every change here keeps the other lines as they are.": "Otwiera sam plik w edytorze tekstu, z komentarzami. Każda zmiana tutaj zostawia pozostałe wiersze bez zmian."
  "Path %d": "Ścieżka %d"
  "Shows the countdown, the clock and the console's details on the splash.": "Pokazuje odliczanie, zegar i dane konsoli na ekranie startowym."
  "Sky Color": "Kolor nieba"
  "TYPE A PATH": "WPISZ ŚCIEŻKĘ"
  "The button pictures under the logo: none, the four face buttons, or all sixteen.": "Obrazki przycisków pod logo: żadne, cztery główne przyciski lub wszystkie szesnaście."
  "The console's browser": "Przeglądarka konsoli"
  "The disc in the tray": "Płyta w tacy"
  "The disc, without the PS2 logo": "Płyta, bez logo PS2"
  "The name BIBLE's splash shows for this button.": "Nazwa, którą ekran BIBLE pokazuje dla tego przycisku."
  "The same setting as in Audio. On (fast) keeps a copy on the memory card, so the sound starts with the first frame. Off is the fastest boot.": "To samo ustawienie co w Dźwięku. Wł. (szybko) trzyma kopię na karcie pamięci, więc dźwięk startuje z pierwszą klatką. Wył. to najszybszy start."
  "The shape of BIBLE's splash. Auto follows RIPPS2's Widescreen when its settings are on a memory card.": "Kształt ekranu BIBLE. Auto podąża za panoramą RIPPS2, gdy jego ustawienia są na karcie pamięci."
  "The signal BIBLE starts in. Auto uses RIPPS2's Video Mode when its settings are on a memory card, and the console's own mode when they are not.": "Sygnał, w którym startuje BIBLE. Auto używa trybu wideo RIPPS2, gdy jego ustawienia są na karcie pamięci, inaczej trybu samej konsoli."
  "The sky on BIBLE's splash. Follow Color Theme uses the sky RIPPS2 saves with its settings. A color named here stays, whatever the theme.": "Niebo na ekranie BIBLE. Według motywu kolorów używa nieba, które RIPPS2 zapisuje z ustawieniami. Kolor wybrany tutaj zostaje, niezależnie od motywu."
  "This BIBLE (%s build) does not read this drive, so it moves on to the next path.": "Ten BIBLE (wersja %s) nie czyta tego dysku, więc przechodzi do następnej ścieżki."
  "What BIBLE shows while it waits for a button: nothing, its logo, or its logo with the name of what each button starts.": "Co BIBLE pokazuje, czekając na przycisk: nic, swoje logo lub logo z nazwą tego, co uruchamia każdy przycisk."
  "What BIBLE starts when no button is held at power on.": "Co BIBLE uruchamia, gdy przy włączeniu nie jest trzymany żaden przycisk."
  "What BIBLE starts when this button is held at power on. L2 + R2 held at power on shows BIBLE's own page of them all.": "Co BIBLE uruchamia, gdy ten przycisk jest trzymany przy włączeniu. L2 + R2 przy włączeniu pokazują stronę BIBLE ze wszystkimi."
  "What each button starts at power on, each with up to ten paths chosen from your drives.": "Co każdy przycisk uruchamia przy włączeniu, każdy z maksymalnie dziesięcioma ścieżkami z twoich dysków."
  "What stands behind BIBLE's logo. Auto shows the sky when Sky Color is set or RIPPS2's settings are on a memory card, and black when they are not.": "Co stoi za logo BIBLE. Auto pokazuje niebo, gdy ustawiono Kolor nieba lub ustawienia RIPPS2 są na karcie pamięci, inaczej czerń."
  "When a button starts a disc and the tray is empty, On opens the tray for you.": "Gdy przycisk uruchamia płytę, a taca jest pusta, Wł. otwiera tacę za ciebie."
  "Eject Tray at Launch": "Wysuń tacę przy starcie"
  "Read Console History": "Czytaj historię konsoli"
  "Game ID for Apps": "ID gry dla aplikacji"
  "Game ID for Discs": "ID gry dla płyt"
  "File name (as it appears in your games list)": "Nazwa pliku (tak jak na liście gier)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "Ta lista pokazuje gry z innych dysków. Zmień nazwę gry na stronie jej dysku."
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "Nie można zmienić nazwy gry z gwiazdką. Usuń gwiazdkę (R3), zmień nazwę, a potem dodaj ją ponownie."
  "This drive cannot rename its files. The details can still be set.": "Ten dysk nie może zmieniać nazw swoich plików. Szczegóły można nadal ustawić."
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "Na dysku APA nazwa gry PS2 jest w tablicy partycji, więc nie można jej tu zmienić. Szczegóły można nadal ustawić."
  "Renames the app in your list. Its ELF and its art keep their names.": "Zmienia nazwę aplikacji na liście. Jej ELF i grafiki zachowują swoje nazwy."
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "Zmienia nazwę gry na jej dysku. Gry PS1 znajdują grafiki i ustawienia po nazwie, więc RIPPS2 zmienia też ich nazwy. Grafiki w ART Pack wymagają ponownego zbudowania paczki."
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "Zmienia nazwę pliku gry na jej dysku. Gry PS2 znajdują grafiki i ustawienia po ID gry, więc nic nie przepada."
  "Stop Disc at Launch": "Zatrzymaj płytę przy starcie"
  "EDIT BIBLE'S SETTINGS FILE": "EDYTUJ PLIK USTAWIEŃ BIBLE"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "Nie udało się zapisać pliku ustawień BIBLE (%s). Sprawdź, czy karta pamięci jest włożona i ma miejsce, i spróbuj ponownie."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "Nie znaleziono pliku ustawień BIBLE (%s). BIBLE: ZAINSTALUJ, ZAKTUALIZUJ LUB PRZYWRÓĆ zapisuje nowy."
  "Boot sound On (fast): %s, handed over by BIBLE": "Dźwięk startu Wł. (szybko): %s, przekazany przez BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: fork PS2BBL Extended od akilluminati47, każda kompilacja podpisana przez akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "jego obraz IOPRP wiąże BIBLE z twoją kartą (GPL-3): szyfrowanie robi konsola, bez kluczy"
  "KELFBinder by El Isra": "KELFBinder autorstwa El Isry"
  "source: github.com/akilluminati47/BIBLE": "źródło: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "GNIAZDO 0: %s\nGNIAZDO 1: %s\n%s\nRIPPS2: konfiguracja BIBLE. BIBLE, bootloader akilluminati47 oparty na PS2BBL autorstwa El Isry, skonfigurowany przez RIPPS2 na zwykłej karcie pamięci PS2 8 MB lub wewnętrznym dysku twardym: start w 0 ms przy włączaniu (PS2BBL Extended nie pozwala na 0), najpierw RIPPS2 z miejsca, w którym jest (nigdy nie jest kopiowany), a przycisk przytrzymany przy włączaniu nadal prowadzi do przeglądarki (TRIANGLE), płyty (START) i tego, co było wcześniej (CIRCLE). Skonfigurować, naprawić czy przywrócić to, co zastąpił?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: konfiguracja BIBLE\nKarta w gnieździe %d to karta SD2PSX lub MMCE. Jej karta BOOT może mieć BIBLE zamiast swojego PS2BBL (ten jest najpierw w całości odkładany na bok), jeśli konsola zwiąże z nią BIBLE. Jeśli wiązanie zostanie odrzucone, nic na karcie się nie zmieni, a karta może przestać odpowiadać, dopóki konsola nie zostanie wyłączona i włączona. START wiąże z nią BIBLE."
  "BIND BIBLE": "ZWIĄŻ BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT obok RIPPS2 zawiera odpowiedź karty.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Dla zwykłej karty pamięci PS2 8 MB (karty MagicGate albo karty BOOT SD2PSX lub MMCE): tej w gnieździe %d. Przy włączaniu PS2BBL czyta konfigurację z gniazda 1 przed konfiguracją z gniazda 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Konsola nie związała BIBLE z kartą pamięci w gnieździe %d (krok MagicGate się nie powiódł). Na karcie nic nie zmieniono. Karta, która nie jest oryginalna ani zgodna z MagicGate, nie może przechowywać aktualizacji systemu."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Karta SD2PSX lub MMCE może przestać odpowiadać po odrzuconym wiązaniu: jeśli teraz brakuje karty pamięci lub napędu MMCE, wyłącz i włącz konsolę."
  "RIP THIS CONSOLE'S AUDIO": "ZGRAJ DŹWIĘK TEJ KONSOLI"
  "sounds or music, from its BIOS": "dźwięki lub muzyka, z jej BIOS-u"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Otwiera Ustawienia dźwięku na Dźwiękach BIOS i Muzyce BIOS: zgraj dźwięki tej konsoli lub muzykę jej menu do AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Dźwięk startu Wł. (szybko): %s na karcie pamięci, gdy filary rosną"
  "Boot sound On: %s on the memory card, as the pillars rise": "Dźwięk startu Wł.: %s na karcie pamięci, gdy filary rosną"
  "Boot sound On: %s, once its drive is up": "Dźwięk startu Wł.: %s, gdy jego dysk jest gotowy"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Ta gra uruchamia się przez Neutrino, a RIPPS2 nie znalazł żadnego: ani pod ścieżką z Ustawień, ani na dysku gry, ani na kartach pamięci, ani na żadnym uruchomionym dysku. Umieść Neutrino od rickgaisera (github.com/rickgaiser/neutrino) w folderze neutrino na dysku gry lub karcie pamięci albo wskaż go w Uruchamianie gier > Neutrino."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Gdzie jest twój Neutrino, jego tryb wideo i argumenty, które dostaje każde uruchomienie Neutrino. Pobierz Neutrino z github.com/rickgaiser/neutrino i umieść je w folderze neutrino na dysku lub karcie pamięci."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Ten Neutrino jest starszy niż 1.3, który nie potrafi uruchamiać gier z dysku APA. Wskaż w Uruchamianie gier > Neutrino Neutrino 1.3 lub nowszy."
  "with rickgaiser's Neutrino as its second game core,": "z Neutrino od rickgaisera jako drugim rdzeniem gier,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "drugi rdzeń gier, używany z twojego dysku lub karty pamięci (AFL-3.0)"
  "FILE NAME": "NAZWA PLIKU"
  "GAME LIST": "LISTA GIER"
  "%s in %s": "%s w %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Operacje zapisu są wyłączone, więc RIPPS2 nie może zapisać danych gry ani zmienić jej nazwy. Włączyć je?"
  "START %s": "URUCHOM %s"
  "NETWORK": "SIEĆ"
  "%s did not answer. Is it connected?": "%s nie odpowiedział. Czy jest podłączony?"
