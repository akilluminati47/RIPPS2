  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Uruchom klienta xeRAbora na PC w tej samej sieci, zalogowanego na twoje konto RetroAchievements. Potem dla gry na USB, MMCE, SMB lub HDD: otwórz jej menu gry (TRÓJKĄT) i wybierz SPRAWDŹ OBSŁUGĘ GRY. Śledzona gra dostaje odznakę RA; przy włączonej TELEMETRII uruchom ją, a odblokowania pojawią się nad grą. Dla płyty w tacce użyj SPRAWDŹ PŁYTĘ, potem GRAJ Z PŁYTY Z OSIĄGNIĘCIAMI. Gry uruchamiane przez Neutrino, POPSTARTER lub Ember nie są jeszcze śledzone.'
