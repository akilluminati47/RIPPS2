  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 nie wie, gdzie jest jego folder, więc nie ma gdzie umieścić dźwięków.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 odgrywa muzykę menu tej konsoli, ambientowy utwór jej przeglądarki (%d:%02d), z własnych nut BIOS-u i zapisuje ją jako WAV o rozmiarze %s w %s; żadna karta pamięci jej nie zmieści. Istniejący tam %s zostanie zastąpiony. Trwa to minutę lub dwie.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 odczytuje dźwięki z BIOS-u tej konsoli i zapisuje je w %s jako swoje dźwięki: kursor, zatwierdzenie, anulowanie, strony, kategoria, komunikaty, płyta, błąd, zapis, dyski i losowy, a także muzykę startu i uruchamiania gry, odegraną z własnych nut BIOS-u. Istniejące tam pliki o tych nazwach zostaną zastąpione.'
