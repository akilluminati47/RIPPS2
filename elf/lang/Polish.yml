  EMBER_GLOBAL_WARNING: Te ustawienia Ember dotyczą każdej gry PS1, a niektóre gry się z nimi wysypują. Aby zmienić tylko jedną grę, użyj Trójkąt > Ustawienia gry Ember na tej grze.
