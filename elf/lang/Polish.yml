  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Poprzedni jest zachowany w RIPPS2/MBR-BACKUP.KELF na HDD: PROGRAM ROZRUCHOWY > ZARZĄDZAJ > PRZYWRÓĆ wkłada go z powrotem.'
  The security module would not start on this console. Nothing on the memory card was changed.: Moduł bezpieczeństwa nie uruchomił się na tej konsoli. Na karcie pamięci nic nie zmieniono.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
