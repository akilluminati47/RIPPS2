  HINT_RA_MODE: Wybierz klienta na PC. Domyślny jest Xerabora; Caduceus najpierw sprawdza swoją zalogowaną sesję.
  RA_CADUCEUS_OFFLINE: Sesja RA Caduceus jest offline.
