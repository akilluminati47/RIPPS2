  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : Hindi maisulat ng BOOT LOCK ang config ng boot loader. Tingnan kung hindi naka-write protect ang memory card o drive, saka subukan ulit.
  BOOT LOCK found no boot loader config to change.: Walang nahanap na boot loader config ang BOOT LOCK na babaguhin.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: Naka-off ang BOOT LOCK. Sinisimulan ng boot loader mo ang dati nitong sinisimulan (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : Naka-on ang BOOT LOCK. Sinisimulan na ng %s ang RIPPS2 sa pag-on (%s), at ibinabalik ng walang lamang IGR path ang EXIT ng laro sa parehong daan. Pindutin nang matagal ang isa sa mga button nito habang nagsisimula ang console para makapunta sa iba.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'Inilagay ng BOOT LOCK ang RIPPS2 sa una sa menu ng OSDMenu (%s). Walang sinisimulan ang OSDMenu nang kusa: piliin doon ang RIPPS2, at bumabalik sa menu na iyon ang EXIT ng laro. Para sa console na agad nagsisimula ng RIPPS2, inilalagay ng BIBLE ang PS2BBL sa memory card (Boot Loader).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: Gumagana ang BOOT LOCK sa pamamagitan ng boot loader sa memory card (PS2BBL, FMCB o OSDMenu), at wala nito rito.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Sinisimulan ng memory card sa slot %d ang %s sa pag-on, at walang nahanap ang BOOT LOCK na config nito na babaguhin (hinahanap nito ang %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Sinisimulan ng memory card sa slot %d ang %s sa pag-on, na hindi kayang itakda ng BOOT LOCK: gumagana ito sa pamamagitan ng PS2BBL, FMCB at OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: May boot loader na may lock ng RIPPS2 sa console na ito.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT ng laro: ang browser, saka ang boot loader mo (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'Ginagamit: %s, %d larawan, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Sinusukat kung gaano kabilis binabasa ng bawat drive ang mga larawan nito: %s'
  'None: each picture is read from its own ART folder.': 'Wala: binabasa ang bawat larawan mula sa sarili nitong ART folder.'
  REMOVE the pack in %s (the ART folders stay as they are): TANGGALIN ang pack sa %s (mananatili ang mga ART folder)
  Remove the ART Pack in %s? The ART folders stay as they are.: Tanggalin ang ART Pack sa %s? Mananatili ang mga ART folder.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Itinigil. Tinanggal ang hindi tapos na pack, at nilo-load ang mga larawan mula sa mga ART folder gaya ng dati.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Hindi maisulat ang ART Pack sa %s (may puwang ba sa drive na iyon?). Wala nang ibang nagbago: nilo-load ang mga larawan mula sa mga ART folder gaya ng dati.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Natanggal na ang ART Pack sa %s. Nilo-load ulit ang mga larawan mula sa mga ART folder.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Walang ART folder na may mga larawan sa mga sinimulang drive. Simulan ang mga drive kung nasaan ang mga larawan mo (SELECT sa kanilang page), saka bumalik.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d larawan mula sa %d ART folder ang mapupunta sa iisang file, %s. Mananatili ang mga ART folder: kopya lang ang pack. Puwede mong kopyahin ang art.tar sa ART folder ng ibang drive gamit ang Memory Files, pero pinakamabilis kung bubuuin ito sa drive na binabrowse mo, kaya nauuna ang pinakamabilis na drive. Buuin na ngayon?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Buo na ang ART Pack: %d larawan, %d MB, sa %s (%d s). Mula ngayon dito na nilo-load ang mga larawan, at ang %d laro na pinagbuuan nito ay hindi na tatanungin sa kanilang ART folder nang isa-isang larawan. Lumalabas agad ang mga larawang kinukuha o kinukunan ng RIPPS2; ang kinokopya mo mula sa PC ay lalabas kapag binuo mo ulit ang pack.'
  '%s free': '%s bakante'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: bumabasa ng %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: bumabasa ng %s/s, ang pinakamabilis, %s'
  ART PACK: ART PACK
  About %d min: Mga %d min
  'Looking at the ART folders: %d pictures, %s': 'Tinitingnan ang mga ART folder: %d larawan, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 'Walang sinimulang drive na may puwang para sa ART Pack: kailangan nito ng mga %s. Magbakante ng puwang sa drive na binabrowse mo, saka subukan ulit.'
  PACKING THE ART: PINAPACK ANG MGA LARAWAN
  PICTURE %d OF %d: LARAWAN %d SA %d
  'Pictures: %d (%s). ART folders: %d.': 'Mga larawan: %d (%s). Mga ART folder: %d.'
  Stop? The unfinished pack is removed; the ART folders stay as they are.: Ihinto? Tatanggalin ang hindi tapos na pack; mananatili ang mga ART folder.
  'The ART folders stay as they are: the pack is a copy.': 'Mananatili ang mga ART folder: kopya lang ang pack.'
  Under a minute: Wala pang isang minuto
  free space unknown: hindi alam ang bakanteng puwang
  'A game''s EXIT: the browser, or your boot loader when one is installed': 'EXIT ng laro: ang browser, o ang iyong boot loader kapag may naka-install'
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): Ogg Vorbis ng Xiph.Org (BSD), minimp3 ni lieff (CC0)
  RIPFLOW's type, and every message and notification: ang titik ng RIPFLOW, at ng bawat mensahe at abiso
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Salamat sa lahat ng nagte-test sa Discord at nagbubukas ng issues sa GitHub:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'Hindi ginagamit ang IGR Path %s: pagkatapos ng laro, file sa memory card o USB lang ang maikakarga, at hindi kailanman ang RIPPS2 mismo'
  an issue is the best way to get RIPPS2 updated.: ang issue ang pinakamahusay na paraan para ma-update ang RIPPS2.
  your Ogg and MP3 music, as RIPPS2 plays it: ang iyong Ogg at MP3 na musika, gaya ng pagpapatugtog ng RIPPS2
  Pop In and Name: Pop in at pangalan
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : Nagsisimula ang %s pagkatapos ng mga haligi, kaya huli ang tunog ng pag-boot. Kinokopya ng START ang boot.adp (%d KB) katabi ng RIPPS2 sa memory card (%d KB ang bakante), kung saan ito tumutunog habang umaangat ang mga haligi.
  The boot sound could not be copied to %s. It still plays from %s.: Hindi makopya ang tunog ng pag-boot sa %s. Tumutunog pa rin ito mula sa %s.
  Zoom: Zoom
  '%s could not be deleted; it stays as it was.': Hindi mabura ang %s; mananatili itong gaya ng dati.
  '%s could not be read as a .tar archive. Nothing was changed.': Hindi mabasa ang %s bilang .tar archive. Walang binago.
  '%s is deleted. %s is kept.': Nabura ang %s. Itinatabi ang %s.
  Art loads from it from now on.: Mula rito na maglo-load ang mga larawan.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : 'Burahin ang pinagsamang .tar?
  
    BUBURAHIN: %s
  
    ITATABI: %s (ang destinasyon, ngayon ay may bawat larawan ng dalawa)'
  Into %s (%s): Sa %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : 'ITATABI at ia-update: %s (%d larawan)
  
    IPAGSASAMA: %s (%d larawan)
  
    Mga larawang nasa dalawa: %d. Ang pinagsama ang mananalo. Isusulat muli ang itinatabing .tar bilang bagong file at papalitan lang kapag buo na, kaya hindi ito nagagalaw ng paghinto o punong drive. Pagsamahin na?'
  MERGE .TAR: PAGSAMAHIN ANG .TAR
  MERGE a .tar into the pack in %s: PAGSAMAHIN ang .tar sa pack sa %s
  MERGING THE ART: PINAGSASAMA ANG MGA LARAWAN
  Merge in %s (%s): Isama ang %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Isama ang bagong pack sa ibang .tar? Pipiliin mo pagkatapos ang .tar na itatabi at ia-update; doon mapupunta ang mga larawan ng bagong pack.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Napagsama: ang %s ay may %d larawan na ngayon (%d MB), %d s.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Mga larawang papasok: %d (%s). Parehong pangalan sa dalawa: %d (ang pinagsama ang mananalo).'
  'Reading the archives: %s': 'Binabasa ang mga archive: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Ihinto? Mananatiling gaya ng dati ang itinatabing .tar; aalisin ang hindi tapos na kopya.
  Stopped. %s is as it was; the unfinished copy was removed.: Huminto. Ang %s ay gaya ng dati; inalis ang hindi tapos na kopya.
  The kept .tar is only replaced once the merged copy is whole.: Papalitan lang ang itinatabing .tar kapag buo na ang pinagsamang kopya.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Hindi maisulat ang pagsasama sa drive ng %s (may puwang ba?). Gaya pa rin ito ng dati; walang ibang binago.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : Kailangan ng pagsasama ng mga %s na bakante sa drive ng %s (isinusulat muna ang bagong archive sa tabi ng luma). Magbakante ng puwang, pagkatapos ay subukan muli.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Huminto ang pagsasama sa pagitan ng dalawang pag-rename: ang itinatabing .tar ay %s at ang pinagsama ay %s. I-rename sila pabalik gamit ang Memory files.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : Naisulat ang pinagsamang .tar pero hindi nito makuha ang pangalang %s (nagre-rename ang MMCE mula firmware 1.4.0). Inalis ang bagong file; gaya ng dati ang itinatabing .tar.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : Walang ibang .tar na maisasama sa %s. Ilagay ito sa folder na ito, sa ART folder ng isang drive o sa itaas ng isang drive, pagkatapos ay subukan muli.
