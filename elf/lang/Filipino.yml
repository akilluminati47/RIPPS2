  HINT_DEFDEVICE: Ang page na binubuksan ng RiptOPL sa pag-boot.
  HINT_MMCE_MODE: 'Mga laro sa SD2PSX o MemCard PRO2. Sinisimulan ito ng Awto sa boot: pinakamabilis para sa nakasaksak na card, nasa Lahat ng laro ang mga laro nito mula sa simula. Sinisimulan ito ng Manwal kapag binuksan mo ang page nito, itinatago ito ng Naka-off.'
  HINT_MMCE_SETTINGS_BUTTON: Mga opsyon sa slot, IGR bootcard, GameID at timing para sa MMCE.
  HINT_ENABLE_USB: Nilo-load ang USB storage driver.
  HINT_ENABLE_MX4SIO: Nilo-load ang driver ng MX4SIO SD card adapter.
  HINT_ENABLE_ILINK: Nilo-load ang iLink (FireWire) storage driver.
  HINT_NETSTART: 'Sinisimulan ang network: Auto sa pag-boot, Manwal kapag binuksan mo ang page nito. Hindi ginagalaw ng Off ang network adapter.'
