  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : Ang CHEATS sa in-game menu ay nag-o-on o nag-o-off ng bawat cheat ng laro habang naglalaro. Gumagana ang pagbabago sa RESUME; ang na-off na cheat ay hihinto sa pagsulat, mananatili ang naisulat nito. Kailangang naka-on ang Cheats para sa laro.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Walang CHEATS sa in-game menu: ang mga cheat na naka-tsek bago ang simula ay tatakbo buong laro, gaya ng dati.'
