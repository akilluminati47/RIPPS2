  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Patakbuhin ang xeRAbora client sa isang PC sa parehong network, naka-sign in sa iyong RetroAchievements account. Pagkatapos, para sa larong nasa USB, MMCE, SMB o HDD: buksan ang game menu nito (TRIANGLE) at piliin ang CHECK GAME SUPPORT. Nakakakuha ng RA badge ang sinusubaybayang laro; kapag naka-on ang TELEMETRY, simulan ito at lalabas ang mga unlock sa ibabaw ng laro. Para sa disc sa tray, gamitin ang TINGNAN ANG DISC, saka LARUIN ANG DISC NA MAY MGA ACHIEVEMENT. Hindi pa sinusubaybayan ang mga larong sinimulan sa pamamagitan ng Neutrino, POPSTARTER o Ember.'
