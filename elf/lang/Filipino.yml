  RA_STILL_IDENTIFYING: Kinikilala pa ng PC ang image
  RA_TRY_AGAIN: Subukan ulit pagkalipas ng ilang segundo
  RA_NO_SOCKET: Hindi makapagbukas ang console ng network socket
  RA_NO_SOCKET2: I-restart ang console, o tingnan ang ETH device sa settings
  RA_TEST_NO_SOCKET2: Tingnan ang cable at ETH sa settings; kung gumagana ang network, i-reboot ang console
  RA_PC_NO_ANSWER: Hindi sumagot ang PC client
  RA_PC_NO_ANSWER2: Tingnan kung tumatakbo ang xeRAbora, o subukan ang PC link test
  RA_SUPPORTED: Suportado ng RetroAchievements
  RA_START_TO_TRACK: Simulan ang laro para masubaybayan ang mga achievement
  RA_ACHIEVEMENTS: '%d achievement'
  RA_ACHIEVEMENTS_FULL: '%d achievement: %d na-unlock, %d hindi suportado'
  RA_HASH_FAILED: Hindi ma-hash ang image
  RA_HASH_FAILED2: Tingnan ang RA/hashes.txt katabi ng mga laro para sa dahilan
  RA_NET_BUSY: Ginagamit ng isang UDP transport ang network
  RA_NET_BUSY2: 'Kailangan ng RA ang SMB stack: palitan ang protocol, o buuin ang .wl sa PC'
  RA_NET_BUSY_HASH: 'Nasa RA/hashes.txt ang hash: kayang buuin ng xeRAbora ang .wl mula dito'
  RA_NO_IP: Walang IP address ang console
  RA_NO_IP2: Tingnan ang DHCP o ang static address sa Network settings
  RA_TEST_NO_ANSWER: Walang PC client na sumagot sa loob ng 3 segundo
  RA_TEST_NO_ANSWER2: Console%s. Tingnan kung tumatakbo ang xeRAbora at bukas ang UDP 18194
  RA_TEST_FOUND: Nahanap ang PC client%s%s %s
  RA_TEST_FOUND2: Sumagot sa loob ng %u ms, console%s
  RA_NA_NEUTRINO: 'Kailangan ng RA tracking ang <OPL> core: hindi kailanman naglo-load ng ee_core ang paglulunsad sa Neutrino'
  RA_NA_UDPFS: 'Hindi available ang RA tracking sa UDPFS: sa Neutrino nilulunsad ang mga laro'
  RA_NA_PS1: Hindi available ang RA tracking para sa mga PS1 na laro
  RA_NA_HDD: Hindi available ang impormasyon ng APA na laro o ang home ng HDD settings
  RA_NA_HDD2: Magtakda ng tamang home ng HDD settings at mag-refresh bago tingnan ang suporta
  RA_TELEMETRY: RetroAchievements telemetry
  RA_BADGES: Mga RetroAchievements badge
  HTTP_GAMES: Mga laro sa HTTP
  HTTP_SERVER: HTTP server
  HTTP_PORT: HTTP port
  HTTP_BASE_PATH: HTTP base path
  HTTP_TEST: I-test ang HTTP server
  HTTP_TEST_OK: 'OK ang server: nakalista ang mga laro'
  HTTP_TEST_EMPTY: 'Walang laman ang catalog: tama ito, pero wala itong napapatunayan tungkol sa byte range'
  HTTP_TEST_NO_ISO: Walang suportadong image sa catalog na mapag-te-test-an ng byte range
  HTTP_ERR_CONNECT: Hindi maabot ang HTTP server
  HTTP_ERR_CATALOG: Nawawala, hindi mabasa, o masyadong malaki ang games.csv
  HTTP_ERR_RANGE: Hindi ibinalik ng server ang eksaktong mga byte na hiningi
  HTTP_LAUNCH_UNAVAILABLE: 'Hindi pa ginagawa ang paglulunsad sa HTTP: mabu-browse lang ang catalog'
  HTTP_ERR_COMPRESSED: Hindi pa suportado sa HTTP ang mga compressed image (.zso)
  HTTP_NO_VMC: 'Hindi available sa HTTP ang mga virtual memory card: gumamit ng tunay na card'
  HTTP_TAB_HINT: Binabasa ng HTTP ang games.csv mula sa iyong server. Itakda ang address, port at base path sa Network settings, saka gamitin ang Test.
  RA_DISC_CHECK: 'RA: tingnan ang suporta sa disc'
  RA_DISC_LAUNCH: 'RA: ilunsad ang disc'
  RA_DISC_CHECKING: Sinusuri ang disc para sa RetroAchievements
  RA_DISC_HASH_FAILED: 'Hindi ma-hash ang disc: tingnan ang RA/hashes.txt sa settings folder'
  RA_DISC_HOME_ERROR: Hindi magagamit ang settings path para sa mga watch list ng disc
  RA_DISC_ENABLE: I-enable muna ang RetroAchievements telemetry sa Network settings
  RA_DISC_CHECK_FIRST: 'Walang watch list para sa disc na ito: gamitin muna ang RA check disc support'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d: May nahanap na HDD, pero hindi mabasa ang APA partition table nito. Huwag itong i-format: baka maibabalik pa ang iyong mga laro.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: Hindi na-mount ang isang drive dahil hindi 512 byte ang mga sector nito (hal. drive na 4K ang sector). Mga 512-byte na sector lang ang nababasa ng OPL.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Sariling APA partition ang title na ito, at hindi kailanman binabago ng OPL ang partition table. Palitan ang pangalan nito sa PC.
  POPS_SETTINGS_UNREADABLE: 'Hindi mabasa ang settings ng POPSTARTER: abala o hindi mabasa ang memory card. Subukan ulit kapag tapos na ang pag-load.'
  GLOBAL_PS_EMULATION_SETTINGS: Global na setting ng PS emulation
  RA_NO_LINK_UNTRACKED: 'Hindi available ang network: ilulunsad nang walang RetroAchievements ngayon.'
  IGR_USB_DRIVERS_PROMPT: Nasa USB ang IGR Path, pero walang USBD.IRX at USBHDFSD.IRX ang %s, na kailangan ng console para maabot ang USB pagkatapos ng In-Game Reset. Kung wala ang mga ito, babagsak ang IGR sa PS2 browser. Kopyahin ang mga driver ng RiptOPL doon ngayon? Nilo-load din ng FMCB, OpenTuna at ibang exploit ang mga file na ito at maaaring iba ang kilos nila. Hindi kailanman pinapalitan ang mga umiiral na file. FAT32 USB lang.
  IGR_USB_DRIVERS_FAILED: Hindi makopya ang mga USB driver sa %s (puno o hindi masulatan ang card). Babagsak ang IGR sa PS2 browser.
  OFFICIAL_CFG_NOTIFICATION: Na-load ang opisyal na settings ng OPL mula sa %s
  CFM_VMODE_HOLD_KEEP: Pindutin nang matagal para panatilihin
  BDM_PS2_FOLDERS_UNREADABLE: Hindi mabuksan ang CD o DVD folder sa %s (error %d), kaya walang PS2 na larong nakalista sa device na iyon. Pindutin ang SELECT sa page nito para subukan ulit.
  NEUTRINO_BD_NO_DEVICE_NUMBER: Naka-set sa bd ang Neutrino Filesystem, pero hindi kailanman iniulat ng device na ito ang device number nito, kaya hindi maituturo ang Neutrino dito. Itakda ang Neutrino Filesystem ng larong ito sa Auto o exfat.
  CFM_VMODE_REVERT_IN: Babalik sa loob ng %d s
  EMBER_DITHER: Ember dithering
  HINT_EMBER_DITHER: Ember dithering (On o Off), isinusulat sa EMBER/settings.txt ng inilunsad na device. Mas nangingibabaw ang value ng bawat laro.
  EMBER_SHADING: Ember shading
  HINT_EMBER_SHADING: 'Lalim ng kulay ng Ember: 15-bit, o 24-bit (eksperimental). Isinusulat sa EMBER/settings.txt ng inilunsad na device. Mas nangingibabaw ang value ng bawat laro.'
  EMBER_CONTROLLER: Ember controller
  HINT_EMBER_CONTROLLER: 'Controller mode ng Ember: Auto, Analog o D2A. Karaniwang pinakamainam na itakda sa bawat laro (Triangle > Ember Game Settings), na nangingibabaw dito.'
  EMBER_480P_CONFIRM: Walang larawan ang Ember 480p sa composite. Gamitin ang 480p?
  EMBER_SHADING_24: 24-bit (eksperimental)
  EMBER_GAME_SETTINGS: Ember game settings
  HINT_EMBER_GAME_SETTING: Para sa larong ito lang. Pindutin ang OK para isulat ang EMBER/games/<name>/settings.txt bago ilunsad. Pinapanatili ng hindi ginalaw na Default ang umiiral na value sa file; inaalis ng pagbabalik sa Default ang override nito.
  EMBER_TIMING: Ember timing
  HINT_EMBER_TIMING: 'Video timing ng Ember: sinusundan ng Auto ang region ng disc, pinipilit ng NTSC ang 60 Hz, pinipilit ng PAL ang 50 Hz. Isinusulat sa EMBER/settings.txt ng inilunsad na device.'
  EMBER_GLOBAL_WARNING: Para sa bawat PS1 na laro ang mga Ember setting na ito, at may mga larong nagka-crash dahil dito. Para baguhin ang isang laro lang, gamitin ang Triangle > Ember Game Settings sa larong iyon.
  RIPPS2_RANDOM: Random
  RIPPS2_ALL: Lahat
  RIPPS2_RANDOM_GAME: Random na laro
  HINT_RIPPS2_RANDOM_GAME: Kapag pinindot nang sabay ang L2 at R2, tatalon sa isang random na laro. Sa pag-boot, bawat listahan ay bubukas din sa random na laro.
  RIPPS2_ALL_GAMES: Lahat ng laro
  RIPPS2_SET_METADATA: Itakda ang metadata
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 'Sinisimulan ang RIPPS2 sa pag-on sa pamamagitan ng boot loader mo: agad itong sinisimulan ng PS2BBL at FMCB, inilalagay ito ng OSDMenu sa una sa menu nito, at bumabalik ang EXIT ng laro sa parehong daan. Ibinabalik ng Off ang dati. Wala pa? Nag-i-install ng BIBLE ang Boot Loader.'
  HINT_COLORS_TEXT: Ang kulay ng text ng listahan ng laro. May sariling kulay ang mga theme; binabago nito iyon para sa mga built-in na theme.
  HINT_COLORS_SELECTED: Ang kulay ng napiling laro at ng napiling row sa mga settings page.
  HINT_COLORS_DIALOG: Ang kulay ng mga settings page at mga message box.
  HINT_COLORS_TITLE: Ang kulay ng pangalan ng laro sa info page nito.
  HINT_COLORS_BACKGROUND: Ang kulay sa likod ng lahat kapag walang art o tore na iginuguhit.
  HINT_COLORS_PLASMA: Ang kulay na hinahaluan ng lumang OPL plasma background (ang <OPL> theme).
  HINT_COLORS_RESET: Ibinabalik ang anim na kulay sa itaas sa sariling kulay ng theme.
  HINT_COVERFLOW_COUNT: Ilang cover ang ipinapakita ng RIPFLOW sa bawat gilid ng napili.
  HINT_COVERFLOW_SCALE: Gaano kalaki iginuguhit ng RIPFLOW ang napiling cover kumpara sa iba.
  HINT_COVERFLOW_ANIM: Gaano kabilis dumudulas ang mga cover habang gumagalaw ka sa flow.
  HINT_NARGS_QB: 'Quick Boot: nilalaktawan ang sariling start-up screen ng Neutrino. Kapag naka-on dito, ipinapadala ito para sa bawat laro; kapag naka-off, ipinapadala pa rin ito ng RIPPS2 para sa USB, iLink at network na laro, kung saan ito kailangan.'
  HINT_NARGS_DBC: 'Debug Colors: pinupuno ng Neutrino ang screen ng kulay sa bawat hakbang ng pag-load, kaya ipinapakita ng litrato kung saan humihinto ang laro.'
  HINT_NARGS_LOGO: Ipinapakita ang PS2 logo bago ang laro (pangalawang IOP reboot, na kailangan ng ilang iLink drive). Kapag naka-off dito, sinusundan ng RIPPS2 ang Game Launching > PS2 Logo, at hindi ito kailanman ipinapadala para sa MMCE o network na laro.
  HINT_NARGS_CWD: 'Ang folder na nakikita ng laro bilang sarili nito. Blangko: default ng Neutrino.'
  HINT_NARGS_CFG: 'Sarili mong Neutrino config file (-cfg). Blangko: ang sa Neutrino.'
  HINT_NARGS_ELF: 'Sinisimulan ang ELF na ito sa halip na ang boot file na pinangalanan ng disc. Blangko: ang sa laro mismo.'
  HINT_NARGS_ATA0: HDD image na mina-mount ng Neutrino bilang internal HDD ng console, para sa mga larong gumagamit ng HDD (-ata0).
  HINT_NARGS_ATA0ID: Ang ID file na kasama ng HDD image na iyon (-ata0id).
  HINT_NARGS_ATA1: Pangalawang HDD image (-ata1).
  RIPPS2_LAST_USED: Huling ginamit
  RIPPS2_PAGE_BUTTONS: Mga button ng page
  HINT_RIPPS2_PAGE_BUTTONS: 'Aling shoulder button ang naglilipat ng page ng listahan ng laro. L2 / R2: sila ang naglilipat ng page at ang L1 / R1 ang nagpapalit ng category. L1 / R1: sila ang naglilipat ng page at ang L2 / R2 ang nagpapalit ng category. Theme: ang theme ang magpapasya; kung wala, sa itaas pupunta ang L2 at sa dulo ang R2. Laging pumipili ng random na laro ang L2 + R2 nang sabay.'
  RIPPS2_IGR_MENU: Menu sa laro
  HINT_RIPPS2_IGR_MENU: 'Naka-on: pino-pause ng L1+L2+R1+R2+SELECT+START ang laro: ituloy, lumabas, kumuha ng screenshot, tingnan ang achievements, o patayin. Naka-off: agad na lumalabas sa laro ang combo, gaya ng dati.'
  RIPPS2_BOOT_LOADER: Boot Loader
  HINT_RIPPS2_BOOT_LOADER: Ipinapakita kung ano ang sinisimulan ng bawat memory card sa pag-on, at nag-i-install ng BIBLE (PS2BBL na naka-set para sa RIPPS2). Itinatabi ang mga lumang boot file ng card.
  RIPPS2_MANAGE: Pamahalaan
  RIPPS2_ACHIEVEMENTS: Mga achievement
  RIPPS2_NBD_SERVER: NBD server
  HINT_RIPPS2_NBD_SERVER: Ibinabahagi ang hard drive sa isang PC sa network. Nananatili ang status screen habang tumatakbo ito.
  RIPPS2_START: Simulan
  RIPPS2_COVER_ART: Mga cover
  HINT_RIPPS2_COVER_ART: Nagda-download ng cover para sa bawat PS2 na laro sa mga sinimulan mong listahan na wala pa nito, papunta sa ART folder ng drive na iyon, mula sa ps2-covers ni xlenore sa GitHub. Kailangan ng network cable at internet.
  RIPPS2_DOWNLOAD: I-download
  RIPPS2_GLYPHS: Mga D-pad glyph
  HINT_RIPPS2_GLYPHS: 'Mga D-pad glyph sa tabi ng pangalan ng drive at formation. Ipinapakita sila ng Fade In kapag nagpapalit ka; ipinapakita sila ng Fade Out habang bumubukas ang page. Theme: ang theme ang magpapasya.'
  RIPPS2_COLOR_THEME: Kulay ng theme
  HINT_RIPPS2_COLOR_THEME: 'Isang kulay para sa mga tore, orb, glass, CD player at file browser, sa tatlong tab. Theme: ang theme ang magpapasya (asul ng RIPPS2 kung hindi ito nagpapasya).'
  RIPPS2_HINTS: Mga hint ng button
  HINT_RIPPS2_HINTS: 'Ang mga hint ng button sa ibaba. Itinatago sila ng Fade When Idle hanggang pumindot ka ng button. Theme: ang theme ang magpapasya.'
  RIPPS2_CATEGORY_BAR: Category/Sidebar
  HINT_RIPPS2_CATEGORY_BAR: 'LAUNCH DISC, STORAGE at MEMORY FILES: ang mga pangalan sa itaas, o ang sidebar. Pinapalabo ng Fade kapag idle ang mga pangalan, o itinatabi ang sidebar, hanggang pumindot ka ng button; bumabalik ito agad. Theme: ang theme ang magpapasya.'
  RIPPS2_SOURCE_NAME: Pangalan ng source
  RIPPS2_STATUS: Status
  RIPPS2_SOURCE: Source
  HINT_RIPPS2_SOURCE_NAME: 'Ang pangalan ng source sa ibabaw ng mga laro (LAHAT NG LARO, HDD GAMES at iba pa). Pinapalabo ito ng Fade When Idle kasama ng category bar; ipinapakita naman ito ng Pop In nang malaki sa gitna ng page, gaya ng pagpapangalan ng L3 sa listahan, sa unang listahan pagkatapos mag-boot at tuwing nagbabago ang source, saka ito naglalaho. Ginagawa ng Pop in at pangalan ang dalawa. Kayang gawing Shown ng mga theme ang Pop In. Theme: ang theme ang magpapasya.'
  RIPPS2_RECENTS: Mga Kamakailang Laro
  HINT_RIPPS2_RECENTS: 'Mga Kamakailang Laro, isang page sa sidebar ng mga huling na-launch mong laro, pinakabago muna: ilan ang itinatago, 1 hanggang 99 (tina-type ng Triangle ang numero). Ang larong nasa Manwal ang drive ay sisimulan ang drive kapag pinili mo ito. Pinapatay ng 0 ang page.'
  RIPPS2_CATEGORY_ORDER: Pagkakasunod ng category
  HINT_RIPPS2_CATEGORY_ORDER: 'Pinagpapalit ang Launch Disc at Memory files: Memory files muna at Launch Disc sa huli, sa mga pangalan ng bar at sa mga icon ng sidebar. Ginawa para sa RIPFLOW (Interface > Theme). Theme: ang theme ang magpapasya.'
  RIPPS2_MUSIC: Musika
  HINT_RIPPS2_MUSIC: Pinapatugtog ang mga bgm file sa AUDIO folder katabi ng RIPPS2 at sa AUDIO folder ng OPL sa bawat nakasimulang drive (Ogg na walang tag, o 16-bit na WAV); unang tumutugtog ang may pangalang Menu. Ang sariling musika ng theme ang tumutugtog kung mayroon.
  RIPPS2_BIOS_SOUNDS: Mga tunog ng BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Isinusulat ang sariling menu sound ng console na ito mula sa BIOS nito sa AUDIO folder bilang mga tunog ng RIPPS2 (wala pang 1 MB). Hiwalay na rip ang menu music: BIOS Music.'
  RIPPS2_RIP: I-rip
  RIPPS2_HINTS_GLYPHS: Mga hint at glyph
  HINT_RIPPS2_HINTS_GLYPHS: Ang itsura ng mga hint ng button at glyph. Nagsisimula ang bawat row sa Theme, ang pinili ng theme; anumang ibang pagpili ay sa iyo at nangingibabaw sa bawat theme.
  RIPPS2_HINT_LAYOUT: Layout ng hint
  HINT_RIPPS2_STARSIDE: 'Kung saan nakapuwesto ang star ng paboritong laro sa listahan. Kaliwa: sariling column sa simula ng bawat row. Kanan: pagkatapos ng pamagat. Nakatago (ang simula): walang star at walang column, buo ang mga pamagat. Theme: kung ano ang sabi ng theme. Ginagawang paborito ng R3 ang laro kahit alin; pindutin nang 4 na segundo ang R3 sa listahan para itago ang mga star o ibalik ang mga ito (ginagawa rin nitong paborito ang laro sa ilalim ng cursor).'
  HINT_RIPPS2_HINT_LAYOUT: 'Row: ang mga hint sa isang linya. Column: isang hint bawat linya, listahan sa gilid, simula kung saan inilalagay ng theme ang mga hint nito.'
  RIPPS2_HINT_LABELS: Mga label ng hint
  HINT_RIPPS2_HINT_LABELS: Iginuguhit lang ng Glyph lang ang mga button, para sa mga glyph na may sariling salita. Pinagsasama ng Mga badge ang glyph at pamagat ng bawat hint sa iisang badge.
  RIPPS2_HINT_MENU: Hint ng menu (START)
  RIPPS2_HINT_REFRESH: Hint ng refresh (SELECT)
  RIPPS2_HINT_STAR: Hint ng paborito (R3)
  RIPPS2_HINT_VIEW: Hint ng view (L3)
  HINT_RIPPS2_HINT_SHOW: Ipinapakita o itinatago ang hint na ito. Gumagana pa rin ang button nito alinman ang piliin.
  RIPPS2_GLYPH_SET: Glyph set
  HINT_RIPPS2_GLYPH_SET: 'Ang mga glyph ng button sa bawat page: ang sa theme, ang sa RIPPS2, Standard (madidilim na button, may kulay na simbolo) o Puti (buong puti).'
  RIPPS2_HINT_ORDER: Pagkakasunod ng hint
  HINT_RIPPS2_HINT_ORDER: Inaayos ang mga hint. Pinapanatili ng Theme ang pagkakasunod ng theme; ang Ayon sa iyo ay ang itinakda dito.
  RIPPS2_HINT_ORDER_FOLLOW: Pagkakasunod
  RIPPS2_GRID_LAYOUT: Grid layout
  HINT_RIPPS2_GRID_LAYOUT: Ilang cover ang kasya sa isang Grid page, na may spacing ng RIPPS2. Pinapanatili ng Theme ang sariling layout ng theme.
  RIPPS2_LAUNCH_DISC: Disc sa paglulunsad
  HINT_RIPPS2_LAUNCH_DISC: Pumapasok ang disc ng laro habang inilulunsad ito. Tumitigil at naglalaho ang Pop In; umiikot nang pabilis nang pabilis ang Ikot hanggang magsimula ang laro; tumitigil ang Zoom, saka lumalaki para malinaw na mabasa at nananatili.
  RIPPS2_TRANSITION: Transition ng page
  HINT_RIPPS2_TRANSITION: 'Kung paano pumapasok ang bagong page kapag lumipat ka sa ibang category: mula sa kulay ng background ng theme, o mula sa flash. Pinapanatili ng Theme ang pinili ng theme.'
  RIPPS2_CATEGORY_LAYOUT: Layout ng category
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Kung nasaan ang tatlong category: ang mga pangalan nila sa itaas, o mga icon pababa sa sidebar, bawat isa may drawer ng mga page nito (dadalhin ka roon ng Kaliwa sa listahan), o Menu: walang bar, nasa START menu ang mga category gaya ng sa theme na ginawa para sa OPL. Pinapanatili ng Theme ang sa theme.'
  RIPPS2_CACHE: Cache
  HINT_RIPPS2_CACHE: 'Kung paano itinatabi ang listahan ng laro ng bawat source para agad mabuksan ang page nito: Fast Cache, ang listahan ng internal HDD at ang Automatic Refresh.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'Itinatago ng bawat source ang huling listahan ng laro nito (RIPPS2.LST sa tabi ng CD at DVD folder nito) at ipinapakita ito sa sandaling sumagot ang source. Ang Trust Cache ang nagpapasya kung babasahin ulit ang source pagkatapos. Naka-off: binabasa muna ang bawat listahan mula sa source nito, gaya ng dati.'
  HINT_RIPPS2_VIGNETTE: Pinapadilim ang gilid ng bawat cover maliban sa napili, para mangibabaw ang napili. Kalahati ng Buo ang Mahina.
  RIPPS2_GRID_WIDE: Widescreen grid layout
  HINT_RIPPS2_GRID_WIDE: Ang Grid page sa 16:9 na larawan lang (Widescreen, 720p, 1080i), kung saan mas makitid ang mga cover at mas marami ang kasya. Ginagamit ng Theme ang layout ng theme; sinusundan ng Kapareho ang Grid layout.
  RIPPS2_BGBLUR: Blur ng background
  HINT_RIPPS2_BGBLUR: Gaano kalakas pinapalabo ng frosted glass ang background art ng laro. Ginagamit ng Theme ang sariling value ng theme (Mahina sa RIPGRID at Adapt).
  HINT_RIPPS2_HINT_SLOT: Ang hint sa puwestong ito. Lilipat ang dating hint dito sa dating puwesto ng piniling hint.
  PS1_SAVE_GUIDANCE: Nakadepende sa Ember o POPSTARTER ang mga PS1 save; hindi naaangkop ang mga PS2 VMC setting.
  NEUTRINO_SHOW_ARGS: Ipakita ang mga launch argument
  HINT_NEUTRINO_SHOW_ARGS: Bago ang bawat paglulunsad sa Neutrino, ipinapakita ang bawat argument na matatanggap ng Neutrino at nagtatanong kung magpapatuloy. Ibinabalik ka ng Back sa menu nang hindi naglulunsad.
  NEUTRINO_ARGS_CONFIRM: Magsisimula ang Neutrino gamit ang mga argument na ito. Ilunsad?
  HINT_NARGS_EXTRA: Ibang Neutrino flag, hinihiwalay ng espasyo, na ipinapadala pagkatapos ng lahat ng nasa itaas. Laging idinadagdag ng RIPPS2 ang -bsd at -dvd para sa drive at ISO ng laro, -mc0 at -mc1 para sa mga VMC nito, -gsm para sa video mode nito, at ang sariling compatibility mode ng laro. Ang flag na may sariling row sa itaas (gaya ng -logo) ay lilipat sa row na iyon pag-save, at ipinapadala pa rin.
  HINT_RIPPS2_THEME: Ang itsura ng bawat page. Sa listahan ng laro, pindutin nang matagal ang SELECT nang 4.2 segundo para lumipat sa susunod na theme; nire-refresh pa rin ng mabilis na pindot ng SELECT ang listahan.
  GAME_TYPE_LABELS: Ipakita ang mga label na [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Hindi ma-save ang cheat list sa Neutrino folder, kaya hindi ito magagamit ng Neutrino. Ilunsad nang walang cheat?
  AUTO_CREATE_VMC: Gumawa ng VMC sa unang paglulunsad
  HINT_AUTO_CREATE_VMC: "Ang pag-launch ng PS2 na laro na walang VMC sa slot 0 ay gagawa ng 8 MB na card sa device ng laro, na ipapangalan ayon sa mungkahi ng VMC screen (kahati ng bawat disc ng laro), at itatalaga ito. Sa Neutrino, hindi sa APA HDD (gumagana ang exFAT HDD)."
  AUTO_VMC_CREATING: Ginagawa ang VMC ng larong ito...
  AUTO_VMC_FAILED: Hindi magawa ang VMC ng larong ito. Magsisimula ang laro nang wala nito.
  RIPPS2_BIOS_MUSIC: BIOS Music
  HINT_RIPPS2_BIOS_MUSIC: 'Isinusulat ang menu music ng console na ito (ang ambient piece ng browser nito, mga 15 MB bilang WAV) sa AUDIO folder na pipiliin mo: katabi ng RIPPS2, o ang sa OPL sa isang nakasimulang drive. Masyadong malaki para sa memory card. Unang ipinapakita ang laki nito.'
  SAVE_ICONS: Mga 3D save icon
  HINT_SAVE_ICONS: Ipinapakita ang umiikot na save icon ng napiling laro, kung saan may puwesto para dito ang theme. Binabasa muna ang sariling VMC ng laro, saka ang mga memory card.
  NETBOOT_RESTART_NOW: Magbabago ang network protocol pagkatapos ng restart. I-save ang settings at i-restart ang OPL ngayon?
