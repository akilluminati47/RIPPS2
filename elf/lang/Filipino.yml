  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : Hindi masisimulan ng PS2BBL ang RIPPS2 mula sa kinaroroonan nito ngayon (naaabot nito ang mga memory card, USB drive at MX4SIO), at hindi kinokopya ng RIPPS2 ang sarili. Ilagay ang RIPPS2.ELF sa memory card o USB drive at simulan ito mula roon, o gamitin ang PS2BBL Extended, na nakababasa ng MMCE at ng HDD.
  RESTORE SLOT %d'S OLD BOOT LOADER: IBALIK ANG LUMANG BOOT LOADER NG SLOT %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: Naka-set up ang BIBLE sa memory card sa slot %d (mc%d:/%s/%s), naka-on ang BOOT LOCK: sa pag-on, agad nitong sinisimulan ang RIPPS2 mula sa %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: Sine-set up ang BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: Sine-set up ang BIBLE
  
    Tumatakbo ang RIPPS2 mula sa %s, na hindi mabasa ng PS2BBL (nagbabasa ito ng memory card, USB at MX4SIO), at hindi kinokopya ng RIPPS2 ang sarili. Nababasa ito ng PS2BBL Extended config sa card na ito (%s): pinapa-on ng START ang BOOT LOCK, para simulan nito ang RIPPS2 mula sa %s sa pag-on. Walang iba pang nagbabago sa card.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: Sine-set up ang BIBLE
  
    Tumatakbo ang RIPPS2 mula sa %s, na hindi mabasa ng PS2BBL: nagsisimula ito ng mga program mula sa memory card, USB drive o MX4SIO, at hindi kinokopya ng RIPPS2 ang sarili. Ilagay ang RIPPS2.ELF sa isa sa mga iyon (ang APPS folder ng memory card, o USB drive), simulan ito mula roon, saka i-set up muli ang BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: Sine-set up ang BIBLE
  
    Ang memory card sa slot %d: inilalagay sa gilid ang BIBLE (mc%d:/%s), at bumabalik sa puwesto nito ang pinalitan nito (mc%d:/%s). Walang binubura. Nananatili ang PS2BBL config (mapapatay ng BOOT LOCK ang lock).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: Sine-set up ang BIBLE (itinatali ang PS2BBL sa memory card)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: Sine-set up ang BIBLE (ibinabalik ang dati)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: Sine-set up ang BIBLE (nire-restart ang I/O processor)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: Sine-set up ang BIBLE (isinusulat sa memory card)'
