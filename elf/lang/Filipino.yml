# RIPPS2 in Filipino. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Filipino
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE: I-SET UP, I-UPDATE O IBALIK"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "I-UPDATE ANG BIBLE: MAY MAS LUMA SA SLOT %d"
  "Background": "Background"
  "Sky": "Langit"
  "Black": "Itim"
  "Splash": "Splash"
  "Logo": "Logo"
  "Logo and Names": "Logo at mga Pangalan"
  "Button Glyphs": "Mga Glyph ng Button"
  "Face Buttons": "Mga Action Button"
  "All Sixteen": "Lahat ng Labing-anim"
  "Info Line": "Linya ng Info"
  "Power-on Wait": "Paghintay sa Pag-on"
  "%s, path %d": "%s, path %d"
  "A BIBLE COMMAND": "ISANG UTOS NG BIBLE"
  "ARGUMENTS": "MGA ARGUMENTO"
  "Argument %d": "Argumento %d"
  "Arguments: %s": "Mga argumento: %s"
  "Auto (no button held)": "Awto (walang pinipindot na button)"
  "BIBLE hands these to the program, in this order.": "Ibinibigay ito ng BIBLE sa program, ayon sa ayos na ito."
  "BIBLE has no way to reach that drive. Choose a program on another one, or type the path.": "Hindi maabot ng BIBLE ang drive na iyon. Pumili ng program sa iba, o i-type ang path."
  "BIBLE keeps this key from PS2BBL, but nothing in this build acts on it, so it changes nothing yet.": "Pinananatili ng BIBLE ang key na ito mula sa PS2BBL, pero walang gumagamit nito sa build na ito, kaya wala pa itong binabago."
  "BIBLE needs at least one path in its settings, or it starts in its rescue mode, so this one stays.": "Kailangan ng BIBLE ng kahit isang path sa settings nito, kung hindi magsisimula ito sa rescue mode, kaya mananatili ito."
  "BIBLE's Settings": "Settings ng BIBLE"
  "BIBLE's credits": "Mga credit ng BIBLE"
  "BOOT LOCK holds this line. Turn BOOT LOCK off to change it.": "Hawak ng BOOT LOCK ang linyang ito. I-off ang BOOT LOCK para mapalitan ito."
  "Binds the BIBLE RIPPS2 carries to a memory card, writes it over the one there, or puts back what it replaced.": "Ibinibigkis ang BIBLE na dala ng RIPPS2 sa memory card, isinusulat ito sa ibabaw ng naroon, o ibinabalik ang pinalitan nito."
  "Boot Sound": "Boot Sound"
  "CHOOSE A PROGRAM": "PUMILI NG PROGRAM"
  "CHOOSE AN ELF": "PUMILI NG ELF"
  "Choose a program from your drives, type a path, or pick one of BIBLE's commands. BIBLE tries the paths in order and starts the first it finds.": "Pumili ng program mula sa mga drive mo, mag-type ng path, o pumili ng utos ng BIBLE. Sinusubukan ng BIBLE ang mga path ayon sa ayos at sinisimulan ang unang makita."
  "Follow Color Theme": "Sundin ang Color Theme"
  "How long BIBLE waits for a button before the Auto path. At 0 ms a button held from power on still works. A boot sound beside BIBLE is read first: about 2 s at 0 ms.": "Gaano katagal maghihintay ang BIBLE sa button bago ang Awto na path. Sa 0 ms, gumagana pa rin ang button na hawak mula pag-on. Unang binabasa ang boot sound sa tabi ng BIBLE: mga 2 s sa 0 ms."
  "Launch Keys": "Launch Keys"
  "Launch Keys: %s": "Launch Keys: %s"
  "On shows a disc's game ID on screen as it starts, for RetroGEM video mods.": "Ipinapakita ng Naka-on ang game ID ng disc sa screen sa pagsisimula, para sa RetroGEM video mods."
  "On shows a program's game ID on screen as it starts, for RetroGEM video mods. It is up to 11 characters from the file name.": "Ipinapakita ng Naka-on ang game ID ng program sa screen sa pagsisimula, para sa RetroGEM video mods. Hanggang 11 character mula sa pangalan ng file."
  "On stops the disc at a launch and waits for the drive to answer. Off skips that wait, about 3 s in the lab, and a disc in the tray keeps spinning.": "Inihihinto ng Naka-on ang disc sa paglunsad at hinihintay ang sagot ng drive. Nilalaktawan ito ng Naka-off, mga 3 s sa lab, at patuloy na iikot ang disc sa tray."
  "Opens the file itself in the text editor, comments and all. Every change here keeps the other lines as they are.": "Binubuksan ang mismong file sa text editor, kasama ang mga komento. Pinananatili ng bawat pagbabago rito ang ibang linya."
  "Path %d": "Path %d"
  "Shows the countdown, the clock and the console's details on the splash.": "Ipinapakita ang countdown, orasan at detalye ng console sa splash."
  "Sky Color": "Kulay ng Langit"
  "TYPE A PATH": "MAG-TYPE NG PATH"
  "The button pictures under the logo: none, the four face buttons, or all sixteen.": "Mga larawan ng button sa ilalim ng logo: wala, ang apat na face button, o lahat ng labing-anim."
  "The console's browser": "Browser ng console"
  "The disc in the tray": "Ang disc sa tray"
  "The disc, without the PS2 logo": "Ang disc, walang logo ng PS2"
  "The name BIBLE's splash shows for this button.": "Ang pangalang ipinapakita ng splash ng BIBLE para sa button na ito."
  "The same setting as in Audio. On (fast) keeps a copy on the memory card, so the sound starts with the first frame. Off is the fastest boot.": "Parehong setting sa Audio. Nagtatago ng kopya ang On (mabilis) sa memory card, kaya nagsisimula ang tunog sa unang frame. Naka-off ang pinakamabilis na boot."
  "The shape of BIBLE's splash. Auto follows RIPPS2's Widescreen when its settings are on a memory card.": "Ang hugis ng splash ng BIBLE. Sinusundan ng Awto ang Widescreen ng RIPPS2 kapag nasa memory card ang settings nito."
  "The signal BIBLE starts in. Auto uses RIPPS2's Video Mode when its settings are on a memory card, and the console's own mode when they are not.": "Ang signal na sinisimulan ng BIBLE. Ginagamit ng Awto ang Video Mode ng RIPPS2 kapag nasa memory card ang settings nito, kung hindi ang sariling mode ng console."
  "The sky on BIBLE's splash. Follow Color Theme uses the sky RIPPS2 saves with its settings. A color named here stays, whatever the theme.": "Ang langit sa splash ng BIBLE. Ginagamit ng Sundin ang Color Theme ang langit na sine-save ng RIPPS2. Mananatili ang kulay na pinili rito, anuman ang tema."
  "This BIBLE (%s build) does not read this drive, so it moves on to the next path.": "Hindi binabasa ng BIBLE na ito (build na %s) ang drive na ito, kaya lilipat ito sa susunod na path."
  "What BIBLE shows while it waits for a button: nothing, its logo, or its logo with the name of what each button starts.": "Ang ipinapakita ng BIBLE habang naghihintay ng button: wala, ang logo, o ang logo kasama ang pangalan ng sinisimulan ng bawat button."
  "What BIBLE starts when no button is held at power on.": "Ang sinisimulan ng BIBLE kapag walang button na hawak sa pag-on."
  "What BIBLE starts when this button is held at power on. L2 + R2 held at power on shows BIBLE's own page of them all.": "Ang sinisimulan ng BIBLE kapag hawak ang button na ito sa pag-on. Ipinapakita ng L2 + R2 sa pag-on ang sariling pahina ng BIBLE ng lahat ng ito."
  "What each button starts at power on, each with up to ten paths chosen from your drives.": "Ang sinisimulan ng bawat button sa pag-on, bawat isa ay may hanggang sampung path na pinili mula sa mga drive mo."
  "What stands behind BIBLE's logo. Auto shows the sky when Sky Color is set or RIPPS2's settings are on a memory card, and black when they are not.": "Ang nasa likod ng logo ng BIBLE. Ipinapakita ng Awto ang langit kapag nakatakda ang Kulay ng Langit o nasa memory card ang settings ng RIPPS2, kung hindi itim."
  "When a button starts a disc and the tray is empty, On opens the tray for you.": "Kapag nagsimula ng disc ang button at walang laman ang tray, binubuksan ng Naka-on ang tray para sa iyo."
  "Eject Tray at Launch": "I-eject ang tray sa paglunsad"
  "Read Console History": "Basahin ang history ng console"
  "Game ID for Apps": "Game ID para sa mga app"
  "Game ID for Discs": "Game ID para sa mga disc"
  "File name (as it appears in your games list)": "Pangalan ng file (gaya ng nasa listahan ng laro mo)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "Ipinapakita ng listahang ito ang mga laro mula sa ibang drive. Palitan ang pangalan ng laro sa pahina ng sarili nitong drive."
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "Hindi mapapalitan ang pangalan ng larong may bituin. Alisin ang bituin (R3), palitan ang pangalan, saka lagyan ulit ng bituin."
  "This drive cannot rename its files. The details can still be set.": "Hindi mapapalitan ng drive na ito ang pangalan ng mga file nito. Maitatakda pa rin ang mga detalye."
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "Sa APA HDD, nasa partition table ang pangalan ng larong PS2, kaya hindi ito mapapalitan dito. Maitatakda pa rin ang mga detalye nito."
  "Renames the app in your list. Its ELF and its art keep their names.": "Pinapalitan ang pangalan ng app sa listahan mo. Hindi nagbabago ang pangalan ng ELF at art nito."
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "Pinapalitan ang pangalan ng laro sa drive nito. Hinahanap ng mga larong PS1 ang art at settings ayon sa pangalan, kaya pinapalitan din ito ng RIPPS2. Kailangang buuin ulit ang pack para sa art sa ART Pack."
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "Pinapalitan ang pangalan ng file ng laro sa drive nito. Hinahanap ng mga larong PS2 ang art at settings ayon sa game ID, kaya walang nawawala."
  "Stop Disc at Launch": "Ihinto ang disc sa paglunsad"
  "EDIT BIBLE'S SETTINGS FILE": "I-EDIT ANG SETTINGS FILE NG BIBLE"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "Hindi maisulat ang settings file ng BIBLE (%s). Tiyaking nakasaksak ang memory card at may espasyo, saka subukan muli."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "Hindi nakita ang settings file ng BIBLE (%s). Ang BIBLE: I-SET UP, I-UPDATE O IBALIK ay magsusulat ng isa."
  "Boot sound On (fast): %s, handed over by BIBLE": "Boot sound On (mabilis): %s, iniabot ng BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: ang fork ni akilluminati47 ng PS2BBL Extended, bawat build ay pinirmahan ni akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "ikinakabit ng IOPRP image nito ang BIBLE sa iyong card (GPL-3): ang console ang gumagawa ng crypto, walang key"
  "KELFBinder by El Isra": "KELFBinder ni El Isra"
  "source: github.com/akilluminati47/BIBLE": "source: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Sine-set up ang BIBLE. BIBLE, ang boot loader ni akilluminati47 na nakabatay sa PS2BBL ni El Isra, na sine-set up ng RIPPS2 sa karaniwang 8 MB na PS2 memory card o sa internal HDD: 0 ms na simula sa pag-on (hindi pinapayagan ng PS2BBL Extended ang 0), RIPPS2 muna mula sa kinaroroonan nito (hindi ito kinokopya kailanman), at ang button na hawak sa pag-on ay dadalhin ka pa rin sa browser (TRIANGLE), sa disc (START) at sa dati (CIRCLE). I-set up, ayusin, o ibalik ang pinalitan nito?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: Sine-set up ang BIBLE\nAng card sa slot %d ay SD2PSX o MMCE card. Kaya ng BOOT card nito na maglaman ng BIBLE kapalit ng PS2BBL na nasa kanya (inililipat muna iyon sa gilid, buo), kung ikakabit ng console ang BIBLE dito. Kung tinanggihan ang pagkabit, walang nababago sa card, at maaaring hindi na sumagot ang card hanggang patayin at buksan muli ang console. Ikinakabit ng START ang BIBLE dito."
  "BIND BIBLE": "IKABIT ANG BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(Nasa DIAG.TXT katabi ng RIPPS2 ang sagot ng card.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Para sa karaniwang 8 MB na PS2 memory card (MagicGate card, o SD2PSX o MMCE BOOT card): ang nasa slot %d. Sa pag-on, binabasa ng PS2BBL ang config ng slot 1 bago ang sa slot 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Ayaw ikabit ng console ang BIBLE sa memory card sa slot %d (nabigo ang MagicGate step nito). Walang binago sa card. Hindi kayang maglaman ng system update ang card na hindi tunay o hindi tugma sa MagicGate."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Maaaring hindi na sumagot ang SD2PSX o MMCE card matapos ang tinanggihang pagkabit: kung nawawala ngayon ang memory card o ang MMCE drive, patayin at buksan muli ang console."
  "RIP THIS CONSOLE'S AUDIO": "I-RIP ANG AUDIO NG CONSOLE NA ITO"
  "sounds or music, from its BIOS": "mga tunog o musika, mula sa BIOS nito"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Binubuksan ang Audio settings sa BIOS Sounds at BIOS Music: i-rip ang sariling mga tunog ng console na ito o ang menu music nito sa AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Boot sound On (mabilis): %s sa memory card, habang tumataas ang mga haligi"
  "Boot sound On: %s on the memory card, as the pillars rise": "Boot sound On: %s sa memory card, habang tumataas ang mga haligi"
  "Boot sound On: %s, once its drive is up": "Boot sound On: %s, kapag handa na ang drive nito"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Nagsisimula ang larong ito sa Neutrino, at walang nakita ang RIPPS2: wala sa path ng Settings, sa drive ng laro, sa mga memory card o sa alinmang nasimulang drive. Ilagay ang Neutrino ni rickgaiser (github.com/rickgaiser/neutrino) sa isang neutrino folder sa drive ng laro o sa memory card, o ituro ang Game Launching > Neutrino dito."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Kung nasaan ang Neutrino mo, ang video mode nito, at ang mga argument na natatanggap ng bawat Neutrino launch. Kunin ang Neutrino sa github.com/rickgaiser/neutrino at ilagay ito sa isang neutrino folder sa drive o memory card."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Mas luma ang Neutrino na ito kaysa 1.3, na hindi makakapagsimula ng laro mula sa APA HDD. Ituro ang Game Launching > Neutrino sa Neutrino 1.3 o mas bago."
  "with rickgaiser's Neutrino as its second game core,": "na may Neutrino ni rickgaiser bilang pangalawang game core nito,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "ang pangalawang game core, ginagamit mula sa drive o memory card mo (AFL-3.0)"
  "FILE NAME": "PANGALAN NG FILE"
  "GAME LIST": "LISTAHAN NG LARO"
  "%s in %s": "%s sa %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Naka-off ang Write Operations, kaya hindi ma-save ng RIPPS2 ang mga detalye ng laro o ma-rename ito. I-on?"
  "START %s": "SIMULAN ANG %s"
  "NETWORK": "NETWORK"
  "%s did not answer. Is it connected?": "Hindi sumagot ang %s. Nakakonekta ba ito?"
