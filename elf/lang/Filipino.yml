  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- Ang PS2BBL ay itinatali ng console sa card na ito at isinusulat bilang %s/%s.
  
    - Ang config nito, mc%d:/SYS-CONF/PS2BBL.INI, ay nagsisimula ng RIPPS2 kung nasaan ito (%s) nang walang hintay (0 ms, na hindi pinapayagan ng PS2BBL Extended), naka-on ang BOOT LOCK. Hindi kinokopya ang RIPPS2 mismo.
  
    Nagre-restart ang I/O processor para dito at humihinto ang bawat pagbasa ng drive hanggang matapos; babalik ang musika at mga drive pagkatapos. Iwanang nakasaksak ang card at naka-on ang console hanggang sabihin nitong tapos na.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Maaaring protektahan ng SD2PSX o MMCE card ang sarili matapos ang tinanggihang pagsulat: kung nawawala ngayon ang memory card o ang MMCE drive, patayin at buksan muli ang console.'
