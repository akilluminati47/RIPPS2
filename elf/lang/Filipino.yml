  HINT_RIPPS2_COLORS_TEXT: Kapal ng teksto, ang kulay ng theme, ang paglipat ng kulay at bawat kulay.
  HINT_RIPPS2_TEXT_WEIGHT: 'Gaano kakapal ang sariling teksto ng RIPPS2: ang tooltips ng Settings, STATUS at About. Gaya ng dati ang Karaniwan; mas madaling basahin ang Makapal sa malambot na larawan. Pinapanatili ng sariling font ng theme ang kapal na ibinibigay ng theme.'
  HINT_RIPPS2_HDD_START: 'Ang internal HDD, APA o exFAT: binabasa ito ng RIPPS2 kahit alin ito at ipinapakita nang isang beses, bilang HDD Laro. Sinisimulan ito ng Awto (pinakamabilis kapag may drive) sa boot; hinahayaan ito ng Naka-off.'
  HINT_RIPPS2_THEME_COLOR: Ang sariling kulay ng theme. Piliin ang Sarili bilang kulay ng theme para ikaw ang pumili nito, gaya ng mga kulay ng teksto.
  HINT_RIPPS2_SWEEP: Limang kulay na dinadaanan ng theme, mabagal at maayos. Bahaghari, isang paglipat mula sa bawat kulay ng theme, o sarili mo. Pinapanatili ng Off na tahimik ang theme.
  HINT_RIPPS2_SWEEP_COLORS: Ang limang kulay ng paglipat at ang bilis nito. Baguhin ang isa sa RIPPS2 at itatabi ito bilang iyo, sa pangalang ibibigay mo.
  HINT_RIPPS2_SWEEP_NAME: Ano ang tawag sa paglipat mo sa listahan ng Paglipat ng kulay.
  HINT_RIPPS2_SWEEP_COLOR: Isa sa limang kulay na dinadaanan ng paglipat, ayon sa pagkakasunod.
  HINT_RIPPS2_SWEEP_SPEED: 'Gaano katagal ang bawat kulay bago lumitaw ang susunod. Kahit ang Masigla ay nananatiling maayos: hindi kumikislap ang mga kulay.'
  RIPPS2_HIDE_COMPRESS: Itago ang laro at compression
  HINT_RIPPS2_SELECT_HOLD: 'SELECT na pinindot nang 4.2 s sa listahan ng laro. Listahan: ang mga theme sa isang panel, pumili ng isa. Paikot: ang susunod na theme. Naka-off: wala (nagre-refresh pa rin ang isang pindot).'
  RIPPS2_RECENT_GAMES: Mga Kamakailang Laro
  RIPPS2_SET_METADATA_RENAME: Itakda ang Metadata (Palitan ang Pangalan)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Controller Muna (Experimental)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'Nagbabasa ang SD2PSX sa bus na kahati ng controller, at habang may binabasa ay hindi naririnig ang controller: naaantala o nawawala ang mga pindot habang naglo-load ang mga cover. Naka-on: dumarating ang mga cover nang paunti-unti na binabasa ang controller sa pagitan, medyo mas mabagal. Naka-off: kasingbilis ng card. Kapag nasa Awto ang mga source ng card, isang beses naglo-load ang listahan nito, sa boot.'
  HINT_RIPPS2_TRUST_CACHE: 'Nananatili kung ano ito ang listahang ipinakita mula sa cache, handang i-launch, hanggang pindutin mo ang SELECT o baguhin mismo ng RIPPS2 ang source na iyon. Naka-off: binabasa ulit ang bawat source sa background pagkalabas ng cache nito, isang hintong ramdam sa MMCE o MX4SIO card, na kahati sa bus ng controller.'
  RIPPS2_STATUS_OPEN: Pag-load at mga Drive
  HINT_RIPPS2_STATUS_OPEN: 'Binubuksan ang STATUS: kung saan binabasa ng boot ang settings at ang mga listahan ng laro, aling lugar ang pinakamabilis, saan papunta ang EXIT ng laro, at bawat drive. Ibinabalik ka rito ng CACHE SETTINGS doon.'
  RIPPS2_BADGE_SET: Badge Set
  HINT_RIPPS2_BADGE_SET: 'Ang mga badge sa info page ng laro (rating, manlalaro, ESRB, video mode, scan, aspect). RIPPS2: ang sarili nitong set, pareho sa bawat theme. Theme: ang sariling larawan ng theme, o ang sa RIPPS2 kapag hiningi ng theme.'
  RIPPS2_HINT_FADE: Fade ng Hints at Glyphs
  HINT_RIPPS2_HINT_FADE: 'Ang button hint o glyph na nagbabago ay nagfe-fade in, gaya ng mga cover, sa sandaling magbago ito; hindi ginagalaw ang mga nananatili, sa bawat page at mensahe. Naka-off: basta lumalabas lang. Theme: ang theme ang magpapasya (naka-on maliban kung hints_fade=0 ang sinasabi nito).'
  RIPPS2_SIDEBAR_STYLE: Istilo ng Sidebar
  HINT_RIPPS2_SIDEBAR_STYLE: 'Classic (Hati): ang mga icon sa madilim na bar ng sidebar na may makulay na guhit sa tabi. XL (Iisang Piraso): iisang mas malapad na bar, nasa gitna ang mga icon. Theme: ang theme ang magpapasya.'
  HINT_EXITPATH: 'Kung saan pupunta ang EXIT sa In-Game Menu. Mas mabuting walang laman: pupunta ang EXIT sa browser, na magsisimula sa iyong boot loader (FreeMcBoot, PS2BBL, OSDMenu o BIBLE) kapag may naka-install, at muli sa RIPPS2 kapag naka-on ang BOOT LOCK, gaya ng pag-on; kung wala, ang PS2 browser. Ang ELF na tina-type dito ay ginagamit lang kapag kaya itong ikarga pagkatapos ng reset (sa memory card o FAT32 USB drive) at hindi ito ang RIPPS2 mismo; ang iba ay pupunta sa browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO at ang exFAT HDD. Sinisimulan sila ng Awto sa boot: pinakamabilis para sa mga drive na nakasaksak, nasa Lahat ng laro ang mga laro nila mula sa simula. Sinisimulan sila ng Manwal kapag binuksan mo ang page nila.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Hindi magamit ng Neutrino ang VMC sa APA HDD (kaya ng exFAT, USB at MX4SIO): magsisimula ang larong ito gamit ang tunay na card sa slot na iyon.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Sa boot, ang drive lang ng RIPPS2 ang binabasa: ang settings at mga tunog katabi ng RIPPS2.ELF (sinasabi ng RIPPS2.FB doon kung saan) at bawat listahan mula sa cache nito. Naghihintay ang ibang drive: sinisimulan ng SELECT sa isang page ang mga drive nito at dinadala ang mga larawan (kapag naka-on ang Automatic Refresh, nagsisimula sila sa boot). Kinokopya ng pag-on nito ang mga tunog mo, at ang musika kung may puwang, sa AUDIO katabi ng RIPPS2.'
  RIPPS2_ART_PACK: ART Pack
  RIPPS2_ART_PACK_BUILD: Buuin o tanggalin
  HINT_RIPPS2_ART_PACK: Pinagsasama ang ART folder ng bawat sinimulang drive sa iisang art.tar sa drive na pipiliin mo (unang inaalok ang pinakamabilis). Nilo-load na ang mga cover mula sa iisang file na may iisang index, hindi kailanman sa paghahanap sa bawat laro, kaya maayos ang takbo ng mga menu at musika. Mananatili ang mga ART folder.
  RIPPS2_LIST_CFG_TEXT: Pamagat at paglalarawan sa listahan
  HINT_RIPPS2_LIST_CFG_TEXT: 'Ang pamagat at paglalarawan ng laro mula sa CFG nito sa tabi ng listahan. Theme: ayon sa theme (hindi ito ipinapakita ng sariling theme ng RIPPS2). Laging ipinapakita ng info page.'
  RIPPS2_PS1_PREFER: Mga dobleng PS1
  HINT_RIPPS2_PS1_PREFER: 'Larong PS1 na parehong POPSTARTER VCD at Ember image. Pareho: dalawang hilera. Ember: ang Ember lang. POPSTARTER: ang VCD lang. Ang parehong pamagat, maliban sa disc ID sa unahan, ay iisang laro.'
  RIPPS2_MY_PADS: Aking mga controller
  HINT_RIPPS2_MY_PADS: 'Ang mga .pad profile sa PADS folder katabi ng RIPPS2: isang text file bawat USB pad, pinangalanan ayon sa ID nito (2563_0575.pad), at sinuri ang bawat isa. Kontrolado ng pad na may profile ang menu at naglalaro ito sa mga laro (naka-on ang Pad Emulator).'
  RIPPS2_PAD_SETUP: Mag-set Up ng USB Pad
  HINT_RIPPS2_PAD_SETUP: Isaksak ang USB pad na hindi kilala ng RIPPS2, pindutin ang bawat button na hinihingi nito, at isusulat ng RIPPS2 ang .pad nito sa PADS. Nilalaktawan ng SELECT sa PS2 pad mo ang isang button.
