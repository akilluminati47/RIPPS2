  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'I-INSTALL ANG BIBLE SA INTERNAL HDD

    - Kinokopya ang RIPPS2 sa %s.

    - Binabasa ang boot program ng HDD na nasa __mbr ngayon at itinatabi sa %s/RIPPS2 (ibinabalik ito ng IBALIK).

    - Isinusulat ang HDD build ng PS2BBL kapalit nito, at itinatakda ang console na simulan ito sa pag-on.

    - Ang config nito (%s) ay nagsisimula muna sa RIPPS2 mula sa %s%s%s, naka-on ang BOOT LOCK.

    Kailangan nito ng console na nagbu-boot mula sa HDD nito (fat PS2 na may network adapter). Huwag itong patayin hanggang sabihing tapos na.'
  INTERNAL HDD  (its boot area): INTERNAL HDD  (ang boot area nito)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'IBALIK ANG LUMANG BOOT PROGRAM NG HDD

    Ang itinabi ng BIBLE (RIPPS2/MBR-BACKUP.KELF sa HDD) ay ibabalik sa __mbr, kapalit ng BIBLE. Mananatili sa kinaroroonan nila ang RIPPS2 at ang PS2BBL config.'
