  HINT_MMCE_COMM_BUTTON: Mga opsyon sa timing para sa MMCE link. Baguhin lang kung nagfi-freeze o mabagal mag-load ang mga laro.
  HINT_MMCE_PATH_BUTTON: Kung saan sa MMCE card nakalagay ang mga game folder.
  HINT_MMCE_PREFIX: Subfolder sa MMCE card na may CD, DVD at ibang OPL folder. Ang root ng card ang gamit kapag blangko.
  HINT_GAME_TYPE_LABELS: Sinisimulan ang bawat pangalan ng laro sa [PS1] o [PS2]. Pagpapakita lang.
  HINT_MENU_VMODE: Video output para sa menu. GSM ang gamit ng mga laro. Pindutin nang matagal ang Confirm para panatilihin ang bagong mode.
  HINT_THEME: Ang itsura ng menu. Binabasa ang mga theme mula sa THM folder sa bawat device.
  HINT_COVERFLOW_BUTTON: Bilang ng cover, laki, animation at pagpapadilim para sa Coverflow theme.
  HINT_ARTWORK_BUTTON: 'Aling art ang nilo-load: mga cover, disc art, background at save icon.'
  HINT_COLORS_BUTTON: Mga kulay ng text, highlight, dialog at background.
  HINT_NOTIFICATIONS: Maikling abiso kapag nag-load ang config, theme o language file.
  HINT_AUTOSORT: Inaayos ang mga listahan ng laro mula A hanggang Z. Pinapanatili ng Off ang pagkakasunod kung paano sila nahanap.
  HINT_AUTOREFRESH: Nagdadagdag ng mga laro mula sa bagong konektang device nang walang manu-manong refresh.
  HINT_COVERART: Nilo-load ang cover art mula sa ART folder.
