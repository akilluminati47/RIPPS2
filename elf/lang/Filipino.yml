  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': 'Ang %s%s ay walang %s. Nahanap ng RIPPOPS ang PS1 emulator ng Sony sa %s: kinokopya ng START ang %s dito at sinisimulan ang laro.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'Hindi nakikita ng RIPPS2 ang %s sa %s%s. Kailangan ng POPSTARTER ang POPS_IOX.PAK kasama ang POPS.PAK, o kasama ang POPS.ELF at IOPRP252.IMG: ang PS1 emulator ng Sony, mula sa sarili mong console. Maaaring makita niya ang mga ito kung saan hindi tumitingin ang RIPPS2 (kung nagsisimula ang mga laro mo, nakikita niya). Naglulunsad ang START, at hindi na itatanong muli ang drive na ito.'
  ' (The configs found were set: %s.)': ' (Naitakda ang mga nakitang config: %s.)'
