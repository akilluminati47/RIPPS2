  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s nu are %s. RIPPOPS a găsit emulatorul PS1 Sony pe %s: START copiază %s aici și pornește jocul.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 nu vede %s în %s%s. POPSTARTER are nevoie de POPS_IOX.PAK cu POPS.PAK, sau cu POPS.ELF și IOPRP252.IMG: emulatorul PS1 Sony, de pe propria ta consolă. Le poate găsi unde RIPPS2 nu caută (dacă jocurile tale pornesc, le găsește). START pornește, iar despre această unitate nu se mai întreabă.'
  ' (The configs found were set: %s.)': ' (Configurațiile găsite au fost setate: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Salvează-i o dată setările cu propriul lui configurator, apoi pornește din nou BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s nu poate porni RIPPS2 de unde este acum (%s), iar RIPPS2 nu se copiază singur. Pune RIPPS2.ELF pe un card de memorie sau pe o unitate USB și pornește-l de acolo.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK nu a putut scrie configurația încărcătorului de pornire. Verifică dacă cardul de memorie sau unitatea nu e protejată la scriere, apoi încearcă din nou.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK nu a găsit nicio configurație de încărcător de pornire de modificat.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK este oprit. Încărcătorul tău de pornire pornește ce pornea înainte (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK este pornit. %s pornește acum RIPPS2 la pornire (%s), iar o cale IGR goală trimite EXIT-ul unui joc înapoi pe același drum. Ține apăsat unul dintre butoanele lui cât timp pornește consola ca să ajungi la altceva.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK a pus RIPPS2 primul în meniul OSDMenu (%s). OSDMenu nu pornește nimic singur: alege RIPPS2 acolo, iar EXIT-ul unui joc revine în acel meniu. Pentru o consolă care pornește RIPPS2 imediat, BIBLE pune PS2BBL pe un card de memorie (Boot Loader).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK funcționează printr-un încărcător de pornire pe un card de memorie (PS2BBL, FMCB sau OSDMenu), iar aici nu există niciunul.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Cardul de memorie din slotul %d pornește %s la pornire, iar BOOT LOCK nu a găsit nicio configurație a lui de modificat (caută %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Cardul de memorie din slotul %d pornește %s la pornire, pe care BOOT LOCK nu îl poate seta: funcționează prin PS2BBL, FMCB și OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Pe această consolă este un încărcător de pornire cu blocarea RIPPS2.
