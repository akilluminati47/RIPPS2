  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Rulează clientul xeRAbora pe un PC din aceeași rețea, autentificat în contul tău RetroAchievements. Apoi, pentru un joc de pe USB, MMCE, SMB sau HDD: deschide meniul jocului (TRIUNGHI) și alege VERIFICARE SUPORT JOC. Un joc urmărit primește insigna RA; cu TELEMETRIA pornită, pornește-l și deblocările apar peste joc. Pentru un disc din tavă, folosește VERIFICĂ DISCUL, apoi JOACĂ DISCUL CU REALIZĂRI. Jocurile pornite prin Neutrino, POPSTARTER sau Ember nu sunt încă urmărite.'
