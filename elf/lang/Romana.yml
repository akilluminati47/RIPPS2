  HINT_RIPPS2_BADGE_SET: 'Insignele de pe pagina de informații a unui joc (clasificare, jucători, ESRB, mod video, scanare, aspect). RIPPS2: propriul său set, același pe fiecare temă. Temă: imaginile temei, sau cele ale RIPPS2 când tema le cere.'
  RIPPS2_HINT_FADE: Estompare pentru indicii și glife
  HINT_RIPPS2_HINT_FADE: 'Un indiciu de buton sau o glifă care se schimbă apare estompat, ca și copertele, în clipa în care se schimbă; cele care rămân nu sunt atinse, pe fiecare pagină și mesaj. Oprit: pur și simplu apar. Temă: decide tema (pornit, dacă nu spune hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Stilul barei laterale
  HINT_RIPPS2_SIDEBAR_STYLE: 'Clasic (împărțit): pictogramele în banda întunecată a barei laterale, cu fâșia colorată alături. XL (dintr-o bucată): o singură bandă mai lată, cu pictogramele la mijloc. Temă: decide tema.'
  HINT_EXITPATH: 'Unde duce EXIT în meniul din joc. Cel mai bine gol: EXIT duce la browser, care pornește boot loaderul tău (FreeMcBoot, PS2BBL, OSDMenu sau BIBLE) când e instalat unul, și din nou RIPPS2 cu BOOT LOCK pornit, ca la pornire; fără, browserul PS2. Un ELF scris aici e folosit doar când resetarea îl poate încărca (de pe un card de memorie sau o unitate USB FAT32) și nu e RIPPS2 însuși; orice altceva duce la browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO și HDD-ul exFAT. Automat le pornește la pornire: cel mai rapid pentru unitățile conectate, cu jocurile lor în Toate jocurile de la început. Manual le pornește când le deschizi pagina.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino nu poate folosi un VMC pe HDD-ul APA (exFAT, USB și MX4SIO pot): acest joc pornește cu cardul real în acel slot.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Pornirea citește doar unitatea RIPPS2: setările și sunetele de lângă RIPPS2.ELF (RIPPS2.FB de acolo spune unde) și fiecare listă din cache-ul ei. Celelalte unități așteaptă: SELECT pe o pagină pornește unitățile ei și aduce imaginile lor (cu reîmprospătarea automată pornesc la pornire). Activarea copiază sunetele tale, și muzica dacă e loc, în AUDIO lângă RIPPS2.'
  RIPPS2_ART_PACK: Pachet ART
  RIPPS2_ART_PACK_BUILD: Construiește sau șterge
  HINT_RIPPS2_ART_PACK: Pune folderul ART al fiecărei unități pornite într-un singur art.tar pe unitatea pe care o alegi (cea mai rapidă este oferită prima). Copertele se încarcă apoi dintr-un fișier cu un index, niciodată cu o căutare pentru fiecare joc, așa că meniurile și muzica rămân fluide. Folderele ART rămân cum sunt.
  RIPPS2_LIST_CFG_TEXT: Titlu și descriere în listă
  HINT_RIPPS2_LIST_CFG_TEXT: 'Titlul și descrierea jocului din CFG-ul lui lângă listă. Temă: cum le arată tema (tema proprie RIPPS2 le omite). Pagina de informații le păstrează oricum.'
  RIPPS2_PS1_PREFER: Duplicate PS1
  HINT_RIPPS2_PS1_PREFER: 'Un joc PS1 care e și VCD pentru POPSTARTER, și imagine Ember. Ambele: două rânduri. Ember: doar cel Ember. POPSTARTER: doar VCD-ul. Același titlu, fără un ID de disc în față, e același joc.'
  RIPPS2_MY_PADS: Controlerele mele
  HINT_RIPPS2_MY_PADS: 'Profilurile .pad din folderul PADS de lângă RIPPS2: un fișier text pentru fiecare controler USB, numit după ID-ul lui (2563_0575.pad), și fiecare verificat. Un controler cu profil conduce meniul și joacă în jocuri (Pad Emulator pornit).'
  RIPPS2_PAD_SETUP: Configurează un controler USB
  HINT_RIPPS2_PAD_SETUP: Conectează un controler USB pe care RIPPS2 nu-l cunoaște, apasă fiecare buton cerut, iar RIPPS2 îi scrie .pad-ul în PADS. SELECT pe controlerul tău PS2 sare peste un buton.
