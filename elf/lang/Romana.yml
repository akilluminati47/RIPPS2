# RIPPS2 in Romana. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Romana
strings:
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: se configurează BIBLE\nCardul din slotul %d este un card SD2PSX sau MMCE. Cardul lui BOOT poate ține BIBLE în locul PS2BBL-ului pe care îl are (acela e mutat întâi deoparte, întreg), dacă consola leagă BIBLE de el. Dacă legarea e refuzată, nimic nu se schimbă pe card, iar cardul poate să nu mai răspundă până când consola e oprită și pornită. START leagă BIBLE de el."
  "BIND BIBLE": "LEAGĂ BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT de lângă RIPPS2 are răspunsul cardului.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Pentru un card de memorie PS2 obișnuit de 8 MB (un card MagicGate sau un card BOOT SD2PSX ori MMCE): cel din slotul %d. La pornire PS2BBL citește configurația slotului 1 înaintea celei a slotului 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Consola nu a vrut să lege BIBLE de cardul de memorie din slotul %d (pasul MagicGate a eșuat). Nu s-a schimbat nimic pe card. Un card care nu este original sau compatibil MagicGate nu poate ține o actualizare de sistem."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Un card SD2PSX sau MMCE poate să nu mai răspundă după o legare refuzată: dacă acum lipsește cardul de memorie sau unitatea MMCE, oprește și pornește consola."
  "RIP THIS CONSOLE'S AUDIO": "EXTRAGE AUDIO DE PE ACEASTĂ CONSOLĂ"
  "sounds or music, from its BIOS": "sunete sau muzică, din BIOS-ul ei"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Deschide Setări audio la Sunete BIOS și Muzică BIOS: extrage sunetele acestei console sau muzica meniului ei în AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Sunet de pornire Pornit (rapid): %s pe cardul de memorie, când se înalță pilonii"
  "Boot sound On: %s on the memory card, as the pillars rise": "Sunet de pornire Pornit: %s pe cardul de memorie, când se înalță pilonii"
  "Boot sound On: %s, once its drive is up": "Sunet de pornire Pornit: %s, când unitatea lui e gata"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "SLOTUL 0: %s\nSLOTUL 1: %s\n%s\nRIPPS2: se configurează BIBLE. PS2BBL de El Isra, configurat de RIPPS2 pe un card de memorie PS2 obișnuit de 8 MB sau pe HDD-ul intern: o pornire în 0 ms (PS2BBL Extended nu permite 0), întâi RIPPS2 de unde este (nu este copiat niciodată), iar un buton ținut la pornire duce în continuare la browser (TRIANGLE), la un disc (START) și la ce era înainte (CIRCLE). Îl configurezi, îl repari sau restaurezi ce a înlocuit?"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Acest joc pornește prin Neutrino, iar RIPPS2 nu a găsit niciunul: nici la calea din Setări, nici pe unitatea jocului, nici pe cardurile de memorie, nici pe vreo unitate pornită. Pune Neutrino de la rickgaiser (github.com/rickgaiser/neutrino) într-un dosar neutrino pe unitatea jocului sau pe un card de memorie, ori îndreaptă Lansarea jocurilor > Neutrino spre el."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Unde este Neutrino-ul tău, modul său video și argumentele pe care le primește fiecare lansare Neutrino. Ia Neutrino de la github.com/rickgaiser/neutrino și pune-l într-un dosar neutrino pe o unitate sau un card de memorie."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Acest Neutrino este mai vechi de 1.3, care nu poate porni jocuri de pe HDD-ul APA. Îndreaptă Lansarea jocurilor > Neutrino spre Neutrino 1.3 sau mai nou."
  "with rickgaiser's Neutrino as its second game core,": "cu Neutrino de la rickgaiser ca al doilea nucleu de joc,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "al doilea nucleu de joc, folosit de pe unitatea sau cardul tău de memorie (AFL-3.0)"
  "FILE NAME": "NUME FIȘIER"
