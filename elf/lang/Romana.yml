  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'LÂNGĂ RIPPS2: %sAUDIO%s, citit primul la pornire'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- Consola leagă PS2BBL de acest card și îl scrie ca %s/%s.
  
    - Configurația lui, mc%d:/SYS-CONF/PS2BBL.INI, pornește RIPPS2 acolo unde este (%s) fără așteptare (0 ms, ce PS2BBL Extended nu permite), BOOT LOCK activat. RIPPS2 însuși nu este copiat.
  
    Procesorul I/O repornește pentru asta și orice citire a unităților se oprește până termină; muzica și unitățile revin după. Lasă cardul introdus și consola pornită până spune că a terminat.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Un card SD2PSX sau MMCE se poate proteja după o scriere refuzată: dacă acum lipsește cardul de memorie sau unitatea MMCE, oprește și pornește consola.'
  BOOT LOCK ON: BOOT LOCK ACTIVAT
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Gata: cardul de memorie din slotul %d pornește ce pornea înainte de BIBLE. BIBLE rămâne în mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): CARD DE MEMORIE ÎN SLOTUL %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL nu poate porni RIPPS2 de unde este acum (ajunge la carduri de memorie, unități USB și MX4SIO), iar RIPPS2 nu se copiază singur. Pune RIPPS2.ELF pe un card de memorie sau o unitate USB și pornește-l de acolo, sau folosește PS2BBL Extended, care citește MMCE și HDD-ul.
  RESTORE SLOT %d'S OLD BOOT LOADER: RESTAUREAZĂ VECHIUL ÎNCĂRCĂTOR DIN SLOTUL %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE este configurat pe cardul de memorie din slotul %d (mc%d:/%s/%s), BOOT LOCK activat: la pornire pornește imediat RIPPS2 de pe %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: se configurează BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: se configurează BIBLE
  
    RIPPS2 rulează de pe %s, pe care PS2BBL nu îl poate citi (citește carduri de memorie, USB și MX4SIO), iar RIPPS2 nu se copiază singur. Configurația PS2BBL Extended de pe acest card (%s) îl citește: START activează BOOT LOCK, ca să pornească RIPPS2 de pe %s la pornire. Nimic altceva nu se schimbă pe card.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: se configurează BIBLE
  
    RIPPS2 rulează de pe %s, pe care PS2BBL nu îl poate citi: pornește programe de pe un card de memorie, o unitate USB sau MX4SIO, iar RIPPS2 nu se copiază singur. Pune RIPPS2.ELF pe una dintre ele (folderul APPS al unui card de memorie sau o unitate USB), pornește-l de acolo, apoi configurează din nou BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: se configurează BIBLE
  
    Cardul de memorie din slotul %d: BIBLE (mc%d:/%s) este dat deoparte, iar ce a înlocuit (mc%d:/%s) revine la locul lui. Nu se șterge nimic. Configurația PS2BBL rămâne cum este (BOOT LOCK poate dezactiva blocarea).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: se configurează BIBLE (legarea PS2BBL de cardul de memorie)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: se configurează BIBLE (se pune la loc ce era)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: se configurează BIBLE (repornirea procesorului I/O)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: se configurează BIBLE (scrierea pe cardul de memorie)'
  SET UP BIBLE: CONFIGUREAZĂ BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Cardul de memorie din slotul %d are %d KB liberi, iar BIBLE are nevoie de %d KB pe el. Eliberează puțin spațiu și încearcă din nou.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Cardul de memorie din slotul %d a refuzat PS2BBL, așa că RIPPS2 a lăsat cardul cum era. Verifică spațiul liber și încearcă din nou. (DIAG.TXT de lângă RIPPS2 are răspunsul cardului.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Cardul de memorie din slotul %d nu a vrut să dea deoparte BIBLE, așa că nu s-a schimbat nimic. (DIAG.TXT de lângă RIPPS2 are răspunsul cardului.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Cardul de memorie din slotul %d nu a vrut să primească înapoi %s, așa că BIBLE a rămas. (DIAG.TXT de lângă RIPPS2 are răspunsul cardului.)
