  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot este activat. Sunetele ocupă %d KB, iar cardul de memorie de pe care rulează RIPPS2 are %d KB liberi, așa că rămân în %s.
