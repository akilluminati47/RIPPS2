  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Operațiile de scriere sunt oprite, așa că RIPPS2 nu poate salva detaliile unui joc sau să-l redenumească. Le pornești?"
  "BIBLE is built on El Isra's PS2BBL, its card and HDD builds signed for RIPPS2 (GPL-3)": "BIBLE este construit pe PS2BBL-ul lui El Isra, cu versiunile pentru card și HDD semnate pentru RIPPS2 (GPL-3)"
