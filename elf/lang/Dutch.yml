  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 was bezig een schijf te lezen en kon de I/O-processor niet opnieuw starten. Er is niets gewijzigd: probeer het zo opnieuw.'
  Reading the memory cards: De geheugenkaarten lezen
  The HDD partition BIBLE uses went away. Nothing was changed.: De HDD-partitie die BIBLE gebruikt, is verdwenen. Er is niets gewijzigd.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Het oude opstartprogramma van de HDD is terug. BIBLE start niet meer vanaf de HDD.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : De console wilde BIBLE niet aan geheugenkaart %d koppelen (de MagicGate-stap is mislukt). Er is niets op de kaart gewijzigd. Een kaart die niet origineel of MagicGate-compatibel is, kan geen systeemupdate bevatten.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Het programma dat er stond, is bewaard in RIPPS2/MBR-BACKUP.KELF op de HDD: OPSTARTLADER > BEHEREN > HERSTELLEN zet het terug.'
  The security module would not start on this console. Nothing on the memory card was changed.: De beveiligingsmodule wilde niet starten op deze console. Er is niets op de geheugenkaart gewijzigd.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Er zit in geen van beide sleuven een geformatteerde PS2-geheugenkaart en er is geen interne HDD. BIBLE woont op een geheugenkaart of de HDD: plaats een kaart en probeer het opnieuw.'
  There is no kept boot program on this HDD. Nothing was changed.: Er is geen bewaard opstartprogramma op deze HDD. Er is niets gewijzigd.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
