  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Het nieuwe pakket in een ander .tar samenvoegen? Je kiest daarna het .tar dat behouden en bijgewerkt wordt; de afbeeldingen van het nieuwe pakket gaan erin.
