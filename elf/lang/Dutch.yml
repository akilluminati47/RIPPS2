  FAV_SAVED: Opgeslagen in Favoriete games
  FAV_SAVE_FAILED: Kon niet opslaan in Favoriete games
  CAD_ACHIEVEMENTS: Caduceus-prestaties
  CAD_VIEW_ACHIEVEMENTS: Prestaties bekijken
  CAD_USE_LIBRARY: Blader door deze game via Caduceus-prestaties in het hoofdmenu.
  CAD_HASH_UNSUPPORTED: Van dit formaat kan geen hash worden berekend. Blader in plaats daarvan door de accountbibliotheek.
  CAD_HEADING: PRESTATIES
  CAD_LIBRARY: RetroAchievements-accountbibliotheek
  CAD_FILTER_ALL: Alle
  CAD_EARNED: Behaald
  CAD_LOCKED: Vergrendeld
  CAD_HARDCORE: Hardcore
  CAD_PROGRESS: '%d / %d behaald  |  %s'
  CAD_ONE_GAME: '%d game in account'
  CAD_GAMES: '%d games in account'
  CAD_GAME_PROGRESS: '%d / %d prestaties  |  %d hardcore'
  CAD_POINTS: '%d ptn  |  %s'
  CAD_EMPTY_LIBRARY: Geen games met voortgang in dit account.
  CAD_EMPTY_FILTER: Geen prestaties die bij dit filter passen.
  CAD_LOADING: Prestaties laden...
  CAD_PAIR: Meld je aan bij Caduceus en koppel ART/CADUCEUS.KEY op je SMB-share.
  CAD_UNKNOWN_GAME: Deze game staat niet in de Caduceus-catalogus. Vernieuw de catalogus op de pc.
  CAD_CONNECTION_ERROR: Kan Caduceus niet bevragen. Controleer de verbinding en druk dan op Select om het opnieuw te proberen.
  CAD_BACK_REFRESH: Terug keert terug naar OPL. Select vernieuwt deze pagina.
  CAD_LIBRARY_CONTROLS: 'L1/R1: pagina   Bevestigen: openen   Select: vernieuwen'
  CAD_GAME_CONTROLS: 'L1/R1: pagina   Vierkant: filter   Select: vernieuwen'
  CAD_BACK: Terug
  CAD_UNTRACKED: Caduceus is niet klaar. Deze keer starten zonder prestaties.
  PS1_RA_USB_REQUIRED: PS1-prestaties vereisen een USB-VCD via POPStarter
  PS1_RA_REMOVE_PREVIOUS: Kan de vorige PS1-prestatiemodule niet verwijderen
  PS1_RA_PREPARE_FAILED: Kan PS1-prestaties niet voorbereiden. Bewaar of verplaats POPS/MODULE_9.IRX en controleer de schrijftoegang van het apparaat.
  PS1_RA_CLEAN_DELETE: 'Ongebruikte RA-module van RiptOPL: POPS/MODULE_9.IRX. Verwijderen voor een schone start?'
  PS1_RA_CLEAN_FAILED: Kan de ongebruikte RA-module niet verwijderen.
  PS1_RA_CLEAN_CONTINUE: Toch doorgaan? Een achtergebleven RA-module kan verouderde telemetrie uitvoeren. Nee annuleert het starten.
  FAV_REMOVED: Verwijderd uit Favoriete games
  FAV_REMOVE_FAILED: Kon niet verwijderen uit Favoriete games
  POPS_UDPFS_SETTINGS: POPS UDPFS-netwerkinstellingen
  POPS_UDPFS_DISCOVERY: Slaat op in elke POPS-map op USB. Server 0.0.0.0 gebruikt detectie.
  POPS_UDPFS_NOT_READY: POPS UDPFS heeft overeenkomende geldige IPCONFIG.DAT en UDPFSCONFIG.DAT nodig in elke POPS-map op USB. Stel ze in bij POPS-netwerkinstellingen.
  HINT_POPS_UDPFS_IP: Vast PS2-IP dat de POPS UDPFS-driver gebruikt na zijn IOP-reset.
  POPS_UDPFS_ALL_USB_FOLDERS: Alle POPS-mappen op USB
  POPS_UDPFS_INVALID_SUFFIX: ' (ongeldig)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (onvolledig)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS heeft het driverpaar .udpfs nodig, geïnstalleerd op de geheugenkaart. Zet het er handmatig op of zet BDMA Toepassen bij starten aan.
  VMC_REPLACE_REQUIRES_DELETE: De VMC-grootte wijzigen zou de opgeslagen games wissen. Maak een back-up van de bestaande VMC en gebruik Verwijderen voordat je een nieuwe grootte maakt.
  VMC_CREATE_FAILED: Kon de VMC niet maken. Controleer het apparaat, de verbinding en de schrijftoegang. Bestaande saves zijn niet vervangen.
  RA_EXPERIMENTAL_CARDS: Experimentele Caduceus-kaarten
  HINT_RA_EXPERIMENTAL_CARDS: Experimentele prestatiekaarten in PS2-games. Kunnen flikkeren of games laten vastlopen. Alleen Caduceus; Uit gebruikt de gouden puls. Werkt vanaf de volgende gamestart.
  RA_NEUTRINO_UNTRACKED: Neutrino RA is niet beschikbaar voor deze start. Controleer de RA-runtime, het hulp-IP en de opgeslagen volglijst. Starten zonder prestaties.
  UDPFS_IP_CONFLICT: Een ander apparaat in je netwerk gebruikt het IP-adres van deze PS2, dus de antwoorden van de UDPFS-server gaan daarheen. Stel een ander PS2-IP in bij Netwerkinstellingen.
  XERA_ACHIEVEMENTS: RetroAchievements-bibliotheek (xeRAbora)
  XERA_USE_LIBRARY: Blader door deze game via de RetroAchievements-bibliotheek in het hoofdmenu.
  XERA_OPEN_NETWORK: Kan xeRAbora niet bereiken. Zet OPEN TO THE NETWORK aan in de instellingen ervan, controleer het IP van de RA-hulp en de firewall van de pc.
  XERA_UNKNOWN_GAME: xeRAbora kent deze image niet. Voer eerst de RA-controle van gameondersteuning uit.
  XERA_NOT_PLAYED: Nog niet in je RetroAchievements-bibliotheek. Speel het één keer met prestaties en druk dan op Select.
  XERA_CONNECTION_ERROR: Kan de lijst niet lezen van xeRAbora. Druk op Select om het opnieuw te proberen.
  CAD_PAIR_UDPFS: Kan Caduceus niet bereiken. Koppel ART/CADUCEUS.KEY in de map die PS2-Servers deelt, en stel het IP van de RA-hulp in.
  RA_WL_NOT_SAVED: Kon de volglijst niet opslaan. Zorg dat het apparaat of de share van de game beschrijfbaar is en controleer opnieuw.
  RA_UDPFS_LOAD_FIRST: Open de UDPFS-pagina één keer zodat de netwerkmodule laadt, en probeer het opnieuw.
  CAD_UDPFS_IMG: 'De Caduceus-browser heeft SMB of UDPFS Bestanden nodig: UDPFS IMG heeft geen gedeelde map voor zijn sleutel.'
  XERA_SET_CLOCK: Nog niet in je RetroAchievements-bibliotheek. Stel de klok van de console in bij de systeeminstellingen om de volledige lijst te zien, of speel het één keer met prestaties.
  CFG_TITLES: CFG-titels in gamelijsten tonen
  HINT_CFG_TITLES: Toont de titel uit de CFG van elke game in plaats van de bestandsnaam, en sorteert erop. Leest elke CFG als een lijst vernieuwt, dus lijsten laden langzamer. Alleen weergave.
  AUTO_VMC_INVALID: Het VMC-bestand van deze game bestaat, maar is geen geldige geheugenkaart, dus het is niet gebruikt of vervangen. De game start zonder; controleer het in het VMC-menu.
  AUTO_VMC_STILL_RUNNING: De VMC van deze game wordt nog gemaakt. Start de game zo opnieuw.
  NEUTRINO_DVR_QUICKBOOT: Starten van DVR vereist de overgang naar PSX-modus. Haal -qb weg uit de algemene en per-game Neutrino-argumenten.
  NEUTRINO_DVR_FILE_MISSING: 'De Neutrino-installatie voor DVR is onvolledig. Vereist bestand ontbreekt:'
  PARENLOCK_GAME: Ouderlijk slot
  PARENLOCK_GAME_HINT: Vraag het wachtwoord van het ouderlijk slot om deze game te starten.
  PARENLOCK_GAME_NO_PASSWORD: Stel een wachtwoord voor het ouderlijk slot in, anders wordt deze game niet vergrendeld.
  HINT_ENABLE_PCCF: PC CARD CompactFlash van vroege Japanse PS2's. Alleen echte PS2-games; CF heeft exclusieve toegang tot de PC CARD nodig. Start opnieuw om die vrij te geven.
  PCCF_GAMES: PC CARD CF-games
  PCCF_UNAVAILABLE: 'CF niet beschikbaar: vereist een vroege Japanse PS2 met PC CARD, een compatibele kaart en geen actieve DEV9-, HDD- of netwerkdriver.'
  PCCF_UNSUPPORTED_GAME: CF ondersteunt nu alleen echte PS2-games. CF-VMC, PS1 laden en netwerkprestaties zijn niet beschikbaar.
  HINT_ENABLE_DVR: Experimentele detectie van DESR DVR-ISO's. Vereist dat de HDD-bron aan staat; games starten vereist een externe Neutrino met DVR-ondersteuning.
  HINT_RIPPS2_IGR_PAGE: Het menu in game, RIPSHOT en hoe foto's worden ontwikkeld.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Schermafbeeldingen vanuit het menu in game, naar ART voor je thema's of naar MEDIA.
  RIPPS2_DEVELOP_SHOTS: Foto's ontwikkelen
  HINT_RIPPS2_DEVELOP_SHOTS: Hoe de foto's die op de rol van elke game wachten PNG's worden.
  RIPPS2_SETTINGS_HOME: Instellingen opslaan op
  HINT_RIPPS2_SETTINGS_HOME: 'Waar RIPPS2 zijn instellingen bewaart: zijn eigen save op een geheugenkaart, een RIPPS2-map op een schijf (de interne HDD, USB, MX4SIO, iLink of MMCE) of een map die je typt.'
  RIPPS2_LAUNCHERS: Launchers
  RIPPS2_LOOK_NOW: Nu zoeken
  HINT_RIPPS2_LOOK_NOW: RIPPS2 zoekt op de gestarte schijven naar POPSTARTER, de POPS-bestanden, Ember, Embers BIOS en Neutrino, en onthoudt waar elk staat. Elke start leest ze vanaf daar.
  RIPPS2_HIDE_GAME: Game verbergen
  RIPPS2_HIDDEN_GAMES: Verborgen games
  HINT_RIPPS2_HIDDEN_GAMES: De games die met Game verbergen zijn verborgen, op de gestarte schijven. Toon er een weer, of verwijder het. Elke schijf houdt zijn eigen lijst bij.
  HINT_RIPPS2_BDM_DEVICES: 'De schijven waar BDM spellen van leest: USB, MX4SIO, een PC Card CF, de DVR-schijf van een DESR en iLink. De interne HDD volgt de startmodus van de HDD.'
  HINT_RIPPS2_SCREEN: 'Het beeld van het menu: videomodus, breedbeeld, waar het op de tv staat (H-POS, V-POS) en overscan.'
  HINT_RIPPS2_LAYOUT: Waar de categorieën staan en hoe een pagina binnenkomt, dan de hoezen van RIPFLOW en het raster van RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Tekstdikte, het kleurthema, het kleurverloop en elke kleur.
  HINT_RIPPS2_TEXT_WEIGHT: 'Hoe zwaar de eigen tekst van RIPPS2 is: de tips in Instellingen, STATUS en Over. Normaal is zoals het was; Vet leest beter op een zacht beeld. De eigen lettertypen van een thema houden de diktes die het thema ze geeft.'
  HINT_RIPPS2_HDD_START: 'De interne HDD, APA of exFAT: RIPPS2 leest welke het ook is en toont hem één keer, als HDD Spellen. Automatisch (het snelst met een schijf erin) start hem bij het opstarten; Uit laat hem met rust.'
  HINT_RIPPS2_THEME_COLOR: De eigen kleur van het kleurthema. Kies Eigen als kleurthema om hem zelf te kiezen, zoals de tekstkleuren.
  HINT_RIPPS2_SWEEP: Vijf kleuren waar het thema langzaam en vloeiend doorheen gaat. Regenboog, een verloop uit elk kleurthema of je eigen. Uit houdt het kleurthema stil.
  HINT_RIPPS2_SWEEP_COLORS: De vijf kleuren van het verloop en de snelheid. Verander er een van RIPPS2 en het wordt als je eigen bewaard, onder de naam die je het geeft.
  HINT_RIPPS2_SWEEP_NAME: Hoe je verloop heet in de lijst Kleurverloop.
  HINT_RIPPS2_SWEEP_COLOR: Een van de vijf kleuren waar het verloop doorheen gaat, op volgorde.
  HINT_RIPPS2_SWEEP_SPEED: 'Hoe lang elke kleur duurt voordat de volgende invloeit. Ook Levendig blijft vloeiend: de kleuren knipperen nooit.'
  RIPPS2_HIDE_COMPRESS: Game verbergen en compressie
  HINT_RIPPS2_SELECT_HOLD: 'SELECT 4.2 s vastgehouden op een gamelijst. Lijst: de thema''s in een paneel, kies er een. Doorlopen: het volgende thema. Uit: niets (een druk vernieuwt nog steeds).'
  RIPPS2_RECENT_GAMES: Recente games
  RIPPS2_SET_METADATA_RENAME: Metadata instellen (hernoemen)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Controller eerst (experimenteel)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'De SD2PSX leest via de bus die de controller deelt, en tijdens een leesactie wordt de controller niet gehoord: drukken lopen achter of gaan verloren terwijl hoesjes laden. Aan: hoesjes komen in kleine stukjes met de controller ertussen gelezen, iets trager. Uit: zo snel als de kaart gaat. Met de bronnen van de kaart op Automatisch laadt de lijst één keer, bij het opstarten.'
  HINT_RIPPS2_TRUST_CACHE: 'Een lijst die uit zijn cache wordt getoond blijft zoals hij is, klaar om te starten, tot je op SELECT drukt of RIPPS2 die bron zelf wijzigt. Uit: elke bron wordt op de achtergrond opnieuw gelezen nadat zijn cache verschijnt, een pauze die je voelt op een MMCE- of MX4SIO-kaart, die de bus van de controller delen.'
  RIPPS2_STATUS_OPEN: Laden en schijven
  HINT_RIPPS2_STATUS_OPEN: 'Opent STATUS: waar het opstarten de instellingen en de gamelijsten leest, welke plek het snelst is, waar de EXIT van een game heen gaat, en elke schijf. Zijn CACHE-INSTELLINGEN brengt je hier terug.'
  RIPPS2_BADGE_SET: Badgeset
  HINT_RIPPS2_BADGE_SET: 'De badges op de infopagina van een game (leeftijdsclassificatie, spelers, ESRB, videomodus, scan, beeldverhouding). RIPPS2: zijn eigen set, op elk thema dezelfde. Thema: de eigen afbeeldingen van het thema, of die van RIPPS2 als het thema erom vraagt.'
  RIPPS2_HINT_FADE: Hints en symbolen laten vervagen
  HINT_RIPPS2_HINT_FADE: 'Een knophint of symbool dat verandert, vervaagt erin, zoals de hoesjes, op het moment dat het verandert; wat blijft staan wordt met rust gelaten, op elke pagina en in elk bericht. Uit: ze verschijnen gewoon. Thema: het thema beslist (aan, tenzij het hints_fade=0 zegt).'
  RIPPS2_SIDEBAR_STYLE: Stijl van de zijbalk
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klassiek (gedeeld): de pictogrammen in de donkere balk van de zijbalk, met de gekleurde strook ernaast. XL (uit één stuk): één bredere balk, de pictogrammen in het midden. Thema: het thema beslist.'
  HINT_EXITPATH: 'Waar EXIT in het menu in het spel heen gaat. Het best leeg: EXIT gaat naar de browser, die je bootloader start (FreeMcBoot, PS2BBL, OSDMenu of BIBLE) als er een is geïnstalleerd, en opnieuw RIPPS2 met BOOT LOCK aan, zoals bij het aanzetten; zonder, de PS2-browser. Een ELF die hier is getypt, wordt alleen gebruikt als de reset hem kan laden (op een geheugenkaart of een FAT32-USB-schijf) en het niet RIPPS2 zelf is; al het andere gaat naar de browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO en de exFAT-HDD. Automatisch start ze bij het opstarten: het snelst voor de schijven die je hebt aangesloten, hun games vanaf het begin in Alle games. Handmatig start ze als je hun pagina opent.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino kan geen VMC op de APA-HDD gebruiken (exFAT, USB en MX4SIO wel): deze game start met de echte kaart in die sleuf.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Het starten leest alleen de schijf van RIPPS2: de instellingen en de geluiden naast RIPPS2.ELF (RIPPS2.FB daar zegt waar) en elke lijst uit zijn cache. De andere schijven wachten: SELECT op een pagina start zijn schijven en haalt hun afbeeldingen (met automatisch vernieuwen starten ze bij het opstarten). Aanzetten kopieert je geluiden, en de muziek als er ruimte is, naar AUDIO naast RIPPS2.'
  RIPPS2_ART_PACK: ART-pakket
  RIPPS2_ART_PACK_BUILD: Bouwen of verwijderen
  HINT_RIPPS2_ART_PACK: Zet de ART-map van elk gestart station in één art.tar op het station dat je kiest (het snelste wordt eerst aangeboden). De covers komen dan uit één bestand met één index, nooit met een zoektocht per game, zodat de menu's en de muziek soepel blijven. De ART-mappen blijven zoals ze zijn.
  RIPPS2_LIST_CFG_TEXT: Titel en beschrijving in de lijst
  HINT_RIPPS2_LIST_CFG_TEXT: 'De titel en beschrijving van de game uit zijn CFG naast de lijst. Thema: zoals het thema ze toont (het eigen thema van RIPPS2 laat ze weg). De infopagina houdt ze altijd.'
  RIPPS2_PS1_PREFER: PS1-dubbels
  HINT_RIPPS2_PS1_PREFER: 'Een PS1-game die zowel een POPSTARTER-VCD als een Ember-image is. Beide: twee regels. Ember: alleen de Ember-regel. POPSTARTER: alleen de VCD. Dezelfde titel, een disc-ID ervoor niet meegerekend, is dezelfde game.'
  RIPPS2_MY_PADS: Mijn controllers
  HINT_RIPPS2_MY_PADS: 'De .pad-profielen in de map PADS naast RIPPS2: één tekstbestand per USB-pad, genoemd naar zijn ID (2563_0575.pad), elk gecontroleerd. Een pad met profiel bestuurt het menu en speelt in games (Pad Emulator aan).'
  RIPPS2_PAD_SETUP: Een USB-pad instellen
  HINT_RIPPS2_PAD_SETUP: Sluit een USB-pad aan die RIPPS2 niet kent, druk elke knop in waar het om vraagt, en RIPPS2 schrijft zijn .pad in PADS. SELECT op je PS2-pad slaat een knop over.
