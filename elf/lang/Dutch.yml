  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot staat aan. De geluiden nemen %d KB in beslag en de geheugenkaart waar RIPPS2 vanaf draait heeft %d KB vrij, dus ze blijven in %s.
