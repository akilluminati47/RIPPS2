  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'De samenvoeging stopte tussen twee hernoemingen: het behouden .tar is %s en het samengevoegde %s. Hernoem ze terug met Geheugenbestanden.'
