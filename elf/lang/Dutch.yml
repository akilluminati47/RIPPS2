  The ART Pack in %s is removed. Art loads from the ART folders again.: Het ART-pakket in %s is verwijderd. De afbeeldingen komen weer uit de ART-mappen.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Er is geen ART-map met afbeeldingen op de gestarte stations. Start de stations waar je afbeeldingen op staan (SELECT op hun pagina) en kom dan terug.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d afbeeldingen uit %d ART-mappen gaan in één bestand, %s. De ART-mappen blijven zoals ze zijn: het pakket is een kopie. Je kunt art.tar met Memory Files naar de ART-map van een ander station kopiëren, maar het bouwen op het station waar je doorheen bladert is het snelst, daarom staat het snelste station bovenaan. Nu bouwen?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Het ART-pakket is gebouwd: %d afbeeldingen, %d MB, in %s (%d s). De afbeeldingen komen er voortaan uit, en bij de %d games waarvoor het gebouwd is, wordt hun ART-map nooit meer afbeelding voor afbeelding gevraagd. Afbeeldingen die RIPPS2 ophaalt of vastlegt, verschijnen meteen; afbeeldingen die je op een pc erin kopieert, verschijnen als je het pakket opnieuw bouwt.'
