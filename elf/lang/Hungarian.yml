  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : A játék közbeni menü CHEATS pontja játék közben be- vagy kikapcsolja a játék minden csalását. A változás RESUME-kor él; a kikapcsolt csalás nem ír tovább, amit írt, megmarad. A játékhoz bekapcsolt Cheats kell.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Nincs CHEATS a játék közbeni menüben: az indítás előtt bejelölt csalások az egész játék alatt futnak, mint eddig.'
