  HINT_EXITPATH: 'Hová vezet az EXIT a játék közbeni menüben. Legjobb üresen hagyni: az EXIT a böngészőbe vezet, amely elindítja a rendszerbetöltődet (FreeMcBoot, PS2BBL, OSDMenu vagy BIBLE), ha van telepítve, és BOOT LOCK mellett újra a RIPPS2-t, mint bekapcsoláskor; ha nincs, a PS2 böngészőt. Az ide írt ELF csak akkor használható, ha a reset be tudja tölteni (memóriakártyáról vagy FAT32 USB-meghajtóról), és nem maga a RIPPS2; minden más a böngészőbe vezet.'
  HINT_BDM_START: 'USB, iLink, MX4SIO és az exFAT HDD. Az Automatikus indításkor elindítja őket: a csatlakoztatott meghajtókhoz ez a leggyorsabb, a játékaik kezdettől a Minden játék között vannak. A Manuális akkor indítja őket, amikor megnyitod az oldalukat.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'A Neutrino nem tud VMC-t használni az APA HDD-n (az exFAT, az USB és az MX4SIO igen): ez a játék a valódi kártyával indul abban a foglalatban.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Az indulás csak a RIPPS2 saját meghajtóját olvassa: a beállításokat és a hangokat a RIPPS2.ELF mellett (az ott lévő RIPPS2.FB mondja meg, hol) és minden listát a gyorsítótárából. A többi meghajtó vár: egy oldalon a SELECT elindítja a meghajtóit és betölti a képeiket (automatikus frissítéssel induláskor indulnak). A bekapcsolás a hangjaidat, és ha van hely, a zenét is az AUDIO mappába másolja a RIPPS2 mellé.'
  RIPPS2_ART_PACK: ART csomag
  RIPPS2_ART_PACK_BUILD: Építés vagy törlés
  HINT_RIPPS2_ART_PACK: Minden elindított meghajtó ART mappáját egyetlen art.tar fájlba csomagolja a választott meghajtón (a leggyorsabbat kínálja elsőként). A borítók ezután egy fájlból, egy indexszel jönnek, soha nem játékonkénti kereséssel, így a menük és a zene zökkenőmentesek maradnak. Az ART mappák maradnak, ahogy vannak.
  RIPPS2_LIST_CFG_TEXT: Cím és leírás a listában
  HINT_RIPPS2_LIST_CFG_TEXT: 'A játék CFG-jéből vett cím és leírás a lista mellett. Téma: ahogy a téma mutatja (a RIPPS2 saját témája elhagyja őket). Az információs oldal mindig megtartja őket.'
  RIPPS2_PS1_PREFER: PS1 ismétlődések
  HINT_RIPPS2_PS1_PREFER: 'Egy PS1-játék, amely POPSTARTER VCD-ként és Ember-képként is megvan. Mindkettő: két sor. Ember: csak az Ember sor. POPSTARTER: csak a VCD. Ugyanaz a cím, az elöl álló lemezazonosítótól eltekintve, ugyanaz a játék.'
  RIPPS2_MY_PADS: Kontrollereim
  HINT_RIPPS2_MY_PADS: 'A .pad profilok a RIPPS2 melletti PADS mappában: USB-kontrollerenként egy szövegfájl, az azonosítója a neve (2563_0575.pad), mindegyik ellenőrizve. A formátumot a RIPPS2 vezeti; a PADEMU egy későbbi buildben olvassa őket.'
