  HINT_RIPPS2_STARSIDE: 'Hol áll egy kedvenc játék csillaga a listában. Bal: saját oszlop minden sor elején. Jobb: a cím után. Rejtett (alapértelmezett): se csillag, se oszlop, a címek teljes hosszban. Téma: ahogy a téma mondja. Az R3 mindenképp kedvencnek jelöl egy játékot; tartsd lenyomva az R3-at 4 másodpercig egy listán a csillagok elrejtéséhez vagy visszahozásához (ez a kurzor alatti játékot is kedvencnek jelöli).'
  HINT_RIPPS2_HINT_LAYOUT: 'Sor: a tippek egy sorban. Oszlop: soronként egy tipp, oldalt egy lista, ott kezdve, ahová a téma a tippjeit teszi.'
  RIPPS2_HINT_LABELS: Tippfeliratok
