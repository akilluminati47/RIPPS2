  RIPPS2_RIP: Kinyerés
  RIPPS2_HINTS_GLYPHS: Tippek és ikonok
  HINT_RIPPS2_HINTS_GLYPHS: A gombtippek és ikonok kinézete. Minden sor a Témán kezdődik, vagyis azon, amit a téma választott; minden más választás a tiéd, és minden téma felett áll.
