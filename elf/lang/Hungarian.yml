  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : 'A RIPPS2 a BIOS saját hangjegyeiből lejátssza a konzol menüzenéjét, a böngészője hangulatzenéjét (%d:%02d), és %s méretű WAV-ként ide írja: %s; egyetlen memóriakártyára sem fér rá. Az ott lévő %s lecserélődik. Egy-két percig tart.'
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'A RIPPS2 kiolvassa a hangokat a konzol saját BIOS-ából, és saját hangjaiként ide írja: %s: kurzor, elfogadás, mégse, oldalak, kategória, üzenetek, lemez, hiba, mentés, meghajtók és véletlen, valamint az indítási és játékindítási zene, a BIOS saját hangjegyeiből lejátszva. Az ott lévő azonos nevű fájlok lecserélődnek.'
