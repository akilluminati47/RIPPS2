  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: Átmásolja a boot.adp-t a RIPPS2 mellé azon a memóriakártyán, amelyről indul, ahol az indítás bármely meghajtó előtt beolvassa.
