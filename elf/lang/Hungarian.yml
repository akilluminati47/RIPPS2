  HINT_RIPPS2_CATEGORY_ORDER: 'Felcseréli a Lemez indítása és a Memóriafájlok helyét: Memóriafájlok elöl és Lemez indítása a végén, a sáv nevein és az oldalsáv ikonjain egyaránt. A RIPFLOW-hoz készült (Felület > Téma). Téma: a téma dönt.'
