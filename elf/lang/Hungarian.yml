  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Futtasd a xeRAbora klienst egy azonos hálózaton lévő PC-n, bejelentkezve a RetroAchievements fiókodba. Aztán egy USB-n, MMCE-n, SMB-n vagy HDD-n lévő játéknál: nyisd meg a játék menüjét (HÁROMSZÖG), és válaszd a JÁTÉKTÁMOGATÁS ELLENŐRZÉSE-t. A követett játék megkapja az RA jelvényt; bekapcsolt TELEMETRIÁVAL indítsd el, és a feloldások megjelennek a játék felett. Tálcában lévő lemeznél használd a LEMEZ ELLENŐRZÉSE-t, majd a LEMEZ JÁTÉKA TELJESÍTMÉNYEKKEL-t. A Neutrinón, POPSTARTER-en vagy Emberen keresztül indított játékok még nincsenek követve.'
