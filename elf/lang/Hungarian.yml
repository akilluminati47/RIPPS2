  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- A konzol a PS2BBL 1.2.0-t ehhez a kártyához köti, és %s/%s néven írja ki.
  
    - A konfigurációja, mc%d:/PS2BBL/CONFIG.INI, ott indítja a RIPPS2-t, ahol van (%s), várakozás nélkül (0 ms, amit a PS2BBL Extended nem enged), BOOT LOCK bekapcsolva. Magát a RIPPS2-t nem másolja.
  
    Ehhez az I/O processzor újraindul, és minden meghajtóolvasás leáll, amíg el nem készül; a zene és a meghajtók utána visszatérnek. Hagyd benn a kártyát és a konzolt bekapcsolva, amíg azt nem írja, hogy kész.'
