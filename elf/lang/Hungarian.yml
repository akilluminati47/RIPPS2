  HINT_RIPPS2_BDM_DEVICES: 'A meghajtók, amelyekről a BDM játékokat olvas: USB, MX4SIO, PC Card CF, egy DESR DVR-meghajtója és iLink. A belső HDD a HDD indítási módját követi.'
