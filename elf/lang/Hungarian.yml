  : Ez a RIPPS2 lite, amely nem tartalmazza a PS2BBL-t, így nem tudja beállítani a BIBLE-t. A teljes RIPPS2.elf telepíti és javítja; a már beállított rendszerbetöltő továbbra is a RIPPS2 lite-ot indítja.
