  : 'A BIBLE telepítve van a belső HDD-re, és a BOOT LOCK be van kapcsolva: bekapcsoláskor a konzol azonnal elindítja a RIPPS2-t innen: %s%s%s%s. Beállítás: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : A BIBLE a(z) %d. memóriakártyán van, de a beállítását (%s) nem sikerült kiírni, ezért a böngészőt indítja. Szabadíts fel egy kis helyet, és futtasd újra a KEZELÉS-t a befejezéshez.
  BIBLE ran out of memory before it started. Nothing was changed.: A BIBLE-nek elfogyott a memóriája, mielőtt elkezdte volna. Semmi nem változott.
  BIBLE ran out of memory. Nothing on the memory card was changed.: A BIBLE-nek elfogyott a memóriája. A memóriakártyán semmi nem változott.
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: a RIPPS2 másolása ide: %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: a HDD rendszerindító programjának megtartása'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: a HDD rendszerindító programjának visszahelyezése'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: a PS2BBL kiírása a HDD rendszerindító területére'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'BIBLE TELEPÍTÉSE A BELSŐ HDD-RE

    - A RIPPS2 ide másolódik: %s.

    - A HDD jelenleg __mbr-ben lévő rendszerindító programja kiolvasásra és megőrzésre kerül itt: %s/RIPPS2 (a VISSZAÁLLÍTÁS visszateszi).

    - A helyére a PS2BBL 1.2.0 HDD-s buildje kerül, és a konzol úgy lesz beállítva, hogy bekapcsoláskor azt indítsa.

    - A beállítása (%s) a RIPPS2-t először innen indítja: %s%s%s, BOOT LOCK bekapcsolva.

    Ehhez olyan konzol kell, amely a HDD-jéről indul (vastag PS2 hálózati adapterrel). Hagyd bekapcsolva, amíg a kész felirat meg nem jelenik.'
  INTERNAL HDD  (its boot area): BELSŐ HDD  (a rendszerindító területe)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'A HDD RÉGI RENDSZERINDÍTÓ PROGRAMJÁNAK VISSZAHELYEZÉSE

    Az, amelyet a BIBLE megtartott (RIPPS2/MBR-BACKUP.KELF a HDD-n), visszakerül az __mbr-be a BIBLE helyére. A RIPPS2 és a PS2BBL-beállítás a helyén marad.'
  RESTORE: VISSZAÁLLÍTÁS
  RESTORE THE HDD'S OLD BOOT PROGRAM: A HDD RÉGI RENDSZERINDÍTÓ PROGRAMJÁNAK VISSZAÁLLÍTÁSA
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : A RIPPS2 nem tudja megállapítani a konzol régióját a ROM-jából, így nem tudja, melyik rendszerfrissítési mappát olvassa. A BIBLE nem lett telepítve.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : 'A RIPPS2 nem tudta megnyitni a HDD __sysconf vagy __common partícióját (hiba: %d), így a BIBLE-nek nincs hol tartania ott a RIPPS2-t és a beállítását. Semmi nem változott.'
  RIPPS2 could not read the kept boot program. Nothing was changed.: A RIPPS2 nem tudta beolvasni a megtartott rendszerindító programot. Semmi nem változott.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: A RIPPS2 nem tudta visszaírni a rendszerindító programot. Próbáld újra; a megtartott másolat érintetlen.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'A RIPPS2 éppen egy meghajtót olvasott, és nem tudta újraindítani az I/O processzort. Semmi nem változott: próbáld újra egy pillanat múlva.'
  Reading the memory cards: A memóriakártyák olvasása
  The HDD partition BIBLE uses went away. Nothing was changed.: A BIBLE által használt HDD partíció eltűnt. Semmi nem változott.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: A HDD régi rendszerindító programja visszakerült. A BIBLE többé nem a HDD-ről indul.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : A konzol nem kötötte a BIBLE-t a(z) %d. memóriakártyához (a MagicGate lépés sikertelen). A kártyán semmi nem változott. Nem eredeti vagy nem MagicGate-kompatibilis kártya nem tárolhat rendszerfrissítést.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Ami ott volt, megmaradt a HDD-n itt: RIPPS2/MBR-BACKUP.KELF; a RENDSZERBETÖLTŐ > KEZELÉS > VISSZAÁLLÍTÁS visszateszi.'
  The security module would not start on this console. Nothing on the memory card was changed.: A biztonsági modul nem indult el ezen a konzolon. A memóriakártyán semmi nem változott.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Egyik foglalatban sincs formázott PS2 memóriakártya, és belső HDD sincs. A BIBLE memóriakártyán vagy a HDD-n lakik: helyezz be egy kártyát, és próbáld újra.'
  There is no kept boot program on this HDD. Nothing was changed.: Ezen a HDD-n nincs megtartott rendszerindító program. Semmi nem változott.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Ezen a HDD-n nincs __sysconf partíció, így a BIBLE beállításának memóriakártyára kell kerülnie (a PS2BBL előbb a kártyáét olvassa), és egyik foglalatban sincs kártya. Helyezz be egyet, és próbáld újra.
