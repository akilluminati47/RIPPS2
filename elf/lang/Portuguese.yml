  PS1_RA_USB_REQUIRED: Conquistas de PS1 precisam de um VCD no USB pelo POPStarter
  PS1_RA_REMOVE_PREVIOUS: Não foi possível remover o módulo de conquistas de PS1 anterior
  PS1_RA_PREPARE_FAILED: Não foi possível preparar as conquistas de PS1. Mantenha ou mova POPS/MODULE_9.IRX e verifique a permissão de gravação da unidade.
  PS1_RA_CLEAN_DELETE: 'Módulo RA do RiptOPL sem uso: POPS/MODULE_9.IRX. Apagar para um início limpo?'
  PS1_RA_CLEAN_FAILED: Não foi possível apagar o módulo RA sem uso.
  PS1_RA_CLEAN_CONTINUE: Continuar mesmo assim? Um módulo RA que sobrou pode enviar telemetria velha. Não cancela o início.
  FAV_REMOVED: Removido de Jogos favoritos
  FAV_REMOVE_FAILED: Não foi possível remover de Jogos favoritos
  POPS_UDPFS_SETTINGS: Definições de rede UDPFS do POPS
  POPS_UDPFS_DISCOVERY: Guarda em cada pasta POPS do USB. O servidor 0.0.0.0 usa descoberta.
  POPS_UDPFS_NOT_READY: O POPS UDPFS precisa de IPCONFIG.DAT e UDPFSCONFIG.DAT válidos e iguais em cada pasta POPS do USB. Configure-os em Definições de rede do POPS.
  HINT_POPS_UDPFS_IP: IP fixo do PS2 usado pelo driver UDPFS do POPS depois de reiniciar o IOP.
  POPS_UDPFS_ALL_USB_FOLDERS: Todas as pastas POPS do USB
  POPS_UDPFS_INVALID_SUFFIX: ' (inválido)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (incompleto)'
  POPS_UDPFS_DRIVER_NOT_READY: O POPS UDPFS precisa do par de drivers .udpfs instalado no cartão de memória. Instale à mão ou ligue BDMA Aplicar ao iniciar.
  VMC_REPLACE_REQUIRES_DELETE: Mudar o tamanho da VMC apagaria os saves dela. Faça backup da VMC existente e use Apagar antes de criar um tamanho novo.
  VMC_CREATE_FAILED: Não foi possível criar a VMC. Verifique a unidade, a conexão e a permissão de gravação. Os saves existentes não foram substituídos.
  RA_EXPERIMENTAL_CARDS: Cartões experimentais do Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Cartões experimentais de conquistas dentro do jogo no PS2. Podem piscar ou bloquear jogos. Só Caduceus; Desligado usa o pulso dourado. Vale a partir do próximo jogo iniciado.
  RA_NEUTRINO_UNTRACKED: O RA no Neutrino não está disponível neste início. Verifique o módulo RA, o IP do companheiro e a lista de acompanhamento guarda. Iniciando sem conquistas.
  UDPFS_IP_CONFLICT: Outro aparelho da sua rede está usando o IP deste PS2, então as respostas do servidor UDPFS vão para ele. Defina outro IP para o PS2 em Definições de rede.
  XERA_ACHIEVEMENTS: Biblioteca do RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Navegue por este jogo pela biblioteca do RetroAchievements no menu principal.
  XERA_OPEN_NETWORK: Não foi possível alcançar o xeRAbora. Ligue OPEN TO THE NETWORK nas definições dele, verifique o IP do companheiro RA e o firewall do PC.
  XERA_UNKNOWN_GAME: O xeRAbora não conhece esta imagem. Execute antes a verificação de suporte RA.
  XERA_NOT_PLAYED: Ainda não está na sua biblioteca do RetroAchievements. Jogue uma vez com conquistas e prima Select.
  XERA_CONNECTION_ERROR: Não foi possível ler a lista do xeRAbora. Prima Select para tentar de novo.
  CAD_PAIR_UDPFS: Não foi possível alcançar o Caduceus. Pareie ART/CADUCEUS.KEY na pasta que o PS2-Servers compartilha e defina o IP do companheiro RA.
  RA_WL_NOT_SAVED: Não foi possível guardar a lista de acompanhamento. Verifique se a unidade ou o compartilhamento do jogo aceita gravação e verifique de novo.
  RA_UDPFS_LOAD_FIRST: Abra a página UDPFS uma vez para o módulo de rede dela carregar e tente de novo.
  CAD_UDPFS_IMG: 'O navegador do Caduceus precisa de SMB ou UDPFS Ficheiros: o UDPFS IMG não tem pasta compartilhada para a chave dele.'
  XERA_SET_CLOCK: Ainda não está na sua biblioteca do RetroAchievements. Acerte o relógio da consola nas definições do sistema para ver a lista completa, ou jogue uma vez com conquistas.
  CFG_TITLES: Mostrar títulos do CFG nas listas de jogos
  HINT_CFG_TITLES: Mostra o título do CFG de cada jogo em vez do nome do ficheiro, e ordena por ele. Lê todo CFG ao atualizar uma lista, então as listas carregam mais devagar. Só visual.
  AUTO_VMC_INVALID: O ficheiro VMC deste jogo existe, mas não é um cartão de memória válido, então não foi usado nem substituído. O jogo inicia sem ele; verifique no menu VMC.
  AUTO_VMC_STILL_RUNNING: A VMC deste jogo ainda está sendo criada. Inicie o jogo de novo daqui a pouco.
  NEUTRINO_DVR_QUICKBOOT: O início pelo DVR precisa da transição para o modo PSX. Tire o -qb dos argumentos globais e do jogo no Neutrino.
  NEUTRINO_DVR_FILE_MISSING: 'A instalação DVR do Neutrino está incompleta. Falta o ficheiro necessário:'
  PARENLOCK_GAME: Controlo parental
  PARENLOCK_GAME_HINT: Pedir a palavra-passe do controlo parental para iniciar este jogo.
  PARENLOCK_GAME_NO_PASSWORD: Defina uma palavra-passe de controlo parental, senão este jogo não será bloqueado.
  HINT_ENABLE_PCCF: CompactFlash na PC CARD dos primeiros PS2 japoneses. Só jogos nativos de PS2; a CF precisa de acesso exclusivo à PC CARD. Reinicie para liberá-la.
  PCCF_GAMES: Jogos PC CARD CF
  PCCF_UNAVAILABLE: 'CF indisponível: precisa de um PS2 japonês antigo com PC CARD, um cartão compatível e nenhum driver DEV9/disco rígido/rede ativo.'
  PCCF_UNSUPPORTED_GAME: A CF por enquanto só suporta jogos nativos de PS2. VMC na CF, carregamento de PS1 e conquistas pela rede não estão disponíveis.
  HINT_ENABLE_DVR: Descoberta experimental de ISOs DESR DVR. Precisa da origem disco rígido ligada; iniciar jogos precisa de um Neutrino externo com suporte a DVR.
  HINT_RIPPS2_IGR_PAGE: O menu no jogo, o RIPSHOT e como as fotos são reveladas.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Capturas a partir do menu no jogo, para ART para os teus temas ou para MEDIA.
  RIPPS2_DEVELOP_SHOTS: Revelar fotos
  HINT_RIPPS2_DEVELOP_SHOTS: Como as fotos à espera no rolo de cada jogo se tornam PNG.
  RIPPS2_SETTINGS_HOME: Guardar definições em
  HINT_RIPPS2_SETTINGS_HOME: 'Onde o RIPPS2 guarda as definições: o seu save num cartão de memória, uma pasta RIPPS2 numa unidade (o disco rígido interno, USB, MX4SIO, iLink ou MMCE) ou uma pasta que escreves.'
  RIPPS2_LAUNCHERS: Lançadores
  RIPPS2_LOOK_NOW: Procurar agora
  HINT_RIPPS2_LOOK_NOW: O RIPPS2 procura nas unidades iniciadas o POPSTARTER, os ficheiros POPS, o Ember, a BIOS do Ember e o Neutrino, e memoriza onde está cada um. Cada lançamento lê-os a partir daí.
  RIPPS2_HIDE_GAME: Ocultar jogo
  RIPPS2_HIDDEN_GAMES: Jogos ocultos
  HINT_RIPPS2_HIDDEN_GAMES: Os jogos ocultos com Ocultar jogo, nas unidades iniciadas. Volte a mostrar um, ou apague-o. Cada unidade guarda a sua própria lista.
  HINT_RIPPS2_BDM_DEVICES: 'As unidades de onde o BDM lê jogos: USB, MX4SIO, um PC Card CF, a unidade DVR de um DESR e iLink. O disco rígido interno segue o início do disco rígido.'
  HINT_RIPPS2_SCREEN: 'A imagem do menu: modo de vídeo, ecrã panorâmico, o seu lugar na televisão (H-POS, V-POS) e overscan.'
  HINT_RIPPS2_LAYOUT: Onde ficam as categorias e como uma página entra, depois as capas do RIPFLOW e a grelha do RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Espessura do texto, a cor do tema, a transição de cores e cada cor.
  HINT_RIPPS2_TEXT_WEIGHT: 'A espessura do texto do próprio RIPPS2: as dicas das definições, STATUS e Acerca. Normal é como era; Negrito lê-se melhor sobre uma imagem suave. As fontes próprias de um tema mantêm as espessuras que o tema lhes dá.'
  HINT_RIPPS2_HDD_START: 'O disco rígido interno, APA ou exFAT: o RIPPS2 lê o que for e mostra-o uma vez, como Jogos por HDD. Automático (o mais rápido com um disco instalado) inicia-o no arranque; Desativado deixa-o em paz.'
  HINT_RIPPS2_THEME_COLOR: A cor do próprio tema. Escolha Personalizado como cor do tema para a escolher você, como as cores do texto.
  HINT_RIPPS2_SWEEP: Cinco cores por que o tema passa, devagar e suavemente. Arco-íris, uma transição feita de cada cor de tema, ou a sua. Desligado mantém o tema parado.
  HINT_RIPPS2_SWEEP_COLORS: As cinco cores da transição e a sua velocidade. Altere uma das do RIPPS2 e fica guardada como sua, com o nome que lhe der.
  HINT_RIPPS2_SWEEP_NAME: Como a sua transição se chama na lista Transição de cores.
  HINT_RIPPS2_SWEEP_COLOR: Uma das cinco cores por que a transição passa, por ordem.
  HINT_RIPPS2_SWEEP_SPEED: 'Quanto dura cada cor antes de a seguinte entrar. Mesmo Vivo continua suave: as cores nunca piscam.'
  RIPPS2_HIDE_COMPRESS: Ocultar jogo e compressão
  HINT_RIPPS2_SELECT_HOLD: 'SELECT mantido 4.2 s numa lista de jogos. Lista: os temas num painel, escolha um. Rotação: o tema seguinte. Desligado: nada (premir continua a atualizar).'
  RIPPS2_RECENT_GAMES: Jogos recentes
  RIPPS2_SET_METADATA_RENAME: Definir metadados (mudar o nome)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Comando primeiro (experimental)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'O SD2PSX lê pelo barramento que o comando partilha, e enquanto uma leitura decorre o comando não é ouvido: os toques atrasam-se ou perdem-se enquanto as capas carregam. Ativado: as capas chegam em pequenos pedaços com o comando lido entre eles, um pouco mais devagar. Desativado: tão rápido quanto o cartão. Com as fontes do cartão em Automático, a lista dele carrega uma vez, no arranque.'
  HINT_RIPPS2_TRUST_CACHE: 'Uma lista mostrada a partir da sua cache fica como está, pronta a arrancar, até premir SELECT ou o RIPPS2 alterar ele próprio essa fonte. Desativado: cada fonte é lida de novo em segundo plano depois de a cache aparecer, uma pausa que se sente num cartão MMCE ou MX4SIO, que partilham o barramento do comando.'
  RIPPS2_STATUS_OPEN: Carregamento e unidades
  HINT_RIPPS2_STATUS_OPEN: 'Abre o STATUS: onde o arranque lê as definições e as listas de jogos, que sítio é o mais rápido, para onde vai o EXIT de um jogo, e cada unidade. O DEFINIÇÕES DA CACHE dele volta aqui.'
  RIPPS2_BADGE_SET: Conjunto de emblemas
  HINT_RIPPS2_BADGE_SET: 'Os emblemas da página de informações de um jogo (classificação, jogadores, ESRB, modo de vídeo, varrimento, formato). RIPPS2: o seu próprio conjunto, igual em todos os temas. Tema: as imagens do tema, ou as do RIPPS2 quando o tema as pede.'
  RIPPS2_HINT_FADE: Desvanecer dicas e glifos
  HINT_RIPPS2_HINT_FADE: 'Uma dica de botão ou um glifo que muda aparece a desvanecer, como as capas, no momento em que muda; os que ficam não mexem, em cada página e mensagem. Desativado: simplesmente aparecem. Tema: o tema decide (ativado, a menos que diga hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Estilo da barra lateral
  HINT_RIPPS2_SIDEBAR_STYLE: 'Clássico (dividido): os ícones na faixa escura da barra lateral, com a tira colorida ao lado. XL (peça única): uma só faixa mais larga, com os ícones no meio. Tema: o tema decide.'
  HINT_EXITPATH: 'Para onde vai o EXIT no menu no jogo. Melhor vazio: o EXIT vai para o browser, que inicia o teu boot loader (FreeMcBoot, PS2BBL, OSDMenu ou BIBLE) se houver um instalado, e de novo o RIPPS2 com o BOOT LOCK ligado, como ao ligar; sem nenhum, o browser da PS2. Um ELF escrito aqui só é usado quando o reset o consegue carregar (num cartão de memória ou numa unidade USB FAT32) e não é o próprio RIPPS2; tudo o resto vai para o browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO e o disco rígido exFAT. Automático inicia-os no arranque: o mais rápido para as unidades ligadas, com os jogos delas em Todos os jogos desde o início. Manual inicia-os quando abre a página delas.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'O Neutrino não consegue usar uma VMC no disco rígido APA (exFAT, USB e MX4SIO conseguem): este jogo arranca com o cartão real nessa ranhura.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'O arranque só lê a unidade do RIPPS2: as definições e os sons junto ao RIPPS2.ELF (o RIPPS2.FB aí diz onde) e cada lista a partir da sua cache. As outras unidades esperam: SELECT numa página inicia as suas unidades e traz as imagens (com a atualização automática iniciam no arranque). Ativá-lo copia os teus sons, e a música se houver espaço, para AUDIO junto ao RIPPS2.'
  RIPPS2_ART_PACK: Pacote ART
  RIPPS2_ART_PACK_BUILD: Criar ou remover
  HINT_RIPPS2_ART_PACK: Junta a pasta ART de cada unidade iniciada num único art.tar na unidade que escolheres (a mais rápida é oferecida primeiro). As capas passam a vir de um ficheiro com um índice, nunca de uma procura por jogo, e os menus e a música ficam fluidos. As pastas ART ficam como estão.
  RIPPS2_LIST_CFG_TEXT: Título e descrição na lista
  HINT_RIPPS2_LIST_CFG_TEXT: 'O título e a descrição do jogo da sua CFG junto à lista. Tema: como o tema os mostra (o tema do RIPPS2 esconde-os). A página de informação mantém-nos sempre.'
  RIPPS2_PS1_PREFER: Duplicados PS1
  HINT_RIPPS2_PS1_PREFER: 'Um jogo PS1 que é ao mesmo tempo um VCD do POPSTARTER e uma imagem Ember. Ambos: duas linhas. Ember: só a do Ember. POPSTARTER: só o VCD. O mesmo título, sem um ID de disco à frente, é o mesmo jogo.'
  RIPPS2_MY_PADS: Os meus comandos
  HINT_RIPPS2_MY_PADS: 'Os perfis .pad na pasta PADS ao lado do RIPPS2: um ficheiro de texto por comando USB, com o nome do seu ID (2563_0575.pad), e cada um verificado. Um comando com perfil controla o menu e joga nos jogos (Pad Emulator ligado).'
  RIPPS2_PAD_SETUP: Configurar um comando USB
  HINT_RIPPS2_PAD_SETUP: Liga um comando USB que o RIPPS2 não conheça, carrega em cada botão que ele pedir e o RIPPS2 escreve o seu .pad em PADS. SELECT no teu comando PS2 salta um botão.
