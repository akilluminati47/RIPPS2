  HINT_RIPPS2_GRID_WIDE: A página da grelha só numa imagem 16:9 (Ecrã panorâmico, 720p, 1080i), onde as capas ficam mais estreitas e cabem mais. Tema usa o do tema; Igual segue o Layout da grelha.
