  HINT_RIPPS2_FAST_CACHE: 'Cada fonte guarda a sua última lista de jogos (RIPPS2.LST ao lado das pastas CD e DVD) e mostra-a assim que a fonte responde. O Trust Cache decide se a fonte é lida de novo depois. Desativado: cada lista é lida primeiro da sua fonte, como antes.'
