  HINT_RIPPS2_PAGE_BUTTONS: 'Quais gatilhos viram as páginas da lista de jogos. L2 / R2: viram as páginas e L1 / R1 trocam de categoria. L1 / R1: viram as páginas e L2 / R2 trocam de categoria. Tema: o tema decide; sem tema, L2 vai para o começo e R2 para o fim. L2 + R2 juntos sempre escolhem um jogo aleatório.'
