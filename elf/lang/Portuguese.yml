  HINT_RIPPS2_RECENTS: 'Jogos recentes, uma página da barra lateral com os seus últimos jogos iniciados, o mais novo primeiro: quantos guarda, de 1 a 99 (Triângulo escreve o número). Um jogo cuja unidade está em Manual inicia-a quando o escolhe. 0 desativa a página.'
  RIPPS2_CATEGORY_ORDER: Ordem das categorias
  HINT_RIPPS2_CATEGORY_ORDER: 'Troca Iniciar disco e Ficheiros de memória: Ficheiros de memória primeiro e Iniciar disco por último, tanto nos nomes da barra como nos ícones da barra lateral. Feito para o RIPFLOW (Interface > Tema). Tema: o tema decide.'
