  HINT_RIPPS2_CATEGORY_LAYOUT: 'Onde ficam as três categorias: os nomes em cima, ou ícones ao longo da barra lateral, cada um com uma gaveta das suas páginas (Esquerda numa lista leva lá), ou Menu: sem barra, as categorias no menu START como num tema feito para o OPL. Tema mantém a do tema.'
