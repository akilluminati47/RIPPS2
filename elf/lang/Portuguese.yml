  RIPPS2_GLYPH_SET: Conjunto de ícones
  HINT_RIPPS2_GLYPH_SET: 'Os ícones dos botões em cada página: os do tema, os do RIPPS2, Padrão (botões escuros, símbolos coloridos) ou Branco (branco sólido).'
  RIPPS2_HINT_ORDER: Ordem das dicas
