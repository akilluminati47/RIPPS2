  HINT_RIPPS2_HINT_LABELS: Só ícone desenha só os botões, para ícones que trazem as próprias palavras. Emblemas junta o ícone e o título de cada dica num emblema só.
  RIPPS2_HINT_MENU: Dica de Menu (START)
  RIPPS2_HINT_REFRESH: Dica de Atualizar (SELECT)
  RIPPS2_HINT_STAR: Dica de Favorito (R3)
  RIPPS2_HINT_VIEW: Dica de Visão (L3)
