  The kept .tar is only replaced once the merged copy is whole.: O .tar mantido só é substituído quando a cópia fundida está completa.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Não foi possível escrever a fusão na unidade de %s (há espaço?). Está como estava; nada mais mudou.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : A fusão precisa de cerca de %s livres na unidade de %s (o arquivo novo é escrito primeiro ao lado do antigo). Liberte algum espaço e tente de novo.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'A fusão parou entre duas mudanças de nome: o .tar mantido é %s e o fundido %s. Reponha os nomes com Ficheiros de memória.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : O .tar fundido foi escrito mas não pôde ficar com o nome %s (uma MMCE muda nomes a partir do firmware 1.4.0). O ficheiro novo foi removido; o .tar mantido está como estava.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : Não há outro .tar para fundir em %s. Coloque-o nesta pasta, na pasta ART de uma unidade ou na raiz de uma unidade e tente de novo.
