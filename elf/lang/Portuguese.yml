  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS no menu do jogo liga ou desliga cada cheat do jogo enquanto joga. As alterações aplicam-se em RESUME; um cheat desligado deixa de escrever, o que escreveu fica. Requer os Cheats ligados para o jogo.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Sem CHEATS no menu do jogo: os cheats marcados antes do arranque correm todo o jogo, como antes.'
