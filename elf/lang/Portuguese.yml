  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "Não foi possível escrever o ficheiro de definições do BIBLE (%s). Verifique se o cartão de memória está inserido e tem espaço, e tente de novo."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "O ficheiro de definições do BIBLE (%s) não foi encontrado. BIBLE: INSTALAR, ATUALIZAR OU RESTAURAR escreve um."
  "Boot sound On (fast): %s, handed over by BIBLE": "Som de arranque Ligado (rápido): %s, entregue pelo BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: o fork do PS2BBL Extended de akilluminati47, cada versão assinada por akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "a sua imagem IOPRP vincula o BIBLE ao seu cartão (GPL-3): a consola faz a criptografia, sem chaves"
  "KELFBinder by El Isra": "KELFBinder de El Isra"
  "source: github.com/akilluminati47/BIBLE": "código-fonte: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "RANHURA 0: %s\nRANHURA 1: %s\n%s\nRIPPS2: a instalar o BIBLE. BIBLE, o carregador de arranque de akilluminati47 baseado no PS2BBL de El Isra, instalado pelo RIPPS2 num cartão de memória PS2 normal de 8 MB ou no disco rígido interno: um arranque de 0 ms ao ligar (o PS2BBL Extended não permite 0), o RIPPS2 primeiro a partir de onde está (nunca é copiado), e um botão premido ao ligar ainda leva ao navegador (TRIANGLE), a um disco (START) e ao que lá estava antes (CIRCLE). Instalar, reparar ou repor o que substituiu?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: a instalar o BIBLE\nO cartão da ranhura %d é um cartão SD2PSX ou MMCE. O seu cartão BOOT pode guardar o BIBLE em vez do PS2BBL que tem (esse é primeiro posto de lado, inteiro), se a consola lhe vincular o BIBLE. Se o vínculo for recusado, nada muda no cartão, e o cartão pode deixar de responder até a consola ser desligada e ligada. START vincula-lhe o BIBLE."
  "BIND BIBLE": "VINCULAR BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(O DIAG.TXT junto ao RIPPS2 tem o que o cartão respondeu.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Para um cartão de memória PS2 normal de 8 MB (um MagicGate, ou um cartão BOOT SD2PSX ou MMCE): o da ranhura %d. Ao ligar, o PS2BBL lê a configuração da ranhura 1 antes da ranhura 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "A consola não quis vincular o BIBLE ao cartão de memória da ranhura %d (a etapa MagicGate falhou). Nada no cartão foi alterado. Um cartão que não seja original ou compatível com MagicGate não pode guardar uma atualização do sistema."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Um cartão SD2PSX ou MMCE pode deixar de responder após um vínculo recusado: se agora faltar o cartão de memória ou a unidade MMCE, desliga e volta a ligar a consola."
  "RIP THIS CONSOLE'S AUDIO": "EXTRAIR O ÁUDIO DESTA CONSOLA"
  "sounds or music, from its BIOS": "sons ou música, da sua BIOS"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Abre as Definições de áudio em Sons da BIOS e Música da BIOS: extrai os sons desta consola ou a música do seu menu para AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Som de arranque Ligado (rápido): %s no cartão de memória, ao subirem os pilares"
  "Boot sound On: %s on the memory card, as the pillars rise": "Som de arranque Ligado: %s no cartão de memória, ao subirem os pilares"
  "Boot sound On: %s, once its drive is up": "Som de arranque Ligado: %s, quando a sua unidade estiver pronta"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Este jogo arranca através do Neutrino e o RIPPS2 não encontrou nenhum: nem no caminho das Definições, nem no disco do jogo, nem nos cartões de memória, nem em qualquer disco iniciado. Coloque o Neutrino de rickgaiser (github.com/rickgaiser/neutrino) numa pasta neutrino no disco do jogo ou num cartão de memória, ou aponte Arranque de jogos > Neutrino para ele."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Onde está o seu Neutrino, o modo de vídeo e os argumentos que cada arranque do Neutrino recebe. Obtenha o Neutrino em github.com/rickgaiser/neutrino e coloque-o numa pasta neutrino num disco ou cartão de memória."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Este Neutrino é anterior à 1.3, que não consegue arrancar jogos do disco rígido APA. Aponte Arranque de jogos > Neutrino para o Neutrino 1.3 ou mais recente."
  "with rickgaiser's Neutrino as its second game core,": "com o Neutrino de rickgaiser como segundo núcleo de jogo,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "o segundo núcleo de jogo, usado a partir do seu disco ou cartão de memória (AFL-3.0)"
