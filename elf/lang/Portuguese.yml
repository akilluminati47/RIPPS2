  RIPPS2_CATEGORY_BAR: Categorias/Barra lateral
  HINT_RIPPS2_CATEGORY_BAR: 'INICIAR DISCO, ARMAZENAMENTO e FICHEIROS DE MEMÓRIA: os nomes em cima, ou a barra lateral. Desaparecer em repouso esbate os nomes, ou recolhe a barra lateral, até premir um botão; volta logo. Tema: o tema decide.'
  RIPPS2_SOURCE_NAME: Nome da origem
  RIPPS2_STATUS: Status
  RIPPS2_SOURCE: Origem
