  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'JUNTO AO RIPPS2: %sAUDIO%s, lido primeiro no arranque'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- O PS2BBL é ligado a este cartão pela consola e escrito como %s/%s.
  
    - A sua configuração, mc%d:/SYS-CONF/PS2BBL.INI, inicia o RIPPS2 onde está (%s) sem espera (0 ms, que o PS2BBL Extended não permite), BOOT LOCK ativo. O RIPPS2 em si não é copiado.
  
    O processador de E/S reinicia para isto e toda a leitura de unidades para até terminar; a música e as unidades voltam depois. Mantém o cartão inserido e a consola ligada até dizer que terminou.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Um cartão SD2PSX ou MMCE pode proteger-se após uma escrita recusada: se agora faltar o cartão de memória ou a unidade MMCE, desliga e volta a ligar a consola.'
  BOOT LOCK ON: BOOT LOCK ATIVO
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Feito: o cartão de memória da ranhura %d inicia o que iniciava antes do BIBLE. O BIBLE fica guardado em mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): CARTÃO DE MEMÓRIA NA RANHURA %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : O PS2BBL não consegue iniciar o RIPPS2 de onde está agora (chega a cartões de memória, unidades USB e MX4SIO), e o RIPPS2 não se copia a si próprio. Põe o RIPPS2.ELF num cartão de memória ou numa unidade USB e inicia-o a partir daí, ou usa o PS2BBL Extended, que lê MMCE e o disco rígido.
  RESTORE SLOT %d'S OLD BOOT LOADER: REPOR O CARREGADOR ANTIGO DA RANHURA %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: o BIBLE está instalado no cartão de memória da ranhura %d (mc%d:/%s/%s), BOOT LOCK ativo: ao ligar inicia o RIPPS2 a partir de %s, de imediato.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: a instalar o BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: a instalar o BIBLE
  
    O RIPPS2 corre a partir de %s, que o PS2BBL não consegue ler (lê cartões de memória, USB e MX4SIO), e o RIPPS2 não se copia a si próprio. A configuração do PS2BBL Extended deste cartão (%s) lê-o: START ativa o BOOT LOCK, para iniciar o RIPPS2 a partir de %s ao ligar. Nada mais muda no cartão.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: a instalar o BIBLE
  
    O RIPPS2 corre a partir de %s, que o PS2BBL não consegue ler: inicia programas a partir de um cartão de memória, de uma unidade USB ou do MX4SIO, e o RIPPS2 não se copia a si próprio. Põe o RIPPS2.ELF num deles (a pasta APPS de um cartão de memória ou uma unidade USB), inicia-o a partir daí e volta a instalar o BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: a instalar o BIBLE
  
    O cartão de memória da ranhura %d: o BIBLE (mc%d:/%s) é posto de lado e o que substituiu (mc%d:/%s) volta ao seu lugar. Nada é apagado. A configuração do PS2BBL fica como está (o BOOT LOCK pode desligar o bloqueio).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: a instalar o BIBLE (a ligar o PS2BBL ao cartão de memória)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: a instalar o BIBLE (a repor o que lá estava)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: a instalar o BIBLE (a reiniciar o processador de E/S)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: a instalar o BIBLE (a escrevê-lo no cartão de memória)'
  SET UP BIBLE: INSTALAR BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: O cartão de memória da ranhura %d tem %d KB livres e o BIBLE precisa de %d KB nele. Liberta espaço e tenta de novo.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : O cartão de memória da ranhura %d recusou o PS2BBL, por isso o RIPPS2 deixou o cartão como estava. Verifica o espaço livre e tenta de novo. (O DIAG.TXT junto ao RIPPS2 tem o que o cartão respondeu.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : O cartão de memória da ranhura %d não quis pôr o BIBLE de lado, por isso nada mudou. (O DIAG.TXT junto ao RIPPS2 tem o que o cartão respondeu.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): O cartão de memória da ranhura %d não quis aceitar %s de volta, por isso o BIBLE ficou. (O DIAG.TXT junto ao RIPPS2 tem o que o cartão respondeu.)
  MUSIC: MÚSICA
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s não tem %s. O RIPPOPS encontrou o emulador de PS1 da Sony em %s: START copia %s para aqui e inicia o jogo.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'O RIPPS2 não vê %s em %s%s. O POPSTARTER precisa de POPS_IOX.PAK com POPS.PAK, ou com POPS.ELF e IOPRP252.IMG: o emulador de PS1 da Sony, da tua própria consola. Pode encontrá-los onde o RIPPS2 não procura (se os teus jogos arrancam, encontra). START inicia, e não se volta a perguntar por esta unidade.'
  ' (The configs found were set: %s.)': ' (As configurações encontradas foram definidas: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Guarde as definições dele uma vez com o seu próprio configurador e volte a ativar o BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s não consegue iniciar o RIPPS2 a partir de onde está agora (%s), e o RIPPS2 não se copia a si próprio. Coloque o RIPPS2.ELF num cartão de memória ou numa unidade USB e inicie-o a partir daí.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : O BOOT LOCK não conseguiu escrever a configuração do carregador de arranque. Verifique se o cartão de memória ou a unidade não está protegido contra escrita e tente novamente.
  BOOT LOCK found no boot loader config to change.: O BOOT LOCK não encontrou nenhuma configuração de carregador de arranque para alterar.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: O BOOT LOCK está desativado. O seu carregador de arranque inicia o que iniciava antes (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : O BOOT LOCK está ativado. %s inicia agora o RIPPS2 ao ligar (%s), e, com «Definir saída do IGR» vazio, o EXIT de um jogo volta pelo mesmo caminho. Segure um dos botões dele enquanto a consola inicia para chegar a outra coisa.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'O BOOT LOCK pôs o RIPPS2 em primeiro no menu do OSDMenu (%s). O OSDMenu não inicia nada sozinho: escolha lá o RIPPS2, e o EXIT de um jogo volta a esse menu. Para uma consola que inicie o RIPPS2 logo, o BIBLE coloca o PS2BBL num cartão de memória (Carregador de arranque).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: O BOOT LOCK funciona através de um carregador de arranque num cartão de memória (PS2BBL, FMCB ou OSDMenu), e aqui não há nenhum.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: O cartão de memória da ranhura %d inicia %s ao ligar, e o BOOT LOCK não encontrou nenhuma configuração dele para alterar (procura %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'O cartão de memória da ranhura %d inicia %s ao ligar, que o BOOT LOCK não consegue definir: funciona através do PS2BBL, FMCB e OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Há nesta consola um carregador de arranque com o bloqueio do RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT de um jogo: o navegador, depois o seu carregador de arranque (BOOT LOCK)'
