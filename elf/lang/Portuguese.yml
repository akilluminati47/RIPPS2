  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: O Fast Boot está ativo. Os sons ocupam %d KB e o cartão de memória de onde o RIPPS2 corre tem %d KB livres, por isso ficam em %s.
