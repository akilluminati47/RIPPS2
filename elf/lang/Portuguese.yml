  RIPPS2_LAUNCH_DISC: Disco ao iniciar
  HINT_RIPPS2_LAUNCH_DISC: O disco de um jogo aparece ao iniciá-lo. Aparecer pousa e desaparece; Girar gira cada vez mais rápido até o jogo começar; Ampliar pousa e depois cresce para se ler bem e fica.
  RIPPS2_TRANSITION: Transição de página
  HINT_RIPPS2_TRANSITION: 'Como uma página nova chega quando você vai para outra categoria: a partir da cor de fundo do tema, ou de um clarão. Tema mantém a escolha do tema.'
