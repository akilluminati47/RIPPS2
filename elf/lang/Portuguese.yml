  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Execute o cliente xeRAbora num PC da mesma rede, conectado à sua conta do RetroAchievements. Depois, para um jogo em USB, MMCE, SMB ou no disco rígido: abra o menu do jogo (TRIÂNGULO) e VERIFIQUE O SUPORTE DO JOGO. Um jogo acompanhado ganha o emblema RA; com a TELEMETRIA ligada, inicie-o e os desbloqueios aparecem por cima do jogo. Para um disco na bandeja, use VERIFICAR O DISCO e depois JOGAR O DISCO COM CONQUISTAS. Jogos iniciados pelo Neutrino, POPSTARTER ou Ember ainda não são acompanhados.'
