  RIPPS2_BIOS_SOUNDS: Sons da BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Grava os sons de menu desta consola, tirados da BIOS, na pasta AUDIO como sons do RIPPS2 (menos de 1 MB). A música do menu tem a própria extração: Música da BIOS.'
  RIPPS2_RIP: Extrair
  RIPPS2_HINTS_GLYPHS: Dicas e ícones
  HINT_RIPPS2_HINTS_GLYPHS: Como as dicas de botões e os ícones aparecem. Cada linha começa em Tema, a escolha do tema; qualquer outra escolha é sua e vale acima de todo tema.
  RIPPS2_HINT_LAYOUT: Layout das dicas
  HINT_RIPPS2_STARSIDE: 'Onde fica a estrela de um jogo favorito na lista. Esquerda: uma coluna própria no início de cada linha. Direita: depois do título. Oculto (o inicial): sem estrela nem coluna, os títulos por inteiro. Tema: o que o tema disser. R3 marca um jogo de qualquer forma; mantenha R3 4 segundos numa lista para ocultar as estrelas ou trazê-las de volta (isso também marca o jogo sob o cursor).'
  HINT_RIPPS2_HINT_LAYOUT: 'Linha: as dicas numa linha. Coluna: uma dica por linha, numa lista ao lado, começando onde o tema põe as dicas dele.'
