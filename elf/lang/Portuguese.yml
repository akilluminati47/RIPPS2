    - O RIPPS2 é copiado para %s.

    - O programa de arranque do disco rígido que está agora em __mbr é lido e guardado em %s/RIPPS2 (RESTAURAR o devolve).

    - A versão para disco rígido do PS2BBL é gravada no lugar dele, e a consola é ajustado para iniciá-la ao ligar.

    - A configuração dele (%s) inicia o RIPPS2 de %s primeiro%s%s, com o BOOT LOCK ativado.

    Isso precisa de uma consola que arranque pelo disco rígido (um PS2 fat com o adaptador de rede). Deixe-o ligado até aparecer que terminou.'
