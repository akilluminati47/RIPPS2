  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'CẠNH RIPPS2: %sAUDIO%s, được đọc trước tiên khi khởi động'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL được máy gắn với thẻ này và ghi thành %s/%s.
  
    - Cấu hình của nó, mc%d:/SYS-CONF/PS2BBL.INI, chạy RIPPS2 ngay tại chỗ (%s) không chờ (0 ms, điều PS2BBL Extended không cho phép), BOOT LOCK bật. Bản thân RIPPS2 không bị sao chép.
  
    Bộ xử lý I/O khởi động lại cho việc này và mọi lần đọc ổ dừng cho đến khi xong; nhạc và các ổ sẽ quay lại sau. Giữ thẻ trong máy và máy bật cho đến khi báo xong.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Thẻ SD2PSX hoặc MMCE có thể tự bảo vệ sau một lần ghi bị từ chối: nếu giờ thẻ nhớ hoặc ổ MMCE biến mất, hãy tắt rồi bật lại máy.'
  BOOT LOCK ON: BOOT LOCK BẬT
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Xong: thẻ nhớ ở khe %d chạy thứ nó chạy trước BIBLE. BIBLE được giữ trong mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): THẺ NHỚ Ở KHE %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL không thể chạy RIPPS2 từ chỗ hiện tại (nó chỉ tới được thẻ nhớ, ổ USB và MX4SIO), và RIPPS2 không tự sao chép. Hãy đặt RIPPS2.ELF lên thẻ nhớ hoặc ổ USB rồi chạy từ đó, hoặc dùng PS2BBL Extended, vốn đọc được MMCE và ổ cứng.
  RESTORE SLOT %d'S OLD BOOT LOADER: KHÔI PHỤC TRÌNH NẠP CŨ Ở KHE %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE đã được cài trên thẻ nhớ ở khe %d (mc%d:/%s/%s), BOOT LOCK bật: khi bật máy nó chạy RIPPS2 từ %s ngay lập tức.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: đang cài BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: đang cài BIBLE
  
    RIPPS2 đang chạy từ %s, nơi PS2BBL không đọc được (nó đọc thẻ nhớ, USB và MX4SIO), và RIPPS2 không tự sao chép. Cấu hình PS2BBL Extended trên thẻ này (%s) đọc được: START bật BOOT LOCK để nó chạy RIPPS2 từ %s khi bật máy. Không có gì khác trên thẻ thay đổi.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: đang cài BIBLE
  
    RIPPS2 đang chạy từ %s, nơi PS2BBL không đọc được: nó chạy chương trình từ thẻ nhớ, ổ USB hoặc MX4SIO, và RIPPS2 không tự sao chép. Hãy đặt RIPPS2.ELF lên một trong số đó (thư mục APPS của thẻ nhớ, hoặc ổ USB), chạy từ đó, rồi cài lại BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: đang cài BIBLE
  
    Thẻ nhớ ở khe %d: BIBLE (mc%d:/%s) được dời sang một bên, và thứ nó đã thay (mc%d:/%s) trở về chỗ cũ. Không có gì bị xóa. Cấu hình PS2BBL giữ nguyên (BOOT LOCK có thể tắt khóa).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: đang cài BIBLE (gắn PS2BBL với thẻ nhớ)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: đang cài BIBLE (đưa lại thứ đã có)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: đang cài BIBLE (khởi động lại bộ xử lý I/O)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: đang cài BIBLE (ghi vào thẻ nhớ)'
  SET UP BIBLE: CÀI BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Thẻ nhớ ở khe %d còn trống %d KB, và BIBLE cần %d KB ở đó. Hãy giải phóng chút chỗ rồi thử lại.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Thẻ nhớ ở khe %d đã từ chối PS2BBL, nên RIPPS2 để thẻ như cũ. Kiểm tra chỗ trống rồi thử lại. (DIAG.TXT cạnh RIPPS2 có phản hồi của thẻ.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Thẻ nhớ ở khe %d không chịu dời BIBLE sang bên, nên không có gì thay đổi. (DIAG.TXT cạnh RIPPS2 có phản hồi của thẻ.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Thẻ nhớ ở khe %d không chịu nhận lại %s, nên BIBLE vẫn ở đó. (DIAG.TXT cạnh RIPPS2 có phản hồi của thẻ.)
  MUSIC: NHẠC
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s không có %s. RIPPOPS đã tìm thấy trình giả lập PS1 của Sony trên %s: START sao chép %s vào đây và chạy trò chơi.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 không thấy %s trong %s%s. POPSTARTER cần POPS_IOX.PAK cùng POPS.PAK, hoặc cùng POPS.ELF và IOPRP252.IMG: trình giả lập PS1 của Sony, từ chính máy của bạn. Nó có thể tìm thấy chúng ở nơi RIPPS2 không tìm (nếu trò chơi của bạn chạy được, là nó tìm thấy). START khởi chạy, và ổ này sẽ không bị hỏi lại.'
  ' (The configs found were set: %s.)': ' (Đã đặt các cấu hình tìm thấy: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Hãy lưu cài đặt của nó một lần bằng trình cấu hình riêng của nó, rồi bật lại BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s không thể chạy RIPPS2 từ chỗ nó đang ở (%s), và RIPPS2 không tự sao chép. Hãy đặt RIPPS2.ELF lên thẻ nhớ hoặc ổ USB rồi chạy từ đó.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK không ghi được cấu hình của trình khởi động. Hãy kiểm tra thẻ nhớ hoặc ổ không bị chống ghi, rồi thử lại.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK không tìm thấy cấu hình trình khởi động nào để thay đổi.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK đang tắt. Trình khởi động của bạn chạy thứ nó đã chạy trước đây (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK đang bật. Giờ %s chạy RIPPS2 khi bật máy (%s), và khi Vá IGR để trống, EXIT của trò chơi quay về theo cùng đường đó. Giữ một trong các nút của nó trong lúc máy khởi động để vào thứ khác.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK đã đặt RIPPS2 lên đầu menu của OSDMenu (%s). OSDMenu không tự chạy gì cả: hãy chọn RIPPS2 ở đó, và EXIT của trò chơi quay về menu ấy. Để máy chạy RIPPS2 ngay, BIBLE cài PS2BBL lên thẻ nhớ (Trình khởi động).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK hoạt động qua một trình khởi động trên thẻ nhớ (PS2BBL, FMCB hoặc OSDMenu), và ở đây không có.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Thẻ nhớ ở khe %d chạy %s khi bật máy, và BOOT LOCK không tìm thấy cấu hình nào của nó để thay đổi (nó tìm %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Thẻ nhớ ở khe %d chạy %s khi bật máy, thứ mà BOOT LOCK không thể đặt: nó hoạt động qua PS2BBL, FMCB và OSDMenu.'
