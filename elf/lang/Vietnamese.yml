  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Chạy ứng dụng xeRAbora trên một PC cùng mạng, đã đăng nhập tài khoản RetroAchievements của bạn. Sau đó, với trò chơi trên USB, MMCE, SMB hoặc HDD: mở menu trò chơi (TAM GIÁC) và chọn KIỂM TRA HỖ TRỢ TRÒ CHƠI. Trò chơi được theo dõi sẽ có huy hiệu RA; khi bật ĐO ĐẠC, chạy nó và các lần mở khóa sẽ hiện lên trên trò chơi. Với đĩa trong khay, dùng KIỂM TRA ĐĨA, rồi CHƠI ĐĨA CÓ THÀNH TÍCH. Trò chơi chạy qua Neutrino, POPSTARTER hoặc Ember chưa được theo dõi.'
