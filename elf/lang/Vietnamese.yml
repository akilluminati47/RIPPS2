  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'IGR Path %s không được dùng: sau khi chơi chỉ nạp được tệp trên thẻ nhớ hoặc USB, và không bao giờ là chính RIPPS2'
  an issue is the best way to get RIPPS2 updated.: mở issue là cách tốt nhất để RIPPS2 được cập nhật.
