  CAD_ONE_GAME: '%d trò chơi trong tài khoản'
  CAD_GAMES: '%d trò chơi trong tài khoản'
  CAD_GAME_PROGRESS: '%d / %d thành tích  |  %d hardcore'
  CAD_POINTS: '%d điểm  |  %s'
  CAD_EMPTY_LIBRARY: Tài khoản này không có trò chơi nào có tiến độ.
  CAD_EMPTY_FILTER: Không có thành tích nào khớp bộ lọc này.
