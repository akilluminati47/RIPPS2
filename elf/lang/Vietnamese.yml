  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: Nhạc menu (%s) nằm trong %s với tên %s. Cài đặt âm thanh > Nhạc liệt kê nó là Menu; nó phát khi không chọn bản nào khác.
  The menu music could not be written to %s (%s). Is the drive full?: Không ghi được nhạc menu vào %s (%s). Ổ đầy rồi sao?
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : 'Nhạc menu là WAV %s, và không thẻ nhớ nào chứa nổi. Ở đây RIPPS2 chạy từ thẻ nhớ và chưa có ổ nào có thư mục OPL được khởi động: hãy khởi động một ổ trong Lưu trữ, rồi trích nhạc vào đó.'
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: Nhạc menu của BIOS này không phải bản RIPPS2 biết. Không ghi gì cả.
  This BIOS's sound bank is not the one RIPPS2 knows. Nothing was written.: Ngân hàng âm thanh của BIOS này không phải loại RIPPS2 biết. Không ghi gì cả.
