  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE không chép được RIPPS2 vào phân vùng %s của HDD. Hãy kiểm tra dung lượng trống. Không thay đổi gì khác.
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE không giữ được bản sao chương trình khởi động của HDD, nên đã dừng trước khi thay nó. RIPPS2 đã được chép vào HDD; không thay đổi gì khác.
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE không ghi được cấu hình của nó (%s). Chương trình khởi động không bị thay đổi.
  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE không ghi được chương trình khởi động của HDD (bước %d). %s
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'BIBLE đã được cài trên HDD trong và BOOT LOCK đang bật: khi bật máy, máy chạy RIPPS2 ngay từ %s%s%s%s. Cấu hình: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE đã ở trên thẻ nhớ %d, nhưng không ghi được cấu hình (%s), nên nó chạy trình duyệt. Hãy giải phóng chút dung lượng rồi chạy lại QUẢN LÝ để hoàn tất.
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE hết bộ nhớ trước khi bắt đầu. Không thay đổi gì.
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE hết bộ nhớ. Không thay đổi gì trên thẻ nhớ.
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: đang chép RIPPS2 vào %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: đang giữ lại chương trình khởi động của HDD'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: đang đặt lại chương trình khởi động của HDD'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: đang ghi PS2BBL vào vùng khởi động của HDD'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'CÀI BIBLE LÊN HDD TRONG

    - RIPPS2 được chép vào %s.

    - Chương trình khởi động của HDD hiện ở __mbr được đọc ra và giữ trong %s/RIPPS2 (KHÔI PHỤC sẽ đặt nó lại).

    - Bản HDD của PS2BBL được ghi vào chỗ đó, và máy được đặt để chạy nó khi bật máy.

    - Cấu hình của nó (%s) chạy RIPPS2 từ %s%s%s trước, BOOT LOCK bật.

    Việc này cần một máy khởi động từ HDD (PS2 dày có bộ chuyển mạng). Giữ máy bật cho tới khi báo xong.'
  INTERNAL HDD  (its boot area): HDD TRONG  (vùng khởi động)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'ĐẶT LẠI CHƯƠNG TRÌNH KHỞI ĐỘNG CŨ CỦA HDD

    Bản BIBLE đã giữ (RIPPS2/MBR-BACKUP.KELF trên HDD) trở lại __mbr, thay chỗ BIBLE. RIPPS2 và cấu hình PS2BBL vẫn ở nguyên chỗ.'
  RESTORE: KHÔI PHỤC
  RESTORE THE HDD'S OLD BOOT PROGRAM: KHÔI PHỤC CHƯƠNG TRÌNH KHỞI ĐỘNG CŨ CỦA HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 không xác định được vùng của máy này từ ROM, nên không biết nó đọc thư mục cập nhật hệ thống nào. BIBLE chưa được cài.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 không mở được phân vùng __sysconf hay __common của HDD (lỗi %d), nên BIBLE không có chỗ để giữ RIPPS2 và cấu hình của nó. Không thay đổi gì.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 không đọc được chương trình khởi động đã giữ. Không thay đổi gì.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 không ghi lại được chương trình khởi động. Hãy thử lại; bản sao đã giữ vẫn nguyên.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 đang bận đọc một ổ nên không khởi động lại được bộ xử lý I/O. Không thay đổi gì: hãy thử lại sau giây lát.'
  Reading the memory cards: Đang đọc thẻ nhớ
  The HDD partition BIBLE uses went away. Nothing was changed.: Phân vùng HDD mà BIBLE dùng đã biến mất. Không thay đổi gì.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Chương trình khởi động cũ của HDD đã trở lại. BIBLE không còn chạy từ HDD nữa.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Bản có trước đó được giữ trong RIPPS2/MBR-BACKUP.KELF trên HDD: TRÌNH KHỞI ĐỘNG > QUẢN LÝ > KHÔI PHỤC sẽ đặt nó lại.'
  The security module would not start on this console. Nothing on the memory card was changed.: Mô-đun bảo mật không khởi động được trên máy này. Không thay đổi gì trên thẻ nhớ.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Không khe nào có thẻ nhớ PS2 đã định dạng, và cũng không có HDD trong. BIBLE nằm trên thẻ nhớ hoặc HDD: hãy cắm một thẻ rồi thử lại.'
  There is no kept boot program on this HDD. Nothing was changed.: HDD này không có chương trình khởi động nào được giữ. Không thay đổi gì.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : HDD này không có phân vùng __sysconf, nên cấu hình của BIBLE phải nằm trên thẻ nhớ (PS2BBL đọc của thẻ trước), mà không khe nào có thẻ. Hãy cắm một thẻ rồi thử lại.
