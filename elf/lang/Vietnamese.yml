  CAD_CONNECTION_ERROR: Không truy vấn được Caduceus. Hãy kiểm tra kết nối, rồi nhấn Select để thử lại.
  CAD_BACK_REFRESH: Quay lại để về OPL. Select làm mới trang này.
  CAD_LIBRARY_CONTROLS: 'L1/R1: trang   Xác nhận: mở   Select: làm mới'
  CAD_GAME_CONTROLS: 'L1/R1: trang   Vuông: lọc   Select: làm mới'
  CAD_BACK: Quay lại
  CAD_UNTRACKED: Caduceus chưa sẵn sàng. Lần này chạy không có thành tích.
  PS1_RA_USB_REQUIRED: Thành tích PS1 cần VCD trên USB chạy qua POPStarter
  PS1_RA_REMOVE_PREVIOUS: Không gỡ được mô-đun thành tích PS1 trước đó
  PS1_RA_PREPARE_FAILED: Không chuẩn bị được thành tích PS1. Hãy giữ hoặc dời POPS/MODULE_9.IRX và kiểm tra quyền ghi của thiết bị.
  PS1_RA_CLEAN_DELETE: 'Mô-đun RA của RiptOPL không dùng tới: POPS/MODULE_9.IRX. Xóa để chạy sạch?'
  PS1_RA_CLEAN_FAILED: Không xóa được mô-đun RA không dùng tới.
  PS1_RA_CLEAN_CONTINUE: Vẫn tiếp tục? Mô-đun RA còn sót có thể chạy đo đạc cũ. Không sẽ hủy việc chạy.
  FAV_REMOVED: Đã gỡ khỏi Trò chơi gắn sao
  FAV_REMOVE_FAILED: Không gỡ được khỏi Trò chơi gắn sao
  POPS_UDPFS_SETTINGS: Cài đặt mạng POPS UDPFS
  POPS_UDPFS_DISCOVERY: Lưu vào mọi thư mục POPS trên USB. Máy chủ 0.0.0.0 dùng tự tìm.
  POPS_UDPFS_NOT_READY: POPS UDPFS cần IPCONFIG.DAT và UDPFSCONFIG.DAT hợp lệ, khớp nhau trong mọi thư mục POPS trên USB. Hãy đặt chúng trong Cài đặt mạng POPS.
  HINT_POPS_UDPFS_IP: IP tĩnh của PS2 mà trình điều khiển POPS UDPFS dùng sau khi đặt lại IOP.
  POPS_UDPFS_ALL_USB_FOLDERS: Mọi thư mục POPS trên USB
  POPS_UDPFS_INVALID_SUFFIX: ' (không hợp lệ)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (chưa đủ)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS cần cặp trình điều khiển .udpfs được cài trên thẻ nhớ. Hãy cài thủ công hoặc bật BDMA Áp dụng khi chạy.
  VMC_REPLACE_REQUIRES_DELETE: Đổi kích thước VMC sẽ xóa các bản lưu trong đó. Hãy sao lưu VMC có sẵn và dùng Xóa trước khi tạo kích thước mới.
  VMC_CREATE_FAILED: Không tạo được VMC. Hãy kiểm tra thiết bị, kết nối và quyền ghi. Bản lưu có sẵn không bị thay.
  RA_EXPERIMENTAL_CARDS: Thẻ thử nghiệm Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Thẻ thành tích thử nghiệm bên trong trò chơi PS2. Có thể nhấp nháy hoặc làm treo trò chơi. Chỉ Caduceus; Tắt thì dùng nhịp vàng. Có hiệu lực từ lần chạy trò chơi tiếp theo.
  RA_NEUTRINO_UNTRACKED: Lần chạy này không dùng được Neutrino RA. Hãy kiểm tra phần chạy RA, IP đồng hành và danh sách theo dõi đã lưu. Chạy không có thành tích.
  UDPFS_IP_CONFLICT: Một thiết bị khác trong mạng đang dùng địa chỉ IP của PS2 này, nên phản hồi của máy chủ UDPFS đi tới nó. Hãy đặt IP khác cho PS2 trong Cài đặt mạng.
  XERA_ACHIEVEMENTS: Thư viện RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Hãy duyệt trò chơi này qua thư viện RetroAchievements ở menu chính.
  XERA_OPEN_NETWORK: Không kết nối được xeRAbora. Hãy bật OPEN TO THE NETWORK trong cài đặt của nó, kiểm tra IP đồng hành RA và tường lửa PC.
  XERA_UNKNOWN_GAME: xeRAbora không biết ảnh đĩa này. Hãy chạy kiểm tra hỗ trợ trò chơi RA trước.
  XERA_NOT_PLAYED: Chưa có trong thư viện RetroAchievements của bạn. Hãy chơi một lần có thành tích, rồi nhấn Select.
  XERA_CONNECTION_ERROR: Không đọc được danh sách từ xeRAbora. Nhấn Select để thử lại.
  CAD_PAIR_UDPFS: Không kết nối được Caduceus. Hãy ghép cặp ART/CADUCEUS.KEY trong thư mục PS2-Servers chia sẻ, và đặt IP đồng hành RA.
  RA_WL_NOT_SAVED: Không lưu được danh sách theo dõi. Hãy chắc thiết bị hoặc thư mục chia sẻ của trò chơi ghi được, rồi kiểm tra lại.
  RA_UDPFS_LOAD_FIRST: Hãy mở trang UDPFS một lần để nạp mô-đun mạng của nó, rồi thử lại.
  CAD_UDPFS_IMG: 'Trình duyệt Caduceus cần SMB hoặc UDPFS Tệp: UDPFS IMG không có thư mục chia sẻ để chứa khóa của nó.'
  XERA_SET_CLOCK: Chưa có trong thư viện RetroAchievements của bạn. Hãy đặt đồng hồ máy trong cài đặt hệ thống để xem đủ danh sách, hoặc chơi một lần có thành tích.
  CFG_TITLES: Hiện tiêu đề CFG trong danh sách trò chơi
  HINT_CFG_TITLES: Hiện Tiêu đề trong CFG của mỗi trò chơi thay cho tên tệp, và sắp xếp theo nó. Đọc mọi CFG khi làm mới danh sách, nên danh sách nạp chậm hơn. Chỉ ảnh hưởng hiển thị.
  AUTO_VMC_INVALID: Tệp VMC của trò chơi này có tồn tại nhưng không phải thẻ nhớ hợp lệ, nên không được dùng hay thay. Trò chơi chạy không có VMC; hãy kiểm tra nó trong menu VMC.
  AUTO_VMC_STILL_RUNNING: VMC của trò chơi này vẫn đang được tạo. Hãy chạy lại trò chơi sau giây lát.
  NEUTRINO_DVR_QUICKBOOT: Chạy DVR cần chuyển sang chế độ PSX. Hãy bỏ -qb khỏi tham số Neutrino chung và theo trò chơi.
  NEUTRINO_DVR_FILE_MISSING: 'Bản cài Neutrino cho DVR chưa đủ. Thiếu tệp cần thiết:'
  LOGOART: Ảnh logo
  HINT_LOGOART: Hiện logo của trò chơi (<ID>_LGO) khi chủ đề dùng nó. Tắt cũng ẩn hình mặc định của nó, nhưng giữ ảnh bìa, ảnh đĩa và ảnh nền.
  PARENLOCK_GAME: Khóa phụ huynh
  PARENLOCK_GAME_HINT: Yêu cầu mật khẩu khóa phụ huynh để chạy trò chơi này.
  PARENLOCK_GAME_NO_PASSWORD: Hãy đặt mật khẩu khóa phụ huynh, nếu không trò chơi này sẽ không bị khóa.
  HINT_ENABLE_PCCF: CompactFlash qua PC CARD của PS2 Nhật đời đầu. Chỉ trò chơi PS2 gốc; CF cần độc quyền truy cập PC CARD. Khởi động lại để nhả nó.
  PCCF_GAMES: Trò chơi PC CARD CF
  PCCF_UNAVAILABLE: 'Không dùng được CF: cần PS2 Nhật đời đầu có PC CARD, thẻ tương thích, và không có trình điều khiển DEV9/HDD/mạng nào đang chạy.'
  PCCF_UNSUPPORTED_GAME: Hiện CF chỉ hỗ trợ trò chơi PS2 gốc. VMC trên CF, nạp PS1 và thành tích qua mạng không dùng được.
  HINT_ENABLE_DVR: Tìm ISO DESR DVR thử nghiệm. Cần bật nguồn HDD; chạy trò chơi cần Neutrino bên ngoài có hỗ trợ DVR.
  HINT_RIPPS2_IGR_PAGE: Menu trong trò chơi, RIPSHOT và cách tráng ảnh.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Ảnh chụp màn hình từ menu trong trò chơi, vào ART cho giao diện của bạn hoặc vào MEDIA.
  RIPPS2_DEVELOP_SHOTS: Tráng ảnh
  HINT_RIPPS2_DEVELOP_SHOTS: Cách ảnh đang chờ trên cuộn của mỗi trò chơi thành PNG.
  RIPPS2_SETTINGS_HOME: Lưu cài đặt vào
  HINT_RIPPS2_SETTINGS_HOME: 'Nơi RIPPS2 giữ cài đặt: bản lưu riêng trên thẻ nhớ, thư mục RIPPS2 trên một ổ (HDD trong, USB, MX4SIO, iLink hoặc MMCE), hoặc thư mục bạn gõ.'
  RIPPS2_LAUNCHERS: Trình khởi chạy
  RIPPS2_LOOK_NOW: Tìm ngay
  HINT_RIPPS2_LOOK_NOW: RIPPS2 tìm POPSTARTER, các tệp POPS, Ember, BIOS của Ember và Neutrino trên các ổ đã khởi động, và ghi nhớ vị trí của từng thứ. Mỗi lần khởi chạy đều đọc chúng từ đó.
  RIPPS2_HIDE_GAME: Ẩn trò chơi
  RIPPS2_HIDDEN_GAMES: Trò chơi đã ẩn
  HINT_RIPPS2_HIDDEN_GAMES: Các trò chơi đã ẩn bằng Ẩn trò chơi, trên các ổ đã khởi động. Hiện lại một trò, hoặc xóa nó. Mỗi ổ giữ danh sách riêng.
  HINT_RIPPS2_BDM_DEVICES: 'Các ổ BDM đọc game: USB, MX4SIO, PC Card CF, ổ DVR của DESR và iLink. HDD bên trong theo chế độ khởi động HDD.'
  HINT_RIPPS2_SCREEN: 'Hình ảnh menu: chế độ video, màn hình rộng, vị trí trên TV (H-POS, V-POS) và overscan.'
  HINT_RIPPS2_LAYOUT: Vị trí các mục và cách một trang hiện vào, rồi bìa của RIPFLOW và lưới của RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Độ đậm chữ, chủ đề màu, chuyển màu và mọi màu.
  HINT_RIPPS2_TEXT_WEIGHT: 'Chữ riêng của RIPPS2 đậm cỡ nào: chú giải trong Cài đặt, TRẠNG THÁI và Giới thiệu. Thường giữ như cũ; Đậm dễ đọc hơn trên hình mềm. Phông riêng của chủ đề giữ độ đậm mà chủ đề đặt cho chúng.'
  HINT_RIPPS2_HDD_START: 'HDD trong, APA hoặc exFAT: RIPPS2 đọc loại nào cũng được và hiện nó một lần, dưới tên Trò chơi trên HDD. Tự động (nhanh nhất khi có ổ) khởi động nó lúc bật máy; Tắt thì để yên.'
  HINT_RIPPS2_THEME_COLOR: Màu riêng của chủ đề. Chọn Tùy chỉnh làm chủ đề màu để tự chọn, giống màu chữ.
  HINT_RIPPS2_SWEEP: Năm màu mà chủ đề chuyển qua, chậm và mượt. Cầu vồng, một chuyển màu từ mỗi chủ đề màu, hoặc của bạn. Tắt giữ chủ đề đứng yên.
  HINT_RIPPS2_SWEEP_COLORS: Năm màu của chuyển màu và tốc độ. Đổi một cái của RIPPS2 thì nó được giữ làm của bạn, với tên bạn đặt.
  HINT_RIPPS2_SWEEP_NAME: Tên chuyển màu của bạn trong danh sách Chuyển màu.
  HINT_RIPPS2_SWEEP_COLOR: Một trong năm màu mà chuyển màu lần lượt đi qua.
  HINT_RIPPS2_SWEEP_SPEED: 'Mỗi màu kéo dài bao lâu trước khi màu kế tiếp hiện vào. Ngay cả Sôi động vẫn mượt: màu không bao giờ nhấp nháy.'
  RIPPS2_HIDE_COMPRESS: Ẩn trò chơi và nén
  HINT_RIPPS2_SELECT_HOLD: 'Giữ SELECT 4.2 giây trên danh sách trò chơi. Danh sách: các chủ đề trong một bảng, chọn một. Xoay vòng: chủ đề tiếp theo. Tắt: không làm gì (nhấn vẫn làm mới).'
  RIPPS2_RECENT_GAMES: Trò chơi gần đây
  RIPPS2_SET_METADATA_RENAME: Đặt siêu dữ liệu (đổi tên)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Ưu tiên tay cầm (thử nghiệm)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX đọc qua bus dùng chung với tay cầm, và trong lúc đọc thì tay cầm không được nghe: nút bấm bị trễ hoặc mất khi bìa đang tải. Bật: bìa tới từng phần nhỏ, xen giữa là đọc tay cầm, chậm hơn một chút. Tắt: nhanh hết mức thẻ cho phép. Khi các nguồn của thẻ ở Tự động, danh sách của nó tải một lần, lúc khởi động.'
  HINT_RIPPS2_TRUST_CACHE: 'Một danh sách hiện từ bộ nhớ đệm giữ nguyên như vậy, sẵn sàng để chạy, cho tới khi bạn nhấn SELECT hoặc RIPPS2 tự thay đổi nguồn đó. Tắt: mỗi nguồn được đọc lại trong nền sau khi bộ nhớ đệm hiện, một quãng dừng cảm nhận được trên thẻ MMCE hoặc MX4SIO, vốn dùng chung bus với tay cầm.'
  RIPPS2_STATUS_OPEN: Tải và các ổ
  HINT_RIPPS2_STATUS_OPEN: 'Mở TRẠNG THÁI: khởi động đọc cài đặt và danh sách trò chơi ở đâu, chỗ nào nhanh nhất, EXIT của trò chơi đi đâu, và mọi ổ. CÀI ĐẶT BỘ NHỚ ĐỆM ở đó đưa về đây.'
  RIPPS2_BADGE_SET: Bộ huy hiệu
  HINT_RIPPS2_BADGE_SET: 'Các huy hiệu trên trang thông tin trò chơi (xếp hạng, người chơi, ESRB, chế độ video, quét, tỉ lệ). RIPPS2: bộ riêng của nó, giống nhau trên mọi chủ đề. Chủ đề: hình riêng của chủ đề, hoặc của RIPPS2 khi chủ đề yêu cầu.'
  RIPPS2_HINT_FADE: Mờ dần gợi ý và biểu tượng
  HINT_RIPPS2_HINT_FADE: 'Gợi ý nút hoặc biểu tượng nào thay đổi sẽ hiện dần, như bìa, ngay lúc thay đổi; những cái giữ nguyên thì để yên, trên mọi trang và thông báo. Tắt: chúng chỉ xuất hiện. Chủ đề: chủ đề quyết định (bật, trừ khi ghi hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Kiểu thanh bên
  HINT_RIPPS2_SIDEBAR_STYLE: 'Cổ điển (tách): biểu tượng trong dải tối của thanh bên, kèm dải màu bên cạnh. XL (liền một khối): một dải rộng hơn, biểu tượng ở giữa. Chủ đề: chủ đề quyết định.'
  HINT_EXITPATH: 'Nơi EXIT trong Menu trong game dẫn đến. Tốt nhất để trống: EXIT dẫn đến trình duyệt, nơi khởi động trình nạp khởi động của bạn (FreeMcBoot, PS2BBL, OSDMenu hoặc BIBLE) khi có cài, và lại vào RIPPS2 khi bật BOOT LOCK, như lúc bật máy; nếu không có, là trình duyệt PS2. ELF nhập ở đây chỉ được dùng khi lần đặt lại có thể nạp nó (trên thẻ nhớ hoặc ổ USB FAT32) và không phải chính RIPPS2; mọi thứ khác dẫn đến trình duyệt.'
  HINT_BDM_START: 'USB, iLink, MX4SIO và HDD exFAT. Tự động khởi động chúng lúc bật máy: nhanh nhất cho các ổ đang cắm, trò chơi của chúng có trong Tất cả trò chơi ngay từ đầu. Thủ công khởi động chúng khi bạn mở trang của chúng.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino không dùng được VMC trên HDD APA (exFAT, USB và MX4SIO thì được): trò chơi này chạy với thẻ thật trong khe đó.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Khởi động chỉ đọc ổ của RIPPS2: cài đặt và âm thanh cạnh RIPPS2.ELF (RIPPS2.FB ở đó cho biết nơi chứa) và mọi danh sách từ bộ nhớ đệm. Các ổ khác chờ: SELECT trên một trang khởi động các ổ của nó và tải ảnh của chúng (khi bật Tự động làm mới, chúng khởi động lúc mở máy). Bật lên sẽ sao chép âm thanh của bạn, và nhạc nếu còn chỗ, vào AUDIO cạnh RIPPS2.'
  RIPPS2_ART_PACK: Gói ART
  RIPPS2_ART_PACK_BUILD: Tạo hoặc xóa
  HINT_RIPPS2_ART_PACK: Gói thư mục ART của mọi ổ đã khởi động vào một art.tar trên ổ bạn chọn (ổ nhanh nhất được đề xuất trước). Bìa khi đó được tải từ một tệp với một chỉ mục, không bao giờ tìm từng trò chơi, nên menu và nhạc luôn mượt. Các thư mục ART giữ nguyên.
  RIPPS2_LIST_CFG_TEXT: Tiêu đề và mô tả trong danh sách
  HINT_RIPPS2_LIST_CFG_TEXT: 'Tiêu đề và mô tả của trò chơi từ CFG của nó cạnh danh sách. Chủ đề: theo chủ đề hiển thị (chủ đề riêng của RIPPS2 ẩn chúng). Trang thông tin luôn giữ chúng.'
  RIPPS2_PS1_PREFER: Trùng lặp PS1
  HINT_RIPPS2_PS1_PREFER: 'Trò chơi PS1 vừa là VCD của POPSTARTER vừa là ảnh đĩa Ember. Cả hai: hai dòng. Ember: chỉ dòng Ember. POPSTARTER: chỉ VCD. Cùng tiêu đề, bỏ qua ID đĩa đứng đầu, là cùng một trò chơi.'
  RIPPS2_MY_PADS: Tay cầm của tôi
  HINT_RIPPS2_MY_PADS: 'Các hồ sơ .pad trong thư mục PADS cạnh RIPPS2: mỗi tay cầm USB một tệp văn bản, đặt tên theo ID của nó (2563_0575.pad), và mỗi tệp đều được kiểm tra. Tay cầm có hồ sơ điều khiển menu và chơi trong game (bật Pad Emulator).'
  RIPPS2_PAD_SETUP: Thiết lập tay cầm USB
  HINT_RIPPS2_PAD_SETUP: Cắm một tay cầm USB mà RIPPS2 chưa biết, nhấn từng nút nó yêu cầu, và RIPPS2 ghi tệp .pad của nó vào PADS. SELECT trên tay cầm PS2 bỏ qua một nút.
