  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot đang bật. Âm thanh chiếm %d KB và thẻ nhớ RIPPS2 đang chạy còn trống %d KB, nên chúng ở lại %s.
