  HINT_RIPPS2_SOURCE_NAME: 'Tên nguồn phía trên các trò chơi (TẤT CẢ TRÒ CHƠI, TRÒ CHƠI HDD, v.v.). Mờ khi rảnh làm nó mờ cùng thanh danh mục; Bật ra thì hiện nó thật to giữa trang, như cách L3 gọi tên danh sách, ở danh sách đầu tiên sau khi khởi động và mỗi lần đổi nguồn, rồi mờ đi. Bật ra và tên làm cả hai. Chủ đề có thể lấy Bật ra làm Hiện của mình. Chủ đề: chủ đề quyết định.'
  RIPPS2_RECENTS: Trò chơi gần đây
  HINT_RIPPS2_RECENTS: 'Trò chơi gần đây, một trang trong thanh bên với các trò chơi bạn chạy gần nhất, mới nhất trước: giữ bao nhiêu, từ 1 tới 99 (Tam giác để nhập số). Trò chơi có ổ ở Thủ công sẽ khởi động ổ đó khi bạn chọn nó. 0 tắt trang.'
  RIPPS2_CATEGORY_ORDER: Thứ tự danh mục
  HINT_RIPPS2_CATEGORY_ORDER: 'Đổi chỗ Chạy đĩa và Tệp bộ nhớ: Tệp bộ nhớ trước và Chạy đĩa sau cùng, cả ở tên trên thanh lẫn biểu tượng thanh bên. Làm cho RIPFLOW (Giao diện > Chủ đề). Chủ đề: chủ đề quyết định.'
  RIPPS2_MUSIC: Nhạc
  HINT_RIPPS2_MUSIC: Phát các tệp bgm trong thư mục AUDIO cạnh RIPPS2 và trong thư mục AUDIO của OPL trên mỗi ổ đã khởi động (Ogg không thẻ, hoặc WAV 16-bit); tệp tên Menu phát trước. Nhạc riêng của chủ đề sẽ phát thay thế.
  RIPPS2_BIOS_SOUNDS: Âm thanh BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Ghi âm thanh menu riêng của máy này từ BIOS vào thư mục AUDIO làm âm thanh của RIPPS2 (dưới 1 MB). Nhạc menu được trích riêng: Nhạc BIOS.'
  RIPPS2_RIP: Trích xuất
  RIPPS2_HINTS_GLYPHS: Gợi ý và biểu tượng
  HINT_RIPPS2_HINTS_GLYPHS: Diện mạo của gợi ý nút và biểu tượng. Mỗi dòng bắt đầu ở Chủ đề, tức lựa chọn của chủ đề; mọi lựa chọn khác là của bạn và thắng mọi chủ đề.
  RIPPS2_HINT_LAYOUT: Bố cục gợi ý
  HINT_RIPPS2_STARSIDE: 'Ngôi sao của trò chơi yêu thích nằm ở đâu trong danh sách. Trái: cột riêng ở đầu mỗi hàng. Phải: sau tên. Ẩn (mặc định): không sao, không cột, tên hiện đầy đủ. Chủ đề: theo chủ đề. R3 luôn đánh dấu yêu thích một trò chơi; giữ R3 4 giây trên danh sách để ẩn các ngôi sao hoặc hiện lại (việc này cũng đánh dấu trò chơi dưới con trỏ).'
  HINT_RIPPS2_HINT_LAYOUT: 'Hàng: các gợi ý trên một dòng. Cột: mỗi dòng một gợi ý, một danh sách dọc một bên, bắt đầu ở chỗ chủ đề đặt gợi ý.'
  RIPPS2_HINT_LABELS: Nhãn gợi ý
  HINT_RIPPS2_HINT_LABELS: Chỉ biểu tượng chỉ vẽ các nút, cho biểu tượng đã có chữ riêng. Huy hiệu ghép biểu tượng và tên của mỗi gợi ý vào một huy hiệu.
  RIPPS2_HINT_MENU: Gợi ý Menu (START)
  RIPPS2_HINT_REFRESH: Gợi ý Làm mới (SELECT)
  RIPPS2_HINT_STAR: Gợi ý Gắn sao (R3)
  RIPPS2_HINT_VIEW: Gợi ý Xem (L3)
  HINT_RIPPS2_HINT_SHOW: Hiện hoặc ẩn gợi ý này. Nút của nó vẫn dùng được.
  RIPPS2_GLYPH_SET: Bộ biểu tượng
  HINT_RIPPS2_GLYPH_SET: 'Biểu tượng nút trên mọi trang: của chủ đề, của RIPPS2, Tiêu chuẩn (nút tối, ký hiệu màu) hoặc Trắng (trắng đặc).'
  RIPPS2_HINT_ORDER: Thứ tự gợi ý
  HINT_RIPPS2_HINT_ORDER: Sắp xếp các gợi ý. Chủ đề giữ thứ tự của chủ đề; Thứ tự của bạn là thứ tự đặt ở đây.
  RIPPS2_HINT_ORDER_FOLLOW: Thứ tự
  RIPPS2_GRID_LAYOUT: Bố cục lưới
  HINT_RIPPS2_GRID_LAYOUT: Một trang Lưới chứa bao nhiêu ảnh bìa, với khoảng cách của RIPPS2. Chủ đề giữ bố cục riêng của chủ đề.
  RIPPS2_LAUNCH_DISC: Đĩa khi chạy
  HINT_RIPPS2_LAUNCH_DISC: Đĩa của trò chơi xuất hiện khi nó chạy. Bật ra hạ xuống rồi mờ đi; Xoay quay ngày càng nhanh cho tới khi trò chơi bắt đầu; Phóng to hạ xuống rồi lớn dần cho dễ đọc và giữ nguyên.
  RIPPS2_TRANSITION: Chuyển trang
  HINT_RIPPS2_TRANSITION: 'Trang mới hiện ra thế nào khi bạn sang danh mục khác: từ màu nền của chủ đề, hoặc từ một chớp sáng. Chủ đề giữ lựa chọn của chủ đề.'
  RIPPS2_CATEGORY_LAYOUT: Bố cục danh mục
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Ba danh mục nằm ở đâu: tên của chúng ở trên cùng, hoặc biểu tượng dọc thanh bên, mỗi cái có ngăn kéo chứa các trang của nó (Trái trên danh sách đi tới đó), hoặc Menu: không có thanh, các danh mục nằm trong menu START như chủ đề làm cho OPL. Chủ đề giữ bố cục của chủ đề.'
  RIPPS2_CACHE: Bộ nhớ đệm
  HINT_RIPPS2_CACHE: 'Cách giữ danh sách trò chơi của mỗi nguồn để trang của nó mở ngay: Fast Cache, danh sách của HDD trong và Tự làm mới.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'Mỗi nguồn giữ danh sách trò chơi gần nhất của nó (RIPPS2.LST cạnh các thư mục CD và DVD) và hiện nó ngay khi nguồn trả lời. Trust Cache quyết định nguồn có được đọc lại sau đó hay không. Tắt: mỗi danh sách được đọc từ nguồn trước, như trước đây.'
  HINT_RIPPS2_VIGNETTE: Làm tối viền mọi ảnh bìa trừ ảnh đang chọn, để ảnh đang chọn nổi bật. Yếu bằng một nửa Đầy đủ.
  RIPPS2_GRID_WIDE: Bố cục lưới màn hình rộng
  HINT_RIPPS2_GRID_WIDE: Trang Lưới chỉ dùng cho hình 16:9 (Màn hình rộng, 720p, 1080i), nơi ảnh bìa vẽ hẹp hơn và xếp ngang được nhiều hơn. Chủ đề dùng bố cục riêng của chủ đề; Giống theo Bố cục lưới.
  RIPPS2_BGBLUR: Làm mờ nền
  HINT_RIPPS2_BGBLUR: Kính mờ làm nhòe ảnh nền của trò chơi mạnh cỡ nào. Chủ đề dùng mức riêng của chủ đề (Yếu trên RIPGRID và Adapt).
  HINT_RIPPS2_HINT_SLOT: Gợi ý ở vị trí này. Gợi ý từng ở đây sẽ chuyển sang vị trí cũ của gợi ý được chọn.
  PS1_SAVE_GUIDANCE: Bản lưu PS1 phụ thuộc vào Ember hoặc POPSTARTER; cài đặt VMC của PS2 không áp dụng.
  NEUTRINO_SHOW_ARGS: Hiện tham số chạy
  HINT_NEUTRINO_SHOW_ARGS: Trước mỗi lần chạy qua Neutrino, hiện mọi tham số Neutrino sẽ nhận và hỏi có tiếp tục không. Quay lại sẽ về menu mà không chạy.
  NEUTRINO_ARGS_CONFIRM: Neutrino sẽ chạy với các tham số này. Chạy?
  HINT_NARGS_EXTRA: Các cờ Neutrino khác, cách nhau bằng dấu cách, gửi sau mọi thứ ở trên. RIPPS2 luôn thêm -bsd và -dvd cho ổ và ISO của trò chơi, -mc0 và -mc1 cho VMC, -gsm cho chế độ video, và các chế độ tương thích riêng của trò chơi. Cờ có dòng riêng ở trên (như -logo) sẽ chuyển vào dòng đó khi lưu, và vẫn được gửi.
  HINT_RIPPS2_THEME: Diện mạo của mọi trang. Trong danh sách trò chơi, giữ SELECT 4,2 giây để sang chủ đề kế tiếp; nhấn nhanh SELECT vẫn làm mới danh sách.
  GAME_TYPE_LABELS: Hiện nhãn [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Không lưu được danh sách mã gian lận vào thư mục Neutrino, nên Neutrino không dùng được. Chạy không có mã gian lận?
  AUTO_CREATE_VMC: Tạo VMC ở lần chạy đầu
  HINT_AUTO_CREATE_VMC: "Chạy một trò chơi PS2 không có VMC ở khe 0 sẽ tạo thẻ 8 MB trên thiết bị của trò chơi, đặt tên như màn hình VMC gợi ý (dùng chung cho mọi đĩa của trò chơi), và gán nó. Với Neutrino thì không trên HDD APA (HDD exFAT thì được)."
  AUTO_VMC_CREATING: Đang tạo VMC của trò chơi này...
  AUTO_VMC_FAILED: Không tạo được VMC của trò chơi này. Trò chơi chạy mà không có VMC.
  RIPPS2_BIOS_MUSIC: Nhạc BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'Ghi nhạc menu của máy này (bản nhạc nền của trình duyệt, khoảng 15 MB dạng WAV) vào thư mục AUDIO bạn chọn: cạnh RIPPS2, hoặc thư mục của OPL trên một ổ đã khởi động. Quá lớn cho thẻ nhớ. Kích thước được hiện trước.'
  SAVE_ICONS: Biểu tượng bản lưu 3D
  HINT_SAVE_ICONS: Hiện biểu tượng bản lưu của trò chơi đang chọn, xoay tròn, ở chỗ chủ đề dành cho nó. Đọc VMC riêng của trò chơi trước, rồi tới thẻ nhớ.
  NETBOOT_RESTART_NOW: Giao thức mạng sẽ đổi sau khi khởi động lại. Lưu cài đặt và khởi động lại OPL ngay?
  HINT_NET_PROTOCOL: 'Dịch vụ mạng mà RiptOPL dùng: thư mục chia sẻ SMB, UDPFS, UDPBD hoặc HTTP. Đổi khỏi dịch vụ đang chạy cần khởi động lại.'
  HINT_UDPFS_ACCESS: Chỉ UDPFS. Tệp đọc từng ISO rời từ thư mục trò chơi của máy chủ; IMG đọc một ảnh đĩa như một ổ. SMB và HTTP luôn dùng Tệp, UDPBD luôn dùng IMG.
  HINT_SMB_VERSION: Phiên bản SMB dùng để nói chuyện với thư mục chia sẻ trên PC.
  HINT_NET_ADVANCED: Mở khóa Chế độ liên kết Ethernet và Cổng SMB để sửa.
  HINT_ETH_LINK_MODE: Ép tốc độ và chế độ song công của liên kết mạng. Hãy để Tự động trừ khi liên kết hay rớt.
  HINT_IP_ADDR_TYPE: Tĩnh dùng địa chỉ bên dưới; DHCP hỏi bộ định tuyến của bạn. UDPFS và UDPBD luôn dùng Tĩnh.
  HINT_PS2_IP: Địa chỉ IP riêng của PS2. Hãy chọn một địa chỉ không thiết bị nào khác dùng, cùng dải với PC của bạn.
  HINT_NETMASK: Mặt nạ mạng con, thường là 255.255.255.0.
  HINT_GATEWAY: Địa chỉ bộ định tuyến của bạn, thường cùng ba số đầu và kết thúc bằng .1.
  HINT_DNS: Địa chỉ máy chủ DNS. Thường giống cổng mạng.
  HINT_SMB_ADDR_TYPE: Kết nối PC qua địa chỉ IP hay qua tên NetBIOS (tên máy tính).
  HINT_SMB_ADDRESS: 'PC chia sẻ trò chơi của bạn: địa chỉ IP của nó, hoặc tên máy tính khi Kiểu địa chỉ là NetBIOS.'
  HINT_SMB_PORT: 'Cổng SMB. Phải khớp với PC: PS2 Servers dùng 1111, thư mục chia sẻ Windows và Samba dùng 445.'
  HINT_SMB_USER: Tên người dùng SMB. guest dùng được cho hầu hết thư mục chia sẻ.
  HINT_HTTP_SERVER: Địa chỉ IP của máy chủ trò chơi HTTP.
  HINT_HTTP_PORT: Cổng mà máy chủ trò chơi HTTP lắng nghe.
  HINT_HTTP_BASE: Thư mục trên máy chủ HTTP chứa games.csv. / là gốc của máy chủ.
  HINT_HTTP_TEST: Thử máy chủ HTTP với các giá trị ở trên và báo kết quả.
  HINT_RA_TELEMETRY: Công tắc chính của RetroAchievements. Tắt thì trò chơi chạy không có ngăn xếp mạng hay ảnh chụp trạng thái, giống bản dựng thường.
  HINT_RA_BADGES: Đánh dấu các trò chơi có thành tích trong danh sách. Vẫn tối khi đo đạc đang tắt.
  HINT_POPS_NET_BUTTON: Sửa các tệp mạng riêng của POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), thứ trò chơi PS1 qua SMB cần.
  HINT_POPS_IP_TYPE: 'Cách PS2 lấy địa chỉ khi trò chơi PS1 chạy qua SMB: Tĩnh hoặc DHCP.'
  HINT_POPS_IP: Địa chỉ IP của PS2 khi trò chơi PS1 chạy qua SMB.
  HINT_POPS_SMB_IP: Địa chỉ IP của PC chia sẻ trò chơi PS1 của bạn.
  HINT_POPS_SMB_SHARE: Tên thư mục chia sẻ trên PC đó chứa thư mục POPS.
  HINT_LASTPLAYED: Bắt đầu ở trò chơi bạn chạy lần trước.
  HINT_LANGUAGE: Ngôn ngữ menu. Thêm ngôn ngữ bằng cách đặt tệp lang_*.lng vào thư mục LNG.
  HINT_GSM_DEFAULTS_BUTTON: Các bản sửa chế độ video mọi trò chơi đều nhận, trừ khi nó có cài đặt GSM riêng.
  HINT_DEFDEVICE: Trang RiptOPL mở khi khởi động.
  HINT_MMCE_MODE: 'Trò chơi trên SD2PSX hoặc MemCard PRO2. Tự động khởi động nó lúc bật máy: nhanh nhất cho thẻ đang cắm, trò chơi của nó có trong Tất cả trò chơi ngay từ đầu. Thủ công khởi động nó khi bạn mở trang của nó, Tắt thì ẩn nó.'
  HINT_MMCE_SETTINGS_BUTTON: Khe, IGR bootcard, GameID và tùy chọn định thời cho MMCE.
  HINT_ENABLE_USB: Nạp trình điều khiển lưu trữ USB.
  HINT_ENABLE_MX4SIO: Nạp trình điều khiển bộ chuyển thẻ SD MX4SIO.
  HINT_ENABLE_ILINK: Nạp trình điều khiển lưu trữ iLink (FireWire).
  HINT_NETSTART: 'Khởi động mạng: Tự động khi bật máy, Thủ công khi bạn mở trang của nó. Tắt thì không động đến bộ chuyển mạng.'
  HINT_APPMODE: Trang Ứng dụng. Tự động khởi động khi bật máy, Thủ công khi bạn mở nó, Tắt thì ẩn nó.
  HINT_FAVMODE: Trang Trò chơi gắn sao. Tự động khởi động khi bật máy, Thủ công khi bạn mở nó, Tắt thì ẩn nó.
  HINT_BDMA_BUTTON: Trình điều khiển exFAT mà POPSTARTER dùng cho trò chơi PS1 trên USB, MX4SIO, MMCE, HDD hoặc iLink.
  HINT_VCD_LIST_BUTTON: 'Cách liệt kê trò chơi PS1: ẩn ID trò chơi, chỉ hiện đĩa 1, hiện phân vùng PP của HDD.'
  HINT_MMCE_SLOT: Thiết bị MMCE cắm ở khe thẻ nhớ nào. Tự động sẽ tìm nó.
  HINT_MMCE_GAMEID: Báo cho thiết bị MMCE trò chơi nào đang chạy, để nó chuyển sang thẻ nhớ của trò chơi đó.
  HINT_MMCE_COMM_BUTTON: Tùy chọn định thời cho liên kết MMCE. Chỉ đổi khi trò chơi bị treo hoặc nạp chậm.
  HINT_MMCE_PATH_BUTTON: Vị trí các thư mục trò chơi trên thẻ MMCE.
  HINT_MMCE_PREFIX: Thư mục con trên thẻ MMCE chứa CD, DVD và các thư mục OPL khác. Để trống thì dùng gốc của thẻ.
  HINT_GAME_TYPE_LABELS: Thêm [PS1] hoặc [PS2] trước mỗi tên trò chơi. Chỉ ảnh hưởng hiển thị.
  HINT_MENU_VMODE: Đầu ra video của menu. Trò chơi dùng GSM thay thế. Giữ Xác nhận để giữ chế độ mới.
  HINT_THEME: Diện mạo của menu. Chủ đề được đọc từ thư mục THM trên mỗi thiết bị.
  HINT_COVERFLOW_BUTTON: Số ảnh bìa, kích thước, hoạt ảnh và làm tối cho chủ đề Coverflow.
  HINT_ARTWORK_BUTTON: 'Những ảnh được nạp: ảnh bìa, ảnh đĩa, ảnh nền và biểu tượng bản lưu.'
  HINT_COLORS_BUTTON: Màu chữ, tô sáng, hộp thoại và nền.
  HINT_NOTIFICATIONS: Thông báo ngắn khi nạp tệp cấu hình, chủ đề hoặc ngôn ngữ.
  HINT_AUTOSORT: Sắp xếp danh sách trò chơi từ A đến Z. Tắt thì giữ thứ tự lúc tìm thấy.
  HINT_AUTOREFRESH: Thêm trò chơi từ thiết bị mới nối mà không cần làm mới thủ công.
  HINT_COVERART: Nạp ảnh bìa từ thư mục ART.
  HINT_DISCART: Hiện ảnh đĩa (<ID>_ICO). Tắt thì ẩn đĩa nhưng giữ ảnh bìa và ảnh nền.
  HINT_BGART: Hiện ảnh nền của trò chơi (<ID>_BG) khi chủ đề dùng nó.
  HINT_ART_TAR: Cũng đọc ảnh đóng gói trong ART/art.tar.
  HINT_ART_DELAY: Con trỏ dừng trên trò chơi bao lâu thì ảnh của nó mới nạp. Càng cao càng bỏ qua ảnh khi bạn cuộn nhanh.
  HINT_TXTCOLOR: Màu chữ menu thường.
  HINT_SELCOLOR: Màu của mục được tô sáng.
  HINT_UICOLOR: Sắc nền của hộp thoại.
  HINT_TITLECOLOR: Màu tiêu đề trò chơi trong danh sách.
  HINT_BGCOLOR: Màu nền menu.
  HINT_PLASCOLOR: Màu pha vào nền chuyển động.
  HINT_RESETCOLOR: Trả về màu có sẵn của RiptOPL, không phải màu của chủ đề.
  HINT_WIDESCREEN: Vẽ menu cho TV 16:9.
  HINT_XOFF: Dời menu sang trái hoặc phải trên màn hình. Được lưu riêng cho từng chế độ video.
  HINT_YOFF: Dời menu lên hoặc xuống trên màn hình. Được lưu riêng cho từng chế độ video.
  HINT_MENU_OVERSCAN: Thu menu vào trong nếu TV cắt mất mép. Được lưu riêng cho từng chế độ video.
  HINT_APPLYGAMEID: Hiện mã vạch khi trò chơi bắt đầu, để thiết bị Pixel FX, RetroGEM và PS2Digital đổi hồ sơ.
  HINT_NEUTRINO_DEFAULTS_BUTTON: Đường dẫn, chế độ video và tham số của Neutrino cho mọi trò chơi.
  HINT_OSD_DEFAULTS_BUTTON: Ngôn ngữ máy, kích thước màn hình và chế độ video truyền cho trò chơi.
  HINT_ENWRITEOP: Cho phép đổi tên và xóa trò chơi, và tạo VMC. Không bao giờ động đến bảng phân vùng HDD.
  HINT_DEBUG: 'Hỗ trợ nhà phát triển: màn hình màu khi trò chơi khởi động, và bộ đếm nạp ảnh trong menu.'
  HINT_BDMPREFIX: Thư mục con trên ổ USB, MX4SIO, iLink và exFAT chứa các thư mục trò chơi. Để trống thì dùng gốc của ổ.
  HINT_ETHPREFIX: Thư mục con trên thư mục chia sẻ SMB chứa các thư mục trò chơi. Để trống thì dùng gốc của thư mục chia sẻ.
  HINT_HDDGAMELISTCACHE: Nhớ danh sách trò chơi của HDD APA để các lần quét sau nhanh hơn.
  HINT_BDMCACHE: Bộ đệm đọc trước cho USB và các ổ BDM khác khi đang chơi. Lớn hơn có thể giúp truyền mượt hơn nhưng tốn bộ nhớ hơn.
  HINT_HDDCACHE: Bộ đệm đọc trước cho HDD trong khi đang chơi.
  HINT_SMBCACHE: Bộ đệm đọc trước cho SMB khi đang chơi.
  HINT_CORE_LOADER: Lõi cho trò chơi này khi cả hai đều được hỗ trợ. UDPFS/UDPBD chỉ dùng Neutrino; SMB/HTTP chỉ dùng <OPL>. Mặc định theo Chạy trò chơi.
  HINT_DMA_MODE: Chế độ truyền của HDD trong cho trò chơi này. Hạ xuống nếu trò chơi giật hoặc treo.
  HINT_DNAS_GAMEID: ID đĩa cho trò chơi trực tuyến DNAS. Nạp từ đĩa sẽ đọc nó từ đĩa gốc.
  HINT_LOAD_FROM_DISC: Đọc ID DNAS từ đĩa gốc trong ổ.
  HINT_ALTSTARTUP: Khởi động ELF này từ ảnh đĩa thay cho tệp mà SYSTEM.CNF chỉ định.
  HINT_VMC_DEFINE: Chọn, tạo hoặc đổi kích thước thẻ nhớ ảo của khe này.
  HINT_VMC_ACTION: Dùng chung cho khe này một thẻ dùng chung; Đặt lại xóa lựa chọn.
  HINT_VMC_NAME: Tên tệp thẻ, giữ trong thư mục VMC.
  HINT_VMC_CREATE: Tạo thẻ, hoặc áp kích thước mới cho nó.
  HINT_VMC_DELETE: Xóa tệp thẻ này.
  HINT_SETTINGS_SOURCE: Chung dùng cài đặt dùng chung; Theo trò chơi giữ các cài đặt này chỉ cho trò chơi này.
  HINT_PADMACRO_TOGGLE: Khi giữ nút chỉ làm chậm cần trong lúc bạn giữ nút; Bật tắt bằng nút thì bật và tắt nó.
  HINT_SFX: Hiệu ứng âm thanh của menu.
  HINT_BOOT_SND: 'Âm thanh khởi động khi RIPPS2 chạy. Bật: từ thư mục AUDIO, khi ổ của nó sẵn sàng. Bật (nhanh): một bản sao cạnh RIPPS2 trên thẻ nhớ mà nó khởi chạy (được đề nghị khi bạn chọn), phát khi các cột dâng lên. Vẫn phát khi hiệu ứng âm thanh tắt.'
  HINT_BGM: Phát nhạc của chủ đề, hoặc tệp Nhạc chủ đề mặc định của bạn.
  HINT_SFX_VOLUME: Âm lượng hiệu ứng âm thanh của menu.
  HINT_BOOT_SND_VOLUME: Âm lượng âm thanh khởi động.
  HINT_BGM_VOLUME: Âm lượng nhạc nền.
  HINT_SCROLL: Danh sách cuộn nhanh cỡ nào khi bạn giữ một hướng.
  HINT_SELECTBUTTON: 'Nút nào để xác nhận: Chéo hay Tròn.'
  HINT_XSENSITIVITY: Cần trái di con trỏ sang trái phải dễ cỡ nào. Tắt thì bỏ qua nó.
  HINT_YSENSITIVITY: Cần trái di con trỏ lên xuống dễ cỡ nào. Tắt thì bỏ qua nó.
  HINT_PADEMU_GLOBAL: DualShock 3/4 qua USB hoặc Bluetooth, và multitap, cho mọi trò chơi.
  HINT_PADMACRO_GLOBAL: Làm chậm cần, đảo trục và bắn liên thanh cho mọi trò chơi.
  HINT_COVERFLOW_DIM: Làm tối các ảnh bìa hai bên.
  HINT_OSD_ENABLE: Truyền các cài đặt bên dưới cho trò chơi. Tắt thì dùng cài đặt riêng của máy.
  HINT_OSD_TVASPECT: Dạng TV truyền cho trò chơi.
  HINT_OSD_VMODE: Chế độ video truyền cho trò chơi.
  DNAS_ID: ID DNAS
  NEUTRINO_PADEMU_WARN: Không dùng được giả lập tay cầm với Neutrino. Hãy dùng tay cầm PS2 hoặc nguồn hỗ trợ lõi <OPL>.
