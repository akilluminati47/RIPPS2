  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Việc gộp dừng giữa hai lần đổi tên: tệp .tar được giữ là %s và tệp gộp là %s. Hãy đổi tên lại bằng Tệp bộ nhớ.'
