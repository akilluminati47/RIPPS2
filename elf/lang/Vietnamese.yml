  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 không biết thư mục của nó ở đâu, nên không có chỗ để âm thanh.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 chơi nhạc menu của máy này, bản nhạc nền của trình duyệt (%d:%02d), từ chính các nốt của BIOS và ghi nó thành WAV %s vào %s; không thẻ nhớ nào chứa nổi. %s đã có ở đó sẽ bị thay. Mất một hai phút.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 đọc âm thanh từ chính BIOS của máy này và ghi chúng vào %s làm âm thanh của nó: con trỏ, xác nhận, hủy, trang, danh mục, thông báo, đĩa, lỗi, lưu, ổ và ngẫu nhiên, cùng nhạc khởi động và nhạc chạy trò chơi, chơi từ chính các nốt của BIOS. Các tệp trùng tên đã có ở đó sẽ bị thay.'
  Reading this console's menu music: Đang đọc nhạc menu của máy này
