# RIPPS2 in Vietnamese. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Vietnamese
strings:
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: đang cài BIBLE\nThẻ ở khe %d là thẻ SD2PSX hoặc MMCE. Thẻ BOOT của nó có thể chứa BIBLE thay cho PS2BBL đang có (cái đó được dời sang một bên trước, nguyên vẹn), nếu máy gắn BIBLE vào nó. Nếu việc gắn bị từ chối, thẻ không thay đổi gì, và thẻ có thể ngừng phản hồi cho đến khi tắt rồi bật lại máy. START gắn BIBLE vào nó."
  "BIND BIBLE": "GẮN BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT cạnh RIPPS2 có phản hồi của thẻ.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Dành cho thẻ nhớ PS2 tiêu chuẩn 8 MB (thẻ MagicGate, hoặc thẻ BOOT SD2PSX hay MMCE): thẻ ở khe %d. Khi bật máy, PS2BBL đọc cấu hình khe 1 trước khe 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Máy không chịu gắn BIBLE vào thẻ nhớ ở khe %d (bước MagicGate thất bại). Không thay đổi gì trên thẻ. Thẻ không chính hãng hoặc không tương thích MagicGate không chứa được bản cập nhật hệ thống."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Thẻ SD2PSX hoặc MMCE có thể ngừng phản hồi sau một lần gắn bị từ chối: nếu giờ thẻ nhớ hoặc ổ MMCE biến mất, hãy tắt rồi bật lại máy."
  "RIP THIS CONSOLE'S AUDIO": "TRÍCH ÂM THANH VÀ NHẠC CỦA MÁY NÀY"
  "sounds or music, from its BIOS": "âm thanh hoặc nhạc, từ BIOS của máy"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Mở Cài đặt âm thanh ở Âm thanh BIOS và Nhạc BIOS: trích âm thanh của máy này hoặc nhạc menu của nó vào AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Âm khởi động Bật (nhanh): %s trên thẻ nhớ, khi các cột dâng lên"
  "Boot sound On: %s on the memory card, as the pillars rise": "Âm khởi động Bật: %s trên thẻ nhớ, khi các cột dâng lên"
  "Boot sound On: %s, once its drive is up": "Âm khởi động Bật: %s, khi ổ của nó sẵn sàng"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "KHE 0: %s\nKHE 1: %s\n%s\nRIPPS2: đang cài BIBLE. PS2BBL của El Isra, được RIPPS2 cài trên thẻ nhớ PS2 tiêu chuẩn 8 MB hoặc ổ cứng trong: khởi động 0 ms khi bật máy (PS2BBL Extended không cho phép 0), RIPPS2 trước tiên từ chỗ của nó (không bao giờ bị sao chép), và giữ một nút khi bật máy vẫn đưa tới trình duyệt (TRIANGLE), một đĩa (START) và thứ có trước đó (CIRCLE). Cài, sửa, hay khôi phục thứ nó đã thay?"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Trò chơi này chạy qua Neutrino, nhưng RIPPS2 không tìm thấy bản nào: không ở đường dẫn trong Cài đặt, trên ổ đĩa của trò chơi, trên thẻ nhớ hay trên ổ đĩa nào đã khởi động. Hãy đặt Neutrino của rickgaiser (github.com/rickgaiser/neutrino) vào thư mục neutrino trên ổ đĩa của trò chơi hoặc thẻ nhớ, hoặc trỏ Chạy trò chơi > Neutrino tới nó."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Neutrino của bạn ở đâu, chế độ video của nó và các tham số mà mỗi lần chạy Neutrino nhận được. Tải Neutrino tại github.com/rickgaiser/neutrino và đặt nó vào thư mục neutrino trên ổ đĩa hoặc thẻ nhớ."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Neutrino này cũ hơn 1.3, bản không thể chạy trò chơi từ HDD APA. Hãy trỏ Chạy trò chơi > Neutrino tới Neutrino 1.3 hoặc mới hơn."
  "with rickgaiser's Neutrino as its second game core,": "với Neutrino của rickgaiser làm lõi trò chơi thứ hai,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "lõi trò chơi thứ hai, dùng từ ổ đĩa hoặc thẻ nhớ của bạn (AFL-3.0)"
  "FILE NAME": "TÊN TỆP"
  "GAME LIST": "DANH SÁCH TRÒ CHƠI"
  "%s in %s": "%s trong %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Thao tác ghi đang tắt, nên RIPPS2 không thể lưu thông tin trò chơi hay đổi tên nó. Bật lên?"
  "BIBLE is built on El Isra's PS2BBL, its card and HDD builds signed for RIPPS2 (GPL-3)": "BIBLE được xây trên PS2BBL của El Isra, các bản cho thẻ và HDD đã được ký cho RIPPS2 (GPL-3)"
  "START %s": "KHỞI ĐỘNG %s"
  "NETWORK": "MẠNG"
  "%s did not answer. Is it connected?": "%s không phản hồi. Đã kết nối chưa?"
