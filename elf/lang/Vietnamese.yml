  CAD_VIEW_ACHIEVEMENTS: Xem thành tích
  CAD_USE_LIBRARY: Hãy duyệt trò chơi này qua Thành tích Caduceus ở menu chính.
  CAD_HASH_UNSUPPORTED: Định dạng này không tính được mã băm. Hãy duyệt thư viện tài khoản thay thế.
