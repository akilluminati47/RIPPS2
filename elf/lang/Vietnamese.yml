  HINT_RA_MODE: Chọn ứng dụng PC. Mặc định là Xerabora; Caduceus kiểm tra phiên đăng nhập của nó trước.
  RA_CADUCEUS_OFFLINE: Phiên RA của Caduceus đang ngoại tuyến.
  RA_CADUCEUS_SIGN_IN: Hãy đăng nhập RetroAchievements trong Caduceus, rồi thử lại.
