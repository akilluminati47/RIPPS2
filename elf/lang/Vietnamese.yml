  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' Một thẻ nhớ ở đây có PS2BBL/CONFIG.INI riêng, PS2BBL đọc nó trước tệp trên HDD: hãy rút thẻ đó khi bật máy, hoặc chạy RIPPS2 từ thẻ đó rồi cài lại.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' Giữ TAM GIÁC khi bật máy để vào trình duyệt, START để vào đĩa.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' Giữ TAM GIÁC để vào trình duyệt, START để vào đĩa. Cấu hình: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 có thể cài BIBLE, tức PS2BBL được thiết lập để chạy RIPPS2, lên thẻ nhớ; thứ hiện đang chạy từ thẻ đó sẽ được giữ trong thư mục sao lưu. Cài BIBLE?'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' Chương trình khởi động cũ của HDD đã được giữ lại (QUẢN LÝ > KHÔI PHỤC).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' Máy không nhận thiết lập khởi động HDD khi bật máy: hãy đặt nó bằng tiện ích HDD, hoặc cài lại.'
  ' What was there before is kept in mc%d:/%s%s.': ' Thứ có trước đó được giữ trong mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' Cấu hình PS2BBL của bạn được giữ nguyên (%s), đã bật BOOT LOCK trong đó: các nút vẫn như bạn đặt.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' Cấu hình PS2BBL của bạn được giữ nguyên, đã bật BOOT LOCK trong đó.'
