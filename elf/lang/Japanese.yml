  PARENLOCK_GAME_HINT: このゲームを起動するのにペアレンタルロックのパスワードを求めます。
  PARENLOCK_GAME_NO_PASSWORD: ペアレンタルロックのパスワードを設定してください。設定しないとこのゲームはロックされません。
  HINT_ENABLE_PCCF: 初期の日本版 PS2 の PC CARD CompactFlash。PS2 ネイティブのゲームのみ。CF には PC CARD の専有が必要です。解放するには再起動してください。
  PCCF_GAMES: PC CARD CF ゲーム
  PCCF_UNAVAILABLE: CF は使えません：PC CARD 付きの初期の日本版 PS2、互換性のあるカード、そして DEV9/HDD/ネットワークのドライバーが動いていないことが必要です。
  PCCF_UNSUPPORTED_GAME: CF は今のところ PS2 ネイティブのゲームのみに対応しています。CF の VMC、PS1 の読み込み、ネットワークの実績は使えません。
  HINT_ENABLE_DVR: 実験的な DESR DVR ISO の検出。HDD ソースをオンにする必要があります。ゲームの起動には外部の DVR 対応 Neutrino が必要です。
  HINT_RIPPS2_IGR_PAGE: ゲーム内メニュー、RIPSHOT、写真の現像方法。
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: ゲーム内メニューからのスクリーンショットを、テーマ用の ART か MEDIA へ。
  RIPPS2_DEVELOP_SHOTS: 写真の現像
  HINT_RIPPS2_DEVELOP_SHOTS: 各ゲームのフィルムで待っている写真を PNG にする方法。
  RIPPS2_SETTINGS_HOME: 設定の保存先
  HINT_RIPPS2_SETTINGS_HOME: RIPPS2 が設定を置く場所：メモリーカード上の自身のセーブ、ドライブ（内蔵 HDD、USB、MX4SIO、iLink、MMCE）の RIPPS2 フォルダ、または入力したフォルダ。
  RIPPS2_LAUNCHERS: ランチャー
  RIPPS2_LOOK_NOW: 今すぐ探す
  HINT_RIPPS2_LOOK_NOW: RIPPS2 は開始済みのドライブで POPSTARTER、POPS ファイル、Ember、Ember の BIOS、Neutrino を探し、それぞれの場所を記憶します。起動のたびにそこから読み込みます。
  RIPPS2_HIDE_GAME: ゲームを非表示
  RIPPS2_HIDDEN_GAMES: 非表示のゲーム
  HINT_RIPPS2_HIDDEN_GAMES: 「ゲームを非表示」で隠した、開始済みのドライブのゲームです。再表示するか、削除できます。ドライブごとに自分のリストを持っています。
  HINT_RIPPS2_BDM_DEVICES: 'BDM がゲームを読むドライブ: USB、MX4SIO、PC Card CF、DESR の DVR ドライブ、iLink。内蔵 HDD は HDD の起動モードに従います。'
  HINT_RIPPS2_SCREEN: 'メニューの映像: ビデオモード、ワイド画面、テレビ上の位置（H-POS、V-POS）とオーバースキャン。'
  HINT_RIPPS2_LAYOUT: カテゴリーの位置とページの入り方、そして RIPFLOW のカバーと RIPGRID のグリッド。
  HINT_RIPPS2_COLORS_TEXT: 文字の太さ、カラーテーマ、カラースイープ、そしてすべての色。
  HINT_RIPPS2_TEXT_WEIGHT: RIPPS2 自身の文字の太さ：設定のヒント、ステータス、情報。標準はこれまでどおり。太字はやわらかい映像で読みやすくなります。テーマ自身のフォントはテーマが決めた太さのままです。
  HINT_RIPPS2_HDD_START: 内蔵 HDD は APA でも exFAT でも、RIPPS2 がどちらか読み取り、HDD ゲームとして一度だけ表示します。自動（HDD があれば最速）は起動時に開始し、オフにすると触れません。
  HINT_RIPPS2_THEME_COLOR: カラーテーマそのものの色。カラーテーマでカスタムを選ぶと、文字の色と同じように自分で選べます。
  HINT_RIPPS2_SWEEP: テーマがゆっくりなめらかに移り変わる 5 色。レインボー、各カラーテーマから作ったスイープ、または自分のもの。オフならカラーテーマは動きません。
  HINT_RIPPS2_SWEEP_COLORS: スイープの 5 色と速さ。RIPPS2 のものを変えると、付けた名前で自分のものとして残ります。
  HINT_RIPPS2_SWEEP_NAME: カラースイープの一覧でのスイープの名前。
  HINT_RIPPS2_SWEEP_COLOR: スイープが順に移り変わる 5 色のひとつ。
  HINT_RIPPS2_SWEEP_SPEED: 次の色に移るまで各色が続く長さ。軽快でもなめらかで、色が点滅することはありません。
  RIPPS2_HIDE_COMPRESS: ゲームを非表示と圧縮
  HINT_RIPPS2_SELECT_HOLD: 'ゲームリストで SELECT を 4.2 秒長押し。リスト: パネルにテーマを並べて選ぶ。順送り: 次のテーマ。オフ: 何もしない (押すと更新はします)。'
  RIPPS2_RECENT_GAMES: 最近のゲーム
  RIPPS2_SET_METADATA_RENAME: メタデータを設定（名前を変更）
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: コントローラー優先（実験的）
  HINT_RIPPS2_MMCE_PAD_FIRST: SD2PSX はコントローラーと共有するバスで読み込み、読み込み中はコントローラーが聞こえません。カバーの読み込み中は入力が遅れたり抜けたりします。オン：カバーを小分けにして間にコントローラーを読みます（少し遅くなります）。オフ：カードの最高速。カードのソースが自動なら、リストは起動時に一度だけ読み込みます。
  HINT_RIPPS2_TRUST_CACHE: キャッシュから表示したリストは、SELECT を押すか RIPPS2 自身がそのソースを変えるまで、そのまま起動できる状態で残ります。オフ：キャッシュ表示の後、各ソースをバックグラウンドで読み直します。コントローラーとバスを共有する MMCE や MX4SIO カードでは、止まるのが分かります。
  RIPPS2_STATUS_OPEN: 読み込みとドライブ
  HINT_RIPPS2_STATUS_OPEN: ステータスを開きます：起動時に設定とゲームリストをどこから読むか、どこが最速か、ゲームの EXIT の行き先、すべてのドライブ。そこのキャッシュ設定からここに戻ります。
  RIPPS2_BADGE_SET: バッジセット
  HINT_RIPPS2_BADGE_SET: ゲームの情報ページのバッジ（レーティング、人数、ESRB、映像モード、走査、画面比）。RIPPS2：独自のセットで、どのテーマでも同じ。テーマ：テーマ自身の画像。テーマが求めれば RIPPS2 のもの。
  RIPPS2_HINT_FADE: ヒントとアイコンのフェード
  HINT_RIPPS2_HINT_FADE: 変わったボタンのヒントやアイコンは、カバーと同じように変わった瞬間にフェードインします。変わらないものはそのままです（すべてのページとメッセージで）。オフ：そのまま表示。テーマ：テーマが決めます（hints_fade=0 がなければオン）。
  RIPPS2_SIDEBAR_STYLE: サイドバーのスタイル
  HINT_RIPPS2_SIDEBAR_STYLE: クラシック（分割）：サイドバーの暗い帯にアイコン、その横に色の帯。XL（一体型）：幅の広い 1 本の帯の中央にアイコン。テーマ：テーマが決めます。
  HINT_EXITPATH: ゲーム内メニューの EXIT の行き先。空欄がおすすめ：EXIT はブラウザーへ進み、ブートローダー（FreeMcBoot、PS2BBL、OSDMenu、BIBLE）がインストール済みならそれが起動し、BOOT LOCK がオンなら電源投入時と同じく RIPPS2 に戻ります。なければ PS2 のブラウザーです。ここに入力した ELF は、リセット後に読み込める場所（メモリーカードか FAT32 の USB ドライブ）にあり、RIPPS2 自身でない場合にだけ使われます。それ以外はブラウザーへ進みます。
  HINT_BDM_START: USB、iLink、MX4SIO、exFAT の HDD。自動は起動時に開始します。つないでいるドライブには最速で、そのゲームは最初からすべてのゲームに並びます。手動はページを開いたときに開始します。
  NEUTRINO_VMC_HDD_UNSUPPORTED: Neutrino は APA の HDD 上の VMC を使えません（exFAT、USB、MX4SIO は使えます）。このゲームはそのスロットの本物のカードで起動します。
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: '起動時に読むのは RIPPS2 自身のドライブだけです: RIPPS2.ELF の隣の設定とサウンド (場所はそこの RIPPS2.FB が示します)、そして各リストのキャッシュ。他のドライブは待ちます: ページで SELECT を押すとそのドライブが始まり、画像が読み込まれます (自動更新がオンなら起動時に始まります)。オンにすると、サウンドと、空きがあれば音楽を RIPPS2 の隣の AUDIO にコピーします。'
  RIPPS2_ART_PACK: ART パック
  RIPPS2_ART_PACK_BUILD: 作成または削除
  HINT_RIPPS2_ART_PACK: 起動したすべてのドライブの ART フォルダーを、選んだドライブの art.tar 1 つにまとめます（最速のドライブを先に提案します）。カバーは 1 つのファイルから 1 つの索引で読み込まれ、ゲームごとの検索は一切ないので、メニューも音楽もなめらかです。ART フォルダーはそのまま残ります。
  RIPPS2_LIST_CFG_TEXT: リストのタイトルと説明
  HINT_RIPPS2_LIST_CFG_TEXT: 'ゲームリストの横に、ゲームのCFGのタイトルと説明を表示します。テーマ: テーマの設定どおり(RIPPS2のテーマでは非表示)。情報ページでは常に表示されます。'
  RIPPS2_PS1_PREFER: PS1の重複
  HINT_RIPPS2_PS1_PREFER: 'POPSTARTERのVCDとEmberイメージの両方があるPS1ゲーム。両方: 2行。Ember: Emberのみ。POPSTARTER: VCDのみ。先頭のディスクIDを除いて同じタイトルなら同じゲームです。'
  RIPPS2_MY_PADS: マイパッド
  HINT_RIPPS2_MY_PADS: RIPPS2 の横の PADS フォルダにある .pad プロファイル:USBパッドごとにIDの名前のテキストファイル(2563_0575.pad)で、それぞれチェック済み。プロファイルのあるパッドはメニューを操作し、ゲームでも使えます(Pad Emulator オン)。
  RIPPS2_PAD_SETUP: USBパッドを設定
  HINT_RIPPS2_PAD_SETUP: RIPPS2 が知らないUSBパッドをつなぎ、言われたボタンを順に押すと、RIPPS2 がその .pad を PADS に書き込みます。PS2パッドの SELECT でボタンを飛ばせます。
