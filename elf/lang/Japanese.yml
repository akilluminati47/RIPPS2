  ' A SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it was removed.': ' ビルド 68 が、それを読まないローダー向けに書いた SYS-CONF/PS2BBL.INI を削除しました。'
  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' ここにあるメモリーカードには独自の PS2BBL/CONFIG.INI があり、PS2BBL は HDD のものより先にそれを読みます。電源投入時にそのカードを抜くか、そのカードから RIPPS2 を起動してもう一度インストールしてください。'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' 電源投入時に三角を押し続けるとブラウザー、START でディスク。'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' 三角を押し続けるとブラウザー、START でディスク。設定：%s。'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 はメモリーカードに BIBLE（RIPPS2 を起動するよう設定した PS2BBL）をインストールできます。今そのカードから起動するものはバックアップフォルダに保存されます。BIBLE をインストールしますか？'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' HDD の元のブートプログラムは保存されています（管理 > 復元）。'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' 本体が電源投入時に HDD を起動する設定を受け付けませんでした。HDD ユーティリティで設定するか、もう一度インストールしてください。'
  ' What was there before is kept in mc%d:/%s%s.': ' 元にあったものは mc%d:/%s%s に保存されています。'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' あなたの PS2BBL 設定（%s）はそのままにし、その中で BOOT LOCK をオンにしました。ボタンはあなたの設定どおりです。'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' あなたの PS2BBL 設定はそのままにし、その中で BOOT LOCK をオンにしました。'
  ? '(Removed a SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it.)

    '
  : '（ビルド 68 が、それを読まないローダー向けに書いた SYS-CONF/PS2BBL.INI を削除しました。）

    '
