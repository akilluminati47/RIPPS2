  Drives, loading, launchers and homebrew: ドライブ、読み込み、ランチャー、自作ソフト
  ? Fast Cache shows each drive's last game list the moment the drive answers; Trust Cache keeps it until you press SELECT. Both on, with the settings on the memory card RIPPS2 starts from, is the quickest boot.
  : Fast Cache はドライブが応答した瞬間に前回のゲームリストを表示し、Trust Cache は SELECT を押すまでそれを保ちます。両方オンにし、設定を RIPPS2 を起動するメモリーカードに置くのが最速の起動です。
  Fast Cache, Trust Cache: Fast Cache、Trust Cache
  'Game lists: Fast Cache off, so each one is read from its drive at boot': ゲームリスト：Fast Cache オフ、起動時にそれぞれのドライブから読み込み
  'Game lists: each shows at once from its cache and stands until SELECT': ゲームリスト：キャッシュからすぐ表示し、SELECT まで保持
  'Game lists: each shows at once from its cache, then is read again': ゲームリスト：キャッシュからすぐ表示し、その後読み直し
  LOADING: 読み込み
  'No music yet: Audio settings > BIOS Music rips this console''s menu music.': まだ音楽がありません：オーディオ設定 > BIOS 音楽でこの本体のメニュー音楽を抽出できます。
  SAVE DIAGNOSTICS: 診断情報を保存
  Searches the drives for POPSTARTER, the POPS files, Ember, Ember's BIOS and Neutrino, and remembers where each one is.: ドライブから POPSTARTER、POPS ファイル、Ember、Ember の BIOS、Neutrino を探し、それぞれの場所を覚えます。
  'Settings: %s, on a drive the boot waits for (a memory card is quicker)': 設定：%s、起動が待つドライブ上（メモリーカードの方が速い）
  'Settings: %s, read first (the quickest place)': 設定：%s、最初に読み込み（最速の場所）
  Starts every drive now (USB, the HDD, MMCE, MX4SIO and the network), so each one and its space shows here.: 今すべてのドライブ（USB、HDD、MMCE、MX4SIO、ネットワーク）を開始し、それぞれと容量をここに表示します。
  The IP and SMB share POPSTARTER uses for PS1 games over the network.: POPSTARTER がネットワーク経由の PS1 ゲームに使う IP と SMB 共有。
  The diagnostics are in %s.: 診断情報は %s にあります。
  The diagnostics could not be written to %s.: 診断情報を %s に書き込めませんでした。
  What each memory card starts at power on; install or repair BIBLE, PS2BBL set up to start RIPPS2.: 各メモリーカードが電源投入時に起動するもの。BIBLE（RIPPS2 を起動するよう設定した PS2BBL）のインストールと修復。
  Where POPSTARTER and Ember are, and how PS1 games start.: POPSTARTER と Ember の場所と、PS1 ゲームの起動方法。
  ? Writes what RIPPS2 noted about the pads, the drives, MMCE cards and the last launches to DIAG.TXT beside RIPPS2. Send it with a bug report.
  : コントローラー、ドライブ、MMCE カード、最近の起動について RIPPS2 が記録した内容を、RIPPS2 の隣の DIAG.TXT に書き込みます。バグ報告に添えて送ってください。
  back to Cache: キャッシュに戻る
  what boot reads first: 起動時に最初に読むもの
  ', the sounds': 、サウンド
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot がオンです。RIPPS2 は自分のドライブ (%s) から起動します: 設定%s と各リストはキャッシュから読みます。他のドライブは、そのページで SELECT を押すか、そのゲームを起動したときに始まります。'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot がオンです。サウンドは %d KB あり、RIPPS2 が動いているメモリーカードの空きは %d KB なので、サウンドは %s のままです。
  ' (%d KB free)': ' (空き %d KB)'
  ' (%u MB free)': ' (空き %u MB)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'RIPPS2 の隣: %sAUDIO%s、起動時に最初に読む場所'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL を本体がこのカードに結び付け、%s/%s として書き込みます。
  
    - その設定 mc%d:/SYS-CONF/PS2BBL.INI は、RIPPS2 を今ある場所 (%s) から待ち時間なしで起動します (0 ms。PS2BBL Extended では不可)。BOOT LOCK オン。RIPPS2 自体はコピーされません。
  
    このために I/O プロセッサーが再起動し、終わるまでドライブの読み込みはすべて止まります。音楽とドライブはその後戻ります。完了と出るまでカードを挿したまま、本体の電源も入れたままにしてください。'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'SD2PSX や MMCE のカードは、書き込みを拒否した後に自分を保護することがあります: 今メモリーカードや MMCE ドライブが見当たらない場合は、本体の電源を入れ直してください。'
  BOOT LOCK ON: BOOT LOCK オン
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': '完了: スロット %d のメモリーカードは BIBLE の前に起動していたものを起動します。BIBLE は mc%d:/%s に残しています。'
  MEMORY CARD IN SLOT %d  (%s): スロット %d のメモリーカード  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL は RIPPS2 を今の場所から起動できません (届くのはメモリーカード、USB ドライブ、MX4SIO)。また RIPPS2 は自分をコピーしません。RIPPS2.ELF をメモリーカードか USB ドライブに置いてそこから起動するか、MMCE と HDD を読める PS2BBL Extended を使ってください。
  RESTORE SLOT %d'S OLD BOOT LOADER: スロット %d の元のブートローダーに戻す
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: スロット %d のメモリーカードに BIBLE を設定しました (mc%d:/%s/%s)。BOOT LOCK オン: 電源を入れるとすぐ RIPPS2 を %s から起動します。'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: BIBLE を設定中
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: BIBLE を設定中
  
    RIPPS2 は %s から動いていますが、PS2BBL はそこを読めません (読めるのはメモリーカード、USB、MX4SIO)。また RIPPS2 は自分をコピーしません。このカードの PS2BBL Extended の設定 (%s) なら読めます: START で BOOT LOCK をオンにすると、電源投入時に RIPPS2 を %s から起動します。カードのほかの部分は変わりません。'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: BIBLE を設定中
  
    RIPPS2 は %s から動いていますが、PS2BBL はそこを読めません: プログラムを起動できるのはメモリーカード、USB ドライブ、MX4SIO からだけで、RIPPS2 は自分をコピーしません。RIPPS2.ELF をそのどれか (メモリーカードの APPS フォルダーか USB ドライブ) に置いてそこから起動し、もう一度 BIBLE を設定してください。'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: BIBLE を設定中
  
    スロット %d のメモリーカード: BIBLE (mc%d:/%s) をよけて、置き換えられていたもの (mc%d:/%s) を元の場所に戻します。何も削除しません。PS2BBL の設定はそのままです (ロックは BOOT LOCK でオフにできます)。'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: BIBLE を設定中 (PS2BBL をメモリーカードに結び付けています)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: BIBLE を設定中 (元のものを戻しています)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: BIBLE を設定中 (I/O プロセッサーを再起動しています)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: BIBLE を設定中 (メモリーカードに書き込んでいます)'
  SET UP BIBLE: BIBLE を設定
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: スロット %d のメモリーカードの空きは %d KB で、BIBLE にはそこに %d KB 必要です。空きを作ってからもう一度試してください。
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : スロット %d のメモリーカードが PS2BBL を拒否したので、RIPPS2 はカードを元のままにしました。空き容量を確かめてからもう一度試してください。(カードの応答は RIPPS2 の隣の DIAG.TXT にあります。)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : スロット %d のメモリーカードが BIBLE をよけられなかったので、何も変えていません。(カードの応答は RIPPS2 の隣の DIAG.TXT にあります。)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): スロット %d のメモリーカードが %s を戻せなかったので、BIBLE のままです。(カードの応答は RIPPS2 の隣の DIAG.TXT にあります。)
  MUSIC: ミュージック
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s には %s がありません。RIPPOPS が Sony の PS1 エミュレーターを %s で見つけました: START で %s をここへコピーしてゲームを起動します。'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 には %s が見えません (%s%s)。POPSTARTER には POPS_IOX.PAK と POPS.PAK、または POPS_IOX.PAK と POPS.ELF と IOPRP252.IMG が必要です: あなた自身の本体の Sony 製 PS1 エミュレーターです。RIPPS2 が探さない場所で見つかることもあります (ゲームが起動するなら見つかっています)。START で起動し、このドライブについては二度と聞きません。'
  ' (The configs found were set: %s.)': ' （見つかった設定を変更しました：%s。）'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' その設定をそれ自身の設定ツールで一度保存してから、BOOT LOCK をもう一度オンにしてください。'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s は RIPPS2 を今ある場所（%s）から起動できません。RIPPS2 は自分をコピーしません。RIPPS2.ELF をメモリーカードか USB ドライブに置いて、そこから起動してください。'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK はブートローダーの設定を書き込めませんでした。メモリーカードやドライブが書き込み禁止になっていないか確認して、もう一度お試しください。
  BOOT LOCK found no boot loader config to change.: BOOT LOCK は変更できるブートローダーの設定を見つけられませんでした。
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK はオフです。ブートローダーは以前に起動していたもの（%s）を起動します。
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK はオンです。%s は電源投入時に RIPPS2 を起動します（%s）。IGRパスが空なら、ゲームの EXIT も同じ道で戻ります。ほかのものに行くには、本体の起動中にそのボタンのどれかを押し続けてください。%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : BOOT LOCK は OSDMenu のメニューの先頭に RIPPS2 を置きました（%s）。OSDMenu は自分では何も起動しません。そこで RIPPS2 を選んでください。ゲームの EXIT はそのメニューに戻ります。RIPPS2 をすぐに起動する本体にするには、BIBLE が PS2BBL をメモリーカードに入れます（ブートローダー）。
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK はメモリーカード上のブートローダー（PS2BBL、FMCB、OSDMenu）を通じて動作しますが、ここには一つもありません。
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: スロット %d のメモリーカードは電源投入時に %s を起動しますが、BOOT LOCK が変更できるその設定は見つかりませんでした（%s を探します）。
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': スロット %d のメモリーカードは電源投入時に %s を起動しますが、BOOT LOCK はこれを設定できません。BOOT LOCK は PS2BBL、FMCB、OSDMenu を通じて動作します。
  A boot loader with RIPPS2's lock is on this console.: この本体には RIPPS2 のロック付きのブートローダーがあります。
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': ゲームの EXIT：ブラウザー、次にブートローダー（BOOT LOCK）
  'In use: %s, %d pictures, %d MB': 使用中：%s、画像 %d 枚、%d MB
  'Measuring how fast each drive reads its art: %s': 各ドライブが画像を読む速さを測っています：%s
  'None: each picture is read from its own ART folder.': なし：画像はそれぞれの ART フォルダーから読み込みます。
  REMOVE the pack in %s (the ART folders stay as they are): '%s のパックを削除（ART フォルダーはそのまま残ります）'
  Remove the ART Pack in %s? The ART folders stay as they are.: '%s の ART パックを削除しますか？ART フォルダーはそのまま残ります。'
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: 中止しました。作りかけのパックは削除され、画像はこれまでどおり ART フォルダーから読み込みます。
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : ART パックを %s に書き込めませんでした（そのドライブに空きはありますか？）。ほかは何も変わっていません：画像はこれまでどおり ART フォルダーから読み込みます。
  The ART Pack in %s is removed. Art loads from the ART folders again.: '%s の ART パックを削除しました。画像は再び ART フォルダーから読み込みます。'
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : 起動したドライブに画像のある ART フォルダーがありません。画像のあるドライブを起動してから（そのページで SELECT）、もう一度どうぞ。
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d 枚の画像（%d 個の ART フォルダーから）を 1 つのファイル %s にまとめます。ART フォルダーはそのまま残ります：パックはコピーです。art.tar は Memory Files で別のドライブの ART フォルダーにコピーできますが、ふだん閲覧するドライブで作るのがいちばん速いので、最速のドライブを先頭に出しています。今すぐ作りますか？'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : ART パックができました：画像 %d 枚、%d MB、%s（%d 秒）。これからは画像をパックから読み込み、作成の対象になった %d 本のゲームは ART フォルダーに 1 枚ずつ問い合わせることがなくなります。RIPPS2 が取得・撮影した画像はすぐに表示されます。PC からコピーした画像は、パックを作り直すと表示されます。
  '%s free': 空き %s
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar：読み込み %s/s、%s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar：読み込み %s/s、最速、%s'
  ART PACK: ART パック
  About %d min: 約 %d 分
  'Looking at the ART folders: %d pictures, %s': ART フォルダーを確認しています：画像 %d 枚、%s
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 起動したドライブに ART パックを置く空きがありません：約 %s 必要です。ふだん閲覧するドライブの空きを増やしてから、もう一度どうぞ。
  PACKING THE ART: 画像をまとめています
  PICTURE %d OF %d: 画像 %d / %d
  'Pictures: %d (%s). ART folders: %d.': 画像：%d 枚（%s）。ART フォルダー：%d 個。
  Stop? The unfinished pack is removed; the ART folders stay as they are.: 中止しますか？作りかけのパックは削除され、ART フォルダーはそのまま残ります。
  'The ART folders stay as they are: the pack is a copy.': ART フォルダーはそのまま残ります：パックはコピーです。
  Under a minute: 1 分以内
  free space unknown: 空き容量は不明
  'A game''s EXIT: the browser, or your boot loader when one is installed': ゲームの EXIT：ブラウザー、またはインストール済みのブートローダー
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): Ogg Vorbis：Xiph.Org（BSD）、minimp3：lieff（CC0）
  RIPFLOW's type, and every message and notification: RIPFLOW の書体、そしてすべてのメッセージと通知
  'Thanks to everyone testing on Discord and opening issues on GitHub:': Discord でテストし、GitHub で issue を立ててくれる皆さんに感謝：
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': IGR Path %s は使われません：ゲーム後に読み込めるのはメモリーカードか USB のファイルだけで、RIPPS2 自身は決して読み込みません
  an issue is the best way to get RIPPS2 updated.: issue は RIPPS2 を良くするいちばんの近道です。
