  'This disc is not compatible: it is a region %d DVD, and this console plays another region''s DVDs. Start it anyway?': このディスクは互換性がありません：リージョン %d の DVD で、この本体は別のリージョンの DVD を再生します。それでも起動しますか？
  ? 'This disc is not compatible: it reads as DVD video but has no DVD video on it (no VIDEO_TS), so a DVD player cannot play it.'
  : このディスクは互換性がありません：DVD ビデオとして読み込まれますが、DVD ビデオが入っていない（VIDEO_TS がない）ため、DVD プレーヤーでは再生できません。
  This is an ESR-patched PS2 game. Put ESR (esr*.elf) in APPS, BOOT or ESR on a memory card or USB drive to start it.: これは ESR パッチ済みの PS2 ゲームです。起動するには、メモリーカードか USB メモリの APPS、BOOT または ESR に ESR（esr*.elf）を置いてください。
