  ? This track could not be played. RIPPS2 plays 16-bit PCM .wav files (as RIPDISC and BIOS Music rip them), Ogg Vorbis .ogg files and MP3s.
  : このトラックは再生できませんでした。RIPPS2 は 16 ビット PCM の .wav ファイル（RIPDISC と BIOS 音楽が抽出する形式）、Ogg Vorbis の .ogg ファイル、MP3 を再生します。
  'READ ONLY: THE SD2PSX''S BOOT CARD IS IN USE': 読み取り専用：SD2PSX のブートカードは使用中です
  '%d music tracks': 音楽トラック %d 曲
  1 music track: 音楽トラック 1 曲
  'A game''s EXIT: %s': ゲームの EXIT：%s
  'All Games: %d games kept in %s, listed at boot before any drive answers': すべてのゲーム：%d 本を %s に保存、どのドライブより先に起動時に表示
  'All Games: no master list yet; %s is written once the games are listed (Fast Cache on)': すべてのゲーム：マスターリスト未作成。ゲームの一覧ができると %s を書き込みます（Fast Cache オン）
