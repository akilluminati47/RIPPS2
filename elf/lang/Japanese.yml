# RIPPS2 in Japanese. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Japanese
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE を導入・更新・復元"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "BIBLE を更新: スロット %d のものは古い版です"
  "Background": "背景"
  "Sky": "空"
  "Black": "黒"
  "Splash": "スプラッシュ"
  "Logo": "ロゴ"
  "Logo and Names": "ロゴと名前"
  "Button Glyphs": "ボタン記号"
  "Face Buttons": "アクションボタン"
  "All Sixteen": "16 個すべて"
  "Info Line": "情報行"
  "Power-on Wait": "電源投入時の待ち時間"
  "%s, path %d": "%s、パス %d"
  "A BIBLE COMMAND": "BIBLE のコマンド"
  "ARGUMENTS": "引数"
  "Argument %d": "引数 %d"
  "Arguments: %s": "引数: %s"
  "Auto (no button held)": "自動 (ボタンなし)"
  "BIBLE hands these to the program, in this order.": "BIBLE はこの順番でプログラムに渡します。"
  "BIBLE has no way to reach that drive. Choose a program on another one, or type the path.": "BIBLE はそのドライブに届きません。別のドライブのプログラムを選ぶか、パスを入力してください。"
  "BIBLE keeps this key from PS2BBL, but nothing in this build acts on it, so it changes nothing yet.": "BIBLE は PS2BBL のこのキーを残していますが、このビルドでは使われないため、今は何も変わりません。"
  "BIBLE needs at least one path in its settings, or it starts in its rescue mode, so this one stays.": "BIBLE の設定にはパスが 1 つ以上必要です。ないとレスキューモードで起動するため、これは残ります。"
  "BIBLE's Settings": "BIBLE の設定"
  "BIBLE's credits": "BIBLE のクレジット"
  "BOOT LOCK holds this line. Turn BOOT LOCK off to change it.": "この行は BOOT LOCK が保持しています。変更するには BOOT LOCK をオフにしてください。"
  "Binds the BIBLE RIPPS2 carries to a memory card, writes it over the one there, or puts back what it replaced.": "RIPPS2 が持つ BIBLE をメモリーカードに結び付ける、既存のものに上書きする、または置き換えたものを戻します。"
  "Boot Sound": "起動音"
  "CHOOSE A PROGRAM": "プログラムを選ぶ"
  "CHOOSE AN ELF": "ELF を選んでください"
  "Choose a program from your drives, type a path, or pick one of BIBLE's commands. BIBLE tries the paths in order and starts the first it finds.": "ドライブからプログラムを選ぶ、パスを入力する、または BIBLE のコマンドを選びます。BIBLE はパスを順に試し、最初に見つけたものを起動します。"
  "Follow Color Theme": "カラーテーマに合わせる"
  "How long BIBLE waits for a button before the Auto path. At 0 ms a button held from power on still works. A boot sound beside BIBLE is read first: about 2 s at 0 ms.": "自動パスの前に BIBLE がボタンを待つ時間。0 ms でも電源投入時から押したボタンは有効です。BIBLE の横の起動音は先に読まれます: 0 ms で約 2 s。"
  "Launch Keys": "起動ボタン"
  "Launch Keys: %s": "起動ボタン: %s"
  "On shows a disc's game ID on screen as it starts, for RetroGEM video mods.": "オンにすると起動時にディスクのゲーム ID を画面に表示します (RetroGEM ビデオ改造用)。"
  "On shows a program's game ID on screen as it starts, for RetroGEM video mods. It is up to 11 characters from the file name.": "オンにすると起動時にプログラムのゲーム ID を画面に表示します (RetroGEM ビデオ改造用)。ファイル名から最大 11 文字です。"
  "On stops the disc at a launch and waits for the drive to answer. Off skips that wait, about 3 s in the lab, and a disc in the tray keeps spinning.": "オンは起動時にディスクを止めてドライブの応答を待ちます。オフはその待ち時間 (ラボで約 3 s) を省き、トレイのディスクは回り続けます。"
  "Opens the file itself in the text editor, comments and all. Every change here keeps the other lines as they are.": "ファイルそのものをコメントごとテキストエディタで開きます。ここでの変更は他の行をそのまま残します。"
  "Path %d": "パス %d"
  "Shows the countdown, the clock and the console's details on the splash.": "スプラッシュにカウントダウン、時計、本体情報を表示します。"
  "Sky Color": "空の色"
  "TYPE A PATH": "パスを入力"
  "The button pictures under the logo: none, the four face buttons, or all sixteen.": "ロゴの下のボタン画像: なし、4 つのボタン、または 16 個すべて。"
  "The console's browser": "本体のブラウザ"
  "The disc in the tray": "トレイのディスク"
  "The disc, without the PS2 logo": "ディスク (PS2 ロゴなし)"
  "The name BIBLE's splash shows for this button.": "BIBLE のスプラッシュがこのボタンに表示する名前。"
  "The same setting as in Audio. On (fast) keeps a copy on the memory card, so the sound starts with the first frame. Off is the fastest boot.": "オーディオと同じ設定です。オン(高速) はメモリーカードにコピーを置き、最初のフレームから音が鳴ります。オフが最速の起動です。"
  "The shape of BIBLE's splash. Auto follows RIPPS2's Widescreen when its settings are on a memory card.": "BIBLE のスプラッシュの形。自動は RIPPS2 の設定がメモリーカードにあるとき、そのワイドスクリーン設定に従います。"
  "The signal BIBLE starts in. Auto uses RIPPS2's Video Mode when its settings are on a memory card, and the console's own mode when they are not.": "BIBLE の開始時の信号。自動は RIPPS2 の設定がメモリーカードにあればそのビデオモードを、なければ本体のモードを使います。"
  "The sky on BIBLE's splash. Follow Color Theme uses the sky RIPPS2 saves with its settings. A color named here stays, whatever the theme.": "BIBLE のスプラッシュの空。カラーテーマに合わせるは RIPPS2 が設定と一緒に保存する空を使います。ここで選んだ色はテーマに関係なく残ります。"
  "This BIBLE (%s build) does not read this drive, so it moves on to the next path.": "この BIBLE (%s ビルド) はこのドライブを読めないため、次のパスに進みます。"
  "What BIBLE shows while it waits for a button: nothing, its logo, or its logo with the name of what each button starts.": "ボタンを待つ間に BIBLE が表示するもの: なし、ロゴ、またはロゴと各ボタンで起動するものの名前。"
  "What BIBLE starts when no button is held at power on.": "電源投入時にボタンが押されていないときに BIBLE が起動するもの。"
  "What BIBLE starts when this button is held at power on. L2 + R2 held at power on shows BIBLE's own page of them all.": "電源投入時にこのボタンを押していると BIBLE が起動するもの。電源投入時に L2 + R2 を押すと BIBLE のページですべて確認できます。"
  "What each button starts at power on, each with up to ten paths chosen from your drives.": "電源投入時に各ボタンが起動するもの。各ボタンにドライブから選んだパスを最大 10 個設定できます。"
  "What stands behind BIBLE's logo. Auto shows the sky when Sky Color is set or RIPPS2's settings are on a memory card, and black when they are not.": "BIBLE のロゴの背景。自動は空の色が設定されているか RIPPS2 の設定がメモリーカードにあれば空を、なければ黒を表示します。"
  "When a button starts a disc and the tray is empty, On opens the tray for you.": "ボタンでディスクを起動してトレイが空のとき、オンならトレイを開きます。"
  "Eject Tray at Launch": "起動時にトレイを開く"
  "Read Console History": "本体の履歴を読む"
  "Game ID for Apps": "アプリのゲーム ID"
  "Game ID for Discs": "ディスクのゲーム ID"
  "File name (as it appears in your games list)": "ファイル名 (ゲームリストに表示される名前)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "このリストは他のドライブのゲームを表示しています。ゲームの名前はそのドライブのページで変更してください。"
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "スター付きのゲームは名前を変更できません。スターを外し (R3)、名前を変更してから付け直してください。"
  "This drive cannot rename its files. The details can still be set.": "このドライブはファイル名を変更できません。詳細は設定できます。"
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "APA HDD では PS2 ゲームの名前はパーティションテーブルにあるため、ここでは変更できません。詳細は設定できます。"
  "Renames the app in your list. Its ELF and its art keep their names.": "リスト内のアプリの名前を変更します。ELF とアートの名前は変わりません。"
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "ドライブ上のゲームの名前を変更します。PS1 ゲームのアートと設定は名前で探すため、RIPPS2 が一緒に名前を変更します。ART Pack 内のアートはパックの作り直しが必要です。"
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "ドライブ上のゲームのファイル名を変更します。PS2 ゲームのアートと設定はゲーム ID で探すため、何も失われません。"
  "Stop Disc at Launch": "起動時にディスクを停止"
  "EDIT BIBLE'S SETTINGS FILE": "BIBLE の設定ファイルを編集"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "BIBLE の設定ファイル（%s）を書き込めませんでした。メモリーカードが差さっていて空きがあるか確かめてから、もう一度お試しください。"
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "BIBLE の設定ファイル（%s）が見つかりません。BIBLE を導入・更新・復元 で書き込まれます。"
  "Boot sound On (fast): %s, handed over by BIBLE": "起動音オン(高速): %s、BIBLE から受け渡し"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: akilluminati47 による PS2BBL Extended のフォーク。どのビルドも akilluminati47 が署名（GPL-3）"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "その IOPRP イメージが BIBLE をメモリーカードに結び付けます（GPL-3）。暗号処理は本体が行い、鍵は不要です"
  "KELFBinder by El Isra": "El Israによる KELFBinder"
  "source: github.com/akilluminati47/BIBLE": "ソース：github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "スロット 0: %s\nスロット 1: %s\n%s\nRIPPS2: BIBLE を設定中。BIBLE（El Isra の PS2BBL をもとにした akilluminati47 のブートローダー）を、RIPPS2 が標準の 8 MB PS2 メモリーカードか内蔵 HDD に設定します: 電源投入から 0 ms で起動 (PS2BBL Extended は 0 不可)、まず RIPPS2 を今の場所から (コピーはしません)。電源投入時にボタンを押していれば、ブラウザー (TRIANGLE)、ディスク (START)、元のもの (CIRCLE) にも行けます。設定、修復、それとも置き換えたものを元に戻しますか?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: BIBLE を設定中\nスロット %d のカードは SD2PSX または MMCE のカードです。本体が BIBLE をこのカードに結び付ければ、その BOOT カードは今の PS2BBL の代わりに BIBLE を持てます（今のものは先にまるごと退避します）。結び付けが拒否されてもカードは何も変わりませんが、本体の電源を入れ直すまでカードが応答しなくなることがあります。START で BIBLE を結び付けます。"
  "BIND BIBLE": "BIBLE を結び付ける"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(カードの応答は RIPPS2 の隣の DIAG.TXT にあります。)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "標準の 8 MB PS2 メモリーカード (MagicGate カード、または SD2PSX や MMCE の BOOT カード) 用です: スロット %d のカード。電源を入れると、PS2BBL はスロット 1 の設定をスロット 0 より先に読みます。\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "本体が BIBLE をスロット %d のメモリーカードに結び付けられませんでした（MagicGate の手順が失敗）。カード上は何も変更していません。純正または MagicGate 対応ではないカードにはシステム更新を入れられません。"
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "SD2PSX や MMCE のカードは、結び付けを拒否した後に応答しなくなることがあります: 今メモリーカードや MMCE ドライブが見当たらない場合は、本体の電源を入れ直してください。"
  "RIP THIS CONSOLE'S AUDIO": "この本体のオーディオを抽出"
  "sounds or music, from its BIOS": "サウンドまたは音楽、BIOS から"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "オーディオ設定を BIOSサウンドと BIOS 音楽の位置で開きます: この本体のサウンドかメニュー音楽を AUDIO に抽出します。"
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "起動音オン(高速): メモリーカード上の %s、柱が立ち上がるとき"
  "Boot sound On: %s on the memory card, as the pillars rise": "起動音オン: メモリーカード上の %s、柱が立ち上がるとき"
  "Boot sound On: %s, once its drive is up": "起動音オン: %s、ドライブの準備後"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "このゲームは Neutrino で起動しますが、RIPPS2 は見つけられませんでした（設定のパス、ゲームのドライブ、メモリーカード、起動済みのドライブのどこにもありません）。rickgaiser の Neutrino（github.com/rickgaiser/neutrino）をゲームのドライブかメモリーカードの neutrino フォルダーに置くか、ゲームの起動 > Neutrino でその場所を指定してください。"
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Neutrino の場所、映像モード、Neutrino で起動するたびに渡す引数。 Neutrino は github.com/rickgaiser/neutrino で入手し、ドライブかメモリーカードの neutrino フォルダーに置いてください。"
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "この Neutrino は 1.3 より古く、APA HDD からゲームを起動できません。ゲームの起動 > Neutrino を Neutrino 1.3 以降に向けてください。"
  "with rickgaiser's Neutrino as its second game core,": "rickgaiser の Neutrino を 2 つ目のゲームコアとして使い、"
  "the second game core, used from your drive or memory card (AFL-3.0)": "2 つ目のゲームコア、あなたのドライブかメモリーカードから使用（AFL-3.0）"
  "FILE NAME": "ファイル名"
  "GAME LIST": "ゲーム一覧"
  "%s in %s": "%s（%s）"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "書き込み操作がオフのため、RIPPS2 はゲームの情報を保存したり名前を変えたりできません。オンにしますか？"
  "START %s": "%s を開始"
  "NETWORK": "ネットワーク"
  "%s did not answer. Is it connected?": "%s が応答しません。接続されていますか？"
