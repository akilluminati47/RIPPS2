  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: メニュー音楽（%s）は %s に %s として入っています。オーディオ設定 > 音楽 に Menu として表示され、ほかの曲を選んでいないときに再生されます。
  The menu music could not be written to %s (%s). Is the drive full?: メニュー音楽を %s に書き込めませんでした（%s）。ドライブがいっぱいではありませんか？
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : メニュー音楽は %s の WAV で、メモリーカードには入りきりません。ここでは RIPPS2 はメモリーカードから動いていて、OPL フォルダのあるドライブも開始されていません。ストレージで開始してから、そこへ音楽を抽出してください。
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: この BIOS のメニュー音楽は RIPPS2 が知っているものではありません。何も書き込んでいません。
  This BIOS's sound bank is not the one RIPPS2 knows. Nothing was written.: この BIOS のサウンドバンクは RIPPS2 が知っているものではありません。何も書き込んでいません。
  ? This console's BIOS has no SNDIMAGE. Consoles from SCPH-30000 on carry one; the first models keep their sounds another way, which RIPPS2 does not read yet.
  : この本体の BIOS には SNDIMAGE がありません。SCPH-30000 以降の本体にはありますが、初期のモデルは別の方法でサウンドを持っており、RIPPS2 はまだ読み取れません。
  ' (hold CIRCLE at power on to start it)': ' （起動するには電源投入時に丸を押し続ける）'
