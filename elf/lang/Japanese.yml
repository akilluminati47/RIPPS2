  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 2 回の名前変更の間で結合が止まりました。残す .tar は %s、結合したものは %s です。メモリーファイルで名前を戻してください。
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
