    '
  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE は RIPPS2 を HDD の %s パーティションにコピーできませんでした。空き容量を確認してください。ほかには何も変更していません。
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE は HDD のブートプログラムのコピーを保存できなかったため、変更する前に止まりました。RIPPS2 は HDD にコピーされました。ほかには何も変更していません。
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE は設定（%s）を書き込めませんでした。ブートプログラムは変更していません。
  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE は HDD のブートプログラムを書き込めませんでした（手順 %d）。%s
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : BIBLE は内蔵 HDD にインストールされ、BOOT LOCK はオンです：電源投入時に本体はすぐに %s%s%s%s から RIPPS2 を起動します。設定：%s。%s%s
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE はメモリーカード %d にありますが、設定（%s）を書き込めなかったため、ブラウザーを起動します。空きを作ってから、もう一度「管理」を実行して完了させてください。
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE は開始前にメモリー不足になりました。何も変更していません。
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE はメモリー不足になりました。メモリーカード上は何も変更していません。
  'BIBLE: copying RIPPS2 to %s (%d%%)': BIBLE：RIPPS2 を %s にコピー中（%d%%）
  'BIBLE: keeping the HDD''s boot program': BIBLE：HDD のブートプログラムを保存しています
  'BIBLE: putting the HDD''s boot program back': BIBLE：HDD のブートプログラムを戻しています
  'BIBLE: writing PS2BBL to the HDD''s boot area': BIBLE：PS2BBL を HDD のブート領域に書き込んでいます
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : '内蔵 HDD に BIBLE をインストール

    - RIPPS2 を %s にコピー。

    - 現在 __mbr にある HDD のブートプログラムを読み出し、%s/RIPPS2 に保存（復元で元に戻ります）。

    - その場所に PS2BBL の HDD 版を書き込み、本体が電源投入時にそれを起動するよう設定。

    - その設定（%s）がまず %s%s%s から RIPPS2 を起動し、BOOT LOCK はオン。

    HDD から起動できる本体（ネットワークアダプター付きの初期型 PS2）が必要です。完了と表示されるまで電源を入れておいてください。'
  INTERNAL HDD  (its boot area): 内蔵 HDD  （そのブート領域）
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'HDD の元のブートプログラムを戻す

    BIBLE が保存したもの（HDD 上の RIPPS2/MBR-BACKUP.KELF）を、BIBLE の代わりに __mbr に戻します。RIPPS2 と PS2BBL の設定はそのまま残ります。'
  RESTORE: 復元
  RESTORE THE HDD'S OLD BOOT PROGRAM: HDD の元のブートプログラムを復元
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 は ROM からこの本体のリージョンを判別できないため、どのシステム更新フォルダを読むのか分かりません。BIBLE はインストールしていません。
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 は HDD の __sysconf または __common パーティションを開けなかったため（エラー %d）、BIBLE はそこに RIPPS2 と設定を置けません。何も変更していません。
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 は保存されたブートプログラムを読み取れませんでした。何も変更していません。
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 はブートプログラムを書き戻せませんでした。もう一度お試しください。保存されたコピーはそのままです。
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': RIPPS2 はドライブの読み込み中で、I/O プロセッサーを再起動できませんでした。何も変更していません。少し待ってからもう一度お試しください。
  Reading the memory cards: メモリーカードを読み込み中
  The HDD partition BIBLE uses went away. Nothing was changed.: BIBLE が使う HDD パーティションがなくなりました。何も変更していません。
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: HDD の元のブートプログラムが戻りました。BIBLE は HDD から起動しなくなりました。
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 元にあったものは HDD 上の RIPPS2/MBR-BACKUP.KELF に保存されています。ブートローダー > 管理 > 復元 で元に戻せます。
  The security module would not start on this console. Nothing on the memory card was changed.: この本体ではセキュリティモジュールが起動しませんでした。メモリーカード上は何も変更していません。
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
