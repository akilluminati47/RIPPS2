  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALLERA BIBLE PÅ DEN INTERNA HDD:N

    - RIPPS2 kopieras till %s.

    - HDD:ns startprogram som nu ligger i __mbr läses ut och sparas i %s/RIPPS2 (ÅTERSTÄLL lägger tillbaka det).

    - PS2BBL:s HDD-bygge skrivs på dess plats, och konsolen ställs in att starta det vid start.

    - Dess konfiguration (%s) startar RIPPS2 först från %s%s%s, BOOT LOCK på.

    Detta kräver en konsol som startar från sin HDD (en tjock PS2 med nätverksadaptern). Låt den vara på tills det står klart.'
  INTERNAL HDD  (its boot area): INTERN HDD  (dess startområde)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'LÄGG TILLBAKA HDD:NS GAMLA STARTPROGRAM

    Det som BIBLE sparade (RIPPS2/MBR-BACKUP.KELF på HDD:n) går tillbaka till __mbr, i BIBLE:s ställe. RIPPS2 och PS2BBL-konfigurationen stannar där de är.'
  RESTORE: ÅTERSTÄLL
  RESTORE THE HDD'S OLD BOOT PROGRAM: ÅTERSTÄLL HDD:NS GAMLA STARTPROGRAM
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 kan inte avgöra den här konsolens region från dess ROM, så det vet inte vilken systemuppdateringsmapp den läser. BIBLE installerades inte.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 kunde inte öppna HDD:ns partition __sysconf eller __common (fel %d), så BIBLE har ingenstans att spara RIPPS2 och sin konfiguration där. Inget ändrades.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 kunde inte läsa det sparade startprogrammet. Inget ändrades.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 kunde inte skriva tillbaka startprogrammet. Försök igen; den sparade kopian är orörd.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 var upptaget med att läsa en enhet och kunde inte starta om I/O-processorn. Inget ändrades: försök igen om en stund.'
