  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 vet inte var dess mapp finns, så det finns ingenstans att lägga ljuden.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 spelar den här konsolens menymusik, dess webbläsares stämningsstycke (%d:%02d), från BIOS:ets egna noter och skriver den som en WAV på %s till %s; inget minneskort har plats för den. En %s som redan finns där ersätts. Det tar en minut eller två.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 läser ljuden från den här konsolens eget BIOS och skriver dem till %s som sina ljud: markör, bekräfta, avbryt, sidor, kategori, meddelanden, skiva, fel, spara, enheter och slump, plus start- och spelstartsmusiken, spelad från BIOS:ets egna noter. Filer med de namnen som redan finns där ersätts.'
