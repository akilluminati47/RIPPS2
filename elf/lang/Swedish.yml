  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: installerar BIBLE
  
    RIPPS2 körs från %s, som PS2BBL inte kan läsa (det läser minneskort, USB och MX4SIO), och RIPPS2 kopierar inte sig själv. PS2BBL Extended-konfigurationen på det här kortet (%s) läser det: START slår på BOOT LOCK, så att den startar RIPPS2 från %s vid start. Inget annat på kortet ändras.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: installerar BIBLE
  
    RIPPS2 körs från %s, som PS2BBL inte kan läsa: det startar program från ett minneskort, en USB-enhet eller MX4SIO, och RIPPS2 kopierar inte sig själv. Lägg RIPPS2.ELF på en av dem (ett minneskorts APPS-mapp eller en USB-enhet), starta det därifrån och installera sedan BIBLE igen.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: installerar BIBLE
  
    Minneskortet i plats %d: BIBLE (mc%d:/%s) flyttas undan, och det som det ersatte (mc%d:/%s) kommer tillbaka på sin plats. Inget raderas. PS2BBL-konfigurationen förblir som den är (BOOT LOCK kan slå av låset).'
