  POPS_UDPFS_SETTINGS: Nätverksinställningar för POPS UDPFS
  POPS_UDPFS_DISCOVERY: Sparar i varje POPS-mapp på USB. Servern 0.0.0.0 använder upptäckt.
  POPS_UDPFS_NOT_READY: POPS UDPFS behöver matchande giltiga IPCONFIG.DAT och UDPFSCONFIG.DAT i varje POPS-mapp på USB. Konfigurera dem i nätverksinställningarna för POPS.
  HINT_POPS_UDPFS_IP: Statisk PS2-IP som POPS UDPFS-drivrutinen använder efter sin IOP-återställning.
  POPS_UDPFS_ALL_USB_FOLDERS: Alla POPS-mappar på USB
  POPS_UDPFS_INVALID_SUFFIX: ' (ogiltig)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (ofullständig)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS behöver drivrutinsparet .udpfs installerat på minneskortet. Lägg in det manuellt eller slå på BDMA Tillämpa vid start.
  VMC_REPLACE_REQUIRES_DELETE: Att ändra VMC-storleken skulle radera dess sparade spel. Säkerhetskopiera den befintliga VMC:n och använd Ta bort innan du skapar en ny storlek.
  VMC_CREATE_FAILED: Kunde inte skapa VMC:n. Kontrollera enheten, anslutningen och skrivbehörigheten. Befintliga sparfiler ersattes inte.
  RA_EXPERIMENTAL_CARDS: Experimentella Caduceus-kort
  HINT_RA_EXPERIMENTAL_CARDS: Experimentella prestationskort i PS2-spel. Kan flimra eller frysa spel. Bara Caduceus; Av använder den gyllene pulsen. Gäller från nästa spelstart.
  RA_NEUTRINO_UNTRACKED: Neutrino RA är inte tillgängligt för den här starten. Kontrollera RA-körmiljön, hjälparens IP och den sparade bevakningslistan. Startar utan prestationer.
  UDPFS_IP_CONFLICT: En annan enhet i ditt nätverk använder den här PS2:ns IP-adress, så UDPFS-serverns svar går till den. Ange en annan PS2-IP i nätverksinställningarna.
  XERA_ACHIEVEMENTS: RetroAchievements-bibliotek (xeRAbora)
  XERA_USE_LIBRARY: Bläddra i det här spelet via RetroAchievements-biblioteket i huvudmenyn.
  XERA_OPEN_NETWORK: Kan inte nå xeRAbora. Slå på OPEN TO THE NETWORK i dess inställningar, kontrollera RA-hjälparens IP och PC:ns brandvägg.
  XERA_UNKNOWN_GAME: xeRAbora känner inte till den här avbilden. Kör RA-kontrollen av spelstöd först.
  XERA_NOT_PLAYED: Inte i ditt RetroAchievements-bibliotek ännu. Spela det en gång med prestationer och tryck sedan på Select.
  XERA_CONNECTION_ERROR: Kan inte läsa listan från xeRAbora. Tryck på Select för att försöka igen.
  CAD_PAIR_UDPFS: Kan inte nå Caduceus. Para ihop ART/CADUCEUS.KEY i mappen som PS2-Servers delar, och ange RA-hjälparens IP.
  RA_WL_NOT_SAVED: Kunde inte spara bevakningslistan. Se till att spelets enhet eller resurs går att skriva till och kontrollera sedan igen.
  RA_UDPFS_LOAD_FIRST: Öppna UDPFS-sidan en gång så att dess nätverksmodul laddas, och försök sedan igen.
  CAD_UDPFS_IMG: 'Caduceus-bläddraren behöver SMB eller UDPFS Filer: UDPFS IMG har ingen delad mapp för sin nyckel.'
  XERA_SET_CLOCK: Inte i ditt RetroAchievements-bibliotek ännu. Ställ in konsolens klocka i systeminställningarna för att se hela listan, eller spela det en gång med prestationer.
  CFG_TITLES: Visa CFG-titlar i spellistor
  HINT_CFG_TITLES: Visar titeln från varje spels CFG i stället för filnamnet och sorterar efter den. Läser varje CFG när en lista uppdateras, så listor laddas långsammare. Bara visning.
  AUTO_VMC_INVALID: Det här spelets VMC-fil finns men är inte ett giltigt minneskort, så den användes inte och ersattes inte. Spelet startar utan; kontrollera den i VMC-menyn.
  AUTO_VMC_STILL_RUNNING: Det här spelets VMC skapas fortfarande. Starta spelet igen om en stund.
  NEUTRINO_DVR_QUICKBOOT: DVR-start kräver övergången till PSX-läge. Ta bort -qb från de globala och spelspecifika Neutrino-argumenten.
  NEUTRINO_DVR_FILE_MISSING: 'Neutrino-installationen för DVR är ofullständig. Nödvändig fil saknas:'
  PARENLOCK_GAME: Föräldralås
  PARENLOCK_GAME_HINT: Kräv föräldralåsets lösenord för att starta det här spelet.
  PARENLOCK_GAME_NO_PASSWORD: Ange ett lösenord för föräldralåset, annars låses inte det här spelet.
  HINT_ENABLE_PCCF: PC CARD CompactFlash i tidiga japanska PS2:or. Bara inbyggda PS2-spel; CF behöver ensam åtkomst till PC CARD. Starta om för att släppa den.
  PCCF_GAMES: PC CARD CF-spel
  PCCF_UNAVAILABLE: 'CF är inte tillgängligt: kräver en tidig japansk PS2 med PC CARD, ett kompatibelt kort och ingen aktiv DEV9-, HDD- eller nätverksdrivrutin.'
  PCCF_UNSUPPORTED_GAME: CF stöder för närvarande bara inbyggda PS2-spel. VMC på CF, PS1-laddning och nätverksprestationer är inte tillgängliga.
  HINT_ENABLE_DVR: Experimentell upptäckt av DESR DVR-ISO:er. Kräver att HDD-källan är på; spelstart kräver en extern Neutrino med DVR-stöd.
  HINT_RIPPS2_IGR_PAGE: Menyn i spelet, RIPSHOT och hur bilder framkallas.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Skärmbilder från menyn i spelet, till ART för dina teman eller till MEDIA.
  RIPPS2_DEVELOP_SHOTS: Framkalla bilder
  HINT_RIPPS2_DEVELOP_SHOTS: Hur bilderna som väntar på varje spels rulle blir PNG.
  RIPPS2_SETTINGS_HOME: Spara inställningar på
  HINT_RIPPS2_SETTINGS_HOME: 'Var RIPPS2 sparar sina inställningar: sin egen sparfil på ett minneskort, en RIPPS2-mapp på en enhet (den interna HDD:n, USB, MX4SIO, iLink eller MMCE) eller en mapp du skriver.'
  RIPPS2_LAUNCHERS: Startare
  RIPPS2_LOOK_NOW: Sök nu
  HINT_RIPPS2_LOOK_NOW: RIPPS2 söker på de startade enheterna efter POPSTARTER, POPS-filerna, Ember, Embers BIOS och Neutrino och kommer ihåg var var och en finns. Varje start läser dem därifrån.
  RIPPS2_HIDE_GAME: Dölj spel
  RIPPS2_HIDDEN_GAMES: Dolda spel
  HINT_RIPPS2_HIDDEN_GAMES: Spelen som dolts med Dölj spel, på de startade enheterna. Visa ett igen, eller radera det. Varje enhet har sin egen lista.
  HINT_RIPPS2_BDM_DEVICES: 'Enheterna BDM läser spel från: USB, MX4SIO, ett PC Card CF, en DESR:s DVR-enhet och iLink. Den inbyggda HDD:n följer startläget för HDD.'
  HINT_RIPPS2_SCREEN: 'Menyns bild: videoläge, bredbild, var den sitter på tv:n (H-POS, V-POS) och overscan.'
  HINT_RIPPS2_LAYOUT: Var kategorierna sitter och hur en sida kommer in, sedan RIPFLOWs omslag och RIPGRIDs rutnät.
  HINT_RIPPS2_COLORS_TEXT: Textvikt, färgtemat, färgskiftet och varje färg.
  HINT_RIPPS2_TEXT_WEIGHT: 'Hur kraftig RIPPS2:s egen text är: tipsen i Inställningar, STATUS och Om. Normal är som förut; Fet läses bättre på en mjuk bild. Ett temas egna typsnitt behåller de vikter temat ger dem.'
  HINT_RIPPS2_HDD_START: 'Den interna HDD:n, APA eller exFAT: RIPPS2 läser vilken det än är och visar den en gång, som HDD Spel. Auto (snabbast med en disk i) startar den vid start; Av lämnar den i fred.'
  HINT_RIPPS2_THEME_COLOR: Färgtemats egen färg. Välj Egen som färgtema för att välja den själv, som textfärgerna.
  HINT_RIPPS2_SWEEP: Fem färger som temat glider genom, långsamt och mjukt. Regnbåge, ett skifte gjort av varje färgtema eller ditt eget. Av håller färgtemat stilla.
  HINT_RIPPS2_SWEEP_COLORS: Skiftets fem färger och dess hastighet. Ändra ett av RIPPS2:s så sparas det som ditt eget, under namnet du ger det.
  HINT_RIPPS2_SWEEP_NAME: Vad ditt skifte heter i listan Färgskifte.
  HINT_RIPPS2_SWEEP_COLOR: En av de fem färgerna skiftet glider genom, i tur och ordning.
  HINT_RIPPS2_SWEEP_SPEED: 'Hur länge varje färg varar innan nästa tonar in. Även Livlig förblir mjuk: färgerna blinkar aldrig.'
  RIPPS2_HIDE_COMPRESS: Dölj spel och komprimering
  HINT_RIPPS2_SELECT_HOLD: 'SELECT hållen 4.2 s på en spellista. Lista: temana i en panel, välj ett. Växla: nästa tema. Av: inget (ett tryck uppdaterar ändå).'
  RIPPS2_RECENT_GAMES: Senaste spel
  RIPPS2_SET_METADATA_RENAME: Ange metadata (byt namn)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Handkontrollen först (experimentell)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX läser över bussen som handkontrollen delar, och medan en läsning pågår hörs inte handkontrollen: tryck släpar eller försvinner medan omslag laddas. På: omslagen kommer i små bitar med handkontrollen läst emellan, lite långsammare. Av: så snabbt som kortet klarar. Med kortets källor på Auto laddas dess lista en gång, vid start.'
  HINT_RIPPS2_TRUST_CACHE: 'En lista som visas från sin cache står kvar som den är, redo att starta, tills du trycker på SELECT eller RIPPS2 själv ändrar den källan. Av: varje källa läses igen i bakgrunden efter att dess cache visats, en paus som märks på ett MMCE- eller MX4SIO-kort, som delar handkontrollens buss.'
  RIPPS2_STATUS_OPEN: Laddning och enheter
  HINT_RIPPS2_STATUS_OPEN: 'Öppnar STATUS: var starten läser inställningarna och spellistorna, vilken plats som är snabbast, vart ett spels EXIT går, och varje enhet. Dess CACHEINSTÄLLNINGAR leder tillbaka hit.'
  RIPPS2_BADGE_SET: Märkesuppsättning
  HINT_RIPPS2_BADGE_SET: 'Märkena på ett spels infosida (åldersgräns, spelare, ESRB, videoläge, avsökning, bildformat). RIPPS2: sin egen uppsättning, samma på alla teman. Tema: temats egna bilder, eller RIPPS2:s när temat ber om dem.'
  RIPPS2_HINT_FADE: Tona tips och symboler
  HINT_RIPPS2_HINT_FADE: 'Ett knapptips eller en symbol som ändras tonas in, som omslagen, i samma stund som den ändras; de som står kvar lämnas i fred, på varje sida och i varje meddelande. Av: de dyker bara upp. Tema: temat bestämmer (på, om det inte säger hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Sidofältets stil
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klassisk (delad): ikonerna i sidofältets mörka list med den färgade remsan bredvid. XL (ett stycke): en enda bredare list med ikonerna i mitten. Tema: temat bestämmer.'
  HINT_EXITPATH: 'Vart EXIT i menyn i spelet leder. Bäst tomt: EXIT leder till webbläsaren, som startar din bootloader (FreeMcBoot, PS2BBL, OSDMenu eller BIBLE) när en är installerad, och RIPPS2 igen med BOOT LOCK på, som vid start; utan någon, PS2-webbläsaren. En ELF som skrivs här används bara när återställningen kan ladda den (på ett minneskort eller en FAT32-USB-enhet) och den inte är RIPPS2 självt; allt annat leder till webbläsaren.'
  HINT_BDM_START: 'USB, iLink, MX4SIO och exFAT-HDD:n. Auto startar dem vid start: snabbast för de enheter du har anslutna, med deras spel i Alla spel från början. Manuell startar dem när du öppnar deras sida.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino kan inte använda en VMC på APA-HDD:n (exFAT, USB och MX4SIO kan): det här spelet startar med det riktiga kortet i den platsen.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Starten läser bara RIPPS2:s egen enhet: inställningarna och ljuden bredvid RIPPS2.ELF (RIPPS2.FB där säger var) och varje lista från sin cache. De andra enheterna väntar: SELECT på en sida startar dess enheter och hämtar deras bilder (med automatisk uppdatering startar de vid start). Att slå på det kopierar dina ljud, och musiken om det finns plats, till AUDIO bredvid RIPPS2.'
  RIPPS2_ART_PACK: ART-paket
  RIPPS2_ART_PACK_BUILD: Bygg eller ta bort
  HINT_RIPPS2_ART_PACK: Packar ART-mappen på varje startad enhet i en enda art.tar på enheten du väljer (den snabbaste erbjuds först). Omslagen läses då från en fil med ett index, aldrig med en sökning per spel, så menyerna och musiken förblir mjuka. ART-mapparna förblir som de är.
  RIPPS2_LIST_CFG_TEXT: Titel och beskrivning i listan
  HINT_RIPPS2_LIST_CFG_TEXT: 'Spelets titel och beskrivning från dess CFG bredvid listan. Tema: som temat visar dem (RIPPS2:s eget tema utelämnar dem). Infosidan behåller dem i alla fall.'
  RIPPS2_PS1_PREFER: PS1-dubbletter
  HINT_RIPPS2_PS1_PREFER: 'Ett PS1-spel som både är en POPSTARTER-VCD och en Ember-avbild. Båda: två rader. Ember: bara Ember-raden. POPSTARTER: bara VCD:n. Samma titel, ett skiv-ID först undantaget, är samma spel.'
  RIPPS2_MY_PADS: Mina handkontroller
  HINT_RIPPS2_MY_PADS: '.pad-profilerna i mappen PADS bredvid RIPPS2: en textfil per USB-handkontroll, namngiven efter dess ID (2563_0575.pad), och var och en kontrollerad. En handkontroll med profil styr menyn och spelar i spel (Pad Emulator på).'
  RIPPS2_PAD_SETUP: Ställ in en USB-handkontroll
  HINT_RIPPS2_PAD_SETUP: Anslut en USB-handkontroll som RIPPS2 inte känner till, tryck på varje knapp den ber om, så skriver RIPPS2 dess .pad i PADS. SELECT på din PS2-handkontroll hoppar över en knapp.
