# RIPPS2 in Swedish. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Swedish
strings:
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Konsolen ville inte binda BIBLE till minneskortet i plats %d (MagicGate-steget misslyckades). Inget på kortet ändrades. Ett kort som inte är äkta eller MagicGate-kompatibelt kan inte rymma en systemuppdatering."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Ett SD2PSX- eller MMCE-kort kan sluta svara efter en nekad bindning: saknas minneskortet eller MMCE-enheten nu, stäng av och slå på konsolen."
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. The console cannot bind BIBLE to one (an SD2PSX refuses it, then stops answering until the console is turned off and on), so nothing was tried. Its BOOT card has its own PS2BBL: START turns BOOT LOCK on, so it starts RIPPS2 at power on. BIBLE goes on a genuine PS2 memory card.": "RIPPS2: installerar BIBLE\nKortet i plats %d är ett SD2PSX- eller MMCE-kort. Konsolen kan inte binda BIBLE till ett sådant (ett SD2PSX nekar och svarar sedan inte förrän konsolen stängs av och slås på), så inget försöktes. Dess BOOT-kort har en egen PS2BBL: START slår på BOOT LOCK, så att den startar RIPPS2 vid start. BIBLE hör hemma på ett äkta PS2-minneskort."
  "For a standard 8 MB PS2 memory card (a genuine MagicGate card: an SD2PSX or MMCE card cannot be bound): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "För ett vanligt PS2-minneskort på 8 MB (ett äkta MagicGate-kort: ett SD2PSX- eller MMCE-kort kan inte bindas): det i plats %d. Vid start läser PS2BBL konfigurationen i plats 1 före den i plats 0.\n"
  "RIP THIS CONSOLE'S AUDIO": "RIPPA DEN HÄR KONSOLENS LJUD OCH MUSIK"
  "sounds or music, from its BIOS": "ljud eller musik, från dess BIOS"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Öppnar Ljudinställningar vid BIOS-ljud och BIOS-musik: rippa den här konsolens egna ljud eller dess menymusik till AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Startljud På (snabb): %s på minneskortet, när pelarna reser sig"
  "Boot sound On: %s on the memory card, as the pillars rise": "Startljud På: %s på minneskortet, när pelarna reser sig"
  "Boot sound On: %s, once its drive is up": "Startljud På: %s, när dess enhet är redo"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "PLATS 0: %s\nPLATS 1: %s\n%s\nRIPPS2: installerar BIBLE. PS2BBL av El Isra, installerat av RIPPS2 på ett vanligt PS2-minneskort på 8 MB eller den interna hårddisken: en start på 0 ms vid påslag (PS2BBL Extended tillåter inte 0), RIPPS2 först där det ligger (det kopieras aldrig), och en knapp som hålls vid påslag når fortfarande webbläsaren (TRIANGLE), en skiva (START) och det som fanns före (CIRCLE). Installera, reparera eller återställa det som det ersatte?"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Det här spelet startar genom Neutrino, och RIPPS2 hittade ingen: varken på sökvägen i Inställningar, på spelets enhet, på minneskorten eller på någon startad enhet. Lägg rickgaisers Neutrino (github.com/rickgaiser/neutrino) i en mapp neutrino på spelets enhet eller ett minneskort, eller peka Spelstart > Neutrino på den."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Var din Neutrino finns, dess videoläge och argumenten varje Neutrino-start får. Hämta Neutrino på github.com/rickgaiser/neutrino och lägg den i en mapp neutrino på en enhet eller ett minneskort."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Den här Neutrino är äldre än 1.3, som inte kan starta spel från APA-HDD:n. Peka Spelstart > Neutrino på Neutrino 1.3 eller nyare."
  "with rickgaiser's Neutrino as its second game core,": "med rickgaisers Neutrino som sin andra spelkärna,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "den andra spelkärnan, används från din enhet eller ditt minneskort (AFL-3.0)"
