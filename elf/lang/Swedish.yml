  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL binds till det här kortet av konsolen och skrivs som %s/%s.
  
    - Dess konfiguration, mc%d:/SYS-CONF/PS2BBL.INI, startar RIPPS2 där det ligger (%s) utan väntan (0 ms, vilket PS2BBL Extended inte tillåter), BOOT LOCK på. RIPPS2 själv kopieras inte.
  
    I/O-processorn startar om för detta och all läsning från enheter stoppar tills det är klart; musik och enheter kommer tillbaka efteråt. Låt kortet sitta i och konsolen vara på tills det säger klart.'
