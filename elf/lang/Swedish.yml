  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Skrivåtgärder är avstängda, så RIPPS2 kan inte spara ett spels uppgifter eller byta namn på det. Slå på dem?"
  "BIBLE is built on El Isra's PS2BBL, its card and HDD builds signed for RIPPS2 (GPL-3)": "BIBLE bygger på El Isras PS2BBL, och dess versioner för kort och HDD är signerade för RIPPS2 (GPL-3)"
