  HINT_RIPPS2_HINT_LABELS: Kun symbol tegner kun knapperne, til symboler med deres egne ord. Mærker samler hvert tips symbol og titel på ét mærke.
  RIPPS2_HINT_MENU: Menutip (START)
  RIPPS2_HINT_REFRESH: Opdateringstip (SELECT)
  RIPPS2_HINT_STAR: Stjernetip (R3)
  RIPPS2_HINT_VIEW: Visningstip (L3)
