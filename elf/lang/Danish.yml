  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'VED SIDEN AF RIPPS2: %sAUDIO%s, læses først ved start'
  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL 1.2.0 bindes til dette kort af konsollen og skrives som %s/%s.
  
    - Dens konfiguration, mc%d:/PS2BBL/CONFIG.INI, starter RIPPS2, hvor det ligger (%s), uden ventetid (0 ms, som PS2BBL Extended ikke tillader), BOOT LOCK til. RIPPS2 selv kopieres ikke.
  
    I/O-processoren genstarter til dette, og al læsning fra drev stopper, til det er færdigt; musik og drev vender tilbage bagefter. Lad kortet sidde i og konsollen være tændt, til den siger færdig.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Et SD2PSX- eller MMCE-kort kan beskytte sig selv efter en afvist skrivning: mangler hukommelseskortet eller MMCE-drevet nu, så sluk og tænd konsollen.'
  BOOT LOCK ON: BOOT LOCK TIL
  'Done: the memory card in slot %d starts what it started before BBL 1.20. BBL 1.20 is kept in mc%d:/%s.': 'Færdig: hukommelseskortet i plads %d starter det, det startede før BBL 1.20. BBL 1.20 gemmes i mc%d:/%s.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
    '
  : 'Til et almindeligt PS2-hukommelseskort på 8 MB (et MagicGate-kort, eller et SD2PSX- eller MMCE-BOOT-kort): det i plads %d. Ved start læser PS2BBL konfigurationen i plads 2 før den i plads 1.
  
    '
  MEMORY CARD IN SLOT %d  (%s): HUKOMMELSESKORT I PLADS %d  (%s)
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL 1.2.0 kan ikke starte RIPPS2, hvor det ligger nu (det når hukommelseskort, USB-drev og MX4SIO), og RIPPS2 kopierer ikke sig selv. Læg RIPPS2.ELF på et hukommelseskort eller et USB-drev, og start det derfra, eller brug PS2BBL Extended, som læser MMCE og harddisken.
  RESTORE SLOT %d'S OLD BOOT LOADER: GENDAN DEN GAMLE OPSTARTSINDLÆSER I PLADS %d
  ? 'RIPPS2: BBL 1.20 is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BBL 1.20 er sat op på hukommelseskortet i plads %d (mc%d:/%s/%s), BOOT LOCK til: ved start starter det RIPPS2 fra %s med det samme.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    '
  : 'RIPPS2: sætter BBL 1.20 op
  
    '
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: sætter BBL 1.20 op
  
    RIPPS2 kører fra %s, som PS2BBL 1.2.0 ikke kan læse (det læser hukommelseskort, USB og MX4SIO), og RIPPS2 kopierer ikke sig selv. PS2BBL Extended-konfigurationen på dette kort (%s) kan læse det: START slår BOOT LOCK til, så den starter RIPPS2 fra %s ved start. Intet andet på kortet ændres.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: sætter BBL 1.20 op
  
    RIPPS2 kører fra %s, som PS2BBL 1.2.0 ikke kan læse: det starter programmer fra et hukommelseskort, et USB-drev eller MX4SIO, og RIPPS2 kopierer ikke sig selv. Læg RIPPS2.ELF på et af dem (et hukommelseskorts APPS-mappe eller et USB-drev), start det derfra, og sæt så BIBLE op igen.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    The memory card in slot %d: BBL 1.20 (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: sætter BBL 1.20 op
  
    Hukommelseskortet i plads %d: BBL 1.20 (mc%d:/%s) flyttes til side, og det, det erstattede (mc%d:/%s), kommer tilbage på sin plads. Intet slettes. PS2BBL-konfigurationen forbliver, som den er (BOOT LOCK kan slå låsen fra).'
  'RIPPS2: Setting up BBL 1.20 (binding PS2BBL to the memory card)': 'RIPPS2: sætter BBL 1.20 op (binder PS2BBL til hukommelseskortet)'
  'RIPPS2: Setting up BBL 1.20 (putting back what was there)': 'RIPPS2: sætter BBL 1.20 op (lægger det tidligere tilbage)'
  'RIPPS2: Setting up BBL 1.20 (restarting the I/O processor)': 'RIPPS2: sætter BBL 1.20 op (I/O-processoren genstarter)'
  'RIPPS2: Setting up BBL 1.20 (writing it to the memory card)': 'RIPPS2: sætter BBL 1.20 op (skriver det til hukommelseskortet)'
  SET UP BBL 1.20: SÆT BBL 1.20 OP
  ? 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: Setting up BBL 1.20. PS2BBL 1.2.0 by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?'
  : 'PLADS 1: %s
  
    PLADS 2: %s
  
    %s
  
    RIPPS2: sætter BBL 1.20 op. PS2BBL 1.2.0 af El Isra, sat op af RIPPS2 på et almindeligt PS2-hukommelseskort på 8 MB eller den interne harddisk: en start på 0 ms ved tænding (PS2BBL Extended tillader ikke 0), RIPPS2 først, hvor det ligger (det kopieres aldrig), og en knap holdt ved tænding når stadig browseren (TRIANGLE), en disk (START) og det, der var før (CIRCLE). Sæt det op, reparer det eller gendan det, det erstattede?'
  The memory card in slot %d has %d KB free, and BBL 1.20 needs %d KB there. Free some space, then try again.: Hukommelseskortet i plads %d har %d KB ledigt, og BBL 1.20 skal bruge %d KB der. Frigør lidt plads, og prøv igen.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Hukommelseskortet i plads %d afviste PS2BBL, så RIPPS2 lod kortet være, som det var. Tjek dets ledige plads, og prøv igen. (DIAG.TXT ved siden af RIPPS2 har kortets svar.)
  ? The memory card in slot %d would not move BBL 1.20 aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Hukommelseskortet i plads %d ville ikke flytte BBL 1.20 til side, så intet blev ændret. (DIAG.TXT ved siden af RIPPS2 har kortets svar.)
  The memory card in slot %d would not take %s back, so BBL 1.20 stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Hukommelseskortet i plads %d ville ikke tage %s tilbage, så BBL 1.20 blev. (DIAG.TXT ved siden af RIPPS2 har kortets svar.)
