  HINT_NARGS_EXTRA: Andre Neutrino-flag, adskilt af mellemrum, sendt efter alt ovenfor. RIPPS2 tilføjer altid -bsd og -dvd for spillets drev og ISO, -mc0 og -mc1 for dets VMC'er, -gsm for dets videotilstand og spillets egne kompatibilitetstilstande. Et flag med sin egen række ovenfor (som -logo) flyttes til den række, når du gemmer, og sendes stadig.
  HINT_RIPPS2_THEME: Udseendet på hver side. Hold SELECT nede i 4,2 sekunder i spillisten for at skifte til næste tema; et kort tryk på SELECT opdaterer stadig listen.
