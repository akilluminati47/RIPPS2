  RIPPS2_GLYPH_SET: Symbolsæt
  HINT_RIPPS2_GLYPH_SET: 'Knapsymbolerne på hver side: temaets egne, RIPPS2''s, Standard (mørke knapper, farvede tegn) eller Hvid (helt hvid).'
  RIPPS2_HINT_ORDER: Tipsrækkefølge
  HINT_RIPPS2_HINT_ORDER: Ordner tipsene. Tema beholder temaets rækkefølge; Din rækkefølge er den, der indstilles her.
  RIPPS2_HINT_ORDER_FOLLOW: Rækkefølge
  RIPPS2_GRID_LAYOUT: Gitterlayout
  HINT_RIPPS2_GRID_LAYOUT: Hvor mange covers en gitterside rummer, med RIPPS2's afstand. Tema beholder temaets eget.
  RIPPS2_LAUNCH_DISC: Disk ved start
  HINT_RIPPS2_LAUNCH_DISC: Et spils disk kommer ind, når det starter. Pop ind lander og fader ud; Snurre snurrer hurtigere og hurtigere, til spillet begynder; Zoom lander og vokser derefter, så det kan læses tydeligt, og bliver.
  RIPPS2_TRANSITION: Sideovergang
  HINT_RIPPS2_TRANSITION: 'Hvordan en ny side kommer ind, når du går til en anden kategori: ud af temaets baggrundsfarve eller ud af et glimt. Tema beholder temaets valg.'
  RIPPS2_CATEGORY_LAYOUT: Kategorilayout
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Hvor de tre kategorier står: deres navne langs toppen, eller ikoner ned ad sidebjælken, hver med en skuffe med sine sider (Venstre på en liste fører dertil), eller Menu: ingen bjælke, kategorierne i START-menuen som på et tema lavet til OPL. Tema beholder temaets egen.'
