  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK kunne ikke skrive opstartsindlæserens konfiguration. Tjek, at memorykortet eller drevet ikke er skrivebeskyttet, og prøv igen.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK fandt ingen opstartsindlæser-konfiguration at ændre.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK er slået fra. Din opstartsindlæser starter det, den startede før (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK er slået til. %s starter nu RIPPS2 ved opstart (%s), og en tom IGR-sti sender et spils EXIT tilbage samme vej. Hold en af dens knapper nede, mens konsollen starter, for at nå noget andet.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL 1.2.0 on a memory card (Boot Loader).'
  : 'BOOT LOCK satte RIPPS2 først i OSDMenus menu (%s). OSDMenu starter ikke noget af sig selv: vælg RIPPS2 der, og et spils EXIT vender tilbage til den menu. For en konsol, der starter RIPPS2 med det samme, lægger BIBLE PS2BBL 1.2.0 på et memorykort (Opstartsindlæser).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK virker gennem en opstartsindlæser på et memorykort (PS2BBL, FMCB eller OSDMenu), og her er ingen.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Memorykortet i plads %d starter %s ved opstart, og BOOT LOCK fandt ingen konfiguration af den at ændre (den leder efter %s).
