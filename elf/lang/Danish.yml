  HINT_AUTO_CREATE_VMC: At starte et PS2-spil uden VMC i plads 1 opretter et kort på 8 MB på spillets enhed, navngivet som VMC-skærmen foreslår (delt af alle spillets diske), og tildeler det. Under Neutrino ikke på APA-HDD'en (en exFAT-HDD virker).
