  RIPPS2_BIOS_SOUNDS: BIOS-lyde
  HINT_RIPPS2_BIOS_SOUNDS: 'Skriver denne konsols egne menulyde fra dens BIOS til AUDIO-mappen som RIPPS2''s lyde (under 1 MB). Menumusikken er sin egen rip: BIOS-musik.'
  RIPPS2_RIP: Rip
  RIPPS2_HINTS_GLYPHS: Tips og symboler
  HINT_RIPPS2_HINTS_GLYPHS: Hvordan knaptips og symboler ser ud. Hver række starter på Tema, det temaet valgte; ethvert andet valg er dit og går forud for ethvert tema.
  RIPPS2_HINT_LAYOUT: Tipslayout
  HINT_RIPPS2_STARSIDE: 'Hvor et favoritspils stjerne står i spillisten. Venstre: sin egen kolonne i starten af hver række. Højre: efter titlen. Skjult (fra start): ingen stjerne og ingen kolonne, titlerne i fuld længde. Tema: hvad temaet siger. R3 markerer et spil under alle omstændigheder; hold R3 i 4 sekunder på en liste for at skjule stjernerne eller hente dem tilbage (det markerer også spillet under markøren).'
