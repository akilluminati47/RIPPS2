  HINT_RIPPS2_FAST_CACHE: 'Hver kilde gemmer sin seneste spilliste (RIPPS2.LST ved siden af sine CD- og DVD-mapper) og viser den, så snart kilden svarer. Trust Cache bestemmer, om kilden læses igen bagefter. Fra: hver liste læses først fra sin kilde, som før.'
