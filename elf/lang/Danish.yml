  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s har ingen %s. RIPPOPS fandt Sonys PS1-emulator på %s: START kopierer %s hertil og starter spillet.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 ser ikke %s i %s%s. POPSTARTER skal bruge POPS_IOX.PAK med POPS.PAK, eller med POPS.ELF og IOPRP252.IMG: Sonys PS1-emulator, fra din egen konsol. Den kan finde dem, hvor RIPPS2 ikke kigger (starter dine spil, gør den det). START starter, og der spørges ikke igen om dette drev.'
  ' (The configs found were set: %s.)': ' (De fundne konfigurationer blev sat: %s.)'
