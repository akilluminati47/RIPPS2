  POPS_UDPFS_NOT_READY: POPS UDPFS kræver matchende gyldige IPCONFIG.DAT og UDPFSCONFIG.DAT i hver POPS-mappe på USB. Konfigurer dem i netværksindstillingerne for POPS.
  HINT_POPS_UDPFS_IP: Statisk PS2-IP, som POPS UDPFS-driveren bruger efter sin IOP-nulstilling.
  POPS_UDPFS_ALL_USB_FOLDERS: Alle POPS-mapper på USB
  POPS_UDPFS_INVALID_SUFFIX: ' (ugyldig)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (ufuldstændig)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS kræver driverparret .udpfs installeret på memorykortet. Læg det på manuelt, eller slå BDMA Anvend ved start til.
  VMC_REPLACE_REQUIRES_DELETE: At ændre VMC-størrelsen ville slette dens gemte spil. Tag en sikkerhedskopi af den eksisterende VMC, og brug Slet, før du opretter en ny størrelse.
  VMC_CREATE_FAILED: Kunne ikke oprette VMC'en. Tjek enheden, forbindelsen og skriveadgangen. Eksisterende gemte spil blev ikke erstattet.
  RA_EXPERIMENTAL_CARDS: Eksperimentelle Caduceus-kort
  HINT_RA_EXPERIMENTAL_CARDS: Eksperimentelle præstationskort i PS2-spil. Kan flimre eller fryse spil. Kun Caduceus; Fra bruger den gyldne puls. Træder i kraft ved næste spilstart.
  RA_NEUTRINO_UNTRACKED: Neutrino RA er ikke tilgængeligt for denne start. Tjek RA-kørselsmiljøet, hjælperens IP og den gemte overvågningsliste. Starter uden præstationer.
  UDPFS_IP_CONFLICT: En anden enhed på dit netværk bruger denne PS2's IP-adresse, så UDPFS-serverens svar går til den. Angiv en anden PS2-IP i netværksindstillingerne.
  XERA_ACHIEVEMENTS: RetroAchievements-bibliotek (xeRAbora)
  XERA_USE_LIBRARY: Gennemse dette spil via RetroAchievements-biblioteket i hovedmenuen.
  XERA_OPEN_NETWORK: Kan ikke nå xeRAbora. Slå OPEN TO THE NETWORK til i dens indstillinger, og tjek RA-hjælperens IP og pc'ens firewall.
  XERA_UNKNOWN_GAME: xeRAbora kender ikke dette billede. Kør RA-tjekket af spilunderstøttelse først.
  XERA_NOT_PLAYED: Ikke i dit RetroAchievements-bibliotek endnu. Spil det én gang med præstationer, og tryk derefter på Select.
  XERA_CONNECTION_ERROR: Kan ikke læse listen fra xeRAbora. Tryk på Select for at prøve igen.
  CAD_PAIR_UDPFS: Kan ikke nå Caduceus. Par ART/CADUCEUS.KEY i den mappe, PS2-Servers deler, og angiv RA-hjælperens IP.
  RA_WL_NOT_SAVED: Kunne ikke gemme overvågningslisten. Sørg for, at spillets enhed eller deling kan skrives til, og tjek igen.
  RA_UDPFS_LOAD_FIRST: Åbn UDPFS-siden én gang, så dens netværksmodul indlæses, og prøv igen.
  CAD_UDPFS_IMG: 'Caduceus-browseren kræver SMB eller UDPFS Filer: UDPFS IMG har ingen delt mappe til sin nøgle.'
  XERA_SET_CLOCK: Ikke i dit RetroAchievements-bibliotek endnu. Indstil konsollens ur i systemindstillingerne for at se hele listen, eller spil det én gang med præstationer.
  CFG_TITLES: Vis CFG-titler i spillister
  HINT_CFG_TITLES: Viser titlen fra hvert spils CFG i stedet for filnavnet og sorterer efter den. Læser hver CFG, når en liste opdateres, så lister indlæses langsommere. Kun visning.
  AUTO_VMC_INVALID: Dette spils VMC-fil findes, men er ikke et gyldigt memorykort, så den blev hverken brugt eller erstattet. Spillet starter uden; tjek den i VMC-menuen.
  AUTO_VMC_STILL_RUNNING: Dette spils VMC er stadig ved at blive oprettet. Start spillet igen om lidt.
  NEUTRINO_DVR_QUICKBOOT: DVR-start kræver overgangen til PSX-tilstand. Fjern -qb fra de globale og spilspecifikke Neutrino-argumenter.
  NEUTRINO_DVR_FILE_MISSING: 'Neutrino-installationen til DVR er ufuldstændig. Påkrævet fil mangler:'
  PARENLOCK_GAME: Forældrelås
  PARENLOCK_GAME_HINT: Kræv forældrelåsens adgangskode for at starte dette spil.
  PARENLOCK_GAME_NO_PASSWORD: Angiv en adgangskode til forældrelåsen, ellers bliver dette spil ikke låst.
  HINT_ENABLE_PCCF: PC CARD CompactFlash i tidlige japanske PS2'er. Kun indbyggede PS2-spil; CF kræver eneadgang til PC CARD. Genstart for at frigive den.
  PCCF_GAMES: PC CARD CF-spil
  PCCF_UNAVAILABLE: 'CF er ikke tilgængeligt: kræver en tidlig japansk PS2 med PC CARD, et kompatibelt kort og ingen aktiv DEV9-, HDD- eller netværksdriver.'
  PCCF_UNSUPPORTED_GAME: CF understøtter i øjeblikket kun indbyggede PS2-spil. VMC på CF, PS1-indlæsning og netværkspræstationer er ikke tilgængelige.
  HINT_ENABLE_DVR: Eksperimentel registrering af DESR DVR-ISO'er. Kræver, at HDD-kilden er slået til; spilstart kræver en ekstern Neutrino med DVR-understøttelse.
  HINT_RIPPS2_IGR_PAGE: Menuen i spillet, RIPSHOT og hvordan billeder fremkaldes.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Skærmbilleder fra menuen i spillet, til ART til dine temaer eller til MEDIA.
  RIPPS2_DEVELOP_SHOTS: Fremkald billeder
  HINT_RIPPS2_DEVELOP_SHOTS: Hvordan billederne, der venter på hvert spils rulle, bliver til PNG'er.
  RIPPS2_SETTINGS_HOME: Gem indstillinger på
  HINT_RIPPS2_SETTINGS_HOME: 'Hvor RIPPS2 gemmer sine indstillinger: sin egen save på et memorykort, en RIPPS2-mappe på et drev (den interne HDD, USB, MX4SIO, iLink eller MMCE) eller en mappe, du skriver.'
  RIPPS2_LAUNCHERS: Startere
  RIPPS2_LOOK_NOW: Søg nu
  HINT_RIPPS2_LOOK_NOW: RIPPS2 søger på de startede drev efter POPSTARTER, POPS-filerne, Ember, Embers BIOS og Neutrino og husker, hvor hver enkelt er. Hver start læser dem derfra.
  RIPPS2_HIDE_GAME: Skjul spil
  RIPPS2_HIDDEN_GAMES: Skjulte spil
  HINT_RIPPS2_HIDDEN_GAMES: Spillene skjult med Skjul spil, på de startede drev. Vis et igen, eller slet det. Hvert drev har sin egen liste.
  HINT_RIPPS2_BDM_DEVICES: 'De drev BDM læser spil fra: USB, MX4SIO, et PC Card CF, en DESR''s DVR-drev og iLink. Den interne HDD følger HDD-starttilstanden.'
  HINT_RIPPS2_SCREEN: 'Menuens billede: videotilstand, widescreen, hvor det sidder på tv''et (H-POS, V-POS) og overscan.'
  HINT_RIPPS2_LAYOUT: Hvor kategorierne sidder, og hvordan en side kommer ind, derefter RIPFLOWs covers og RIPGRIDs gitter.
  HINT_RIPPS2_COLORS_TEXT: Tekstvægt, farvetemaet, farveskiftet og hver farve.
  HINT_RIPPS2_TEXT_WEIGHT: 'Hvor kraftig RIPPS2''s egen tekst er: tippene i Indstillinger, STATUS og Om. Normal er som før; Fed læses bedre på et blødt billede. Et temas egne skrifttyper beholder de vægte, temaet giver dem.'
  HINT_RIPPS2_HDD_START: 'Den interne HDD, APA eller exFAT: RIPPS2 læser den, hvad den end er, og viser den én gang, som HDD-spil. Automatisk (det hurtigste med en disk i) starter den ved opstart; Fra lader den være.'
  HINT_RIPPS2_THEME_COLOR: Farvetemaets egen farve. Vælg Brugerdefineret som farvetema for selv at vælge den, ligesom tekstfarverne.
  HINT_RIPPS2_SWEEP: Fem farver, temaet glider igennem, langsomt og blødt. Regnbue, et skift lavet af hvert farvetema eller dit eget. Fra holder farvetemaet stille.
  HINT_RIPPS2_SWEEP_COLORS: Skiftets fem farver og dets hastighed. Ændr et af RIPPS2's, så gemmes det som dit eget under det navn, du giver det.
  HINT_RIPPS2_SWEEP_NAME: Hvad dit skift hedder i listen Farveskift.
  HINT_RIPPS2_SWEEP_COLOR: En af de fem farver, skiftet glider igennem, i rækkefølge.
  HINT_RIPPS2_SWEEP_SPEED: 'Hvor længe hver farve varer, før den næste toner frem. Selv Livlig forbliver blød: farverne blinker aldrig.'
  RIPPS2_HIDE_COMPRESS: Skjul spil og komprimering
  HINT_RIPPS2_SELECT_HOLD: 'SELECT holdt 4.2 s på en spilliste. Liste: temaerne i et panel, vælg et. Skift: det næste tema. Fra: intet (et tryk opdaterer stadig).'
  RIPPS2_RECENT_GAMES: Seneste spil
  RIPPS2_SET_METADATA_RENAME: Angiv metadata (omdøb)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Controller først (eksperimentel)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX læser over den bus, controlleren deler, og mens en læsning kører, høres controlleren ikke: tryk halter eller forsvinder, mens covers indlæses. Til: covers kommer i små stykker med controlleren læst imellem, lidt langsommere. Fra: så hurtigt som kortet kan. Med kortets kilder på Automatisk indlæses dets liste én gang, ved opstart.'
  HINT_RIPPS2_TRUST_CACHE: 'En liste, der vises fra sin cache, bliver, som den er, klar til start, indtil du trykker på SELECT, eller RIPPS2 selv ændrer den kilde. Fra: hver kilde læses igen i baggrunden, efter dens cache er vist, en pause, man kan mærke på et MMCE- eller MX4SIO-kort, som deler controllerens bus.'
  RIPPS2_STATUS_OPEN: Indlæsning og drev
  HINT_RIPPS2_STATUS_OPEN: 'Åbner STATUS: hvor opstarten læser indstillingerne og spillisterne, hvilket sted er hurtigst, hvor et spils EXIT går hen, og hvert drev. Dens CACHE-INDSTILLINGER fører tilbage hertil.'
  RIPPS2_BADGE_SET: Mærkesæt
  HINT_RIPPS2_BADGE_SET: 'Mærkerne på et spils infoside (aldersmærke, spillere, ESRB, videotilstand, scanning, format). RIPPS2: sit eget sæt, det samme på alle temaer. Tema: temaets egne billeder, eller RIPPS2''s, når temaet beder om dem.'
  RIPPS2_HINT_FADE: Fade hints og symboler
  HINT_RIPPS2_HINT_FADE: 'Et knaphint eller symbol, der skifter, fader ind, som covers gør, i det øjeblik det skifter; dem, der bliver stående, røres ikke, på hver side og i hver besked. Fra: de dukker bare op. Tema: temaet bestemmer (til, medmindre det siger hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Sidebjælkens stil
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klassisk (delt): ikonerne i sidebjælkens mørke bjælke med den farvede stribe ved siden af. XL (ét stykke): én bredere bjælke med ikonerne i midten. Tema: temaet bestemmer.'
  HINT_EXITPATH: 'Hvor EXIT i menuen i spillet fører hen. Bedst tom: EXIT fører til browseren, som starter din bootloader (FreeMcBoot, PS2BBL, OSDMenu eller BIBLE), når en er installeret, og RIPPS2 igen med BOOT LOCK slået til, som ved tænd; uden en, PS2-browseren. En ELF skrevet her bruges kun, når nulstillingen kan indlæse den (på et hukommelseskort eller et FAT32 USB-drev), og den ikke er RIPPS2 selv; alt andet fører til browseren.'
  HINT_BDM_START: 'USB, iLink, MX4SIO og exFAT-HDD''en. Automatisk starter dem ved opstart: det hurtigste for de drev, du har sat i, med deres spil i Alle spil fra starten. Manuel starter dem, når du åbner deres side.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino kan ikke bruge en VMC på APA-HDD''en (exFAT, USB og MX4SIO kan): dette spil starter med det rigtige kort i den plads.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Starten læser kun RIPPS2''s eget drev: indstillingerne og lydene ved siden af RIPPS2.ELF (RIPPS2.FB der siger hvor) og hver liste fra sin cache. De andre drev venter: SELECT på en side starter dens drev og henter deres billeder (med automatisk opdatering starter de ved start). At slå det til kopierer dine lyde, og musikken hvis der er plads, til AUDIO ved siden af RIPPS2.'
  RIPPS2_ART_PACK: ART-pakke
  RIPPS2_ART_PACK_BUILD: Byg eller fjern
  HINT_RIPPS2_ART_PACK: Pakker ART-mappen på hvert startet drev i én art.tar på det drev, du vælger (det hurtigste tilbydes først). Coverne læses så fra én fil med ét indeks, aldrig med et opslag pr. spil, så menuerne og musikken forbliver glatte. ART-mapperne forbliver, som de er.
  RIPPS2_LIST_CFG_TEXT: Titel og beskrivelse i listen
  HINT_RIPPS2_LIST_CFG_TEXT: 'Spillets titel og beskrivelse fra dets CFG ved siden af listen. Tema: som temaet viser dem (RIPPS2''s eget tema udelader dem). Infosiden beholder dem under alle omstændigheder.'
  RIPPS2_PS1_PREFER: PS1-dubletter
  HINT_RIPPS2_PS1_PREFER: 'Et PS1-spil, der både er en POPSTARTER-VCD og et Ember-billede. Begge: to rækker. Ember: kun Ember-rækken. POPSTARTER: kun VCD''en. Samme titel, et disk-ID foran ikke medregnet, er samme spil.'
  RIPPS2_MY_PADS: Mine controllere
  HINT_RIPPS2_MY_PADS: '.pad-profilerne i mappen PADS ved siden af RIPPS2: én tekstfil pr. USB-controller, navngivet efter dens ID (2563_0575.pad), og hver af dem tjekket. En controller med profil styrer menuen og spiller i spil (Pad Emulator til).'
  RIPPS2_PAD_SETUP: Sæt en USB-controller op
  HINT_RIPPS2_PAD_SETUP: Sæt en USB-controller i, som RIPPS2 ikke kender, tryk på hver knap, den beder om, og RIPPS2 skriver dens .pad i PADS. SELECT på din PS2-controller springer en knap over.
