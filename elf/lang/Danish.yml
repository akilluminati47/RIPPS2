  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 spiller denne konsols menumusik, dens browsers stemningsstykke (%d:%02d), ud fra BIOS'ens egne noder og skriver den som en WAV på %s til %s; intet memorykort har plads til den. En %s, der allerede ligger der, erstattes. Det tager et minut eller to.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 læser lydene fra denne konsols egen BIOS og skriver dem til %s som sine lyde: markør, bekræft, annuller, sider, kategori, beskeder, disk, fejl, gem, drev og tilfældig, plus opstarts- og spilstartmusikken, spillet ud fra BIOS''ens egne noder. Filer med de navne, der allerede ligger der, erstattes.'
