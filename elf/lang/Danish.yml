  AUTO_VMC_FAILED: Kunne ikke oprette dette spils VMC. Spillet starter uden.
  RIPPS2_BIOS_MUSIC: BIOS-musik
  HINT_RIPPS2_BIOS_MUSIC: 'Skriver denne konsols menumusik (dens browsers stemningsstykke, cirka 15 MB som WAV) til en AUDIO-mappe, du vælger: ved siden af RIPPS2 eller OPL''s på et startet drev. For stor til et memorykort. Størrelsen vises først.'
