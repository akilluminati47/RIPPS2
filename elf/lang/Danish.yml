  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALLER BIBLE PÅ DEN INTERNE HDD

    - RIPPS2 kopieres til %s.

    - HDD''ens startprogram, der nu ligger i __mbr, læses ud og gemmes i %s/RIPPS2 (GENDAN sætter det tilbage).

    - PS2BBL 1.2.0''s HDD-build skrives i stedet, og konsollen indstilles til at starte det ved opstart.

    - Dets konfiguration (%s) starter RIPPS2 først fra %s%s%s, BOOT LOCK til.

    Dette kræver en konsol, der starter fra sin HDD (en tyk PS2 med netværksadapteren). Lad den være tændt, indtil der står færdig.'
  INTERNAL HDD  (its boot area): INTERN HDD  (dens startområde)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'SÆT HDD''ENS GAMLE STARTPROGRAM TILBAGE

    Det, BIBLE gemte (RIPPS2/MBR-BACKUP.KELF på HDD''en), går tilbage i __mbr i stedet for BIBLE. RIPPS2 og PS2BBL-konfigurationen bliver, hvor de er.'
  RESTORE: GENDAN
  RESTORE THE HDD'S OLD BOOT PROGRAM: GENDAN HDD'ENS GAMLE STARTPROGRAM
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 kan ikke se denne konsols region ud fra dens ROM, så det ved ikke, hvilken systemopdateringsmappe den læser. BIBLE blev ikke installeret.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 kunne ikke åbne HDD'ens partition __sysconf eller __common (fejl %d), så BIBLE har ingen steder at gemme RIPPS2 og sin konfiguration der. Intet blev ændret.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 kunne ikke læse det gemte startprogram. Intet blev ændret.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 kunne ikke skrive startprogrammet tilbage. Prøv igen; den gemte kopi er urørt.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 havde travlt med at læse et drev og kunne ikke genstarte I/O-processoren. Intet blev ændret: prøv igen om lidt.'
  Reading the memory cards: Læser memorykortene
  The HDD partition BIBLE uses went away. Nothing was changed.: Den HDD-partition, BIBLE bruger, forsvandt. Intet blev ændret.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: HDD'ens gamle startprogram er tilbage. BIBLE starter ikke længere fra HDD'en.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : Konsollen ville ikke binde BIBLE til memorykort %d (MagicGate-trinnet mislykkedes). Intet på kortet blev ændret. Et kort, der ikke er ægte eller MagicGate-kompatibelt, kan ikke rumme en systemopdatering.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Det, der lå der, er gemt i RIPPS2/MBR-BACKUP.KELF på HDD''en: OPSTARTSINDLÆSER > ADMINISTRER > GENDAN sætter det tilbage.'
  The security module would not start on this console. Nothing on the memory card was changed.: Sikkerhedsmodulet ville ikke starte på denne konsol. Intet på memorykortet blev ændret.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Der er intet formateret PS2-memorykort i nogen af stikkene og ingen intern HDD. BIBLE bor på et memorykort eller HDD''en: sæt et kort i, og prøv igen.'
  There is no kept boot program on this HDD. Nothing was changed.: Der er intet gemt startprogram på denne HDD. Intet blev ændret.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Denne HDD har ingen partition __sysconf, så BIBLE's konfiguration skal på et memorykort (PS2BBL læser kortets først), og der er intet kort i nogen af stikkene. Sæt et i, og prøv igen.
