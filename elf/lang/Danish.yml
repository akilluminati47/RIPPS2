  RIPPS2_GRID_WIDE: Gitterlayout til bredformat
  HINT_RIPPS2_GRID_WIDE: Gitterets side kun til et 16:9-billede (bredformat, 720p, 1080i), hvor covers tegnes smallere og flere kan være ved siden af hinanden. Tema bruger temaets eget; Samme følger gitterlayoutet.
  RIPPS2_BGBLUR: Baggrundsslør
  HINT_RIPPS2_BGBLUR: Hvor kraftigt det matte glas slører spillets baggrundsbillede. Tema bruger temaets eget (Svag på RIPGRID og Adapt).
  HINT_RIPPS2_HINT_SLOT: Tippet på denne plads. Tippet, der lå her, flyttes til det valgte tips gamle plads.
  PS1_SAVE_GUIDANCE: PS1-gemte spil afhænger af Ember eller POPSTARTER; PS2's VMC-indstillinger gælder ikke.
  NEUTRINO_SHOW_ARGS: Vis startargumenter
  HINT_NEUTRINO_SHOW_ARGS: Før hver start via Neutrino vises hvert argument, Neutrino får, og du bliver spurgt, om du vil fortsætte. Tilbage går tilbage til menuen uden at starte.
