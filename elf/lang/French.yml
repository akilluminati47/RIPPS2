  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'REMETTRE L''ANCIEN PROGRAMME DE DÉMARRAGE DU DISQUE DUR

    Celui que BIBLE a conservé (RIPPS2/MBR-BACKUP.KELF sur le disque dur) retourne dans __mbr, à la place de BIBLE. RIPPS2 et la configuration PS2BBL restent où ils sont.'
