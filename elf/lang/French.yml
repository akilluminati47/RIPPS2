  PS1_RA_REMOVE_PREVIOUS: Impossible de supprimer le précédent module de succès PS1
  PS1_RA_PREPARE_FAILED: Impossible de préparer les succès PS1. Conservez ou déplacez POPS/MODULE_9.IRX et vérifiez l'accès en écriture du périphérique.
  PS1_RA_CLEAN_DELETE: 'Module RA de RiptOPL inutilisé : POPS/MODULE_9.IRX. Le supprimer pour un lancement propre ?'
  PS1_RA_CLEAN_FAILED: Impossible de supprimer le module RA inutilisé.
  PS1_RA_CLEAN_CONTINUE: Continuer quand même ? Un module RA restant peut envoyer une télémétrie périmée. Non annule le lancement.
  FAV_REMOVED: Retiré des Jeux favoris
  FAV_REMOVE_FAILED: Impossible de retirer des Jeux favoris
  POPS_UDPFS_SETTINGS: Paramètres réseau UDPFS de POPS
  POPS_UDPFS_DISCOVERY: Enregistre dans chaque dossier POPS USB. Le serveur 0.0.0.0 utilise la découverte.
  POPS_UDPFS_NOT_READY: POPS UDPFS demande des IPCONFIG.DAT et UDPFSCONFIG.DAT valides et assortis dans chaque dossier POPS USB. Configurez-les dans Paramètres réseau POPS.
  HINT_POPS_UDPFS_IP: IP statique de la PS2 utilisée par le pilote UDPFS de POPS après sa réinitialisation de l'IOP.
  POPS_UDPFS_ALL_USB_FOLDERS: Tous les dossiers POPS USB
  POPS_UDPFS_INVALID_SUFFIX: ' (invalide)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (incomplet)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS demande la paire de pilotes .udpfs installée sur la carte mémoire. Installez-la à la main ou activez BDMA Appliquer au lancement.
  VMC_REPLACE_REQUIRES_DELETE: Changer la taille de la VMC effacerait ses sauvegardes. Sauvegardez la VMC existante et utilisez Supprimer avant de créer une nouvelle taille.
  VMC_CREATE_FAILED: Impossible de créer la VMC. Vérifiez le périphérique, la connexion et l'accès en écriture. Les sauvegardes existantes n'ont pas été remplacées.
  RA_EXPERIMENTAL_CARDS: Cartes expérimentales Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Cartes de succès PS2 expérimentales en jeu. Peuvent clignoter ou figer les jeux. Caduceus seulement ; Désactivé utilise la pulsation dorée. Prend effet au prochain lancement de jeu.
  RA_NEUTRINO_UNTRACKED: RA pour Neutrino n'est pas disponible pour ce lancement. Vérifiez le module RA, l'IP du compagnon et la liste de suivi enregistrée. Lancement sans succès.
  UDPFS_IP_CONFLICT: Un autre appareil de votre réseau utilise l'adresse IP de cette PS2, les réponses du serveur UDPFS vont donc vers lui. Choisissez une autre IP pour la PS2 dans Paramètres réseau.
  XERA_ACHIEVEMENTS: Bibliothèque RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Parcourez ce jeu via la bibliothèque RetroAchievements du menu principal.
  XERA_OPEN_NETWORK: Impossible de joindre xeRAbora. Activez OPEN TO THE NETWORK dans ses paramètres, vérifiez l'IP du compagnon RA et le pare-feu du PC.
  XERA_UNKNOWN_GAME: xeRAbora ne connaît pas cette image. Lancez d'abord la vérification du support RA.
  XERA_NOT_PLAYED: Pas encore dans votre bibliothèque RetroAchievements. Jouez-y une fois avec les succès, puis appuyez sur Select.
  XERA_CONNECTION_ERROR: Impossible de lire la liste de xeRAbora. Appuyez sur Select pour réessayer.
  CAD_PAIR_UDPFS: Impossible de joindre Caduceus. Associez ART/CADUCEUS.KEY dans le dossier partagé par PS2-Servers, et réglez l'IP du compagnon RA.
  RA_WL_NOT_SAVED: Impossible d'enregistrer la liste de suivi. Vérifiez que le périphérique ou le partage du jeu est inscriptible, puis réessayez.
  RA_UDPFS_LOAD_FIRST: Ouvrez une fois la page UDPFS pour que son module réseau se charge, puis réessayez.
  CAD_UDPFS_IMG: 'Le navigateur Caduceus demande SMB ou UDPFS Fichiers : UDPFS IMG n''a pas de dossier partagé pour sa clé.'
  XERA_SET_CLOCK: Pas encore dans votre bibliothèque RetroAchievements. Réglez l'horloge de la console dans les paramètres système pour voir sa liste complète, ou jouez-y une fois avec les succès.
  CFG_TITLES: Afficher les titres CFG dans les listes
  HINT_CFG_TITLES: Affiche le titre du CFG de chaque jeu au lieu de son nom de fichier, et trie selon lui. Lit chaque CFG quand une liste s'actualise, donc les listes chargent plus lentement. Affichage seulement.
  AUTO_VMC_INVALID: Le fichier VMC de ce jeu existe mais n'est pas une carte mémoire valide, il n'a donc été ni utilisé ni remplacé. Le jeu démarre sans ; vérifiez-le dans le menu VMC.
  AUTO_VMC_STILL_RUNNING: La VMC de ce jeu est encore en cours de création. Relancez le jeu dans un instant.
  NEUTRINO_DVR_QUICKBOOT: Le lancement DVR demande la transition en mode PSX. Retirez -qb des arguments Neutrino globaux et propres au jeu.
  NEUTRINO_DVR_FILE_MISSING: 'L''installation DVR de Neutrino est incomplète. Fichier requis manquant :'
  PARENLOCK_GAME: Contrôle parental
  PARENLOCK_GAME_HINT: Demander le mot de passe du contrôle parental pour lancer ce jeu.
  PARENLOCK_GAME_NO_PASSWORD: Définissez un mot de passe de contrôle parental, sinon ce jeu ne sera pas verrouillé.
  HINT_ENABLE_PCCF: CompactFlash sur PC CARD des premières PS2 japonaises. Jeux PS2 natifs seulement ; la CF demande un accès exclusif à la PC CARD. Redémarrez pour la libérer.
  PCCF_GAMES: Jeux PC CARD CF
  PCCF_UNAVAILABLE: 'CF indisponible : demande une PS2 japonaise à PC CARD des débuts, une carte compatible, et aucun pilote DEV9/disque dur/réseau actif.'
  PCCF_UNSUPPORTED_GAME: La CF ne prend en charge pour l'instant que les jeux PS2 natifs. VMC sur CF, chargement PS1 et succès en réseau ne sont pas disponibles.
  HINT_ENABLE_DVR: Découverte expérimentale des ISO DESR DVR. Demande la source disque dur activée ; le lancement demande un Neutrino externe compatible DVR.
  HINT_RIPPS2_IGR_PAGE: Le menu en jeu, RIPSHOT et le développement des clichés.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Des captures depuis le menu en jeu, dans ART pour vos thèmes ou dans MEDIA.
  RIPPS2_DEVELOP_SHOTS: Développer les clichés
  HINT_RIPPS2_DEVELOP_SHOTS: Comment les clichés en attente sur la pellicule de chaque jeu deviennent des PNG.
  RIPPS2_SETTINGS_HOME: Enregistrer les paramètres sur
  HINT_RIPPS2_SETTINGS_HOME: 'Où RIPPS2 garde ses paramètres : sa propre sauvegarde sur une carte mémoire, un dossier RIPPS2 sur un lecteur (le disque dur interne, USB, MX4SIO, iLink ou MMCE), ou un dossier que vous saisissez.'
  RIPPS2_LAUNCHERS: Lanceurs
  RIPPS2_LOOK_NOW: Chercher maintenant
  HINT_RIPPS2_LOOK_NOW: RIPPS2 cherche sur les périphériques démarrés POPSTARTER, les fichiers POPS, Ember, le BIOS d'Ember et Neutrino, et retient où se trouve chacun. Chaque lancement les lit à cet endroit.
  RIPPS2_HIDE_GAME: Masquer le jeu
  RIPPS2_HIDDEN_GAMES: Jeux masqués
  HINT_RIPPS2_HIDDEN_GAMES: Les jeux masqués avec Masquer le jeu, sur les périphériques démarrés. Affichez-en un à nouveau, ou supprimez-le. Chaque périphérique garde sa propre liste.
  HINT_RIPPS2_BDM_DEVICES: 'Les périphériques où BDM lit les jeux : USB, MX4SIO, une carte PC Card CF, le disque DVR d''un DESR et iLink. Le disque dur interne suit le démarrage du disque dur.'
  HINT_RIPPS2_SCREEN: 'L''image du menu : mode vidéo, écran large, sa place sur le téléviseur (H-POS, V-POS) et overscan.'
  HINT_RIPPS2_LAYOUT: Où se placent les catégories et comment une page arrive, puis les jaquettes de RIPFLOW et la grille de RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Graisse du texte, la couleur du thème, le fondu de couleurs et chaque couleur.
  HINT_RIPPS2_TEXT_WEIGHT: 'L''épaisseur du texte de RIPPS2 lui-même : les infobulles des réglages, ÉTAT et À propos. Normal est comme avant ; Gras se lit mieux sur une image douce. Les polices d''un thème gardent les graisses qu''il leur donne.'
  HINT_RIPPS2_HDD_START: 'Le disque dur interne, APA ou exFAT : RIPPS2 lit celui qu''il est et l''affiche une fois, dans Disque dur interne. Automatique (le plus rapide avec un disque en place) le démarre au lancement ; OFF le laisse tranquille.'
  HINT_RIPPS2_THEME_COLOR: La couleur propre au thème. Choisissez Personnalisée comme couleur du thème pour la choisir vous-même, comme les couleurs du texte.
  HINT_RIPPS2_SWEEP: Cinq couleurs que le thème traverse, lentement et en douceur. Arc-en-ciel, un fondu tiré de chaque couleur de thème, ou le vôtre. Désactivé garde le thème immobile.
  HINT_RIPPS2_SWEEP_COLORS: Les cinq couleurs du fondu et sa vitesse. Modifiez-en un de RIPPS2 et il est gardé comme le vôtre, sous le nom que vous lui donnez.
  HINT_RIPPS2_SWEEP_NAME: Le nom de votre fondu dans la liste Fondu de couleurs.
  HINT_RIPPS2_SWEEP_COLOR: L'une des cinq couleurs que traverse le fondu, dans l'ordre.
  HINT_RIPPS2_SWEEP_SPEED: 'La durée de chaque couleur avant que la suivante n''apparaisse. Même Vif reste doux : les couleurs ne clignotent jamais.'
  RIPPS2_HIDE_COMPRESS: Masquer le jeu et compression
  HINT_RIPPS2_SELECT_HOLD: 'SELECT maintenu 4.2 s sur une liste de jeux. Liste : les thèmes dans un panneau, choisissez-en un. Défilement : le thème suivant. Désactivé : rien (un appui actualise toujours).'
  RIPPS2_RECENT_GAMES: Jeux récents
  RIPPS2_SET_METADATA_RENAME: Définir les métadonnées (renommer)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Manette d'abord (expérimental)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'Le SD2PSX lit par le bus que partage la manette, et pendant une lecture la manette n''est pas entendue : les appuis traînent ou se perdent pendant le chargement des jaquettes. Activé : les jaquettes arrivent en petits morceaux, la manette lue entre eux, un peu plus lentement. Désactivé : aussi vite que va la carte. Avec les sources de la carte sur Automatique, sa liste se charge une fois, au démarrage.'
  HINT_RIPPS2_TRUST_CACHE: 'Une liste affichée depuis son cache reste telle quelle, prête à lancer, jusqu''à ce que vous appuyiez sur SELECT ou que RIPPS2 modifie lui-même cette source. Désactivé : chaque source est relue en arrière-plan après l''affichage de son cache, une pause qui se sent sur une carte MMCE ou MX4SIO, qui partagent le bus de la manette.'
  RIPPS2_STATUS_OPEN: Chargement et périphériques
  HINT_RIPPS2_STATUS_OPEN: 'Ouvre ÉTAT : où le démarrage lit les réglages et les listes de jeux, quel endroit est le plus rapide, où va l''EXIT d''un jeu, et chaque périphérique. Son RÉGLAGES DU CACHE revient ici.'
  RIPPS2_BADGE_SET: Jeu de badges
  HINT_RIPPS2_BADGE_SET: 'Les badges de la page d''infos d''un jeu (note, joueurs, ESRB, mode vidéo, balayage, format). RIPPS2 : son propre jeu, le même sur chaque thème. Thème : les images du thème, ou celles de RIPPS2 quand le thème les demande.'
  RIPPS2_HINT_FADE: Fondu des aides et des symboles
  HINT_RIPPS2_HINT_FADE: 'Une aide de bouton ou un symbole qui change apparaît en fondu, comme les jaquettes, au moment où il change ; ceux qui restent ne bougent pas, sur chaque page et chaque message. Désactivé : ils apparaissent simplement. Thème : le thème décide (activé sauf s''il indique hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Style de la barre latérale
  HINT_RIPPS2_SIDEBAR_STYLE: 'Classique (séparé) : les icônes dans la bande sombre de la barre latérale, avec la bande colorée à côté. XL (d''un seul tenant) : une seule bande plus large, les icônes en son milieu. Thème : le thème décide.'
  HINT_EXITPATH: 'Où mène EXIT dans le menu en jeu. Mieux vaut le laisser vide : EXIT mène au navigateur, qui lance ton chargeur de démarrage (FreeMcBoot, PS2BBL, OSDMenu ou BIBLE) s''il y en a un d''installé, puis à nouveau RIPPS2 avec BOOT LOCK activé, comme à la mise sous tension ; sans chargeur, le navigateur de la PS2. Un ELF saisi ici n''est utilisé que si la réinitialisation peut le charger (sur une carte mémoire ou une clé USB en FAT32) et que ce n''est pas RIPPS2 lui-même ; tout le reste mène au navigateur.'
  HINT_BDM_START: 'USB, iLink, MX4SIO et le disque dur exFAT. Automatique les démarre au lancement : le plus rapide pour les périphériques branchés, leurs jeux dans Tous les jeux dès le début. Manuel les démarre quand vous ouvrez leur page.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino ne peut pas utiliser de VMC sur le disque dur APA (exFAT, USB et MX4SIO le peuvent) : ce jeu démarre avec la vraie carte dans ce port.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Le démarrage ne lit que le lecteur de RIPPS2 : la configuration et les sons à côté de RIPPS2.ELF (RIPPS2.FB y indique où) et chaque liste depuis son cache. Les autres lecteurs attendent : SELECT sur une page démarre ses lecteurs et charge leurs images (avec l''actualisation automatique, ils démarrent au démarrage). L''activer copie tes sons, et la musique s''il y a la place, dans AUDIO à côté de RIPPS2.'
  RIPPS2_ART_PACK: Pack ART
  RIPPS2_ART_PACK_BUILD: Construire ou supprimer
  HINT_RIPPS2_ART_PACK: Met le dossier ART de chaque périphérique démarré dans un seul art.tar sur le périphérique choisi (le plus rapide est proposé en premier). Les jaquettes viennent alors d'un seul fichier avec un seul index, jamais d'une recherche par jeu, et les menus comme la musique restent fluides. Les dossiers ART restent tels quels.
  RIPPS2_LIST_CFG_TEXT: Titre et description dans la liste
  HINT_RIPPS2_LIST_CFG_TEXT: 'Le titre et la description du jeu tirés de sa CFG à côté de la liste. Thème : comme le thème les montre (le thème de RIPPS2 les masque). La page d''infos les garde dans tous les cas.'
  RIPPS2_PS1_PREFER: Doublons PS1
  HINT_RIPPS2_PS1_PREFER: 'Un jeu PS1 présent à la fois en VCD POPSTARTER et en image Ember. Les deux : deux lignes. Ember : seulement celle d''Ember. POPSTARTER : seulement la VCD. Le même titre, sans l''ID de disque en tête, est le même jeu.'
  RIPPS2_MY_PADS: Mes manettes
  HINT_RIPPS2_MY_PADS: 'Les profils .pad du dossier PADS à côté de RIPPS2 : un fichier texte par manette USB, nommé d''après son ID (2563_0575.pad), chacun vérifié. Une manette profilée pilote le menu et joue dans les jeux (Pad Emulator activé).'
  RIPPS2_PAD_SETUP: Configurer une manette USB
  HINT_RIPPS2_PAD_SETUP: Branchez une manette USB que RIPPS2 ne connaît pas, appuyez sur chaque bouton demandé, et RIPPS2 écrit son .pad dans PADS. SELECT sur votre manette PS2 passe un bouton.
