  Copies the Neutrino RIPPS2 carries to a drive or a memory card. A Neutrino of your own is used as it is.: Copie le Neutrino qu'embarque RIPPS2 sur un périphérique ou une carte mémoire. Votre propre Neutrino est utilisé tel quel.
  DIAG.TXT, for a bug report: DIAG.TXT, pour un rapport de bug
  Drives, loading, launchers and homebrew: Périphériques, chargement, lanceurs et homebrews
  ? Fast Cache shows each drive's last game list the moment the drive answers; Trust Cache keeps it until you press SELECT. Both on, with the settings on the memory card RIPPS2 starts from, is the quickest boot.
  : Fast Cache affiche la dernière liste de jeux de chaque périphérique dès qu'il répond ; Trust Cache la garde jusqu'à ce que vous appuyiez sur SELECT. Les deux activés, avec les réglages sur la carte mémoire d'où démarre RIPPS2, donnent le démarrage le plus rapide.
  Fast Cache, Trust Cache: Fast Cache, Trust Cache
  'Game lists: Fast Cache off, so each one is read from its drive at boot': 'Listes de jeux : Fast Cache désactivé, chacune est donc lue sur son périphérique au démarrage'
  'Game lists: each shows at once from its cache and stands until SELECT': 'Listes de jeux : chacune s''affiche aussitôt depuis son cache et reste jusqu''à SELECT'
  'Game lists: each shows at once from its cache, then is read again': 'Listes de jeux : chacune s''affiche aussitôt depuis son cache, puis est relue'
  LOADING: CHARGEMENT
  Makes RIPPS2's sounds from this console's own BIOS and writes them to the AUDIO folder.: Crée les sons de RIPPS2 à partir du BIOS de cette console et les écrit dans le dossier AUDIO.
  'No music yet: Audio settings > BIOS Music rips this console''s menu music.': 'Pas encore de musique : Réglages audio > Musique du BIOS extrait la musique du menu de cette console.'
  SAVE DIAGNOSTICS: ENREGISTRER LES DIAGNOSTICS
  Searches the drives for POPSTARTER, the POPS files, Ember, Ember's BIOS and Neutrino, and remembers where each one is.: Cherche sur les périphériques POPSTARTER, les fichiers POPS, Ember, le BIOS d'Ember et Neutrino, et retient où se trouve chacun.
  'Settings: %s, on a drive the boot waits for (a memory card is quicker)': 'Réglages : %s, sur un périphérique que le démarrage attend (une carte mémoire est plus rapide)'
  'Settings: %s, read first (the quickest place)': 'Réglages : %s, lus en premier (l''endroit le plus rapide)'
  Starts every drive now (USB, the HDD, MMCE, MX4SIO and the network), so each one and its space shows here.: Démarre maintenant chaque périphérique (USB, le disque dur, MMCE, MX4SIO et le réseau), pour que chacun et son espace s'affichent ici.
  The IP and SMB share POPSTARTER uses for PS1 games over the network.: L'IP et le partage SMB que POPSTARTER utilise pour les jeux PS1 par le réseau.
  The diagnostics are in %s.: Les diagnostics sont dans %s.
  The diagnostics could not be written to %s.: Les diagnostics n'ont pas pu être écrits dans %s.
  What each memory card starts at power on; install or repair BIBLE, PS2BBL set up to start RIPPS2.: Ce que chaque carte mémoire lance à l'allumage ; installer ou réparer BIBLE, PS2BBL réglé pour lancer RIPPS2.
  Where POPSTARTER and Ember are, and how PS1 games start.: Où se trouvent POPSTARTER et Ember, et comment démarrent les jeux PS1.
  Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets.: Où se trouve votre Neutrino, son mode vidéo et les arguments que reçoit chaque lancement Neutrino.
  ? Writes what RIPPS2 noted about the pads, the drives, MMCE cards and the last launches to DIAG.TXT beside RIPPS2. Send it with a bug report.
  : Écrit ce que RIPPS2 a noté sur les manettes, les périphériques, les cartes MMCE et les derniers lancements dans DIAG.TXT, à côté de RIPPS2. Joignez-le à un rapport de bug.
  back to Cache: retour au Cache
  what boot reads first: ce que le démarrage lit d'abord
  ? This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer, or clear the path to use the one RIPPS2 carries.
  : Ce Neutrino est antérieur à 1.3, qui ne peut pas lancer de jeux depuis le disque dur APA. Pointez Lancement des jeux > Neutrino vers Neutrino 1.3 ou plus récent, ou videz le chemin pour utiliser celui qu'embarque RIPPS2.
  ', the sounds': ', les sons'
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot est activé. RIPPS2 démarre depuis son propre lecteur (%s) : la configuration%s et chaque liste depuis son cache. Les autres lecteurs démarrent quand tu appuies sur SELECT sur leur page ou que tu lances un de leurs jeux.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot est activé. Les sons prennent %d Ko et la carte mémoire d'où RIPPS2 tourne a %d Ko libres, ils restent donc dans %s.
  ' (%d KB free)': ' (%d Ko libres)'
  ' (%u MB free)': ' (%u Mo libres)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'À CÔTÉ DE RIPPS2 : %sAUDIO%s, lu en premier au démarrage'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL est lié à cette carte par la console et écrit sous %s/%s.
  
    - Sa configuration, mc%d:/SYS-CONF/PS2BBL.INI, démarre RIPPS2 là où il est (%s) sans attente (0 ms, ce que PS2BBL Extended ne permet pas), BOOT LOCK activé. RIPPS2 lui-même n''est pas copié.
  
    Le processeur d''E/S redémarre pour cela et toute lecture de lecteur s''arrête jusqu''à la fin ; la musique et les lecteurs reviennent après. Laisse la carte en place et la console allumée jusqu''à ce qu''il annonce la fin.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Une carte SD2PSX ou MMCE peut se protéger après une écriture refusée : si la carte mémoire ou le lecteur MMCE manque maintenant, éteins puis rallume la console.'
  BOOT LOCK ON: BOOT LOCK ACTIVÉ
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Terminé : la carte mémoire du port %d démarre ce qu''elle démarrait avant BIBLE. BIBLE est conservé dans mc%d:/%s.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
    '
  : 'Pour une carte mémoire PS2 standard de 8 Mo (une carte MagicGate, ou une carte BOOT SD2PSX ou MMCE) : celle du port %d. À l''allumage, PS2BBL lit la configuration du port 2 avant celle du port 1.
  
    '
  MEMORY CARD IN SLOT %d  (%s): CARTE MÉMOIRE DU PORT %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL ne peut pas démarrer RIPPS2 depuis son emplacement actuel (il atteint les cartes mémoire, les lecteurs USB et MX4SIO), et RIPPS2 ne se copie pas lui-même. Mets RIPPS2.ELF sur une carte mémoire ou un lecteur USB et démarre-le de là, ou utilise PS2BBL Extended, qui lit MMCE et le disque dur.
  RESTORE SLOT %d'S OLD BOOT LOADER: RESTAURER L'ANCIEN CHARGEUR DU PORT %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2 : BIBLE est installé sur la carte mémoire du port %d (mc%d:/%s/%s), BOOT LOCK activé : à l''allumage il démarre aussitôt RIPPS2 depuis %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2 : installation de BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2 : installation de BIBLE
  
    RIPPS2 tourne depuis %s, que PS2BBL ne sait pas lire (il lit les cartes mémoire, l''USB et MX4SIO), et RIPPS2 ne se copie pas lui-même. La configuration PS2BBL Extended de cette carte (%s) le lit : START active BOOT LOCK, pour qu''elle démarre RIPPS2 depuis %s à l''allumage. Rien d''autre ne change sur la carte.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2 : installation de BIBLE
  
    RIPPS2 tourne depuis %s, que PS2BBL ne sait pas lire : il démarre les programmes depuis une carte mémoire, un lecteur USB ou MX4SIO, et RIPPS2 ne se copie pas lui-même. Mets RIPPS2.ELF sur l''un d''eux (le dossier APPS d''une carte mémoire ou un lecteur USB), démarre-le de là, puis installe BIBLE à nouveau.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2 : installation de BIBLE
  
    La carte mémoire du port %d : BIBLE (mc%d:/%s) est mis de côté, et ce qu''il avait remplacé (mc%d:/%s) reprend sa place. Rien n''est supprimé. La configuration PS2BBL reste telle quelle (BOOT LOCK peut désactiver le verrou).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2 : installation de BIBLE (liaison de PS2BBL à la carte mémoire)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2 : installation de BIBLE (remise en place de l''ancien)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2 : installation de BIBLE (redémarrage du processeur d''E/S)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2 : installation de BIBLE (écriture sur la carte mémoire)'
  SET UP BIBLE: INSTALLER BIBLE
  ? 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: Setting up BIBLE. PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?'
  : 'PORT 1 : %s
  
    PORT 2 : %s
  
    %s
  
    RIPPS2 : installation de BIBLE. PS2BBL d''El Isra, installé par RIPPS2 sur une carte mémoire PS2 standard de 8 Mo ou le disque dur interne : un démarrage à 0 ms à l''allumage (PS2BBL Extended n''autorise pas 0), RIPPS2 d''abord depuis son emplacement (il n''est jamais copié), et un bouton maintenu à l''allumage mène toujours au navigateur (TRIANGLE), à un disque (START) et à ce qu''il y avait avant (CIRCLE). L''installer, le réparer ou restaurer ce qu''il a remplacé ?'
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: La carte mémoire du port %d a %d Ko libres et BIBLE y a besoin de %d Ko. Libère de la place puis réessaie.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : La carte mémoire du port %d a refusé PS2BBL, RIPPS2 a donc remis la carte comme elle était. Vérifie sa place libre puis réessaie. (DIAG.TXT à côté de RIPPS2 contient ce que la carte a répondu.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : La carte mémoire du port %d n'a pas voulu mettre BIBLE de côté, rien n'a donc changé. (DIAG.TXT à côté de RIPPS2 contient ce que la carte a répondu.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): La carte mémoire du port %d n'a pas voulu reprendre %s, BIBLE est donc resté. (DIAG.TXT à côté de RIPPS2 contient ce que la carte a répondu.)
  MUSIC: MUSIQUE
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s n''a pas de %s. RIPPOPS a trouvé l''émulateur PS1 de Sony sur %s : START copie %s ici et lance le jeu.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 ne voit pas %s dans %s%s. POPSTARTER a besoin de POPS_IOX.PAK avec POPS.PAK, ou avec POPS.ELF et IOPRP252.IMG : l''émulateur PS1 de Sony, de ta propre console. Il peut les trouver là où RIPPS2 ne regarde pas (si tes jeux démarrent, c''est le cas). START lance, et ce lecteur n''est plus redemandé.'
  ' (The configs found were set: %s.)': ' (Les configurations trouvées ont été réglées : %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Enregistrez une fois ses réglages avec son propre configurateur, puis réactivez BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s ne peut pas lancer RIPPS2 depuis son emplacement actuel (%s), et RIPPS2 ne se copie pas. Mettez RIPPS2.ELF sur une carte mémoire ou une clé USB et lancez-le depuis là.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK n'a pas pu écrire la configuration du chargeur de démarrage. Vérifiez que la carte mémoire ou le lecteur n'est pas protégé en écriture, puis réessayez.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK n'a trouvé aucune configuration de chargeur de démarrage à modifier.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK est désactivé. Votre chargeur de démarrage lance ce qu'il lançait avant (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK est activé. %s lance maintenant RIPPS2 à l'allumage (%s), et un Chemin IGR vide renvoie l'EXIT d'un jeu par le même chemin. Maintenez l'un de ses boutons pendant le démarrage de la console pour accéder à autre chose.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK a placé RIPPS2 en premier dans le menu d''OSDMenu (%s). OSDMenu ne lance rien de lui-même : choisissez RIPPS2 là, et l''EXIT d''un jeu revient à ce menu. Pour une console qui lance RIPPS2 tout de suite, BIBLE installe PS2BBL sur une carte mémoire (Chargeur de démarrage).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK passe par un chargeur de démarrage sur une carte mémoire (PS2BBL, FMCB ou OSDMenu), et il n'y en a aucun ici.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: La carte mémoire du port %d lance %s à l'allumage, et BOOT LOCK n'a trouvé aucune de ses configurations à modifier (il cherche %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'La carte mémoire du port %d lance %s à l''allumage, que BOOT LOCK ne peut pas régler : il passe par PS2BBL, FMCB et OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Un chargeur de démarrage avec le verrou de RIPPS2 est sur cette console.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT d''un jeu : le navigateur, puis votre chargeur de démarrage (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'Utilisé : %s, %d images, %d Mo'
  'Measuring how fast each drive reads its art: %s': 'Mesure de la vitesse à laquelle chaque périphérique lit ses images : %s'
  'None: each picture is read from its own ART folder.': 'Aucun : chaque image est lue dans son propre dossier ART.'
  REMOVE the pack in %s (the ART folders stay as they are): SUPPRIMER le pack de %s (les dossiers ART restent tels quels)
  Remove the ART Pack in %s? The ART folders stay as they are.: Supprimer le pack ART de %s ? Les dossiers ART restent tels quels.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Arrêté. Le pack inachevé a été supprimé, et les images viennent des dossiers ART comme avant.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Le pack ART n''a pas pu être écrit dans %s (y a-t-il de la place sur ce périphérique ?). Rien d''autre n''a changé : les images viennent des dossiers ART comme avant.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Le pack ART de %s est supprimé. Les images viennent de nouveau des dossiers ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Aucun dossier ART avec des images sur les périphériques démarrés. Démarre les périphériques où sont tes images (SELECT sur leur page), puis reviens.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d images de %d dossiers ART vont dans un seul fichier, %s. Les dossiers ART restent tels quels : le pack est une copie. Tu peux copier art.tar dans le dossier ART d''un autre périphérique avec Memory Files, mais le construire sur le périphérique où tu navigues est le plus rapide, c''est pourquoi le périphérique le plus rapide est proposé en premier. Le construire maintenant ?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Le pack ART est construit : %d images, %d Mo, dans %s (%d s). Les images viennent de lui désormais, et les %d jeux pour lesquels il a été construit ne voient plus jamais leur dossier ART interrogé image par image. Les images que RIPPS2 télécharge ou capture s''affichent tout de suite ; celles que tu copies depuis un PC s''affichent quand tu reconstruis le pack.'
  '%s free': '%s libres'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar : lit %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar : lit %s/s, le plus rapide, %s'
  ART PACK: PACK ART
  About %d min: Environ %d min
  'Looking at the ART folders: %d pictures, %s': 'Lecture des dossiers ART : %d images, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 'Aucun périphérique démarré n''a la place pour le pack ART : il lui faut environ %s. Libère de la place sur le périphérique où tu navigues, puis réessaie.'
  PACKING THE ART: MISE EN PACK DES IMAGES
  PICTURE %d OF %d: IMAGE %d SUR %d
  'Pictures: %d (%s). ART folders: %d.': 'Images : %d (%s). Dossiers ART : %d.'
  Stop? The unfinished pack is removed; the ART folders stay as they are.: Arrêter ? Le pack inachevé est supprimé ; les dossiers ART restent tels quels.
  'The ART folders stay as they are: the pack is a copy.': 'Les dossiers ART restent tels quels : le pack est une copie.'
  Under a minute: Moins d'une minute
  free space unknown: place libre inconnue
  'A game''s EXIT: the browser, or your boot loader when one is installed': 'EXIT d''un jeu : le navigateur, ou ton chargeur de démarrage s''il y en a un d''installé'
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): Ogg Vorbis par Xiph.Org (BSD), minimp3 par lieff (CC0)
  RIPFLOW's type, and every message and notification: la police de RIPFLOW, et de chaque message et notification
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Merci à tous ceux qui testent sur Discord et ouvrent des issues sur GitHub :'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'L''IGR Path %s n''est pas utilisé : après un jeu, seul un fichier sur carte mémoire ou USB peut se charger, et jamais RIPPS2 lui-même'
  an issue is the best way to get RIPPS2 updated.: une issue est le meilleur moyen de faire évoluer RIPPS2.
  your Ogg and MP3 music, as RIPPS2 plays it: ta musique Ogg et MP3, telle que RIPPS2 la joue
  Pop In and Name: Apparition et nom
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s démarre après les piliers, donc le son de démarrage arrive en retard. START copie boot.adp (%d Ko) à côté de RIPPS2 sur la carte mémoire (%d Ko libres), où il joue pendant que les piliers s''élèvent.'
  The boot sound could not be copied to %s. It still plays from %s.: Le son de démarrage n'a pas pu être copié vers %s. Il joue toujours depuis %s.
  Zoom: Zoom
  '%s could not be deleted; it stays as it was.': '%s n''a pas pu être supprimé ; il reste tel quel.'
  '%s could not be read as a .tar archive. Nothing was changed.': '%s n''a pas pu être lu comme une archive .tar. Rien n''a changé.'
  '%s is deleted. %s is kept.': '%s est supprimé. %s est gardé.'
  Art loads from it from now on.: Les images se chargent depuis celui-ci désormais.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : 'Supprimer le .tar fusionné ?
  
    SUPPRIMÉ : %s
  
    GARDÉ : %s (la destination, avec désormais toutes les images des deux)'
  Into %s (%s): Dans %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : 'GARDÉ et mis à jour : %s (%d images)
  
    FUSIONNÉ : %s (%d images)
  
    Images présentes dans les deux : %d. Celle du fusionné l''emporte. Le .tar gardé est réécrit comme un nouveau fichier et n''est remplacé que lorsqu''il est complet, donc un arrêt ou un périphérique plein le laisse tel quel. Fusionner maintenant ?'
  MERGE .TAR: FUSIONNER .TAR
  MERGE a .tar into the pack in %s: FUSIONNER un .tar dans le pack de %s
  MERGING THE ART: FUSION DES IMAGES
  Merge in %s (%s): Fusionner %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Fusionner le nouveau pack dans un autre .tar ? Vous choisissez ensuite le .tar à garder et à mettre à jour ; les images du nouveau pack y entrent.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Fusionné : %s contient maintenant %d images (%d Mo), %d s.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Images ajoutées : %d (%s). Même nom dans les deux : %d (celle du fusionné l''emporte).'
  'Reading the archives: %s': 'Lecture des archives : %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Arrêter ? Le .tar gardé reste tel quel ; la copie inachevée est supprimée.
  Stopped. %s is as it was; the unfinished copy was removed.: Arrêté. %s est tel quel ; la copie inachevée a été supprimée.
  The kept .tar is only replaced once the merged copy is whole.: Le .tar gardé n'est remplacé qu'une fois la copie fusionnée complète.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: La fusion n'a pas pu être écrite sur le périphérique de %s (y a-t-il de la place ?). Il est tel quel ; rien d'autre n'a changé.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : La fusion demande environ %s libres sur le périphérique de %s (la nouvelle archive est d'abord écrite à côté de l'ancienne). Libérez de la place, puis réessayez.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'La fusion s''est arrêtée entre deux renommages : le .tar gardé est %s et le fusionné %s. Rendez-leur leur nom avec Fichiers mémoire.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : Le .tar fusionné a été écrit mais n'a pas pu prendre le nom %s (une MMCE renomme à partir du firmware 1.4.0). Le nouveau fichier a été supprimé ; le .tar gardé est tel quel.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : Aucun autre .tar à fusionner dans %s. Mettez-le dans ce dossier, dans le dossier ART d'un périphérique ou à la racine d'un périphérique, puis réessayez.
  MERGE A .TAR INTO THIS: FUSIONNER UN .TAR ICI
  ? '
  
    %d game button maps in GAMES'
  : '
  
    %d mappages de boutons de jeu dans GAMES'
  ? '
  
    1 game button map in GAMES'
  : '
  
    1 mappage de boutons de jeu dans GAMES'
  (no name): (sans nom)
  Both: Les deux
  ? 'None yet. A profile is a text file named after the pad''s ID, like 2563_0575.pad: the format is in RIPPS2''s repo (docs/plans/pad-spec.md).'
  : 'Aucun pour l''instant. Un profil est un fichier texte nommé d''après l''ID de la manette, comme 2563_0575.pad : le format est dans le dépôt de RIPPS2 (docs/plans/pad-spec.md).'
  On (fast): Activé (rapide)
  'Pad profiles in %s:': 'Profils de manette dans %s :'
  RIPPS2 %s lite (build %d) on RiptOPL %s: RIPPS2 %s lite (build %d) sur RiptOPL %s
  RIPPS2 cannot tell where its folder is, so it cannot look for PADS.: RIPPS2 ne sait pas où est son dossier, il ne peut donc pas chercher PADS.
  could not be read: illisible
  About %d seconds left: Encore environ %d secondes
  About 1 second left: Encore environ 1 seconde
  Taking longer than its last start (%d s so far): Plus long que son dernier démarrage (%d s jusqu'ici)
  ? 'Download the covers in HD (280 x 400)? Sharper on an HD screen, about 70 KB each. START: Standard (140 x 200, as Open PS2 Loader''s), about 20 KB each. A game that already has a cover keeps it.'
  : 'Télécharger les jaquettes en HD (280 x 400) ? Plus nettes sur un écran HD, environ 70 Ko chacune. START : Standard (140 x 200, comme Open PS2 Loader), environ 20 Ko chacune. Un jeu qui a déjà une jaquette la garde.'
  STANDARD: STANDARD
  '%d IN': '%d AJOUTÉS'
  '%d IN, %d REPLACED': '%d AJOUTÉS, %d REMPLACÉS'
  COULD NOT WRITE: ÉCRITURE IMPOSSIBLE
  'Getting it ready: %s': 'Préparation : %s'
  NOT A .TAR: PAS UN .TAR
  NOTHING CHANGED: RIEN DE CHANGÉ
  NOTHING TO PUT IN: RIEN À AJOUTER
  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : Activé (rapide) garde le son de démarrage à côté de RIPPS2 sur la carte mémoire d'où il démarre, et RIPPS2 n'a pas démarré d'une carte. Le son de démarrage joue comme Activé.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'Pas encore de son de démarrage à copier : Paramètres audio > Sons du BIOS extrait ceux de cette console.'
  ? This is RIPPS2 lite, which carries no PS2BBL, so it cannot set up BIBLE. The full RIPPS2.elf installs and repairs it; a boot loader already set up keeps starting RIPPS2 lite as it is.
  : Ceci est RIPPS2 lite, qui n'embarque pas PS2BBL, il ne peut donc pas installer BIBLE. Le RIPPS2.elf complet l'installe et le répare ; un chargeur déjà installé continue de lancer RIPPS2 lite tel quel.
  '%d COPIED OUT': '%d COPIÉS HORS'
  '%d ITEM   %d MARKED   %s': '%d ÉLÉMENT   %d MARQUÉ   %s'
  '%d ITEM   %d MARKED   %s   %s FREE': '%d ÉLÉMENT   %d MARQUÉ   %s   %s LIBRE'
  '%d ITEMS   %d MARKED   %s': '%d ÉLÉMENTS   %d MARQUÉS   %s'
  '%d ITEMS   %d MARKED   %s   %s FREE': '%d ÉLÉMENTS   %d MARQUÉS   %s   %s LIBRE'
  '%s IN %d': '%s DANS %d'
  '%s IN %d, %s FREE': '%s DANS %d, %s LIBRE'
  ', %d LEFT OUT': ', %d LAISSÉS DE CÔTÉ'
  COPY IT OUT TO OPEN IT: COPIEZ-LE HORS POUR L'OUVRIR
  'Copying out: %s': 'Copie hors : %s'
  INVERT MARKS: INVERSER LES MARQUES
  NO FILES ON THE CLIPBOARD: AUCUN FICHIER DANS LE PRESSE-PAPIERS
  SIZE AND FREE SPACE: TAILLE ET ESPACE LIBRE
  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS dans le menu en jeu active ou désactive chaque cheat du jeu pendant la partie. Les changements s'appliquent à RESUME ; un cheat désactivé cesse d'écrire, ce qu'il a écrit reste. Nécessite les Cheats activés pour le jeu.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Pas de CHEATS dans le menu en jeu : les cheats cochés avant le lancement tournent tout le jeu, comme avant.'
  BOOT SOUND WITH THE PILLARS: SON DE DÉMARRAGE AVEC LES PILIERS
  'Boot Sound: On (fast)': 'Son de démarrage : Activé (rapide)'
  'Boot sound On (fast): %s, as the pillars rise': 'Son de démarrage Activé (rapide) : %s, quand les piliers montent'
  'Boot sound On: from the AUDIO folder, once its drive is up': 'Son de démarrage Activé : depuis le dossier AUDIO, une fois son lecteur prêt'
  Boot sound off (Audio settings > Boot Sound): Son de démarrage désactivé (Paramètres audio > Son de démarrage)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: Copie boot.adp à côté de RIPPS2 sur la carte mémoire d'où il démarre, où le démarrage le lit avant qu'un lecteur soit prêt.
  '%s could not be written.': '%s n''a pas pu être écrit.'
  '%s is there already and could not be put aside, so it was left as it was.': '%s existe déjà et n''a pas pu être mis de côté, il a donc été laissé tel quel.'
  Circle: Rond
  Cross: Croix
  Down: Bas
  Down on the d-pad: Bas sur la croix directionnelle
  Found %04X:%04X. Let go of everything on it, sticks too, and wait.: '%04X:%04X trouvée. Relâchez tout dessus, sticks compris, et attendez.'
  Got it. Let go.: Reçu. Relâchez.
  L3 (press the left stick in): L3 (enfoncez le stick gauche)
  Left on the d-pad: Gauche sur la croix directionnelle
  Nothing was set up, so no file was written.: Rien n'a été configuré, donc aucun fichier n'a été écrit.
  ? Plug in the USB pad you want to set up. If it is in already, take it out and plug it in again. Then press any button on it once.
  : Branchez la manette USB à configurer. Si elle est déjà branchée, débranchez-la puis rebranchez-la. Appuyez ensuite une fois sur n'importe quel bouton.
  Press %s on the USB pad and hold it.: Appuyez sur %s sur la manette USB et maintenez.
  Push %s and hold it.: Poussez %s et maintenez.
  R3 (press the right stick in): R3 (enfoncez le stick droit)
  Right on the d-pad: Droite sur la croix directionnelle
  Save: Enregistrer
  Saved as %s. The pad now steers the menu, and plays in games with the Pad Emulator on.: Enregistré sous %s. La manette pilote maintenant le menu et joue dans les jeux avec le Pad Emulator activé.
  Skip: Passer
  Square: Carré
  This pad cannot be described in a .pad yet (%s), so no file was written.: Cette manette ne peut pas encore être décrite dans un .pad (%s), donc aucun fichier n'a été écrit.
  Triangle: Triangle
  'Try it. What you hold shows here:': 'Essayez. Ce que vous maintenez s''affiche ici :'
  Up: Haut
  Up on the d-pad: Haut sur la croix directionnelle
  the left stick down: le stick gauche vers le bas
  the left stick to the right: le stick gauche vers la droite
  the right stick down: le stick droit vers le bas
  the right stick to the right: le stick droit vers la droite
labels:
  HINT_NEUTRINO_AUTO_ELF: Transmet l'ELF de démarrage du jeu à Neutrino pour chercher sa configuration par titre. Activé par défaut ; une option Boot ELF réglée à la main a la priorité.
  HINT_POPSTARTER_PATH: Emplacement de POPSTARTER.ELF. Laissé vide, RIPPS2 en renseigne un qu'il trouve sur un périphérique ; écrivez par-dessus pour en utiliser un autre, comme usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Les arguments de Neutrino dépassent la longueur enregistrable. Raccourcissez un champ avant d'enregistrer.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Les arguments de lancement de Neutrino dépassent la limite sûre. Raccourcissez les arguments globaux ou ceux du jeu.
  NEUTRINO_AUTO_ELF: Boot ELF automatique (-elf)
  HINT_NEUTRINO_PATH: 'Où se trouve neutrino.elf ? <non défini> = Périphérique du jeu -> mc0/mc1. Un chemin complet personnalisé est essayé en premier. Exemples : mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Affichage des jeux PS2/PS1
  HINT_GAME_VIEW_MODE: Tout liste ensemble les jeux PS2 et PS1, et L3 alterne entre Tout, PS1 et PS2. PS2 ou PS1 n'affiche que ce type et désactive L3. APPS et Jeux favoris ont leurs propres règles d'affichage.
  VIEW_MIXED: Jeux PS2 + PS1 affichés
  VIEW_PS1_ELF: Applis PS1 ELF affichées
  APPS_DISPLAY: Affichage des applications
  HINT_APPS_DISPLAY: Tout affiche chaque ELF dans une seule liste APPS, L3 désactivé. Applis / PS1ELF place les titres contenant [PS1] dans une seconde page L3 ; le lancement ne change pas.
  VIEW: Vue
  VIEW_PS2: Jeux PS2 favoris affichés
  VIEW_PS1: Jeux PS1 favoris affichés
  VIEW_ELF: ELF favoris affichés
  VIEW_ALL: Tous les jeux favoris affichés
  VMC_FRAGMENTED_ON_CREATE: VMC créée, mais fragmentée. L'émulation de carte mémoire demande un fichier d'un seul tenant, cette VMC sera donc ignorée au lancement et la vraie carte utilisée à la place. Libérez de l'espace et recréez-la, ou copiez-en une depuis un autre périphérique.
  KEYB_MOVE_CURSOR: Déplacer le curseur
  TITLECOLOR: Couleur du titre du jeu
  RA_CHECK_GAME: Vérifier le support RetroAchievements
  RA_TEST_LINK: Tester la liaison PC RetroAchievements
  RA_CHECKING_IMAGE: Vérification de l'image, cela prend quelques secondes...
  RA_CHECK_RUNNING: Une vérification d'image est déjà en cours
  RA_LOOKING_FOR_PC: Recherche du client PC...
  RA_UL_UNSUPPORTED: Les jeux UL/USBExtreme ne peuvent pas encore être vérifiés
  RA_UL_UNSUPPORTED2: Seules les images .iso simples dans DVD/ ou CD/ sont prises en charge
  RA_UNKNOWN_IMAGE: RetroAchievements ne connaît pas cette image
  RA_STILL_IDENTIFYING: Le PC identifie encore l'image
  RA_TRY_AGAIN: Réessayez dans quelques secondes
  RA_NO_SOCKET: La console n'a pas pu ouvrir de socket réseau
  RA_NO_SOCKET2: Redémarrez la console, ou vérifiez le périphérique ETH dans les paramètres
  RA_TEST_NO_SOCKET2: Vérifiez le câble et ETH dans les paramètres ; si le réseau fonctionne, redémarrez la console
  RA_PC_NO_ANSWER: Le client PC n'a pas répondu
  RA_PC_NO_ANSWER2: Vérifiez que xeRAbora tourne, ou essayez le test de liaison PC
  RA_SUPPORTED: Pris en charge par RetroAchievements
  RA_START_TO_TRACK: Lancez le jeu pour suivre les succès
  RA_ACHIEVEMENTS: '%d succès'
  RA_ACHIEVEMENTS_FULL: '%d succès -- %d débloqués, %d non pris en charge'
  RA_HASH_FAILED: L'empreinte de l'image n'a pas pu être calculée
  RA_HASH_FAILED2: Voir RA/hashes.txt à côté des jeux pour la raison
  RA_NET_BUSY: Le réseau est utilisé par un transport UDP
  RA_NET_BUSY2: RA a besoin de la pile SMB -- changez de protocole, ou créez le .wl sur le PC
  RA_NET_BUSY_HASH: L'empreinte est dans RA/hashes.txt -- xeRAbora peut en créer le .wl
  RA_NO_IP: La console n'a pas d'adresse IP
  RA_NO_IP2: Vérifiez le DHCP ou l'adresse statique dans les paramètres réseau
  RA_TEST_NO_ANSWER: Aucun client PC n'a répondu en 3 secondes
  RA_TEST_NO_ANSWER2: Console%s. Vérifiez que xeRAbora tourne et que le port UDP 18194 est ouvert
  RA_TEST_FOUND: Client PC trouvé%s%s %s
  RA_TEST_FOUND2: Réponse en %u ms, console%s
  RA_NA_NEUTRINO: Le suivi RA demande le noyau <OPL> -- les lancements Neutrino ne chargent jamais ee_core
  RA_NA_UDPFS: Le suivi RA n'est pas disponible sur UDPFS -- les jeux s'y lancent via Neutrino
  RA_NA_PS1: Le suivi RA n'est pas disponible pour les jeux PS1
  RA_NA_HDD: Informations de jeu APA ou dossier de paramètres du disque dur indisponibles
  RA_NA_HDD2: Définissez un dossier de paramètres valide sur le disque dur et actualisez avant de vérifier le support
  RA_TELEMETRY: Télémétrie RetroAchievements
  RA_BADGES: Badges RetroAchievements
  HTTP_GAMES: Jeux HTTP
  HTTP_SERVER: Serveur HTTP
  HTTP_PORT: Port HTTP
  HTTP_BASE_PATH: Chemin de base HTTP
  HTTP_TEST: Tester le serveur HTTP
  HTTP_TEST_OK: Serveur OK -- jeux listés
  HTTP_TEST_EMPTY: Le catalogue est vide -- valide, mais cela ne prouve rien sur les plages d'octets
  HTTP_TEST_NO_ISO: Le catalogue n'a aucune image prise en charge pour tester une plage d'octets
  HTTP_ERR_CONNECT: Impossible de joindre le serveur HTTP
  HTTP_ERR_CATALOG: games.csv est absent, illisible ou trop gros
  HTTP_ERR_RANGE: Le serveur n'a pas renvoyé exactement les octets demandés
  HTTP_LAUNCH_UNAVAILABLE: Le lancement HTTP n'est pas encore implémenté -- le catalogue est seulement consultable
  HTTP_ERR_COMPRESSED: Les images compressées (.zso) ne sont pas encore prises en charge en HTTP
  HTTP_NO_VMC: Les cartes mémoire virtuelles ne sont pas disponibles en HTTP -- utilisez une vraie carte
  HTTP_TAB_HINT: HTTP lit games.csv depuis votre serveur. Réglez l'adresse, le port et le chemin de base dans les paramètres réseau, puis utilisez Tester.
  RA_DISC_CHECK: 'RA : vérifier le support du disque'
  RA_DISC_LAUNCH: 'RA : lancer le disque'
  RA_DISC_CHECKING: Vérification du disque pour RetroAchievements
  RA_DISC_HASH_FAILED: L'empreinte du disque n'a pas pu être calculée -- voir RA/hashes.txt dans le dossier des paramètres
  RA_DISC_HOME_ERROR: Le dossier des paramètres ne peut pas servir aux listes de suivi des disques
  RA_DISC_ENABLE: Activez d'abord la télémétrie RetroAchievements dans les paramètres réseau
  RA_DISC_CHECK_FIRST: 'Aucune liste de suivi pour ce disque -- utilisez d''abord RA : vérifier le support du disque'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d : disque dur trouvé, mais sa table de partitions APA est illisible. Ne le formatez pas -- vos jeux sont peut-être récupérables.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d : un périphérique n''a pas été monté car ses secteurs ne font pas 512 octets (par ex. un disque à secteurs de 4K). OPL ne lit que les secteurs de 512 octets.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Ce titre est sa propre partition APA, et OPL ne modifie jamais la table des partitions. Renommez-le sur un PC.
  POPS_SETTINGS_UNREADABLE: Impossible de lire les paramètres de POPSTARTER -- la carte mémoire est occupée ou illisible. Réessayez une fois le chargement terminé.
  GLOBAL_PS_EMULATION_SETTINGS: Paramètres globaux d'émulation PS
  RA_NO_LINK_UNTRACKED: Réseau indisponible -- lancement sans RetroAchievements cette fois.
  IGR_USB_DRIVERS_PROMPT: Le chemin IGR est sur USB, mais il manque USBD.IRX et USBHDFSD.IRX dans %s, dont la console a besoin pour atteindre l'USB après un In-Game Reset. Sans eux, l'IGR retombe sur le navigateur PS2. Copier maintenant les pilotes de RiptOPL ? FMCB, OpenTuna et d'autres exploits chargent aussi ces fichiers et peuvent se comporter différemment avec eux. Les fichiers existants ne sont jamais remplacés. USB FAT32 uniquement.
  IGR_USB_DRIVERS_FAILED: Impossible de copier les pilotes USB dans %s (carte pleine ou non inscriptible). L'IGR retombera sur le navigateur PS2.
  OFFICIAL_CFG_NOTIFICATION: Paramètres officiels d'OPL chargés depuis %s
  CFM_VMODE_HOLD_KEEP: Maintenir pour garder
  BDM_PS2_FOLDERS_UNREADABLE: Impossible d'ouvrir le dossier CD ou DVD dans %s (erreur %d), ce périphérique ne liste donc aucun jeu PS2. Appuyez sur SELECT sur sa page pour réessayer.
  NEUTRINO_BD_NO_DEVICE_NUMBER: Le système de fichiers Neutrino est réglé sur bd, mais ce périphérique n'a jamais indiqué son numéro, Neutrino ne peut donc pas être dirigé vers lui. Réglez le système de fichiers Neutrino de ce jeu sur Auto ou exfat.
  CFM_VMODE_REVERT_IN: Retour en arrière dans %d s
  EMBER_DITHER: Tramage Ember
  HINT_EMBER_DITHER: Tramage d'Ember (activé ou désactivé), écrit dans EMBER/settings.txt du périphérique lancé. Une valeur par jeu a la priorité.
  EMBER_SHADING: Ombrage Ember
  HINT_EMBER_SHADING: 'Profondeur de couleur d''Ember : 15 bits, ou 24 bits (expérimental). Écrite dans EMBER/settings.txt du périphérique lancé. Une valeur par jeu a la priorité.'
  EMBER_CONTROLLER: Manette Ember
  HINT_EMBER_CONTROLLER: 'Mode de manette d''Ember : Auto, Analogique ou D2A. Mieux vaut généralement le régler par jeu (Triangle > Paramètres de jeu Ember), ce qui a la priorité.'
  EMBER_480P_CONFIRM: Ember en 480p n'affiche aucune image en composite. Utiliser le 480p ?
  EMBER_SHADING_24: 24 bits (expérimental)
  EMBER_GAME_SETTINGS: Paramètres de jeu Ember
  HINT_EMBER_GAME_SETTING: Ce jeu seulement. Appuyez sur OK pour écrire EMBER/games/<nom>/settings.txt avant le lancement. Un Défaut non modifié garde la valeur existante du fichier ; remettre une valeur sur Défaut supprime sa surcharge.
  EMBER_TIMING: Synchronisation Ember
  HINT_EMBER_TIMING: 'Synchronisation vidéo d''Ember : Auto suit la région du disque, NTSC force 60 Hz, PAL force 50 Hz. Écrite dans EMBER/settings.txt du périphérique lancé.'
  EMBER_GLOBAL_WARNING: Ces paramètres Ember s'appliquent à tous les jeux PS1, et certains jeux plantent avec eux. Pour n'en changer qu'un, utilisez Triangle > Paramètres de jeu Ember sur ce jeu.
  RIPPS2_RANDOM: Aléatoire
  RIPPS2_ALL: Tout
  RIPPS2_RANDOM_GAME: Jeu aléatoire
  HINT_RIPPS2_RANDOM_GAME: L2 et R2 ensemble sautent sur un jeu au hasard. Au démarrage ouvre aussi chaque liste sur un jeu au hasard.
  RIPPS2_ALL_GAMES: Tous les jeux
  RIPPS2_SET_METADATA: Définir les métadonnées
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 'Lance RIPPS2 à l''allumage via votre chargeur de démarrage : PS2BBL et FMCB le lancent tout de suite, OSDMenu le met en premier dans son menu, et l''EXIT d''un jeu revient par le même chemin. Désactivé remet ce qu''il y avait avant. Aucun encore ? Chargeur de démarrage installe BIBLE.'
  HINT_COLORS_TEXT: La couleur du texte de la liste des jeux. Les thèmes ont la leur ; ceci la change pour les thèmes intégrés.
  HINT_COLORS_SELECTED: La couleur du jeu choisi et de la ligne choisie dans les pages de paramètres.
  HINT_COLORS_DIALOG: La couleur des pages de paramètres et des boîtes de message.
  HINT_COLORS_TITLE: La couleur du nom d'un jeu sur sa page d'infos.
  HINT_COLORS_BACKGROUND: La couleur derrière tout le reste quand aucune illustration ni tour n'est dessinée.
  HINT_COLORS_PLASMA: La couleur vers laquelle tend l'ancien fond plasma d'OPL (le thème <OPL>).
  HINT_COLORS_RESET: Remet les six couleurs ci-dessus à celles du thème.
  HINT_COVERFLOW_COUNT: Combien de jaquettes RIPFLOW affiche de chaque côté de celle choisie.
  HINT_COVERFLOW_SCALE: La taille de la jaquette choisie dans RIPFLOW par rapport aux autres.
  HINT_COVERFLOW_ANIM: La vitesse à laquelle les jaquettes glissent quand vous parcourez le flux.
  HINT_NARGS_QB: 'Quick Boot : saute l''écran de démarrage de Neutrino. Activé ici, il est envoyé pour chaque jeu ; désactivé, RIPPS2 l''envoie quand même de lui-même pour les jeux USB, iLink et réseau, où il est nécessaire.'
  HINT_NARGS_DBC: 'Couleurs de débogage : Neutrino remplit l''écran d''une couleur à chaque étape du chargement, pour qu''une photo montre où un jeu s''arrête.'
  HINT_NARGS_LOGO: Affiche le logo PS2 avant le jeu (un second redémarrage de l'IOP, dont certains périphériques iLink ont besoin). Désactivé ici, RIPPS2 suit Lancement des jeux > Logo PS2, et ne l'envoie jamais pour les jeux MMCE ou réseau.
  HINT_NARGS_CWD: 'Le dossier que le jeu voit comme le sien. Vide : celui par défaut de Neutrino.'
  HINT_NARGS_CFG: 'Un fichier de configuration Neutrino à vous (-cfg). Vide : celui de Neutrino.'
  HINT_NARGS_ELF: 'Lance cet ELF au lieu du fichier de démarrage indiqué par le disque. Vide : celui du jeu.'
  HINT_NARGS_ATA0: Une image de disque dur que Neutrino monte comme disque dur interne de la console, pour les jeux qui l'utilisent (-ata0).
  HINT_NARGS_ATA0ID: Le fichier d'identifiant qui accompagne cette image de disque dur (-ata0id).
  HINT_NARGS_ATA1: Une seconde image de disque dur (-ata1).
  RIPPS2_LAST_USED: Dernier utilisé
  RIPPS2_PAGE_BUTTONS: Boutons de page
  HINT_RIPPS2_PAGE_BUTTONS: 'Les gâchettes qui tournent les pages de la liste des jeux. L2 / R2 : elles tournent les pages et L1 / R1 changent de catégorie. L1 / R1 : elles tournent les pages et L2 / R2 changent de catégorie. Thème : le thème décide ; sans lui, L2 va au début et R2 à la fin. L2 + R2 ensemble choisissent toujours un jeu au hasard.'
  RIPPS2_IGR_MENU: Menu en jeu
  HINT_RIPPS2_IGR_MENU: 'Activé : L1+L2+R1+R2+SELECT+START met le jeu en pause : reprendre, quitter, prendre une capture, voir les succès ou éteindre. Désactivé : la combinaison quitte le jeu aussitôt, comme avant.'
  RIPPS2_BOOT_LOADER: Chargeur de démarrage
  HINT_RIPPS2_BOOT_LOADER: Montre ce que chaque carte mémoire lance à l'allumage, et installe BIBLE (PS2BBL réglé pour RIPPS2). Les anciens fichiers de démarrage de la carte sont conservés.
  RIPPS2_MANAGE: Gérer
  RIPPS2_ACHIEVEMENTS: Succès
  RIPPS2_NBD_SERVER: Serveur NBD
  HINT_RIPPS2_NBD_SERVER: Partage le disque dur avec un PC par le réseau. Un écran d'état reste affiché pendant son fonctionnement.
  RIPPS2_START: Démarrer
  RIPPS2_COVER_ART: Jaquettes
  HINT_RIPPS2_COVER_ART: Télécharge une jaquette pour chaque jeu PS2 de vos listes démarrées qui n'en a pas, dans le dossier ART de son périphérique, depuis ps2-covers de xlenore sur GitHub. Demande le câble réseau et Internet.
  RIPPS2_DOWNLOAD: Télécharger
  RIPPS2_GLYPHS: Icônes de la croix
  HINT_RIPPS2_GLYPHS: 'Les icônes de la croix directionnelle à côté des noms de périphériques et de formations. Fondu entrant les montre quand vous changez ; Fondu sortant les montre à l''ouverture d''une page. Thème : le thème décide.'
  RIPPS2_COLOR_THEME: Couleur du thème
  HINT_RIPPS2_COLOR_THEME: 'Une couleur pour les tours, les orbes, le verre, le lecteur CD et le navigateur de fichiers, sur les trois onglets. Thème : le thème décide (bleu RIPPS2 sinon).'
  RIPPS2_HINTS: Aide des boutons
  HINT_RIPPS2_HINTS: 'L''aide des boutons en bas de l''écran. Fondu au repos la masque jusqu''à ce que vous appuyiez sur un bouton. Thème : le thème décide.'
  RIPPS2_CATEGORY_BAR: Catégories/Barre latérale
  HINT_RIPPS2_CATEGORY_BAR: 'LANCER UN DISQUE, STOCKAGE et FICHIERS MÉMOIRE : les noms en haut, ou la barre latérale. Fondu au repos estompe les noms, ou fait glisser la barre latérale, jusqu''à ce que vous appuyiez sur un bouton ; elle revient aussitôt. Thème : le thème décide.'
  RIPPS2_SOURCE_NAME: Nom de la source
  RIPPS2_STATUS: État
  RIPPS2_SOURCE: Source
  HINT_RIPPS2_SOURCE_NAME: 'Le nom de la source au-dessus des jeux (TOUS LES JEUX, JEUX HDD, etc.). Fondu au repos l''estompe avec la barre des catégories ; Apparition l''affiche plutôt en grand au milieu de la page, comme L3 nomme la liste, à la première liste après le démarrage et à chaque changement de source, puis il s''estompe. Apparition et nom fait les deux. Les thèmes peuvent faire d''Apparition leur Affiché. Thème : le thème décide.'
  RIPPS2_RECENTS: Jeux récents
  HINT_RIPPS2_RECENTS: 'Jeux récents, une page de la barre latérale avec vos derniers jeux lancés, le plus récent d''abord : combien elle en garde, de 1 à 99 (Triangle saisit le nombre). Un jeu dont le périphérique est en Manuel le démarre quand vous le choisissez. 0 désactive la page.'
  RIPPS2_CATEGORY_ORDER: Ordre des catégories
  HINT_RIPPS2_CATEGORY_ORDER: 'Échange Lancer un disque et Fichiers mémoire : Fichiers mémoire en premier et Lancer un disque en dernier, sur les noms de la barre comme sur les icônes de la barre latérale. Fait pour RIPFLOW (Interface > Thème). Thème : le thème décide.'
  RIPPS2_MUSIC: Musique
  HINT_RIPPS2_MUSIC: Joue les fichiers bgm du dossier AUDIO à côté de RIPPS2 et du dossier AUDIO d'OPL sur chaque périphérique démarré (Ogg sans balises, ou WAV 16 bits) ; celui nommé Menu est joué en premier. La musique propre d'un thème est jouée à la place.
  RIPPS2_BIOS_SOUNDS: Sons du BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Écrit les sons de menu de cette console, tirés de son BIOS, dans le dossier AUDIO comme sons de RIPPS2 (moins de 1 Mo). La musique du menu a sa propre extraction : Musique du BIOS.'
  RIPPS2_RIP: Extraire
  RIPPS2_HINTS_GLYPHS: Aide et icônes
  HINT_RIPPS2_HINTS_GLYPHS: L'apparence de l'aide des boutons et des icônes. Chaque ligne commence sur Thème, le choix du thème ; tout autre choix est le vôtre et l'emporte sur tous les thèmes.
  RIPPS2_HINT_LAYOUT: Disposition de l'aide
  HINT_RIPPS2_STARSIDE: 'Où se place l''étoile d''un jeu favori dans la liste. Gauche : sa propre colonne au début de chaque ligne. Droite : après le titre. Masqué (par défaut) : ni étoile ni colonne, les titres en entier. Thème : ce que dit le thème. R3 met un jeu en favori dans tous les cas ; maintenez R3 4 secondes sur une liste pour masquer les étoiles ou les faire revenir (cela met aussi en favori le jeu sous le curseur).'
  HINT_RIPPS2_HINT_LAYOUT: 'Ligne : l''aide sur une seule ligne. Colonne : une aide par ligne, en liste sur le côté, là où le thème place son aide.'
  RIPPS2_HINT_LABELS: Libellés de l'aide
  HINT_RIPPS2_HINT_LABELS: Icône seule ne dessine que les boutons, pour les icônes qui portent leurs propres mots. Badges réunit l'icône et le titre de chaque aide sur un même badge.
  RIPPS2_HINT_MENU: Aide Menu (START)
  RIPPS2_HINT_REFRESH: Aide Actualiser (SELECT)
  RIPPS2_HINT_STAR: Aide Favori (R3)
  RIPPS2_HINT_VIEW: Aide Vue (L3)
  HINT_RIPPS2_HINT_SHOW: Affiche ou masque cette aide. Son bouton fonctionne dans les deux cas.
  RIPPS2_GLYPH_SET: Jeu d'icônes
  HINT_RIPPS2_GLYPH_SET: 'Les icônes des boutons sur chaque page : celles du thème, celles de RIPPS2, Standard (boutons sombres, symboles en couleur) ou Blanc (blanc uni).'
  RIPPS2_HINT_ORDER: Ordre de l'aide
  HINT_RIPPS2_HINT_ORDER: Range l'aide. Thème garde l'ordre du thème ; Votre ordre est celui réglé ici.
  RIPPS2_HINT_ORDER_FOLLOW: Ordre
  RIPPS2_GRID_LAYOUT: Disposition de la grille
  HINT_RIPPS2_GRID_LAYOUT: Combien de jaquettes tient une page de la grille, avec l'espacement de RIPPS2. Thème garde celle du thème.
  RIPPS2_LAUNCH_DISC: Disque au lancement
  HINT_RIPPS2_LAUNCH_DISC: Le disque d'un jeu apparaît au lancement. Apparition se pose puis s'estompe ; Rotation tourne de plus en plus vite jusqu'au démarrage du jeu ; Zoom se pose puis grandit pour être bien lisible et reste affiché.
  RIPPS2_TRANSITION: Transition de page
  HINT_RIPPS2_TRANSITION: 'Comment une nouvelle page arrive quand vous changez de catégorie : depuis la couleur de fond du thème, ou dans un flash. Thème garde le choix du thème.'
  RIPPS2_CATEGORY_LAYOUT: Disposition des catégories
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Où se placent les trois catégories : leurs noms en haut, ou des icônes le long de la barre latérale, chacune avec un tiroir de ses pages (Gauche sur une liste y mène), ou Menu : pas de barre du tout, les catégories dans le menu START comme sur un thème fait pour OPL. Thème garde celle du thème.'
  RIPPS2_CACHE: Cache
  HINT_RIPPS2_CACHE: 'Comment la liste de jeux de chaque source est gardée pour que sa page s''ouvre tout de suite : Fast Cache, la liste du disque dur interne et l''Actualisation automatique.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'Chaque source garde sa dernière liste de jeux (RIPPS2.LST à côté de ses dossiers CD et DVD) et l''affiche dès que la source répond. Trust Cache décide si la source est relue ensuite. Désactivé : chaque liste est d''abord lue sur sa source, comme avant.'
  HINT_RIPPS2_VIGNETTE: Assombrit les bords de chaque jaquette sauf celle choisie, pour la faire ressortir. Faible vaut la moitié de Complet.
  RIPPS2_GRID_WIDE: Disposition de la grille en grand écran
  HINT_RIPPS2_GRID_WIDE: La page de la grille sur une image 16:9 seulement (Grand écran, 720p, 1080i), où les jaquettes sont plus étroites et plus nombreuses par ligne. Thème utilise celle du thème ; Comme suit la Disposition de la grille.
  RIPPS2_BGBLUR: Flou de l'arrière-plan
  HINT_RIPPS2_BGBLUR: La force du flou du verre dépoli sur l'illustration de fond du jeu. Thème utilise celui du thème (Faible sur RIPGRID et Adapt).
  HINT_RIPPS2_HINT_SLOT: L'aide à cette place. L'aide qui s'y trouvait prend l'ancienne place de celle choisie.
  PS1_SAVE_GUIDANCE: Les sauvegardes PS1 dépendent d'Ember ou de POPSTARTER ; les réglages VMC PS2 ne s'appliquent pas.
  NEUTRINO_SHOW_ARGS: Afficher les arguments de lancement
  HINT_NEUTRINO_SHOW_ARGS: Avant chaque lancement Neutrino, affiche tous les arguments que Neutrino recevra et demande de continuer. Retour revient au menu sans lancer.
  NEUTRINO_ARGS_CONFIRM: Neutrino va démarrer avec ces arguments. Lancer ?
  HINT_NARGS_EXTRA: D'autres options Neutrino, séparées par des espaces, envoyées après tout ce qui précède. RIPPS2 ajoute toujours -bsd et -dvd pour le périphérique et l'ISO du jeu, -mc0 et -mc1 pour ses VMC, -gsm pour son mode vidéo, et les modes de compatibilité propres au jeu. Une option qui a sa ligne ci-dessus (comme -logo) va dans cette ligne à l'enregistrement, et reste envoyée.
  HINT_RIPPS2_THEME: L'apparence de chaque page. Sur la liste des jeux, maintenez SELECT 4,2 secondes pour passer au thème suivant ; un appui bref sur SELECT actualise toujours la liste.
  GAME_TYPE_LABELS: Afficher les étiquettes [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: La liste de codes n'a pas pu être enregistrée dans le dossier Neutrino, Neutrino ne peut donc pas l'utiliser. Lancer sans codes ?
  AUTO_CREATE_VMC: Créer une VMC au premier lancement
  HINT_AUTO_CREATE_VMC: Lancer un jeu PS2 sans VMC dans le port 1 crée une carte de 8 Mo sur le périphérique du jeu, nommée comme le propose l'écran VMC (partagée par tous les disques du jeu), et l'attribue. Sous Neutrino, pas sur le disque dur APA (un disque dur exFAT fonctionne).
  AUTO_VMC_CREATING: Création de la VMC de ce jeu...
  AUTO_VMC_FAILED: Impossible de créer la VMC de ce jeu. Le jeu démarre sans.
  RIPPS2_BIOS_MUSIC: Musique du BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'Écrit la musique du menu de cette console (la pièce d''ambiance de son navigateur, environ 15 Mo en WAV) dans un dossier AUDIO de votre choix : à côté de RIPPS2, ou celui d''OPL sur un périphérique démarré. Trop gros pour une carte mémoire. Sa taille est indiquée d''abord.'
  SAVE_ICONS: Icônes de sauvegarde 3D
  HINT_SAVE_ICONS: Affiche l'icône de sauvegarde du jeu choisi, en rotation, là où le thème lui prévoit une place. Lit d'abord la VMC du jeu, puis les cartes mémoire.
  NETBOOT_RESTART_NOW: Le protocole réseau change après un redémarrage. Enregistrer les paramètres et redémarrer OPL maintenant ?
  HINT_NET_PROTOCOL: 'Le service réseau qu''utilise RiptOPL : un partage SMB, UDPFS, UDPBD ou HTTP. Quitter un service déjà en marche demande un redémarrage.'
  HINT_UDPFS_ACCESS: UDPFS seulement. Fichiers lit les ISO isolées du dossier des jeux du serveur ; IMG lit une image disque comme un périphérique. SMB et HTTP utilisent toujours Fichiers, UDPBD toujours IMG.
  HINT_SMB_VERSION: La version de SMB à utiliser avec le partage du PC.
  HINT_NET_ADVANCED: Débloque la modification du mode de liaison Ethernet et du port SMB.
  HINT_ETH_LINK_MODE: Force la vitesse et le duplex de la liaison réseau. Laissez sur Auto sauf si la liaison tombe sans cesse.
  HINT_IP_ADDR_TYPE: Statique utilise l'adresse ci-dessous ; DHCP la demande à votre routeur. UDPFS et UDPBD utilisent toujours Statique.
  HINT_PS2_IP: L'adresse IP de la PS2 elle-même. Choisissez-en une qu'aucun autre appareil n'utilise, dans la même plage que votre PC.
  HINT_NETMASK: Masque de sous-réseau, en général 255.255.255.0.
  HINT_GATEWAY: L'adresse de votre routeur, en général les trois mêmes premiers nombres terminés par .1.
  HINT_DNS: Adresse du serveur DNS. En général la même que la passerelle.
  HINT_SMB_ADDR_TYPE: Joindre le PC par son adresse IP ou par son nom NetBIOS (nom de l'ordinateur).
  HINT_SMB_ADDRESS: 'Le PC qui partage vos jeux : son adresse IP, ou son nom d''ordinateur quand le type d''adresse est NetBIOS.'
  HINT_SMB_PORT: 'Port SMB. Il doit correspondre au PC : PS2 Servers utilise 1111, les partages Windows et Samba utilisent 445.'
  HINT_SMB_USER: Nom d'utilisateur SMB. guest fonctionne pour la plupart des partages.
  HINT_HTTP_SERVER: Adresse IP du serveur de jeux HTTP.
  HINT_HTTP_PORT: Port d'écoute du serveur de jeux HTTP.
  HINT_HTTP_BASE: Dossier du serveur HTTP qui contient games.csv. / est la racine du serveur.
  HINT_HTTP_TEST: Essaie le serveur HTTP avec les valeurs ci-dessus et indique ce qu'il a trouvé.
  HINT_RA_TELEMETRY: Interrupteur général de RetroAchievements. Désactivé lance les jeux sans pile réseau ni instantanés, comme un build normal.
  HINT_RA_BADGES: Marque dans la liste les jeux qui ont des succès. Reste éteint tant que la télémétrie est désactivée.
  HINT_POPS_NET_BUTTON: Modifie les fichiers réseau de POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), dont les jeux PS1 en SMB ont besoin.
  HINT_POPS_IP_TYPE: 'Comment la PS2 obtient son adresse pendant qu''un jeu PS1 tourne en SMB : Statique ou DHCP.'
  HINT_POPS_IP: L'adresse IP de la PS2 pendant qu'un jeu PS1 tourne en SMB.
  HINT_POPS_SMB_IP: Adresse IP du PC qui partage vos jeux PS1.
  HINT_POPS_SMB_SHARE: Nom du partage sur ce PC qui contient le dossier POPS.
  HINT_LASTPLAYED: Démarre sur le dernier jeu lancé.
  HINT_LANGUAGE: Langue des menus. Ajoutez-en en plaçant des fichiers lang_*.lng dans un dossier LNG.
  HINT_GSM_DEFAULTS_BUTTON: Les corrections de mode vidéo que reçoit chaque jeu sauf s'il a ses propres réglages GSM.
  HINT_DEFDEVICE: La page sur laquelle RiptOPL s'ouvre au démarrage.
  HINT_MMCE_MODE: 'Les jeux sur un SD2PSX ou une MemCard PRO2. Automatique le démarre au lancement : le plus rapide pour une carte branchée, ses jeux dans Tous les jeux dès le début. Manuel le démarre quand vous ouvrez sa page, OFF le masque.'
  HINT_MMCE_SETTINGS_BUTTON: Emplacement, bootcard IGR, GameID et options de synchronisation pour MMCE.
  HINT_ENABLE_USB: Charge le pilote de stockage USB.
  HINT_ENABLE_MX4SIO: Charge le pilote de l'adaptateur de carte SD MX4SIO.
  HINT_ENABLE_ILINK: Charge le pilote de stockage iLink (FireWire).
  HINT_NETSTART: 'Démarre le réseau : Auto au lancement, Manuel à l''ouverture de sa page. Désactivé laisse l''adaptateur réseau tranquille.'
  HINT_APPMODE: La page Applications. Auto démarre au lancement, Manuel à son ouverture, Désactivé la masque.
  HINT_FAVMODE: La page Jeux favoris. Auto démarre au lancement, Manuel à son ouverture, Désactivé la masque.
  HINT_BDMA_BUTTON: Le pilote exFAT qu'utilise POPSTARTER pour les jeux PS1 sur USB, MX4SIO, MMCE, disque dur ou iLink.
  HINT_VCD_LIST_BUTTON: 'Comment les jeux PS1 sont listés : masquer les identifiants de jeu, n''afficher que le disque 1, afficher les partitions PP du disque dur.'
  HINT_MMCE_SLOT: L'emplacement de carte mémoire où se trouve l'appareil MMCE. Auto le trouve.
  HINT_MMCE_GAMEID: Indique à l'appareil MMCE quel jeu démarre, pour qu'il passe à la carte mémoire de ce jeu.
  HINT_MMCE_COMM_BUTTON: Options de synchronisation de la liaison MMCE. Ne les changez que si les jeux se figent ou chargent lentement.
  HINT_MMCE_PATH_BUTTON: L'endroit de la carte MMCE où se trouvent les dossiers des jeux.
  HINT_MMCE_PREFIX: Sous-dossier de la carte MMCE qui contient CD, DVD et les autres dossiers d'OPL. Vide utilise la racine de la carte.
  HINT_GAME_TYPE_LABELS: Commence chaque nom de jeu par [PS1] ou [PS2]. Affichage seulement.
  HINT_MENU_VMODE: Sortie vidéo du menu. Les jeux utilisent GSM à la place. Maintenez Valider pour garder un nouveau mode.
  HINT_THEME: L'apparence du menu. Les thèmes sont lus dans le dossier THM de chaque périphérique.
  HINT_COVERFLOW_BUTTON: Nombre de jaquettes, taille, animation et assombrissement pour le thème Coverflow.
  HINT_ARTWORK_BUTTON: 'Quelles illustrations se chargent : jaquettes, illustrations de disque, fonds et icônes de sauvegarde.'
  HINT_COLORS_BUTTON: Couleurs du texte, de la surbrillance, des boîtes de dialogue et du fond.
  HINT_NOTIFICATIONS: Brèves notifications quand un fichier de configuration, de thème ou de langue se charge.
  HINT_AUTOSORT: Trie les listes de jeux de A à Z. Désactivé garde l'ordre dans lequel ils ont été trouvés.
  HINT_AUTOREFRESH: Ajoute les jeux des périphériques nouvellement connectés sans actualisation manuelle.
  HINT_COVERART: Charge les jaquettes depuis le dossier ART.
  HINT_DISCART: Affiche l'illustration du disque (<ID>_ICO). Désactivé masque le disque mais garde jaquettes et fonds.
  HINT_BGART: Affiche le fond d'un jeu (<ID>_BG) quand le thème en utilise un.
  HINT_ART_TAR: Lit aussi les illustrations rassemblées dans ART/art.tar.
  HINT_ART_DELAY: Le temps que le curseur reste sur un jeu avant que ses illustrations se chargent. Plus haut ignore les illustrations pendant un défilement rapide.
  HINT_TXTCOLOR: Couleur du texte normal des menus.
  HINT_SELCOLOR: Couleur de l'élément en surbrillance.
  HINT_UICOLOR: Teinte de fond des boîtes de dialogue.
  HINT_TITLECOLOR: Couleur des titres des jeux dans la liste.
  HINT_BGCOLOR: Couleur de fond du menu.
  HINT_PLASCOLOR: Couleur mêlée au fond animé.
  HINT_RESETCOLOR: Rétablit les couleurs intégrées de RiptOPL, pas celles du thème.
  HINT_WIDESCREEN: Dessine le menu pour un téléviseur 16:9.
  HINT_XOFF: Déplace le menu à gauche ou à droite de l'écran. Conservé pour chaque mode vidéo.
  HINT_YOFF: Déplace le menu vers le haut ou le bas de l'écran. Conservé pour chaque mode vidéo.
  HINT_MENU_OVERSCAN: Réduit le menu vers l'intérieur si le téléviseur en coupe les bords. Conservé pour chaque mode vidéo.
  HINT_APPLYGAMEID: Affiche un code-barres au démarrage d'un jeu, pour que les appareils Pixel FX, RetroGEM et PS2Digital changent de profil.
  HINT_NEUTRINO_DEFAULTS_BUTTON: Le chemin, le mode vidéo et les arguments de Neutrino pour chaque jeu.
  HINT_OSD_DEFAULTS_BUTTON: Langue de la console, taille d'écran et mode vidéo transmis aux jeux.
  HINT_ENWRITEOP: Permet de renommer et supprimer des jeux et de créer des VMC. Ne touche jamais à la table des partitions du disque dur.
  HINT_DEBUG: 'Aide aux développeurs : écrans colorés pendant le démarrage d''un jeu, et compteurs de chargement des illustrations dans le menu.'
  HINT_BDMPREFIX: Sous-dossier des périphériques USB, MX4SIO, iLink et exFAT qui contient les dossiers des jeux. Vide utilise la racine du périphérique.
  HINT_ETHPREFIX: Sous-dossier du partage SMB qui contient les dossiers des jeux. Vide utilise la racine du partage.
  HINT_HDDGAMELISTCACHE: Mémorise la liste des jeux du disque dur APA pour accélérer les analyses suivantes.
  HINT_BDMCACHE: Cache de lecture anticipée pour l'USB et les autres périphériques BDM en jeu. Plus grand peut fluidifier le streaming mais utilise plus de mémoire.
  HINT_HDDCACHE: Cache de lecture anticipée pour le disque dur interne en jeu.
  HINT_SMBCACHE: Cache de lecture anticipée pour SMB en jeu.
  HINT_CORE_LOADER: Le noyau de ce jeu quand les deux sont pris en charge. UDPFS/UDPBD sont réservés à Neutrino ; SMB/HTTP à <OPL>. Défaut suit Lancement des jeux.
  HINT_DMA_MODE: Mode de transfert du disque dur interne pour ce jeu. Baissez-le si le jeu saccade ou se fige.
  HINT_DNAS_GAMEID: Identifiant de disque pour les jeux en ligne DNAS. Charger depuis le disque le lit sur le disque original.
  HINT_LOAD_FROM_DISC: Lit l'identifiant DNAS sur le disque original dans le lecteur.
  HINT_ALTSTARTUP: Démarre cet ELF de l'image disque au lieu de celui indiqué par SYSTEM.CNF.
  HINT_VMC_DEFINE: Choisir, créer ou redimensionner la carte mémoire virtuelle de cet emplacement.
  HINT_VMC_ACTION: Utiliser générique donne une carte partagée à cet emplacement ; Réinitialiser efface le choix.
  HINT_VMC_NAME: Nom du fichier de la carte, gardé dans le dossier VMC.
  HINT_VMC_CREATE: Crée la carte, ou lui applique une nouvelle taille.
  HINT_VMC_DELETE: Supprime ce fichier de carte.
  HINT_SETTINGS_SOURCE: Global utilise les paramètres communs ; Par jeu les garde pour ce jeu seulement.
  HINT_PADMACRO_TOGGLE: Pendant l'appui ralentit le stick seulement tant que vous tenez le bouton ; Basculé par le bouton l'active et le désactive.
  HINT_SFX: Effets sonores du menu.
  HINT_BOOT_SND: 'Le son de démarrage au lancement de RIPPS2. Activé : depuis le dossier AUDIO, une fois son lecteur prêt. Activé (rapide) : une copie à côté de RIPPS2 sur la carte mémoire d''où il démarre (proposée quand vous le choisissez), jouée quand les piliers montent. Il joue aussi avec les effets sonores désactivés.'
  HINT_BGM: Joue la musique du thème, ou votre fichier de musique de thème par défaut.
  HINT_SFX_VOLUME: Volume des effets sonores du menu.
  HINT_BOOT_SND_VOLUME: Volume du son de démarrage.
  HINT_BGM_VOLUME: Volume de la musique de fond.
  HINT_SCROLL: La vitesse de défilement des listes quand vous maintenez une direction.
  HINT_SELECTBUTTON: 'Le bouton qui valide : Croix ou Rond.'
  HINT_XSENSITIVITY: La facilité avec laquelle le stick gauche déplace le curseur à gauche et à droite. Désactivé l'ignore.
  HINT_YSENSITIVITY: La facilité avec laquelle le stick gauche déplace le curseur en haut et en bas. Désactivé l'ignore.
  HINT_PADEMU_GLOBAL: DualShock 3/4 en USB ou Bluetooth, et multitap, pour chaque jeu.
  HINT_PADMACRO_GLOBAL: Ralentissement du stick, inversion d'axe et turbo pour chaque jeu.
  HINT_COVERFLOW_DIM: Assombrit les jaquettes latérales.
  HINT_OSD_ENABLE: Transmet au jeu les réglages ci-dessous. Désactivé utilise ceux de la console.
  HINT_OSD_TVASPECT: Format du téléviseur transmis au jeu.
  HINT_OSD_VMODE: Mode vidéo transmis au jeu.
  DNAS_ID: Identifiant DNAS
  NEUTRINO_PADEMU_WARN: L'émulation de manette n'est pas disponible avec Neutrino. Utilisez une manette PS2 ou une source qui prend en charge le noyau <OPL>.
