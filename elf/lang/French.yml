  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 ne peut pas déterminer la région de cette console d'après sa ROM, il ne sait donc pas quel dossier de mise à jour système elle lit. BIBLE n'a pas été installé.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 n'a pas pu ouvrir la partition __sysconf ou __common du disque dur (erreur %d), BIBLE n'a donc nulle part où y garder RIPPS2 et sa configuration. Rien n'a été modifié.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 n'a pas pu lire le programme de démarrage conservé. Rien n'a été modifié.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 n'a pas pu réécrire le programme de démarrage. Réessayez ; la copie conservée est intacte.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 était occupé à lire un périphérique et n''a pas pu redémarrer le processeur d''E/S. Rien n''a été modifié : réessayez dans un instant.'
  Reading the memory cards: Lecture des cartes mémoire
  The HDD partition BIBLE uses went away. Nothing was changed.: La partition du disque dur qu'utilise BIBLE a disparu. Rien n'a été modifié.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: L'ancien programme de démarrage du disque dur est revenu. BIBLE ne démarre plus depuis le disque dur.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : La console n'a pas voulu lier BIBLE à la carte mémoire %d (l'étape MagicGate a échoué). Rien n'a été modifié sur la carte. Une carte qui n'est pas officielle ou compatible MagicGate ne peut pas contenir de mise à jour système.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Celui qui s''y trouvait est conservé dans RIPPS2/MBR-BACKUP.KELF sur le disque dur : CHARGEUR DE DÉMARRAGE > GÉRER > RESTAURER le remet.'
  The security module would not start on this console. Nothing on the memory card was changed.: Le module de sécurité n'a pas voulu démarrer sur cette console. Rien n'a été modifié sur la carte mémoire.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Il n''y a de carte mémoire PS2 formatée dans aucun emplacement, ni de disque dur interne. BIBLE réside sur une carte mémoire ou le disque dur : insérez une carte, puis réessayez.'
  There is no kept boot program on this HDD. Nothing was changed.: Il n'y a aucun programme de démarrage conservé sur ce disque dur. Rien n'a été modifié.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Ce disque dur n'a pas de partition __sysconf, la configuration de BIBLE doit donc aller sur une carte mémoire (PS2BBL lit d'abord celle d'une carte), et il n'y en a dans aucun emplacement. Insérez-en une, puis réessayez.
