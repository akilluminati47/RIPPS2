  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALLER BIBLE SUR LE DISQUE DUR INTERNE

    - RIPPS2 est copié dans %s.

    - Le programme de démarrage du disque dur actuellement dans __mbr est lu et conservé dans %s/RIPPS2 (RESTAURER le remet).

    - La version disque dur de PS2BBL est écrite à sa place, et la console réglée pour la démarrer à l''allumage.

    - Sa configuration (%s) lance d''abord RIPPS2 depuis %s%s%s, BOOT LOCK activé.

    Cela demande une console qui démarre depuis son disque dur (une PS2 fat avec l''adaptateur réseau). Laissez-la allumée jusqu''à la fin.'
