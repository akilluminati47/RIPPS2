  HINT_RIPPS2_BADGE_SET: 'Distinktivët në faqen e informacionit të një loje (vlerësimi, lojtarët, ESRB, modaliteti i videos, skanimi, raporti). RIPPS2: grupi i tij, i njëjtë në çdo temë. Tema: imazhet e temës, ose ato të RIPPS2 kur tema i kërkon.'
