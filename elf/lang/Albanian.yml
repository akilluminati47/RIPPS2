  ? Compress %s? The ISO stays until the ZSO has been read back and checked, then RIPPS2 asks before it removes the ISO. The drive needs room for both while it works; leave the console on until it finishes. A ZSO starts with the OPL core only (not Neutrino); its saves, settings, art and cheats stay with it, and it can be made an ISO again at any time.
  : Të ngjeshet %s? ISO mbetet derisa ZSO të lexohet sërish dhe të kontrollohet, pastaj RIPPS2 pyet para se të heqë ISO-n. Disku ka nevojë për vend për të dyja gjatë punës; mbaje konsolën ndezur derisa të mbarojë. Një ZSO niset vetëm me bërthamën OPL (jo Neutrino); ruajtjet, cilësimet, figurat dhe mashtrimet e saj mbeten me të, dhe mund të bëhet sërish ISO në çdo kohë.
