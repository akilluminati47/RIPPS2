  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Figura që hyjnë: %d (%s). Me të njëjtin emër në të dy: %d (fiton ajo e bashkuara).'
  'Reading the archives: %s': 'Po lexohen arkivat: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Të ndalet? .tar i mbajtur mbetet siç ishte; kopja e papërfunduar hiqet.
