  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot është ndezur. Tingujt zënë %d KB dhe karta e memories nga e cila punon RIPPS2 ka %d KB të lira, kështu që mbeten në %s.
