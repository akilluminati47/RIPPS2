  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE nuk e kopjoi dot RIPPS2 në particionin %s të HDD. Kontrollo hapësirën e lirë. Asgjë tjetër nuk ndryshoi.
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE nuk mundi të ruante një kopje të programit të nisjes së HDD, ndaj ndaloi para se ta ndryshonte. RIPPS2 u kopjua në HDD; asgjë tjetër nuk ndryshoi.
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE nuk mundi të shkruante konfigurimin e tij (%s). Programi i nisjes nuk ndryshoi.
  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE nuk mundi të shkruante programin e nisjes së HDD (hapi %d). %s
  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'BIBLE është instaluar në HDD-në e brendshme dhe BOOT LOCK është ndezur: në ndezje konsola nis RIPPS2 nga %s%s%s%s, menjëherë. Konfigurimi: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE është në kartën e memories %d, por konfigurimi i tij (%s) nuk u shkrua dot, ndaj nis shfletuesin. Liro pak hapësirë dhe ekzekuto MENAXHO përsëri për ta përfunduar.
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE mbeti pa memorie para se të fillonte. Asgjë nuk ndryshoi.
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE mbeti pa memorie. Asgjë në kartën e memories nuk ndryshoi.
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: duke kopjuar RIPPS2 në %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: duke ruajtur programin e nisjes së HDD'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: duke rikthyer programin e nisjes së HDD'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: duke shkruar PS2BBL në zonën e nisjes së HDD'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALO BIBLE NË HDD-NË E BRENDSHME

    - RIPPS2 kopjohet në %s.

    - Programi i nisjes së HDD që është tani në __mbr lexohet dhe ruhet në %s/RIPPS2 (RIKTHE e kthen).

    - Ndërtimi për HDD i PS2BBL shkruhet në vend të tij, dhe konsola vendoset ta nisë në ndezje.

    - Konfigurimi i tij (%s) nis RIPPS2 së pari nga %s%s%s, me BOOT LOCK të ndezur.

    Kjo kërkon një konsolë që niset nga HDD-ja e saj (PS2 e trashë me përshtatësin e rrjetit). Mbaje ndezur derisa të thotë u krye.'
  INTERNAL HDD  (its boot area): HDD I BRENDSHËM  (zona e tij e nisjes)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'RIKTHE PROGRAMIN E VJETËR TË NISJES SË HDD

    Ai që ruajti BIBLE (RIPPS2/MBR-BACKUP.KELF në HDD) kthehet në __mbr, në vend të BIBLE. RIPPS2 dhe konfigurimi PS2BBL mbeten ku janë.'
  RESTORE: RIKTHE
  RESTORE THE HDD'S OLD BOOT PROGRAM: RIKTHE PROGRAMIN E VJETËR TË NISJES SË HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 nuk e kupton dot rajonin e kësaj konsole nga ROM-i i saj, ndaj nuk e di cilën dosje përditësimi sistemi lexon. BIBLE nuk u instalua.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 nuk mundi të hapte particionin __sysconf ose __common të HDD (gabimi %d), ndaj BIBLE nuk ka ku ta ruajë RIPPS2 dhe konfigurimin e tij atje. Asgjë nuk ndryshoi.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 nuk mundi ta lexonte programin e ruajtur të nisjes. Asgjë nuk ndryshoi.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 nuk mundi ta shkruante përsëri programin e nisjes. Provo përsëri; kopja e ruajtur është e paprekur.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 ishte i zënë duke lexuar një njësi dhe nuk mundi ta rinisë procesorin I/O. Asgjë nuk ndryshoi: provo përsëri pas pak.'
  Reading the memory cards: Duke lexuar kartat e memories
  The HDD partition BIBLE uses went away. Nothing was changed.: Particioni i HDD që përdor BIBLE u zhduk. Asgjë nuk ndryshoi.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Programi i vjetër i nisjes së HDD u kthye. BIBLE nuk niset më nga HDD.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : Konsola nuk pranoi ta lidhte BIBLE me kartën e memories %d (hapi MagicGate dështoi). Asgjë në kartë nuk ndryshoi. Një kartë që nuk është origjinale ose e përputhshme me MagicGate nuk mund të mbajë një përditësim sistemi.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Ai që ishte atje ruhet në RIPPS2/MBR-BACKUP.KELF në HDD: NGARKUESI I NISJES > MENAXHO > RIKTHE e kthen.'
  The security module would not start on this console. Nothing on the memory card was changed.: Moduli i sigurisë nuk u nis në këtë konsolë. Asgjë në kartën e memories nuk ndryshoi.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'Nuk ka kartë memorieje PS2 të formatuar në asnjërën fole, dhe as HDD të brendshme. BIBLE jeton në një kartë memorieje ose në HDD: fut një kartë, pastaj provo përsëri.'
  There is no kept boot program on this HDD. Nothing was changed.: Nuk ka program nisjeje të ruajtur në këtë HDD. Asgjë nuk ndryshoi.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Kjo HDD nuk ka particion __sysconf, ndaj konfigurimi i BIBLE duhet të shkojë në një kartë memorieje (PS2BBL lexon së pari kartën), dhe nuk ka asnjë në asnjërën fole. Fut një, pastaj provo përsëri.
