  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Të bashkohet paketa e re në një .tar tjetër? Më pas zgjidh .tar që do të mbash dhe përditësosh; figurat e paketës së re shkojnë në të.
