  HINT_RIPPS2_BDM_DEVICES: 'Disqet nga të cilat BDM lexon lojëra: USB, MX4SIO, një PC Card CF, disku DVR i një DESR dhe iLink. HDD i brendshëm ndjek mënyrën e nisjes së HDD.'
