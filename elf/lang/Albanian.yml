  RIP: NXIRR
  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 nuk e di ku është dosja e tij, ndaj nuk ka ku t'i vendosë tingujt.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 luan muzikën e menysë së kësaj konsole, pjesën ambientale të shfletuesit të saj (%d:%02d), nga notat e vetë BIOS-it dhe e shkruan si WAV prej %s në %s; asnjë kartë memorieje nuk ka vend për të. %s që është tashmë atje zëvendësohet. Zgjat një ose dy minuta.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 lexon tingujt nga BIOS-i i vetë kësaj konsole dhe i shkruan në %s si tingujt e tij: kursori, konfirmimi, anulimi, faqet, kategoria, mesazhet, disku, gabimi, ruajtja, njësitë dhe rastësori, si dhe muzika e nisjes dhe e nisjes së lojës, luajtur nga notat e vetë BIOS-it. Skedarët me këta emra që janë tashmë atje zëvendësohen.'
  Reading this console's menu music: Duke lexuar muzikën e menysë së kësaj konsole
  'Ripping this console''s menu music: %d%%': 'Duke nxjerrë muzikën e menysë së kësaj konsole: %d%%'
  Ripping this console's sounds: Duke nxjerrë tingujt e kësaj konsole
  'Ripping this console''s sounds: %s': 'Duke nxjerrë tingujt e kësaj konsole: %s'
  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: Muzika e menysë (%s) është në %s si %s. Cilësimet e audios > Muzika e liston si Menu; luhet kur nuk zgjidhet asnjë pjesë tjetër.
  The menu music could not be written to %s (%s). Is the drive full?: Muzika e menysë nuk u shkrua dot në %s (%s). A është njësia plot?
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : 'Muzika e menysë është WAV prej %s, dhe asnjë kartë memorieje nuk ka vend për të. RIPPS2 këtu niset nga një kartë memorieje dhe asnjë njësi me dosje OPL nuk është nisur: nis një në Ruajtja, pastaj nxirr muzikën atje.'
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: Muzika e menysë së këtij BIOS-i nuk është ajo që njeh RIPPS2. Nuk u shkrua asgjë.
  This BIOS's sound bank is not the one RIPPS2 knows. Nothing was written.: Banka e tingujve e këtij BIOS-i nuk është ajo që njeh RIPPS2. Nuk u shkrua asgjë.
  ? This console's BIOS has no SNDIMAGE. Consoles from SCPH-30000 on carry one; the first models keep their sounds another way, which RIPPS2 does not read yet.
  : BIOS-i i kësaj konsole nuk ka SNDIMAGE. Konsolat nga SCPH-30000 e tutje e kanë; modelet e para i ruajnë tingujt ndryshe, gjë që RIPPS2 nuk e lexon ende.
