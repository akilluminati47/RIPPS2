  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'PRANË RIPPS2: %sAUDIO%s, lexohet i pari në nisje'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL lidhet me këtë kartë nga konsola dhe shkruhet si %s/%s.
  
    - Konfigurimi i tij, mc%d:/SYS-CONF/PS2BBL.INI, nis RIPPS2 aty ku është (%s) pa pritje (0 ms, që PS2BBL Extended nuk e lejon), BOOT LOCK ndezur. Vetë RIPPS2 nuk kopjohet.
  
    Procesori I/O rinis për këtë dhe çdo lexim i disqeve ndalon derisa të mbarojë; muzika dhe disqet kthehen pas kësaj. Lëre kartën brenda dhe konsolën ndezur derisa të thotë që mbaroi.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Një kartë SD2PSX ose MMCE mund të mbrohet pas një shkrimi të refuzuar: nëse tani mungon karta e memories ose disku MMCE, fike dhe ndize konsolën.'
  BOOT LOCK ON: BOOT LOCK NDEZUR
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'U krye: karta e memories në folenë %d nis atë që niste para BIBLE. BIBLE ruhet në mc%d:/%s.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
    '
  : 'Për një kartë memorieje PS2 standarde 8 MB (një kartë MagicGate, ose një kartë BOOT SD2PSX ose MMCE): atë në folenë %d. Në ndezje PS2BBL lexon konfigurimin e folesë 2 para atij të folesë 1.
  
    '
  MEMORY CARD IN SLOT %d  (%s): KARTA E MEMORIES NË FOLENË %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL nuk mund ta nisë RIPPS2 nga vendi ku është tani (arrin te kartat e memories, disqet USB dhe MX4SIO), dhe RIPPS2 nuk e kopjon veten. Vendose RIPPS2.ELF në një kartë memorieje ose disk USB dhe nise prej andej, ose përdor PS2BBL Extended, që lexon MMCE dhe diskun e ngurtë.
  RESTORE SLOT %d'S OLD BOOT LOADER: RIKTHE NGARKUESIN E VJETËR TË FOLESË %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE u vendos në kartën e memories në folenë %d (mc%d:/%s/%s), BOOT LOCK ndezur: në ndezje nis menjëherë RIPPS2 nga %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: po vendoset BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: po vendoset BIBLE
  
    RIPPS2 punon nga %s, që PS2BBL nuk e lexon dot (lexon karta memorieje, USB dhe MX4SIO), dhe RIPPS2 nuk e kopjon veten. Konfigurimi PS2BBL Extended në këtë kartë (%s) e lexon: START ndez BOOT LOCK, që në ndezje të nisë RIPPS2 nga %s. Asgjë tjetër nuk ndryshon në kartë.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: po vendoset BIBLE
  
    RIPPS2 punon nga %s, që PS2BBL nuk e lexon dot: ai nis programe nga një kartë memorieje, një disk USB ose MX4SIO, dhe RIPPS2 nuk e kopjon veten. Vendose RIPPS2.ELF në një prej tyre (dosjen APPS të një karte memorieje ose një disk USB), nise prej andej, pastaj vendos sërish BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: po vendoset BIBLE
  
    Karta e memories në folenë %d: BIBLE (mc%d:/%s) lëviz mënjanë dhe ajo që zëvendësoi (mc%d:/%s) kthehet në vendin e saj. Asgjë nuk fshihet. Konfigurimi i PS2BBL mbetet siç është (BOOT LOCK mund ta fikë bllokimin).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: po vendoset BIBLE (PS2BBL po lidhet me kartën e memories)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: po vendoset BIBLE (po rikthehet ajo që ishte)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: po vendoset BIBLE (procesori I/O po riniset)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: po vendoset BIBLE (po shkruhet në kartën e memories)'
  SET UP BIBLE: VENDOS BIBLE
  ? 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: Setting up BIBLE. PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?'
  : 'FOLEJA 1: %s
  
    FOLEJA 2: %s
  
    %s
  
    RIPPS2: po vendoset BIBLE. PS2BBL nga El Isra, i vendosur nga RIPPS2 në një kartë memorieje PS2 standarde 8 MB ose në diskun e brendshëm: një nisje 0 ms në ndezje (PS2BBL Extended nuk lejon 0), RIPPS2 i pari nga vendi ku është (nuk kopjohet kurrë), dhe një buton i mbajtur në ndezje të çon ende te shfletuesi (TRIANGLE), te një disk (START) dhe te ajo që ishte më parë (CIRCLE). Ta vendosësh, ta riparosh apo ta rikthesh atë që zëvendësoi?'
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Karta e memories në folenë %d ka %d KB të lira dhe BIBLE ka nevojë për %d KB atje. Liro pak hapësirë, pastaj provo sërish.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Karta e memories në folenë %d refuzoi PS2BBL, kështu që RIPPS2 e la kartën siç ishte. Kontrollo hapësirën e lirë, pastaj provo sërish. (DIAG.TXT pranë RIPPS2 ka përgjigjen e kartës.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Karta e memories në folenë %d nuk e lëvizi mënjanë BIBLE, kështu që nuk ndryshoi asgjë. (DIAG.TXT pranë RIPPS2 ka përgjigjen e kartës.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Karta e memories në folenë %d nuk e mori mbrapsht %s, kështu që BIBLE mbeti. (DIAG.TXT pranë RIPPS2 ka përgjigjen e kartës.)
  MUSIC: MUZIKA
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s nuk ka %s. RIPPOPS gjeti emulatorin PS1 të Sony në %s: START kopjon %s këtu dhe nis lojën.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 nuk e sheh %s në %s%s. POPSTARTER ka nevojë për POPS_IOX.PAK me POPS.PAK, ose me POPS.ELF dhe IOPRP252.IMG: emulatori PS1 i Sony, nga konsola jote. Mund t''i gjejë aty ku RIPPS2 nuk shikon (nëse lojërat të nisen, i gjen). START nis, dhe për këtë disk nuk pyetet më.'
  ' (The configs found were set: %s.)': ' (Konfigurimet e gjetura u vendosën: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Ruaji cilësimet e tij një herë me konfiguruesin e vet, pastaj ndize sërish BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s nuk mund ta nisë RIPPS2 nga vendi ku është tani (%s), dhe RIPPS2 nuk e kopjon veten. Vendose RIPPS2.ELF në një kartë memorieje ose në një njësi USB dhe nise prej andej.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK nuk mundi ta shkruajë konfigurimin e ngarkuesit të nisjes. Kontrollo që karta e memories ose njësia të mos jetë e mbrojtur nga shkrimi, pastaj provo sërish.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK nuk gjeti asnjë konfigurim ngarkuesi nisjeje për të ndryshuar.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK është fikur. Ngarkuesi yt i nisjes nis atë që niste më parë (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK është ndezur. %s tani nis RIPPS2 në ndezje (%s), dhe një Shteg IGR bosh e kthen EXIT-in e një loje nga e njëjta rrugë. Mbaj një nga butonat e tij ndërsa konsola niset për të arritur diçka tjetër.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK e vuri RIPPS2 të parin në menynë e OSDMenu (%s). OSDMenu nuk nis asgjë vetë: zgjidh atje RIPPS2, dhe EXIT-i i një loje kthehet te ajo meny. Për një konsolë që nis RIPPS2 menjëherë, BIBLE vendos PS2BBL në një kartë memorieje (Ngarkuesi i nisjes).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK punon përmes një ngarkuesi nisjeje në një kartë memorieje (PS2BBL, FMCB ose OSDMenu), dhe këtu nuk ka asnjë.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Karta e memories në folenë %d nis %s në ndezje, dhe BOOT LOCK nuk gjeti asnjë konfigurim të tij për të ndryshuar (kërkon %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Karta e memories në folenë %d nis %s në ndezje, të cilin BOOT LOCK nuk mund ta vendosë: punon përmes PS2BBL, FMCB dhe OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Në këtë konsolë ka një ngarkues nisjeje me kyçin e RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT-i i një loje: shfletuesi, pastaj ngarkuesi yt i nisjes (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'Në përdorim: %s, %d figura, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Po matet sa shpejt lexon çdo disk figurat e veta: %s'
  'None: each picture is read from its own ART folder.': 'Asnjë: çdo figurë lexohet nga dosja e vet ART.'
  REMOVE the pack in %s (the ART folders stay as they are): HIQ paketën në %s (dosjet ART mbeten siç janë)
  Remove the ART Pack in %s? The ART folders stay as they are.: Të hiqet paketa ART në %s? Dosjet ART mbeten siç janë.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: U ndal. Paketa e papërfunduar u hoq dhe figurat ngarkohen nga dosjet ART si më parë.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Paketa ART nuk mund të shkruhej në %s (a ka vend në atë disk?). Asgjë tjetër nuk ndryshoi: figurat ngarkohen nga dosjet ART si më parë.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Paketa ART në %s u hoq. Figurat ngarkohen sërish nga dosjet ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Nuk ka asnjë dosje ART me figura në disqet e nisura. Nis disqet ku janë figurat e tua (SELECT në faqen e tyre), pastaj kthehu.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d figura nga %d dosje ART shkojnë në një skedar të vetëm, %s. Dosjet ART mbeten siç janë: paketa është një kopje. Mund ta kopjosh art.tar në dosjen ART të një disku tjetër me Memory Files, por më e shpejta është ta ndërtosh në diskun nga i cili shfleton, prandaj disku më i shpejtë del i pari. Ta ndërtoj tani?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Paketa ART është gati: %d figura, %d MB, në %s (%d s). Tani e tutje figurat ngarkohen prej saj, dhe për %d lojërat për të cilat u ndërtua, dosja e tyre ART nuk pyetet më kurrë figurë pas figure. Figurat që RIPPS2 shkarkon ose kap shfaqen menjëherë; ato që kopjon nga një PC shfaqen kur e ndërton paketën sërish.'
  '%s free': '%s të lira'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: lexon %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: lexon %s/s, më i shpejti, %s'
