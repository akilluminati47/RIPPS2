  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Nisja lexon vetëm diskun e RIPPS2: cilësimet dhe tingujt pranë RIPPS2.ELF (RIPPS2.FB atje thotë ku) dhe çdo listë nga cache e saj. Disqet e tjerë presin: SELECT në një faqe nis disqet e saj dhe sjell imazhet e tyre (me rifreskimin automatik nisin në nisje). Ndezja kopjon tingujt e tu, dhe muzikën nëse ka vend, në AUDIO pranë RIPPS2.'
  RIPPS2_ART_PACK: Paketa ART
  RIPPS2_ART_PACK_BUILD: Ndërto ose hiq
  HINT_RIPPS2_ART_PACK: Paketon dosjen ART të çdo disku të nisur në një art.tar të vetëm në diskun që zgjedh (më i shpejti ofrohet i pari). Kopertinat ngarkohen pastaj nga një skedar me një indeks, kurrë me një kërkim për çdo lojë, kështu që menytë dhe muzika mbeten të rrjedhshme. Dosjet ART mbeten siç janë.
