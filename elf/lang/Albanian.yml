  ' A SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it was removed.': ' U hoq një SYS-CONF/PS2BBL.INI që ndërtimi 68 shkroi për një ngarkues që nuk e lexon kurrë.'
  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' Një kartë memorieje këtu ka PS2BBL/CONFIG.INI të vetin, të cilin PS2BBL e lexon para atij të HDD: hiqe atë kartë në ndezje, ose nis RIPPS2 nga karta dhe instalo përsëri.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' Mbaj TREKËNDËSHIN në ndezje për shfletuesin, START për një disk.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' Mbaj TREKËNDËSHIN për shfletuesin, START për një disk. Konfigurimi: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 mund të instalojë BIBLE, PS2BBL të përgatitur për të nisur RIPPS2, në një kartë memorieje; ajo që niset prej saj tani ruhet në një dosje rezervë. Të instalohet BIBLE?'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' Programi i vjetër i nisjes së HDD ruhet (MENAXHO > RIKTHE).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' Konsola nuk e pranoi cilësimin që nis HDD-në e saj në ndezje: vendose me mjetin e HDD, ose instalo përsëri.'
  ' What was there before is kept in mc%d:/%s%s.': ' Ajo që ishte atje më parë ruhet në mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' Konfigurimi yt PS2BBL u ruajt (%s), me BOOT LOCK të vendosur në të: butonat e tij janë si i vendose.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' Konfigurimi yt PS2BBL u ruajt, me BOOT LOCK të vendosur në të.'
