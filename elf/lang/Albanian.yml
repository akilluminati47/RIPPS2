# RIPPS2 in Albanian. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Albanian
strings:
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Kjo lojë niset me Neutrino dhe RIPPS2 nuk gjeti asnjë: as te shtegu i Cilësimeve, as në diskun e lojës, as në kartat e memories, as në ndonjë disk të nisur. Vendos Neutrino të rickgaiser (github.com/rickgaiser/neutrino) në një dosje neutrino në diskun e lojës ose në një kartë memorie, ose drejto Nisja e lojërave > Neutrino tek ai."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Ku është Neutrino yt, modaliteti i tij i videos dhe argumentet që merr çdo nisje me Neutrino. Merr Neutrino te github.com/rickgaiser/neutrino dhe vendose në një dosje neutrino në një disk ose në një kartë memorie."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Ky Neutrino është më i vjetër se 1.3, i cili nuk mund të nisë lojëra nga HDD-ja APA. Drejto Nisja e lojërave > Neutrino te Neutrino 1.3 ose më i ri."
  "with rickgaiser's Neutrino as its second game core,": "me Neutrino të rickgaiser si bërthamë e dytë e lojërave,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "bërthama e dytë e lojërave, e përdorur nga disku ose karta jote e memories (AFL-3.0)"
