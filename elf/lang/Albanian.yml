  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'IGR Path %s nuk përdoret: pas një loje ngarkohet vetëm një skedar në kartë memorieje ose USB, dhe kurrë vetë RIPPS2'
  an issue is the best way to get RIPPS2 updated.: një çështje është mënyra më e mirë për ta përmirësuar RIPPS2.
