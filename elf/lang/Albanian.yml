  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Veprimet e shkrimit janë të fikura, ndaj RIPPS2 nuk mund të ruajë të dhënat e një loje ose ta riemërtojë. T'i ndez?"
  "BIBLE is built on El Isra's PS2BBL, its card and HDD builds signed for RIPPS2 (GPL-3)": "BIBLE është ndërtuar mbi PS2BBL të El Isra, me versionet për kartë dhe HDD të nënshkruara për RIPPS2 (GPL-3)"
