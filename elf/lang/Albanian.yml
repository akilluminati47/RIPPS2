  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Bashkimi u ndal mes dy riemërtimeve: .tar i mbajtur është %s dhe ai i bashkuar %s. Riemërtoji përsëri me Skedarët e memories.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
