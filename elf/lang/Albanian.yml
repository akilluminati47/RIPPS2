  HINT_BDM_START: 'USB, iLink, MX4SIO dhe HDD exFAT. Automatike i nis në nisje: më e shpejta për njësitë e lidhura, me lojërat e tyre te Të gjitha lojërat që nga fillimi. Manuale i nis kur hap faqen e tyre.'
