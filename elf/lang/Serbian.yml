  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 je bio zauzet čitanjem uređaja i nije mogao ponovo da pokrene I/O procesor. Ništa nije promenjeno: pokušajte ponovo za trenutak.'
