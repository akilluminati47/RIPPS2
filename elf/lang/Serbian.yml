  XERA_SET_CLOCK: Još nije u vašoj RetroAchievements biblioteci. Podesite sat konzole u sistemskim podešavanjima da biste videli punu listu, ili je odigrajte jednom sa dostignućima.
  CFG_TITLES: Prikaži CFG naslove u listama igara
  HINT_CFG_TITLES: Prikazuje naslov iz CFG-a svake igre umesto imena datoteke i ređa po njemu. Čita svaki CFG kada se lista osvežava, pa se liste sporije učitavaju. Samo prikaz.
  AUTO_VMC_INVALID: VMC datoteka ove igre postoji, ali nije ispravna memorijska kartica, pa nije korišćena niti zamenjena. Igra počinje bez nje; proverite je u VMC meniju.
  AUTO_VMC_STILL_RUNNING: VMC ove igre se još pravi. Pokrenite igru ponovo za trenutak.
  NEUTRINO_DVR_QUICKBOOT: DVR pokretanje zahteva prelaz u PSX režim. Uklonite -qb iz globalnih i Neutrino argumenata po igri.
  NEUTRINO_DVR_FILE_MISSING: 'DVR instalacija Neutrina nije potpuna. Nedostaje potrebna datoteka:'
  LOGOART: Slika logotipa
  HINT_LOGOART: Prikazuje logo igre (<ID>_LGO) kada ga tema koristi. Isključeno skriva i njegovu podrazumevanu sliku, ali zadržava omote, slike diskova i pozadine.
  PARENLOCK_GAME: Roditeljska zaštita
  PARENLOCK_GAME_HINT: Zahteva lozinku roditeljske zaštite za pokretanje ove igre.
  PARENLOCK_GAME_NO_PASSWORD: Postavite lozinku roditeljske zaštite, inače ova igra neće biti zaključana.
  HINT_ENABLE_PCCF: Rani japanski PS2 PC CARD CompactFlash. Samo izvorne PS2 igre; CF zahteva isključiv pristup PC CARD-u. Ponovo pokrenite da ga oslobodite.
  PCCF_GAMES: PC CARD CF igre
  PCCF_UNAVAILABLE: 'CF nije dostupan: potrebni su rani japanski PC CARD PS2, kompatibilna kartica i nijedan aktivan DEV9/HDD/mrežni drajver.'
  PCCF_UNSUPPORTED_GAME: CF trenutno podržava samo izvorne PS2 igre. CF VMC, učitavanje PS1 igara i mrežna dostignuća nisu dostupni.
  HINT_ENABLE_DVR: Eksperimentalno otkrivanje DESR DVR ISO datoteka. Zahteva uključen HDD izvor; pokretanje igre zahteva spoljni Neutrino koji podržava DVR.
  HINT_RIPPS2_IGR_PAGE: Meni u igri, RIPSHOT i kako se snimci razvijaju.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Snimci ekrana iz menija u igri, u ART za tvoje teme ili u MEDIA.
  RIPPS2_DEVELOP_SHOTS: Razvijanje snimaka
  HINT_RIPPS2_DEVELOP_SHOTS: Kako snimci na čekanju na filmu svake igre postaju PNG.
  RIPPS2_SETTINGS_HOME: Čuvaj podešavanja na
  HINT_RIPPS2_SETTINGS_HOME: 'Gde RIPPS2 drži podešavanja: u sopstvenom čuvanju na memorijskoj kartici, u fascikli RIPPS2 na disku (unutrašnjem HDD-u, USB-u, MX4SIO, iLinku ili MMCE) ili u fascikli koju upišeš.'
  RIPPS2_LAUNCHERS: Pokretači
  RIPPS2_LOOK_NOW: Potraži sada
  HINT_RIPPS2_LOOK_NOW: RIPPS2 na pokrenutim uređajima traži POPSTARTER, POPS datoteke, Ember, Emberov BIOS i Neutrino i pamti gde je svaki. Svako pokretanje ih čita odatle.
  RIPPS2_HIDE_GAME: Sakrij igru
  RIPPS2_HIDDEN_GAMES: Skrivene igre
  HINT_RIPPS2_HIDDEN_GAMES: Igre skrivene sa Sakrij igru, na pokrenutim uređajima. Ponovo prikažite jednu, ili je obrišite. Svaki uređaj čuva svoju listu.
  HINT_RIPPS2_BDM_DEVICES: 'Uređaji sa kojih BDM čita igre: USB, MX4SIO, PC Card CF, DVR uređaj DESR-a i iLink. Unutrašnji HDD prati režim pokretanja HDD-a.'
  HINT_RIPPS2_SCREEN: 'Slika menija: video režim, široki ekran, gde stoji na televizoru (H-POS, V-POS) i overscan.'
  HINT_RIPPS2_LAYOUT: Gde stoje kategorije i kako stranica ulazi, zatim omoti RIPFLOW-a i mreža RIPGRID-a.
  HINT_RIPPS2_COLORS_TEXT: Debljina teksta, tema boja, smena boja i svaka boja.
  HINT_RIPPS2_TEXT_WEIGHT: 'Koliko je debeo sopstveni tekst RIPPS2: saveti u podešavanjima, STATUS i O programu. Normalno je kao ranije; Podebljano se bolje čita na mekoj slici. Sopstveni fontovi teme zadržavaju debljine koje im tema daje.'
  HINT_RIPPS2_HDD_START: 'Unutrašnji HDD, APA ili exFAT: RIPPS2 ga čita kakav god da je i prikazuje ga jednom, kao HDD Igre. Automatski (najbrže sa umetnutim diskom) pokreće ga pri pokretanju; Isklj. ga ostavlja na miru.'
  HINT_RIPPS2_THEME_COLOR: Sopstvena boja teme. Izaberite Sopstveno kao temu boja da je sami birate, kao boje teksta.
  HINT_RIPPS2_SWEEP: Pet boja kroz koje tema prelazi polako i glatko. Duga, smena iz svake teme boja ili vaša sopstvena. Isključeno drži temu mirnom.
  HINT_RIPPS2_SWEEP_COLORS: Pet boja smene i njena brzina. Promenite jednu od RIPPS2-ovih i čuva se kao vaša, pod imenom koje joj date.
  HINT_RIPPS2_SWEEP_NAME: Kako se vaša smena zove na spisku Smena boja.
  HINT_RIPPS2_SWEEP_COLOR: Jedna od pet boja kroz koje smena prolazi, redom.
  HINT_RIPPS2_SWEEP_SPEED: 'Koliko traje svaka boja pre nego što uđe sledeća. I Živahno ostaje glatko: boje nikad ne trepere.'
  RIPPS2_HIDE_COMPRESS: Sakrij igru i kompresija
  HINT_RIPPS2_SELECT_HOLD: 'SELECT držan 4.2 s na listi igara. Lista: teme u panelu, izaberite jednu. Redom: sledeća tema. Isključeno: ništa (pritisak i dalje osvežava).'
  RIPPS2_RECENT_GAMES: Nedavne igre
  RIPPS2_SET_METADATA_RENAME: Postavi metapodatke (preimenuj)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Kontroler prvi (eksperimentalno)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX čita preko magistrale koju deli sa kontrolerom, a dok traje čitanje kontroler se ne čuje: pritisci kasne ili se gube dok se učitavaju omoti. Uklj.: omoti stižu u malim delovima, a između njih se čita kontroler, malo sporije. Isklj.: brzo koliko kartica može. Kada su izvori kartice na Automatski, njen spisak se učita jednom, pri pokretanju.'
  HINT_RIPPS2_TRUST_CACHE: 'Spisak prikazan iz keša ostaje kakav je, spreman za pokretanje, dok ne pritisnete SELECT ili RIPPS2 sam ne promeni taj izvor. Isklj.: svaki izvor se ponovo čita u pozadini pošto se prikaže njegov keš, pauza koja se oseti na MMCE ili MX4SIO kartici, koje dele magistralu kontrolera.'
  RIPPS2_STATUS_OPEN: Učitavanje i uređaji
  HINT_RIPPS2_STATUS_OPEN: 'Otvara STATUS: gde pokretanje čita podešavanja i spiskove igara, koje je mesto najbrže, kuda vodi EXIT igre, i svaki uređaj. Njegova PODEŠAVANJA KEŠA vraćaju ovde.'
  RIPPS2_BADGE_SET: Skup značaka
  HINT_RIPPS2_BADGE_SET: 'Značke na stranici sa podacima igre (ocena, igrači, ESRB, video režim, skeniranje, odnos). RIPPS2: njegov sopstveni skup, isti na svakoj temi. Tema: slike teme, ili RIPPS2 kada ih tema traži.'
  RIPPS2_HINT_FADE: Postepeno pojavljivanje saveta i znakova
  HINT_RIPPS2_HINT_FADE: 'Savet za dugme ili znak koji se promeni postepeno se pojavi, kao omoti, u trenutku promene; oni koji ostaju se ne diraju, na svakoj stranici i poruci. Isklj.: jednostavno se pojave. Tema: odlučuje tema (uklj., osim ako kaže hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Stil bočne trake
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klasično (podeljeno): ikone u tamnoj traci bočne trake sa obojenom linijom pored. XL (iz jednog dela): jedna šira traka sa ikonama u sredini. Tema: odlučuje tema.'
  HINT_EXITPATH: 'Kuda vodi EXIT u meniju u igri. Najbolje prazno: EXIT vodi u pregledač, koji pokreće tvoj boot loader (FreeMcBoot, PS2BBL, OSDMenu ili BIBLE) kada je instaliran, i ponovo RIPPS2 sa uključenim BOOT LOCK, kao pri uključivanju; bez njega, PS2 pregledač. ELF upisan ovde koristi se samo kada ga reset može učitati (sa memorijske kartice ili FAT32 USB uređaja) i nije sam RIPPS2; sve ostalo vodi u pregledač.'
  HINT_BDM_START: 'USB, iLink, MX4SIO i exFAT HDD. Automatski ih pokreće pri pokretanju: najbrže za priključene uređaje, sa njihovim igrama u Svim igrama od početka. Ručno ih pokreće kada otvorite njihovu stranicu.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Pokretanje čita samo disk RIPPS2: podešavanja i zvuke pored RIPPS2.ELF (RIPPS2.FB tamo kaže gde) i svaku listu iz njenog keša. Ostali diskovi čekaju: SELECT na stranici pokreće njene diskove i donosi njihove slike (sa automatskim osvežavanjem pokreću se pri pokretanju). Uključivanje kopira tvoje zvuke, a muziku ako ima mesta, u AUDIO pored RIPPS2.'
  RIPPS2_ART_PACK: Paket ART
  RIPPS2_ART_PACK_BUILD: Napravi ili ukloni
  HINT_RIPPS2_ART_PACK: Pakuje fasciklu ART svakog pokrenutog diska u jedan art.tar na disku koji izabereš (najbrži se nudi prvi). Omoti se tada učitavaju iz jedne datoteke sa jednim indeksom, nikad pretragom za svaku igru, pa meniji i muzika ostaju glatki. Fascikle ART ostaju kakve jesu.
  RIPPS2_LIST_CFG_TEXT: Naslov i opis u listi
  HINT_RIPPS2_LIST_CFG_TEXT: 'Naslov i opis igre iz njenog CFG-a pored liste. Tema: kako ih tema prikazuje (sopstvena tema RIPPS2 ih izostavlja). Stranica sa informacijama ih uvek zadržava.'
  RIPPS2_PS1_PREFER: PS1 duplikati
  HINT_RIPPS2_PS1_PREFER: 'PS1 igra koja je i VCD za POPSTARTER i Ember slika. Oba: dva reda. Ember: samo Ember red. POPSTARTER: samo VCD. Isti naslov, bez ID-a diska na početku, ista je igra.'
  RIPPS2_MY_PADS: Moji kontroleri
  HINT_RIPPS2_MY_PADS: '.pad profili u fascikli PADS pored RIPPS2: jedna tekstualna datoteka po USB kontroleru, nazvana po njegovom ID-u (2563_0575.pad), i svaki proveren. Kontroler sa profilom upravlja menijem i igra u igrama (Pad Emulator uključen).'
  RIPPS2_PAD_SETUP: Podesi USB kontroler
  HINT_RIPPS2_PAD_SETUP: Priključi USB kontroler koji RIPPS2 ne poznaje, pritisni svako dugme koje zatraži i RIPPS2 upisuje njegov .pad u PADS. SELECT na tvom PS2 kontroleru preskače dugme.
