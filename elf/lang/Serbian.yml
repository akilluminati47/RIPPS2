  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK radi preko učitavača na memorijskoj kartici (PS2BBL, FMCB ili OSDMenu), a ovde ga nema.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Memorijska kartica u slotu %d pri uključivanju pokreće %s, a BOOT LOCK nije pronašao njegovu konfiguraciju za izmenu (traži %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Memorijska kartica u slotu %d pri uključivanju pokreće %s, koji BOOT LOCK ne može da podesi: radi preko PS2BBL-a, FMCB-a i OSDMenu-a.'
