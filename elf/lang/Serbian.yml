  : RIPPS2 svira muziku menija ove konzole, ambijentalnu kompoziciju njenog pregledača (%d:%02d), po sopstvenim notama BIOS-a i upisuje je kao WAV veličine %s u %s; nijedna memorijska kartica nema mesta za nju. %s koji je već tamo biće zamenjen. Traje minut-dva.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 čita zvuke iz sopstvenog BIOS-a ove konzole i upisuje ih u %s kao svoje zvuke: kursor, potvrda, otkazivanje, stranice, kategorija, poruke, disk, greška, čuvanje, uređaji i nasumično, plus muziku pri pokretanju i pri pokretanju igre, sviranu po sopstvenim notama BIOS-a. Datoteke sa tim imenima koje su već tamo biće zamenjene.'
