  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL ne može da pokrene RIPPS2 sa mesta gde je sada (dohvata memorijske kartice, USB diskove i MX4SIO), a RIPPS2 ne kopira sam sebe. Stavi RIPPS2.ELF na memorijsku karticu ili USB disk i pokreni ga odatle, ili koristi PS2BBL Extended, koji čita MMCE i hard disk.
