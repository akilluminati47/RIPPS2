  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALIRAJ BIBLE NA UNUTRAŠNJI HDD

    - RIPPS2 se kopira u %s.

    - Program za pokretanje HDD-a koji je sada u __mbr se čita i čuva u %s/RIPPS2 (VRATI ga vraća).

    - Na njegovo mesto se upisuje HDD verzija PS2BBL, a konzola se podešava da je pokreće pri uključivanju.

    - Njena konfiguracija (%s) prvo pokreće RIPPS2 sa %s%s%s, BOOT LOCK uključen.

    Potrebna je konzola koja se pokreće sa svog HDD-a (debela PS2 sa mrežnim adapterom). Ostavite je uključenu dok ne piše gotovo.'
  INTERNAL HDD  (its boot area): UNUTRAŠNJI HDD  (njegova oblast za pokretanje)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'VRATI STARI PROGRAM ZA POKRETANJE HDD-A

    Onaj koji je BIBLE sačuvao (RIPPS2/MBR-BACKUP.KELF na HDD-u) vraća se u __mbr, umesto BIBLE-a. RIPPS2 i PS2BBL konfiguracija ostaju gde jesu.'
  RESTORE: VRATI
  RESTORE THE HDD'S OLD BOOT PROGRAM: VRATI STARI PROGRAM ZA POKRETANJE HDD-A
