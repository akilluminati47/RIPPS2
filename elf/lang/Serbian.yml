# RIPPS2 in Serbian. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Serbian
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE: INSTALIRAJ, AŽURIRAJ ILI VRATI STARO"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "AŽURIRAJ BIBLE: SLOT %d IMA STARIJI"
  "Background": "Pozadina"
  "Sky": "Nebo"
  "Black": "Crna"
  "Splash": "Uvodni ekran"
  "Logo": "Logo"
  "Logo and Names": "Logo i nazivi"
  "Button Glyphs": "Simboli tastera"
  "Face Buttons": "Tasteri za radnje"
  "All Sixteen": "Svih šesnaest"
  "Info Line": "Red sa informacijama"
  "Power-on Wait": "Čekanje pri uključenju"
  "Starting that drive...": "Pokretanje tog uređaja..."
  "%s, path %d": "%s, putanja %d"
  "A BIBLE COMMAND": "NAREDBA BIBLE-A"
  "ARGUMENTS": "ARGUMENTI"
  "Argument %d": "Argument %d"
  "Arguments: %s": "Argumenti: %s"
  "Auto (no button held)": "Auto (bez držanog dugmeta)"
  "BIBLE hands these to the program, in this order.": "BIBLE ih predaje programu ovim redom."
  "BIBLE has no way to reach that drive. Choose a program on another one, or type the path.": "BIBLE ne može da dođe do tog uređaja. Izaberite program na drugom ili unesite putanju."
  "BIBLE keeps this key from PS2BBL, but nothing in this build acts on it, so it changes nothing yet.": "BIBLE čuva ovaj ključ iz PS2BBL-a, ali ništa u ovoj verziji ga ne koristi, pa zasad ništa ne menja."
  "BIBLE needs at least one path in its settings, or it starts in its rescue mode, so this one stays.": "BIBLE-u treba bar jedna putanja u podešavanjima, inače se pokreće u režimu spasavanja, pa ova ostaje."
  "BIBLE's Settings": "Podešavanja BIBLE-a"
  "BIBLE's credits": "Zasluge BIBLE-a"
  "BOOT LOCK holds this line. Turn BOOT LOCK off to change it.": "BOOT LOCK drži ovaj red. Isključite BOOT LOCK da biste ga promenili."
  "Binds the BIBLE RIPPS2 carries to a memory card, writes it over the one there, or puts back what it replaced.": "Vezuje BIBLE koji RIPPS2 nosi za memorijsku karticu, piše ga preko postojećeg ili vraća ono što je zamenio."
  "Boot Sound": "Zvuk pokretanja"
  "CHOOSE A PROGRAM": "IZABERITE PROGRAM"
  "CHOOSE AN ELF": "IZABERITE ELF"
  "Choose a program from your drives, type a path, or pick one of BIBLE's commands. BIBLE tries the paths in order and starts the first it finds.": "Izaberite program sa uređaja, unesite putanju ili izaberite naredbu BIBLE-a. BIBLE isprobava putanje redom i pokreće prvu koju nađe."
  "Follow Color Theme": "Prati temu boja"
  "How long BIBLE waits for a button before the Auto path. At 0 ms a button held from power on still works. A boot sound beside BIBLE is read first: about 2 s at 0 ms.": "Koliko BIBLE čeka dugme pre putanje Auto. Na 0 ms dugme držano od uključivanja i dalje radi. Zvuk pokretanja pored BIBLE-a čita se prvi: oko 2 s na 0 ms."
  "Launch Keys": "Dugmad za pokretanje"
  "Launch Keys: %s": "Dugmad za pokretanje: %s"
  "On shows a disc's game ID on screen as it starts, for RetroGEM video mods.": "Uključeno prikazuje ID igre sa diska na ekranu pri pokretanju, za RetroGEM video modove."
  "On shows a program's game ID on screen as it starts, for RetroGEM video mods. It is up to 11 characters from the file name.": "Uključeno prikazuje ID programa na ekranu pri pokretanju, za RetroGEM video modove. Do 11 znakova iz naziva datoteke."
  "On stops the disc at a launch and waits for the drive to answer. Off skips that wait, about 3 s in the lab, and a disc in the tray keeps spinning.": "Uključeno zaustavlja disk pri pokretanju i čeka odgovor uređaja. Isključeno preskače to čekanje, oko 3 s u laboratoriji, a disk u fioci nastavlja da se vrti."
  "Opens the file itself in the text editor, comments and all. Every change here keeps the other lines as they are.": "Otvara samu datoteku u uređivaču teksta, sa komentarima. Svaka promena ovde ostavlja ostale redove kakvi jesu."
  "Path %d": "Putanja %d"
  "Shows the countdown, the clock and the console's details on the splash.": "Prikazuje odbrojavanje, sat i podatke o konzoli na početnom ekranu."
  "Sky Color": "Boja neba"
  "TYPE A PATH": "UNESITE PUTANJU"
  "The button pictures under the logo: none, the four face buttons, or all sixteen.": "Slike dugmadi ispod logotipa: nijedna, četiri glavna dugmeta ili svih šesnaest."
  "The console's browser": "Pregledač konzole"
  "The disc in the tray": "Disk u fioci"
  "The disc, without the PS2 logo": "Disk, bez PS2 logotipa"
  "The name BIBLE's splash shows for this button.": "Naziv koji početni ekran BIBLE-a prikazuje za ovo dugme."
  "The same setting as in Audio. On (fast) keeps a copy on the memory card, so the sound starts with the first frame. Off is the fastest boot.": "Isto podešavanje kao u Zvuku. Uklj. (brzo) čuva kopiju na memorijskoj kartici pa zvuk počinje s prvim kadrom. Isključeno je najbrže pokretanje."
  "The shape of BIBLE's splash. Auto follows RIPPS2's Widescreen when its settings are on a memory card.": "Oblik početnog ekrana BIBLE-a. Auto prati široki ekran RIPPS2-a kad su njegova podešavanja na memorijskoj kartici."
  "The signal BIBLE starts in. Auto uses RIPPS2's Video Mode when its settings are on a memory card, and the console's own mode when they are not.": "Signal kojim BIBLE počinje. Auto koristi video režim RIPPS2-a kad su njegova podešavanja na memorijskoj kartici, inače režim same konzole."
  "The sky on BIBLE's splash. Follow Color Theme uses the sky RIPPS2 saves with its settings. A color named here stays, whatever the theme.": "Nebo na početnom ekranu BIBLE-a. Prati temu boja koristi nebo koje RIPPS2 čuva s podešavanjima. Boja izabrana ovde ostaje, bez obzira na temu."
  "This BIBLE (%s build) does not read this drive, so it moves on to the next path.": "Ovaj BIBLE (verzija %s) ne čita ovaj uređaj, pa prelazi na sledeću putanju."
  "What BIBLE shows while it waits for a button: nothing, its logo, or its logo with the name of what each button starts.": "Šta BIBLE prikazuje dok čeka dugme: ništa, svoj logotip ili logotip s nazivom onoga što svako dugme pokreće."
  "What BIBLE starts when no button is held at power on.": "Šta BIBLE pokreće kad pri uključivanju nije držano nijedno dugme."
  "What BIBLE starts when this button is held at power on. L2 + R2 held at power on shows BIBLE's own page of them all.": "Šta BIBLE pokreće kad je ovo dugme držano pri uključivanju. L2 + R2 pri uključivanju prikazuju stranicu BIBLE-a sa svima njima."
  "What each button starts at power on, each with up to ten paths chosen from your drives.": "Šta svako dugme pokreće pri uključivanju, svako s do deset putanja izabranih s vaših uređaja."
  "What stands behind BIBLE's logo. Auto shows the sky when Sky Color is set or RIPPS2's settings are on a memory card, and black when they are not.": "Šta stoji iza logotipa BIBLE-a. Auto prikazuje nebo kad je zadata Boja neba ili su podešavanja RIPPS2-a na memorijskoj kartici, inače crno."
  "When a button starts a disc and the tray is empty, On opens the tray for you.": "Kad dugme pokrene disk, a fioka je prazna, Uključeno otvara fioku umesto vas."
  "Eject Tray at Launch": "Izbaci ladicu pri pokretanju"
  "Read Console History": "Čitaj istoriju konzole"
  "Game ID for Apps": "ID igre za aplikacije"
  "Game ID for Discs": "ID igre za diskove"
  "File name (as it appears in your games list)": "Naziv datoteke (kako se vidi na listi igara)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "Ova lista prikazuje igre sa drugih uređaja. Preimenujte igru na stranici njenog uređaja."
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "Igra sa zvezdicom ne može da se preimenuje. Uklonite zvezdicu (R3), preimenujte, pa je ponovo dodajte."
  "This drive cannot rename its files. The details can still be set.": "Ovaj uređaj ne može da preimenuje svoje datoteke. Podaci i dalje mogu da se postave."
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "Na APA HDD-u naziv PS2 igre je u tabeli particija, pa ovde ne može da se preimenuje. Podaci i dalje mogu da se postave."
  "Renames the app in your list. Its ELF and its art keep their names.": "Preimenuje aplikaciju na vašoj listi. ELF i slike zadržavaju svoje nazive."
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "Preimenuje igru na njenom uređaju. PS1 igre pronalaze slike i podešavanja po nazivu, pa ih RIPPS2 preimenuje zajedno sa njom. Za slike u ART Pack-u paket mora ponovo da se napravi."
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "Preimenuje datoteku igre na njenom uređaju. PS2 igre pronalaze slike i podešavanja po ID-u igre, pa se ništa ne gubi."
  "Stop Disc at Launch": "Zaustavi disk pri pokretanju"
  "EDIT BIBLE'S SETTINGS FILE": "UREDI DATOTEKU PODEŠAVANJA BIBLE-a"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "Datoteka podešavanja BIBLE-a (%s) nije mogla da se upiše. Proveri da li je memorijska kartica ubačena i ima li mesta, pa pokušaj ponovo."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "Datoteka podešavanja BIBLE-a (%s) nije pronađena. BIBLE: INSTALIRAJ, AŽURIRAJ ILI VRATI STARO upisuje novu."
  "Boot sound On (fast): %s, handed over by BIBLE": "Zvuk pokretanja Uklj. (brzo): %s, predao BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: akilluminati47-ov fork PS2BBL Extended, svaku verziju potpisao akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "njegova IOPRP slika vezuje BIBLE za vašu karticu (GPL-3): šifrovanje radi konzola, bez ključeva"
  "KELFBinder by El Isra": "KELFBinder, autor El Isra"
  "source: github.com/akilluminati47/BIBLE": "izvorni kod: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: podešavanje BIBLE. BIBLE, akilluminati47-ov pokretač sistema zasnovan na PS2BBL-u autora El Isre, koji RIPPS2 podešava na običnoj PS2 memorijskoj kartici od 8 MB ili unutrašnjem hard disku: pokretanje za 0 ms pri uključivanju (PS2BBL Extended ne dozvoljava 0), prvo RIPPS2 sa mesta gde jeste (nikad se ne kopira), a taster držan pri uključivanju i dalje vodi do pregledača (TRIANGLE), diska (START) i onoga što je bilo pre (CIRCLE). Podesiti, popraviti ili vratiti ono što je zamenio?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: podešavanje BIBLE\nKartica u slotu %d je kartica SD2PSX ili MMCE. Njena BOOT kartica može da drži BIBLE umesto PS2BBL-a koji ima (on se najpre premešta u stranu, ceo), ako konzola veže BIBLE za nju. Ako se vezivanje odbije, ništa se na kartici ne menja, a kartica može da prestane da odgovara dok se konzola ne isključi i uključi. START vezuje BIBLE za nju."
  "BIND BIBLE": "VEŽI BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT pored RIPPS2 sadrži odgovor kartice.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Za običnu PS2 memorijsku karticu od 8 MB (MagicGate karticu ili BOOT karticu SD2PSX ili MMCE): onu u slotu %d. Pri uključivanju PS2BBL čita konfiguraciju slota 1 pre konfiguracije slota 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Konzola nije htela da veže BIBLE za memorijsku karticu u slotu %d (korak MagicGate nije uspeo). Ništa na kartici nije promenjeno. Kartica koja nije originalna ili kompatibilna sa MagicGate ne može da sadrži ažuriranje sistema."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Kartica SD2PSX ili MMCE može da prestane da odgovara posle odbijenog vezivanja: ako sada nedostaje memorijska kartica ili MMCE disk, isključi i ponovo uključi konzolu."
  "RIP THIS CONSOLE'S AUDIO": "IZDVOJI ZVUK OVE KONZOLE"
  "sounds or music, from its BIOS": "zvuci ili muzika, iz njenog BIOS-a"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Otvara Podešavanja zvuka na BIOS zvucima i BIOS muzici: izdvoji sopstvene zvuke ove konzole ili muziku njenog menija u AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Zvuk pokretanja Uklj. (brzo): %s na memorijskoj kartici, dok stubovi rastu"
  "Boot sound On: %s on the memory card, as the pillars rise": "Zvuk pokretanja Uklj.: %s na memorijskoj kartici, dok stubovi rastu"
  "Boot sound On: %s, once its drive is up": "Zvuk pokretanja Uklj.: %s, kad mu je disk spreman"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Ova igra se pokreće preko Neutrina, a RIPPS2 nije našao nijedan: ni na putanji iz Podešavanja, ni na disku igre, ni na memorijskim karticama, ni na bilo kom pokrenutom disku. Stavite rickgaiserov Neutrino (github.com/rickgaiser/neutrino) u fasciklu neutrino na disku igre ili memorijskoj kartici ili usmerite Pokretanje igara > Neutrino na njega."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Gde je vaš Neutrino, njegov video režim i argumenti koje dobija svako pokretanje Neutrina. Neutrino preuzmite sa github.com/rickgaiser/neutrino i stavite ga u fasciklu neutrino na disku ili memorijskoj kartici."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Ovaj Neutrino je stariji od 1.3, koji ne može da pokreće igre sa APA HDD-a. Usmerite Pokretanje igara > Neutrino na Neutrino 1.3 ili noviji."
  "with rickgaiser's Neutrino as its second game core,": "sa rickgaiserovim Neutrinom kao drugim jezgrom za igre,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "drugo jezgro za igre, koristi se sa vašeg diska ili memorijske kartice (AFL-3.0)"
  "FILE NAME": "NAZIV DATOTEKE"
  "GAME LIST": "SPISAK IGARA"
  "%s in %s": "%s u %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Operacije upisa su isključene, pa RIPPS2 ne može da sačuva podatke igre niti da je preimenuje. Da ih uključim?"
