  'This disc is not compatible: it is a region %d DVD, and this console plays another region''s DVDs. Start it anyway?': 'Ovaj disk nije kompatibilan: to je DVD za region %d, a ova konzola reprodukuje DVD-ove iz drugog regiona. Ipak pokrenuti?'
  ? 'This disc is not compatible: it reads as DVD video but has no DVD video on it (no VIDEO_TS), so a DVD player cannot play it.'
