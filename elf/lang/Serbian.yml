  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: podešavanje BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: podešavanje BIBLE
  
    RIPPS2 radi sa %s, što PS2BBL ne može da čita (čita memorijske kartice, USB i MX4SIO), a RIPPS2 ne kopira sam sebe. Konfiguracija PS2BBL Extended na ovoj kartici (%s) to čita: START uključuje BOOT LOCK, pa pri uključivanju pokreće RIPPS2 sa %s. Ništa drugo na kartici se ne menja.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: podešavanje BIBLE
  
    RIPPS2 radi sa %s, što PS2BBL ne može da čita: pokreće programe sa memorijske kartice, USB diska ili MX4SIO, a RIPPS2 ne kopira sam sebe. Stavi RIPPS2.ELF na jedno od toga (fasciklu APPS memorijske kartice ili USB disk), pokreni ga odatle, pa ponovo podesi BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: podešavanje BIBLE
  
    Memorijska kartica u slotu %d: BIBLE (mc%d:/%s) se sklanja, a ono što je zamenio (mc%d:/%s) se vraća na svoje mesto. Ništa se ne briše. Konfiguracija PS2BBL ostaje kakva jeste (BOOT LOCK može da isključi zaključavanje).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: podešavanje BIBLE (vezivanje PS2BBL za memorijsku karticu)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: podešavanje BIBLE (vraćanje onoga što je bilo)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: podešavanje BIBLE (ponovno pokretanje U/I procesora)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: podešavanje BIBLE (upis na memorijsku karticu)'
  SET UP BIBLE: PODESI BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Memorijska kartica u slotu %d ima %d KB slobodno, a BIBLE na njoj treba %d KB. Oslobodi malo mesta pa pokušaj ponovo.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
