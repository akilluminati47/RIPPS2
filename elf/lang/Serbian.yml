  HINT_BDMA_APPLY: 'Uključeno: pre pokretanja VCD-a priprema potrebno POPSTARTER BDMA okruženje na memorijskoj kartici kada je moguće. POPSTARTER se pokreće i ako priprema ne uspe. Isključeno: drajvere kartice birate pomoću izbora Izvor/Režim ispod.'
  HINT_BDMA_MODE: Drajver blok-uređaja koji POPSTARTER učitava. Promena kopira module na karticu; FAT32 = nijedan (ugrađeni drajver).
  HINT_BDMA_SOURCE: Uređaj čija fascikla POPS sadrži vaše datoteke BDMAssault drajvera (usbd.irx.* / usbhdfsd.irx.*); iLink koristi nastavak .ilink.
  HINT_DEFAULT_CORE: Globalno podrazumevano samo gde su podržana oba jezgra. UDPFS/UDPBD uvek koriste Neutrino; SMB/HTTP uvek koriste <OPL>. Izbor jezgra učitavača po igri ima prednost gde postoji.
  HINT_ENABLEIMAGE: Primeni gotovu PS2RD .img zakrpu na igru.
  HINT_FOLDER_NAV: Prikazuje podfascikle CD/DVD kao stavke za pregledanje; izaberite za otvaranje, otkažite za povratak
  HINT_MMCEIGR_SLOT: Komanda za prelazak na karticu za pokretanje šalje se izabranim slotovima pri IGR
  HINT_MMCE_USE_ALARMS: ISKLJUČENO može da pomogne performansama, ali MMCE istek vremena tada može da zamrzne igru
  HINT_MMCE_WAIT_CYCLES: Niže vrednosti mogu da poboljšaju performanse, ali donose nestabilnost
  HINT_MODE7: 'Samo Neutrino: popravlja igre koje prepune IOP bafer (-gc=7)'
  HINT_NEUTRINO_ARGS: Napredne Neutrino opcije. Globalno važi za sve igre; po igri se dodaje povrh toga. Dodatno prihvata druge podržane zastavice. Stavite $ ispred zastavice da je isključite bez brisanja.
  HINT_NEUTRINO_AUTO_ELF: Prosleđuje Neutrinu ELF za pokretanje igre radi traženja podešavanja po naslovu. Podrazumevano uključeno; ručno postavljena opcija ELF za pokretanje ima prednost.
  HINT_NEUTRINO_BSDFS: Nameće Neutrinov sistem datoteka blok-uređaja (-bsdfs). Auto = podrazumevano po uređaju. hdl/bd su opcije za stručnjake; uparite ih sa odgovarajućim -dvd= u argumentima pokretanja ako automatski oblik putanje ne odgovara.
  HINT_NEUTRINO_DEVICE: Uređaj na kojem je neutrino.elf (u fascikli NEUTRINO/ ili neutrino/). Auto = uređaj same igre, pa mc0/mc1. Uređaj igre = samo uređaj igre.
  HINT_NEUTRINO_GSM_COMP: Popravka zamene poluslika za igre koje se tresu ili cepaju pod nametnutim Neutrino video režimom. Potreban je postavljen Neutrino video režim.
  HINT_NEUTRINO_VIDEO: Nameće Neutrinov GS izlazni video režim (-gsm). Isključeno zadržava podrazumevani režim igre.
  HINT_POPSTARTER_DEVICE: Uređaj na kojem je POPS/POPSTARTER.ELF za pokretanje PS1 VCD-a. Podrazumevano = uređaj za pokretanje (cwd), pa uređaj samog VCD-a. Uređaj igre = samo uređaj VCD-a. Prilagođeno otvara polje za slobodan unos putanje.
  HINT_POPSTARTER_PATH: Gde je POPSTARTER.ELF. Ako ostane prazno, RIPPS2 upisuje onaj koji pronađe na disku; prekucajte ga da biste koristili drugi, npr. usb:/POPS/POPSTARTER.ELF
  HINT_POPSTARTER_RETROGEM_GAMEID: Iscrtava pravi bar-kod Game ID diska za Pixel FX / RetroGEM / PS2Digital pri pokretanju PS1 igara (POPSTARTER VCD i Ember)
  HINT_POPS_IMPORT: Čita POPSTARTER datoteke IPCONFIG.DAT i SMBCONFIG.DAT iz fascikle POPS povezanog SMB deljenja. Ništa se ne upisuje dok ne potvrdite sa OK.
  HINT_POPS_PORT: SMB port na serveru; 445 je podrazumevani. Ostavite 0 (ili 445) za obično deljenje; koristite 139 za starije SMB1 servere.
  HINT_RUMBLE: Kratka vibracija pri pomeranju kursora, potvrdi ili povratku; potreban je DualShock u analognom režimu
  HINT_VCD_FIRST_DISC: Prikazuje samo disk 1 PS1 igre sa više diskova u listama uređaja (kao POPSLoader). Skriva datoteke nazvane (Disc 2), (CD 2) itd. Svi diskovi ostaju na kartici za zamenu u igri; omiljene igre se ne filtriraju.
  HINT_VCD_HIDE_GAMEID: 'Samo izgled: skriva početni prefiks ID-a igre (npr. SLUS_005.51.) iz imena u PS1/VCD listama. Imena bez ID-a prikazuju se kakva jesu. Ne menja pokretanje, omote ni zvezdice.'
  HINT_VCD_SHOW_PP_POPS: 'Samo HDD: prikazuje kao PS1 igre particije sa jednom igrom nazvane PP.<ID>.POPS.<name> (npr. PP.SCES-01492.POPS.MEDIEVIL). Samo popis; pokretanje se ne menja. Ostale PP.* particije (programi, PS2 igre) ostaju skrivene.'
  HINT_VMC_SLOT_DISABLE: Pokreće bez VMC-a ovog slota, a kartica ostaje podešena. Samo za Neutrino pokretanja; igra tada koristi pravu karticu u tom slotu.
