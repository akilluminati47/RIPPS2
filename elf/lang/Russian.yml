  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Спасибо всем, кто тестирует в Discord и открывает issues на GitHub:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'IGR Path %s не используется: после игры загружается только файл с карты памяти или USB, и никогда сам RIPPS2'
  an issue is the best way to get RIPPS2 updated.: issue лучше всего помогает обновлять RIPPS2.
  your Ogg and MP3 music, as RIPPS2 plays it: ваша музыка Ogg и MP3, как её играет RIPPS2
  Pop In and Name: Всплытие и название
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s запускается после колонн, поэтому звук запуска опаздывает. START копирует boot.adp (%d КБ) рядом с RIPPS2 на карту памяти (свободно %d КБ), где он звучит, пока поднимаются колонны.'
  The boot sound could not be copied to %s. It still plays from %s.: Не удалось скопировать звук запуска в %s. Он по-прежнему звучит из %s.
  Zoom: Приближение
  '%s could not be deleted; it stays as it was.': Не удалось удалить %s; он остаётся как был.
  '%s could not be read as a .tar archive. Nothing was changed.': Не удалось прочитать %s как архив .tar. Ничего не изменено.
  '%s is deleted. %s is kept.': '%s удалён. %s сохранён.'
  Art loads from it from now on.: Теперь изображения загружаются из него.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : 'Удалить влитый .tar?
  
    УДАЛЯЕТСЯ: %s
  
    ОСТАЁТСЯ: %s (цель, теперь со всеми изображениями обоих)'
  Into %s (%s): В %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : 'ОСТАЁТСЯ и обновляется: %s (%d изображений)
  
    ВЛИВАЕТСЯ: %s (%d изображений)
  
    Изображений в обоих: %d. Побеждает вливаемый. Оставляемый .tar записывается заново как новый файл и подменяется только целым, так что остановка или полный диск оставляют его как был. Объединить сейчас?'
  MERGE .TAR: ОБЪЕДИНИТЬ .TAR
  MERGE a .tar into the pack in %s: ВЛИТЬ .tar в пакет в %s
  MERGING THE ART: ОБЪЕДИНЕНИЕ ИЗОБРАЖЕНИЙ
  Merge in %s (%s): Влить %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Влить новый пакет в другой .tar? Затем вы выберете .tar, который останется и обновится; изображения нового пакета попадут в него.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Объединено: в %s теперь %d изображений (%d МБ), %d с.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Входит изображений: %d (%s). С тем же именем в обоих: %d (побеждает вливаемый).'
  'Reading the archives: %s': 'Чтение архивов: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Остановить? Оставляемый .tar останется как был; незаконченная копия удаляется.
  Stopped. %s is as it was; the unfinished copy was removed.: Остановлено. %s как был; незаконченная копия удалена.
  The kept .tar is only replaced once the merged copy is whole.: Оставляемый .tar заменяется только когда объединённая копия целая.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Не удалось записать объединение на диск с %s (есть место?). Он как был; больше ничего не изменилось.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : Объединению нужно около %s свободного места на диске с %s (новый архив сначала пишется рядом со старым). Освободите место и попробуйте снова.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Объединение остановилось между двумя переименованиями: оставляемый .tar сейчас %s, а влитый %s. Верните им имена в Файлах памяти.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : Объединённый .tar записан, но не смог получить имя %s (MMCE переименовывает с прошивки 1.4.0). Новый файл удалён; оставляемый .tar как был.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : Нет другого .tar, чтобы влить в %s. Положите его в эту папку, в папку ART диска или в корень диска и попробуйте снова.
  MERGE A .TAR INTO THIS: ВЛИТЬ .TAR В ЭТОТ
  ? '
  
    %d game button maps in GAMES'
  : '
  
    %d раскладок кнопок игр в GAMES'
  ? '
  
    1 game button map in GAMES'
  : '
  
    1 раскладка кнопок игры в GAMES'
  (no name): (без имени)
  Both: Оба
  ? 'None yet. A profile is a text file named after the pad''s ID, like 2563_0575.pad: the format is in RIPPS2''s repo (docs/plans/pad-spec.md).'
  : 'Пока нет. Профиль: это текстовый файл, названный по ID геймпада, например 2563_0575.pad: формат описан в репозитории RIPPS2 (docs/plans/pad-spec.md).'
  On (fast): Вкл. (быстро)
  'Pad profiles in %s:': 'Профили геймпадов в %s:'
  RIPPS2 cannot tell where its folder is, so it cannot look for PADS.: RIPPS2 не знает, где его папка, поэтому не может искать PADS.
  could not be read: не удалось прочитать
  About %d seconds left: Осталось около %d с
  About 1 second left: Осталась около 1 секунды
  Taking longer than its last start (%d s so far): Дольше прошлого запуска (уже %d с)
  ? 'Download the covers in HD (280 x 400)? Sharper on an HD screen, about 70 KB each. START: Standard (140 x 200, as Open PS2 Loader''s), about 20 KB each. A game that already has a cover keeps it.'
  : 'Скачать обложки в HD (280 x 400)? Чётче на HD-экране, около 70 КБ каждая. START: стандартные (140 x 200, как в Open PS2 Loader), около 20 КБ каждая. Игра, у которой уже есть обложка, сохранит её.'
  STANDARD: СТАНДАРТ
  '%d IN': 'ДОБАВЛЕНО: %d'
  '%d IN, %d REPLACED': 'ДОБАВЛЕНО: %d, ЗАМЕНЕНО: %d'
  COULD NOT WRITE: НЕ УДАЛОСЬ ЗАПИСАТЬ
  'Getting it ready: %s': 'Подготовка: %s'
  NOT A .TAR: ЭТО НЕ .TAR
  NOTHING CHANGED: НИЧЕГО НЕ ИЗМЕНЕНО
  NOTHING TO PUT IN: НЕЧЕГО ДОБАВИТЬ
  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : Вкл. (быстро) хранит звук запуска рядом с RIPPS2 на карте памяти, с которой он запускается, а RIPPS2 запущен не с карты. Звук запуска играет как при Вкл.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'Звука запуска для копирования ещё нет: Настройки звука > Звуки BIOS извлекают звуки этой консоли.'
  '%d COPIED OUT': 'СКОПИРОВАНО НАРУЖУ: %d'
  '%d ITEM   %d MARKED   %s': '%d ЭЛЕМЕНТ   %d ОТМЕЧЕНО   %s'
  '%d ITEM   %d MARKED   %s   %s FREE': '%d ЭЛЕМЕНТ   %d ОТМЕЧЕНО   %s   %s СВОБОДНО'
  '%d ITEMS   %d MARKED   %s': '%d ЭЛЕМЕНТОВ   %d ОТМЕЧЕНО   %s'
  '%d ITEMS   %d MARKED   %s   %s FREE': '%d ЭЛЕМЕНТОВ   %d ОТМЕЧЕНО   %s   %s СВОБОДНО'
  '%s IN %d': '%s В %d'
  '%s IN %d, %s FREE': '%s В %d, %s СВОБОДНО'
  ', %d LEFT OUT': ', ПРОПУЩЕНО: %d'
  COPY IT OUT TO OPEN IT: СКОПИРУЙТЕ НАРУЖУ, ЧТОБЫ ОТКРЫТЬ
  'Copying out: %s': 'Копирование наружу: %s'
  INVERT MARKS: ОБРАТИТЬ ОТМЕТКИ
  NO FILES ON THE CLIPBOARD: В БУФЕРЕ НЕТ ФАЙЛОВ
  SIZE AND FREE SPACE: РАЗМЕР И СВОБОДНОЕ МЕСТО
  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS во внутриигровом меню включает или выключает каждый чит игры прямо во время игры. Изменения применяются по RESUME; выключенный чит перестаёт записывать, записанное остаётся. Нужны включённые Cheats для игры.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Без CHEATS во внутриигровом меню: читы, отмеченные до запуска, работают всю игру, как раньше.'
  BOOT SOUND WITH THE PILLARS: ЗВУК ЗАПУСКА С КОЛОННАМИ
  'Boot Sound: On (fast)': 'Звук запуска: Вкл. (быстро)'
  'Boot sound On: from the AUDIO folder, once its drive is up': 'Звук запуска Вкл.: из папки AUDIO, когда её диск готов'
  Boot sound off (Audio settings > Boot Sound): Звук запуска выкл. (Настройки звука > Звук запуска)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: 'Копирует boot.adp рядом с RIPPS2 на карту памяти, с которой он запускается: там запуск читает его до готовности дисков.'
  '%s could not be written.': Не удалось записать %s.
  '%s is there already and could not be put aside, so it was left as it was.': '%s уже существует, и его не удалось отложить, поэтому он остался как был.'
  Circle: Круг
  Cross: Крест
  Down: Вниз
  Down on the d-pad: Вниз на крестовине
  Found %04X:%04X. Let go of everything on it, sticks too, and wait.: Найден %04X:%04X. Отпустите на нём всё, и стики тоже, и подождите.
  Got it. Let go.: Есть. Отпустите.
  L3 (press the left stick in): L3 (нажмите левый стик)
  Left on the d-pad: Влево на крестовине
  Nothing was set up, so no file was written.: Ничего не настроено, поэтому файл не записан.
  ? Plug in the USB pad you want to set up. If it is in already, take it out and plug it in again. Then press any button on it once.
  : Подключите USB-геймпад, который хотите настроить. Если он уже подключён, отключите и подключите снова. Затем один раз нажмите на нём любую кнопку.
  Press %s on the USB pad and hold it.: Нажмите %s на USB-геймпаде и держите.
  Push %s and hold it.: Отклоните %s и держите.
  R3 (press the right stick in): R3 (нажмите правый стик)
  Right on the d-pad: Вправо на крестовине
  Save: Сохранить
  Saved as %s. The pad now steers the menu, and plays in games with the Pad Emulator on.: Сохранено как %s. Теперь геймпад управляет меню и играет в играх при включённом Pad Emulator.
  Skip: Пропустить
  Square: Квадрат
  This pad cannot be described in a .pad yet (%s), so no file was written.: Этот геймпад пока нельзя описать в .pad (%s), поэтому файл не записан.
  Triangle: Треугольник
  'Try it. What you hold shows here:': 'Попробуйте. То, что вы держите, видно здесь:'
  Up: Вверх
  Up on the d-pad: Вверх на крестовине
  the left stick down: левый стик вниз
  the left stick to the right: левый стик вправо
  the right stick down: правый стик вниз
  the right stick to the right: правый стик вправо
labels:
  DS34BT_MODE: DualShock3/4 по Bluetooth
  HINT_NEUTRINO_AUTO_ELF: Передаёт загрузочный ELF игры в Neutrino, чтобы найти настройки для этой игры. Включено по умолчанию; заданный вручную параметр Boot ELF важнее.
  HINT_POPSTARTER_PATH: Где лежит POPSTARTER.ELF. Если оставить пустым, RIPPS2 подставит найденный на накопителе; впишите другой путь, например usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Аргументы Neutrino длиннее, чем можно сохранить. Сократите поле перед сохранением.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Аргументы запуска Neutrino превышают безопасный предел. Сократите общие аргументы или аргументы игры.
  NEUTRINO_AUTO_ELF: Автоматический Boot ELF (-elf)
  HINT_NEUTRINO_PATH: 'Где лежит neutrino.elf? <не задано> = накопитель игры -> mc0/mc1. Свой полный путь пробуется первым. Примеры: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Показ игр PS2/PS1
  HINT_GAME_VIEW_MODE: «Все» показывает игры PS2 и PS1 вместе, а L3 переключает «Все», PS1 и PS2. PS2 или PS1 показывает только этот тип и отключает L3. У APPS и «Избранных игр» свои правила.
  VIEW_MIXED: Показаны игры PS2 + PS1
  VIEW_PS1_ELF: Показаны приложения PS1 ELF
  APPS_DISPLAY: Показ приложений
  HINT_APPS_DISPLAY: «Все» показывает каждый ELF в одном списке APPS, L3 отключён. «Прил. / PS1ELF» выносит названия с [PS1] на вторую страницу L3; запуск не меняется.
  VIEW: Вид
  VIEW_PS2: Показаны избранные игры PS2
  VIEW_PS1: Показаны избранные игры PS1
  VIEW_ELF: Показаны избранные ELF
  VIEW_ALL: Показаны все избранные игры
  VMC_FRAGMENTED_ON_CREATE: VMC создана, но фрагментирована. Эмуляции карты памяти нужен непрерывный файл, поэтому эта VMC будет пропущена при запуске, а использоваться будет настоящая карта. Освободите место и создайте её заново или скопируйте с другого устройства.
  KEYB_MOVE_CURSOR: Двигать курсор
  TITLECOLOR: Цвет названия игры
  RA_CHECK_GAME: Проверить поддержку RetroAchievements
  RA_TEST_LINK: Проверить связь RetroAchievements с ПК
  RA_CHECKING_IMAGE: Проверка образа, это займёт несколько секунд...
  RA_CHECK_RUNNING: Проверка образа уже идёт
  RA_LOOKING_FOR_PC: Поиск клиента на ПК...
  RA_UL_UNSUPPORTED: Игры UL/USBExtreme пока нельзя проверить
  RA_UL_UNSUPPORTED2: Поддерживаются только обычные образы .iso в DVD/ или CD/
  RA_UNKNOWN_IMAGE: RetroAchievements не знает этот образ
  RA_STILL_IDENTIFYING: ПК ещё определяет образ
  RA_TRY_AGAIN: Попробуйте снова через несколько секунд
  RA_NO_SOCKET: Консоль не смогла открыть сетевой сокет
  RA_NO_SOCKET2: Перезапустите консоль или проверьте устройство ETH в настройках
  RA_TEST_NO_SOCKET2: Проверьте кабель и ETH в настройках; если сеть работает, перезапустите консоль
  RA_PC_NO_ANSWER: Клиент на ПК не ответил
  RA_PC_NO_ANSWER2: Проверьте, что xeRAbora запущен, или проверьте связь с ПК
  RA_SUPPORTED: Поддерживается RetroAchievements
  RA_START_TO_TRACK: Запустите игру, чтобы отслеживать достижения
  RA_ACHIEVEMENTS: 'Достижений: %d'
  RA_ACHIEVEMENTS_FULL: 'Достижений: %d -- открыто %d, без поддержки %d'
  RA_HASH_FAILED: Не удалось вычислить хэш образа
  RA_HASH_FAILED2: Причина в RA/hashes.txt рядом с играми
  RA_NET_BUSY: Сеть занята транспортом UDP
  RA_NET_BUSY2: RA нужен стек SMB -- смените протокол или сделайте .wl на ПК
  RA_NET_BUSY_HASH: Хэш записан в RA/hashes.txt -- xeRAbora может сделать по нему .wl
  RA_NO_IP: У консоли нет IP-адреса
  RA_NO_IP2: Проверьте DHCP или статический адрес в настройках сети
  RA_TEST_NO_ANSWER: Ни один клиент на ПК не ответил за 3 секунды
  RA_TEST_NO_ANSWER2: Консоль%s. Проверьте, что xeRAbora запущен, а порт UDP 18194 открыт
  RA_TEST_FOUND: Клиент на ПК найден%s%s %s
  RA_TEST_FOUND2: Ответ за %u мс, консоль%s
  RA_NA_NEUTRINO: Отслеживанию RA нужно ядро <OPL> -- запуск через Neutrino никогда не загружает ee_core
  RA_NA_UDPFS: Отслеживание RA недоступно на UDPFS -- игры запускаются через Neutrino
  RA_NA_PS1: Отслеживание RA недоступно для игр PS1
  RA_NA_HDD: Сведения об игре APA или папка настроек HDD недоступны
  RA_NA_HDD2: Задайте корректную папку настроек на HDD и обновите список перед проверкой поддержки
  RA_TELEMETRY: Телеметрия RetroAchievements
  RA_BADGES: Значки RetroAchievements
  HTTP_GAMES: Игры по HTTP
  HTTP_SERVER: Сервер HTTP
  HTTP_PORT: Порт HTTP
  HTTP_BASE_PATH: Базовый путь HTTP
  HTTP_TEST: Проверить сервер HTTP
  HTTP_TEST_OK: Сервер в порядке -- игры в списке
  HTTP_TEST_EMPTY: Каталог пуст -- это допустимо, но ничего не доказывает про диапазоны байтов
  HTTP_TEST_NO_ISO: В каталоге нет поддерживаемого образа для проверки диапазона байтов
  HTTP_ERR_CONNECT: Сервер HTTP недоступен
  HTTP_ERR_CATALOG: games.csv отсутствует, не читается или слишком большой
  HTTP_ERR_RANGE: Сервер вернул не ровно те байты, что были запрошены
  HTTP_LAUNCH_UNAVAILABLE: Запуск по HTTP пока не реализован -- каталог можно только просматривать
  HTTP_ERR_COMPRESSED: Сжатые образы (.zso) по HTTP пока не поддерживаются
  HTTP_NO_VMC: Виртуальные карты памяти по HTTP недоступны -- используйте настоящую карту
  HTTP_TAB_HINT: HTTP читает games.csv с вашего сервера. Задайте адрес, порт и базовый путь в настройках сети, затем нажмите «Проверить».
  RA_DISC_CHECK: 'RA: проверить поддержку диска'
  RA_DISC_LAUNCH: 'RA: запустить диск'
  RA_DISC_CHECKING: Проверка диска для RetroAchievements
  RA_DISC_HASH_FAILED: Не удалось вычислить хэш диска -- см. RA/hashes.txt в папке настроек
  RA_DISC_HOME_ERROR: Папку настроек нельзя использовать для списков отслеживания дисков
  RA_DISC_ENABLE: Сначала включите телеметрию RetroAchievements в настройках сети
  RA_DISC_CHECK_FIRST: 'Для этого диска нет списка отслеживания -- сначала используйте «RA: проверить поддержку диска»'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d: HDD найден, но его таблица разделов APA не читается. Не форматируйте его -- ваши игры, возможно, ещё можно спасти.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: накопитель не смонтирован, потому что у него секторы не по 512 байт (например, диск с секторами 4K). OPL читает только секторы по 512 байт.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Эта игра занимает собственный раздел APA, а OPL никогда не меняет таблицу разделов. Переименуйте её на ПК.
  POPS_SETTINGS_UNREADABLE: Не удалось прочитать настройки POPSTARTER -- карта памяти занята или не читается. Попробуйте снова после окончания загрузки.
  GLOBAL_PS_EMULATION_SETTINGS: Общие настройки эмуляции PS
  RA_NO_LINK_UNTRACKED: Сеть недоступна -- на этот раз запуск без RetroAchievements.
  IGR_USB_DRIVERS_PROMPT: Путь IGR указывает на USB, но в %s нет USBD.IRX и USBHDFSD.IRX, которые нужны консоли, чтобы видеть USB после In-Game Reset. Без них IGR вернётся в браузер PS2. Скопировать туда драйверы RiptOPL сейчас? FMCB, OpenTuna и другие эксплойты тоже загружают эти файлы и могут вести себя с ними иначе. Существующие файлы никогда не заменяются. Только USB с FAT32.
  IGR_USB_DRIVERS_FAILED: Не удалось скопировать драйверы USB в %s (карта заполнена или защищена от записи). IGR вернётся в браузер PS2.
  OFFICIAL_CFG_NOTIFICATION: Официальные настройки OPL загружены из %s
  CFM_VMODE_HOLD_KEEP: Удерживайте, чтобы оставить
  BDM_PS2_FOLDERS_UNREADABLE: Не удалось открыть папку CD или DVD в %s (ошибка %d), поэтому на этом устройстве нет игр PS2 в списке. Нажмите SELECT на его странице, чтобы попробовать снова.
  NEUTRINO_BD_NO_DEVICE_NUMBER: Файловая система Neutrino задана как bd, но этот накопитель не сообщил номер устройства, поэтому Neutrino не может на него указать. Задайте для этой игры файловую систему Neutrino Auto или exfat.
  CFM_VMODE_REVERT_IN: Возврат через %d с
  EMBER_DITHER: Дизеринг Ember
  HINT_EMBER_DITHER: Дизеринг Ember (вкл. или выкл.), записывается в EMBER/settings.txt накопителя запуска. Значение для отдельной игры важнее.
  EMBER_SHADING: Цветность Ember
  HINT_EMBER_SHADING: 'Глубина цвета Ember: 15 бит или 24 бита (экспериментально). Записывается в EMBER/settings.txt накопителя запуска. Значение для отдельной игры важнее.'
  EMBER_CONTROLLER: Контроллер Ember
  HINT_EMBER_CONTROLLER: 'Режим контроллера Ember: Авто, Аналог или D2A. Обычно лучше задавать для каждой игры (Треугольник > Настройки игры Ember), это важнее.'
  EMBER_480P_CONFIRM: Ember в 480p не показывает картинку через композит. Использовать 480p?
  EMBER_SHADING_24: 24 бита (экспериментально)
  EMBER_GAME_SETTINGS: Настройки игры Ember
  HINT_EMBER_GAME_SETTING: Только эта игра. Нажмите OK, чтобы записать EMBER/games/<имя>/settings.txt перед запуском. Нетронутое «По умолчанию» оставляет значение из файла; возврат значения к «По умолчанию» убирает его переопределение.
  EMBER_TIMING: Тайминг Ember
  HINT_EMBER_TIMING: 'Видеотайминг Ember: Авто следует региону диска, NTSC включает 60 Гц, PAL включает 50 Гц. Записывается в EMBER/settings.txt накопителя запуска.'
  EMBER_GLOBAL_WARNING: Эти настройки Ember действуют для всех игр PS1, и некоторые игры с ними падают. Чтобы изменить одну игру, используйте Треугольник > Настройки игры Ember для этой игры.
  RIPPS2_RANDOM: Случайно
  RIPPS2_ALL: Все
  RIPPS2_RANDOM_GAME: Случайная игра
  HINT_RIPPS2_RANDOM_GAME: L2 и R2 вместе переходят к случайной игре. «При запуске» также открывает каждый список на случайной игре.
  RIPPS2_ALL_GAMES: Все игры
  RIPPS2_SET_METADATA: Задать метаданные
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 'Запускает RIPPS2 при включении через ваш загрузчик: PS2BBL и FMCB запускают его сразу, OSDMenu ставит его первым в своём меню, а EXIT из игры возвращается тем же путём. Выкл. возвращает то, что было раньше. Ещё нет ни одного? «Загрузчик» устанавливает BIBLE.'
  HINT_COLORS_TEXT: Цвет текста списка игр. У тем свой цвет; этот меняет его для встроенных тем.
  HINT_COLORS_SELECTED: Цвет выбранной игры и выбранной строки на страницах настроек.
  HINT_COLORS_DIALOG: Цвет страниц настроек и окон сообщений.
  HINT_COLORS_TITLE: Цвет названия игры на её странице сведений.
  HINT_COLORS_BACKGROUND: Цвет за всем остальным, когда не рисуются изображения и башни.
  HINT_COLORS_PLASMA: Цвет, к которому смешивается старый плазменный фон OPL (тема <OPL>).
  HINT_COLORS_RESET: Возвращает шесть цветов выше к цветам темы.
  HINT_COVERFLOW_COUNT: Сколько обложек RIPFLOW показывает по сторонам от выбранной.
  HINT_COVERFLOW_SCALE: Насколько крупнее RIPFLOW рисует выбранную обложку по сравнению с остальными.
  HINT_COVERFLOW_ANIM: Как быстро скользят обложки, когда вы двигаетесь по потоку.
  HINT_NARGS_QB: 'Quick Boot: пропускает стартовый экран Neutrino. Если включено здесь, отправляется для каждой игры; если выключено, RIPPS2 всё равно отправляет его сам для игр с USB, iLink и по сети, где он нужен.'
  HINT_NARGS_DBC: 'Отладочные цвета: Neutrino заливает экран цветом на каждом шаге загрузки, чтобы по фото было видно, где игра остановилась.'
  HINT_NARGS_LOGO: Показывает логотип PS2 перед игрой (второй перезапуск IOP, нужный некоторым накопителям iLink). Если выключено здесь, RIPPS2 следует пункту «Запуск игр > Логотип PS2» и никогда не отправляет его для игр MMCE и по сети.
  HINT_NARGS_CWD: 'Папка, которую игра считает своей. Пусто: по умолчанию Neutrino.'
  HINT_NARGS_CFG: 'Ваш собственный файл настроек Neutrino (-cfg). Пусто: файл Neutrino.'
  HINT_NARGS_ELF: 'Запускает этот ELF вместо загрузочного файла, указанного диском. Пусто: файл игры.'
  HINT_NARGS_ATA0: Образ HDD, который Neutrino монтирует как внутренний HDD консоли, для игр, использующих HDD (-ata0).
  HINT_NARGS_ATA0ID: Файл идентификатора для этого образа HDD (-ata0id).
  HINT_NARGS_ATA1: Второй образ HDD (-ata1).
  RIPPS2_LAST_USED: Последний
  RIPPS2_PAGE_BUTTONS: Кнопки страниц
  HINT_RIPPS2_PAGE_BUTTONS: 'Какие шифты листают страницы списка игр. L2 / R2: они листают страницы, а L1 / R1 меняют категорию. L1 / R1: они листают страницы, а L2 / R2 меняют категорию. Тема: решает тема; без неё L2 ведёт в начало, а R2 в конец. L2 + R2 вместе всегда выбирают случайную игру.'
  RIPPS2_IGR_MENU: Игровое меню
  HINT_RIPPS2_IGR_MENU: 'Вкл.: L1+L2+R1+R2+SELECT+START ставит игру на паузу: продолжить, выйти, сделать снимок экрана, посмотреть достижения или выключить. Выкл.: комбинация сразу выходит из игры, как раньше.'
  RIPPS2_BOOT_LOADER: Загрузчик
  HINT_RIPPS2_BOOT_LOADER: Показывает, что каждая карта памяти запускает при включении, и устанавливает BIBLE (PS2BBL, настроенный для RIPPS2). Старые загрузочные файлы карты сохраняются.
  RIPPS2_MANAGE: Управление
  RIPPS2_ACHIEVEMENTS: Достижения
  RIPPS2_NBD_SERVER: Сервер NBD
  HINT_RIPPS2_NBD_SERVER: Открывает доступ к HDD для ПК по сети. Пока он работает, на экране остаётся окно состояния.
  RIPPS2_START: Запустить
  RIPPS2_COVER_ART: Обложки
  HINT_RIPPS2_COVER_ART: Загружает обложку для каждой игры PS2 без обложки в ваших запущенных списках, в папку ART её накопителя, из ps2-covers от xlenore на GitHub. Нужны сетевой кабель и интернет.
  RIPPS2_DOWNLOAD: Загрузить
  RIPPS2_GLYPHS: Значки крестовины
  HINT_RIPPS2_GLYPHS: 'Значки крестовины рядом с названиями накопителей и фигур. «Появление» показывает их при переключении; «Исчезновение» показывает при открытии страницы. Тема: решает тема.'
  RIPPS2_COLOR_THEME: Цветовая тема
  HINT_RIPPS2_COLOR_THEME: 'Один цвет для башен, сфер, стекла, CD-плеера и файлового браузера на всех трёх вкладках. Тема: решает тема (иначе синий RIPPS2).'
  RIPPS2_HINTS: Подсказки кнопок
  HINT_RIPPS2_HINTS: 'Подсказки кнопок внизу экрана. «Скрывать в покое» прячет их, пока вы не нажмёте кнопку. Тема: решает тема.'
  RIPPS2_CATEGORY_BAR: Категории/Боковая панель
  HINT_RIPPS2_CATEGORY_BAR: 'ЗАПУСК ДИСКА, ХРАНИЛИЩЕ и ФАЙЛЫ ПАМЯТИ: названия вверху или боковая панель. Скрывать в покое гасит названия или убирает боковую панель, пока вы не нажмёте кнопку; она сразу возвращается. Тема: решает тема.'
  RIPPS2_SOURCE_NAME: Название источника
  RIPPS2_STATUS: Состояние
  RIPPS2_SOURCE: Источник
  HINT_RIPPS2_SOURCE_NAME: 'Название источника над играми (ВСЕ ИГРЫ, ИГРЫ HDD и так далее). «Скрывать в покое» гасит его вместе с панелью категорий; «Всплытие» показывает его крупно посреди страницы, как L3 называет список, в первом списке после запуска и при каждой смене источника, затем оно гаснет. «Всплытие и название» делает и то, и другое. Темы могут сделать «Всплытие» своим «Показано». Тема: решает тема.'
  RIPPS2_RECENTS: Недавние игры
  HINT_RIPPS2_RECENTS: 'Недавние игры, страница на боковой панели с вашими последними запущенными играми, новые первыми: сколько она хранит, от 1 до 99 (Треугольник вводит число). Игра, чей накопитель стоит на Вручную, запускает его, когда вы её выбираете. 0 отключает страницу.'
  RIPPS2_CATEGORY_ORDER: Порядок категорий
  HINT_RIPPS2_CATEGORY_ORDER: 'Меняет местами Запуск диска и Файлы памяти: Файлы памяти первыми, Запуск диска последним, и в названиях панели, и в значках боковой панели. Сделано для RIPFLOW (Интерфейс > Тема). Тема: решает тема.'
  RIPPS2_MUSIC: Музыка
  HINT_RIPPS2_MUSIC: Играет файлы bgm из папки AUDIO рядом с RIPPS2 и из папки AUDIO OPL на каждом запущенном накопителе (Ogg без тегов или 16-битный WAV); файл с именем Menu играет первым. Собственная музыка темы играет вместо них.
  RIPPS2_BIOS_SOUNDS: Звуки BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Записывает звуки меню этой консоли из её BIOS в папку AUDIO как звуки RIPPS2 (меньше 1 МБ). У музыки меню своё извлечение: «Музыка BIOS».'
  RIPPS2_RIP: Извлечь
  RIPPS2_HINTS_GLYPHS: Подсказки и значки
  HINT_RIPPS2_HINTS_GLYPHS: Как выглядят подсказки кнопок и значки. Каждая строка начинается с «Тема», выбора темы; любой другой выбор ваш и важнее любой темы.
  RIPPS2_HINT_LAYOUT: Раскладка подсказок
  HINT_RIPPS2_STARSIDE: 'Где стоит звезда избранной игры в списке. Слева: свой столбец в начале каждой строки. Справа: после названия. Скрыто (по умолчанию): ни звезды, ни столбца, названия целиком. Тема: как скажет тема. R3 добавляет игру в избранное в любом случае; удерживайте R3 4 секунды на списке, чтобы скрыть звёзды или вернуть их (это также добавит в избранное игру под курсором).'
  HINT_RIPPS2_HINT_LAYOUT: 'Строка: подсказки в одну строку. Столбец: по одной подсказке в строке, списком сбоку, начиная там, где тема ставит свои подсказки.'
  RIPPS2_HINT_LABELS: Подписи подсказок
  HINT_RIPPS2_HINT_LABELS: «Только значок» рисует одни кнопки, для значков со своими словами. «Значки» объединяет значок и название каждой подсказки на одном значке.
  RIPPS2_HINT_MENU: Подсказка «Меню» (START)
  RIPPS2_HINT_REFRESH: Подсказка «Обновить» (SELECT)
  RIPPS2_HINT_STAR: Подсказка «Избранное» (R3)
  RIPPS2_HINT_VIEW: Подсказка «Вид» (L3)
  HINT_RIPPS2_HINT_SHOW: Показывает или скрывает эту подсказку. Её кнопка работает в любом случае.
  RIPPS2_GLYPH_SET: Набор значков
  HINT_RIPPS2_GLYPH_SET: 'Значки кнопок на всех страницах: темы, RIPPS2, «Стандарт» (тёмные кнопки, цветные символы) или «Белые» (сплошь белые).'
  RIPPS2_HINT_ORDER: Порядок подсказок
  HINT_RIPPS2_HINT_ORDER: Расставляет подсказки. «Тема» сохраняет порядок темы; «Ваш порядок» задаётся здесь.
  RIPPS2_HINT_ORDER_FOLLOW: Порядок
  RIPPS2_GRID_LAYOUT: Раскладка сетки
  HINT_RIPPS2_GRID_LAYOUT: Сколько обложек помещается на странице сетки, с отступами RIPPS2. «Тема» сохраняет раскладку темы.
  RIPPS2_LAUNCH_DISC: Диск при запуске
  HINT_RIPPS2_LAUNCH_DISC: Диск игры появляется при запуске. «Всплытие» опускается и гаснет; «Вращение» крутится всё быстрее, пока игра не запустится; «Приближение» опускается, затем увеличивается, чтобы его было хорошо видно, и остаётся.
  RIPPS2_TRANSITION: Переход страниц
  HINT_RIPPS2_TRANSITION: 'Как появляется новая страница при переходе в другую категорию: из цвета фона темы или из вспышки. «Тема» сохраняет выбор темы.'
  RIPPS2_CATEGORY_LAYOUT: Расположение категорий
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Где расположены три категории: их названия вверху или значки вдоль боковой панели, у каждого ящик со своими страницами (Влево на списке ведёт туда), или Меню: никакой панели, категории в меню START, как в теме для OPL. Тема оставляет вариант темы.'
  RIPPS2_CACHE: Кэш
  HINT_RIPPS2_CACHE: 'Как хранится список игр каждого источника, чтобы его страница открывалась сразу: Fast Cache, список внутреннего HDD и Автообновление.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'Каждый источник хранит свой последний список игр (RIPPS2.LST рядом с его папками CD и DVD) и показывает его, как только источник ответит. Trust Cache решает, перечитывается ли источник потом. Выкл: каждый список сначала читается из источника, как раньше.'
  HINT_RIPPS2_VIGNETTE: Затемняет края всех обложек, кроме выбранной, чтобы она выделялась. «Слабая» вдвое меньше «Полной».
  RIPPS2_GRID_WIDE: Раскладка сетки для широкого экрана
  HINT_RIPPS2_GRID_WIDE: Страница сетки только при картинке 16:9 (Широкий экран, 720p, 1080i), где обложки уже и их помещается больше. «Тема» использует раскладку темы; «Как» следует раскладке сетки.
  RIPPS2_BGBLUR: Размытие фона
  HINT_RIPPS2_BGBLUR: Насколько матовое стекло размывает фоновое изображение игры. «Тема» использует значение темы («Слабая» в RIPGRID и Adapt).
  HINT_RIPPS2_HINT_SLOT: Подсказка на этом месте. Подсказка, стоявшая здесь, переходит на прежнее место выбранной.
  PS1_SAVE_GUIDANCE: Сохранения PS1 зависят от Ember или POPSTARTER; настройки VMC для PS2 к ним не относятся.
  NEUTRINO_SHOW_ARGS: Показывать аргументы запуска
  HINT_NEUTRINO_SHOW_ARGS: Перед каждым запуском через Neutrino показывает все аргументы, которые он получит, и спрашивает, продолжать ли. «Назад» возвращает в меню без запуска.
  NEUTRINO_ARGS_CONFIRM: Neutrino запустится с этими аргументами. Запустить?
  HINT_NARGS_EXTRA: Другие флаги Neutrino через пробел, отправляемые после всего, что выше. RIPPS2 всегда добавляет -bsd и -dvd для накопителя и ISO игры, -mc0 и -mc1 для её VMC, -gsm для её видеорежима и собственные режимы совместимости игры. Флаг, у которого есть своя строка выше (например, -logo), при сохранении переносится в эту строку и всё равно отправляется.
  HINT_RIPPS2_THEME: Внешний вид всех страниц. В списке игр удерживайте SELECT 4,2 секунды, чтобы переключиться на следующую тему; короткое нажатие SELECT по-прежнему обновляет список.
  GAME_TYPE_LABELS: Показывать метки [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Список читов не удалось сохранить в папку Neutrino, поэтому Neutrino не может его использовать. Запустить без читов?
  AUTO_CREATE_VMC: Создавать VMC при первом запуске
  HINT_AUTO_CREATE_VMC: "Запуск игры PS2 без VMC в слоте 0 создаёт карту на 8 МБ на устройстве игры с именем, которое предлагает экран VMC (общую для всех дисков игры), и назначает её. Под Neutrino не на APA HDD (HDD exFAT работает)."
  AUTO_VMC_CREATING: Создание VMC для этой игры...
  AUTO_VMC_FAILED: Не удалось создать VMC для этой игры. Игра запустится без неё.
  RIPPS2_BIOS_MUSIC: Музыка BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'Записывает музыку меню этой консоли (фоновую пьесу её браузера, около 15 МБ в WAV) в выбранную вами папку AUDIO: рядом с RIPPS2 или в папку OPL на запущенном накопителе. Слишком велика для карты памяти. Сначала показывается её размер.'
  SAVE_ICONS: 3D-значки сохранений
  HINT_SAVE_ICONS: Показывает вращающийся значок сохранения выбранной игры там, где у темы есть для него место. Сначала читает VMC игры, затем карты памяти.
  NETBOOT_RESTART_NOW: Сетевой протокол сменится после перезапуска. Сохранить настройки и перезапустить OPL сейчас?
  HINT_NET_PROTOCOL: 'Какой сетевой сервис использует RiptOPL: общий ресурс SMB, UDPFS, UDPBD или HTTP. Уход с уже запущенного требует перезапуска.'
  HINT_UDPFS_ACCESS: Только UDPFS. «Файлы» читает отдельные ISO из папки игр сервера; IMG читает образ диска как накопитель. SMB и HTTP всегда используют «Файлы», UDPBD всегда IMG.
