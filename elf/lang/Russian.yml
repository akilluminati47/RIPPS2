  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Прежняя хранится в RIPPS2/MBR-BACKUP.KELF на HDD: ЗАГРУЗЧИК > УПРАВЛЕНИЕ > ВОССТАНОВИТЬ возвращает её.'
