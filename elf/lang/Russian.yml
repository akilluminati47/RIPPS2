  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 не смог записать загрузочную программу обратно. Попробуйте снова; сохранённая копия цела.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 был занят чтением накопителя и не смог перезапустить процессор ввода-вывода. Ничего не изменено: попробуйте через минуту.'
