  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "Не удалось записать файл настроек BIBLE (%s). Проверьте, что карта памяти вставлена и на ней есть место, и попробуйте снова."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "Файл настроек BIBLE (%s) не найден. BIBLE: УСТАНОВИТЬ, ОБНОВИТЬ ИЛИ ВОССТАНОВИТЬ запишет новый."
  "Boot sound On (fast): %s, handed over by BIBLE": "Звук запуска Вкл. (быстро): %s, передан из BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: форк PS2BBL Extended от akilluminati47, каждая сборка подписана akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "его образ IOPRP привязывает BIBLE к вашей карте (GPL-3): шифрование делает консоль, без ключей"
  "KELFBinder by El Isra": "KELFBinder от El Isra"
  "source: github.com/akilluminati47/BIBLE": "исходники: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "СЛОТ 0: %s\nСЛОТ 1: %s\n%s\nRIPPS2: установка BIBLE. BIBLE, загрузчик akilluminati47 на основе PS2BBL от El Isra, который RIPPS2 ставит на обычную карту памяти PS2 на 8 МБ или на внутренний жёсткий диск: запуск за 0 мс при включении (PS2BBL Extended не позволяет 0), сначала RIPPS2 оттуда, где он лежит (он никогда не копируется), а кнопка, зажатая при включении, по-прежнему ведёт в браузер (TRIANGLE), к диску (START) и к прежнему (CIRCLE). Установить, починить или вернуть то, что он заменил?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: установка BIBLE\nКарта в слоте %d это карта SD2PSX или MMCE. Её BOOT-карта может хранить BIBLE вместо своего PS2BBL (тот сначала целиком убирается в сторону), если консоль привяжет к ней BIBLE. Если привязка будет отклонена, на карте ничего не изменится, и карта может перестать отвечать, пока консоль не выключат и не включат. START привязывает к ней BIBLE."
  "BIND BIBLE": "ПРИВЯЗАТЬ BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT рядом с RIPPS2 содержит ответ карты.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Для обычной карты памяти PS2 на 8 МБ (карта MagicGate или BOOT-карта SD2PSX либо MMCE): той, что в слоте %d. При включении PS2BBL читает конфигурацию слота 1 раньше конфигурации слота 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Консоль не привязала BIBLE к карте памяти в слоте %d (не прошёл шаг MagicGate). На карте ничего не изменено. Неоригинальная или несовместимая с MagicGate карта не может хранить системное обновление."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Карта SD2PSX или MMCE может перестать отвечать после отклонённой привязки: если сейчас пропала карта памяти или накопитель MMCE, выключи и включи консоль."
  "RIP THIS CONSOLE'S AUDIO": "ИЗВЛЕЧЬ АУДИО ЭТОЙ КОНСОЛИ"
  "sounds or music, from its BIOS": "звуки или музыка, из её BIOS"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Открывает Настройки звука на Звуках BIOS и Музыке BIOS: извлеките звуки этой консоли или музыку её меню в AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Звук запуска Вкл. (быстро): %s на карте памяти, пока растут колонны"
  "Boot sound On: %s on the memory card, as the pillars rise": "Звук запуска Вкл.: %s на карте памяти, пока растут колонны"
  "Boot sound On: %s, once its drive is up": "Звук запуска Вкл.: %s, когда его диск готов"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Эта игра запускается через Neutrino, а RIPPS2 не нашёл ни одного: ни по пути из Настроек, ни на диске игры, ни на картах памяти, ни на каком-либо запущенном диске. Положите Neutrino от rickgaiser (github.com/rickgaiser/neutrino) в папку neutrino на диске игры или карте памяти либо укажите его в Запуск игр > Neutrino."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Где ваш Neutrino, его видеорежим и аргументы, которые получает каждый запуск через Neutrino. Скачайте Neutrino с github.com/rickgaiser/neutrino и положите его в папку neutrino на диске или карте памяти."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Этот Neutrino старше 1.3, который не может запускать игры с APA HDD. Укажите в Запуск игр > Neutrino версию Neutrino 1.3 или новее."
  "with rickgaiser's Neutrino as its second game core,": "с Neutrino от rickgaiser как вторым игровым ядром,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "второе игровое ядро, запускается с вашего диска или карты памяти (AFL-3.0)"
