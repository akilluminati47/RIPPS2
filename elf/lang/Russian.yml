  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Запустите клиент xeRAbora на ПК в той же сети, войдя в свой аккаунт RetroAchievements. Затем для игры на USB, MMCE, SMB или HDD: откройте её меню (ТРЕУГОЛЬНИК) и ПРОВЕРЬТЕ ПОДДЕРЖКУ ИГРЫ. Отслеживаемая игра получает значок RA; при включённой ТЕЛЕМЕТРИИ запустите её, и достижения будут всплывать поверх игры. Для диска в лотке используйте ПРОВЕРИТЬ ДИСК, затем ИГРАТЬ С ДИСКА С ДОСТИЖЕНИЯМИ. Игры, запущенные через Neutrino, POPSTARTER или Ember, пока не отслеживаются.'
