  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : На этом HDD нет раздела __sysconf, поэтому конфигурация BIBLE должна лежать на карте памяти (PS2BBL сначала читает конфигурацию карты), а ни в одном слоте карты нет. Вставьте карту и попробуйте снова.
