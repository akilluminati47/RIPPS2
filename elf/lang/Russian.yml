  XERA_SET_CLOCK: Игры ещё нет в вашей библиотеке RetroAchievements. Установите часы консоли в системных настройках, чтобы увидеть полный список, или сыграйте в неё один раз с достижениями.
  CFG_TITLES: Показывать названия из CFG в списках игр
  HINT_CFG_TITLES: Показывает название из CFG каждой игры вместо имени файла и сортирует по нему. При обновлении списка читает каждый CFG, поэтому списки грузятся медленнее. Только отображение.
  AUTO_VMC_INVALID: Файл VMC этой игры есть, но это не корректная карта памяти, поэтому он не использован и не заменён. Игра запустится без него; проверьте его в меню VMC.
  AUTO_VMC_STILL_RUNNING: VMC этой игры ещё создаётся. Запустите игру снова через минуту.
  NEUTRINO_DVR_QUICKBOOT: Запуску DVR нужен переход в режим PSX. Уберите -qb из общих и игровых аргументов Neutrino.
  NEUTRINO_DVR_FILE_MISSING: 'Установка DVR Neutrino неполная. Нет нужного файла:'
  PARENLOCK_GAME: Родительский контроль
  PARENLOCK_GAME_HINT: Требовать пароль родительского контроля для запуска этой игры.
  PARENLOCK_GAME_NO_PASSWORD: Задайте пароль родительского контроля, иначе эта игра не будет заблокирована.
  HINT_ENABLE_PCCF: CompactFlash в PC CARD ранних японских PS2. Только родные игры PS2; CF нужен монопольный доступ к PC CARD. Перезапустите, чтобы освободить её.
  PCCF_GAMES: Игры PC CARD CF
  PCCF_UNAVAILABLE: 'CF недоступна: нужна ранняя японская PS2 с PC CARD, совместимая карта и ни одного активного драйвера DEV9/HDD/сети.'
  PCCF_UNSUPPORTED_GAME: CF пока поддерживает только родные игры PS2. VMC на CF, загрузка PS1 и сетевые достижения недоступны.
  HINT_ENABLE_DVR: Экспериментальный поиск ISO DESR DVR. Нужен включённый источник HDD; для запуска игр нужен внешний Neutrino с поддержкой DVR.
  HINT_RIPPS2_IGR_PAGE: Игровое меню, RIPSHOT и проявка кадров.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Снимки экрана из игрового меню, в ART для ваших тем или в MEDIA.
  RIPPS2_DEVELOP_SHOTS: Проявка кадров
  HINT_RIPPS2_DEVELOP_SHOTS: Как кадры, ждущие на плёнке каждой игры, становятся PNG.
  RIPPS2_SETTINGS_HOME: Сохранять настройки на
  HINT_RIPPS2_SETTINGS_HOME: 'Где RIPPS2 хранит настройки: в собственном сохранении на карте памяти, в папке RIPPS2 на накопителе (внутреннем HDD, USB, MX4SIO, iLink или MMCE) или в указанной вами папке.'
  RIPPS2_LAUNCHERS: Загрузчики
  RIPPS2_LOOK_NOW: Искать сейчас
  HINT_RIPPS2_LOOK_NOW: RIPPS2 ищет на запущенных накопителях POPSTARTER, файлы POPS, Ember, BIOS для Ember и Neutrino и запоминает, где лежит каждый. Каждый запуск берёт их оттуда.
  RIPPS2_HIDE_GAME: Скрыть игру
  RIPPS2_HIDDEN_GAMES: Скрытые игры
  HINT_RIPPS2_HIDDEN_GAMES: Игры, скрытые через «Скрыть игру», на запущенных накопителях. Покажите одну снова или удалите её. У каждого накопителя свой список.
  HINT_RIPPS2_BDM_DEVICES: 'Накопители, с которых BDM читает игры: USB, MX4SIO, PC Card CF, DVR-накопитель DESR и iLink. Встроенный HDD следует запуску HDD.'
  HINT_RIPPS2_SCREEN: 'Картинка меню: видеорежим, широкий экран, её место на телевизоре (H-POS, V-POS) и overscan.'
  HINT_RIPPS2_LAYOUT: Где стоят категории и как входит страница, затем обложки RIPFLOW и сетка RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Толщина текста, цветовая тема, смена цветов и каждый цвет.
  HINT_RIPPS2_TEXT_WEIGHT: 'Насколько жирный собственный текст RIPPS2: подсказки настроек, СОСТОЯНИЕ и О программе. Обычный как раньше; Жирный лучше читается на мягкой картинке. Собственные шрифты темы сохраняют насыщенность, которую им задаёт тема.'
  HINT_RIPPS2_HDD_START: 'Внутренний HDD, APA или exFAT: RIPPS2 читает его, каким бы он ни был, и показывает один раз, как HDD-Игры. Авто (быстрее всего с установленным диском) запускает его при загрузке; Выкл его не трогает.'
  HINT_RIPPS2_THEME_COLOR: Собственный цвет темы. Выберите Свой как цветовую тему, чтобы выбрать его самим, как цвета текста.
  HINT_RIPPS2_SWEEP: Пять цветов, через которые тема переходит медленно и плавно. Радуга, смена из каждой цветовой темы или ваша. Выкл. держит тему неподвижной.
  HINT_RIPPS2_SWEEP_COLORS: Пять цветов смены и её скорость. Измените одну из RIPPS2, и она сохранится как ваша, под данным вами именем.
  HINT_RIPPS2_SWEEP_NAME: Как называется ваша смена в списке Смена цветов.
  HINT_RIPPS2_SWEEP_COLOR: Один из пяти цветов, через которые смена проходит по порядку.
  HINT_RIPPS2_SWEEP_SPEED: 'Сколько длится каждый цвет, пока не войдёт следующий. Даже Живо остаётся плавным: цвета никогда не мигают.'
  RIPPS2_HIDE_COMPRESS: Скрыть игру и сжатие
  HINT_RIPPS2_SELECT_HOLD: 'SELECT удерживается 4.2 с на списке игр. Список: темы на панели, выберите одну. По кругу: следующая тема. Выкл.: ничего (нажатие по-прежнему обновляет).'
  RIPPS2_RECENT_GAMES: Недавние игры
  RIPPS2_SET_METADATA_RENAME: Задать метаданные (переименовать)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Сначала контроллер (экспериментально)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX читает по шине, общей с контроллером, и пока идёт чтение, контроллер не слышно: нажатия запаздывают или теряются, пока грузятся обложки. Вкл: обложки приходят маленькими частями, а между ними опрашивается контроллер, чуть медленнее. Выкл: так быстро, как может карта. Если источники карты стоят на Авто, её список загружается один раз, при запуске.'
  HINT_RIPPS2_TRUST_CACHE: 'Список, показанный из кэша, остаётся как есть, готовым к запуску, пока вы не нажмёте SELECT или RIPPS2 сам не изменит этот источник. Выкл: каждый источник перечитывается в фоне после показа кэша, и на карте MMCE или MX4SIO, делящих шину контроллера, это ощутимая пауза.'
  RIPPS2_STATUS_OPEN: Загрузка и накопители
  HINT_RIPPS2_STATUS_OPEN: 'Открывает СОСТОЯНИЕ: откуда запуск читает настройки и списки игр, какое место быстрее всего, куда ведёт EXIT игры, и каждый накопитель. Его НАСТРОЙКИ КЭША возвращают сюда.'
  RIPPS2_BADGE_SET: Набор значков
  HINT_RIPPS2_BADGE_SET: 'Значки на странице сведений игры (рейтинг, игроки, ESRB, видеорежим, развёртка, формат). RIPPS2: свой набор, одинаковый во всех темах. Тема: собственные картинки темы или значки RIPPS2, если тема их просит.'
  RIPPS2_HINT_FADE: Плавное появление подсказок и значков
  HINT_RIPPS2_HINT_FADE: 'Подсказка кнопки или значок, который меняется, плавно проявляется, как обложки, в момент смены; неизменные не трогаются, на каждой странице и в каждом сообщении. Выкл: они просто появляются. Тема: решает тема (вкл, если в ней нет hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Стиль боковой панели
  HINT_RIPPS2_SIDEBAR_STYLE: 'Классический (раздельный): значки в тёмной полосе боковой панели с цветной полоской рядом. XL (цельный): одна широкая полоса со значками посередине. Тема: решает тема.'
  HINT_EXITPATH: 'Куда ведёт EXIT в меню в игре. Лучше оставить пустым: EXIT ведёт в браузер, который запускает ваш загрузчик (FreeMcBoot, PS2BBL, OSDMenu или BIBLE), если он установлен, и снова RIPPS2 при включённом BOOT LOCK, как при включении; без него, браузер PS2. ELF, указанный здесь, используется, только если сброс может его загрузить (с карты памяти или USB-накопителя FAT32) и это не сам RIPPS2; всё остальное ведёт в браузер.'
  HINT_BDM_START: 'USB, iLink, MX4SIO и HDD exFAT. Авто запускает их при загрузке: быстрее всего для подключённых накопителей, их игры в Всех играх с самого начала. Вручную запускает их, когда вы открываете их страницу.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino не может использовать VMC на APA HDD (exFAT, USB и MX4SIO могут): эта игра запустится с настоящей картой в этом слоте.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Запуск читает только накопитель RIPPS2: настройки и звуки рядом с RIPPS2.ELF (RIPPS2.FB там говорит, где) и каждый список из его кэша. Остальные накопители ждут: SELECT на странице запускает её накопители и подгружает их картинки (с автообновлением они запускаются при старте). Включение копирует твои звуки, а если есть место, и музыку, в AUDIO рядом с RIPPS2.'
  RIPPS2_ART_PACK: Пакет ART
  RIPPS2_ART_PACK_BUILD: Собрать или удалить
  HINT_RIPPS2_ART_PACK: Упаковывает папку ART каждого запущенного накопителя в один art.tar на выбранном накопителе (самый быстрый предлагается первым). Обложки затем загружаются из одного файла с одним индексом, без поиска для каждой игры, поэтому меню и музыка идут плавно. Папки ART остаются как есть.
  RIPPS2_LIST_CFG_TEXT: Название и описание в списке
  HINT_RIPPS2_LIST_CFG_TEXT: 'Название и описание игры из её CFG рядом со списком. Тема: как показывает тема (собственная тема RIPPS2 их скрывает). Страница сведений сохраняет их всегда.'
  RIPPS2_PS1_PREFER: Дубликаты PS1
  HINT_RIPPS2_PS1_PREFER: 'Игра PS1, которая есть и как VCD для POPSTARTER, и как образ Ember. Оба: две строки. Ember: только строка Ember. POPSTARTER: только VCD. Одно название, без ID диска в начале, это одна игра.'
  RIPPS2_MY_PADS: Мои геймпады
  HINT_RIPPS2_MY_PADS: 'Профили .pad в папке PADS рядом с RIPPS2: по одному текстовому файлу на USB-геймпад, названному по его ID (2563_0575.pad), и каждый проверен. Геймпад с профилем управляет меню и играет в играх (Pad Emulator включён).'
  RIPPS2_PAD_SETUP: Настроить USB-геймпад
  HINT_RIPPS2_PAD_SETUP: Подключите USB-геймпад, которого RIPPS2 не знает, нажмите каждую кнопку, которую он попросит, и RIPPS2 запишет его .pad в PADS. SELECT на геймпаде PS2 пропускает кнопку.
