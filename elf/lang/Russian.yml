  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: запись PS2BBL в загрузочную область HDD'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'УСТАНОВИТЬ BIBLE НА ВНУТРЕННИЙ HDD

    - RIPPS2 копируется в %s.

    - Загрузочная программа HDD, сейчас лежащая в __mbr, считывается и сохраняется в %s/RIPPS2 (ВОССТАНОВИТЬ возвращает её).

    - На её место записывается HDD-сборка PS2BBL, и консоль настраивается на её запуск при включении.

    - Его конфигурация (%s) сначала запускает RIPPS2 с %s%s%s, BOOT LOCK включён.

    Нужна консоль, которая загружается со своего HDD (толстая PS2 с сетевым адаптером). Не выключайте её, пока не появится сообщение о завершении.'
  INTERNAL HDD  (its boot area): ВНУТРЕННИЙ HDD  (его загрузочная область)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'ВЕРНУТЬ СТАРУЮ ЗАГРУЗОЧНУЮ ПРОГРАММУ HDD

    Сохранённая BIBLE (RIPPS2/MBR-BACKUP.KELF на HDD) возвращается в __mbr, на место BIBLE. RIPPS2 и конфигурация PS2BBL остаются на месте.'
  RESTORE: ВОССТАНОВИТЬ
