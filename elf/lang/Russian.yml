  ? This track could not be played. RIPPS2 plays 16-bit PCM .wav files (as RIPDISC and BIOS Music rip them), Ogg Vorbis .ogg files and MP3s.
  : Не удалось воспроизвести эту дорожку. RIPPS2 воспроизводит 16-битные файлы PCM .wav (такие, как извлекают RIPDISC и Музыка BIOS), файлы Ogg Vorbis .ogg и MP3.
  'READ ONLY: THE SD2PSX''S BOOT CARD IS IN USE': 'ТОЛЬКО ЧТЕНИЕ: ЗАГРУЗОЧНАЯ КАРТА SD2PSX ИСПОЛЬЗУЕТСЯ'
  '%d music tracks': 'Музыкальных дорожек: %d'
  1 music track: 1 музыкальная дорожка
  'A game''s EXIT: %s': 'EXIT игры: %s'
  'All Games: %d games kept in %s, listed at boot before any drive answers': 'Все игры: %d игр хранится в %s, показаны при запуске раньше, чем ответит любой накопитель'
  'All Games: no master list yet; %s is written once the games are listed (Fast Cache on)': 'Все игры: главного списка ещё нет; %s запишется, когда игры будут показаны (Fast Cache вкл)'
  CACHE SETTINGS: НАСТРОЙКИ КЭША
  DIAG.TXT, for a bug report: DIAG.TXT, для отчёта об ошибке
  Drives, loading, launchers and homebrew: Накопители, загрузка, загрузчики и homebrew
  ? Fast Cache shows each drive's last game list the moment the drive answers; Trust Cache keeps it until you press SELECT. Both on, with the settings on the memory card RIPPS2 starts from, is the quickest boot.
  : Fast Cache показывает последний список игр каждого накопителя, как только он ответит; Trust Cache держит его, пока вы не нажмёте SELECT. Оба включены, с настройками на карте памяти, с которой запускается RIPPS2, это самый быстрый запуск.
  Fast Cache, Trust Cache: Fast Cache, Trust Cache
  'Game lists: Fast Cache off, so each one is read from its drive at boot': 'Списки игр: Fast Cache выкл, поэтому каждый читается со своего накопителя при запуске'
  'Game lists: each shows at once from its cache and stands until SELECT': 'Списки игр: каждый сразу показывается из кэша и остаётся до SELECT'
  'Game lists: each shows at once from its cache, then is read again': 'Списки игр: каждый сразу показывается из кэша, а затем читается заново'
  LOADING: ЗАГРУЗКА
  'No music yet: Audio settings > BIOS Music rips this console''s menu music.': 'Музыки пока нет: Настройки звука > Музыка BIOS извлекает музыку меню этой консоли.'
  SAVE DIAGNOSTICS: СОХРАНИТЬ ДИАГНОСТИКУ
  Searches the drives for POPSTARTER, the POPS files, Ember, Ember's BIOS and Neutrino, and remembers where each one is.: Ищет на накопителях POPSTARTER, файлы POPS, Ember, BIOS для Ember и Neutrino и запоминает, где что лежит.
  'Settings: %s, on a drive the boot waits for (a memory card is quicker)': 'Настройки: %s, на накопителе, которого ждёт запуск (карта памяти быстрее)'
  'Settings: %s, read first (the quickest place)': 'Настройки: %s, читаются первыми (самое быстрое место)'
  Starts every drive now (USB, the HDD, MMCE, MX4SIO and the network), so each one and its space shows here.: Запускает сейчас каждый накопитель (USB, HDD, MMCE, MX4SIO и сеть), чтобы здесь были видны все они и их место.
  The IP and SMB share POPSTARTER uses for PS1 games over the network.: IP и общий ресурс SMB, которые POPSTARTER использует для игр PS1 по сети.
  The diagnostics are in %s.: Диагностика в %s.
  The diagnostics could not be written to %s.: Не удалось записать диагностику в %s.
  What each memory card starts at power on; install or repair BIBLE, PS2BBL set up to start RIPPS2.: Что запускает каждая карта памяти при включении; установка или исправление BIBLE, PS2BBL, настроенного запускать RIPPS2.
  Where POPSTARTER and Ember are, and how PS1 games start.: Где находятся POPSTARTER и Ember и как запускаются игры PS1.
  ? Writes what RIPPS2 noted about the pads, the drives, MMCE cards and the last launches to DIAG.TXT beside RIPPS2. Send it with a bug report.
  : Записывает в DIAG.TXT рядом с RIPPS2 то, что RIPPS2 отметил о контроллерах, накопителях, картах MMCE и последних запусках. Приложите его к отчёту об ошибке.
  back to Cache: назад к Кэшу
  what boot reads first: что запуск читает первым
  ', the sounds': ', звуки'
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot включён. RIPPS2 запускается со своего накопителя (%s): настройки%s и каждый список из его кэша. Остальные накопители запускаются, когда ты нажимаешь SELECT на их странице или запускаешь одну из их игр.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot включён. Звуки занимают %d КБ, а на карте памяти, с которой работает RIPPS2, свободно %d КБ, поэтому они остаются в %s.
  ' (%d KB free)': ' (свободно %d КБ)'
  ' (%u MB free)': ' (свободно %u МБ)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'РЯДОМ С RIPPS2: %sAUDIO%s, читается первым при запуске'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- Консоль привязывает PS2BBL к этой карте и записывает его как %s/%s.
  
    - Его конфигурация, mc%d:/SYS-CONF/PS2BBL.INI, запускает RIPPS2 там, где он лежит (%s), без ожидания (0 мс, чего PS2BBL Extended не позволяет), BOOT LOCK включён. Сам RIPPS2 не копируется.
  
    Для этого процессор ввода-вывода перезапускается, и всякое чтение накопителей останавливается до конца; музыка и накопители вернутся потом. Не вынимай карту и не выключай консоль, пока она не сообщит, что готово.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Карта SD2PSX или MMCE может защитить себя после отклонённой записи: если сейчас пропала карта памяти или накопитель MMCE, выключи и включи консоль.'
  BOOT LOCK ON: BOOT LOCK ВКЛЮЧЁН
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Готово: карта памяти в слоте %d запускает то, что запускала до BIBLE. BIBLE хранится в mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): КАРТА ПАМЯТИ В СЛОТЕ %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL не может запустить RIPPS2 оттуда, где он сейчас (он достаёт до карт памяти, USB-накопителей и MX4SIO), а RIPPS2 сам себя не копирует. Положи RIPPS2.ELF на карту памяти или USB-накопитель и запускай оттуда, или используй PS2BBL Extended, который читает MMCE и жёсткий диск.
  RESTORE SLOT %d'S OLD BOOT LOADER: ВЕРНУТЬ СТАРЫЙ ЗАГРУЗЧИК В СЛОТЕ %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE установлен на карту памяти в слоте %d (mc%d:/%s/%s), BOOT LOCK включён: при включении он сразу запускает RIPPS2 с %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: установка BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: установка BIBLE
  
    RIPPS2 работает с %s, который PS2BBL не умеет читать (он читает карты памяти, USB и MX4SIO), а RIPPS2 сам себя не копирует. Конфигурация PS2BBL Extended на этой карте (%s) его читает: START включает BOOT LOCK, чтобы при включении она запускала RIPPS2 с %s. Больше на карте ничего не меняется.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: установка BIBLE
  
    RIPPS2 работает с %s, который PS2BBL не умеет читать: он запускает программы с карты памяти, USB-накопителя или MX4SIO, а RIPPS2 сам себя не копирует. Положи RIPPS2.ELF на одно из них (в папку APPS карты памяти или на USB-накопитель), запусти его оттуда и затем снова установи BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: установка BIBLE
  
    Карта памяти в слоте %d: BIBLE (mc%d:/%s) откладывается в сторону, а то, что он заменил (mc%d:/%s), возвращается на своё место. Ничего не удаляется. Конфигурация PS2BBL остаётся как есть (BOOT LOCK может выключить блокировку).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: установка BIBLE (привязка PS2BBL к карте памяти)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: установка BIBLE (возврат прежнего)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: установка BIBLE (перезапуск процессора ввода-вывода)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: установка BIBLE (запись на карту памяти)'
  SET UP BIBLE: УСТАНОВИТЬ BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: На карте памяти в слоте %d свободно %d КБ, а BIBLE нужно на ней %d КБ. Освободи немного места и попробуй снова.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Карта памяти в слоте %d отклонила PS2BBL, поэтому RIPPS2 оставил карту как была. Проверь свободное место и попробуй снова. (DIAG.TXT рядом с RIPPS2 содержит ответ карты.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Карта памяти в слоте %d не отложила BIBLE, поэтому ничего не изменилось. (DIAG.TXT рядом с RIPPS2 содержит ответ карты.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Карта памяти в слоте %d не приняла обратно %s, поэтому BIBLE остался. (DIAG.TXT рядом с RIPPS2 содержит ответ карты.)
  MUSIC: МУЗЫКА
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': 'В %s%s нет %s. RIPPOPS нашёл эмулятор PS1 от Sony на %s: START копирует сюда %s и запускает игру.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 не видит %s в %s%s. POPSTARTER нужен POPS_IOX.PAK с POPS.PAK или с POPS.ELF и IOPRP252.IMG: эмулятор PS1 от Sony с твоей собственной консоли. Он может найти их там, где RIPPS2 не ищет (если твои игры запускаются, находит). START запускает, и об этом накопителе больше не спрашивается.'
  ' (The configs found were set: %s.)': ' (Найденные конфигурации настроены: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Один раз сохраните его настройки в его собственном конфигураторе, затем снова включите BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s не может запустить RIPPS2 оттуда, где он сейчас (%s), а RIPPS2 не копирует себя. Положите RIPPS2.ELF на карту памяти или USB-накопитель и запустите его оттуда.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK не смог записать конфигурацию загрузчика. Проверьте, что карта памяти или накопитель не защищены от записи, и попробуйте снова.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK не нашёл конфигурации загрузчика для изменения.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK выключен. Ваш загрузчик запускает то, что запускал раньше (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK включён. Теперь %s запускает RIPPS2 при включении (%s), а при пустом поле «ELF при вызове IGR» EXIT из игры возвращается тем же путём. Удерживайте одну из его кнопок при запуске консоли, чтобы попасть в другое место.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK поставил RIPPS2 первым в меню OSDMenu (%s). OSDMenu сам ничего не запускает: выберите там RIPPS2, и EXIT из игры вернётся в это меню. Чтобы консоль сразу запускала RIPPS2, BIBLE устанавливает PS2BBL на карту памяти («Загрузчик»).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK работает через загрузчик на карте памяти (PS2BBL, FMCB или OSDMenu), а здесь его нет.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Карта памяти в слоте %d при включении запускает %s, а BOOT LOCK не нашёл его конфигурации для изменения (ищет %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Карта памяти в слоте %d при включении запускает %s, который BOOT LOCK настроить не может: он работает через PS2BBL, FMCB и OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: На этой консоли есть загрузчик с блокировкой RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT из игры: браузер, затем ваш загрузчик (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'Используется: %s, %d изображений, %d МБ'
  'Measuring how fast each drive reads its art: %s': 'Замер скорости, с которой каждый накопитель читает свои изображения: %s'
  'None: each picture is read from its own ART folder.': 'Нет: каждое изображение читается из своей папки ART.'
  REMOVE the pack in %s (the ART folders stay as they are): УДАЛИТЬ пакет в %s (папки ART останутся как есть)
  Remove the ART Pack in %s? The ART folders stay as they are.: Удалить пакет ART в %s? Папки ART останутся как есть.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Остановлено. Незаконченный пакет удалён, а изображения загружаются из папок ART, как раньше.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Не удалось записать пакет ART в %s (есть ли место на этом накопителе?). Больше ничего не изменилось: изображения загружаются из папок ART, как раньше.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Пакет ART в %s удалён. Изображения снова загружаются из папок ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : На запущенных накопителях нет папки ART с изображениями. Запусти накопители, на которых лежат твои изображения (SELECT на их странице), и вернись.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d изображений из %d папок ART попадут в один файл, %s. Папки ART останутся как есть: пакет является копией. Ты можешь скопировать art.tar в папку ART другого накопителя через Memory Files, но быстрее всего собрать его на том накопителе, с которого ты просматриваешь игры, поэтому самый быстрый накопитель стоит первым. Собрать сейчас?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Пакет ART собран: %d изображений, %d МБ, в %s (%d с). Теперь изображения загружаются из него, и для %d игр, для которых он собран, их папка ART больше никогда не опрашивается по одному изображению. Изображения, которые RIPPS2 загружает или снимает, появляются сразу; скопированные с ПК появятся, когда ты снова соберёшь пакет.'
  '%s free': свободно %s
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: чтение %s/с, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: чтение %s/с, самый быстрый, %s'
  ART PACK: ПАКЕТ ART
  About %d min: Около %d мин
  'Looking at the ART folders: %d pictures, %s': 'Просмотр папок ART: изображений %d, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 'Ни на одном запущенном накопителе нет места для пакета ART: нужно около %s. Освободи место на накопителе, с которого просматриваешь игры, и попробуй снова.'
  PACKING THE ART: УПАКОВКА ИЗОБРАЖЕНИЙ
  PICTURE %d OF %d: ИЗОБРАЖЕНИЕ %d ИЗ %d
  'Pictures: %d (%s). ART folders: %d.': 'Изображений: %d (%s). Папок ART: %d.'
  Stop? The unfinished pack is removed; the ART folders stay as they are.: Остановить? Незаконченный пакет удаляется; папки ART останутся как есть.
  'The ART folders stay as they are: the pack is a copy.': 'Папки ART останутся как есть: пакет является копией.'
  Under a minute: Меньше минуты
  free space unknown: свободное место неизвестно
  'A game''s EXIT: the browser, or your boot loader when one is installed': 'EXIT из игры: браузер или ваш загрузчик, если он установлен'
