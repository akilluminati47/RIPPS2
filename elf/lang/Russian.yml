  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' У карты памяти здесь есть свой PS2BBL/CONFIG.INI, который PS2BBL читает раньше конфигурации HDD: выньте эту карту при включении или запустите RIPPS2 с карты и установите заново.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' Удерживайте ТРЕУГОЛЬНИК при включении для браузера, START для диска.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' Удерживайте ТРЕУГОЛЬНИК для браузера, START для диска. Конфигурация: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 может установить BIBLE, PS2BBL, настроенный на запуск RIPPS2, на карту памяти; то, что запускается с неё сейчас, сохраняется в папке резервной копии. Установить BIBLE?'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' Старая загрузочная программа HDD сохранена (УПРАВЛЕНИЕ > ВОССТАНОВИТЬ).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' Консоль не приняла настройку, которая запускает её HDD при включении: задайте её утилитой HDD или установите заново.'
  ' What was there before is kept in mc%d:/%s%s.': ' То, что было там раньше, сохранено в mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' Ваша собственная конфигурация PS2BBL сохранена (%s), в ней включён BOOT LOCK: её кнопки остались такими, как вы их задали.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' Ваша собственная конфигурация PS2BBL сохранена, в ней включён BOOT LOCK.'
