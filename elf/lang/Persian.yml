  RIPPS2_HINT_REFRESH: راهنمای تازه‌سازی (SELECT)
  RIPPS2_HINT_STAR: راهنمای علاقه‌مندی (R3)
  RIPPS2_HINT_VIEW: راهنمای نما (L3)
  HINT_RIPPS2_HINT_SHOW: این راهنما را نشان می‌دهد یا پنهان می‌کند. دکمه آن در هر حال کار می‌کند.
  RIPPS2_GLYPH_SET: مجموعه نمادها
  HINT_RIPPS2_GLYPH_SET: 'نمادهای دکمه در هر صفحه: نمادهای خود پوسته، نمادهای RIPPS2، استاندارد (دکمه‌های تیره، نمادهای رنگی) یا سفید (کاملاً سفید).'
  RIPPS2_HINT_ORDER: ترتیب راهنماها
  HINT_RIPPS2_HINT_ORDER: راهنماها را مرتب می‌کند. پوسته ترتیب پوسته را نگه می‌دارد؛ ترتیب شما همانی است که اینجا تنظیم شده.
  RIPPS2_HINT_ORDER_FOLLOW: ترتیب
  RIPPS2_GRID_LAYOUT: چیدمان شبکه‌ای
  HINT_RIPPS2_GRID_LAYOUT: یک صفحه شبکه‌ای با فاصله‌گذاری RIPPS2 چند جلد جا می‌دهد. پوسته چیدمان خود پوسته را نگه می‌دارد.
  RIPPS2_LAUNCH_DISC: دیسک اجرا
  HINT_RIPPS2_LAUNCH_DISC: دیسک بازی هنگام اجرای آن وارد می‌شود. ظاهر شدن ناگهانی آرام می‌گیرد و محو می‌شود؛ چرخش تندتر و تندتر می‌چرخد تا بازی شروع شود؛ بزرگ‌نمایی آرام می‌گیرد، سپس بزرگ می‌شود تا واضح خوانده شود و می‌ماند.
  RIPPS2_TRANSITION: گذار صفحه
  HINT_RIPPS2_TRANSITION: 'صفحه تازه هنگام رفتن به دسته دیگر چگونه وارد شود: از رنگ پس‌زمینه پوسته، یا از یک درخشش. پوسته انتخاب پوسته را نگه می‌دارد.'
  RIPPS2_CATEGORY_LAYOUT: چیدمان دسته‌ها
  HINT_RIPPS2_CATEGORY_LAYOUT: 'سه دسته کجا می‌نشینند: نامشان در بالا، یا نمادها در امتداد نوار کناری، هر کدام با کشویی از صفحه‌هایش (چپ روی فهرست به آنجا می‌رود)، یا منو: بی‌هیچ نواری، دسته‌ها در منوی START مثل پوسته‌ای که برای OPL ساخته شده. پوسته چیدمان خود پوسته را نگه می‌دارد.'
  RIPPS2_CACHE: حافظه نهان
  HINT_RIPPS2_CACHE: 'فهرست بازی‌های هر منبع چگونه نگه داشته می‌شود تا صفحه‌اش فوراً باز شود: Fast Cache، فهرست هارد داخلی و تازه‌سازی خودکار.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'هر منبع آخرین فهرست بازی‌اش را نگه می‌دارد (RIPPS2.LST کنار پوشه‌های CD و DVD آن) و همان لحظه که منبع پاسخ دهد نشانش می‌دهد. Trust Cache تصمیم می‌گیرد که منبع پس از آن دوباره خوانده شود یا نه. خاموش: هر فهرست اول از منبعش خوانده می‌شود، مثل گذشته.'
  HINT_RIPPS2_VIGNETTE: لبه‌های همه جلدها جز جلد انتخاب‌شده را تیره می‌کند تا انتخاب‌شده برجسته شود. ضعیف نصف کامل است.
