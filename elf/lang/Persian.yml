  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE نتوانست پیکربندی خود را بنویسد (%s). برنامه راه‌اندازی تغییر نکرد.
  BIBLE could not write the HDD's boot program (step %d). %s: BIBLE نتوانست برنامه راه‌اندازی هارد را بنویسد (مرحله %d). %s
