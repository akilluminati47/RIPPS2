  CAD_CONNECTION_ERROR: پرس‌وجو از Caduceus ممکن نیست. اتصال را بررسی کنید، سپس برای تلاش دوباره Select را بزنید.
  CAD_BACK_REFRESH: بازگشت به OPL برمی‌گردد. Select این صفحه را تازه می‌کند.
  CAD_LIBRARY_CONTROLS: 'L1/R1: صفحه   تأیید: باز کردن   Select: تازه‌سازی'
  CAD_GAME_CONTROLS: 'L1/R1: صفحه   مربع: فیلتر   Select: تازه‌سازی'
  CAD_BACK: بازگشت
  CAD_UNTRACKED: Caduceus آماده نیست. این بار بدون دستاوردها اجرا می‌شود.
  PS1_RA_USB_REQUIRED: دستاوردهای PS1 به VCD روی USB از طریق POPStarter نیاز دارند
  PS1_RA_REMOVE_PREVIOUS: ماژول دستاورد PS1 قبلی حذف نمی‌شود
  PS1_RA_PREPARE_FAILED: دستاوردهای PS1 آماده نمی‌شوند. POPS/MODULE_9.IRX را نگه دارید یا جابه‌جا کنید و دسترسی نوشتن دستگاه را بررسی کنید.
  PS1_RA_CLEAN_DELETE: 'ماژول RA بلااستفاده RiptOPL: POPS/MODULE_9.IRX. برای اجرای تمیز حذف شود؟'
  PS1_RA_CLEAN_FAILED: ماژول RA بلااستفاده حذف نمی‌شود.
  PS1_RA_CLEAN_CONTINUE: با این حال ادامه شود؟ یک ماژول RA جامانده ممکن است تله‌متری کهنه را اجرا کند. خیر اجرا را لغو می‌کند.
  FAV_REMOVED: از علاقه‌مندی‌ها حذف شد
  FAV_REMOVE_FAILED: حذف از علاقه‌مندی‌ها ممکن نشد
  POPS_UDPFS_SETTINGS: تنظیمات شبکه POPS UDPFS
  POPS_UDPFS_DISCOVERY: در همه پوشه‌های POPS روی USB ذخیره می‌کند. سرور 0.0.0.0 از کشف استفاده می‌کند.
  POPS_UDPFS_NOT_READY: POPS UDPFS به IPCONFIG.DAT و UDPFSCONFIG.DAT معتبر و هم‌خوان در همه پوشه‌های POPS روی USB نیاز دارد. آن‌ها را در تنظیمات شبکه POPS پیکربندی کنید.
  HINT_POPS_UDPFS_IP: IP ثابت PS2 که درایور POPS UDPFS پس از بازنشانی IOP خود به کار می‌برد.
  POPS_UDPFS_ALL_USB_FOLDERS: همه پوشه‌های POPS روی USB
  POPS_UDPFS_INVALID_SUFFIX: ' (نامعتبر)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (ناقص)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS نیاز دارد جفت درایور .udpfs روی کارت حافظه نصب باشد. آن را دستی آماده کنید یا اعمال BDMA هنگام اجرا را روشن کنید.
  VMC_REPLACE_REQUIRES_DELETE: تغییر اندازه VMC ذخیره‌هایش را پاک می‌کند. از VMC موجود پشتیبان بگیرید و پیش از ساخت اندازه تازه از حذف استفاده کنید.
  VMC_CREATE_FAILED: VMC ساخته نشد. دستگاه، اتصال و دسترسی نوشتن را بررسی کنید. ذخیره‌های موجود جایگزین نشدند.
  RA_EXPERIMENTAL_CARDS: کارت‌های آزمایشی Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: کارت‌های آزمایشی دستاورد درون بازی PS2. ممکن است بازی‌ها را چشمک‌زن یا هنگ کنند. فقط Caduceus؛ خاموش از پالس طلایی استفاده می‌کند. از اجرای بعدی بازی اعمال می‌شود.
  RA_NEUTRINO_UNTRACKED: Neutrino RA برای این اجرا در دسترس نیست. محیط اجرای RA، IP همراه و فهرست پایش ذخیره‌شده را بررسی کنید. اجرا بدون دستاوردها.
  UDPFS_IP_CONFLICT: دستگاه دیگری در شبکه شما از نشانی IP این PS2 استفاده می‌کند، پس پاسخ‌های سرور UDPFS به آن می‌رود. در تنظیمات شبکه یک IP دیگر برای PS2 تعیین کنید.
  XERA_ACHIEVEMENTS: کتابخانه RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: این بازی را از طریق کتابخانه RetroAchievements در منوی اصلی مرور کنید.
  XERA_OPEN_NETWORK: دسترسی به xeRAbora ممکن نیست. OPEN TO THE NETWORK را در تنظیمات آن روشن کنید، IP همراه RA و دیوار آتش رایانه را بررسی کنید.
  XERA_UNKNOWN_GAME: xeRAbora این تصویر را نمی‌شناسد. اول بررسی پشتیبانی بازی RA را اجرا کنید.
  XERA_NOT_PLAYED: هنوز در کتابخانه RetroAchievements شما نیست. یک بار با دستاوردها آن را بازی کنید، سپس Select را بزنید.
  XERA_CONNECTION_ERROR: فهرست از xeRAbora خوانده نمی‌شود. برای تلاش دوباره Select را بزنید.
  CAD_PAIR_UDPFS: دسترسی به Caduceus ممکن نیست. ART/CADUCEUS.KEY را در پوشه‌ای که PS2-Servers به اشتراک می‌گذارد جفت کنید، و IP همراه RA را تعیین کنید.
  RA_WL_NOT_SAVED: فهرست پایش ذخیره نشد. مطمئن شوید دستگاه یا اشتراک بازی قابل نوشتن است، سپس دوباره بررسی کنید.
  RA_UDPFS_LOAD_FIRST: یک بار صفحه UDPFS را باز کنید تا ماژول شبکه آن بارگذاری شود، سپس دوباره تلاش کنید.
  CAD_UDPFS_IMG: 'مرورگر Caduceus به SMB یا فایل‌های UDPFS نیاز دارد: UDPFS IMG پوشه مشترکی برای کلید آن ندارد.'
  XERA_SET_CLOCK: هنوز در کتابخانه RetroAchievements شما نیست. ساعت کنسول را در تنظیمات سیستم تنظیم کنید تا فهرست کامل آن را ببینید، یا یک بار با دستاوردها آن را بازی کنید.
  CFG_TITLES: نمایش عنوان‌های CFG در فهرست بازی‌ها
  HINT_CFG_TITLES: عنوان CFG هر بازی را به جای نام فایل آن نشان می‌دهد و بر اساس آن مرتب می‌کند. هنگام تازه‌سازی فهرست همه CFGها را می‌خواند، پس فهرست‌ها کندتر بارگذاری می‌شوند. فقط برای نمایش.
  AUTO_VMC_INVALID: فایل VMC این بازی هست اما کارت حافظه معتبری نیست، پس استفاده یا جایگزین نشد. بازی بدون آن شروع می‌شود؛ آن را در منوی VMC بررسی کنید.
  AUTO_VMC_STILL_RUNNING: VMC این بازی هنوز در حال ساخت است. کمی بعد بازی را دوباره اجرا کنید.
  NEUTRINO_DVR_QUICKBOOT: اجرای DVR به گذار به حالت PSX نیاز دارد. -qb را از آرگومان‌های سراسری و هر بازی Neutrino حذف کنید.
  NEUTRINO_DVR_FILE_MISSING: 'نصب Neutrino برای DVR کامل نیست. فایل لازم موجود نیست:'
  LOGOART: تصویر لوگو
  HINT_LOGOART: لوگوی بازی (<ID>_LGO) را وقتی پوسته از آن استفاده می‌کند نشان می‌دهد. خاموش تصویر پیش‌فرض آن را هم پنهان می‌کند، اما جلدها، تصویر دیسک‌ها و پس‌زمینه‌ها را نگه می‌دارد.
  PARENLOCK_GAME: قفل والدین
  PARENLOCK_GAME_HINT: برای اجرای این بازی، رمز قفل والدین را می‌خواهد.
  PARENLOCK_GAME_NO_PASSWORD: یک رمز قفل والدین تعیین کنید، وگرنه این بازی قفل نمی‌شود.
  HINT_ENABLE_PCCF: CompactFlash روی PC CARD برای PS2های ژاپنی اولیه. فقط بازی‌های بومی PS2؛ CF به دسترسی انحصاری به PC CARD نیاز دارد. برای آزاد کردن آن دوباره راه‌اندازی کنید.
  PCCF_GAMES: بازی‌های PC CARD CF
  PCCF_UNAVAILABLE: 'CF در دسترس نیست: یک PS2 ژاپنی اولیه با PC CARD، یک کارت سازگار و نبود هیچ درایور فعال DEV9/هارد/شبکه لازم است.'
  PCCF_UNSUPPORTED_GAME: CF اکنون فقط بازی‌های بومی PS2 را پشتیبانی می‌کند. VMC روی CF، بارگذاری PS1 و دستاوردهای شبکه در دسترس نیستند.
  HINT_ENABLE_DVR: کشف آزمایشی ISOهای DESR DVR. به منبع هارد روشن نیاز دارد؛ اجرای بازی به Neutrino خارجی با پشتیبانی DVR نیاز دارد.
  HINT_RIPPS2_IGR_PAGE: منوی درون بازی، RIPSHOT و چگونگی ظاهر کردن عکس‌ها.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: عکس صفحه از منوی درون بازی، به ART برای پوسته‌هایتان یا به MEDIA.
  RIPPS2_DEVELOP_SHOTS: ظاهر کردن عکس‌ها
  HINT_RIPPS2_DEVELOP_SHOTS: چگونه عکس‌های منتظر روی حلقهٔ هر بازی PNG می‌شوند.
  RIPPS2_SETTINGS_HOME: ذخیرهٔ تنظیمات در
  HINT_RIPPS2_SETTINGS_HOME: 'جایی که RIPPS2 تنظیماتش را نگه می‌دارد: ذخیرهٔ خودش روی کارت حافظه، پوشهٔ RIPPS2 روی یک درایو (هارد داخلی، USB، MX4SIO، iLink یا MMCE)، یا پوشه‌ای که می‌نویسید.'
  RIPPS2_LAUNCHERS: اجراکننده‌ها
  RIPPS2_LOOK_NOW: الان جستجو کن
  HINT_RIPPS2_LOOK_NOW: RIPPS2 در درایوهای شروع‌شده دنبال POPSTARTER، فایل‌های POPS، Ember، BIOS مخصوص Ember و Neutrino می‌گردد و جای هر کدام را به خاطر می‌سپارد. هر اجرا آن‌ها را از همان‌جا می‌خواند.
  RIPPS2_HIDE_GAME: پنهان کردن بازی
  RIPPS2_HIDDEN_GAMES: بازی‌های پنهان
  HINT_RIPPS2_HIDDEN_GAMES: بازی‌هایی که با پنهان کردن بازی پنهان شده‌اند، روی درایوهای شروع‌شده. یکی را دوباره نشان دهید یا حذفش کنید. هر درایو فهرست خودش را نگه می‌دارد.
  HINT_RIPPS2_BDM_DEVICES: 'درایوهایی که BDM از آن‌ها بازی می‌خواند: USB، MX4SIO، یک PC Card CF، درایو DVR دستگاه DESR و iLink. هارد داخلی از حالت شروع هارد پیروی می‌کند.'
  HINT_RIPPS2_SCREEN: 'تصویر منو: حالت ویدیو، صفحهٔ عریض، جایش روی تلویزیون (H-POS، V-POS) و overscan.'
  HINT_RIPPS2_LAYOUT: جای دسته‌ها و چگونگی آمدن صفحه، سپس جلدهای RIPFLOW و شبکهٔ RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: ضخامت متن، رنگ پوسته، گذر رنگ و همهٔ رنگ‌ها.
  HINT_RIPPS2_TEXT_WEIGHT: 'متن خود RIPPS2 چقدر پررنگ است: راهنماهای تنظیمات، وضعیت و درباره. معمولی همان قبلی است؛ پررنگ روی تصویر نرم بهتر خوانده می‌شود. قلم‌های خود پوسته همان ضخامتی را نگه می‌دارند که پوسته به آن‌ها می‌دهد.'
  HINT_RIPPS2_HDD_START: 'هارد داخلی، APA یا exFAT: RIPPS2 هر کدام که باشد می‌خواندش و یک بار، به نام بازی‌های HDD، نشانش می‌دهد. خودکار (سریع‌ترین وقتی هارد هست) هنگام بوت شروعش می‌کند؛ خاموش کاری به آن ندارد.'
  HINT_RIPPS2_THEME_COLOR: رنگ خود پوسته. سفارشی را به‌عنوان رنگ پوسته برگزینید تا خودتان آن را انتخاب کنید، مثل رنگ‌های متن.
  HINT_RIPPS2_SWEEP: پنج رنگی که پوسته آرام و نرم از آن‌ها می‌گذرد. رنگین‌کمان، گذری ساخته از هر رنگ پوسته، یا گذر خودتان. خاموش رنگ پوسته را ثابت نگه می‌دارد.
  HINT_RIPPS2_SWEEP_COLORS: پنج رنگ گذر و سرعتش. یکی از گذرهای RIPPS2 را تغییر دهید تا با نامی که می‌دهید به‌عنوان گذر خودتان نگه داشته شود.
  HINT_RIPPS2_SWEEP_NAME: نام گذر شما در فهرست گذر رنگ.
  HINT_RIPPS2_SWEEP_COLOR: یکی از پنج رنگی که گذر به ترتیب از آن‌ها عبور می‌کند.
  HINT_RIPPS2_SWEEP_SPEED: 'هر رنگ چقدر می‌ماند تا رنگ بعدی بیاید. حتی سرزنده هم نرم می‌ماند: رنگ‌ها هرگز چشمک نمی‌زنند.'
  RIPPS2_HIDE_COMPRESS: پنهان کردن بازی و فشرده‌سازی
  HINT_RIPPS2_SELECT_HOLD: 'SELECT به مدت 4.2 ثانیه روی فهرست بازی نگه داشته شود. فهرست: پوسته‌ها در یک پنل، یکی را انتخاب کنید. چرخشی: پوسته بعدی. خاموش: هیچ (فشار دادن همچنان تازه می‌کند).'
  RIPPS2_RECENT_GAMES: بازی‌های اخیر
  RIPPS2_SET_METADATA_RENAME: تنظیم فراداده (تغییر نام)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: اول دسته (آزمایشی)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX از گذرگاهی می‌خواند که با دسته مشترک است و تا خواندن ادامه دارد دسته شنیده نمی‌شود: فشردن دکمه‌ها هنگام بارگذاری جلدها دیر می‌رسد یا گم می‌شود. روشن: جلدها تکه‌تکه می‌آیند و دسته میانشان خوانده می‌شود، کمی کندتر. خاموش: با بیشترین سرعت کارت. وقتی منابع کارت روی خودکار باشند، فهرستش یک بار، هنگام بوت، بارگذاری می‌شود.'
  HINT_RIPPS2_TRUST_CACHE: 'فهرستی که از حافظه نهان نشان داده شده همان‌طور و آماده اجرا می‌ماند تا وقتی SELECT را بزنید یا خود RIPPS2 آن منبع را تغییر دهد. خاموش: هر منبع پس از نمایش حافظه نهانش در پس‌زمینه دوباره خوانده می‌شود، مکثی که روی کارت MMCE یا MX4SIO حس می‌شود، چون گذرگاه دسته را با هم دارند.'
  RIPPS2_STATUS_OPEN: بارگذاری و درایوها
  HINT_RIPPS2_STATUS_OPEN: 'وضعیت را باز می‌کند: بوت تنظیمات و فهرست بازی‌ها را از کجا می‌خواند، کدام جا سریع‌ترین است، EXIT بازی به کجا می‌رود، و همه درایوها. تنظیمات حافظه نهان در آنجا به اینجا برمی‌گردد.'
  RIPPS2_BADGE_SET: مجموعه نشان‌ها
  HINT_RIPPS2_BADGE_SET: 'نشان‌های صفحه اطلاعات بازی (رده‌بندی، بازیکنان، ESRB، حالت ویدیو، اسکن، نسبت تصویر). RIPPS2: مجموعه خودش، در همه پوسته‌ها یکسان. پوسته: تصاویر خود پوسته، یا تصاویر RIPPS2 وقتی پوسته بخواهد.'
  RIPPS2_HINT_FADE: محو شدن راهنماها و نمادها
  HINT_RIPPS2_HINT_FADE: 'راهنمای دکمه یا نمادی که تغییر کند، مثل جلدها، همان لحظه آرام پدیدار می‌شود؛ آن‌هایی که ثابت می‌مانند دست نمی‌خورند، در هر صفحه و پیام. خاموش: فقط ظاهر می‌شوند. پوسته: پوسته تصمیم می‌گیرد (روشن، مگر بگوید hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: سبک نوار کناری
  HINT_RIPPS2_SIDEBAR_STYLE: 'کلاسیک (دوتکه): نمادها در نوار تیره نوار کناری با نوار رنگی کنارش. XL (یک‌تکه): یک نوار پهن‌تر، نمادها در میانه آن. پوسته: پوسته تصمیم می‌گیرد.'
  HINT_BDM_START: 'USB، iLink، MX4SIO و هارد exFAT. خودکار آن‌ها را هنگام بوت شروع می‌کند: سریع‌ترین برای درایوهای وصل‌شده، و بازی‌هایشان از اول در همه بازی‌ها. دستی وقتی صفحه‌شان را باز کنید شروعشان می‌کند.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino نمی‌تواند از VMC روی هارد APA استفاده کند (exFAT، USB و MX4SIO می‌توانند): این بازی با کارت واقعی در آن شکاف شروع می‌شود.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'شروع فقط درایو خود RIPPS2 را می‌خواند: تنظیمات و صداهای کنار RIPPS2.ELF (فایل RIPPS2.FB آنجا جایشان را می‌گوید) و هر فهرست از حافظه پنهانش. درایوهای دیگر منتظر می‌مانند: SELECT در یک صفحه درایوهایش را راه می‌اندازد و تصویرهایشان را می‌آورد (با تازه‌سازی خودکار هنگام شروع راه می‌افتند). روشن کردنش صداهایت را، و اگر جا باشد موسیقی را، به AUDIO کنار RIPPS2 کپی می‌کند.'
  RIPPS2_ART_PACK: بسته ART
  RIPPS2_ART_PACK_BUILD: ساختن یا حذف
  HINT_RIPPS2_ART_PACK: پوشه ART هر درایو راه‌اندازی‌شده را در یک art.tar روی درایوی که انتخاب می‌کنی بسته‌بندی می‌کند (سریع‌ترین اول پیشنهاد می‌شود). جلدها سپس از یک فایل با یک فهرست بارگذاری می‌شوند، هرگز با جست‌وجو برای هر بازی، تا منوها و موسیقی روان بمانند. پوشه‌های ART همان‌طور که هستند می‌مانند.
  RIPPS2_LIST_CFG_TEXT: عنوان و توضیح در فهرست
  HINT_RIPPS2_LIST_CFG_TEXT: 'عنوان و توضیح بازی از CFG آن کنار فهرست بازی‌ها. پوسته: همان‌طور که پوسته نشان می‌دهد (پوسته خود RIPPS2 آن‌ها را نشان نمی‌دهد). صفحه اطلاعات همیشه نشانشان می‌دهد.'
