  : 'فایل‌های حافظه اکنون روی MEDIA باز می‌شود و دیسک در کلیپ‌بورد است (استخراج شد). به درایو و پوشه‌ای بروید که باید در آن باشد (هر درایوی: USB، هارد، MEDIA در SD2PSX)، مثلث را برای کارها بزنید و چسباندن را انتخاب کنید. RIPDISC یک بار دیگر می‌پرسد و دیسک را با لیزر PS2 شما می‌خواند و همان‌جا می‌نویسد.'
