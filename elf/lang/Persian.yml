  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 نمی‌تواند منطقه این کنسول را از ROM آن تشخیص دهد، پس نمی‌داند کدام پوشه به‌روزرسانی سیستم را می‌خواند. BIBLE نصب نشد.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 نتوانست پارتیشن __sysconf یا __common هارد را باز کند (خطای %d)، پس BIBLE جایی برای نگه‌داری RIPPS2 و پیکربندی‌اش در آنجا ندارد. چیزی تغییر نکرد.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 نتوانست برنامه راه‌اندازی نگه‌داشته‌شده را بخواند. چیزی تغییر نکرد.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 نتوانست برنامه راه‌اندازی را برگرداند. دوباره تلاش کنید؛ نسخه نگه‌داشته‌شده دست‌نخورده است.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 مشغول خواندن یک درایو بود و نتوانست پردازنده ورودی/خروجی را دوباره راه‌اندازی کند. چیزی تغییر نکرد: کمی بعد دوباره تلاش کنید.'
