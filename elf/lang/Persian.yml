  HINT_COVERFLOW_COUNT: RIPFLOW در هر سوی جلد انتخاب‌شده چند جلد نشان دهد.
  HINT_COVERFLOW_SCALE: RIPFLOW جلد انتخاب‌شده را نسبت به بقیه چقدر بزرگ بکشد.
  HINT_COVERFLOW_ANIM: جلدها هنگام حرکت شما در جریان با چه سرعتی بلغزند.
  HINT_NARGS_QB: 'راه‌اندازی سریع: صفحه شروع Neutrino را رد می‌کند. اگر اینجا روشن باشد، برای هر بازی فرستاده می‌شود؛ اگر خاموش باشد، RIPPS2 همچنان خودش آن را برای بازی‌های USB، iLink و شبکه، جایی که لازم است، می‌فرستد.'
  HINT_NARGS_DBC: 'رنگ‌های اشکال‌زدایی: Neutrino در هر گام بارگذاری صفحه را با یک رنگ پر می‌کند، پس یک عکس نشان می‌دهد بازی کجا می‌ایستد.'
  HINT_NARGS_LOGO: لوگوی PS2 را پیش از بازی نشان می‌دهد (راه‌اندازی دوباره دوم IOP، که برخی درایوهای iLink لازم دارند). اگر اینجا خاموش باشد، RIPPS2 از اجرای بازی‌ها > لوگوی PS2 پیروی می‌کند و آن را هرگز برای بازی‌های MMCE یا شبکه نمی‌فرستد.
  HINT_NARGS_CWD: 'پوشه‌ای که بازی آن را پوشه خودش می‌بیند. خالی: پیش‌فرض Neutrino.'
  HINT_NARGS_CFG: 'یک فایل پیکربندی Neutrino از خود شما (-cfg). خالی: فایل خود Neutrino.'
  HINT_NARGS_ELF: 'به جای فایل راه‌اندازی‌ای که دیسک نام می‌برد، این ELF را اجرا می‌کند. خالی: فایل خود بازی.'
  HINT_NARGS_ATA0: تصویر هاردی که Neutrino آن را به‌عنوان هارد داخلی کنسول سوار می‌کند، برای بازی‌هایی که از هارد استفاده می‌کنند (-ata0).
  HINT_NARGS_ATA0ID: فایل شناسه‌ای که همراه آن تصویر هارد است (-ata0id).
  HINT_NARGS_ATA1: تصویر هارد دوم (-ata1).
  RIPPS2_LAST_USED: آخرین مورد استفاده
  RIPPS2_PAGE_BUTTONS: دکمه‌های صفحه
  HINT_RIPPS2_PAGE_BUTTONS: 'کدام دکمه‌های شانه صفحه‌های فهرست بازی را ورق می‌زنند. L2 / R2: آن‌ها صفحه‌ها را ورق می‌زنند و L1 / R1 دسته‌ها را عوض می‌کنند. L1 / R1: آن‌ها صفحه‌ها را ورق می‌زنند و L2 / R2 دسته‌ها را عوض می‌کنند. پوسته: پوسته تصمیم می‌گیرد؛ بدون آن L2 به بالا و R2 به انتها می‌رود. L2 + R2 با هم همیشه یک بازی تصادفی انتخاب می‌کنند.'
  RIPPS2_IGR_MENU: منوی درون بازی
  HINT_RIPPS2_IGR_MENU: 'روشن: L1+L2+R1+R2+SELECT+START بازی را متوقف می‌کند: ادامه، خروج، گرفتن عکس از صفحه، دیدن دستاوردها یا خاموش کردن. خاموش: ترکیب دکمه‌ها مثل قبل بی‌درنگ از بازی خارج می‌شود.'
  RIPPS2_BOOT_LOADER: بوت‌لودر
  HINT_RIPPS2_BOOT_LOADER: نشان می‌دهد هر کارت حافظه هنگام روشن شدن چه چیزی را اجرا می‌کند، و BIBLE (PS2BBL تنظیم‌شده برای RIPPS2) را نصب می‌کند. فایل‌های راه‌اندازی قدیمی کارت نگه داشته می‌شوند.
  RIPPS2_MANAGE: مدیریت
  RIPPS2_ACHIEVEMENTS: دستاوردها
  RIPPS2_NBD_SERVER: سرور NBD
  HINT_RIPPS2_NBD_SERVER: هارد را از طریق شبکه با یک رایانه به اشتراک می‌گذارد. تا وقتی اجرا می‌شود، یک صفحه وضعیت باز می‌ماند.
  RIPPS2_START: شروع
  RIPPS2_COVER_ART: جلدها
  HINT_RIPPS2_COVER_ART: برای هر بازی PS2 در فهرست‌های شروع‌شده شما که جلد ندارد، یک جلد از ps2-covers متعلق به xlenore در GitHub در پوشه ART همان درایو دریافت می‌کند. به کابل شبکه و اینترنت نیاز دارد.
  RIPPS2_DOWNLOAD: دریافت
  RIPPS2_GLYPHS: نمادهای دکمه جهت
  HINT_RIPPS2_GLYPHS: 'نمادهای دکمه جهت کنار نام درایوها و آرایش‌ها. ظاهر شدن تدریجی آن‌ها را هنگام جابه‌جایی نشان می‌دهد؛ محو شدن تدریجی آن‌ها را هنگام باز شدن صفحه نشان می‌دهد. پوسته: پوسته تصمیم می‌گیرد.'
  RIPPS2_COLOR_THEME: رنگ پوسته
  HINT_RIPPS2_COLOR_THEME: 'یک رنگ برای برج‌ها، گوی‌ها، شیشه، پخش‌کننده CD و مرورگر فایل، در هر سه زبانه. پوسته: پوسته تصمیم می‌گیرد (آبی RIPPS2 جایی که تصمیم نمی‌گیرد).'
  RIPPS2_HINTS: راهنمای دکمه‌ها
  HINT_RIPPS2_HINTS: 'راهنمای دکمه‌ها در پایین صفحه. محو در حالت بیکاری آن‌ها را تا وقتی دکمه‌ای بزنید پنهان می‌کند. پوسته: پوسته تصمیم می‌گیرد.'
  RIPPS2_CATEGORY_BAR: دسته‌ها/نوار کناری
  HINT_RIPPS2_CATEGORY_BAR: 'اجرای دیسک، ذخیره‌سازی و فایل‌های حافظه: نام‌ها در بالا، یا نوار کناری. محو در حالت بیکاری نام‌ها را کم‌رنگ می‌کند، یا نوار کناری را کنار می‌کشد، تا وقتی دکمه‌ای بزنید؛ بی‌درنگ برمی‌گردد. پوسته: پوسته تصمیم می‌گیرد.'
  RIPPS2_SOURCE_NAME: نام منبع
  RIPPS2_STATUS: وضعیت
  RIPPS2_SOURCE: منبع
  HINT_RIPPS2_SOURCE_NAME: 'نام منبع بالای بازی‌ها (همه بازی‌ها، بازی‌های HDD و مانند آن). محو در حالت بیکاری آن را همراه نوار دسته‌ها محو می‌کند؛ ظاهر شدن ناگهانی به جای آن، آن را بزرگ در وسط صفحه نشان می‌دهد، همان‌طور که L3 فهرست را نام می‌برد، در نخستین فهرست پس از راه‌اندازی و هر بار که منبع عوض شود، و سپس محو می‌شود. ظاهر شدن ناگهانی و نام هر دو کار را می‌کند. پوسته‌ها می‌توانند ظاهر شدن ناگهانی را نمایانِ خود کنند. پوسته: پوسته تصمیم می‌گیرد.'
  RIPPS2_RECENTS: بازی‌های اخیر
  HINT_RIPPS2_RECENTS: 'بازی‌های اخیر، صفحه‌ای در نوار کناری با آخرین بازی‌هایی که اجرا کرده‌اید، تازه‌ترین اول: چند تا نگه می‌دارد، از 1 تا 99 (مثلث عدد را تایپ می‌کند). بازی‌ای که درایوش روی دستی است، وقتی انتخابش کنید درایو را شروع می‌کند. 0 صفحه را خاموش می‌کند.'
  RIPPS2_CATEGORY_ORDER: ترتیب دسته‌ها
  HINT_RIPPS2_CATEGORY_ORDER: 'جای اجرای دیسک و فایل‌های حافظه را عوض می‌کند: فایل‌های حافظه اول و اجرای دیسک آخر، هم در نام‌های نوار و هم در نمادهای نوار کناری. ساخته‌شده برای RIPFLOW (رابط > پوسته). پوسته: پوسته تصمیم می‌گیرد.'
  RIPPS2_MUSIC: موسیقی
  HINT_RIPPS2_MUSIC: فایل‌های bgm را در پوشه AUDIO کنار RIPPS2 و در پوشه AUDIO مربوط به OPL روی هر درایو شروع‌شده پخش می‌کند (Ogg بدون برچسب، یا WAV شانزده‌بیتی)؛ فایلی به نام Menu اول پخش می‌شود. اگر پوسته موسیقی خودش را داشته باشد، به جای آن پخش می‌شود.
  RIPPS2_BIOS_SOUNDS: صداهای BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'صداهای منوی خود این کنسول را از BIOS آن به‌عنوان صداهای RIPPS2 در پوشه AUDIO می‌نویسد (کمتر از 1 مگابایت). موسیقی منو استخراج جداگانه‌ای دارد: موسیقی BIOS.'
  RIPPS2_RIP: استخراج
  RIPPS2_HINTS_GLYPHS: راهنماها و نمادها
  HINT_RIPPS2_HINTS_GLYPHS: ظاهر راهنمای دکمه‌ها و نمادها. هر سطر روی پوسته، یعنی انتخاب پوسته، شروع می‌شود؛ هر انتخاب دیگری مال شماست و بر هر پوسته‌ای اولویت دارد.
  RIPPS2_HINT_LAYOUT: چیدمان راهنما
  HINT_RIPPS2_STARSIDE: 'ستاره بازی ستاره‌دار در فهرست کجا می‌نشیند. چپ: ستون خودش در آغاز هر ردیف. راست: پس از عنوان. پنهان (پیش‌فرض): نه ستاره و نه ستون، عنوان‌ها کامل. پوسته: هرچه پوسته بگوید. R3 در هر حال بازی را ستاره‌دار می‌کند؛ R3 را 4 ثانیه روی فهرست نگه دارید تا ستاره‌ها پنهان شوند یا برگردند (این کار بازی زیر نشانگر را هم ستاره‌دار می‌کند).'
  HINT_RIPPS2_HINT_LAYOUT: 'سطر: راهنماها در یک خط. ستون: یک راهنما در هر خط، فهرستی در کنار، از جایی که پوسته راهنماهایش را می‌گذارد.'
  RIPPS2_HINT_LABELS: برچسب‌های راهنما
  HINT_RIPPS2_HINT_LABELS: فقط نماد تنها دکمه‌ها را می‌کشد، برای نمادهایی که واژه‌های خودشان را دارند. نشان‌ها نماد و عنوان هر راهنما را با هم روی یک نشان می‌گذارند.
