  HINT_RIPPS2_GRID_WIDE: صفحه شبکه‌ای فقط روی تصویر 16:9 (صفحه عریض، 720p، 1080i)، که جلدها باریک‌تر کشیده می‌شوند و تعداد بیشتری در یک سطر جا می‌گیرند. پوسته چیدمان پوسته را به کار می‌برد؛ مانند چیدمان شبکه‌ای از چیدمان شبکه‌ای پیروی می‌کند.
  RIPPS2_BGBLUR: تاری پس‌زمینه
  HINT_RIPPS2_BGBLUR: شیشه مات تصویر پس‌زمینه بازی را چقدر تار کند. پوسته مقدار خود پوسته را به کار می‌برد (ضعیف در RIPGRID و Adapt).
  HINT_RIPPS2_HINT_SLOT: راهنمای این جایگاه. راهنمایی که اینجا بود به جای قبلی راهنمای انتخاب‌شده می‌رود.
  PS1_SAVE_GUIDANCE: ذخیره‌های PS1 به Ember یا POPSTARTER بستگی دارند؛ تنظیمات VMC مربوط به PS2 اعمال نمی‌شوند.
  NEUTRINO_SHOW_ARGS: نمایش آرگومان‌های اجرا
  HINT_NEUTRINO_SHOW_ARGS: پیش از هر اجرای Neutrino، همه آرگومان‌هایی را که Neutrino می‌گیرد نشان می‌دهد و برای ادامه می‌پرسد. بازگشت بدون اجرا به منو برمی‌گرداند.
  NEUTRINO_ARGS_CONFIRM: Neutrino با این آرگومان‌ها شروع می‌شود. اجرا شود؟
  HINT_NARGS_EXTRA: پرچم‌های دیگر Neutrino، جداشده با فاصله، که پس از همه موارد بالا فرستاده می‌شوند. RIPPS2 همیشه -bsd و -dvd را برای درایو و ISO بازی، -mc0 و -mc1 را برای VMCهای آن، -gsm را برای حالت ویدیوی آن، و حالت‌های سازگاری خود بازی را اضافه می‌کند. پرچمی که سطر خودش را در بالا دارد (مانند -logo) هنگام ذخیره به آن سطر می‌رود و همچنان فرستاده می‌شود.
  HINT_RIPPS2_THEME: ظاهر همه صفحه‌ها. در فهرست بازی، SELECT را 4.2 ثانیه نگه دارید تا به پوسته بعدی بروید؛ فشار کوتاه SELECT همچنان فهرست را تازه می‌کند.
  GAME_TYPE_LABELS: نمایش برچسب‌های [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: فهرست تقلب‌ها در پوشه Neutrino ذخیره نشد، پس Neutrino نمی‌تواند از آن استفاده کند. بدون تقلب اجرا شود؟
  AUTO_CREATE_VMC: ساخت VMC در نخستین اجرا
  HINT_AUTO_CREATE_VMC: اجرای یک بازی PS2 بدون VMC در شکاف 1 یک کارت 8 MB روی دستگاه بازی می‌سازد، با نامی که صفحه VMC پیشنهاد می‌دهد (مشترک برای همه دیسک‌های بازی)، و آن را اختصاص می‌دهد. با Neutrino نه روی هارد APA (هارد exFAT کار می‌کند).
  AUTO_VMC_CREATING: در حال ساخت VMC این بازی...
  AUTO_VMC_FAILED: VMC این بازی ساخته نشد. بازی بدون آن شروع می‌شود.
  RIPPS2_BIOS_MUSIC: موسیقی BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'موسیقی منوی این کنسول (قطعه محیطی مرورگر آن، حدود 15 مگابایت به‌صورت WAV) را در پوشه AUDIO‌ای که انتخاب کنید می‌نویسد: کنار RIPPS2، یا پوشه OPL روی یک درایو شروع‌شده. برای کارت حافظه بیش از حد بزرگ است. اندازه آن اول نشان داده می‌شود.'
  SAVE_ICONS: آیکون‌های سه‌بعدی ذخیره
  HINT_SAVE_ICONS: آیکون ذخیره بازی انتخاب‌شده را، در حال چرخش، جایی که پوسته برای آن جا دارد نشان می‌دهد. اول VMC خود بازی و سپس کارت‌های حافظه را می‌خواند.
