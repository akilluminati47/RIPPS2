  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'نصب BIBLE روی هارد داخلی

    - RIPPS2 در %s کپی می‌شود.

    - برنامه راه‌اندازی هارد که اکنون در __mbr است خوانده و در %s/RIPPS2 نگه داشته می‌شود (بازگردانی آن را برمی‌گرداند).

    - بیلد هارد PS2BBL 1.2.0 به جای آن نوشته می‌شود و کنسول طوری تنظیم می‌شود که هنگام روشن شدن آن را اجرا کند.

    - پیکربندی آن (%s) اول RIPPS2 را از %s اجرا می‌کند%s%s و BOOT LOCK روشن است.

    این کار به کنسولی نیاز دارد که از هارد خود راه‌اندازی شود (PS2 چاق با آداپتور شبکه). تا وقتی پیام پایان نیامده، آن را روشن نگه دارید.'
  INTERNAL HDD  (its boot area): هارد داخلی  (ناحیه راه‌اندازی آن)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'بازگرداندن برنامه راه‌اندازی قدیمی هارد

    برنامه‌ای که BIBLE نگه داشته بود (RIPPS2/MBR-BACKUP.KELF روی هارد) به جای BIBLE در __mbr برمی‌گردد. RIPPS2 و پیکربندی PS2BBL سر جایشان می‌مانند.'
