  ', the sounds': ، صداها
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot روشن است. RIPPS2 از درایو خودش (%s) بالا می‌آید: تنظیمات%s و هر فهرست از حافظه پنهان خودش. درایوهای دیگر وقتی در صفحه‌شان SELECT را بزنی یا یکی از بازی‌هایشان را اجرا کنی شروع می‌شوند.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot روشن است. صداها %d KB جا می‌گیرند و کارت حافظه‌ای که RIPPS2 از آن اجرا می‌شود %d KB جای خالی دارد، پس صداها در %s می‌مانند.
  ' (%d KB free)': ' (%d KB خالی)'
  ' (%u MB free)': ' (%u MB خالی)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'کنار RIPPS2: %sAUDIO%s، در شروع اول خوانده می‌شود'
  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- کنسول PS2BBL 1.2.0 را به این کارت پیوند می‌دهد و آن را با نام %s/%s می‌نویسد.
  
    - پیکربندی آن، mc%d:/PS2BBL/CONFIG.INI، RIPPS2 را از همان جایی که هست (%s) بدون انتظار اجرا می‌کند (0 ms، که PS2BBL Extended اجازه نمی‌دهد)، با BOOT LOCK روشن. خود RIPPS2 کپی نمی‌شود.
  
    برای این کار پردازنده ورودی و خروجی دوباره راه می‌افتد و هر خواندنی از درایوها تا پایان کار متوقف می‌شود؛ موسیقی و درایوها بعد از آن برمی‌گردند. تا وقتی که بگوید تمام شد، کارت را بیرون نیاور و کنسول را خاموش نکن.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'کارت SD2PSX یا MMCE ممکن است بعد از رد شدن یک نوشتن از خودش محافظت کند: اگر حالا کارت حافظه یا درایو MMCE دیده نمی‌شود، کنسول را خاموش و روشن کن.'
  BOOT LOCK ON: BOOT LOCK روشن
  'Done: the memory card in slot %d starts what it started before BBL 1.20. BBL 1.20 is kept in mc%d:/%s.': 'انجام شد: کارت حافظه در شکاف %d همان چیزی را اجرا می‌کند که پیش از BBL 1.20 اجرا می‌کرد. BBL 1.20 در mc%d:/%s نگه داشته می‌شود.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
    '
  : 'برای یک کارت حافظه معمولی 8 MB PS2 (کارت MagicGate، یا کارت BOOT از SD2PSX یا MMCE): همان که در شکاف %d است. هنگام روشن شدن، PS2BBL پیکربندی شکاف 2 را پیش از شکاف 1 می‌خواند.
  
    '
  MEMORY CARD IN SLOT %d  (%s): کارت حافظه در شکاف %d  (%s)
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL 1.2.0 نمی‌تواند RIPPS2 را از جایی که الان هست اجرا کند (به کارت‌های حافظه، درایوهای USB و MX4SIO دسترسی دارد)، و RIPPS2 خودش را کپی نمی‌کند. RIPPS2.ELF را روی یک کارت حافظه یا درایو USB بگذار و از آنجا اجرا کن، یا از PS2BBL Extended استفاده کن که MMCE و هارد دیسک را می‌خواند.
  RESTORE SLOT %d'S OLD BOOT LOADER: بازگرداندن بوت‌لودر قدیمی شکاف %d
  ? 'RIPPS2: BBL 1.20 is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BBL 1.20 روی کارت حافظه شکاف %d راه‌اندازی شد (mc%d:/%s/%s)، با BOOT LOCK روشن: هنگام روشن شدن بی‌درنگ RIPPS2 را از %s اجرا می‌کند.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    '
  : 'RIPPS2: در حال راه‌اندازی BBL 1.20
  
    '
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: در حال راه‌اندازی BBL 1.20
  
    RIPPS2 از %s اجرا می‌شود که PS2BBL 1.2.0 نمی‌تواند آن را بخواند (کارت‌های حافظه، USB و MX4SIO را می‌خواند)، و RIPPS2 خودش را کپی نمی‌کند. پیکربندی PS2BBL Extended روی این کارت (%s) آن را می‌خواند: START قفل BOOT LOCK را روشن می‌کند تا هنگام روشن شدن RIPPS2 را از %s اجرا کند. هیچ چیز دیگری روی کارت عوض نمی‌شود.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: در حال راه‌اندازی BBL 1.20
  
    RIPPS2 از %s اجرا می‌شود که PS2BBL 1.2.0 نمی‌تواند آن را بخواند: برنامه‌ها را از کارت حافظه، درایو USB یا MX4SIO اجرا می‌کند، و RIPPS2 خودش را کپی نمی‌کند. RIPPS2.ELF را روی یکی از آن‌ها بگذار (پوشه APPS یک کارت حافظه، یا یک درایو USB)، از آنجا اجرا کن، بعد BIBLE را دوباره راه‌اندازی کن.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    The memory card in slot %d: BBL 1.20 (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: در حال راه‌اندازی BBL 1.20
  
    کارت حافظه در شکاف %d: BBL 1.20 (mc%d:/%s) کنار گذاشته می‌شود و آنچه جایش را گرفته بود (mc%d:/%s) به جای خودش برمی‌گردد. هیچ چیز پاک نمی‌شود. پیکربندی PS2BBL همان‌طور می‌ماند (BOOT LOCK می‌تواند قفل را خاموش کند).'
  'RIPPS2: Setting up BBL 1.20 (binding PS2BBL to the memory card)': 'RIPPS2: در حال راه‌اندازی BBL 1.20 (پیوند دادن PS2BBL به کارت حافظه)'
  'RIPPS2: Setting up BBL 1.20 (putting back what was there)': 'RIPPS2: در حال راه‌اندازی BBL 1.20 (برگرداندن آنچه بود)'
  'RIPPS2: Setting up BBL 1.20 (restarting the I/O processor)': 'RIPPS2: در حال راه‌اندازی BBL 1.20 (راه‌اندازی دوباره پردازنده ورودی و خروجی)'
