  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS در منوی درون بازی هر تقلب بازی را هنگام بازی روشن یا خاموش می‌کند. تغییرات با RESUME اعمال می‌شوند؛ تقلب خاموش‌شده دیگر نمی‌نویسد، آنچه نوشته می‌ماند. Cheats باید برای بازی روشن باشد.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'بدون CHEATS در منوی درون بازی: تقلب‌هایی که پیش از اجرا تیک خورده‌اند مثل قبل در تمام بازی کار می‌کنند.'
