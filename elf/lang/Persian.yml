  'Boot sound On: from the AUDIO folder, once its drive is up': 'صدای راه‌اندازی روشن: از پوشه AUDIO، وقتی درایوش آماده شد'
  Boot sound off (Audio settings > Boot Sound): صدای راه‌اندازی خاموش (تنظیمات صدا > صدای راه‌اندازی)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: boot.adp را کنار RIPPS2 روی کارت حافظه‌ای که از آن شروع می‌شود کپی می‌کند، جایی که راه‌اندازی آن را پیش از آماده شدن هر درایوی می‌خواند.
  '%s could not be written.': '%s نوشته نشد.'
  '%s is there already and could not be put aside, so it was left as it was.': '%s از قبل هست و نشد کنار گذاشته شود، پس همان‌طور که بود ماند.'
