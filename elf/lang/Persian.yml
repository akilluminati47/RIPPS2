  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 موسیقی منوی این کنسول، قطعه محیطی مرورگر آن (%d:%02d)، را از نت‌های خود BIOS می‌نوازد و آن را به‌صورت یک WAV به حجم %s در %s می‌نویسد؛ هیچ کارت حافظه‌ای جای آن را ندارد. %s موجود در آنجا جایگزین می‌شود. یکی دو دقیقه طول می‌کشد.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 صداها را از BIOS خود این کنسول می‌خواند و آن‌ها را به‌عنوان صداهای خودش در %s می‌نویسد: نشانگر، تأیید، لغو، صفحه‌ها، دسته، پیام‌ها، دیسک، خطا، ذخیره، درایوها و تصادفی، و موسیقی راه‌اندازی و اجرای بازی، که از نت‌های خود BIOS نواخته می‌شوند. فایل‌هایی با همین نام‌ها که از قبل آنجا هستند جایگزین می‌شوند.'
