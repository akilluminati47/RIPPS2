  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'آنچه آنجا بود در RIPPS2/MBR-BACKUP.KELF روی هارد نگه داشته می‌شود: بوت‌لودر > مدیریت > بازگردانی آن را برمی‌گرداند.'
