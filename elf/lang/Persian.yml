  ? 'Download the covers in HD (280 x 400)? Sharper on an HD screen, about 70 KB each. START: Standard (140 x 200, as Open PS2 Loader''s), about 20 KB each. A game that already has a cover keeps it.'
  : 'جلدها با کیفیت HD (280 x 400) دانلود شوند؟ روی صفحه HD واضح‌تر، هر کدام حدود 70 KB. START: استاندارد (140 x 200، مثل Open PS2 Loader)، هر کدام حدود 20 KB. بازی‌ای که جلد دارد آن را نگه می‌دارد.'
  STANDARD: استاندارد
