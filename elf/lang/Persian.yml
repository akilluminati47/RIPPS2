  BIBLE ran out of memory before it started. Nothing was changed.: حافظه BIBLE پیش از شروع تمام شد. چیزی تغییر نکرد.
  BIBLE ran out of memory. Nothing on the memory card was changed.: حافظه BIBLE تمام شد. چیزی روی کارت حافظه تغییر نکرد.
