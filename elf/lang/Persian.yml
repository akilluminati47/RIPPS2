  : ' یک کارت حافظه در اینجا PS2BBL/CONFIG.INI خودش را دارد که PS2BBL پیش از پیکربندی هارد می‌خواند: آن کارت را هنگام روشن کردن بیرون بیاورید، یا RIPPS2 را از کارت اجرا کنید و دوباره نصب کنید.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' هنگام روشن کردن، مثلث را برای مرورگر و START را برای دیسک نگه دارید.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' مثلث را برای مرورگر و START را برای دیسک نگه دارید. پیکربندی: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL 1.2.0 set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 می‌تواند BIBLE، یعنی PS2BBL 1.2.0 تنظیم‌شده برای اجرای RIPPS2، را روی کارت حافظه نصب کند؛ آنچه اکنون از آن اجرا می‌شود در یک پوشه پشتیبان نگه داشته می‌شود. BIBLE نصب شود؟'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' برنامه راه‌اندازی قدیمی هارد نگه داشته می‌شود (مدیریت > بازگردانی).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' کنسول تنظیمی را که هارد آن را هنگام روشن شدن اجرا می‌کند نپذیرفت: آن را با ابزار هارد تنظیم کنید، یا دوباره نصب کنید.'
  ' What was there before is kept in mc%d:/%s%s.': ' آنچه پیش‌تر آنجا بود در mc%d:/%s%s نگه داشته می‌شود.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' پیکربندی PS2BBL خود شما حفظ شد (%s) و BOOT LOCK در آن تنظیم شد: دکمه‌هایش همان‌اند که شما تنظیم کرده‌اید.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' پیکربندی PS2BBL خود شما حفظ شد و BOOT LOCK در آن تنظیم شد.'
