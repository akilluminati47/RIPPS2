  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : روشن (سریع) صدای راه‌اندازی را کنار RIPPS2 روی کارت حافظه‌ای که از آن شروع می‌شود نگه می‌دارد، و RIPPS2 از کارت شروع نشده. صدای راه‌اندازی مثل روشن پخش می‌شود.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'هنوز صدای راه‌اندازی‌ای برای کپی نیست: تنظیمات صدا > صداهای BIOS صداهای این کنسول را استخراج می‌کند.'
  ? This is RIPPS2 lite, which carries no PS2BBL, so it cannot set up BIBLE. The full RIPPS2.elf installs and repairs it; a boot loader already set up keeps starting RIPPS2 lite as it is.
  : این RIPPS2 lite است که PS2BBL ندارد، پس نمی‌تواند BIBLE را راه بیندازد. RIPPS2.elf کامل آن را نصب و تعمیر می‌کند؛ بارگذار راه‌اندازی که از قبل نصب شده همچنان RIPPS2 lite را اجرا می‌کند.
