  ? 'This game starts through Neutrino, and RIPPS2 found none: not at Settings'' path, on the game''s drive, on the memory cards or on any started drive. RIPPS2 carries Neutrino by rickgaiser (AFL-3.0), its newest build: install it once, where you pick, and every Neutrino game uses it from there.'
  : 'این بازی از طریق Neutrino شروع می‌شود و RIPPS2 هیچ نسخه‌ای پیدا نکرد: نه در مسیر تنظیمات، نه روی درایو بازی، نه روی کارت‌های حافظه و نه روی هیچ درایو شروع‌شده‌ای. RIPPS2 تازه‌ترین نسخه Neutrino ساخته rickgaiser را همراه دارد (AFL-3.0): آن را یک بار، هر جا که خواستید، نصب کنید و هر بازی Neutrino از همان‌جا از آن استفاده می‌کند.'
