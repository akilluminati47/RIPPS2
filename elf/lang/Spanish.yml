  AUTO_VMC_CREATING: Creando la VMC de este juego...
  AUTO_VMC_FAILED: No se pudo crear la VMC de este juego. El juego se inicia sin ella.
  RIPPS2_BIOS_MUSIC: Música de la BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'Guarda la música del menú de esta consola (la pieza ambiental de su navegador, unos 15 MB en WAV) en la carpeta AUDIO que elijas: junto a RIPPS2, o la de OPL en una unidad iniciada. Demasiado grande para una tarjeta de memoria. Primero se muestra su tamaño.'
  SAVE_ICONS: Iconos de partida en 3D
