  HINT_RIPPS2_CATEGORY_ORDER: 'Intercambia Iniciar disco y Archivos de memoria: Archivos de memoria primero e Iniciar disco al final, tanto en los nombres de la barra como en los iconos de la barra lateral. Pensado para RIPFLOW (Interfaz > Tema). Tema: decide el tema.'
