  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino no puede usar una VMC en el disco duro APA (exFAT, USB y MX4SIO sí): este juego se inicia con la tarjeta real en esa ranura.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'El arranque solo lee la unidad de RIPPS2: la configuración y los sonidos junto a RIPPS2.ELF (RIPPS2.FB allí dice dónde) y cada lista desde su caché. Las demás unidades esperan: SELECT en una página inicia sus unidades y trae sus imágenes (con la actualización automática se inician al arrancar). Activarlo copia tus sonidos, y la música si hay espacio, a AUDIO junto a RIPPS2.'
  RIPPS2_ART_PACK: Paquete ART
  RIPPS2_ART_PACK_BUILD: Crear o quitar
  HINT_RIPPS2_ART_PACK: Junta la carpeta ART de cada unidad iniciada en un solo art.tar en la unidad que elijas (la más rápida se ofrece primero). Las carátulas se cargan entonces de un archivo con un índice, nunca con una búsqueda por juego, y los menús y la música van fluidos. Las carpetas ART quedan como están.
  RIPPS2_LIST_CFG_TEXT: Título y descripción en la lista
  HINT_RIPPS2_LIST_CFG_TEXT: 'El título y la descripción del juego de su CFG junto a la lista. Tema: como el tema los muestre (el tema propio de RIPPS2 los oculta). La página de información los conserva siempre.'
  RIPPS2_PS1_PREFER: Duplicados de PS1
  HINT_RIPPS2_PS1_PREFER: 'Un juego de PS1 que es a la vez un VCD de POPSTARTER y una imagen de Ember. Ambos: dos filas. Ember: solo la de Ember. POPSTARTER: solo el VCD. El mismo título, sin la ID de disco delante, es el mismo juego.'
  RIPPS2_MY_PADS: Mis mandos
  HINT_RIPPS2_MY_PADS: 'Los perfiles .pad de la carpeta PADS junto a RIPPS2: un archivo de texto por mando USB, con el nombre de su ID (2563_0575.pad), y cada uno comprobado. Un mando con perfil maneja el menú y juega en los juegos (Pad Emulator activado).'
  RIPPS2_PAD_SETUP: Configurar un mando USB
  HINT_RIPPS2_PAD_SETUP: Conecta un mando USB que RIPPS2 no conozca, pulsa cada botón que te pida y RIPPS2 escribe su .pad en PADS. SELECT en tu mando de PS2 omite un botón.
