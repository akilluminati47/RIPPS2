# RIPPS2 in Spanish. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Spanish
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE: INSTALAR, ACTUALIZAR O RESTAURAR"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "ACTUALIZAR BIBLE: LA RANURA %d TIENE UNO MÁS ANTIGUO"
  "Background": "Fondo"
  "Sky": "Cielo"
  "Black": "Negro"
  "Splash": "Pantalla inicial"
  "Logo": "Logotipo"
  "Logo and Names": "Logotipo y nombres"
  "Button Glyphs": "Símbolos de botones"
  "Face Buttons": "Botones de acción"
  "All Sixteen": "Los dieciséis"
  "Info Line": "Línea de información"
  "Power-on Wait": "Espera al encender"
  "%s, path %d": "%s, ruta %d"
  "A BIBLE COMMAND": "UN COMANDO DE BIBLE"
  "ARGUMENTS": "ARGUMENTOS"
  "Argument %d": "Argumento %d"
  "Arguments: %s": "Argumentos: %s"
  "Auto (no button held)": "Auto (sin botón pulsado)"
  "BIBLE hands these to the program, in this order.": "BIBLE se los pasa al programa en este orden."
  "BIBLE has no way to reach that drive. Choose a program on another one, or type the path.": "BIBLE no puede llegar a esa unidad. Elige un programa en otra o escribe la ruta."
  "BIBLE keeps this key from PS2BBL, but nothing in this build acts on it, so it changes nothing yet.": "BIBLE conserva esta clave de PS2BBL, pero nada en esta versión la usa, así que todavía no cambia nada."
  "BIBLE needs at least one path in its settings, or it starts in its rescue mode, so this one stays.": "BIBLE necesita al menos una ruta en sus ajustes, o arranca en modo de rescate, así que esta se queda."
  "BIBLE's Settings": "Ajustes de BIBLE"
  "BIBLE's credits": "Créditos de BIBLE"
  "BOOT LOCK holds this line. Turn BOOT LOCK off to change it.": "BOOT LOCK mantiene esta línea. Desactiva BOOT LOCK para cambiarla."
  "Binds the BIBLE RIPPS2 carries to a memory card, writes it over the one there, or puts back what it replaced.": "Vincula el BIBLE que lleva RIPPS2 a una tarjeta de memoria, lo escribe sobre el que hay o devuelve lo que sustituyó."
  "Boot Sound": "Sonido de arranque"
  "CHOOSE A PROGRAM": "ELIGE UN PROGRAMA"
  "CHOOSE AN ELF": "ELIGE UN ELF"
  "Choose a program from your drives, type a path, or pick one of BIBLE's commands. BIBLE tries the paths in order and starts the first it finds.": "Elige un programa de tus unidades, escribe una ruta o elige un comando de BIBLE. BIBLE prueba las rutas en orden e inicia la primera que encuentra."
  "Follow Color Theme": "Seguir el tema de color"
  "How long BIBLE waits for a button before the Auto path. At 0 ms a button held from power on still works. A boot sound beside BIBLE is read first: about 2 s at 0 ms.": "Cuánto espera BIBLE un botón antes de la ruta Auto. A 0 ms, un botón pulsado desde el encendido sigue funcionando. Un sonido de arranque junto a BIBLE se lee primero: unos 2 s a 0 ms."
  "Launch Keys": "Teclas de inicio"
  "Launch Keys: %s": "Teclas de inicio: %s"
  "On shows a disc's game ID on screen as it starts, for RetroGEM video mods.": "Activado muestra el ID del juego del disco en pantalla al iniciar, para mods de vídeo RetroGEM."
  "On shows a program's game ID on screen as it starts, for RetroGEM video mods. It is up to 11 characters from the file name.": "Activado muestra el ID del programa en pantalla al iniciar, para mods de vídeo RetroGEM. Hasta 11 caracteres del nombre del archivo."
  "On stops the disc at a launch and waits for the drive to answer. Off skips that wait, about 3 s in the lab, and a disc in the tray keeps spinning.": "Activado detiene el disco al iniciar y espera la respuesta de la unidad. Desactivado se salta esa espera, unos 3 s en el laboratorio, y el disco en la bandeja sigue girando."
  "Opens the file itself in the text editor, comments and all. Every change here keeps the other lines as they are.": "Abre el propio archivo en el editor de texto, con sus comentarios. Cada cambio aquí deja las demás líneas como están."
  "Path %d": "Ruta %d"
  "Shows the countdown, the clock and the console's details on the splash.": "Muestra la cuenta atrás, el reloj y los datos de la consola en la pantalla de inicio."
  "Sky Color": "Color del cielo"
  "TYPE A PATH": "ESCRIBE UNA RUTA"
  "The button pictures under the logo: none, the four face buttons, or all sixteen.": "Las imágenes de botones bajo el logo: ninguna, los cuatro botones de acción o los dieciséis."
  "The console's browser": "El navegador de la consola"
  "The disc in the tray": "El disco en la bandeja"
  "The disc, without the PS2 logo": "El disco, sin el logo de PS2"
  "The name BIBLE's splash shows for this button.": "El nombre que la pantalla de BIBLE muestra para este botón."
  "The same setting as in Audio. On (fast) keeps a copy on the memory card, so the sound starts with the first frame. Off is the fastest boot.": "El mismo ajuste que en Audio. Activado (rápido) guarda una copia en la tarjeta de memoria, así el sonido empieza con el primer fotograma. Desactivado es el arranque más rápido."
  "The shape of BIBLE's splash. Auto follows RIPPS2's Widescreen when its settings are on a memory card.": "La forma de la pantalla de BIBLE. Auto sigue la pantalla ancha de RIPPS2 cuando sus ajustes están en una tarjeta de memoria."
  "The signal BIBLE starts in. Auto uses RIPPS2's Video Mode when its settings are on a memory card, and the console's own mode when they are not.": "La señal con la que arranca BIBLE. Auto usa el modo de vídeo de RIPPS2 cuando sus ajustes están en una tarjeta de memoria, si no el de la propia consola."
  "The sky on BIBLE's splash. Follow Color Theme uses the sky RIPPS2 saves with its settings. A color named here stays, whatever the theme.": "El cielo en la pantalla de BIBLE. Seguir el tema de color usa el cielo que RIPPS2 guarda con sus ajustes. Un color elegido aquí se queda, sea cual sea el tema."
  "This BIBLE (%s build) does not read this drive, so it moves on to the next path.": "Este BIBLE (versión %s) no lee esta unidad, así que pasa a la siguiente ruta."
  "What BIBLE shows while it waits for a button: nothing, its logo, or its logo with the name of what each button starts.": "Lo que muestra BIBLE mientras espera un botón: nada, su logo o su logo con el nombre de lo que inicia cada botón."
  "What BIBLE starts when no button is held at power on.": "Lo que inicia BIBLE cuando no hay ningún botón pulsado al encender."
  "What BIBLE starts when this button is held at power on. L2 + R2 held at power on shows BIBLE's own page of them all.": "Lo que inicia BIBLE cuando este botón está pulsado al encender. L2 + R2 al encender muestran la página de BIBLE con todos."
  "What each button starts at power on, each with up to ten paths chosen from your drives.": "Lo que inicia cada botón al encender, cada uno con hasta diez rutas elegidas de tus unidades."
  "What stands behind BIBLE's logo. Auto shows the sky when Sky Color is set or RIPPS2's settings are on a memory card, and black when they are not.": "Lo que hay detrás del logo de BIBLE. Auto muestra el cielo si Color del cielo está definido o los ajustes de RIPPS2 están en una tarjeta de memoria, si no negro."
  "When a button starts a disc and the tray is empty, On opens the tray for you.": "Cuando un botón inicia un disco y la bandeja está vacía, Activado abre la bandeja por ti."
  "Eject Tray at Launch": "Expulsar la bandeja al iniciar"
  "Read Console History": "Leer el historial de la consola"
  "Game ID for Apps": "ID de juego para aplicaciones"
  "Game ID for Discs": "ID de juego para discos"
  "File name (as it appears in your games list)": "Nombre del archivo (como aparece en tu lista de juegos)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "Esta lista muestra juegos de otras unidades. Cambia el nombre de un juego en la página de su unidad."
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "Un juego con estrella no se puede renombrar. Quítale la estrella (R3), cámbiale el nombre y vuelve a ponérsela."
  "This drive cannot rename its files. The details can still be set.": "Esta unidad no puede cambiar el nombre de sus archivos. Los detalles se pueden definir igualmente."
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "En un disco APA el nombre de un juego de PS2 está en la tabla de particiones, así que no se puede cambiar aquí. Los detalles se pueden definir igualmente."
  "Renames the app in your list. Its ELF and its art keep their names.": "Cambia el nombre de la aplicación en tu lista. Su ELF y sus imágenes conservan sus nombres."
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "Cambia el nombre del juego en su unidad. Los juegos de PS1 buscan sus imágenes y ajustes por nombre, así que RIPPS2 también los renombra. Las imágenes de un ART Pack requieren crear el paquete de nuevo."
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "Cambia el nombre del archivo del juego en su unidad. Los juegos de PS2 buscan sus imágenes y ajustes por el ID del juego, así que no se pierde nada."
  "Stop Disc at Launch": "Detener el disco al iniciar"
  "EDIT BIBLE'S SETTINGS FILE": "EDITAR EL ARCHIVO DE AJUSTES DE BIBLE"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "No se pudo escribir el archivo de ajustes de BIBLE (%s). Comprueba que la tarjeta de memoria está puesta y tiene espacio, y vuelve a intentarlo."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "No se encontró el archivo de ajustes de BIBLE (%s). BIBLE: INSTALAR, ACTUALIZAR O RESTAURAR escribe uno."
  "Boot sound On (fast): %s, handed over by BIBLE": "Sonido de inicio Activado (rápido): %s, entregado por BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: el fork de PS2BBL Extended de akilluminati47, cada versión firmada por akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "su imagen IOPRP vincula BIBLE a tu tarjeta (GPL-3): la consola hace el cifrado, sin claves"
  "KELFBinder by El Isra": "KELFBinder de El Isra"
  "source: github.com/akilluminati47/BIBLE": "código fuente: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "RANURA 0: %s\nRANURA 1: %s\n%s\nRIPPS2: instalando BIBLE. BIBLE, el cargador de arranque de akilluminati47 basado en PS2BBL de El Isra, instalado por RIPPS2 en una tarjeta de memoria PS2 estándar de 8 MB o en el disco duro interno: un inicio de 0 ms al encender (PS2BBL Extended no permite 0), RIPPS2 primero desde donde está (nunca se copia), y un botón mantenido al encender sigue llevando al navegador (TRIANGLE), a un disco (START) y a lo que había antes (CIRCLE). ¿Instalarlo, repararlo o restaurar lo que reemplazó?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: instalando BIBLE\nLa tarjeta de la ranura %d es una tarjeta SD2PSX o MMCE. Su tarjeta BOOT puede llevar BIBLE en lugar del PS2BBL que tiene (ese se aparta antes, entero), si la consola le vincula BIBLE. Si se rechaza el vínculo, no cambia nada en la tarjeta, y la tarjeta puede dejar de responder hasta que la consola se apague y se encienda. START le vincula BIBLE."
  "BIND BIBLE": "VINCULAR BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT junto a RIPPS2 tiene lo que dijo la tarjeta.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Para una tarjeta de memoria PS2 estándar de 8 MB (una MagicGate, o una tarjeta BOOT de SD2PSX o MMCE): la de la ranura %d. Al encender, PS2BBL lee la configuración de la ranura 1 antes que la de la ranura 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "La consola no quiso vincular BIBLE a la tarjeta de memoria de la ranura %d (falló su paso MagicGate). No se cambió nada en la tarjeta. Una tarjeta que no sea original o compatible con MagicGate no puede contener una actualización del sistema."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Una tarjeta SD2PSX o MMCE puede dejar de responder tras un vínculo rechazado: si ahora falta la tarjeta de memoria o la unidad MMCE, apaga y enciende la consola."
  "RIP THIS CONSOLE'S AUDIO": "EXTRAER EL AUDIO DE ESTA CONSOLA"
  "sounds or music, from its BIOS": "sonidos o música, de su BIOS"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Abre los Ajustes de audio en Sonidos de la BIOS y Música de la BIOS: extrae los sonidos de esta consola o la música de su menú a AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Sonido de inicio Activado (rápido): %s en la tarjeta de memoria, al subir los pilares"
  "Boot sound On: %s on the memory card, as the pillars rise": "Sonido de inicio Activado: %s en la tarjeta de memoria, al subir los pilares"
  "Boot sound On: %s, once its drive is up": "Sonido de inicio Activado: %s, cuando su unidad está lista"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Este juego se inicia con Neutrino y RIPPS2 no encontró ninguno: ni en la ruta de Ajustes, ni en la unidad del juego, ni en las tarjetas de memoria, ni en ninguna unidad iniciada. Pon el Neutrino de rickgaiser (github.com/rickgaiser/neutrino) en una carpeta neutrino en la unidad del juego o en una tarjeta de memoria, o apunta Inicio de juegos > Neutrino a él."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Dónde está tu Neutrino, su modo de vídeo y los argumentos que recibe cada inicio con Neutrino. Consigue Neutrino en github.com/rickgaiser/neutrino y ponlo en una carpeta neutrino en una unidad o tarjeta de memoria."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Este Neutrino es anterior a 1.3, que no puede iniciar juegos desde el disco duro APA. Apunta Inicio de juegos > Neutrino a Neutrino 1.3 o posterior."
  "with rickgaiser's Neutrino as its second game core,": "con el Neutrino de rickgaiser como su segundo núcleo de juego,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "el segundo núcleo de juego, usado desde tu unidad o tarjeta de memoria (AFL-3.0)"
  "FILE NAME": "NOMBRE DE ARCHIVO"
  "GAME LIST": "LISTA DE JUEGOS"
  "%s in %s": "%s en %s"
  "Write Operations are off, so RIPPS2 cannot save a game's details or rename it. Turn them on?": "Las operaciones de escritura están desactivadas, así que RIPPS2 no puede guardar los datos de un juego ni renombrarlo. ¿Activarlas?"
