  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK puso RIPPS2 el primero en el menú de OSDMenu (%s). OSDMenu no inicia nada por sí mismo: elige RIPPS2 allí, y el EXIT de un juego vuelve a ese menú. Para una consola que inicie RIPPS2 al momento, BIBLE pone PS2BBL en una tarjeta de memoria (Cargador de arranque).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK funciona a través de un cargador de arranque en una tarjeta de memoria (PS2BBL, FMCB u OSDMenu), y aquí no hay ninguno.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: La tarjeta de memoria de la ranura %d inicia %s al encender, y BOOT LOCK no encontró ninguna configuración suya que cambiar (busca %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'La tarjeta de memoria de la ranura %d inicia %s al encender, que BOOT LOCK no puede ajustar: funciona a través de PS2BBL, FMCB y OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: En esta consola hay un cargador de arranque con el bloqueo de RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT de un juego: el navegador, luego tu cargador de arranque (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'En uso: %s, %d imágenes, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Midiendo qué tan rápido lee cada unidad sus imágenes: %s'
  'None: each picture is read from its own ART folder.': 'Ninguno: cada imagen se lee de su propia carpeta ART.'
  REMOVE the pack in %s (the ART folders stay as they are): QUITAR el paquete de %s (las carpetas ART quedan como están)
  Remove the ART Pack in %s? The ART folders stay as they are.: ¿Quitar el paquete ART de %s? Las carpetas ART quedan como están.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Detenido. Se quitó el paquete sin terminar, y las imágenes se cargan de las carpetas ART como antes.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'No se pudo escribir el paquete ART en %s (¿hay espacio en esa unidad?). Nada más cambió: las imágenes se cargan de las carpetas ART como antes.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Se quitó el paquete ART de %s. Las imágenes vuelven a cargarse de las carpetas ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : No hay ninguna carpeta ART con imágenes en las unidades iniciadas. Inicia las unidades donde están tus imágenes (SELECT en su página) y luego vuelve.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d imágenes de %d carpetas ART van a un solo archivo, %s. Las carpetas ART quedan como están: el paquete es una copia. Puedes copiar art.tar a la carpeta ART de otra unidad con Memory Files, pero crearlo en la unidad desde la que navegas es lo más rápido, por eso la unidad más rápida aparece primero. ¿Crearlo ahora?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'El paquete ART está listo: %d imágenes, %d MB, en %s (%d s). Las imágenes se cargan de él a partir de ahora, y a los %d juegos para los que se creó nunca se les pregunta a su carpeta ART imagen por imagen. Las imágenes que RIPPS2 descarga o captura aparecen al momento; las que copias desde un PC aparecen cuando vuelves a crear el paquete.'
  '%s free': '%s libres'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: lee %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: lee %s/s, la más rápida, %s'
  ART PACK: PAQUETE ART
  About %d min: Unos %d min
  'Looking at the ART folders: %d pictures, %s': 'Revisando las carpetas ART: %d imágenes, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 'Ninguna unidad iniciada tiene espacio para el paquete ART: necesita unos %s. Libera espacio en la unidad desde la que navegas y vuelve a intentarlo.'
  PACKING THE ART: EMPAQUETANDO LAS IMÁGENES
  PICTURE %d OF %d: IMAGEN %d DE %d
  'Pictures: %d (%s). ART folders: %d.': 'Imágenes: %d (%s). Carpetas ART: %d.'
  Stop? The unfinished pack is removed; the ART folders stay as they are.: ¿Detener? Se quita el paquete sin terminar; las carpetas ART quedan como están.
  'The ART folders stay as they are: the pack is a copy.': 'Las carpetas ART quedan como están: el paquete es una copia.'
  Under a minute: Menos de un minuto
  free space unknown: espacio libre desconocido
  'A game''s EXIT: the browser, or your boot loader when one is installed': 'EXIT de un juego: el navegador, o tu cargador de arranque si hay uno instalado'
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): Ogg Vorbis de Xiph.Org (BSD), minimp3 de lieff (CC0)
  RIPFLOW's type, and every message and notification: la letra de RIPFLOW, y la de cada mensaje y aviso
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Gracias a todos los que prueban en Discord y abren issues en GitHub:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'El IGR Path %s no se usa: tras un juego solo puede cargarse un archivo de una tarjeta de memoria o USB, y nunca el propio RIPPS2'
  an issue is the best way to get RIPPS2 updated.: una issue es la mejor forma de que RIPPS2 se actualice.
  your Ogg and MP3 music, as RIPPS2 plays it: tu música Ogg y MP3, tal como la reproduce RIPPS2
  Pop In and Name: Emergente y nombre
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s arranca después de los pilares, así que el sonido de inicio suena tarde. START copia boot.adp (%d KB) junto a RIPPS2 en la tarjeta de memoria (%d KB libres), donde suena mientras se alzan los pilares.'
  The boot sound could not be copied to %s. It still plays from %s.: No se pudo copiar el sonido de inicio a %s. Sigue sonando desde %s.
  Zoom: Zoom
  '%s could not be deleted; it stays as it was.': No se pudo borrar %s; queda como estaba.
  '%s could not be read as a .tar archive. Nothing was changed.': No se pudo leer %s como archivo .tar. No se cambió nada.
  '%s is deleted. %s is kept.': '%s está borrado. %s se conserva.'
  Art loads from it from now on.: Las imágenes se cargan de él a partir de ahora.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : '¿Borrar el .tar fusionado?
  
    SE BORRA: %s
  
    SE CONSERVA: %s (el destino, ahora con todas las imágenes de los dos)'
  Into %s (%s): En %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : 'SE CONSERVA y se actualiza: %s (%d imágenes)
  
    SE FUSIONA: %s (%d imágenes)
  
    Imágenes en los dos: %d. Gana la del fusionado. El .tar conservado se escribe de nuevo como un archivo nuevo y solo se cambia cuando está completo, así que una parada o una unidad llena lo dejan como estaba. ¿Fusionar ahora?'
  MERGE .TAR: FUSIONAR .TAR
  MERGE a .tar into the pack in %s: FUSIONAR un .tar en el paquete de %s
  MERGING THE ART: FUSIONANDO LAS IMÁGENES
  Merge in %s (%s): Fusionar %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: ¿Fusionar el paquete nuevo en otro .tar? Después eliges el .tar que se conserva y se actualiza; las imágenes del paquete nuevo van a él.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Fusionado: %s ahora tiene %d imágenes (%d MB), %d s.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Imágenes que entran: %d (%s). Mismo nombre en los dos: %d (gana la del fusionado).'
  'Reading the archives: %s': 'Leyendo los archivos: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: ¿Parar? El .tar conservado queda como estaba; se quita la copia sin terminar.
  Stopped. %s is as it was; the unfinished copy was removed.: Parado. %s está como estaba; se quitó la copia sin terminar.
  The kept .tar is only replaced once the merged copy is whole.: El .tar conservado solo se sustituye cuando la copia fusionada está completa.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: No se pudo escribir la fusión en la unidad de %s (¿hay espacio?). Está como estaba; no cambió nada más.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : La fusión necesita unos %s libres en la unidad de %s (el archivo nuevo se escribe primero junto al viejo). Libera algo de espacio y vuelve a intentarlo.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'La fusión se detuvo entre dos cambios de nombre: el .tar conservado es %s y el fusionado %s. Devuélveles el nombre con Archivos de memoria.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : El .tar fusionado se escribió pero no pudo tomar el nombre %s (una MMCE cambia nombres desde el firmware 1.4.0). Se quitó el archivo nuevo; el .tar conservado está como estaba.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : No hay otro .tar que fusionar en %s. Ponlo en esta carpeta, en la carpeta ART de una unidad o en la raíz de una unidad y vuelve a intentarlo.
  MERGE A .TAR INTO THIS: FUSIONAR UN .TAR AQUÍ
  ? '
  
    %d game button maps in GAMES'
  : '
  
    %d asignaciones de botones de juegos en GAMES'
  ? '
  
    1 game button map in GAMES'
  : '
  
    1 asignación de botones de juego en GAMES'
  (no name): (sin nombre)
  Both: Ambos
  ? 'None yet. A profile is a text file named after the pad''s ID, like 2563_0575.pad: the format is in RIPPS2''s repo (docs/plans/pad-spec.md).'
  : 'Ninguno aún. Un perfil es un archivo de texto con el nombre de la ID del mando, como 2563_0575.pad: el formato está en el repositorio de RIPPS2 (docs/plans/pad-spec.md).'
  On (fast): Activado (rápido)
  'Pad profiles in %s:': 'Perfiles de mando en %s:'
  RIPPS2 cannot tell where its folder is, so it cannot look for PADS.: RIPPS2 no sabe dónde está su carpeta, así que no puede buscar PADS.
  could not be read: no se pudo leer
  About %d seconds left: Quedan unos %d segundos
  About 1 second left: Queda 1 segundo
  Taking longer than its last start (%d s so far): Tarda más que su último arranque (%d s hasta ahora)
  ? 'Download the covers in HD (280 x 400)? Sharper on an HD screen, about 70 KB each. START: Standard (140 x 200, as Open PS2 Loader''s), about 20 KB each. A game that already has a cover keeps it.'
  : '¿Descargar las carátulas en HD (280 x 400)? Más nítidas en una pantalla HD, unos 70 KB cada una. START: Estándar (140 x 200, como Open PS2 Loader), unos 20 KB cada una. Un juego que ya tiene carátula la conserva.'
  STANDARD: ESTÁNDAR
  '%d IN': '%d DENTRO'
  '%d IN, %d REPLACED': '%d DENTRO, %d REEMPLAZADOS'
  COULD NOT WRITE: NO SE PUDO ESCRIBIR
  'Getting it ready: %s': 'Preparando: %s'
  NOT A .TAR: NO ES UN .TAR
  NOTHING CHANGED: NADA CAMBIADO
  NOTHING TO PUT IN: NADA QUE AÑADIR
  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : Activado (rápido) guarda el sonido de inicio junto a RIPPS2 en la tarjeta de memoria desde la que arranca, y RIPPS2 no arrancó desde una. El sonido de inicio suena como Activado.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'Aún no hay sonido de inicio que copiar: Ajustes de audio > Sonidos de la BIOS extrae los de esta consola.'
  '%d COPIED OUT': '%d COPIADOS FUERA'
  '%d ITEM   %d MARKED   %s': '%d ELEMENTO   %d MARCADO   %s'
  '%d ITEM   %d MARKED   %s   %s FREE': '%d ELEMENTO   %d MARCADO   %s   %s LIBRE'
  '%d ITEMS   %d MARKED   %s': '%d ELEMENTOS   %d MARCADOS   %s'
  '%d ITEMS   %d MARKED   %s   %s FREE': '%d ELEMENTOS   %d MARCADOS   %s   %s LIBRE'
  '%s IN %d': '%s EN %d'
  '%s IN %d, %s FREE': '%s EN %d, %s LIBRE'
  ', %d LEFT OUT': ', %d FUERA'
  COPY IT OUT TO OPEN IT: CÓPIALO FUERA PARA ABRIRLO
  'Copying out: %s': 'Copiando fuera: %s'
  INVERT MARKS: INVERTIR MARCAS
  NO FILES ON THE CLIPBOARD: NO HAY ARCHIVOS EN EL PORTAPAPELES
  SIZE AND FREE SPACE: TAMAÑO Y ESPACIO LIBRE
  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS en el menú del juego activa o desactiva cada truco del juego mientras juegas. Los cambios se aplican en RESUME; un truco desactivado deja de escribir, lo que escribió se queda. Necesita los Cheats activados para el juego.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Sin CHEATS en el menú del juego: los trucos marcados antes del inicio funcionan todo el juego, como antes.'
  BOOT SOUND WITH THE PILLARS: SONIDO DE INICIO CON LOS PILARES
  'Boot Sound: On (fast)': 'Sonido de inicio: Activado (rápido)'
  'Boot sound On: from the AUDIO folder, once its drive is up': 'Sonido de inicio Activado: desde la carpeta AUDIO, cuando su unidad está lista'
  Boot sound off (Audio settings > Boot Sound): Sonido de inicio desactivado (Ajustes de audio > Sonido de inicio)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: Copia boot.adp junto a RIPPS2 en la tarjeta de memoria desde la que arranca, donde el inicio lo lee antes de que una unidad esté lista.
  '%s could not be written.': No se pudo escribir %s.
  '%s is there already and could not be put aside, so it was left as it was.': '%s ya existe y no se pudo apartar, así que se dejó como estaba.'
  Circle: Círculo
  Cross: Equis
  Down: Abajo
  Down on the d-pad: Abajo en la cruceta
  Found %04X:%04X. Let go of everything on it, sticks too, and wait.: Encontrado %04X:%04X. Suelta todo en él, también los sticks, y espera.
  Got it. Let go.: Hecho. Suelta.
  L3 (press the left stick in): L3 (pulsa el stick izquierdo)
  Left on the d-pad: Izquierda en la cruceta
  Nothing was set up, so no file was written.: No se configuró nada, así que no se escribió ningún archivo.
  ? Plug in the USB pad you want to set up. If it is in already, take it out and plug it in again. Then press any button on it once.
  : Conecta el mando USB que quieres configurar. Si ya está conectado, desconéctalo y vuelve a conectarlo. Luego pulsa una vez cualquier botón.
  Press %s on the USB pad and hold it.: Pulsa %s en el mando USB y mantenlo.
  Push %s and hold it.: Mueve %s y mantenlo.
  R3 (press the right stick in): R3 (pulsa el stick derecho)
  Right on the d-pad: Derecha en la cruceta
  Save: Guardar
  Saved as %s. The pad now steers the menu, and plays in games with the Pad Emulator on.: Guardado como %s. El mando ya maneja el menú y juega en los juegos con el Pad Emulator activado.
  Skip: Omitir
  Square: Cuadrado
  This pad cannot be described in a .pad yet (%s), so no file was written.: Este mando aún no se puede describir en un .pad (%s), así que no se escribió ningún archivo.
  Triangle: Triángulo
  'Try it. What you hold shows here:': 'Pruébalo. Lo que mantengas pulsado aparece aquí:'
  Up: Arriba
  Up on the d-pad: Arriba en la cruceta
  the left stick down: el stick izquierdo hacia abajo
  the left stick to the right: el stick izquierdo hacia la derecha
  the right stick down: el stick derecho hacia abajo
  the right stick to the right: el stick derecho hacia la derecha
labels:
  HINT_NEUTRINO_AUTO_ELF: Pasa el ELF de arranque del juego a Neutrino para buscar su configuración por título. Activado por defecto; una opción Boot ELF puesta a mano tiene prioridad.
  HINT_POPSTARTER_PATH: Dónde está POPSTARTER.ELF. Si lo dejas vacío, RIPPS2 pone uno que encuentre en una unidad; escribe encima para usar otro, como usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Los argumentos de Neutrino superan la longitud que se puede guardar. Acorta un campo antes de guardar.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Los argumentos de inicio de Neutrino superan el límite seguro. Acorta los argumentos globales o los del juego.
  NEUTRINO_AUTO_ELF: Boot ELF automático (-elf)
  HINT_NEUTRINO_PATH: '¿Dónde está neutrino.elf? <sin definir> = Unidad del juego -> mc0/mc1. Una ruta completa personalizada se prueba primero. Ejemplos: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Visualización de juegos PS2/PS1
  HINT_GAME_VIEW_MODE: Todo muestra juntos los juegos de PS2 y PS1, y L3 alterna entre Todo, PS1 y PS2. PS2 o PS1 muestra solo ese tipo y desactiva L3. APPS y Juegos favoritos tienen sus propias reglas.
  VIEW_MIXED: Mostrando juegos de PS2 + PS1
  VIEW_PS1_ELF: Mostrando apps PS1 ELF
  APPS_DISPLAY: Visualización de aplicaciones
  HINT_APPS_DISPLAY: Todo muestra cada ELF en una sola lista APPS con L3 desactivado. Apps / PS1ELF lleva los títulos con [PS1] a una segunda página de L3; el inicio no cambia.
  VIEW: Vista
  VIEW_PS2: Mostrando juegos de PS2 favoritos
  VIEW_PS1: Mostrando juegos de PS1 favoritos
  VIEW_ELF: Mostrando ELF favoritos
  VIEW_ALL: Mostrando todos los juegos favoritos
  VMC_FRAGMENTED_ON_CREATE: VMC creada, pero está fragmentada. La emulación de tarjeta de memoria necesita un archivo continuo, así que esta VMC se omitirá al iniciar y se usará la tarjeta real. Libera espacio y créala de nuevo, o copia una desde otro dispositivo.
  KEYB_MOVE_CURSOR: Mover el cursor
  TITLECOLOR: Color del título del juego
  RA_CHECK_GAME: Comprobar compatibilidad con RetroAchievements
  RA_TEST_LINK: Probar la conexión de RetroAchievements con el PC
  RA_CHECKING_IMAGE: Comprobando la imagen, tarda unos segundos...
  RA_CHECK_RUNNING: Ya hay una comprobación de imagen en curso
  RA_LOOKING_FOR_PC: Buscando el cliente del PC...
  RA_UL_UNSUPPORTED: Los juegos UL/USBExtreme aún no se pueden comprobar
  RA_UL_UNSUPPORTED2: Solo se admiten imágenes .iso normales en DVD/ o CD/
  RA_UNKNOWN_IMAGE: RetroAchievements no conoce esta imagen
  RA_STILL_IDENTIFYING: El PC aún está identificando la imagen
  RA_TRY_AGAIN: Inténtalo de nuevo en unos segundos
  RA_NO_SOCKET: La consola no pudo abrir un socket de red
  RA_NO_SOCKET2: Reinicia la consola, o revisa el dispositivo ETH en los ajustes
  RA_TEST_NO_SOCKET2: Revisa el cable y ETH en los ajustes; si la red funciona, reinicia la consola
  RA_PC_NO_ANSWER: El cliente del PC no respondió
  RA_PC_NO_ANSWER2: Comprueba que xeRAbora esté en marcha, o prueba la conexión con el PC
  RA_SUPPORTED: Compatible con RetroAchievements
  RA_START_TO_TRACK: Inicia el juego para seguir los logros
  RA_ACHIEVEMENTS: '%d logros'
  RA_ACHIEVEMENTS_FULL: '%d logros -- %d desbloqueados, %d no compatibles'
  RA_HASH_FAILED: No se pudo calcular el hash de la imagen
  RA_HASH_FAILED2: Mira RA/hashes.txt junto a los juegos para ver el motivo
  RA_NET_BUSY: La red la está usando un transporte UDP
  RA_NET_BUSY2: RA necesita la pila SMB -- cambia de protocolo, o crea el .wl en el PC
  RA_NET_BUSY_HASH: El hash está en RA/hashes.txt -- xeRAbora puede crear el .wl con él
  RA_NO_IP: La consola no tiene dirección IP
  RA_NO_IP2: Revisa el DHCP o la dirección fija en los ajustes de red
  RA_TEST_NO_ANSWER: Ningún cliente del PC respondió en 3 segundos
  RA_TEST_NO_ANSWER2: Consola%s. Comprueba que xeRAbora esté en marcha y el puerto UDP 18194 abierto
  RA_TEST_FOUND: Cliente del PC encontrado%s%s %s
  RA_TEST_FOUND2: Respuesta en %u ms, consola%s
  RA_NA_NEUTRINO: El seguimiento RA necesita el núcleo <OPL> -- los inicios con Neutrino nunca cargan ee_core
  RA_NA_UDPFS: El seguimiento RA no está disponible en UDPFS -- los juegos se inician con Neutrino
  RA_NA_PS1: El seguimiento RA no está disponible para juegos de PS1
  RA_NA_HDD: Información de juego APA o carpeta de ajustes del disco duro no disponible
  RA_NA_HDD2: Define una carpeta de ajustes válida en el disco duro y actualiza antes de comprobar la compatibilidad
  RA_TELEMETRY: Telemetría de RetroAchievements
  RA_BADGES: Insignias de RetroAchievements
  HTTP_GAMES: Juegos HTTP
  HTTP_SERVER: Servidor HTTP
  HTTP_PORT: Puerto HTTP
  HTTP_BASE_PATH: Ruta base HTTP
  HTTP_TEST: Probar el servidor HTTP
  HTTP_TEST_OK: Servidor OK -- juegos listados
  HTTP_TEST_EMPTY: El catálogo está vacío -- es válido, pero no demuestra nada sobre los rangos de bytes
  HTTP_TEST_NO_ISO: El catálogo no tiene ninguna imagen compatible para probar un rango de bytes
  HTTP_ERR_CONNECT: No se puede contactar con el servidor HTTP
  HTTP_ERR_CATALOG: games.csv falta, no se puede leer o es demasiado grande
  HTTP_ERR_RANGE: El servidor no devolvió exactamente los bytes pedidos
  HTTP_LAUNCH_UNAVAILABLE: El inicio por HTTP aún no está implementado -- el catálogo solo se puede explorar
  HTTP_ERR_COMPRESSED: Las imágenes comprimidas (.zso) aún no se admiten por HTTP
  HTTP_NO_VMC: Las tarjetas de memoria virtuales no están disponibles por HTTP -- usa una tarjeta física
  HTTP_TAB_HINT: HTTP lee games.csv de tu servidor. Pon la dirección, el puerto y la ruta base en los ajustes de red y usa Probar.
  RA_DISC_CHECK: 'RA: comprobar compatibilidad del disco'
  RA_DISC_LAUNCH: 'RA: iniciar el disco'
  RA_DISC_CHECKING: Comprobando el disco para RetroAchievements
