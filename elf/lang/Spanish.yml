  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- La consola vincula PS2BBL a esta tarjeta y lo escribe como %s/%s.
  
    - Su configuración, mc%d:/SYS-CONF/PS2BBL.INI, inicia RIPPS2 donde está (%s) sin espera (0 ms, que PS2BBL Extended no permite), BOOT LOCK activado. RIPPS2 no se copia.
  
    El procesador de E/S se reinicia para esto y toda lectura de unidades se detiene hasta terminar; la música y las unidades vuelven después. Deja la tarjeta puesta y la consola encendida hasta que diga que ha terminado.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Una tarjeta SD2PSX o MMCE puede protegerse tras una escritura rechazada: si ahora falta la tarjeta de memoria o la unidad MMCE, apaga y enciende la consola.'
