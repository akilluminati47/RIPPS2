  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALAR BIBLE EN EL DISCO DURO INTERNO

    - RIPPS2 se copia en %s.

    - El programa de arranque del disco duro que hay ahora en __mbr se lee y se guarda en %s/RIPPS2 (RESTAURAR lo devuelve).

    - La versión para disco duro de PS2BBL se escribe en su lugar, y la consola se ajusta para iniciarla al encender.

    - Su configuración (%s) inicia RIPPS2 desde %s primero%s%s, con BOOT LOCK activado.

    Necesita una consola que arranque desde su disco duro (una PS2 fat con el adaptador de red). Déjala encendida hasta que diga que ha terminado.'
  INTERNAL HDD  (its boot area): DISCO DURO INTERNO  (su área de arranque)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'DEVOLVER EL ANTIGUO PROGRAMA DE ARRANQUE DEL DISCO DURO

    El que guardó BIBLE (RIPPS2/MBR-BACKUP.KELF en el disco duro) vuelve a __mbr, en el lugar de BIBLE. RIPPS2 y la configuración de PS2BBL se quedan donde están.'
