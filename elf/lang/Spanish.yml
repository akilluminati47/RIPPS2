  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL no puede iniciar RIPPS2 desde donde está ahora (llega a tarjetas de memoria, unidades USB y MX4SIO), y RIPPS2 no se copia a sí mismo. Pon RIPPS2.ELF en una tarjeta de memoria o una unidad USB e inícialo desde allí, o usa PS2BBL Extended, que lee MMCE y el disco duro.
  RESTORE SLOT %d'S OLD BOOT LOADER: RESTAURAR EL CARGADOR ANTERIOR DE LA RANURA %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE está instalado en la tarjeta de memoria de la ranura %d (mc%d:/%s/%s), BOOT LOCK activado: al encender inicia RIPPS2 desde %s, al instante.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: instalando BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: instalando BIBLE
  
    RIPPS2 funciona desde %s, que PS2BBL no puede leer (lee tarjetas de memoria, USB y MX4SIO), y RIPPS2 no se copia a sí mismo. La configuración de PS2BBL Extended de esta tarjeta (%s) sí lo lee: START activa BOOT LOCK para que inicie RIPPS2 desde %s al encender. Nada más cambia en la tarjeta.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: instalando BIBLE
  
    RIPPS2 funciona desde %s, que PS2BBL no puede leer: inicia programas desde una tarjeta de memoria, una unidad USB o MX4SIO, y RIPPS2 no se copia a sí mismo. Pon RIPPS2.ELF en uno de ellos (la carpeta APPS de una tarjeta de memoria o una unidad USB), inícialo desde allí y vuelve a instalar BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: instalando BIBLE
  
    La tarjeta de memoria de la ranura %d: BIBLE (mc%d:/%s) se aparta, y lo que reemplazó (mc%d:/%s) vuelve a su sitio. No se borra nada. La configuración de PS2BBL se queda como está (BOOT LOCK puede quitar el bloqueo).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: instalando BIBLE (vinculando PS2BBL a la tarjeta de memoria)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: instalando BIBLE (devolviendo lo que había)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: instalando BIBLE (reiniciando el procesador de E/S)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: instalando BIBLE (escribiéndolo en la tarjeta de memoria)'
