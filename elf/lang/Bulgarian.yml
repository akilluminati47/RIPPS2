  BIBLE could not copy RIPPS2 to the HDD's %s partition. Check its free space. Nothing else was changed.: BIBLE не можа да копира RIPPS2 в дяла %s на HDD. Проверете свободното място. Нищо друго не е променено.
  ? BIBLE could not keep a copy of the HDD's boot program, so it stopped before changing it. RIPPS2 was copied to the HDD; nothing else was changed.
  : BIBLE не можа да запази копие на програмата за зареждане на HDD, затова спря преди да я промени. RIPPS2 е копиран на HDD; нищо друго не е променено.
  BIBLE could not write its config (%s). The boot program was not changed.: BIBLE не можа да запише конфигурацията си (%s). Програмата за зареждане не е променена.
