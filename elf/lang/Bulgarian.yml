  ' A SYS-CONF/PS2BBL.INI build 68 wrote for a loader that never reads it was removed.': ' Премахнат е SYS-CONF/PS2BBL.INI, който компилация 68 записа за зареждащ модул, който никога не го чете.'
  ? ' A memory card here has its own PS2BBL/CONFIG.INI, which PS2BBL reads before the HDD''s: take that card out at power on, or start RIPPS2 from the card and install again.'
  : ' Една карта с памет тук има собствен PS2BBL/CONFIG.INI, който PS2BBL чете преди този на HDD: извадете тази карта при включване или стартирайте RIPPS2 от картата и инсталирайте отново.'
  ' Hold TRIANGLE at power on for the browser, START for a disc.': ' Задръжте ТРИЪГЪЛНИК при включване за браузъра, START за диск.'
  ' Hold TRIANGLE for the browser, START for a disc. Config: %s.': ' Задръжте ТРИЪГЪЛНИК за браузъра, START за диск. Конфигурация: %s.'
  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' RIPPS2 може да инсталира BIBLE, PS2BBL, настроен да стартира RIPPS2, на карта с памет; това, което стартира от нея сега, се пази в папка с резервно копие. Да се инсталира ли BIBLE?'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' Старата програма за зареждане на HDD е запазена (УПРАВЛЕНИЕ > ВЪЗСТАНОВЯВАНЕ).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' Конзолата не прие настройката, която стартира нейния HDD при включване: задайте я с помощната програма за HDD или инсталирайте отново.'
  ' What was there before is kept in mc%d:/%s%s.': ' Това, което беше там преди, се пази в mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' Вашата собствена PS2BBL конфигурация е запазена (%s), с включен в нея BOOT LOCK: бутоните ѝ са такива, каквито сте ги задали.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' Вашата собствена PS2BBL конфигурация е запазена, с включен в нея BOOT LOCK.'
