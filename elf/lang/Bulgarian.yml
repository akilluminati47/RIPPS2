  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 не знае къде е папката му, така че няма къде да сложи звуците.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 изсвирва музиката от менюто на тази конзола, атмосферната пиеса на браузъра ѝ (%d:%02d), по собствените ноти на BIOS и я записва като WAV с размер %s в %s; никоя карта с памет няма място за нея. Вече съществуващ там %s се заменя. Отнема минута-две.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 чете звуците от собствения BIOS на тази конзола и ги записва в %s като свои звуци: курсор, потвърждаване, отказ, страници, категория, съобщения, диск, грешка, запис, устройства и случаен, плюс музиката при стартиране и при пускане на игра, изсвирена по собствените ноти на BIOS. Файловете с тези имена, които вече са там, се заменят.'
  Reading this console's menu music: Четене на музиката от менюто на тази конзола
  'Ripping this console''s menu music: %d%%': 'Извличане на музиката от менюто на тази конзола: %d%%'
  Ripping this console's sounds: Извличане на звуците на тази конзола
  'Ripping this console''s sounds: %s': 'Извличане на звуците на тази конзола: %s'
  The menu music (%s) is in %s as %s. Audio settings > Music lists it as Menu; it plays when no other track is picked.: Музиката от менюто (%s) е в %s като %s. Аудио настройки > Музика я показва като Menu; звучи, когато не е избрана друга песен.
  The menu music could not be written to %s (%s). Is the drive full?: Музиката от менюто не можа да се запише в %s (%s). Пълно ли е устройството?
  ? 'The menu music is a WAV of %s, and no memory card has room for it. RIPPS2 runs from a memory card here and no drive with an OPL folder is started: start one in Storage, then rip the music to it.'
  : 'Музиката от менюто е WAV с размер %s и никоя карта с памет няма място за нея. RIPPS2 тук работи от карта с памет и не е стартирано устройство с OPL папка: стартирайте едно в Хранилище и после извлечете музиката на него.'
  This BIOS's menu music is not the one RIPPS2 knows. Nothing was written.: Музиката от менюто на този BIOS не е тази, която RIPPS2 познава. Нищо не е записано.
  This BIOS's sound bank is not the one RIPPS2 knows. Nothing was written.: Звуковата банка на този BIOS не е тази, която RIPPS2 познава. Нищо не е записано.
  ? This console's BIOS has no SNDIMAGE. Consoles from SCPH-30000 on carry one; the first models keep their sounds another way, which RIPPS2 does not read yet.
  : BIOS на тази конзола няма SNDIMAGE. Конзолите от SCPH-30000 нататък имат; първите модели пазят звуците си по друг начин, който RIPPS2 още не чете.
