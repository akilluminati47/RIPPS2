  What each memory card starts at power on; install or repair BIBLE, PS2BBL set up to start RIPPS2.: Какво стартира всяка карта с памет при включване; инсталиране или поправка на BIBLE, PS2BBL, настроен да стартира RIPPS2.
  Where POPSTARTER and Ember are, and how PS1 games start.: Къде са POPSTARTER и Ember и как стартират PS1 игрите.
  ? Writes what RIPPS2 noted about the pads, the drives, MMCE cards and the last launches to DIAG.TXT beside RIPPS2. Send it with a bug report.
  : Записва в DIAG.TXT до RIPPS2 това, което RIPPS2 е отбелязал за контролерите, устройствата, MMCE картите и последните стартирания. Изпратете го с доклад за грешка.
  back to Cache: обратно към Кеш
  what boot reads first: какво чете първо стартирането
  ', the sounds': ', звуците'
  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot е включен. RIPPS2 стартира от собственото си устройство (%s): настройките%s и всеки списък от неговия кеш. Другите устройства се стартират, когато натиснеш SELECT на тяхната страница или пуснеш някоя от игрите им.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot е включен. Звуците заемат %d KB, а картата памет, от която работи RIPPS2, има %d KB свободни, затова остават в %s.
  ' (%d KB free)': ' (%d KB свободни)'
  ' (%u MB free)': ' (%u MB свободни)'
  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'ДО RIPPS2: %sAUDIO%s, чете се първо при стартиране'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- Конзолата свързва PS2BBL с тази карта и го записва като %s/%s.
  
    - Неговата конфигурация, mc%d:/SYS-CONF/PS2BBL.INI, стартира RIPPS2 там, където е (%s), без чакане (0 ms, което PS2BBL Extended не позволява), BOOT LOCK включен. Самият RIPPS2 не се копира.
  
    Входно-изходният процесор се рестартира за това и всяко четене от устройства спира до края; музиката и устройствата се връщат след това. Остави картата вътре и конзолата включена, докато не каже, че е готово.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Карта SD2PSX или MMCE може да се защити след отказан запис: ако сега липсва картата памет или устройството MMCE, изключи и включи конзолата.'
  BOOT LOCK ON: BOOT LOCK ВКЛЮЧЕН
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Готово: картата памет в слот %d стартира това, което стартираше преди BIBLE. BIBLE се пази в mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): КАРТА ПАМЕТ В СЛОТ %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL не може да стартира RIPPS2 оттам, където е сега (стига до карти памет, USB устройства и MX4SIO), а RIPPS2 не се копира сам. Сложи RIPPS2.ELF на карта памет или USB устройство и го стартирай оттам, или използвай PS2BBL Extended, който чете MMCE и твърдия диск.
  RESTORE SLOT %d'S OLD BOOT LOADER: ВЪРНИ СТАРИЯ ЗАРЕЖДАЩ МОДУЛ В СЛОТ %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE е настроен на картата памет в слот %d (mc%d:/%s/%s), BOOT LOCK включен: при включване веднага стартира RIPPS2 от %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: настройване на BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: настройване на BIBLE
  
    RIPPS2 работи от %s, което PS2BBL не може да чете (чете карти памет, USB и MX4SIO), а RIPPS2 не се копира сам. Конфигурацията на PS2BBL Extended на тази карта (%s) го чете: START включва BOOT LOCK, за да стартира RIPPS2 от %s при включване. Нищо друго на картата не се променя.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: настройване на BIBLE
  
    RIPPS2 работи от %s, което PS2BBL не може да чете: той стартира програми от карта памет, USB устройство или MX4SIO, а RIPPS2 не се копира сам. Сложи RIPPS2.ELF на едно от тях (папката APPS на карта памет или USB устройство), стартирай го оттам и после настрой отново BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: настройване на BIBLE
  
    Картата памет в слот %d: BIBLE (mc%d:/%s) се премества настрана, а това, което замени (mc%d:/%s), се връща на мястото си. Нищо не се изтрива. Конфигурацията на PS2BBL остава както е (BOOT LOCK може да изключи заключването).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: настройване на BIBLE (свързване на PS2BBL с картата памет)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: настройване на BIBLE (връщане на предишното)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: настройване на BIBLE (рестартиране на входно-изходния процесор)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: настройване на BIBLE (запис на картата памет)'
  SET UP BIBLE: НАСТРОЙ BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: Картата памет в слот %d има %d KB свободни, а BIBLE се нуждае от %d KB на нея. Освободи малко място и опитай отново.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Картата памет в слот %d отказа PS2BBL, затова RIPPS2 остави картата както беше. Провери свободното ѝ място и опитай отново. (DIAG.TXT до RIPPS2 съдържа отговора на картата.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Картата памет в слот %d не премести BIBLE настрана, затова нищо не се промени. (DIAG.TXT до RIPPS2 съдържа отговора на картата.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Картата памет в слот %d не прие обратно %s, затова BIBLE остана. (DIAG.TXT до RIPPS2 съдържа отговора на картата.)
  MUSIC: МУЗИКА
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': 'В %s%s няма %s. RIPPOPS намери PS1 емулатора на Sony на %s: START копира %s тук и стартира играта.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 не вижда %s в %s%s. POPSTARTER има нужда от POPS_IOX.PAK с POPS.PAK или с POPS.ELF и IOPRP252.IMG: PS1 емулатора на Sony от собствената ти конзола. Може да ги намери там, където RIPPS2 не търси (ако игрите ти тръгват, намира ги). START стартира и за това устройство повече не се пита.'
  ' (The configs found were set: %s.)': ' (Намерените конфигурации бяха настроени: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Запазете веднъж настройките му с неговия собствен конфигуратор, след което включете BOOT LOCK отново.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s не може да стартира RIPPS2 от мястото, където е сега (%s), а RIPPS2 не се копира сам. Сложете RIPPS2.ELF на карта с памет или USB устройство и го стартирайте оттам.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK не успя да запише конфигурацията на зареждащия модул. Проверете дали картата с памет или устройството не е защитено от запис и опитайте отново.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK не намери конфигурация на зареждащ модул за промяна.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK е изключен. Вашият зареждащ модул стартира това, което стартираше преди (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK е включен. Сега %s стартира RIPPS2 при включване (%s), а празен път за IGR връща EXIT от игра по същия път. Задръжте един от бутоните му, докато конзолата стартира, за да стигнете до нещо друго.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK постави RIPPS2 първи в менюто на OSDMenu (%s). OSDMenu не стартира нищо само: изберете RIPPS2 там и EXIT от игра се връща в това меню. За конзола, която стартира RIPPS2 веднага, BIBLE слага PS2BBL на карта с памет (Зареждащ модул).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK работи чрез зареждащ модул на карта с памет (PS2BBL, FMCB или OSDMenu), а тук няма такъв.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Картата памет в слот %d стартира %s при включване, а BOOT LOCK не намери негова конфигурация за промяна (търси %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Картата памет в слот %d стартира %s при включване, който BOOT LOCK не може да настрои: работи чрез PS2BBL, FMCB и OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: На тази конзола има зареждащ модул с ключалката на RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT от игра: браузърът, после вашият зареждащ модул (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'В употреба: %s, %d изображения, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Измерване колко бързо всяко устройство чете изображенията си: %s'
  'None: each picture is read from its own ART folder.': 'Няма: всяко изображение се чете от собствената си папка ART.'
  REMOVE the pack in %s (the ART folders stay as they are): ПРЕМАХНИ пакета в %s (папките ART остават каквито са)
  Remove the ART Pack in %s? The ART folders stay as they are.: Да се премахне ли пакетът ART в %s? Папките ART остават каквито са.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Спряно. Недовършеният пакет е премахнат, а изображенията се зареждат от папките ART както преди.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Пакетът ART не можа да се запише в %s (има ли място на това устройство?). Нищо друго не се промени: изображенията се зареждат от папките ART както преди.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Пакетът ART в %s е премахнат. Изображенията отново се зареждат от папките ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : На стартираните устройства няма папка ART с изображения. Стартирай устройствата, на които са изображенията ти (SELECT на страницата им), и се върни.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d изображения от %d папки ART отиват в един файл, %s. Папките ART остават каквито са: пакетът е копие. Можеш да копираш art.tar в папката ART на друго устройство с Memory Files, но най-бързо е да го изградиш на устройството, от което разглеждаш, затова най-бързото устройство е първо. Да се изгради ли сега?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Пакетът ART е готов: %d изображения, %d MB, в %s (%d s). Отсега изображенията се зареждат от него, а за %d игри, за които е изграден, папката им ART никога повече не се пита изображение по изображение. Изображенията, които RIPPS2 изтегля или заснема, се показват веднага; копираните от компютър се показват, когато изградиш пакета отново.'
  '%s free': '%s свободни'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: чете %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: чете %s/s, най-бързото, %s'
  ART PACK: ПАКЕТ ART
  About %d min: Около %d мин
  'Looking at the ART folders: %d pictures, %s': 'Преглед на папките ART: %d изображения, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 'Никое стартирано устройство няма място за пакета ART: нужни са около %s. Освободи място на устройството, от което разглеждаш, и опитай отново.'
  PACKING THE ART: ПАКЕТИРАНЕ НА ИЗОБРАЖЕНИЯТА
  PICTURE %d OF %d: ИЗОБРАЖЕНИЕ %d ОТ %d
  'Pictures: %d (%s). ART folders: %d.': 'Изображения: %d (%s). Папки ART: %d.'
  Stop? The unfinished pack is removed; the ART folders stay as they are.: Да се спре ли? Недовършеният пакет се премахва; папките ART остават каквито са.
  'The ART folders stay as they are: the pack is a copy.': 'Папките ART остават каквито са: пакетът е копие.'
  Under a minute: Под минута
  free space unknown: свободното място е неизвестно
  'A game''s EXIT: the browser, or your boot loader when one is installed': 'EXIT от игра: браузърът или твоят зареждач, когато има инсталиран'
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): Ogg Vorbis от Xiph.Org (BSD), minimp3 от lieff (CC0)
  RIPFLOW's type, and every message and notification: шрифтът на RIPFLOW и на всяко съобщение и известие
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Благодарим на всички, които тестват в Discord и отварят issues в GitHub:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'IGR Path %s не се използва: след игра може да се зареди само файл от карта с памет или USB, и никога самият RIPPS2'
  an issue is the best way to get RIPPS2 updated.: issue е най-добрият начин RIPPS2 да се обнови.
  your Ogg and MP3 music, as RIPPS2 plays it: твоята Ogg и MP3 музика, както я пуска RIPPS2
  Pop In and Name: Изскачане и име
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s стартира след колоните, затова звукът при стартиране закъснява. START копира boot.adp (%d KB) до RIPPS2 на картата памет (%d KB свободни), където звучи, докато колоните се издигат.'
  The boot sound could not be copied to %s. It still plays from %s.: Звукът при стартиране не можа да се копира в %s. Той все още звучи от %s.
  Zoom: Увеличение
  '%s could not be deleted; it stays as it was.': '%s не можа да се изтрие; остава какъвто беше.'
  '%s could not be read as a .tar archive. Nothing was changed.': '%s не можа да се прочете като архив .tar. Нищо не беше променено.'
  '%s is deleted. %s is kept.': '%s е изтрит. %s се запазва.'
  Art loads from it from now on.: Изображенията се зареждат от него оттук нататък.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : 'Да се изтрие ли сливаният .tar?
  
    ИЗТРИВА СЕ: %s
  
    ЗАПАЗВА СЕ: %s (целта, вече с всички изображения от двата)'
  Into %s (%s): В %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : 'ЗАПАЗВА СЕ и се обновява: %s (%d изображения)
  
    СЛИВА СЕ: %s (%d изображения)
  
    Изображения и в двата: %d. Печели сливаното. Запазеният .tar се записва наново като нов файл и се подменя едва когато е цял, така че спиране или пълно устройство го оставят какъвто беше. Да се слее ли сега?'
  MERGE .TAR: СЛИВАНЕ НА .TAR
  MERGE a .tar into the pack in %s: СЛЕЙ .tar в пакета в %s
  MERGING THE ART: СЛИВАНЕ НА ИЗОБРАЖЕНИЯТА
  Merge in %s (%s): Слей %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Да се слее ли новият пакет в друг .tar? След това избираш .tar, който да се запази и обнови; изображенията на новия пакет отиват в него.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Слято: %s вече съдържа %d изображения (%d MB), %d с.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Влизащи изображения: %d (%s). Със същото име и в двата: %d (печели сливаното).'
  'Reading the archives: %s': 'Четене на архивите: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Спиране? Запазеният .tar остава какъвто беше; недовършеното копие се премахва.
  Stopped. %s is as it was; the unfinished copy was removed.: Спряно. %s е какъвто беше; недовършеното копие беше премахнато.
  The kept .tar is only replaced once the merged copy is whole.: Запазеният .tar се подменя едва когато сливаното копие е цяло.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Сливането не можа да се запише на устройството на %s (има ли място?). Той е какъвто беше; нищо друго не се промени.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : Сливането иска около %s свободни на устройството на %s (новият архив първо се записва до стария). Освободи малко място и опитай отново.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Сливането спря между две преименувания: запазеният .tar е %s, а сливаният %s. Преименувай ги обратно с Файлове в паметта.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : Сливаният .tar беше записан, но не можа да приеме името %s (MMCE преименува от фърмуер 1.4.0 нагоре). Новият файл беше премахнат; запазеният .tar е какъвто беше.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : Няма друг .tar за сливане в %s. Сложи го в тази папка, в папката ART на устройство или в корена на устройство и опитай отново.
  MERGE A .TAR INTO THIS: СЛЕЙ .TAR В ТОЗИ
  ? '
  
    %d game button maps in GAMES'
  : '
  
    %d подредби на бутоните на игри в GAMES'
  ? '
  
    1 game button map in GAMES'
  : '
  
    1 подредба на бутоните на игра в GAMES'
  (no name): (без име)
  Both: И двете
  ? 'None yet. A profile is a text file named after the pad''s ID, like 2563_0575.pad: the format is in RIPPS2''s repo (docs/plans/pad-spec.md).'
  : 'Още няма. Профилът е текстов файл, наименуван по ID на контролера, например 2563_0575.pad: форматът е в хранилището на RIPPS2 (docs/plans/pad-spec.md).'
  On (fast): Вкл. (бързо)
  'Pad profiles in %s:': 'Профили на контролери в %s:'
  RIPPS2 cannot tell where its folder is, so it cannot look for PADS.: RIPPS2 не знае къде е папката му, затова не може да търси PADS.
  could not be read: не може да се прочете
  About %d seconds left: Остават около %d секунди
  About 1 second left: Остава около 1 секунда
  Taking longer than its last start (%d s so far): По-бавно от последното стартиране (досега %d с)
  ? 'Download the covers in HD (280 x 400)? Sharper on an HD screen, about 70 KB each. START: Standard (140 x 200, as Open PS2 Loader''s), about 20 KB each. A game that already has a cover keeps it.'
  : 'Да се изтеглят ли обложките в HD (280 x 400)? По-ясни на HD екран, около 70 KB всяка. START: стандартни (140 x 200, като в Open PS2 Loader), около 20 KB всяка. Игра, която вече има обложка, я запазва.'
  STANDARD: СТАНДАРТНИ
  '%d IN': '%d ДОБАВЕНИ'
  '%d IN, %d REPLACED': '%d ДОБАВЕНИ, %d ЗАМЕНЕНИ'
  COULD NOT WRITE: НЕ МОЖЕ ДА СЕ ЗАПИШЕ
  'Getting it ready: %s': 'Подготвяне: %s'
  NOT A .TAR: НЕ Е .TAR
  NOTHING CHANGED: НИЩО НЕ Е ПРОМЕНЕНО
  NOTHING TO PUT IN: НЯМА КАКВО ДА СЕ ДОБАВИ
  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : Вкл. (бързо) държи звука при стартиране до RIPPS2 на картата памет, от която стартира, а RIPPS2 не е стартиран от карта. Звукът при стартиране звучи като при Вкл.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'Още няма звук при стартиране за копиране: Аудио настройки > Звуци от BIOS извличат тези на тази конзола.'
  '%d COPIED OUT': '%d КОПИРАНИ НАВЪН'
  '%d ITEM   %d MARKED   %s': '%d ЕЛЕМЕНТ   %d МАРКИРАН   %s'
  '%d ITEM   %d MARKED   %s   %s FREE': '%d ЕЛЕМЕНТ   %d МАРКИРАН   %s   %s СВОБОДНИ'
  '%d ITEMS   %d MARKED   %s': '%d ЕЛЕМЕНТА   %d МАРКИРАНИ   %s'
  '%d ITEMS   %d MARKED   %s   %s FREE': '%d ЕЛЕМЕНТА   %d МАРКИРАНИ   %s   %s СВОБОДНИ'
  '%s IN %d': '%s В %d'
  '%s IN %d, %s FREE': '%s В %d, %s СВОБОДНИ'
  ', %d LEFT OUT': ', %d ПРОПУСНАТИ'
  COPY IT OUT TO OPEN IT: КОПИРАЙТЕ НАВЪН, ЗА ДА ОТВОРИТЕ
  'Copying out: %s': 'Копиране навън: %s'
  INVERT MARKS: ОБЪРНИ МАРКИРОВКИТЕ
