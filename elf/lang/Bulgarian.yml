  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino не може да ползва VMC на APA HDD (exFAT, USB и MX4SIO могат): тази игра стартира с истинската карта в този слот.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Стартирането чете само устройството на RIPPS2: настройките и звуците до RIPPS2.ELF (RIPPS2.FB там казва къде) и всеки списък от неговия кеш. Другите устройства чакат: SELECT на страница стартира устройствата ѝ и зарежда техните изображения (с автоматично опресняване те стартират при старт). Включването копира звуците ти, а ако има място и музиката, в AUDIO до RIPPS2.'
  RIPPS2_ART_PACK: Пакет ART
  RIPPS2_ART_PACK_BUILD: Изгради или премахни
  HINT_RIPPS2_ART_PACK: Пакетира папката ART на всяко стартирано устройство в един art.tar на устройството, което избереш (най-бързото се предлага първо). Обложките се зареждат тогава от един файл с един индекс, никога с търсене за всяка игра, така че менютата и музиката остават гладки. Папките ART остават каквито са.
  RIPPS2_LIST_CFG_TEXT: Заглавие и описание в списъка
  HINT_RIPPS2_LIST_CFG_TEXT: 'Заглавието и описанието на играта от нейния CFG до списъка. Тема: както ги показва темата (собствената тема на RIPPS2 ги скрива). Страницата с информация винаги ги запазва.'
  RIPPS2_PS1_PREFER: Дубликати на PS1
  HINT_RIPPS2_PS1_PREFER: 'PS1 игра, която е едновременно VCD за POPSTARTER и образ за Ember. И двете: два реда. Ember: само редът на Ember. POPSTARTER: само VCD. Едно и също заглавие, без ID на диска отпред, е една и съща игра.'
  RIPPS2_MY_PADS: Моите контролери
  HINT_RIPPS2_MY_PADS: '.pad профилите в папката PADS до RIPPS2: по един текстов файл за USB контролер, наречен по неговото ID (2563_0575.pad), и всеки проверен. Контролер с профил управлява менюто и играе в игри (Pad Emulator включен).'
  RIPPS2_PAD_SETUP: Настрой USB контролер
  HINT_RIPPS2_PAD_SETUP: Включи USB контролер, който RIPPS2 не познава, натисни всеки бутон, който поиска, и RIPPS2 записва неговия .pad в PADS. SELECT на твоя PS2 контролер пропуска бутон.
