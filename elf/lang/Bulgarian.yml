  HINT_RIPPS2_STARSIDE: 'Къде стои звездата на любима игра в списъка. Ляво: собствена колона в началото на всеки ред. Дясно: след заглавието. Скрито (по подразбиране): без звезда и без колона, заглавията в цял ръст. Тема: както казва темата. R3 отбелязва игра като любима във всеки случай; задръжте R3 4 секунди на списък, за да скриете звездите или да ги върнете (това отбелязва и играта под курсора).'
  HINT_RIPPS2_HINT_LAYOUT: 'Ред: подсказките на един ред. Колона: по една подсказка на ред, списък отстрани, започващ там, където темата поставя подсказките си.'
  RIPPS2_HINT_LABELS: Надписи на подсказките
  HINT_RIPPS2_HINT_LABELS: Само символ рисува само бутоните, за символи със собствени думи. Значки събира символа и заглавието на всяка подсказка в една значка.
  RIPPS2_HINT_MENU: Подсказка за меню (START)
  RIPPS2_HINT_REFRESH: Подсказка за обновяване (SELECT)
  RIPPS2_HINT_STAR: Подсказка за звезда (R3)
  RIPPS2_HINT_VIEW: Подсказка за изглед (L3)
  HINT_RIPPS2_HINT_SHOW: Показва или скрива тази подсказка. Бутонът ѝ работи и в двата случая.
  RIPPS2_GLYPH_SET: Набор символи
  HINT_RIPPS2_GLYPH_SET: 'Символите на бутоните на всяка страница: тези на темата, тези на RIPPS2, Стандартни (тъмни бутони, цветни знаци) или Бели (изцяло бели).'
  RIPPS2_HINT_ORDER: Ред на подсказките
  HINT_RIPPS2_HINT_ORDER: Подрежда подсказките. Тема запазва реда на темата; Вашият ред е редът, зададен тук.
  RIPPS2_HINT_ORDER_FOLLOW: Ред
  RIPPS2_GRID_LAYOUT: Оформление на мрежата
  HINT_RIPPS2_GRID_LAYOUT: Колко корици побира една страница на мрежата, с разстоянията на RIPPS2. Тема запазва това на темата.
  RIPPS2_LAUNCH_DISC: Диск при стартиране
  HINT_RIPPS2_LAUNCH_DISC: Дискът на играта се появява при стартирането ѝ. Изскачане каца и изчезва; Въртене се върти все по-бързо, докато играта започне; Увеличение каца, после нараства, за да се чете ясно, и остава.
  RIPPS2_TRANSITION: Преход между страниците
  HINT_RIPPS2_TRANSITION: 'Как се появява нова страница, когато отидете в друга категория: от фоновия цвят на темата или от проблясък. Тема запазва избора на темата.'
  RIPPS2_CATEGORY_LAYOUT: Подредба на категориите
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Къде стоят трите категории: имената им горе или икони по страничната лента, всяка с чекмедже със своите страници (Наляво на списък води там), или Меню: без лента, категориите в менюто START като в тема, направена за OPL. Тема запазва подредбата на темата.'
  RIPPS2_CACHE: Кеш
  HINT_RIPPS2_CACHE: 'Как се пази списъкът с игри на всеки източник, за да се отваря страницата му веднага: Fast Cache, списъкът на вътрешния HDD и Автоматично опресняване.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'Всеки източник пази последния си списък с игри (RIPPS2.LST до папките си CD и DVD) и го показва веднага щом източникът отговори. Trust Cache решава дали източникът се чете отново после. Изключено: всеки списък първо се чете от източника си, както преди.'
  HINT_RIPPS2_VIGNETTE: Затъмнява краищата на всяка корица освен избраната, за да изпъкне избраната. Слабо е половината от Пълно.
  RIPPS2_GRID_WIDE: Оформление на мрежата за широк екран
  HINT_RIPPS2_GRID_WIDE: Страницата на мрежата само за картина 16:9 (широк екран, 720p, 1080i), където кориците се рисуват по-тесни и на ред се побират повече. Тема използва това на темата; Като следва оформлението на мрежата.
  RIPPS2_BGBLUR: Размазване на фона
  HINT_RIPPS2_BGBLUR: Колко силно матовото стъкло размазва фоновото изображение на играта. Тема използва това на темата (Слабо при RIPGRID и Adapt).
  HINT_RIPPS2_HINT_SLOT: Подсказката на това място. Подсказката, която беше тук, отива на старото място на избраната.
  PS1_SAVE_GUIDANCE: PS1 записите зависят от Ember или POPSTARTER; VMC настройките за PS2 не важат.
  NEUTRINO_SHOW_ARGS: Показване на аргументите за стартиране
  HINT_NEUTRINO_SHOW_ARGS: Преди всяко стартиране чрез Neutrino показва всеки аргумент, който Neutrino ще получи, и пита дали да продължи. Назад връща в менюто без стартиране.
  NEUTRINO_ARGS_CONFIRM: Neutrino ще стартира с тези аргументи. Да се стартира ли?
  HINT_NARGS_EXTRA: Други флагове на Neutrino, разделени с интервали, изпращани след всичко по-горе. RIPPS2 винаги добавя -bsd и -dvd за устройството и ISO на играта, -mc0 и -mc1 за нейните VMC, -gsm за видео режима ѝ и собствените режими на съвместимост на играта. Флаг със собствен ред по-горе (като -logo) при запазване се премества в този ред и пак се изпраща.
  HINT_RIPPS2_THEME: Видът на всяка страница. В списъка с игри задръжте SELECT 4,2 секунди, за да превключите към следващата тема; краткото натискане на SELECT пак обновява списъка.
  GAME_TYPE_LABELS: Показване на етикети [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Списъкът с кодове не можа да се запази в папката на Neutrino, затова Neutrino не може да го използва. Да се стартира ли без кодове?
  AUTO_CREATE_VMC: Създаване на VMC при първо стартиране
  HINT_AUTO_CREATE_VMC: "Стартирането на PS2 игра без VMC в слот 0 създава карта от 8 MB на устройството на играта, с името, което предлага екранът VMC (обща за всички дискове на играта), и я задава. Под Neutrino не на APA HDD (exFAT HDD работи)."
  AUTO_VMC_CREATING: Създаване на VMC на тази игра...
  AUTO_VMC_FAILED: VMC на тази игра не можа да се създаде. Играта стартира без него.
  RIPPS2_BIOS_MUSIC: BIOS музика
  HINT_RIPPS2_BIOS_MUSIC: 'Записва музиката от менюто на тази конзола (атмосферната пиеса на браузъра ѝ, около 15 MB като WAV) в избрана от вас папка AUDIO: до RIPPS2 или тази на OPL на стартирано устройство. Твърде голяма е за карта с памет. Първо се показва размерът ѝ.'
  SAVE_ICONS: 3D икони на записите
  HINT_SAVE_ICONS: Показва иконата на записа на избраната игра, въртяща се, там, където темата има място за нея. Първо чете собствения VMC на играта, после картите с памет.
  NETBOOT_RESTART_NOW: Мрежовият протокол се сменя след рестартиране. Да се запазят ли настройките и да се рестартира ли OPL сега?
  HINT_NET_PROTOCOL: 'Коя мрежова услуга използва RiptOPL: SMB споделяне, UDPFS, UDPBD или HTTP. Смяната от вече работеща услуга изисква рестартиране.'
  HINT_UDPFS_ACCESS: Само UDPFS. Файлове чете отделни ISO файлове от папката с игри на сървъра; IMG чете образ на диск като устройство. SMB и HTTP винаги използват Файлове, UDPBD винаги IMG.
  HINT_SMB_VERSION: С коя версия на SMB да се говори със споделянето на компютъра.
  HINT_NET_ADVANCED: Отключва за редактиране режима на Ethernet връзката и SMB порта.
  HINT_ETH_LINK_MODE: Налага скоростта и дуплекса на мрежовата връзка. Оставете Автоматично, освен ако връзката постоянно прекъсва.
  HINT_IP_ADDR_TYPE: Статичен използва адреса по-долу; DHCP пита вашия рутер. UDPFS и UDPBD винаги използват Статичен.
  HINT_PS2_IP: Собственият IP адрес на PS2. Изберете такъв, който никое друго устройство не използва, в същия диапазон като компютъра ви.
  HINT_NETMASK: Мрежова маска, обикновено 255.255.255.0.
  HINT_GATEWAY: Адресът на вашия рутер, обикновено със същите първи три числа и завършващ на .1.
  HINT_DNS: Адрес на DNS сървъра. Обикновено същият като шлюза.
  HINT_SMB_ADDR_TYPE: Достъп до компютъра по IP адреса му или по NetBIOS (компютърното) име.
  HINT_SMB_ADDRESS: 'Компютърът, който споделя игрите ви: неговият IP адрес или името на компютъра, когато Вид адрес е NetBIOS.'
  HINT_SMB_PORT: 'SMB порт. Трябва да съвпада с компютъра: PS2 Servers използва 1111, споделянията на Windows и Samba използват 445.'
  HINT_SMB_USER: Потребителско име за SMB. guest работи за повечето споделяния.
  HINT_HTTP_SERVER: IP адрес на HTTP сървъра с игри.
  HINT_HTTP_PORT: Портът, на който слуша HTTP сървърът с игри.
  HINT_HTTP_BASE: Папката на HTTP сървъра, в която е games.csv. / е коренът на сървъра.
  HINT_HTTP_TEST: Пробва HTTP сървъра със стойностите по-горе и съобщава какво е намерил.
  HINT_RA_TELEMETRY: Главен превключвател за RetroAchievements. Изкл. стартира игрите без мрежов стек и моментни снимки, както при обикновена компилация.
  HINT_RA_BADGES: Отбелязва в списъка игрите, които имат постижения. Остава тъмно, докато телеметрията е изключена.
  HINT_POPS_NET_BUTTON: Редактира собствените мрежови файлове на POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), нужни на PS1 игрите през SMB.
  HINT_POPS_IP_TYPE: 'Как PS2 получава адреса си, докато PS1 игра работи през SMB: Статичен или DHCP.'
  HINT_POPS_IP: IP адресът на PS2, докато PS1 игра работи през SMB.
  HINT_POPS_SMB_IP: IP адресът на компютъра, който споделя PS1 игрите ви.
  HINT_POPS_SMB_SHARE: Името на споделянето на този компютър, в което е папката POPS.
  HINT_LASTPLAYED: Започва от играта, която сте стартирали последно.
  HINT_LANGUAGE: Език на менюто. Добавете още, като сложите файлове lang_*.lng в папка LNG.
  HINT_GSM_DEFAULTS_BUTTON: Поправки на видео режима, които получава всяка игра, освен ако няма собствени GSM настройки.
  HINT_DEFDEVICE: Страницата, която RiptOPL отваря при стартиране.
  HINT_MMCE_MODE: 'Игри на SD2PSX или MemCard PRO2. Автоматично го стартира при стартиране: най-бързо за поставена карта, с игрите ѝ във Всички игри от самото начало. Ръчно го стартира, когато отворите страницата му, Изключено го скрива.'
  HINT_MMCE_SETTINGS_BUTTON: Слот, IGR bootcard, GameID и опции за синхронизация на MMCE.
  HINT_ENABLE_USB: Зарежда драйвера за USB хранилище.
  HINT_ENABLE_MX4SIO: Зарежда драйвера на адаптера за SD карти MX4SIO.
  HINT_ENABLE_ILINK: Зарежда драйвера за iLink (FireWire) хранилище.
  HINT_NETSTART: 'Стартира мрежата: Автоматично при стартиране, Ръчно при отваряне на страницата ѝ. Изкл. не докосва мрежовия адаптер.'
  HINT_APPMODE: Страницата с приложения. Автоматично стартира при стартиране, Ръчно при отваряне, Изкл. я скрива.
  HINT_FAVMODE: Страницата Любими игри. Автоматично стартира при стартиране, Ръчно при отваряне, Изкл. я скрива.
  HINT_BDMA_BUTTON: Кой exFAT драйвер използва POPSTARTER за PS1 игри на USB, MX4SIO, MMCE, HDD или iLink.
  HINT_VCD_LIST_BUTTON: 'Как се показват PS1 игрите: скриване на ID на игрите, показване само на диск 1, показване на PP дяловете на HDD.'
  HINT_MMCE_SLOT: В кой слот за карта с памет е MMCE устройството. Автоматично го намира.
  HINT_MMCE_GAMEID: Казва на MMCE устройството коя игра стартира, за да превключи към картата с памет на тази игра.
  HINT_MMCE_COMM_BUTTON: Опции за синхронизация на MMCE връзката. Променяйте ги само ако игрите замръзват или се зареждат бавно.
  HINT_MMCE_PATH_BUTTON: Къде на MMCE картата са папките с игри.
  HINT_MMCE_PREFIX: Подпапка на MMCE картата, в която са CD, DVD и другите OPL папки. Празно използва корена на картата.
  HINT_GAME_TYPE_LABELS: Започва името на всяка игра с [PS1] или [PS2]. Само за показване.
  HINT_MENU_VMODE: Видео изход на менюто. Игрите използват GSM вместо него. Задръжте Потвърждаване, за да запазите нов режим.
  HINT_THEME: Видът на менюто. Темите се четат от папката THM на всяко устройство.
  HINT_COVERFLOW_BUTTON: Брой корици, размер, анимация и затъмняване за темата Coverflow.
  HINT_ARTWORK_BUTTON: 'Кои изображения се зареждат: корици, изображения на дискове, фонове и икони на записи.'
  HINT_COLORS_BUTTON: Цветове на текста, подчертаването, диалозите и фона.
  HINT_NOTIFICATIONS: Кратки известия при зареждане на файл с конфигурация, тема или език.
  HINT_AUTOSORT: Подрежда списъците с игри от A до Я. Изкл. запазва реда, в който са намерени.
  HINT_AUTOREFRESH: Добавя игри от новосвързани устройства без ръчно обновяване.
  HINT_COVERART: Зарежда корици от папката ART.
  HINT_DISCART: Показва изображения на дискове (<ID>_ICO). Изкл. скрива диска, но запазва кориците и фоновете.
  HINT_BGART: Показва фона на играта (<ID>_BG), когато темата използва фон.
  HINT_ART_TAR: Чете и изображения, пакетирани в ART/art.tar.
  HINT_ART_DELAY: Колко дълго курсорът стои на игра, преди да се заредят изображенията ѝ. По-висока стойност пропуска изображения при бързо превъртане.
  HINT_TXTCOLOR: Цвят на обикновения текст в менюто.
  HINT_SELCOLOR: Цвят на подчертания елемент.
  HINT_UICOLOR: Оттенък на фона на диалоговите прозорци.
  HINT_TITLECOLOR: Цвят на заглавията на игрите в списъка.
  HINT_BGCOLOR: Цвят на фона на менюто.
  HINT_PLASCOLOR: Цвят, смесван в анимирания фон.
  HINT_RESETCOLOR: Възстановява вградените цветове на RiptOPL, не тези на темата.
  HINT_WIDESCREEN: Рисува менюто за телевизор 16:9.
  HINT_XOFF: Премества менюто наляво или надясно по екрана. Запазва се за всеки видеорежим.
  HINT_YOFF: Премества менюто нагоре или надолу по екрана. Запазва се за всеки видеорежим.
  HINT_MENU_OVERSCAN: Свива менюто навътре, ако телевизорът отрязва краищата му. Запазва се за всеки видеорежим.
  HINT_APPLYGAMEID: Показва баркод при стартиране на игра, за да сменят профила си устройствата Pixel FX, RetroGEM и PS2Digital.
  HINT_NEUTRINO_DEFAULTS_BUTTON: Пътят, видео режимът и аргументите на Neutrino за всяка игра.
  HINT_OSD_DEFAULTS_BUTTON: Езикът на конзолата, размерът на екрана и видео режимът, подавани на игрите.
  HINT_ENWRITEOP: Позволява преименуване и изтриване на игри и създаване на VMC. Никога не докосва таблицата с дялове на HDD.
  HINT_DEBUG: 'Помощ за разработчици: цветни екрани, докато играта зарежда, и броячи за зареждане на изображения в менюто.'
  HINT_BDMPREFIX: Подпапка на USB, MX4SIO, iLink и exFAT устройствата, в която са папките с игри. Празно използва корена на устройството.
  HINT_ETHPREFIX: Подпапка на SMB споделянето, в която са папките с игри. Празно използва корена на споделянето.
  HINT_HDDGAMELISTCACHE: Помни списъка с игри от APA HDD, за да ускори следващите сканирания.
  HINT_BDMCACHE: Кеш за предварително четене за USB и други BDM устройства в играта. По-голям може да изглади поточното четене, но използва повече памет.
  HINT_HDDCACHE: Кеш за предварително четене за вътрешния HDD в играта.
  HINT_SMBCACHE: Кеш за предварително четене за SMB в играта.
  HINT_CORE_LOADER: Ядрото за тази игра, когато се поддържат и двете. UDPFS/UDPBD са само за Neutrino; SMB/HTTP са само за <OPL>. По подразбиране следва Стартиране на игри.
  HINT_DMA_MODE: Режим на пренос на вътрешния HDD за тази игра. Намалете го, ако играта насича или замръзва.
  HINT_DNAS_GAMEID: ID на диска за DNAS онлайн игри. Зареждане от диск го чете от оригиналния диск.
  HINT_LOAD_FROM_DISC: Чете DNAS ID от оригиналния диск в устройството.
  HINT_ALTSTARTUP: Зарежда този ELF от образа на диска вместо посочения в SYSTEM.CNF.
  HINT_VMC_DEFINE: Изберете, създайте или преоразмерете виртуалната карта с памет на този слот.
  HINT_VMC_ACTION: Използване на обща дава на този слот споделена карта; Нулиране изчиства избора.
  HINT_VMC_NAME: Името на файла на картата, пазен в папката VMC.
  HINT_VMC_CREATE: Създава картата или прилага нов размер към нея.
  HINT_VMC_DELETE: Изтрива този файл на карта.
  HINT_SETTINGS_SOURCE: Общи използва споделените настройки; За играта ги пази само за тази игра.
  HINT_PADMACRO_TOGGLE: Докато бутонът е натиснат забавя лоста само докато държите бутона; Превключване с бутон го включва и изключва.
