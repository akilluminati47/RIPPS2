  'READ ONLY: THE SD2PSX''S BOOT CARD IS IN USE': 'САМО ЗА ЧЕТЕНЕ: КАРТАТА ЗА СТАРТИРАНЕ НА SD2PSX СЕ ИЗПОЛЗВА'
