# RIPPS2 in Bulgarian. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Bulgarian
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE: ИНСТАЛИРАЙ, ОБНОВИ ИЛИ ВЪЗСТАНОВИ"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "ОБНОВИ BIBLE: В СЛОТ %d ИМА ПО-СТАРА ВЕРСИЯ"
  "Background": "Фон"
  "Sky": "Небе"
  "Black": "Черен"
  "Splash": "Начален екран"
  "Logo": "Лого"
  "Logo and Names": "Лого и имена"
  "Button Glyphs": "Символи на бутоните"
  "Face Buttons": "Бутони за действие"
  "All Sixteen": "Всички шестнадесет"
  "Info Line": "Ред с информация"
  "Power-on Wait": "Изчакване при включване"
  "Eject Tray at Launch": "Изваждане на тавата при старт"
  "Read Console History": "Четене на историята на конзолата"
  "Game ID for Apps": "ID на игра за приложения"
  "Game ID for Discs": "ID на игра за дискове"
  "File name (as it appears in your games list)": "Име на файла (както се вижда в списъка с игри)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "Този списък показва игри от други устройства. Преименувайте играта на страницата на нейното устройство."
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "Игра със звезда не може да се преименува. Махнете звездата (R3), преименувайте, после я сложете отново."
  "This drive cannot rename its files. The details can still be set.": "Това устройство не може да преименува файловете си. Данните пак могат да се зададат."
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "На APA твърд диск името на PS2 игра е в таблицата на дяловете, затова тук не може да се преименува. Данните ѝ пак могат да се зададат."
  "Renames the app in your list. Its ELF and its art keep their names.": "Преименува приложението в списъка ви. ELF файлът и картините му запазват имената си."
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "Преименува играта на устройството ѝ. PS1 игрите намират картините и настройките си по име, затова RIPPS2 ги преименува заедно с нея. За картините в ART Pack пакетът трябва да се създаде отново."
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "Преименува файла на играта на устройството ѝ. PS2 игрите намират картините и настройките си по ID на играта, така че нищо не се губи."
  "Stop Disc at Launch": "Спиране на диска при стартиране"
  "EDIT BIBLE'S SETTINGS FILE": "РЕДАКТИРАЙ ФАЙЛА С НАСТРОЙКИ НА BIBLE"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "Файлът с настройки на BIBLE (%s) не можа да бъде записан. Проверете дали картата памет е поставена и има място, после опитайте отново."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "Файлът с настройки на BIBLE (%s) не е намерен. BIBLE: ИНСТАЛИРАЙ, ОБНОВИ ИЛИ ВЪЗСТАНОВИ записва такъв."
  "Boot sound On (fast): %s, handed over by BIBLE": "Звук при стартиране Вкл. (бързо): %s, предаден от BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: разклонението на akilluminati47 на PS2BBL Extended, всяка версия подписана от akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "неговият IOPRP образ свързва BIBLE с вашата карта (GPL-3): криптирането го прави конзолата, без ключове"
  "KELFBinder by El Isra": "KELFBinder от El Isra"
  "source: github.com/akilluminati47/BIBLE": "изходен код: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "СЛОТ 0: %s\nСЛОТ 1: %s\n%s\nRIPPS2: настройване на BIBLE. BIBLE, буутлоудърът на akilluminati47, изграден върху PS2BBL от El Isra, настроен от RIPPS2 на обикновена PS2 карта памет от 8 MB или на вътрешния твърд диск: старт за 0 ms при включване (PS2BBL Extended не позволява 0), първо RIPPS2 оттам, където е (никога не се копира), а бутон, задържан при включване, все така води до браузъра (TRIANGLE), до диск (START) и до предишното (CIRCLE). Да се настрои, поправи или да се върне това, което замени?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: настройване на BIBLE\nКартата в слот %d е карта SD2PSX или MMCE. Нейната BOOT карта може да държи BIBLE вместо PS2BBL, който има (той първо се премества настрани, цял), ако конзолата свърже BIBLE с нея. Ако свързването бъде отказано, нищо на картата не се променя и картата може да спре да отговаря, докато конзолата не се изключи и включи. START свързва BIBLE с нея."
  "BIND BIBLE": "СВЪРЖИ BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(DIAG.TXT до RIPPS2 съдържа отговора на картата.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "За обикновена PS2 карта памет от 8 MB (карта MagicGate или BOOT карта на SD2PSX или MMCE): тази в слот %d. При включване PS2BBL чете конфигурацията на слот 1 преди тази на слот 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "Конзолата не пожела да свърже BIBLE с картата с памет в слот %d (стъпката MagicGate се провали). Нищо на картата не е променено. Карта, която не е оригинална или съвместима с MagicGate, не може да побере системно обновяване."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Карта SD2PSX или MMCE може да спре да отговаря след отказано свързване: ако сега липсва картата памет или устройството MMCE, изключи и включи конзолата."
  "RIP THIS CONSOLE'S AUDIO": "ИЗВЛИЧАНЕ НА АУДИОТО НА ТАЗИ КОНЗОЛА"
  "sounds or music, from its BIOS": "звуци или музика, от нейния BIOS"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Отваря Настройки на звука на Звуци от BIOS и BIOS музика: извлечи звуците на тази конзола или музиката от менюто ѝ в AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Звук при стартиране Вкл. (бързо): %s на картата памет, докато колоните растат"
  "Boot sound On: %s on the memory card, as the pillars rise": "Звук при стартиране Вкл.: %s на картата памет, докато колоните растат"
  "Boot sound On: %s, once its drive is up": "Звук при стартиране Вкл.: %s, щом устройството му е готово"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Тази игра се стартира чрез Neutrino, а RIPPS2 не намери такъв: нито в пътя от Настройки, нито на диска на играта, нито на картите с памет, нито на някой стартиран диск. Сложете Neutrino на rickgaiser (github.com/rickgaiser/neutrino) в папка neutrino на диска на играта или на карта с памет, или насочете Стартиране на игри > Neutrino към него."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Къде е вашият Neutrino, видео режимът му и аргументите, които получава всяко стартиране с Neutrino. Вземете Neutrino от github.com/rickgaiser/neutrino и го сложете в папка neutrino на диск или карта с памет."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Този Neutrino е по-стар от 1.3, който не може да стартира игри от APA HDD. Насочете Стартиране на игри > Neutrino към Neutrino 1.3 или по-нов."
  "with rickgaiser's Neutrino as its second game core,": "с Neutrino на rickgaiser като второ игрово ядро,"
  "the second game core, used from your drive or memory card (AFL-3.0)": "второто игрово ядро, ползвано от вашия диск или карта с памет (AFL-3.0)"
