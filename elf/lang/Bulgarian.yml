labels:
  BDMMODE: Режим на стартиране на BDM
  GAME_ID: ID на играта
  DS34BT_MODE: DualShock3/4 BT
  PARTITION_NOTIFICATION: Дялът %s е монтиран.
  HINT_NEUTRINO_AUTO_ELF: Предава ELF файла за зареждане на играта на Neutrino, за да намери конфигурацията за заглавието. Включено по подразбиране; ръчно зададената опция Boot ELF има предимство.
  HINT_POPSTARTER_PATH: Къде е POPSTARTER.ELF. Ако е празно, RIPPS2 попълва този, който намери на устройство; запишете отгоре, за да използвате друг, напр. usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Аргументите на Neutrino надхвърлят дължината, която може да се запази. Съкратете някое поле, преди да запазите.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Аргументите за стартиране на Neutrino надхвърлят безопасната граница. Съкратете общите аргументи или тези на играта.
  NEUTRINO_AUTO_ELF: Автоматичен Boot ELF (-elf)
  HINT_NEUTRINO_PATH: 'Къде е neutrino.elf? <не е зададено> = устройството на играта -> mc0/mc1. Първо се опитва зададеният пълен път. Примери: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
