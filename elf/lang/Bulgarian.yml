  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Пуснете клиента xeRAbora на компютър в същата мрежа, влязъл във вашия акаунт в RetroAchievements. След това, за игра на USB, MMCE, SMB или HDD: отворете менюто на играта (ТРИЪГЪЛНИК) и изберете ПРОВЕРКА НА ПОДДРЪЖКАТА НА ИГРАТА. Следената игра получава значката RA; с включена ТЕЛЕМЕТРИЯ я стартирайте и отключванията се появяват върху играта. За диск в тавата използвайте ПРОВЕРКА НА ДИСКА, после ИГРА С ДИСКА С ПОСТИЖЕНИЯ. Игрите, стартирани чрез Neutrino, POPSTARTER или Ember, още не се следят.'
