  SIZE AND FREE SPACE: РАЗМЕР И СВОБОДНО МЯСТО
  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS в менюто в играта включва или изключва всеки чийт на играта, докато играете. Промените важат при RESUME; изключен чийт спира да пише, написаното остава. Изисква включени Cheats за играта.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Без CHEATS в менюто в играта: чийтовете, отметнати преди стартиране, действат през цялата игра, както досега.'
  BOOT SOUND WITH THE PILLARS: ЗВУК ПРИ СТАРТИРАНЕ С КОЛОНИТЕ
  'Boot Sound: On (fast)': 'Звук при стартиране: Вкл. (бързо)'
  'Boot sound On: from the AUDIO folder, once its drive is up': 'Звук при стартиране Вкл.: от папката AUDIO, щом устройството ѝ е готово'
  Boot sound off (Audio settings > Boot Sound): Звук при стартиране изкл. (Аудио настройки > Звук при стартиране)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: Копира boot.adp до RIPPS2 на картата памет, от която стартира, където стартирането го чете преди което и да е устройство да е готово.
  '%s could not be written.': '%s не можа да бъде записан.'
  '%s is there already and could not be put aside, so it was left as it was.': '%s вече съществува и не можа да бъде преместен настрана, затова остана както беше.'
  Circle: Кръг
  Cross: Кръстче
  Down: Надолу
  Down on the d-pad: Надолу на кръстачката
  Found %04X:%04X. Let go of everything on it, sticks too, and wait.: Намерен %04X:%04X. Пусни всичко по него, и стиковете, и изчакай.
  Got it. Let go.: Готово. Пусни.
  L3 (press the left stick in): L3 (натисни левия стик)
  Left on the d-pad: Наляво на кръстачката
  Nothing was set up, so no file was written.: Нищо не беше настроено, затова не беше записан файл.
  ? Plug in the USB pad you want to set up. If it is in already, take it out and plug it in again. Then press any button on it once.
  : Включи USB контролера, който искаш да настроиш. Ако вече е включен, извади го и го включи отново. После натисни веднъж произволен бутон на него.
  Press %s on the USB pad and hold it.: Натисни %s на USB контролера и задръж.
  Push %s and hold it.: Бутни %s и задръж.
  R3 (press the right stick in): R3 (натисни десния стик)
  Right on the d-pad: Надясно на кръстачката
  Save: Запази
  Saved as %s. The pad now steers the menu, and plays in games with the Pad Emulator on.: Запазено като %s. Контролерът вече управлява менюто и играе в игри с включен Pad Emulator.
  Skip: Пропусни
  Square: Квадрат
  This pad cannot be described in a .pad yet (%s), so no file was written.: Този контролер още не може да бъде описан в .pad (%s), затова не беше записан файл.
