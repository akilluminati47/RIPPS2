  Searches the drives for POPSTARTER, the POPS files, Ember, Ember's BIOS and Neutrino, and remembers where each one is.: Търси по устройствата POPSTARTER, файловете POPS, Ember, BIOS на Ember и Neutrino и помни къде е всеки.
