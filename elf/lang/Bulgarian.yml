  Starts every drive now (USB, the HDD, MMCE, MX4SIO and the network), so each one and its space shows here.: Стартира сега всяко устройство (USB, HDD, MMCE, MX4SIO и мрежата), така че всяко и мястото му да се покажат тук.
  The IP and SMB share POPSTARTER uses for PS1 games over the network.: IP адресът и SMB споделянето, които POPSTARTER ползва за PS1 игри по мрежата.
