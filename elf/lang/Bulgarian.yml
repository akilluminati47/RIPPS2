  The SD2PSX is getting this game's memory card ready (%d s). The game starts when it is done; START starts it now.: SD2PSX подготвя картата с памет на тази игра (%d с). Играта стартира, когато е готово; START я стартира сега.
  '%s could not be written to %s (%d of the sounds were). Is the drive full or write-protected?': '%s не можа да се запише в %s (%d от звуците се записаха). Пълно ли е устройството или защитено срещу запис?'
  '%s could not be written to %s (%d of the sounds were, and the card has %d KB free now). Is the card write-protected?': '%s не можа да се запише в %s (%d от звуците се записаха, а картата сега има %d KB свободни). Защитена ли е картата срещу запис?'
  The folder %s could not be made. Is the drive full or write-protected? Nothing was written.: Папката %s не можа да се създаде. Пълно ли е устройството или защитено срещу запис? Нищо не е записано.
  ? 'The sounds take %d KB and this memory card has %d KB free. Nothing was written. Free some room on the card, or start a drive in Storage and rip them again: RIPPS2 then offers the drive.'
  : 'Звуците заемат %d KB, а тази карта с памет има %d KB свободни. Нищо не е записано. Освободете място на картата или стартирайте устройство в Хранилище и ги извлечете отново: тогава RIPPS2 ще предложи устройството.'
  ? The sounds take %d KB and this memory card has %d KB free. START writes them to %sAUDIO/ on the drive instead, and RIPPS2 plays them from there.
  : Звуците заемат %d KB, а тази карта с памет има %d KB свободни. START ги записва вместо това в %sAUDIO/ на устройството и RIPPS2 ги пуска оттам.
  There was not enough memory to make the sounds. Nothing was written.: Нямаше достатъчно памет за създаване на звуците. Нищо не е записано.
  ? BIBLE could not move %s aside to keep it, so it stopped there. Nothing on the card was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : BIBLE не можа да премести %s настрана, за да го запази, затова спря там. Нищо на картата не е променено. (DIAG.TXT до RIPPS2 съдържа отговора на картата.)
  ? 'Memory Files opens now, on MEDIA, with the disc on its clipboard (RIPPED). Go to the drive and folder it should be in (any drive: USB, the HDD, the SD2PSX''s MEDIA), press TRIANGLE for ACTIONS and choose PASTE. RIPDISC then asks once more and reads the disc with your PS2''s laser, writing it there.'
  : 'Файлове в паметта се отваря сега, на MEDIA, с диска в клипборда (ИЗВЛЕЧЕНО). Отидете до устройството и папката, където трябва да отиде (всяко устройство: USB, HDD, MEDIA на SD2PSX), натиснете ТРИЪГЪЛНИК за ДЕЙСТВИЯ и изберете ПОСТАВЯНЕ. RIPDISC пита още веднъж и чете диска с лазера на вашия PS2, като го записва там.'
