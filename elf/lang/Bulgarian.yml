  ? 'BIBLE is installed on the internal HDD and BOOT LOCK is on: at power on the console starts RIPPS2 from %s%s%s%s, at once. Config: %s.%s%s'
  : 'BIBLE е инсталиран на вътрешния HDD и BOOT LOCK е включен: при включване конзолата веднага стартира RIPPS2 от %s%s%s%s. Конфигурация: %s.%s%s'
  ? BIBLE is on memory card %d, but its config (%s) could not be written, so it starts the browser. Free some space and run MANAGE again to finish.
  : BIBLE е на карта с памет %d, но конфигурацията му (%s) не можа да се запише, затова стартира браузъра. Освободете малко място и пуснете УПРАВЛЕНИЕ отново, за да довършите.
  BIBLE ran out of memory before it started. Nothing was changed.: BIBLE остана без памет, преди да започне. Нищо не е променено.
  BIBLE ran out of memory. Nothing on the memory card was changed.: BIBLE остана без памет. Нищо на картата с памет не е променено.
  'BIBLE: copying RIPPS2 to %s (%d%%)': 'BIBLE: копиране на RIPPS2 в %s (%d%%)'
  'BIBLE: keeping the HDD''s boot program': 'BIBLE: запазване на програмата за зареждане на HDD'
  'BIBLE: putting the HDD''s boot program back': 'BIBLE: връщане на програмата за зареждане на HDD'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: записване на PS2BBL в зоната за зареждане на HDD'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'ИНСТАЛИРАНЕ НА BIBLE НА ВЪТРЕШНИЯ HDD

    - RIPPS2 се копира в %s.

    - Програмата за зареждане на HDD, която сега е в __mbr, се прочита и пази в %s/RIPPS2 (ВЪЗСТАНОВЯВАНЕ я връща).

    - На нейно място се записва HDD компилацията на PS2BBL и конзолата се настройва да я стартира при включване.

    - Конфигурацията ѝ (%s) стартира RIPPS2 първо от %s%s%s, BOOT LOCK е включен.

    Нужна е конзола, която зарежда от своя HDD (дебела PS2 с мрежовия адаптер). Оставете я включена, докато не пише готово.'
  INTERNAL HDD  (its boot area): ВЪТРЕШЕН HDD  (зоната му за зареждане)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'ВРЪЩАНЕ НА СТАРАТА ПРОГРАМА ЗА ЗАРЕЖДАНЕ НА HDD

    Тази, която BIBLE запази (RIPPS2/MBR-BACKUP.KELF на HDD), се връща в __mbr на мястото на BIBLE. RIPPS2 и PS2BBL конфигурацията остават там, където са.'
  RESTORE: ВЪЗСТАНОВЯВАНЕ
  RESTORE THE HDD'S OLD BOOT PROGRAM: ВЪЗСТАНОВЯВАНЕ НА СТАРАТА ПРОГРАМА ЗА ЗАРЕЖДАНЕ НА HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 не може да определи региона на тази конзола от нейния ROM, така че не знае коя папка за системно обновяване чете тя. BIBLE не е инсталиран.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 не можа да отвори дяла __sysconf или __common на HDD (грешка %d), така че BIBLE няма къде да държи там RIPPS2 и конфигурацията си. Нищо не е променено.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 не можа да прочете запазената програма за зареждане. Нищо не е променено.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 не можа да запише обратно програмата за зареждане. Опитайте отново; запазеното копие е непокътнато.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 беше зает с четене на устройство и не можа да рестартира I/O процесора. Нищо не е променено: опитайте отново след малко.'
  Reading the memory cards: Четене на картите с памет
  The HDD partition BIBLE uses went away. Nothing was changed.: Дялът на HDD, който BIBLE използва, изчезна. Нищо не е променено.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Старата програма за зареждане на HDD е върната. BIBLE вече не стартира от HDD.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Това, което беше там, се пази в RIPPS2/MBR-BACKUP.KELF на HDD: ЗАРЕЖДАЩ МОДУЛ > УПРАВЛЕНИЕ > ВЪЗСТАНОВЯВАНЕ го връща.'
  The security module would not start on this console. Nothing on the memory card was changed.: Модулът за сигурност не се стартира на тази конзола. Нищо на картата с памет не е променено.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'В нито един слот няма форматирана PS2 карта с памет и няма вътрешен HDD. BIBLE живее на карта с памет или на HDD: поставете карта и опитайте отново.'
  There is no kept boot program on this HDD. Nothing was changed.: На този HDD няма запазена програма за зареждане. Нищо не е променено.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Този HDD няма дял __sysconf, затова конфигурацията на BIBLE трябва да е на карта с памет (PS2BBL чете първо тази от картата), а в нито един слот няма карта. Поставете една и опитайте отново.
