  PS1_RA_REMOVE_PREVIOUS: Önceki PS1 başarım modülü kaldırılamıyor
  PS1_RA_PREPARE_FAILED: PS1 başarımları hazırlanamıyor. POPS/MODULE_9.IRX dosyasını koruyun veya taşıyın ve cihazın yazma erişimini kontrol edin.
