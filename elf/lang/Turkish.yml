  POPS_UDPFS_NOT_READY: POPS UDPFS, her USB POPS klasöründe eşleşen geçerli IPCONFIG.DAT ve UDPFSCONFIG.DAT dosyalarına ihtiyaç duyar. Onları POPS Ağ Ayarları'nda yapılandırın.
  HINT_POPS_UDPFS_IP: POPS UDPFS sürücüsünün IOP sıfırlamasından sonra kullandığı statik PS2 IP'si.
  POPS_UDPFS_ALL_USB_FOLDERS: Tüm USB POPS klasörleri
  POPS_UDPFS_INVALID_SUFFIX: ' (geçersiz)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (eksik)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS, hafıza kartına kurulu .udpfs sürücü çiftine ihtiyaç duyar. Elle kurun veya BDMA Başlatmada Uygula'yı açın.
  VMC_REPLACE_REQUIRES_DELETE: VMC boyutunu değiştirmek kayıtlı oyunlarını siler. Yeni bir boyut oluşturmadan önce mevcut VMC'yi yedekleyin ve Sil'i kullanın.
  VMC_CREATE_FAILED: VMC oluşturulamadı. Cihazı, bağlantıyı ve yazma erişimini kontrol edin. Mevcut kayıtlar değiştirilmedi.
  RA_EXPERIMENTAL_CARDS: Caduceus deneysel kartları
  HINT_RA_EXPERIMENTAL_CARDS: Deneysel PS2 oyun içi başarım kartları. Titreyebilir veya oyunları dondurabilir. Yalnızca Caduceus; Kapalı altın nabzı kullanır. Bir sonraki oyun başlatmada geçerli olur.
  RA_NEUTRINO_UNTRACKED: Neutrino RA bu başlatma için kullanılamıyor. RA çalışma zamanını, yardımcı IP'yi ve kayıtlı izleme listesini kontrol edin. Başarımlar olmadan başlatılıyor.
  UDPFS_IP_CONFLICT: Ağınızdaki başka bir cihaz bu PS2'nin IP adresini kullanıyor, bu yüzden UDPFS sunucusunun yanıtları ona gidiyor. Ağ Ayarları'nda farklı bir PS2 IP'si ayarlayın.
  XERA_ACHIEVEMENTS: RetroAchievements kitaplığı (xeRAbora)
  XERA_USE_LIBRARY: Bu oyuna ana menüdeki RetroAchievements kitaplığı üzerinden göz atın.
  XERA_OPEN_NETWORK: xeRAbora'ya ulaşılamıyor. Ayarlarında OPEN TO THE NETWORK'ü açın, RA yardımcı IP'sini ve PC güvenlik duvarını kontrol edin.
  XERA_UNKNOWN_GAME: xeRAbora bu görüntüyü tanımıyor. Önce RA oyun desteği kontrolünü çalıştırın.
  XERA_NOT_PLAYED: Henüz RetroAchievements kitaplığınızda değil. Başarımlarla bir kez oynayın, sonra Select'e basın.
  XERA_CONNECTION_ERROR: xeRAbora'dan liste okunamıyor. Yeniden denemek için Select'e basın.
  CAD_PAIR_UDPFS: Caduceus'a ulaşılamıyor. PS2-Servers'ın paylaştığı klasörde ART/CADUCEUS.KEY dosyasını eşleştirin ve RA yardımcı IP'sini ayarlayın.
  RA_WL_NOT_SAVED: İzleme listesi kaydedilemedi. Oyunun cihazının veya paylaşımının yazılabilir olduğundan emin olun, sonra yeniden kontrol edin.
  RA_UDPFS_LOAD_FIRST: Ağ modülünün yüklenmesi için UDPFS sayfasını bir kez açın, sonra yeniden deneyin.
  CAD_UDPFS_IMG: 'Caduceus tarayıcısı SMB veya UDPFS Dosyalar''a ihtiyaç duyar: UDPFS IMG''nin anahtarı için paylaşılan bir klasörü yok.'
  XERA_SET_CLOCK: Henüz RetroAchievements kitaplığınızda değil. Tam listesini görmek için sistem ayarlarında konsol saatini ayarlayın ya da başarımlarla bir kez oynayın.
  CFG_TITLES: Oyun Listelerinde CFG Başlıklarını Göster
  HINT_CFG_TITLES: Dosya adı yerine her oyunun CFG'sindeki Başlığı gösterir ve ona göre sıralar. Bir liste yenilendiğinde her CFG'yi okur, bu yüzden listeler daha yavaş yüklenir. Yalnızca görünüm.
  AUTO_VMC_INVALID: Bu oyunun VMC dosyası var ama geçerli bir hafıza kartı değil, bu yüzden kullanılmadı ve değiştirilmedi. Oyun VMC olmadan başlar; VMC menüsünde kontrol edin.
  AUTO_VMC_STILL_RUNNING: Bu oyunun VMC'si hâlâ oluşturuluyor. Biraz sonra oyunu yeniden başlatın.
  NEUTRINO_DVR_QUICKBOOT: DVR başlatma PSX modu geçişini gerektirir. Genel ve oyuna özel Neutrino argümanlarından -qb'yi kaldırın.
  NEUTRINO_DVR_FILE_MISSING: 'DVR Neutrino kurulumu eksik. Gerekli dosya yok:'
  PARENLOCK_GAME: Ebeveyn Kilidi
  PARENLOCK_GAME_HINT: Bu oyunu başlatmak için ebeveyn kilidi parolasını iste.
  PARENLOCK_GAME_NO_PASSWORD: Bir ebeveyn kilidi parolası ayarlayın, yoksa bu oyun kilitlenmez.
  HINT_ENABLE_PCCF: Erken Japon PS2 PC CARD CompactFlash. Yalnızca yerel PS2 oyunları; CF'nin PC CARD'a özel erişimi gerekir. Serbest bırakmak için yeniden başlatın.
  PCCF_GAMES: PC CARD CF Oyunları
  PCCF_UNAVAILABLE: 'CF kullanılamıyor: erken bir Japon PC CARD PS2, uyumlu bir kart ve etkin olmayan DEV9/HDD/ağ sürücüsü gerekir.'
  PCCF_UNSUPPORTED_GAME: CF şu anda yalnızca yerel PS2 oyunlarını destekler. CF VMC, PS1 yükleme ve ağ başarımları kullanılamaz.
  HINT_ENABLE_DVR: Deneysel DESR DVR ISO keşfi. HDD kaynağının açık olmasını gerektirir; oyun başlatmak için harici DVR destekli Neutrino gerekir.
  HINT_RIPPS2_IGR_PAGE: Oyun içi menü, RIPSHOT ve karelerin nasıl basıldığı.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Oyun içi menüden ekran görüntüleri, temaların için ART klasörüne veya MEDIA klasörüne.
  RIPPS2_DEVELOP_SHOTS: Kareleri bas
  HINT_RIPPS2_DEVELOP_SHOTS: Her oyunun rulosunda bekleyen karelerin nasıl PNG olduğu.
  RIPPS2_SETTINGS_HOME: Ayarları kaydet
  HINT_RIPPS2_SETTINGS_HOME: 'RIPPS2 ayarlarını nerede tutar: hafıza kartındaki kendi kaydında, bir sürücüdeki RIPPS2 klasöründe (dahili HDD, USB, MX4SIO, iLink veya MMCE) veya senin yazdığın bir klasörde.'
  RIPPS2_LAUNCHERS: Başlatıcılar
  RIPPS2_LOOK_NOW: Şimdi ara
  HINT_RIPPS2_LOOK_NOW: RIPPS2 başlatılan sürücülerde POPSTARTER'ı, POPS dosyalarını, Ember'i, Ember'in BIOS'unu ve Neutrino'yu arar ve her birinin nerede olduğunu hatırlar. Her başlatma onları oradan okur.
  RIPPS2_HIDE_GAME: Oyunu gizle
  RIPPS2_HIDDEN_GAMES: Gizli oyunlar
  HINT_RIPPS2_HIDDEN_GAMES: Oyunu gizle ile gizlenen oyunlar, başlatılan sürücülerde. Birini yeniden gösterin ya da silin. Her sürücü kendi listesini tutar.
  HINT_RIPPS2_BDM_DEVICES: 'BDM''nin oyun okuduğu sürücüler: USB, MX4SIO, bir PC Card CF, bir DESR''nin DVR sürücüsü ve iLink. Dahili HDD, HDD Başlatma Modu''nu izler.'
  HINT_RIPPS2_SCREEN: 'Menünün görüntüsü: video modu, geniş ekran, televizördeki yeri (H-POS, V-POS) ve overscan.'
  HINT_RIPPS2_LAYOUT: Kategorilerin yeri ve bir sayfanın nasıl geldiği, sonra RIPFLOW'un kapakları ve RIPGRID'in ızgarası.
  HINT_RIPPS2_COLORS_TEXT: Metin kalınlığı, renk teması, renk geçişi ve her renk.
  HINT_RIPPS2_TEXT_WEIGHT: 'RIPPS2''nin kendi yazısının ne kadar kalın olduğu: Ayarlar ipuçları, DURUM ve Hakkında. Normal eskisi gibidir; Kalın yumuşak bir görüntüde daha iyi okunur. Bir temanın kendi yazı tipleri temanın verdiği kalınlıkları korur.'
  HINT_RIPPS2_HDD_START: 'Dahili HDD, APA ya da exFAT: RIPPS2 hangisiyse onu okur ve bir kez, HDD Oyunlar olarak gösterir. Otomatik (takılı bir diskle en hızlısı) onu açılışta başlatır; Kapalı ona dokunmaz.'
  HINT_RIPPS2_THEME_COLOR: Renk temasının kendi rengi. Kendiniz seçmek için renk teması olarak Özel'i seçin, metin renkleri gibi.
  HINT_RIPPS2_SWEEP: Temanın yavaşça ve yumuşakça geçtiği beş renk. Gökkuşağı, her renk temasından yapılmış bir geçiş ya da sizinki. Kapalı renk temasını sabit tutar.
  HINT_RIPPS2_SWEEP_COLORS: Geçişin beş rengi ve hızı. RIPPS2'nin birini değiştirin, verdiğiniz adla sizin olarak saklanır.
  HINT_RIPPS2_SWEEP_NAME: Geçişinizin Renk Geçişi listesindeki adı.
  HINT_RIPPS2_SWEEP_COLOR: Geçişin sırayla geçtiği beş renkten biri.
  HINT_RIPPS2_SWEEP_SPEED: 'Bir sonraki gelmeden önce her rengin ne kadar sürdüğü. Canlı bile yumuşak kalır: renkler asla yanıp sönmez.'
  RIPPS2_HIDE_COMPRESS: Oyunu gizle ve sıkıştırma
  HINT_RIPPS2_SELECT_HOLD: 'Bir oyun listesinde SELECT 4.2 sn basılı tutulur. Liste: temalar bir panelde, birini seçin. Sırayla: sonraki tema. Kapalı: hiçbir şey (basmak yine yeniler).'
  RIPPS2_RECENT_GAMES: Son Oyunlar
  RIPPS2_SET_METADATA_RENAME: Meta Verileri Ayarla (Yeniden Adlandır)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Önce Kumanda (Deneysel)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX, kumandanın paylaştığı veri yolu üzerinden okur ve bir okuma sürerken kumanda duyulmaz: kapaklar yüklenirken basışlar gecikir ya da kaybolur. Açık: kapaklar küçük parçalar hâlinde gelir, aralarında kumanda okunur, biraz daha yavaş. Kapalı: kart ne kadar hızlıysa o kadar. Kartın kaynakları Otomatik''teyken listesi bir kez, açılışta yüklenir.'
  HINT_RIPPS2_TRUST_CACHE: 'Önbelleğinden gösterilen bir liste, siz SELECT''e basana ya da RIPPS2 o kaynağı kendisi değiştirene kadar olduğu gibi, başlatmaya hazır kalır. Kapalı: her kaynak, önbelleği göründükten sonra arka planda yeniden okunur; bu, kumandanın veri yolunu paylaşan bir MMCE veya MX4SIO kartında hissedilen bir duraklamadır.'
  RIPPS2_STATUS_OPEN: Yükleme ve Sürücüler
  HINT_RIPPS2_STATUS_OPEN: 'DURUM''u açar: açılışın ayarları ve oyun listelerini nereden okuduğu, hangi yerin en hızlı olduğu, bir oyunun EXIT''inin nereye gittiği ve her sürücü. Oradaki ÖNBELLEK AYARLARI buraya geri getirir.'
  RIPPS2_BADGE_SET: Rozet Seti
  HINT_RIPPS2_BADGE_SET: 'Bir oyunun bilgi sayfasındaki rozetler (derecelendirme, oyuncular, ESRB, video modu, tarama, en boy oranı). RIPPS2: kendi seti, her temada aynı. Tema: temanın kendi görselleri ya da tema isterse RIPPS2''ninkiler.'
  RIPPS2_HINT_FADE: İpuçları ve Simgeler Belirsin
  HINT_RIPPS2_HINT_FADE: 'Değişen bir tuş ipucu ya da simge, kapaklar gibi, değiştiği anda yavaşça belirir; aynı kalanlara dokunulmaz, her sayfada ve mesajda. Kapalı: sadece görünürler. Tema: tema karar verir (hints_fade=0 demedikçe açık).'
  RIPPS2_SIDEBAR_STYLE: Kenar Çubuğu Stili
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klasik (bölünmüş): simgeler kenar çubuğunun koyu şeridinde, yanında renkli bant. XL (tek parça): daha geniş tek bir şerit, simgeler ortasında. Tema: tema karar verir.'
  HINT_EXITPATH: 'Oyun İçi Menüdeki EXIT''in gittiği yer. En iyisi boş bırakmak: EXIT tarayıcıya gider; tarayıcı, kuruluysa önyükleyicini (FreeMcBoot, PS2BBL, OSDMenu ya da BIBLE) başlatır ve BOOT LOCK açıkken, açılıştaki gibi yeniden RIPPS2''yi; hiçbiri yoksa PS2 tarayıcısı. Buraya yazılan bir ELF yalnızca sıfırlama onu yükleyebiliyorsa (hafıza kartında ya da FAT32 bir USB sürücüde) ve RIPPS2''nin kendisi değilse kullanılır; geri kalan her şey tarayıcıya gider.'
  HINT_BDM_START: 'USB, iLink, MX4SIO ve exFAT HDD. Otomatik onları açılışta başlatır: takılı sürücüler için en hızlısı, oyunları baştan Tüm Oyunlar''da. El ile, sayfalarını açtığınızda başlatır.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino, APA HDD''de VMC kullanamaz (exFAT, USB ve MX4SIO kullanabilir): bu oyun o yuvadaki gerçek kartla başlar.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Açılış yalnızca RIPPS2''nin kendi sürücüsünü okur: RIPPS2.ELF''in yanındaki ayarları ve sesleri (oradaki RIPPS2.FB nerede olduğunu söyler) ve her listeyi kendi önbelleğinden. Diğer sürücüler bekler: bir sayfada SELECT, o sayfanın sürücülerini başlatır ve görsellerini getirir (otomatik yenileme açıkken açılışta başlarlar). Açmak, seslerini ve yer varsa müziği RIPPS2''nin yanındaki AUDIO''ya kopyalar.'
  RIPPS2_ART_PACK: ART Paketi
  RIPPS2_ART_PACK_BUILD: Oluştur veya kaldır
  HINT_RIPPS2_ART_PACK: Başlatılan her sürücünün ART klasörünü seçtiğin sürücüde tek bir art.tar dosyasına paketler (en hızlısı ilk sunulur). Kapaklar böylece tek dosyadan tek bir dizinle yüklenir, asla oyun başına bir aramayla değil; menüler ve müzik akıcı kalır. ART klasörleri olduğu gibi kalır.
  RIPPS2_LIST_CFG_TEXT: Listede başlık ve açıklama
  HINT_RIPPS2_LIST_CFG_TEXT: 'Oyunun CFG dosyasındaki başlık ve açıklama, listenin yanında. Tema: temanın gösterdiği gibi (RIPPS2''nin kendi teması göstermez). Bilgi sayfası her durumda gösterir.'
  RIPPS2_PS1_PREFER: PS1 kopyaları
  HINT_RIPPS2_PS1_PREFER: 'Hem POPSTARTER VCD''si hem Ember görüntüsü olan bir PS1 oyunu. İkisi de: iki satır. Ember: yalnızca Ember satırı. POPSTARTER: yalnızca VCD. Baştaki disk kimliği dışında aynı başlık aynı oyundur.'
  RIPPS2_MY_PADS: Kollarım
  HINT_RIPPS2_MY_PADS: 'RIPPS2''nin yanındaki PADS klasöründeki .pad profilleri: her USB kol için kimliğiyle adlandırılmış bir metin dosyası (2563_0575.pad), her biri denetlenir. Biçime RIPPS2 öncülük eder; PADEMU onları sonraki bir sürümde okur.'
