  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'BIBLE''I DAHİLİ HDD''YE KUR

    - RIPPS2, %s konumuna kopyalanır.

    - HDD''nin şu anda __mbr içindeki önyükleme programı okunur ve %s/RIPPS2 içinde saklanır (GERİ YÜKLE onu geri koyar).

    - Yerine PS2BBL 1.2.0''ın HDD derlemesi yazılır ve konsol açılışta onu başlatacak şekilde ayarlanır.

    - Yapılandırması (%s) RIPPS2''yi önce %s%s%s konumundan başlatır, BOOT LOCK açık.

    Bunun için HDD''sinden önyükleyen bir konsol gerekir (ağ adaptörlü kalın bir PS2). Bitti yazana kadar açık tutun.'
  INTERNAL HDD  (its boot area): DAHİLİ HDD  (önyükleme alanı)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'HDD''NİN ESKİ ÖNYÜKLEME PROGRAMINI GERİ KOY

    BIBLE''ın sakladığı program (HDD''de RIPPS2/MBR-BACKUP.KELF), BIBLE''ın yerine __mbr içine geri döner. RIPPS2 ve PS2BBL yapılandırması yerinde kalır.'
