  PS1_RA_CLEAN_FAILED: Kullanılmayan RA modülü silinemiyor.
  PS1_RA_CLEAN_CONTINUE: Yine de devam edilsin mi? Artakalan bir RA modülü eski telemetri çalıştırabilir. Hayır başlatmayı iptal eder.
  FAV_REMOVED: Yıldızlı Oyunlar'dan kaldırıldı
  FAV_REMOVE_FAILED: Yıldızlı Oyunlar'dan kaldırılamadı
  POPS_UDPFS_SETTINGS: POPS UDPFS Ağ Ayarları
