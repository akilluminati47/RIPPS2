  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: RIPPS2 kendi klasörünün nerede olduğunu bilemiyor, bu yüzden sesleri koyacak yer yok.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 bu konsolun menü müziğini, tarayıcısının ortam parçasını (%d:%02d), BIOS'un kendi notalarıyla çalar ve %s boyutunda bir WAV olarak %s konumuna yazar; hiçbir hafıza kartında ona yer yok. Orada zaten olan %s değiştirilir. Bir iki dakika sürer.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 sesleri bu konsolun kendi BIOS''undan okur ve kendi sesleri olarak %s içine yazar: imleç, onay, iptal, sayfalar, kategori, mesajlar, disk, hata, kaydetme, sürücüler ve rastgele, ayrıca BIOS''un kendi notalarıyla çalınan açılış ve oyun başlatma müziği. Orada aynı adlı dosyalar varsa değiştirilir.'
