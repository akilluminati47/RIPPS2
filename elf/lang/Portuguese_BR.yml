  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "Não foi possível gravar o arquivo de configurações do BIBLE (%s). Verifique se o memory card está conectado e tem espaço, e tente de novo."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "O arquivo de configurações do BIBLE (%s) não foi encontrado. BIBLE: INSTALAR, ATUALIZAR OU RESTAURAR grava um."
  "Boot sound On (fast): %s, handed over by BIBLE": "Som de inicialização Ligado (rápido): %s, entregue pelo BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: o fork do PS2BBL Extended de akilluminati47, cada versão assinada por akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "a imagem IOPRP dele vincula o BIBLE ao seu cartão (GPL-3): o console faz a criptografia, sem chaves"
  "KELFBinder by El Isra": "KELFBinder de El Isra"
  "source: github.com/akilluminati47/BIBLE": "código-fonte: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: instalando o BIBLE. BIBLE, o bootloader de akilluminati47 baseado no PS2BBL de El Isra, instalado pelo RIPPS2 num memory card PS2 padrão de 8 MB ou no HD interno: uma inicialização de 0 ms ao ligar (o PS2BBL Extended não permite 0), o RIPPS2 primeiro de onde ele está (nunca é copiado), e um botão segurado ao ligar ainda leva ao navegador (TRIANGLE), a um disco (START) e ao que havia antes (CIRCLE). Instalar, reparar ou restaurar o que ele substituiu?"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: instalando o BIBLE\nO cartão do slot %d é um cartão SD2PSX ou MMCE. O cartão BOOT dele pode guardar o BIBLE no lugar do PS2BBL que tem (esse é antes movido de lado, inteiro), se o console vincular o BIBLE a ele. Se o vínculo for recusado, nada muda no cartão, e o cartão pode parar de responder até o console ser desligado e ligado. START vincula o BIBLE a ele."
  "BIND BIBLE": "VINCULAR BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(O DIAG.TXT ao lado do RIPPS2 tem o que o cartão respondeu.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "Para um memory card PS2 padrão de 8 MB (um MagicGate, ou um cartão BOOT SD2PSX ou MMCE): o do slot %d. Ao ligar, o PS2BBL lê a configuração do slot 1 antes da do slot 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "O console não quis vincular o BIBLE ao memory card do slot %d (a etapa MagicGate falhou). Nada no cartão foi alterado. Um cartão que não seja original ou compatível com MagicGate não pode guardar uma atualização do sistema."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "Um cartão SD2PSX ou MMCE pode parar de responder depois de um vínculo recusado: se o memory card ou a unidade MMCE sumiu agora, desligue e ligue o console."
  "RIP THIS CONSOLE'S AUDIO": "EXTRAIR O ÁUDIO DESTE CONSOLE"
  "sounds or music, from its BIOS": "sons ou música, da BIOS dele"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "Abre as Configurações de áudio em Sons da BIOS e Música da BIOS: extraia os sons deste console ou a música do menu dele para AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "Som de inicialização Ligado (rápido): %s no memory card, quando os pilares sobem"
  "Boot sound On: %s on the memory card, as the pillars rise": "Som de inicialização Ligado: %s no memory card, quando os pilares sobem"
  "Boot sound On: %s, once its drive is up": "Som de inicialização Ligado: %s, quando sua unidade estiver pronta"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "Este jogo inicia pelo Neutrino, e o RIPPS2 não encontrou nenhum: nem no caminho das Configurações, nem no drive do jogo, nem nos memory cards, nem em qualquer drive iniciado. Coloque o Neutrino de rickgaiser (github.com/rickgaiser/neutrino) em uma pasta neutrino no drive do jogo ou em um memory card, ou aponte Inicialização de jogos > Neutrino para ele."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "Onde está o seu Neutrino, o modo de vídeo e os argumentos que toda inicialização do Neutrino recebe. Baixe o Neutrino em github.com/rickgaiser/neutrino e coloque-o em uma pasta neutrino em um drive ou memory card."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "Este Neutrino é anterior ao 1.3, que não consegue iniciar jogos do HD APA. Aponte Inicialização de jogos > Neutrino para o Neutrino 1.3 ou mais novo."
