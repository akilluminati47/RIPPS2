  Remove the ART Pack in %s? The ART folders stay as they are.: Remover o pacote ART em %s? As pastas ART ficam como estão.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Parado. O pacote inacabado foi removido, e as imagens vêm das pastas ART como antes.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Não foi possível gravar o pacote ART em %s (tem espaço nessa unidade?). Nada mais mudou: as imagens vêm das pastas ART como antes.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: O pacote ART em %s foi removido. As imagens voltam a vir das pastas ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Não há nenhuma pasta ART com imagens nas unidades iniciadas. Inicie as unidades onde estão suas imagens (SELECT na página delas) e depois volte.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d imagens de %d pastas ART vão para um único arquivo, %s. As pastas ART ficam como estão: o pacote é uma cópia. Você pode copiar art.tar para a pasta ART de outra unidade com o Memory Files, mas criar o pacote na unidade em que você navega é o mais rápido, por isso a unidade mais rápida aparece primeiro. Criar agora?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'O pacote ART está pronto: %d imagens, %d MB, em %s (%d s). De agora em diante as imagens vêm dele, e os %d jogos para os quais ele foi criado nunca mais têm a pasta ART consultada imagem por imagem. As imagens que o RIPPS2 baixa ou captura aparecem na hora; as que você copia de um PC aparecem quando você cria o pacote de novo.'
  '%s free': '%s livres'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: lê %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: lê %s/s, a mais rápida, %s'
