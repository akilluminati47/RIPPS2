  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'A mesclagem parou entre duas renomeações: o .tar mantido é %s e o mesclado %s. Renomeie-os de volta com Arquivos de memória.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
