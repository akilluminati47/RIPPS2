  PS1_RA_REMOVE_PREVIOUS: Não foi possível remover o módulo de conquistas de PS1 anterior
  PS1_RA_PREPARE_FAILED: Não foi possível preparar as conquistas de PS1. Mantenha ou mova POPS/MODULE_9.IRX e confira a permissão de gravação da unidade.
  PS1_RA_CLEAN_DELETE: 'Módulo RA do RiptOPL sem uso: POPS/MODULE_9.IRX. Apagar para um início limpo?'
  PS1_RA_CLEAN_FAILED: Não foi possível apagar o módulo RA sem uso.
  PS1_RA_CLEAN_CONTINUE: Continuar mesmo assim? Um módulo RA que sobrou pode enviar telemetria velha. Não cancela o início.
  FAV_REMOVED: Removido de Jogos favoritos
  FAV_REMOVE_FAILED: Não foi possível remover de Jogos favoritos
  POPS_UDPFS_SETTINGS: Configurações de rede UDPFS do POPS
  POPS_UDPFS_DISCOVERY: Salva em cada pasta POPS do USB. O servidor 0.0.0.0 usa descoberta.
  POPS_UDPFS_NOT_READY: O POPS UDPFS precisa de IPCONFIG.DAT e UDPFSCONFIG.DAT válidos e iguais em cada pasta POPS do USB. Configure-os em Configurações de rede do POPS.
  HINT_POPS_UDPFS_IP: IP fixo do PS2 usado pelo driver UDPFS do POPS depois de reiniciar o IOP.
  POPS_UDPFS_ALL_USB_FOLDERS: Todas as pastas POPS do USB
  POPS_UDPFS_INVALID_SUFFIX: ' (inválido)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (incompleto)'
  POPS_UDPFS_DRIVER_NOT_READY: O POPS UDPFS precisa do par de drivers .udpfs instalado no cartão de memória. Instale à mão ou ligue BDMA Aplicar ao iniciar.
  VMC_REPLACE_REQUIRES_DELETE: Mudar o tamanho da VMC apagaria os saves dela. Faça backup da VMC existente e use Apagar antes de criar um tamanho novo.
  VMC_CREATE_FAILED: Não foi possível criar a VMC. Confira a unidade, a conexão e a permissão de gravação. Os saves existentes não foram substituídos.
  RA_EXPERIMENTAL_CARDS: Cartões experimentais do Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Cartões experimentais de conquistas dentro do jogo no PS2. Podem piscar ou travar jogos. Só Caduceus; Desligado usa o pulso dourado. Vale a partir do próximo jogo iniciado.
  RA_NEUTRINO_UNTRACKED: O RA no Neutrino não está disponível neste início. Confira o módulo RA, o IP do companheiro e a lista de acompanhamento salva. Iniciando sem conquistas.
  UDPFS_IP_CONFLICT: Outro aparelho da sua rede está usando o IP deste PS2, então as respostas do servidor UDPFS vão para ele. Defina outro IP para o PS2 em Configurações de rede.
  XERA_ACHIEVEMENTS: Biblioteca do RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Navegue por este jogo pela biblioteca do RetroAchievements no menu principal.
  XERA_OPEN_NETWORK: Não foi possível alcançar o xeRAbora. Ligue OPEN TO THE NETWORK nas configurações dele, confira o IP do companheiro RA e o firewall do PC.
  XERA_UNKNOWN_GAME: O xeRAbora não conhece esta imagem. Rode antes a verificação de suporte RA.
  XERA_NOT_PLAYED: Ainda não está na sua biblioteca do RetroAchievements. Jogue uma vez com conquistas e aperte Select.
  XERA_CONNECTION_ERROR: Não foi possível ler a lista do xeRAbora. Aperte Select para tentar de novo.
  CAD_PAIR_UDPFS: Não foi possível alcançar o Caduceus. Pareie ART/CADUCEUS.KEY na pasta que o PS2-Servers compartilha e defina o IP do companheiro RA.
  RA_WL_NOT_SAVED: Não foi possível salvar a lista de acompanhamento. Confira se a unidade ou o compartilhamento do jogo aceita gravação e verifique de novo.
  RA_UDPFS_LOAD_FIRST: Abra a página UDPFS uma vez para o módulo de rede dela carregar e tente de novo.
  CAD_UDPFS_IMG: 'O navegador do Caduceus precisa de SMB ou UDPFS Arquivos: o UDPFS IMG não tem pasta compartilhada para a chave dele.'
  XERA_SET_CLOCK: Ainda não está na sua biblioteca do RetroAchievements. Acerte o relógio do console nas configurações do sistema para ver a lista completa, ou jogue uma vez com conquistas.
  CFG_TITLES: Mostrar títulos do CFG nas listas de jogos
  HINT_CFG_TITLES: Mostra o título do CFG de cada jogo em vez do nome do arquivo, e ordena por ele. Lê todo CFG ao atualizar uma lista, então as listas carregam mais devagar. Só visual.
  AUTO_VMC_INVALID: O arquivo VMC deste jogo existe, mas não é um cartão de memória válido, então não foi usado nem substituído. O jogo inicia sem ele; confira no menu VMC.
  AUTO_VMC_STILL_RUNNING: A VMC deste jogo ainda está sendo criada. Inicie o jogo de novo daqui a pouco.
  NEUTRINO_DVR_QUICKBOOT: O início pelo DVR precisa da transição para o modo PSX. Tire o -qb dos argumentos globais e do jogo no Neutrino.
  NEUTRINO_DVR_FILE_MISSING: 'A instalação DVR do Neutrino está incompleta. Falta o arquivo necessário:'
  PARENLOCK_GAME: Controle dos pais
  PARENLOCK_GAME_HINT: Pedir a senha do controle dos pais para iniciar este jogo.
  PARENLOCK_GAME_NO_PASSWORD: Defina uma senha de controle dos pais, senão este jogo não será bloqueado.
  HINT_ENABLE_PCCF: CompactFlash na PC CARD dos primeiros PS2 japoneses. Só jogos nativos de PS2; a CF precisa de acesso exclusivo à PC CARD. Reinicie para liberá-la.
  PCCF_GAMES: Jogos PC CARD CF
  PCCF_UNAVAILABLE: 'CF indisponível: precisa de um PS2 japonês antigo com PC CARD, um cartão compatível e nenhum driver DEV9/HD/rede ativo.'
  PCCF_UNSUPPORTED_GAME: A CF por enquanto só suporta jogos nativos de PS2. VMC na CF, carregamento de PS1 e conquistas pela rede não estão disponíveis.
  HINT_ENABLE_DVR: Descoberta experimental de ISOs DESR DVR. Precisa da origem HD ligada; iniciar jogos precisa de um Neutrino externo com suporte a DVR.
  HINT_RIPPS2_IGR_PAGE: O menu no jogo, o RIPSHOT e como as fotos são reveladas.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Capturas a partir do menu no jogo, para ART para os seus temas ou para MEDIA.
  RIPPS2_DEVELOP_SHOTS: Revelar fotos
  HINT_RIPPS2_DEVELOP_SHOTS: Como as fotos esperando no rolo de cada jogo viram PNG.
  RIPPS2_SETTINGS_HOME: Salvar configurações em
  HINT_RIPPS2_SETTINGS_HOME: 'Onde o RIPPS2 guarda as configurações: o save dele em um cartão de memória, uma pasta RIPPS2 em uma unidade (o HD interno, USB, MX4SIO, iLink ou MMCE) ou uma pasta que você digita.'
  RIPPS2_LAUNCHERS: Inicializadores
  RIPPS2_LOOK_NOW: Procurar agora
  HINT_RIPPS2_LOOK_NOW: O RIPPS2 procura nas unidades iniciadas o POPSTARTER, os arquivos POPS, o Ember, a BIOS do Ember e o Neutrino, e memoriza onde cada um está. Toda inicialização os lê de lá.
  RIPPS2_HIDE_GAME: Ocultar jogo
  RIPPS2_HIDDEN_GAMES: Jogos ocultos
  HINT_RIPPS2_HIDDEN_GAMES: Os jogos ocultos com Ocultar jogo, nas unidades iniciadas. Mostre um de novo, ou apague-o. Cada unidade guarda sua própria lista.
  HINT_RIPPS2_BDM_DEVICES: 'As unidades de onde o BDM lê jogos: USB, MX4SIO, um PC Card CF, a unidade DVR de um DESR e iLink. O HD interno segue o início do HD.'
  HINT_RIPPS2_SCREEN: 'A imagem do menu: modo de vídeo, widescreen, onde ela fica na TV (H-POS, V-POS) e overscan.'
  HINT_RIPPS2_LAYOUT: Onde ficam as categorias e como uma página entra, depois as capas do RIPFLOW e a grade do RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Espessura do texto, a cor do tema, a transição de cores e cada cor.
  HINT_RIPPS2_TEXT_WEIGHT: 'A espessura do texto do próprio RIPPS2: as dicas das configurações, STATUS e Sobre. Normal é como era; Negrito fica mais legível sobre uma imagem suave. As fontes próprias de um tema mantêm os pesos que o tema dá a elas.'
  HINT_RIPPS2_HDD_START: 'O HD interno, APA ou exFAT: o RIPPS2 lê o que for e o mostra uma vez, como Jogos no HDD. Automático (o mais rápido com um HD instalado) o inicia no boot; OFF o deixa em paz.'
  HINT_RIPPS2_THEME_COLOR: A cor do próprio tema. Escolha Personalizado como cor do tema para escolher você mesmo, como as cores do texto.
  HINT_RIPPS2_SWEEP: Cinco cores por onde o tema passa, devagar e suave. Arco-íris, uma transição feita de cada cor de tema, ou a sua. Desligado mantém o tema parado.
  HINT_RIPPS2_SWEEP_COLORS: As cinco cores da transição e a velocidade dela. Mude uma das do RIPPS2 e ela fica salva como sua, com o nome que você der.
  HINT_RIPPS2_SWEEP_NAME: Como a sua transição se chama na lista Transição de cores.
  HINT_RIPPS2_SWEEP_COLOR: Uma das cinco cores por onde a transição passa, em ordem.
  HINT_RIPPS2_SWEEP_SPEED: 'Quanto tempo cada cor dura antes da próxima entrar. Até Vivo continua suave: as cores nunca piscam.'
  RIPPS2_HIDE_COMPRESS: Ocultar jogo e compactação
  HINT_RIPPS2_SELECT_HOLD: 'SELECT segurado 4.2 s numa lista de jogos. Lista: os temas em um painel, escolha um. Alternar: o próximo tema. Desligado: nada (apertar ainda atualiza).'
  RIPPS2_RECENT_GAMES: Jogos recentes
  RIPPS2_SET_METADATA_RENAME: Definir metadados (renomear)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Controle primeiro (experimental)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'O SD2PSX lê pelo barramento que o controle compartilha, e enquanto uma leitura acontece o controle não é ouvido: os toques atrasam ou se perdem enquanto as capas carregam. Ativado: as capas chegam em pedaços pequenos com o controle lido entre eles, um pouco mais devagar. Desativado: tão rápido quanto o cartão. Com as fontes do cartão em Automático, a lista dele carrega uma vez, no boot.'
  HINT_RIPPS2_TRUST_CACHE: 'Uma lista mostrada a partir do cache fica como está, pronta para iniciar, até você apertar SELECT ou o RIPPS2 mudar essa fonte por conta própria. Desativado: cada fonte é lida de novo em segundo plano depois que o cache aparece, uma pausa que se sente num cartão MMCE ou MX4SIO, que compartilham o barramento do controle.'
  RIPPS2_STATUS_OPEN: Carregamento e unidades
  HINT_RIPPS2_STATUS_OPEN: 'Abre o STATUS: onde o boot lê as configurações e as listas de jogos, qual lugar é o mais rápido, para onde vai o EXIT de um jogo, e cada unidade. O CONFIGURAÇÕES DO CACHE dele volta aqui.'
  RIPPS2_BADGE_SET: Conjunto de selos
  HINT_RIPPS2_BADGE_SET: 'Os selos da página de informações de um jogo (classificação, jogadores, ESRB, modo de vídeo, varredura, proporção). RIPPS2: o próprio conjunto, igual em todos os temas. Tema: as imagens do tema, ou as do RIPPS2 quando o tema pede.'
  RIPPS2_HINT_FADE: Esmaecer dicas e glifos
  HINT_RIPPS2_HINT_FADE: 'Uma dica de botão ou um glifo que muda aparece esmaecendo, como as capas, no momento em que muda; os que ficam não mexem, em cada página e mensagem. Desativado: eles simplesmente aparecem. Tema: o tema decide (ativado, a menos que diga hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Estilo da barra lateral
  HINT_RIPPS2_SIDEBAR_STYLE: 'Clássico (dividido): os ícones na faixa escura da barra lateral, com a tira colorida ao lado. XL (peça única): uma só faixa mais larga, com os ícones no meio. Tema: o tema decide.'
  HINT_EXITPATH: 'Para onde vai o EXIT no menu no jogo. Melhor deixar vazio: o EXIT vai para o navegador, que inicia seu boot loader (FreeMcBoot, PS2BBL, OSDMenu ou BIBLE) quando houver um instalado, e de novo o RIPPS2 com o BOOT LOCK ligado, como ao ligar; sem nenhum, o navegador do PS2. Um ELF digitado aqui só é usado quando o reset consegue carregá-lo (num memory card ou num pendrive FAT32) e não é o próprio RIPPS2; todo o resto vai para o navegador.'
  HINT_BDM_START: 'USB, iLink, MX4SIO e o HD exFAT. Automático inicia no boot: o mais rápido para as unidades conectadas, com os jogos delas em Todos os jogos desde o início. Manual inicia quando você abre a página delas.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'O Neutrino não consegue usar uma VMC no HD APA (exFAT, USB e MX4SIO conseguem): este jogo inicia com o cartão real nesse slot.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'A inicialização só lê a unidade do RIPPS2: as configurações e os sons ao lado do RIPPS2.ELF (o RIPPS2.FB ali diz onde) e cada lista do seu cache. As outras unidades esperam: SELECT numa página inicia as unidades dela e traz as imagens (com a atualização automática elas iniciam na inicialização). Ativar copia seus sons, e a música se houver espaço, para AUDIO ao lado do RIPPS2.'
  RIPPS2_ART_PACK: Pacote ART
  RIPPS2_ART_PACK_BUILD: Criar ou remover
  HINT_RIPPS2_ART_PACK: Junta a pasta ART de cada unidade iniciada em um único art.tar na unidade que você escolher (a mais rápida é oferecida primeiro). As capas passam a vir de um arquivo com um índice, nunca de uma busca por jogo, e os menus e a música ficam fluidos. As pastas ART ficam como estão.
  RIPPS2_LIST_CFG_TEXT: Título e descrição na lista
  HINT_RIPPS2_LIST_CFG_TEXT: 'O título e a descrição do jogo da CFG dele ao lado da lista. Tema: como o tema mostra (o tema do RIPPS2 os esconde). A página de informações mantém sempre.'
  RIPPS2_PS1_PREFER: Duplicados de PS1
  HINT_RIPPS2_PS1_PREFER: 'Um jogo de PS1 que é ao mesmo tempo um VCD do POPSTARTER e uma imagem do Ember. Ambos: duas linhas. Ember: só a do Ember. POPSTARTER: só o VCD. O mesmo título, sem o ID do disco na frente, é o mesmo jogo.'
  RIPPS2_MY_PADS: Meus controles
  HINT_RIPPS2_MY_PADS: 'Os perfis .pad na pasta PADS ao lado do RIPPS2: um arquivo de texto por controle USB, com o nome do ID dele (2563_0575.pad), e cada um verificado. Um controle com perfil comanda o menu e joga nos jogos (Pad Emulator ligado).'
  RIPPS2_PAD_SETUP: Configurar um controle USB
  HINT_RIPPS2_PAD_SETUP: Conecte um controle USB que o RIPPS2 não conhece, aperte cada botão que ele pedir e o RIPPS2 grava o .pad dele em PADS. SELECT no seu controle de PS2 pula um botão.
