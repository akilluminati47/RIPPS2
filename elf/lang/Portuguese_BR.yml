  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Não foi possível gravar a mesclagem no drive de %s (há espaço?). Está como estava; nada mais mudou.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
