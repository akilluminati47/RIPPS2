  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALAR O BIBLE NO HD INTERNO

    - O RIPPS2 é copiado para %s.

    - O programa de boot do HD que está agora em __mbr é lido e guardado em %s/RIPPS2 (RESTAURAR o devolve).

    - A versão para HD do PS2BBL é gravada no lugar dele, e o console é ajustado para iniciá-la ao ligar.

    - A configuração dele (%s) inicia o RIPPS2 de %s primeiro%s%s, com o BOOT LOCK ativado.

    Isso precisa de um console que dê boot pelo HD (um PS2 fat com o adaptador de rede). Deixe-o ligado até aparecer que terminou.'
