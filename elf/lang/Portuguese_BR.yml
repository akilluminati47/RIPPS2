  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'O Fast Boot está ativado. O RIPPS2 inicia da própria unidade (%s): as configurações%s e cada lista do seu cache. As outras unidades iniciam quando você aperta SELECT na página delas ou inicia um dos jogos delas.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: O Fast Boot está ativado. Os sons ocupam %d KB e o memory card de onde o RIPPS2 roda tem %d KB livres, então eles ficam em %s.
