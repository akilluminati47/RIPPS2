  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : Ligado (rápido) guarda o som de inicialização ao lado do RIPPS2 no memory card de onde ele inicia, e o RIPPS2 não iniciou de um. O som de inicialização toca como Ligado.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'Ainda não há som de inicialização para copiar: Configurações de áudio > Sons da BIOS extrai os deste console.'
