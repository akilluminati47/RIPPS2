  : 'A música do menu é um WAV de %s, e nenhum cartão de memória tem espaço para ela. O RIPPS2 está rodando de um cartão de memória aqui e nenhuma unidade com pasta OPL foi iniciada: inicie uma em Armazenamento e extraia a música para ela.'
