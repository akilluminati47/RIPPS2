  CAD_UNTRACKED: Caduceus non è pronto. Questa volta avvio senza obiettivi.
  PS1_RA_USB_REQUIRED: Gli obiettivi PS1 richiedono un VCD su USB tramite POPStarter
  PS1_RA_REMOVE_PREVIOUS: Impossibile rimuovere il precedente modulo degli obiettivi PS1
  PS1_RA_PREPARE_FAILED: Impossibile preparare gli obiettivi PS1. Conserva o sposta POPS/MODULE_9.IRX e controlla l'accesso in scrittura dell'unità.
  PS1_RA_CLEAN_DELETE: 'Modulo RA di RiptOPL inutilizzato: POPS/MODULE_9.IRX. Eliminarlo per un avvio pulito?'
  PS1_RA_CLEAN_FAILED: Impossibile eliminare il modulo RA inutilizzato.
  PS1_RA_CLEAN_CONTINUE: Continuare comunque? Un modulo RA rimasto può inviare telemetria vecchia. No annulla l'avvio.
  FAV_REMOVED: Rimosso dai Giochi preferiti
  FAV_REMOVE_FAILED: Impossibile rimuovere dai Giochi preferiti
  POPS_UDPFS_SETTINGS: Impostazioni di rete UDPFS di POPS
  POPS_UDPFS_DISCOVERY: Salva in ogni cartella POPS su USB. Il server 0.0.0.0 usa la ricerca automatica.
  POPS_UDPFS_NOT_READY: POPS UDPFS richiede IPCONFIG.DAT e UDPFSCONFIG.DAT validi e corrispondenti in ogni cartella POPS su USB. Configurali in Impostazioni di rete di POPS.
  HINT_POPS_UDPFS_IP: IP statico della PS2 usato dal driver UDPFS di POPS dopo il riavvio dell'IOP.
  POPS_UDPFS_ALL_USB_FOLDERS: Tutte le cartelle POPS su USB
  POPS_UDPFS_INVALID_SUFFIX: ' (non valido)'
  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (incompleto)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS richiede la coppia di driver .udpfs installata sulla memory card. Installala a mano o attiva BDMA Applica all'avvio.
  VMC_REPLACE_REQUIRES_DELETE: Cambiare la dimensione della VMC cancellerebbe i suoi salvataggi. Fai un backup della VMC esistente e usa Elimina prima di creare una nuova dimensione.
  VMC_CREATE_FAILED: Impossibile creare la VMC. Controlla l'unità, la connessione e l'accesso in scrittura. I salvataggi esistenti non sono stati sostituiti.
  RA_EXPERIMENTAL_CARDS: Schede sperimentali Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Schede degli obiettivi sperimentali in gioco su PS2. Possono sfarfallare o bloccare i giochi. Solo Caduceus; Disattivo usa l'impulso dorato. Vale dal prossimo avvio di un gioco.
  RA_NEUTRINO_UNTRACKED: RA con Neutrino non è disponibile per questo avvio. Controlla il modulo RA, l'IP del compagno e la lista di tracciamento salvata. Avvio senza obiettivi.
  UDPFS_IP_CONFLICT: Un altro dispositivo della tua rete usa l'indirizzo IP di questa PS2, quindi le risposte del server UDPFS vanno a lui. Imposta un altro IP per la PS2 nelle impostazioni di rete.
  XERA_ACHIEVEMENTS: Libreria RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Sfoglia questo gioco tramite la libreria RetroAchievements nel menu principale.
  XERA_OPEN_NETWORK: Impossibile raggiungere xeRAbora. Attiva OPEN TO THE NETWORK nelle sue impostazioni, controlla l'IP del compagno RA e il firewall del PC.
  XERA_UNKNOWN_GAME: xeRAbora non conosce questa immagine. Esegui prima il controllo del supporto RA.
  XERA_NOT_PLAYED: Non ancora nella tua libreria RetroAchievements. Giocalo una volta con gli obiettivi, poi premi Select.
  XERA_CONNECTION_ERROR: Impossibile leggere la lista da xeRAbora. Premi Select per riprovare.
  CAD_PAIR_UDPFS: Impossibile raggiungere Caduceus. Abbina ART/CADUCEUS.KEY nella cartella condivisa da PS2-Servers e imposta l'IP del compagno RA.
  RA_WL_NOT_SAVED: Impossibile salvare la lista di tracciamento. Assicurati che l'unità o la condivisione del gioco sia scrivibile, poi controlla di nuovo.
  RA_UDPFS_LOAD_FIRST: Apri una volta la pagina UDPFS perché il suo modulo di rete si carichi, poi riprova.
  CAD_UDPFS_IMG: 'Il browser di Caduceus richiede SMB o UDPFS File: UDPFS IMG non ha una cartella condivisa per la sua chiave.'
  XERA_SET_CLOCK: Non ancora nella tua libreria RetroAchievements. Imposta l'orologio della console nelle impostazioni di sistema per vederne la lista completa, o giocalo una volta con gli obiettivi.
  CFG_TITLES: Mostra i titoli CFG nelle liste dei giochi
  HINT_CFG_TITLES: Mostra il titolo del CFG di ogni gioco al posto del nome del file, e ordina in base a esso. Legge ogni CFG quando una lista si aggiorna, quindi le liste si caricano più lentamente. Solo visualizzazione.
  AUTO_VMC_INVALID: Il file VMC di questo gioco esiste ma non è una memory card valida, quindi non è stato usato né sostituito. Il gioco parte senza; controllalo nel menu VMC.
  AUTO_VMC_STILL_RUNNING: La VMC di questo gioco è ancora in creazione. Riavvia il gioco tra un momento.
  NEUTRINO_DVR_QUICKBOOT: L'avvio DVR richiede la transizione in modalità PSX. Rimuovi -qb dagli argomenti di Neutrino globali e del gioco.
  NEUTRINO_DVR_FILE_MISSING: 'L''installazione DVR di Neutrino è incompleta. Manca il file necessario:'
  PARENLOCK_GAME: Blocco genitori
  PARENLOCK_GAME_HINT: Chiedi la password del blocco genitori per avviare questo gioco.
  PARENLOCK_GAME_NO_PASSWORD: Imposta una password del blocco genitori, altrimenti questo gioco non verrà bloccato.
  HINT_ENABLE_PCCF: CompactFlash su PC CARD delle prime PS2 giapponesi. Solo giochi PS2 nativi; la CF richiede accesso esclusivo alla PC CARD. Riavvia per liberarla.
  PCCF_GAMES: Giochi PC CARD CF
  PCCF_UNAVAILABLE: 'CF non disponibile: richiede una PS2 giapponese con PC CARD dei primi modelli, una scheda compatibile e nessun driver DEV9/hard disk/rete attivo.'
  PCCF_UNSUPPORTED_GAME: La CF per ora supporta solo giochi PS2 nativi. VMC su CF, caricamento PS1 e obiettivi di rete non sono disponibili.
  HINT_ENABLE_DVR: Rilevamento sperimentale delle ISO DESR DVR. Richiede la sorgente hard disk attiva; l'avvio dei giochi richiede un Neutrino esterno compatibile con DVR.
  HINT_RIPPS2_IGR_PAGE: Il menu di gioco, RIPSHOT e come si sviluppano gli scatti.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Screenshot dal menu di gioco, in ART per i tuoi temi o in MEDIA.
  RIPPS2_DEVELOP_SHOTS: Sviluppa scatti
  HINT_RIPPS2_DEVELOP_SHOTS: Come gli scatti in attesa sul rullino di ogni gioco diventano PNG.
  RIPPS2_SETTINGS_HOME: Salva impostazioni su
  HINT_RIPPS2_SETTINGS_HOME: 'Dove RIPPS2 tiene le impostazioni: il suo salvataggio su una memory card, una cartella RIPPS2 su un''unità (l''hard disk interno, USB, MX4SIO, iLink o MMCE) o una cartella che scrivi tu.'
  RIPPS2_LAUNCHERS: Launcher
  RIPPS2_LOOK_NOW: Cerca ora
  HINT_RIPPS2_LOOK_NOW: RIPPS2 cerca sulle unità avviate POPSTARTER, i file POPS, Ember, il BIOS di Ember e Neutrino, e ricorda dove si trova ognuno. Ogni avvio li legge da lì.
  RIPPS2_HIDE_GAME: Nascondi gioco
  RIPPS2_HIDDEN_GAMES: Giochi nascosti
  HINT_RIPPS2_HIDDEN_GAMES: I giochi nascosti con Nascondi gioco, sulle unità avviate. Mostrane uno di nuovo, o eliminalo. Ogni unità tiene il proprio elenco.
  HINT_RIPPS2_BDM_DEVICES: 'Le unità da cui BDM legge i giochi: USB, MX4SIO, una PC Card CF, l''unità DVR di un DESR e iLink. L''hard disk interno segue l''avvio dell''hard disk.'
  HINT_RIPPS2_SCREEN: 'L''immagine del menu: modalità video, schermo largo, la sua posizione sul televisore (H-POS, V-POS) e overscan.'
  HINT_RIPPS2_LAYOUT: Dove stanno le categorie e come entra una pagina, poi le copertine di RIPFLOW e la griglia di RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Spessore del testo, il colore del tema, la sfumatura di colori e ogni colore.
  HINT_RIPPS2_TEXT_WEIGHT: 'Lo spessore del testo di RIPPS2: i suggerimenti delle impostazioni, STATO e Informazioni. Normale è come prima; Grassetto si legge meglio su un''immagine morbida. I caratteri propri di un tema mantengono gli spessori che il tema dà loro.'
  HINT_RIPPS2_HDD_START: 'L''hard disk interno, APA o exFAT: RIPPS2 legge quello che è e lo mostra una volta, come Giochi HDD. Automatica (la più rapida con un disco montato) lo avvia all''accensione; Disattivo lo lascia stare.'
  HINT_RIPPS2_THEME_COLOR: Il colore proprio del tema. Scegli Personalizzato come colore del tema per sceglierlo tu, come i colori del testo.
  HINT_RIPPS2_SWEEP: Cinque colori che il tema attraversa, piano e in modo fluido. Arcobaleno, una sfumatura da ogni colore del tema o la tua. Disattivo tiene fermo il tema.
  HINT_RIPPS2_SWEEP_COLORS: I cinque colori della sfumatura e la sua velocità. Cambiane una di RIPPS2 e viene tenuta come tua, con il nome che le dai.
  HINT_RIPPS2_SWEEP_NAME: Il nome della tua sfumatura nella lista Sfumatura di colori.
  HINT_RIPPS2_SWEEP_COLOR: Uno dei cinque colori che la sfumatura attraversa, in ordine.
  HINT_RIPPS2_SWEEP_SPEED: 'Quanto dura ogni colore prima che entri il successivo. Anche Vivace resta fluido: i colori non lampeggiano mai.'
  RIPPS2_HIDE_COMPRESS: Nascondi gioco e compressione
  HINT_RIPPS2_SELECT_HOLD: 'SELECT tenuto 4.2 s su un elenco di giochi. Elenco: i temi in un pannello, scegline uno. A rotazione: il tema successivo. Disattivo: niente (una pressione aggiorna comunque).'
  RIPPS2_RECENT_GAMES: Giochi recenti
  RIPPS2_SET_METADATA_RENAME: Imposta metadati (rinomina)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Prima il controller (sperimentale)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'Il SD2PSX legge sul bus che condivide con il controller, e mentre una lettura è in corso il controller non viene sentito: le pressioni ritardano o si perdono mentre caricano le copertine. Attivo: le copertine arrivano in piccoli pezzi con il controller letto tra l''uno e l''altro, un po'' più lento. Disattivo: veloce quanto la memory card. Con le fonti della memory card su Automatica, il suo elenco si carica una volta, all''avvio.'
  HINT_RIPPS2_TRUST_CACHE: 'Un elenco mostrato dalla sua cache resta così com''è, pronto per avviare, finché non premi SELECT o RIPPS2 cambia da sé quella fonte. Disattivo: ogni fonte viene riletta in background dopo che la sua cache è apparsa, una pausa che si sente su una memory card MMCE o MX4SIO, che condividono il bus del controller.'
  RIPPS2_STATUS_OPEN: Caricamento e unità
  HINT_RIPPS2_STATUS_OPEN: 'Apre STATO: dove l''avvio legge le impostazioni e gli elenchi dei giochi, quale posto è il più rapido, dove va l''EXIT di un gioco, e ogni unità. Il suo IMPOSTAZIONI CACHE riporta qui.'
  RIPPS2_BADGE_SET: Set di badge
  HINT_RIPPS2_BADGE_SET: 'I badge della pagina info di un gioco (classificazione, giocatori, ESRB, modalità video, scansione, formato). RIPPS2: il suo set, uguale su ogni tema. Tema: le immagini del tema, o quelle di RIPPS2 quando il tema le chiede.'
  RIPPS2_HINT_FADE: Dissolvenza di suggerimenti e glifi
  HINT_RIPPS2_HINT_FADE: 'Un suggerimento di tasto o un glifo che cambia appare in dissolvenza, come le copertine, nel momento in cui cambia; quelli che restano non vengono toccati, su ogni pagina e messaggio. Disattivo: appaiono e basta. Tema: decide il tema (attivo a meno che non indichi hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Stile della barra laterale
  HINT_RIPPS2_SIDEBAR_STYLE: 'Classico (diviso): le icone nella fascia scura della barra laterale, con la striscia colorata accanto. XL (pezzo unico): una sola fascia più larga, le icone al centro. Tema: decide il tema.'
  HINT_EXITPATH: 'Dove porta EXIT nel menu di gioco. Meglio vuoto: EXIT porta al browser, che avvia il tuo boot loader (FreeMcBoot, PS2BBL, OSDMenu o BIBLE) se ne è installato uno, e di nuovo RIPPS2 con BOOT LOCK attivo, come all''accensione; senza, il browser della PS2. Un ELF scritto qui si usa solo se il reset può caricarlo (su una memory card o un''unità USB FAT32) e non è RIPPS2 stesso; tutto il resto porta al browser.'
  HINT_BDM_START: 'USB, iLink, MX4SIO e l''hard disk exFAT. Automatica li avvia all''accensione: la scelta più rapida per le unità collegate, con i loro giochi in Tutti i giochi fin dall''inizio. Manuale li avvia quando apri la loro pagina.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino non può usare una VMC sull''hard disk APA (exFAT, USB e MX4SIO sì): questo gioco parte con la memory card vera in quello slot.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'L''avvio legge solo l''unità di RIPPS2: le impostazioni e i suoni accanto a RIPPS2.ELF (RIPPS2.FB lì dice dove) e ogni elenco dalla sua cache. Le altre unità aspettano: SELECT su una pagina avvia le sue unità e carica le loro immagini (con l''aggiornamento automatico partono all''avvio). Attivarlo copia i tuoi suoni, e la musica se c''è spazio, in AUDIO accanto a RIPPS2.'
  RIPPS2_ART_PACK: Pacchetto ART
  RIPPS2_ART_PACK_BUILD: Crea o rimuovi
  HINT_RIPPS2_ART_PACK: Mette la cartella ART di ogni unità avviata in un solo art.tar sull'unità che scegli (la più veloce è proposta per prima). Le copertine arrivano poi da un file con un indice, mai con una ricerca per gioco, così i menu e la musica restano fluidi. Le cartelle ART restano come sono.
  RIPPS2_LIST_CFG_TEXT: Titolo e descrizione nella lista
  HINT_RIPPS2_LIST_CFG_TEXT: 'Il titolo e la descrizione del gioco dalla sua CFG accanto alla lista. Tema: come li mostra il tema (il tema di RIPPS2 li nasconde). La pagina info li tiene comunque.'
  RIPPS2_PS1_PREFER: Doppioni PS1
  HINT_RIPPS2_PS1_PREFER: 'Un gioco PS1 presente sia come VCD di POPSTARTER sia come immagine Ember. Entrambi: due righe. Ember: solo quella Ember. POPSTARTER: solo la VCD. Lo stesso titolo, a parte un ID disco iniziale, è lo stesso gioco.'
  RIPPS2_MY_PADS: I miei pad
  HINT_RIPPS2_MY_PADS: 'I profili .pad nella cartella PADS accanto a RIPPS2: un file di testo per pad USB, col nome del suo ID (2563_0575.pad), ognuno controllato. Un pad con profilo comanda il menu e gioca nei giochi (Pad Emulator attivo).'
  RIPPS2_PAD_SETUP: Configura un pad USB
  HINT_RIPPS2_PAD_SETUP: Collega un pad USB che RIPPS2 non conosce, premi ogni tasto richiesto e RIPPS2 scrive il suo .pad in PADS. SELECT sul tuo pad PS2 salta un tasto.
