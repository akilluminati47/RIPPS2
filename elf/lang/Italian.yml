  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Quello che c''era è conservato in RIPPS2/MBR-BACKUP.KELF sull''hard disk: LOADER DI AVVIO > GESTISCI > RIPRISTINA lo rimette.'
  The security module would not start on this console. Nothing on the memory card was changed.: Il modulo di sicurezza non si è avviato su questa console. Sulla memory card non è stato modificato niente.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
