  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'INSTALLA BIBLE SULL''HARD DISK INTERNO

    - RIPPS2 viene copiato in %s.

    - Il programma di avvio dell''hard disk ora in __mbr viene letto e conservato in %s/RIPPS2 (RIPRISTINA lo rimette).

    - La build per hard disk di PS2BBL viene scritta al suo posto, e la console impostata per avviarla all''accensione.

    - La sua configurazione (%s) avvia RIPPS2 da %s per primo%s%s, con BOOT LOCK attivato.

    Serve una console che si avvii dal suo hard disk (una PS2 fat con l''adattatore di rete). Lasciala accesa finché non dice che ha finito.'
  INTERNAL HDD  (its boot area): HARD DISK INTERNO  (la sua area di avvio)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

