  RIPPS2 %s lite (build %d) on RiptOPL %s: RIPPS2 %s lite (build %d) su RiptOPL %s
  RIPPS2 cannot tell where its folder is, so it cannot look for PADS.: RIPPS2 non sa dove sia la sua cartella, quindi non può cercare PADS.
  could not be read: non leggibile
  About %d seconds left: Circa %d secondi rimasti
  About 1 second left: Circa 1 secondo rimasto
  Taking longer than its last start (%d s so far): Più lento dell'ultimo avvio (%d s finora)
  ? 'Download the covers in HD (280 x 400)? Sharper on an HD screen, about 70 KB each. START: Standard (140 x 200, as Open PS2 Loader''s), about 20 KB each. A game that already has a cover keeps it.'
  : 'Scaricare le copertine in HD (280 x 400)? Più nitide su uno schermo HD, circa 70 KB ciascuna. START: Standard (140 x 200, come Open PS2 Loader), circa 20 KB ciascuna. Un gioco che ha già una copertina la tiene.'
  STANDARD: STANDARD
  '%d IN': '%d DENTRO'
  '%d IN, %d REPLACED': '%d DENTRO, %d SOSTITUITI'
  COULD NOT WRITE: SCRITTURA NON RIUSCITA
  'Getting it ready: %s': 'Preparazione: %s'
  NOT A .TAR: NON È UN .TAR
  NOTHING CHANGED: NIENTE CAMBIATO
  NOTHING TO PUT IN: NIENTE DA AGGIUNGERE
  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : Attivo (veloce) tiene il suono di avvio accanto a RIPPS2 sulla memory card da cui parte, e RIPPS2 non è partito da una. Il suono di avvio suona come Attivo.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'Non c''è ancora un suono di avvio da copiare: Impostazioni audio > Suoni del BIOS estrae quelli di questa console.'
  ? This is RIPPS2 lite, which carries no PS2BBL, so it cannot set up BIBLE. The full RIPPS2.elf installs and repairs it; a boot loader already set up keeps starting RIPPS2 lite as it is.
  : Questo è RIPPS2 lite, che non porta PS2BBL, quindi non può installare BIBLE. Il RIPPS2.elf completo lo installa e lo ripara; un boot loader già installato continua ad avviare RIPPS2 lite così com'è.
  '%d COPIED OUT': '%d COPIATI FUORI'
  '%d ITEM   %d MARKED   %s': '%d ELEMENTO   %d SEGNATO   %s'
  '%d ITEM   %d MARKED   %s   %s FREE': '%d ELEMENTO   %d SEGNATO   %s   %s LIBERI'
  '%d ITEMS   %d MARKED   %s': '%d ELEMENTI   %d SEGNATI   %s'
  '%d ITEMS   %d MARKED   %s   %s FREE': '%d ELEMENTI   %d SEGNATI   %s   %s LIBERI'
  '%s IN %d': '%s IN %d'
  '%s IN %d, %s FREE': '%s IN %d, %s LIBERI'
  ', %d LEFT OUT': ', %d ESCLUSI'
  COPY IT OUT TO OPEN IT: COPIALO FUORI PER APRIRLO
  'Copying out: %s': 'Copia fuori: %s'
  INVERT MARKS: INVERTI SEGNI
  NO FILES ON THE CLIPBOARD: NESSUN FILE NEGLI APPUNTI
  SIZE AND FREE SPACE: DIMENSIONE E SPAZIO LIBERO
  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS nel menu di gioco attiva o disattiva ogni trucco del gioco mentre giochi. Le modifiche valgono a RESUME; un trucco disattivato smette di scrivere, ciò che ha scritto resta. Richiede i Cheats attivi per il gioco.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Nessun CHEATS nel menu di gioco: i trucchi spuntati prima dell''avvio restano attivi per tutto il gioco, come prima.'
  BOOT SOUND WITH THE PILLARS: SUONO DI AVVIO CON I PILASTRI
  'Boot Sound: On (fast)': 'Suono di avvio: Attivo (veloce)'
  'Boot sound On (fast): %s, as the pillars rise': 'Suono di avvio Attivo (veloce): %s, mentre i pilastri salgono'
  'Boot sound On: from the AUDIO folder, once its drive is up': 'Suono di avvio Attivo: dalla cartella AUDIO, quando la sua unità è pronta'
  Boot sound off (Audio settings > Boot Sound): Suono di avvio disattivato (Impostazioni audio > Suono di avvio)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: Copia boot.adp accanto a RIPPS2 sulla memory card da cui parte, dove l'avvio lo legge prima che un'unità sia pronta.
  '%s could not be written.': Impossibile scrivere %s.
  '%s is there already and could not be put aside, so it was left as it was.': '%s esiste già e non è stato possibile metterlo da parte, quindi è rimasto com''era.'
  Circle: Cerchio
  Cross: Croce
  Down: Giù
  Down on the d-pad: Giù sulla croce direzionale
  Found %04X:%04X. Let go of everything on it, sticks too, and wait.: Trovato %04X:%04X. Rilascia tutto, anche le levette, e attendi.
  Got it. Let go.: Fatto. Rilascia.
  L3 (press the left stick in): L3 (premi la levetta sinistra)
  Left on the d-pad: Sinistra sulla croce direzionale
  Nothing was set up, so no file was written.: Non è stato configurato nulla, quindi non è stato scritto alcun file.
  ? Plug in the USB pad you want to set up. If it is in already, take it out and plug it in again. Then press any button on it once.
  : Collega il pad USB da configurare. Se è già collegato, scollegalo e ricollegalo. Poi premi una volta un tasto qualsiasi.
  Press %s on the USB pad and hold it.: Premi %s sul pad USB e tienilo premuto.
  Push %s and hold it.: Spingi %s e tienila.
  R3 (press the right stick in): R3 (premi la levetta destra)
  Right on the d-pad: Destra sulla croce direzionale
  Save: Salva
  Saved as %s. The pad now steers the menu, and plays in games with the Pad Emulator on.: Salvato come %s. Il pad ora comanda il menu e gioca nei giochi con il Pad Emulator attivo.
  Skip: Salta
  Square: Quadrato
  This pad cannot be described in a .pad yet (%s), so no file was written.: Questo pad non può ancora essere descritto in un .pad (%s), quindi non è stato scritto alcun file.
  Triangle: Triangolo
  'Try it. What you hold shows here:': 'Provalo. Ciò che tieni premuto appare qui:'
  Up: Su
  Up on the d-pad: Su sulla croce direzionale
  the left stick down: la levetta sinistra in giù
  the left stick to the right: la levetta sinistra a destra
  the right stick down: la levetta destra in giù
  the right stick to the right: la levetta destra a destra
labels:
  'ON': Attivo
  'OFF': Disattivo
  WIDE_SCREEN: Schermo panoramico
  BACKSPACE: Cancella
  'NO': 'No'
  HINT_NEUTRINO_AUTO_ELF: Passa l'ELF di avvio del gioco a Neutrino per cercare la configurazione per titolo. Attivo per impostazione predefinita; un'opzione Boot ELF impostata a mano ha la precedenza.
  HINT_POPSTARTER_PATH: Dove si trova POPSTARTER.ELF. Se lasciato vuoto, RIPPS2 ne inserisce uno trovato su un'unità; scrivici sopra per usarne un altro, come usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Gli argomenti di Neutrino superano la lunghezza salvabile. Accorcia un campo prima di salvare.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Gli argomenti di avvio di Neutrino superano il limite sicuro. Accorcia gli argomenti globali o quelli del gioco.
  NEUTRINO_AUTO_ELF: Boot ELF automatico (-elf)
  HINT_NEUTRINO_PATH: 'Dove si trova neutrino.elf? <non impostato> = Unità del gioco -> mc0/mc1. Un percorso completo personalizzato viene provato per primo. Esempi: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Visualizzazione dei giochi PS2/PS1
  HINT_GAME_VIEW_MODE: Tutti elenca insieme i giochi PS2 e PS1, e L3 passa tra Tutti, PS1 e PS2. PS2 o PS1 mostra solo quel tipo e disattiva L3. APPS e Giochi preferiti hanno regole proprie.
  VIEW_MIXED: Giochi PS2 + PS1 visualizzati
  VIEW_PS1_ELF: App PS1 ELF visualizzate
  APPS_DISPLAY: Visualizzazione delle applicazioni
  HINT_APPS_DISPLAY: Tutti mostra ogni ELF in un'unica lista APPS con L3 disattivato. App / PS1ELF sposta i titoli con [PS1] in una seconda pagina di L3; l'avvio non cambia.
  VIEW: Vista
  VIEW_PS2: Giochi PS2 preferiti visualizzati
  VIEW_PS1: Giochi PS1 preferiti visualizzati
  VIEW_ELF: ELF preferiti visualizzati
  VIEW_ALL: Tutti i giochi preferiti visualizzati
  VMC_FRAGMENTED_ON_CREATE: VMC creata, ma frammentata. L'emulazione della memory card ha bisogno di un file contiguo, quindi questa VMC verrà saltata all'avvio e verrà usata la memory card reale. Libera spazio e ricreala, oppure copiane una da un altro dispositivo.
  KEYB_MOVE_CURSOR: Sposta il cursore
  TITLECOLOR: Colore del titolo del gioco
  RA_CHECK_GAME: Controlla il supporto RetroAchievements
  RA_TEST_LINK: Prova il collegamento RetroAchievements al PC
  RA_CHECKING_IMAGE: Controllo dell'immagine, ci vogliono alcuni secondi...
  RA_CHECK_RUNNING: È già in corso un controllo dell'immagine
  RA_LOOKING_FOR_PC: Ricerca del client PC...
  RA_UL_UNSUPPORTED: I giochi UL/USBExtreme non possono ancora essere controllati
  RA_UL_UNSUPPORTED2: Sono supportate solo immagini .iso semplici in DVD/ o CD/
  RA_UNKNOWN_IMAGE: RetroAchievements non conosce questa immagine
  RA_STILL_IDENTIFYING: Il PC sta ancora identificando l'immagine
  RA_TRY_AGAIN: Riprova tra qualche secondo
  RA_NO_SOCKET: La console non è riuscita ad aprire un socket di rete
  RA_NO_SOCKET2: Riavvia la console, o controlla il dispositivo ETH nelle impostazioni
  RA_TEST_NO_SOCKET2: Controlla il cavo ed ETH nelle impostazioni; se la rete funziona, riavvia la console
  RA_PC_NO_ANSWER: Il client PC non ha risposto
  RA_PC_NO_ANSWER2: Controlla che xeRAbora sia in esecuzione, o prova il test del collegamento al PC
  RA_SUPPORTED: Supportato da RetroAchievements
  RA_START_TO_TRACK: Avvia il gioco per tracciare gli obiettivi
  RA_ACHIEVEMENTS: '%d obiettivi'
  RA_ACHIEVEMENTS_FULL: '%d obiettivi -- %d sbloccati, %d non supportati'
  RA_HASH_FAILED: Impossibile calcolare l'hash dell'immagine
  RA_HASH_FAILED2: Vedi RA/hashes.txt accanto ai giochi per il motivo
  RA_NET_BUSY: La rete è usata da un trasporto UDP
  RA_NET_BUSY2: RA ha bisogno dello stack SMB -- cambia protocollo, o crea il .wl sul PC
  RA_NET_BUSY_HASH: L'hash è in RA/hashes.txt -- xeRAbora può creare il .wl da esso
  RA_NO_IP: La console non ha un indirizzo IP
  RA_NO_IP2: Controlla il DHCP o l'indirizzo statico nelle impostazioni di rete
  RA_TEST_NO_ANSWER: Nessun client PC ha risposto entro 3 secondi
  RA_TEST_NO_ANSWER2: Console%s. Controlla che xeRAbora sia in esecuzione e che la porta UDP 18194 sia aperta
  RA_TEST_FOUND: Client PC trovato%s%s %s
  RA_TEST_FOUND2: Risposta in %u ms, console%s
  RA_NA_NEUTRINO: Il tracciamento RA richiede il core <OPL> -- gli avvii con Neutrino non caricano mai ee_core
  RA_NA_UDPFS: Il tracciamento RA non è disponibile su UDPFS -- i giochi si avviano tramite Neutrino
  RA_NA_PS1: Il tracciamento RA non è disponibile per i giochi PS1
  RA_NA_HDD: Informazioni sul gioco APA o cartella delle impostazioni dell'hard disk non disponibili
  RA_NA_HDD2: Imposta una cartella delle impostazioni valida sull'hard disk e aggiorna prima di controllare il supporto
  RA_TELEMETRY: Telemetria RetroAchievements
  RA_BADGES: Badge RetroAchievements
  HTTP_GAMES: Giochi HTTP
  HTTP_SERVER: Server HTTP
  HTTP_PORT: Porta HTTP
  HTTP_BASE_PATH: Percorso base HTTP
  HTTP_TEST: Prova il server HTTP
  HTTP_TEST_OK: Server OK -- giochi elencati
  HTTP_TEST_EMPTY: Il catalogo è vuoto -- è valido, ma non dimostra niente sugli intervalli di byte
  HTTP_TEST_NO_ISO: Il catalogo non ha nessuna immagine supportata per provare un intervallo di byte
  HTTP_ERR_CONNECT: Impossibile raggiungere il server HTTP
  HTTP_ERR_CATALOG: games.csv manca, è illeggibile o troppo grande
  HTTP_ERR_RANGE: Il server non ha restituito esattamente i byte richiesti
  HTTP_LAUNCH_UNAVAILABLE: L'avvio via HTTP non è ancora implementato -- il catalogo si può solo sfogliare
  HTTP_ERR_COMPRESSED: Le immagini compresse (.zso) non sono ancora supportate via HTTP
  HTTP_NO_VMC: Le memory card virtuali non sono disponibili via HTTP -- usa una memory card fisica
  HTTP_TAB_HINT: HTTP legge games.csv dal tuo server. Imposta indirizzo, porta e percorso base nelle impostazioni di rete, poi usa Prova.
  RA_DISC_CHECK: 'RA: controlla il supporto del disco'
  RA_DISC_LAUNCH: 'RA: avvia il disco'
  RA_DISC_CHECKING: Controllo del disco per RetroAchievements
  RA_DISC_HASH_FAILED: Impossibile calcolare l'hash del disco -- vedi RA/hashes.txt nella cartella delle impostazioni
  RA_DISC_HOME_ERROR: La cartella delle impostazioni non può essere usata per le liste di tracciamento dei dischi
  RA_DISC_ENABLE: Attiva prima la telemetria RetroAchievements nelle impostazioni di rete
  RA_DISC_CHECK_FIRST: 'Nessuna lista di tracciamento per questo disco -- usa prima RA: controlla il supporto del disco'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d: hard disk trovato, ma la sua tabella delle partizioni APA è illeggibile. Non formattarlo -- i tuoi giochi potrebbero essere recuperabili.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: un''unità non è stata montata perché i suoi settori non sono da 512 byte (ad es. un disco con settori da 4K). OPL legge solo settori da 512 byte.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Questo titolo è una partizione APA a sé, e OPL non modifica mai la tabella delle partizioni. Rinominalo su un PC.
  POPS_SETTINGS_UNREADABLE: Impossibile leggere le impostazioni di POPSTARTER -- la memory card è occupata o illeggibile. Riprova al termine del caricamento.
  GLOBAL_PS_EMULATION_SETTINGS: Impostazioni globali di emulazione PS
  RA_NO_LINK_UNTRACKED: Rete non disponibile -- questa volta avvio senza RetroAchievements.
  IGR_USB_DRIVERS_PROMPT: Il percorso IGR è su USB, ma in %s mancano USBD.IRX e USBHDFSD.IRX, che servono alla console per raggiungere l'USB dopo un In-Game Reset. Senza di essi l'IGR torna al browser della PS2. Copiare ora i driver di RiptOPL? FMCB, OpenTuna e altri exploit caricano anche questi file e potrebbero comportarsi diversamente con essi. I file esistenti non vengono mai sostituiti. Solo USB FAT32.
  IGR_USB_DRIVERS_FAILED: Impossibile copiare i driver USB in %s (memory card piena o non scrivibile). L'IGR tornerà al browser della PS2.
  OFFICIAL_CFG_NOTIFICATION: Impostazioni ufficiali di OPL caricate da %s
  CFM_VMODE_HOLD_KEEP: Tieni premuto per mantenere
  BDM_PS2_FOLDERS_UNREADABLE: Impossibile aprire la cartella CD o DVD in %s (errore %d), quindi quell'unità non elenca giochi PS2. Premi SELECT sulla sua pagina per riprovare.
  NEUTRINO_BD_NO_DEVICE_NUMBER: Il file system di Neutrino è impostato su bd, ma questa unità non ha mai comunicato il suo numero di dispositivo, quindi Neutrino non può puntarvi. Imposta il file system di Neutrino di questo gioco su Auto o exfat.
  CFM_VMODE_REVERT_IN: Ripristino tra %d s
  EMBER_DITHER: Dithering di Ember
  HINT_EMBER_DITHER: Dithering di Ember (attivo o disattivo), scritto in EMBER/settings.txt dell'unità di avvio. Un valore per gioco ha la precedenza.
  EMBER_SHADING: Ombreggiatura di Ember
  HINT_EMBER_SHADING: 'Profondità di colore di Ember: 15 bit, o 24 bit (sperimentale). Scritta in EMBER/settings.txt dell''unità di avvio. Un valore per gioco ha la precedenza.'
  EMBER_CONTROLLER: Controller di Ember
  HINT_EMBER_CONTROLLER: 'Modalità controller di Ember: Auto, Analogico o D2A. Di solito è meglio impostarla per gioco (Triangolo > Impostazioni di gioco di Ember), che ha la precedenza.'
  EMBER_480P_CONFIRM: Ember in 480p non mostra immagini via composito. Usare 480p?
  EMBER_SHADING_24: 24 bit (sperimentale)
  EMBER_GAME_SETTINGS: Impostazioni di gioco di Ember
  HINT_EMBER_GAME_SETTING: Solo questo gioco. Premi OK per scrivere EMBER/games/<nome>/settings.txt prima dell'avvio. Un Predefinito non toccato mantiene il valore esistente nel file; riportare un valore su Predefinito ne rimuove la sostituzione.
  EMBER_TIMING: Temporizzazione di Ember
  HINT_EMBER_TIMING: 'Temporizzazione video di Ember: Auto segue la regione del disco, NTSC forza 60 Hz, PAL forza 50 Hz. Scritta in EMBER/settings.txt dell''unità di avvio.'
  EMBER_GLOBAL_WARNING: Queste impostazioni di Ember valgono per ogni gioco PS1, e alcuni giochi si bloccano con esse. Per cambiare un solo gioco, usa Triangolo > Impostazioni di gioco di Ember su quel gioco.
  RIPPS2_RANDOM: Casuale
  RIPPS2_ALL: Tutti
  RIPPS2_RANDOM_GAME: Gioco casuale
  HINT_RIPPS2_RANDOM_GAME: L2 e R2 insieme saltano a un gioco a caso. All'avvio apre anche ogni lista su un gioco a caso.
  RIPPS2_ALL_GAMES: Tutti i giochi
  RIPPS2_SET_METADATA: Imposta metadati
  RIPPS2_BOOT_LOCK: Boot Lock
  HINT_RIPPS2_BOOT_LOCK: 'Avvia RIPPS2 all''accensione tramite il tuo loader di avvio: PS2BBL e FMCB lo avviano subito, OSDMenu lo mette per primo nel suo menu, e l''EXIT di un gioco torna per la stessa strada. Disattivo rimette ciò che c''era prima. Ancora nessuno? Loader di avvio installa BIBLE.'
  HINT_COLORS_TEXT: Il colore del testo della lista dei giochi. I temi hanno il proprio; questo lo cambia per i temi integrati.
  HINT_COLORS_SELECTED: Il colore del gioco scelto e della riga scelta nelle pagine delle impostazioni.
  HINT_COLORS_DIALOG: Il colore delle pagine delle impostazioni e delle finestre di messaggio.
  HINT_COLORS_TITLE: Il colore del nome di un gioco nella sua pagina informazioni.
  HINT_COLORS_BACKGROUND: Il colore dietro a tutto quando non sono disegnate immagini né torri.
  HINT_COLORS_PLASMA: Il colore verso cui tende il vecchio sfondo al plasma di OPL (il tema <OPL>).
  HINT_COLORS_RESET: Rimette i sei colori qui sopra a quelli del tema.
  HINT_COVERFLOW_COUNT: Quante copertine RIPFLOW mostra su ogni lato di quella scelta.
  HINT_COVERFLOW_SCALE: Quanto è grande in RIPFLOW la copertina scelta rispetto alle altre.
  HINT_COVERFLOW_ANIM: Quanto velocemente scorrono le copertine quando ti muovi nel flusso.
  HINT_NARGS_QB: 'Quick Boot: salta la schermata di avvio di Neutrino. Attivo qui, viene inviato per ogni gioco; disattivo, RIPPS2 lo invia comunque da sé per i giochi USB, iLink e di rete, dove serve.'
  HINT_NARGS_DBC: 'Colori di debug: Neutrino riempie lo schermo di un colore a ogni passo del caricamento, così una foto mostra dove si ferma un gioco.'
  HINT_NARGS_LOGO: Mostra il logo PS2 prima del gioco (un secondo riavvio dell'IOP, che serve ad alcune unità iLink). Disattivo qui, RIPPS2 segue Avvio dei giochi > Logo PS2, e non lo invia mai per i giochi MMCE o di rete.
  HINT_NARGS_CWD: 'La cartella che il gioco vede come propria. Vuoto: quella predefinita di Neutrino.'
  HINT_NARGS_CFG: 'Un tuo file di configurazione di Neutrino (-cfg). Vuoto: quello di Neutrino.'
  HINT_NARGS_ELF: 'Avvia questo ELF invece del file di avvio indicato dal disco. Vuoto: quello del gioco.'
  HINT_NARGS_ATA0: Un'immagine di hard disk che Neutrino monta come hard disk interno della console, per i giochi che usano l'hard disk (-ata0).
  HINT_NARGS_ATA0ID: Il file di identificazione che accompagna quell'immagine di hard disk (-ata0id).
  HINT_NARGS_ATA1: Una seconda immagine di hard disk (-ata1).
  RIPPS2_LAST_USED: Ultimo usato
  RIPPS2_PAGE_BUTTONS: Tasti pagina
  HINT_RIPPS2_PAGE_BUTTONS: 'Quali tasti dorsali sfogliano le pagine della lista dei giochi. L2 / R2: sfogliano le pagine e L1 / R1 cambiano categoria. L1 / R1: sfogliano le pagine e L2 / R2 cambiano categoria. Tema: decide il tema; senza tema, L2 va all''inizio e R2 alla fine. L2 + R2 insieme scelgono sempre un gioco a caso.'
  RIPPS2_IGR_MENU: Menu di gioco
  HINT_RIPPS2_IGR_MENU: 'Attivo: L1+L2+R1+R2+SELECT+START mette in pausa il gioco: riprendi, esci, fai uno screenshot, vedi gli obiettivi o spegni. Disattivo: la combinazione esce subito dal gioco, come prima.'
  RIPPS2_BOOT_LOADER: Loader di avvio
  HINT_RIPPS2_BOOT_LOADER: Mostra cosa avvia ogni memory card all'accensione, e installa BIBLE (PS2BBL impostato per RIPPS2). I vecchi file di avvio della memory card vengono conservati.
  RIPPS2_MANAGE: Gestisci
  RIPPS2_ACHIEVEMENTS: Obiettivi
  RIPPS2_NBD_SERVER: Server NBD
  HINT_RIPPS2_NBD_SERVER: Condivide l'hard disk con un PC via rete. Una schermata di stato resta visibile mentre funziona.
  RIPPS2_START: Avvia
  RIPPS2_COVER_ART: Copertine
  HINT_RIPPS2_COVER_ART: Scarica una copertina per ogni gioco PS2 delle tue liste avviate che non ne ha, nella cartella ART di quell'unità, da ps2-covers di xlenore su GitHub. Servono il cavo di rete e internet.
  RIPPS2_DOWNLOAD: Scarica
  RIPPS2_GLYPHS: Icone della croce direzionale
  HINT_RIPPS2_GLYPHS: 'Le icone della croce direzionale accanto ai nomi di unità e formazioni. Comparsa le mostra quando cambi; Scomparsa le mostra all''apertura di una pagina. Tema: decide il tema.'
  RIPPS2_COLOR_THEME: Colore del tema
  HINT_RIPPS2_COLOR_THEME: 'Un colore per torri, sfere, vetro, lettore CD e browser di file, su tutte e tre le schede. Tema: decide il tema (blu RIPPS2 dove non decide).'
  RIPPS2_HINTS: Suggerimenti dei tasti
  HINT_RIPPS2_HINTS: 'I suggerimenti dei tasti in basso. Scompare a riposo li nasconde finché non premi un tasto. Tema: decide il tema.'
  RIPPS2_CATEGORY_BAR: Categorie/Barra laterale
  HINT_RIPPS2_CATEGORY_BAR: 'AVVIA DISCO, ARCHIVIAZIONE e FILE DI MEMORIA: i nomi in alto, o la barra laterale. Scompare a riposo sbiadisce i nomi, o fa scorrere via la barra laterale, finché non premi un tasto; torna subito. Tema: decide il tema.'
  RIPPS2_SOURCE_NAME: Nome della sorgente
  RIPPS2_STATUS: Stato
  RIPPS2_SOURCE: Sorgente
  HINT_RIPPS2_SOURCE_NAME: 'Il nome della sorgente sopra i giochi (TUTTI I GIOCHI, GIOCHI HDD e così via). Scompare a riposo lo dissolve con la barra delle categorie; Comparsa lo mostra invece grande al centro della pagina, come L3 nomina la lista, alla prima lista dopo l''avvio e a ogni cambio di sorgente, poi svanisce. Comparsa e nome fa entrambe le cose. I temi possono fare di Comparsa il loro Visibile. Tema: decide il tema.'
  RIPPS2_RECENTS: Giochi recenti
  HINT_RIPPS2_RECENTS: 'Giochi recenti, una pagina della barra laterale con gli ultimi giochi avviati, il più nuovo per primo: quanti ne tiene, da 1 a 99 (Triangolo digita il numero). Un gioco la cui unità è su Manuale la avvia quando lo scegli. 0 disattiva la pagina.'
  RIPPS2_CATEGORY_ORDER: Ordine delle categorie
  HINT_RIPPS2_CATEGORY_ORDER: 'Scambia Avvia disco e File di memoria: File di memoria per primo e Avvia disco per ultimo, sia nei nomi della barra sia nelle icone della barra laterale. Pensato per RIPFLOW (Interfaccia > Tema). Tema: decide il tema.'
  RIPPS2_MUSIC: Musica
  HINT_RIPPS2_MUSIC: Riproduce i file bgm nella cartella AUDIO accanto a RIPPS2 e nella cartella AUDIO di OPL su ogni unità avviata (Ogg senza tag, o WAV a 16 bit); quello chiamato Menu suona per primo. La musica propria di un tema suona al suo posto.
  RIPPS2_BIOS_SOUNDS: Suoni del BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'Scrive i suoni del menu di questa console, presi dal suo BIOS, nella cartella AUDIO come suoni di RIPPS2 (meno di 1 MB). La musica del menu ha una sua estrazione: Musica del BIOS.'
  RIPPS2_RIP: Estrai
  RIPPS2_HINTS_GLYPHS: Suggerimenti e icone
  HINT_RIPPS2_HINTS_GLYPHS: L'aspetto dei suggerimenti dei tasti e delle icone. Ogni riga parte da Tema, la scelta del tema; ogni altra scelta è tua e prevale su ogni tema.
  RIPPS2_HINT_LAYOUT: Disposizione dei suggerimenti
  HINT_RIPPS2_STARSIDE: 'Dove sta la stella di un gioco preferito nell''elenco. Sinistra: una colonna sua all''inizio di ogni riga. Destra: dopo il titolo. Nascosto (all''inizio): nessuna stella e nessuna colonna, i titoli per intero. Tema: ciò che dice il tema. R3 mette un gioco tra i preferiti in ogni caso; tieni R3 per 4 secondi su un elenco per nascondere le stelle o farle tornare (mette anche tra i preferiti il gioco sotto il cursore).'
  HINT_RIPPS2_HINT_LAYOUT: 'Riga: i suggerimenti su una riga. Colonna: un suggerimento per riga, una lista sul lato, a partire da dove il tema mette i suoi suggerimenti.'
  RIPPS2_HINT_LABELS: Etichette dei suggerimenti
  HINT_RIPPS2_HINT_LABELS: Solo icona disegna solo i tasti, per icone che portano le proprie parole. Badge unisce l'icona e il titolo di ogni suggerimento in un unico badge.
  RIPPS2_HINT_MENU: Suggerimento Menu (START)
  RIPPS2_HINT_REFRESH: Suggerimento Aggiorna (SELECT)
  RIPPS2_HINT_STAR: Suggerimento Preferito (R3)
  RIPPS2_HINT_VIEW: Suggerimento Vista (L3)
  HINT_RIPPS2_HINT_SHOW: Mostra o nasconde questo suggerimento. Il suo tasto funziona in ogni caso.
  RIPPS2_GLYPH_SET: Set di icone
  HINT_RIPPS2_GLYPH_SET: 'Le icone dei tasti su ogni pagina: quelle del tema, quelle di RIPPS2, Standard (tasti scuri, simboli colorati) o Bianco (bianco pieno).'
  RIPPS2_HINT_ORDER: Ordine dei suggerimenti
  HINT_RIPPS2_HINT_ORDER: Ordina i suggerimenti. Tema mantiene l'ordine del tema; Il tuo ordine è quello impostato qui.
  RIPPS2_HINT_ORDER_FOLLOW: Ordine
  RIPPS2_GRID_LAYOUT: Disposizione della griglia
  HINT_RIPPS2_GRID_LAYOUT: Quante copertine contiene una pagina della griglia, con la spaziatura di RIPPS2. Tema mantiene quella del tema.
  RIPPS2_LAUNCH_DISC: Disco all'avvio
  HINT_RIPPS2_LAUNCH_DISC: Il disco di un gioco compare all'avvio. Comparsa si posa e svanisce; Rotazione gira sempre più veloce finché il gioco parte; Zoom si posa, poi si ingrandisce per leggersi bene e resta.
  RIPPS2_TRANSITION: Transizione di pagina
  HINT_RIPPS2_TRANSITION: 'Come arriva una nuova pagina quando passi a un''altra categoria: dal colore di sfondo del tema, o da un lampo. Tema mantiene la scelta del tema.'
  RIPPS2_CATEGORY_LAYOUT: Disposizione delle categorie
  HINT_RIPPS2_CATEGORY_LAYOUT: 'Dove stanno le tre categorie: i loro nomi in alto, o icone lungo la barra laterale, ciascuna con un cassetto delle sue pagine (Sinistra su un elenco porta lì), oppure Menu: nessuna barra, le categorie nel menu START come in un tema fatto per OPL. Tema mantiene quella del tema.'
  RIPPS2_CACHE: Cache
  HINT_RIPPS2_CACHE: 'Come viene conservato l''elenco giochi di ogni sorgente perché la sua pagina si apra subito: Fast Cache, l''elenco dell''HDD interno e l''Aggiornamento automatico.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'Ogni fonte tiene il suo ultimo elenco di giochi (RIPPS2.LST accanto alle sue cartelle CD e DVD) e lo mostra appena la fonte risponde. Trust Cache decide se la fonte viene riletta dopo. Disattivo: ogni elenco viene prima letto dalla sua fonte, come prima.'
  HINT_RIPPS2_VIGNETTE: Scurisce i bordi di ogni copertina tranne quella scelta, per farla risaltare. Debole è la metà di Pieno.
  RIPPS2_GRID_WIDE: Disposizione della griglia in panoramico
  HINT_RIPPS2_GRID_WIDE: La pagina della griglia solo con un'immagine 16:9 (Panoramico, 720p, 1080i), dove le copertine sono più strette e ne entrano di più. Tema usa quella del tema; Come segue la Disposizione della griglia.
  RIPPS2_BGBLUR: Sfocatura dello sfondo
  HINT_RIPPS2_BGBLUR: Quanto il vetro smerigliato sfoca l'immagine di sfondo del gioco. Tema usa quella del tema (Debole su RIPGRID e Adapt).
  HINT_RIPPS2_HINT_SLOT: Il suggerimento in questa posizione. Quello che c'era passa al vecchio posto di quello scelto.
  PS1_SAVE_GUIDANCE: I salvataggi PS1 dipendono da Ember o POPSTARTER; le impostazioni VMC della PS2 non valgono.
  NEUTRINO_SHOW_ARGS: Mostra gli argomenti di avvio
  HINT_NEUTRINO_SHOW_ARGS: Prima di ogni avvio con Neutrino, mostra tutti gli argomenti che Neutrino riceverà e chiede se continuare. Indietro torna al menu senza avviare.
  NEUTRINO_ARGS_CONFIRM: Neutrino partirà con questi argomenti. Avviare?
  HINT_NARGS_EXTRA: Altre opzioni di Neutrino, separate da spazi, inviate dopo tutto quanto sopra. RIPPS2 aggiunge sempre -bsd e -dvd per l'unità e l'ISO del gioco, -mc0 e -mc1 per le sue VMC, -gsm per la sua modalità video e le modalità di compatibilità proprie del gioco. Un'opzione con una riga propria qui sopra (come -logo) passa in quella riga al salvataggio, e viene comunque inviata.
  HINT_RIPPS2_THEME: L'aspetto di ogni pagina. Nella lista dei giochi tieni premuto SELECT per 4,2 secondi per passare al tema successivo; una pressione breve di SELECT aggiorna ancora la lista.
  GAME_TYPE_LABELS: Mostra le etichette [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: La lista dei trucchi non è stata salvata nella cartella di Neutrino, quindi Neutrino non può usarla. Avviare senza trucchi?
  AUTO_CREATE_VMC: Crea la VMC al primo avvio
  HINT_AUTO_CREATE_VMC: Avviare un gioco PS2 senza VMC nello slot 1 crea una memory card da 8 MB sul dispositivo del gioco, con il nome proposto dalla schermata VMC (condivisa da tutti i dischi del gioco), e la assegna. Con Neutrino, non sull'hard disk APA (un hard disk exFAT funziona).
  AUTO_VMC_CREATING: Creazione della VMC di questo gioco...
  AUTO_VMC_FAILED: Impossibile creare la VMC di questo gioco. Il gioco parte senza.
  RIPPS2_BIOS_MUSIC: Musica del BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'Scrive la musica del menu di questa console (il brano d''atmosfera del suo browser, circa 15 MB in WAV) in una cartella AUDIO a tua scelta: accanto a RIPPS2, o quella di OPL su un''unità avviata. Troppo grande per una memory card. La sua dimensione viene mostrata prima.'
  SAVE_ICONS: Icone di salvataggio 3D
  HINT_SAVE_ICONS: Mostra l'icona di salvataggio del gioco scelto, che ruota, dove il tema prevede un posto per essa. Legge prima la VMC del gioco, poi le memory card.
  NETBOOT_RESTART_NOW: Il protocollo di rete cambia dopo un riavvio. Salvare le impostazioni e riavviare OPL ora?
  HINT_NET_PROTOCOL: 'Quale servizio di rete usa RiptOPL: una condivisione SMB, UDPFS, UDPBD o HTTP. Lasciarne uno già in esecuzione richiede un riavvio.'
  HINT_UDPFS_ACCESS: Solo UDPFS. File legge ISO sparse dalla cartella dei giochi del server; IMG legge un'immagine disco come un'unità. SMB e HTTP usano sempre File, UDPBD sempre IMG.
  HINT_SMB_VERSION: Quale versione di SMB usare con la condivisione del PC.
  HINT_NET_ADVANCED: Sblocca la modifica della modalità di collegamento Ethernet e della porta SMB.
  HINT_ETH_LINK_MODE: Forza velocità e duplex del collegamento di rete. Lascialo su Auto a meno che il collegamento non cada di continuo.
  HINT_IP_ADDR_TYPE: Statico usa l'indirizzo qui sotto; DHCP lo chiede al router. UDPFS e UDPBD usano sempre Statico.
  HINT_PS2_IP: L'indirizzo IP della PS2 stessa. Scegline uno che nessun altro dispositivo usa, nello stesso intervallo del tuo PC.
  HINT_NETMASK: Maschera di sottorete, di solito 255.255.255.0.
  HINT_GATEWAY: L'indirizzo del tuo router, di solito gli stessi primi tre numeri che finiscono con .1.
  HINT_DNS: Indirizzo del server DNS. Di solito uguale al gateway.
  HINT_SMB_ADDR_TYPE: Raggiungere il PC tramite il suo indirizzo IP o il suo nome NetBIOS (nome del computer).
  HINT_SMB_ADDRESS: 'Il PC che condivide i tuoi giochi: il suo indirizzo IP, o il nome del computer quando il tipo di indirizzo è NetBIOS.'
  HINT_SMB_PORT: 'Porta SMB. Deve corrispondere al PC: PS2 Servers usa 1111, le condivisioni Windows e Samba usano 445.'
  HINT_SMB_USER: Nome utente SMB. guest funziona per la maggior parte delle condivisioni.
  HINT_HTTP_SERVER: Indirizzo IP del server di giochi HTTP.
  HINT_HTTP_PORT: Porta su cui ascolta il server di giochi HTTP.
  HINT_HTTP_BASE: Cartella del server HTTP che contiene games.csv. / è la radice del server.
  HINT_HTTP_TEST: Prova il server HTTP con i valori qui sopra e riporta ciò che ha trovato.
  HINT_RA_TELEMETRY: Interruttore generale di RetroAchievements. Disattivo avvia i giochi senza stack di rete né istantanee, come una build normale.
  HINT_RA_BADGES: Segna nella lista i giochi che hanno obiettivi. Resta spento finché la telemetria è disattivata.
  HINT_POPS_NET_BUTTON: Modifica i file di rete di POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), che servono ai giochi PS1 via SMB.
  HINT_POPS_IP_TYPE: 'Come la PS2 ottiene il suo indirizzo mentre un gioco PS1 gira via SMB: Statico o DHCP.'
  HINT_POPS_IP: L'indirizzo IP della PS2 mentre un gioco PS1 gira via SMB.
  HINT_POPS_SMB_IP: Indirizzo IP del PC che condivide i tuoi giochi PS1.
  HINT_POPS_SMB_SHARE: Nome della condivisione su quel PC che contiene la cartella POPS.
  HINT_LASTPLAYED: Parte dall'ultimo gioco che hai avviato.
  HINT_LANGUAGE: Lingua dei menu. Aggiungine altre mettendo file lang_*.lng in una cartella LNG.
  HINT_GSM_DEFAULTS_BUTTON: Le correzioni della modalità video che ogni gioco riceve, a meno che non abbia impostazioni GSM proprie.
  HINT_DEFDEVICE: La pagina su cui RiptOPL si apre all'avvio.
  HINT_MMCE_MODE: 'Giochi su un SD2PSX o una MemCard PRO2. Automatica lo avvia all''accensione: la scelta più rapida per una memory card collegata, con i suoi giochi in Tutti i giochi fin dall''inizio. Manuale lo avvia quando apri la sua pagina, Disattivo lo nasconde.'
  HINT_MMCE_SETTINGS_BUTTON: Slot, bootcard IGR, GameID e opzioni di temporizzazione per MMCE.
  HINT_ENABLE_USB: Carica il driver di archiviazione USB.
  HINT_ENABLE_MX4SIO: Carica il driver dell'adattatore per schede SD MX4SIO.
  HINT_ENABLE_ILINK: Carica il driver di archiviazione iLink (FireWire).
  HINT_NETSTART: 'Avvia la rete: Auto all''avvio, Manuale all''apertura della sua pagina. Disattivo lascia stare l''adattatore di rete.'
  HINT_APPMODE: La pagina Applicazioni. Auto parte all'avvio, Manuale alla sua apertura, Disattivo la nasconde.
  HINT_FAVMODE: La pagina Giochi preferiti. Auto parte all'avvio, Manuale alla sua apertura, Disattivo la nasconde.
  HINT_BDMA_BUTTON: Quale driver exFAT usa POPSTARTER per i giochi PS1 su USB, MX4SIO, MMCE, hard disk o iLink.
  HINT_VCD_LIST_BUTTON: 'Come vengono elencati i giochi PS1: nascondere gli ID dei giochi, mostrare solo il disco 1, mostrare le partizioni PP dell''hard disk.'
  HINT_MMCE_SLOT: In quale slot per memory card si trova il dispositivo MMCE. Auto lo trova.
  HINT_MMCE_GAMEID: Dice al dispositivo MMCE quale gioco sta partendo, così passa alla memory card di quel gioco.
  HINT_MMCE_COMM_BUTTON: Opzioni di temporizzazione del collegamento MMCE. Cambiale solo se i giochi si bloccano o caricano lentamente.
  HINT_MMCE_PATH_BUTTON: Dove si trovano le cartelle dei giochi sulla memory card MMCE.
  HINT_MMCE_PREFIX: Sottocartella della memory card MMCE che contiene CD, DVD e le altre cartelle di OPL. Vuoto usa la radice della memory card.
  HINT_GAME_TYPE_LABELS: Antepone [PS1] o [PS2] al nome di ogni gioco. Solo visualizzazione.
  HINT_MENU_VMODE: Uscita video del menu. I giochi usano invece GSM. Tieni premuto Conferma per mantenere una nuova modalità.
  HINT_THEME: L'aspetto del menu. I temi vengono letti dalla cartella THM di ogni dispositivo.
  HINT_COVERFLOW_BUTTON: Numero, dimensione, animazione e oscuramento delle copertine per il tema Coverflow.
  HINT_ARTWORK_BUTTON: 'Quali immagini caricare: copertine, immagini del disco, sfondi e icone di salvataggio.'
  HINT_COLORS_BUTTON: Colori del testo, dell'evidenziazione, delle finestre e dello sfondo.
  HINT_NOTIFICATIONS: Brevi avvisi quando si carica un file di configurazione, di tema o di lingua.
  HINT_AUTOSORT: Ordina le liste dei giochi dalla A alla Z. Disattivo mantiene l'ordine in cui sono stati trovati.
  HINT_AUTOREFRESH: Aggiunge i giochi dei dispositivi appena collegati senza aggiornare a mano.
  HINT_COVERART: Carica le copertine dalla cartella ART.
  HINT_DISCART: Mostra l'immagine del disco (<ID>_ICO). Disattivo nasconde il disco ma mantiene copertine e sfondi.
  HINT_BGART: Mostra lo sfondo di un gioco (<ID>_BG) quando il tema ne usa uno.
  HINT_ART_TAR: Legge anche le immagini raccolte in ART/art.tar.
  HINT_ART_DELAY: Quanto il cursore resta su un gioco prima che le sue immagini si carichino. Più alto salta le immagini quando scorri veloce.
  HINT_TXTCOLOR: Colore del testo normale del menu.
  HINT_SELCOLOR: Colore dell'elemento evidenziato.
  HINT_UICOLOR: Tinta di sfondo delle finestre di dialogo.
  HINT_TITLECOLOR: Colore dei titoli dei giochi nella lista.
  HINT_BGCOLOR: Colore di sfondo del menu.
  HINT_PLASCOLOR: Colore mescolato nello sfondo animato.
  HINT_RESETCOLOR: Ripristina i colori integrati di RiptOPL, non quelli del tema.
  HINT_WIDESCREEN: Disegna il menu per un televisore 16:9.
  HINT_XOFF: Sposta il menu a sinistra o a destra sullo schermo. Memorizzato per ogni modalità video.
  HINT_YOFF: Sposta il menu in alto o in basso sullo schermo. Memorizzato per ogni modalità video.
  HINT_MENU_OVERSCAN: Restringe il menu verso l'interno se il televisore ne taglia i bordi. Memorizzato per ogni modalità video.
  HINT_APPLYGAMEID: Mostra un codice a barre all'avvio di un gioco, così i dispositivi Pixel FX, RetroGEM e PS2Digital cambiano profilo.
  HINT_NEUTRINO_DEFAULTS_BUTTON: Percorso, modalità video e argomenti di Neutrino per ogni gioco.
  HINT_OSD_DEFAULTS_BUTTON: Lingua della console, formato dello schermo e modalità video passati ai giochi.
  HINT_ENWRITEOP: Permette di rinominare ed eliminare giochi e di creare VMC. Non tocca mai la tabella delle partizioni dell'hard disk.
  HINT_DEBUG: 'Aiuto per sviluppatori: schermate colorate mentre un gioco si avvia, e contatori di caricamento delle immagini nel menu.'
  HINT_BDMPREFIX: Sottocartella su unità USB, MX4SIO, iLink ed exFAT che contiene le cartelle dei giochi. Vuoto usa la radice dell'unità.
  HINT_ETHPREFIX: Sottocartella della condivisione SMB che contiene le cartelle dei giochi. Vuoto usa la radice della condivisione.
  HINT_HDDGAMELISTCACHE: Ricorda la lista dei giochi dell'hard disk APA per velocizzare le scansioni successive.
  HINT_BDMCACHE: Cache di lettura anticipata per USB e altre unità BDM in gioco. Più grande può rendere più fluido lo streaming ma usa più memoria.
  HINT_HDDCACHE: Cache di lettura anticipata per l'hard disk interno in gioco.
  HINT_SMBCACHE: Cache di lettura anticipata per SMB in gioco.
  HINT_CORE_LOADER: Il core di questo gioco dove entrambi sono supportati. UDPFS/UDPBD solo con Neutrino; SMB/HTTP solo con <OPL>. Predefinito segue Avvio dei giochi.
  HINT_DMA_MODE: Modalità di trasferimento dell'hard disk interno per questo gioco. Abbassala se il gioco scatta o si blocca.
  HINT_DNAS_GAMEID: ID del disco per i giochi online DNAS. Carica dal disco lo legge dal disco originale.
  HINT_LOAD_FROM_DISC: Legge l'ID DNAS dal disco originale nell'unità.
  HINT_ALTSTARTUP: Avvia questo ELF dall'immagine disco invece di quello indicato da SYSTEM.CNF.
  HINT_VMC_DEFINE: Scegliere, creare o ridimensionare la memory card virtuale di questo slot.
  HINT_VMC_ACTION: Usa generica dà a questo slot una memory card condivisa; Reimposta cancella la scelta.
  HINT_VMC_NAME: Nome del file della memory card, tenuto nella cartella VMC.
  HINT_VMC_CREATE: Crea la memory card, o le applica una nuova dimensione.
  HINT_VMC_DELETE: Elimina questo file di memory card.
  HINT_SETTINGS_SOURCE: Globale usa le impostazioni comuni; Per gioco le tiene solo per questo gioco.
  HINT_PADMACRO_TOGGLE: Mentre premuto rallenta la levetta solo mentre tieni premuto il tasto; Alternato dal tasto la attiva e disattiva.
  HINT_SFX: Effetti sonori del menu.
  HINT_BOOT_SND: 'Il suono di avvio all''avvio di RIPPS2. Attivo: dalla cartella AUDIO, quando la sua unità è pronta. Attivo (veloce): una copia accanto a RIPPS2 sulla memory card da cui parte (offerta quando lo scegli), suonata mentre i pilastri salgono. Suona anche con gli effetti sonori disattivati.'
  HINT_BGM: Riproduce la musica del tema, o il tuo file di musica del tema predefinito.
  HINT_SFX_VOLUME: Volume degli effetti sonori del menu.
  HINT_BOOT_SND_VOLUME: Volume del suono di avvio.
  HINT_BGM_VOLUME: Volume della musica di sottofondo.
  HINT_SCROLL: Quanto velocemente scorrono le liste quando tieni premuta una direzione.
  HINT_SELECTBUTTON: 'Quale tasto conferma: Croce o Cerchio.'
  HINT_XSENSITIVITY: Quanto facilmente la levetta sinistra sposta il cursore a sinistra e a destra. Disattivo la ignora.
  HINT_YSENSITIVITY: Quanto facilmente la levetta sinistra sposta il cursore su e giù. Disattivo la ignora.
  HINT_PADEMU_GLOBAL: DualShock 3/4 via USB o Bluetooth, e multitap, per ogni gioco.
  HINT_PADMACRO_GLOBAL: Rallentamento della levetta, inversione degli assi e turbo per ogni gioco.
  HINT_COVERFLOW_DIM: Scurisce le copertine laterali.
  HINT_OSD_ENABLE: Passa al gioco le impostazioni qui sotto. Disattivo usa quelle della console.
  HINT_OSD_TVASPECT: Formato del televisore passato al gioco.
  HINT_OSD_VMODE: Modalità video passata al gioco.
  DNAS_ID: ID DNAS
  NEUTRINO_PADEMU_WARN: L'emulazione del controller non è disponibile con Neutrino. Usa un controller PS2 o una sorgente che supporti il core <OPL>.
  RA_MODE: Modalità RA
  RA_HOST_IP: IP del compagno RA (0.0.0.0 = automatico)
  HINT_RA_HOST_IP: IPv4 facoltativo di un PC dedicato a RetroAchievements. Usa 0.0.0.0 per il vecchio ripiego SMB/HTTP o la ricerca di Xerabora. Non cambia le impostazioni del server di giochi.
  HINT_RA_MODE: Scegli il client PC. Xerabora è il predefinito; Caduceus controlla prima la sua sessione collegata.
  RA_CADUCEUS_OFFLINE: La sessione RA di Caduceus è offline.
  RA_CADUCEUS_SIGN_IN: Accedi a RetroAchievements in Caduceus, poi riprova.
