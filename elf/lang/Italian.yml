  The ART Pack in %s is removed. Art loads from the ART folders again.: Il pacchetto ART in %s è stato rimosso. Le immagini arrivano di nuovo dalle cartelle ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
