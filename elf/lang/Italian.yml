  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'ACCANTO A RIPPS2: %sAUDIO%s, letto per primo all''avvio'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- PS2BBL viene legato a questa card dalla console e scritto come %s/%s.
  
    - La sua configurazione, mc%d:/SYS-CONF/PS2BBL.INI, avvia RIPPS2 dove si trova (%s) senza attesa (0 ms, che PS2BBL Extended non consente), BOOT LOCK attivo. RIPPS2 stesso non viene copiato.
  
    Il processore di I/O si riavvia per questo e ogni lettura delle unità si ferma finché non ha finito; musica e unità tornano dopo. Lascia la card inserita e la console accesa finché non dice di aver finito.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Una card SD2PSX o MMCE può proteggersi dopo una scrittura rifiutata: se ora manca la memory card o l''unità MMCE, spegni e riaccendi la console.'
  BOOT LOCK ON: BOOT LOCK ATTIVO
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'Fatto: la memory card nello slot %d avvia ciò che avviava prima di BIBLE. BIBLE resta in mc%d:/%s.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
    '
  : 'Per una memory card PS2 standard da 8 MB (una MagicGate, o una card BOOT SD2PSX o MMCE): quella nello slot %d. All''accensione PS2BBL legge la configurazione dello slot 2 prima di quella dello slot 1.
  
    '
  MEMORY CARD IN SLOT %d  (%s): MEMORY CARD NELLO SLOT %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL non può avviare RIPPS2 da dove si trova ora (raggiunge memory card, unità USB e MX4SIO), e RIPPS2 non si copia da solo. Metti RIPPS2.ELF su una memory card o un'unità USB e avvialo da lì, oppure usa PS2BBL Extended, che legge MMCE e l'HDD.
  RESTORE SLOT %d'S OLD BOOT LOADER: RIPRISTINA IL VECCHIO LOADER DELLO SLOT %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BIBLE è installato sulla memory card nello slot %d (mc%d:/%s/%s), BOOT LOCK attivo: all''accensione avvia subito RIPPS2 da %s.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: installazione di BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: installazione di BIBLE
  
    RIPPS2 gira da %s, che PS2BBL non sa leggere (legge memory card, USB e MX4SIO), e RIPPS2 non si copia da solo. La configurazione PS2BBL Extended di questa card (%s) lo legge: START attiva BOOT LOCK, così all''accensione avvia RIPPS2 da %s. Nient''altro cambia sulla card.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: installazione di BIBLE
  
    RIPPS2 gira da %s, che PS2BBL non sa leggere: avvia programmi da una memory card, un''unità USB o MX4SIO, e RIPPS2 non si copia da solo. Metti RIPPS2.ELF su uno di questi (la cartella APPS di una memory card o un''unità USB), avvialo da lì e poi installa di nuovo BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: installazione di BIBLE
  
    La memory card nello slot %d: BIBLE (mc%d:/%s) viene messo da parte e ciò che aveva sostituito (mc%d:/%s) torna al suo posto. Non si cancella nulla. La configurazione PS2BBL resta com''è (BOOT LOCK può disattivare il blocco).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: installazione di BIBLE (PS2BBL legato alla memory card)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: installazione di BIBLE (ripristino di ciò che c''era)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: installazione di BIBLE (riavvio del processore di I/O)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: installazione di BIBLE (scrittura sulla memory card)'
  SET UP BIBLE: INSTALLA BIBLE
  ? 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: Setting up BIBLE. PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?'
  : 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: installazione di BIBLE. PS2BBL di El Isra, installato da RIPPS2 su una memory card PS2 standard da 8 MB o sull''HDD interno: un avvio a 0 ms all''accensione (PS2BBL Extended non consente 0), RIPPS2 per primo da dove si trova (non viene mai copiato), e un tasto tenuto all''accensione porta ancora al browser (TRIANGLE), a un disco (START) e a ciò che c''era prima (CIRCLE). Installarlo, ripararlo o ripristinare ciò che ha sostituito?'
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: La memory card nello slot %d ha %d KB liberi e BIBLE ne richiede %d KB. Libera un po' di spazio e riprova.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : La memory card nello slot %d ha rifiutato PS2BBL, quindi RIPPS2 ha lasciato la card com'era. Controlla lo spazio libero e riprova. (DIAG.TXT accanto a RIPPS2 contiene ciò che ha risposto la card.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : La memory card nello slot %d non ha voluto mettere da parte BIBLE, quindi non è cambiato nulla. (DIAG.TXT accanto a RIPPS2 contiene ciò che ha risposto la card.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): La memory card nello slot %d non ha voluto riprendere %s, quindi BIBLE è rimasto. (DIAG.TXT accanto a RIPPS2 contiene ciò che ha risposto la card.)
  MUSIC: MUSICA
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s non ha %s. RIPPOPS ha trovato l''emulatore PS1 di Sony su %s: START copia %s qui e avvia il gioco.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 non vede %s in %s%s. POPSTARTER ha bisogno di POPS_IOX.PAK con POPS.PAK, oppure con POPS.ELF e IOPRP252.IMG: l''emulatore PS1 di Sony, dalla tua console. Potrebbe trovarli dove RIPPS2 non guarda (se i tuoi giochi partono, è così). START avvia, e per questa unità non lo chiede più.'
  ' (The configs found were set: %s.)': ' (Le configurazioni trovate sono state impostate: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Salva una volta le sue impostazioni con il suo configuratore, poi riattiva BOOT LOCK.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s non può avviare RIPPS2 da dove si trova ora (%s), e RIPPS2 non si copia da solo. Metti RIPPS2.ELF su una memory card o un''unità USB e avvialo da lì.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK non ha potuto scrivere la configurazione del loader di avvio. Controlla che la memory card o l'unità non sia protetta da scrittura, poi riprova.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK non ha trovato nessuna configurazione del loader di avvio da modificare.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK è disattivo. Il tuo loader di avvio avvia ciò che avviava prima (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK è attivo. %s ora avvia RIPPS2 all'accensione (%s), e un Percorso IGR vuoto riporta l'EXIT di un gioco per la stessa strada. Tieni premuto uno dei suoi tasti mentre la console si avvia per raggiungere altro.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'BOOT LOCK ha messo RIPPS2 per primo nel menu di OSDMenu (%s). OSDMenu non avvia nulla da solo: scegli RIPPS2 lì, e l''EXIT di un gioco torna a quel menu. Per una console che avvii subito RIPPS2, BIBLE mette PS2BBL su una memory card (Loader di avvio).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK funziona tramite un loader di avvio su una memory card (PS2BBL, FMCB o OSDMenu), e qui non ce n'è nessuno.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: La memory card nello slot %d avvia %s all'accensione, e BOOT LOCK non ha trovato nessuna sua configurazione da modificare (cerca %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'La memory card nello slot %d avvia %s all''accensione, che BOOT LOCK non può impostare: funziona tramite PS2BBL, FMCB e OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Su questa console c'è un loader di avvio con il blocco di RIPPS2.
