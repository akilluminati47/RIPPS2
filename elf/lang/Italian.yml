  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : RIPPS2 suona la musica del menu di questa console, il brano d'atmosfera del suo browser (%d:%02d), dalle note del BIOS stesso e la scrive come WAV di %s in %s; nessuna memory card ha spazio per essa. Un %s già presente viene sostituito. Ci vogliono un paio di minuti.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'RIPPS2 legge i suoni dal BIOS di questa console e li scrive in %s come suoi suoni: cursore, conferma, annulla, pagine, categoria, messaggi, disco, errore, salvataggio, unità e casuale, più la musica di avvio e di lancio dei giochi, suonata dalle note del BIOS stesso. I file con questi nomi già presenti vengono sostituiti.'
