  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 era occupato a leggere un''unità e non è riuscito a riavviare il processore di I/O. Non è stato modificato niente: riprova tra un momento.'
