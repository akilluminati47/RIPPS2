  The HDD partition BIBLE uses went away. Nothing was changed.: La partizione dell'hard disk usata da BIBLE è sparita. Non è stato modificato niente.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Il vecchio programma di avvio dell'hard disk è tornato. BIBLE non si avvia più dall'hard disk.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
