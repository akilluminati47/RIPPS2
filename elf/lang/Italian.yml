  ? 'Run the xeRAbora client on a PC on the same network, signed in to your RetroAchievements account. Then, for a game on USB, MMCE, SMB or the HDD: open its game menu (TRIANGLE) and CHECK GAME SUPPORT. A tracked game gets the RA badge; with TELEMETRY on, start it and unlocks pop up over the game. For a disc in the tray, use CHECK THE DISC, then PLAY THE DISC WITH ACHIEVEMENTS. Games started through Neutrino, POPSTARTER or Ember are not tracked yet.'
  : 'Avvia il client xeRAbora su un PC della stessa rete, collegato al tuo account RetroAchievements. Poi, per un gioco su USB, MMCE, SMB o hard disk: apri il suo menu (TRIANGOLO) e CONTROLLA IL SUPPORTO DEL GIOCO. Un gioco tracciato riceve il badge RA; con la TELEMETRIA attiva, avvialo e gli sblocchi compaiono sopra il gioco. Per un disco nel vassoio usa CONTROLLA IL DISCO, poi GIOCA IL DISCO CON GLI OBIETTIVI. I giochi avviati tramite Neutrino, POPSTARTER o Ember non sono ancora tracciati.'
