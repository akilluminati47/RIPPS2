  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot è attivo. I suoni occupano %d KB e la memory card da cui gira RIPPS2 ha %d KB liberi, quindi restano in %s.
