  RIPPS2 cannot tell where its folder is, so there is nowhere to put the sounds.: لا يستطيع RIPPS2 معرفة مكان مجلده، لذا لا يوجد مكان لوضع الأصوات.
  ? RIPPS2 plays this console's menu music, its browser's ambient piece (%d:%02d), from the BIOS's own notes and writes it as a WAV of %s to %s; no memory card has room for it. A %s already there is replaced. It takes a minute or two.
  : يعزف RIPPS2 موسيقى قائمة هذا الجهاز، المقطوعة المحيطية لمتصفحه (%d:%02d)، من نغمات BIOS نفسه ويكتبها كملف WAV بحجم %s في %s؛ لا توجد بطاقة ذاكرة تتسع لها. سيُستبدل %s الموجود هناك. يستغرق ذلك دقيقة أو دقيقتين.
  ? 'RIPPS2 reads the sounds from this console''s own BIOS and writes them to %s as its sounds: cursor, confirm, cancel, pages, category, messages, disc, error, save, drives and random, and the boot and game launch music, played from the BIOS''s own notes. Files of those names already there are replaced.'
  : 'يقرأ RIPPS2 الأصوات من BIOS هذا الجهاز نفسه ويكتبها في %s كأصوات له: المؤشر، والتأكيد، والإلغاء، والصفحات، والفئة، والرسائل، والقرص، والخطأ، والحفظ، والمحركات، والعشوائي، وموسيقى الإقلاع وتشغيل الألعاب، معزوفة من نغمات BIOS نفسه. ستُستبدل الملفات التي تحمل هذه الأسماء الموجودة هناك.'
