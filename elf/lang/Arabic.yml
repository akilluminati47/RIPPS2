  This MMCE card cannot rename a file, which compression needs for its last step. Update its sd2psXtd firmware to 1.4.0 or newer (sd2psxtd.github.io/download), then try again. Nothing was changed.: لا تستطيع بطاقة MMCE هذه إعادة تسمية ملف، وهو ما يحتاجه الضغط في خطوته الأخيرة. حدّث برنامجها الثابت sd2psXtd إلى الإصدار 1.4.0 أو أحدث (sd2psxtd.github.io/download)، ثم حاول مرة أخرى. لم يتغير شيء.
