  HINT_RIPPS2_IGR_MENU: 'تشغيل: L1+L2+R1+R2+SELECT+START يوقف اللعبة مؤقتًا: متابعة أو خروج أو التقاط صورة للشاشة أو عرض الإنجازات أو إيقاف التشغيل. إيقاف: تخرج التركيبة من اللعبة فورًا، كما كان من قبل.'
  RIPPS2_BOOT_LOADER: محمّل الإقلاع
  HINT_RIPPS2_BOOT_LOADER: يعرض ما تشغّله كل بطاقة ذاكرة عند التشغيل، ويثبّت BIBLE (PS2BBL مضبوط لـ RIPPS2). تُحفظ ملفات الإقلاع القديمة للبطاقة.
  RIPPS2_MANAGE: إدارة
  RIPPS2_ACHIEVEMENTS: الإنجازات
  RIPPS2_NBD_SERVER: خادم NBD
  HINT_RIPPS2_NBD_SERVER: يشارك القرص الصلب مع حاسوب عبر الشبكة. تبقى شاشة الحالة ظاهرة أثناء عمله.
  RIPPS2_START: تشغيل
  RIPPS2_COVER_ART: الأغلفة
  HINT_RIPPS2_COVER_ART: ينزّل غلافاً لكل لعبة PS2 في قوائمك المشغّلة ليس لها غلاف، إلى مجلد ART في ذلك المحرك، من ps2-covers الخاص بـ xlenore على GitHub. يحتاج إلى كابل الشبكة والإنترنت.
  RIPPS2_DOWNLOAD: تنزيل
  RIPPS2_GLYPHS: رموز أزرار الاتجاه
  HINT_RIPPS2_GLYPHS: 'رموز أزرار الاتجاه بجانب أسماء المحركات والتشكيلات. الظهور التدريجي يعرضها عند التبديل؛ والاختفاء التدريجي يعرضها أثناء فتح الصفحة. السمة: تقرر السمة.'
  RIPPS2_COLOR_THEME: لون السمة
  HINT_RIPPS2_COLOR_THEME: 'لون واحد للأبراج والكرات والزجاج ومشغل الأقراص ومتصفح الملفات، في التبويبات الثلاثة. السمة: تقرر السمة (أزرق RIPPS2 حيث لا تقرر).'
  RIPPS2_HINTS: تلميحات الأزرار
  HINT_RIPPS2_HINTS: 'تلميحات الأزرار على طول الأسفل. التلاشي عند الخمول يخفيها حتى تضغط زراً. السمة: تقرر السمة.'
  RIPPS2_CATEGORY_BAR: الفئات/الشريط الجانبي
  HINT_RIPPS2_CATEGORY_BAR: 'تشغيل القرص، والتخزين، وملفات الذاكرة: الأسماء في الأعلى، أو الشريط الجانبي. تلاشٍ عند الخمول يُبهت الأسماء، أو يزيح الشريط الجانبي، حتى تضغط زراً؛ ويعود فوراً. السمة: تقرر السمة.'
  RIPPS2_SOURCE_NAME: اسم المصدر
  RIPPS2_STATUS: الحالة
  RIPPS2_SOURCE: المصدر
  HINT_RIPPS2_SOURCE_NAME: 'اسم المصدر فوق الألعاب (كل الألعاب، ألعاب HDD وهكذا). التلاشي عند الخمول يخفيه مع شريط الفئات؛ والظهور المفاجئ يعرضه بدلاً من ذلك كبيراً في وسط الصفحة، كما يسمّي L3 القائمة، في أول قائمة بعد الإقلاع وكلما تغير المصدر، ثم يتلاشى. والظهور المفاجئ مع الاسم يفعل الأمرين معاً. يمكن للسمات جعل الظهور المفاجئ هو الظاهر لديها. السمة: تقرر السمة.'
  RIPPS2_RECENTS: الألعاب الأخيرة
  HINT_RIPPS2_RECENTS: 'الألعاب الأخيرة، صفحة في الشريط الجانبي فيها آخر الألعاب التي شغّلتها، الأحدث أولاً: كم تحتفظ، من 1 إلى 99 (المثلث يكتب الرقم). اللعبة التي محركها على يدوي تشغّل محركها عندما تختارها. 0 يوقف الصفحة.'
  RIPPS2_CATEGORY_ORDER: ترتيب الفئات
  HINT_RIPPS2_CATEGORY_ORDER: 'يبدّل تشغيل القرص وملفات الذاكرة: ملفات الذاكرة أولاً وتشغيل القرص أخيراً، في أسماء الشريط وأيقونات الشريط الجانبي على السواء. مصنوع لـ RIPFLOW (الواجهة > السمة). السمة: تقرر السمة.'
  RIPPS2_MUSIC: الموسيقى
  HINT_RIPPS2_MUSIC: يعزف ملفات bgm في مجلد AUDIO بجانب RIPPS2 وفي مجلد AUDIO الخاص بـ OPL على كل محرك مشغّل (Ogg بلا وسوم، أو WAV بعمق 16 بت)؛ والملف المسمى Menu يُعزف أولاً. موسيقى السمة نفسها تُعزف بدلاً منها إن وُجدت.
  RIPPS2_BIOS_SOUNDS: أصوات BIOS
  HINT_RIPPS2_BIOS_SOUNDS: 'يكتب أصوات قائمة هذا الجهاز نفسه من BIOS الخاص به في مجلد AUDIO كأصوات لـ RIPPS2 (أقل من 1 ميغابايت). موسيقى القائمة استخراج منفصل: موسيقى BIOS.'
  RIPPS2_RIP: استخراج
  RIPPS2_HINTS_GLYPHS: التلميحات والرموز
  HINT_RIPPS2_HINTS_GLYPHS: كيف تبدو تلميحات الأزرار والرموز. يبدأ كل صف على السمة، أي ما اختارته السمة؛ وأي اختيار آخر هو اختيارك ويتقدّم على كل سمة.
  RIPPS2_HINT_LAYOUT: تخطيط التلميحات
  HINT_RIPPS2_STARSIDE: 'أين توضع نجمة اللعبة المفضلة في القائمة. يسار: عمود خاص في بداية كل صف. يمين: بعد العنوان. مخفي (الافتراضي): لا نجمة ولا عمود، والعناوين كاملة. السمة: ما تقوله السمة. R3 يضع نجمة على اللعبة في كل الأحوال؛ اضغط R3 مطولاً 4 ثوانٍ على قائمة لإخفاء النجوم أو إعادتها (وهذا يضع نجمة أيضاً على اللعبة تحت المؤشر).'
  HINT_RIPPS2_HINT_LAYOUT: 'صف: التلميحات في سطر واحد. عمود: تلميح واحد في كل سطر، قائمة على الجانب، تبدأ حيث تضع السمة تلميحاتها.'
  RIPPS2_HINT_LABELS: تسميات التلميحات
  HINT_RIPPS2_HINT_LABELS: الرمز فقط يرسم الأزرار وحدها، للرموز التي تحمل كلماتها الخاصة. الشارات تضع رمز كل تلميح وعنوانه معاً على شارة واحدة.
  RIPPS2_HINT_MENU: تلميح القائمة (START)
  RIPPS2_HINT_REFRESH: تلميح التحديث (SELECT)
  RIPPS2_HINT_STAR: تلميح التفضيل (R3)
  RIPPS2_HINT_VIEW: تلميح العرض (L3)
  HINT_RIPPS2_HINT_SHOW: يعرض هذا التلميح أو يخفيه. زره يعمل في الحالتين.
  RIPPS2_GLYPH_SET: مجموعة الرموز
  HINT_RIPPS2_GLYPH_SET: 'رموز الأزرار في كل صفحة: رموز السمة، أو رموز RIPPS2، أو القياسية (أزرار داكنة ورموز ملونة)، أو البيضاء (بيضاء بالكامل).'
  RIPPS2_HINT_ORDER: ترتيب التلميحات
  HINT_RIPPS2_HINT_ORDER: يرتّب التلميحات. السمة تُبقي ترتيب السمة؛ وترتيبك هو المضبوط هنا.
  RIPPS2_HINT_ORDER_FOLLOW: الترتيب
  RIPPS2_GRID_LAYOUT: تخطيط الشبكة
  HINT_RIPPS2_GRID_LAYOUT: عدد الأغلفة التي تتسع لها صفحة الشبكة، بتباعد RIPPS2. السمة تُبقي تخطيط السمة نفسها.
  RIPPS2_LAUNCH_DISC: قرص التشغيل
  HINT_RIPPS2_LAUNCH_DISC: يدخل قرص اللعبة أثناء تشغيلها. الظهور المفاجئ يستقر ثم يتلاشى؛ والدوران يدور أسرع فأسرع حتى تبدأ اللعبة؛ والتكبير يستقر ثم يكبر ليُقرأ بوضوح ويبقى.
  RIPPS2_TRANSITION: انتقال الصفحات
  HINT_RIPPS2_TRANSITION: 'كيف تدخل صفحة جديدة عند الانتقال إلى فئة أخرى: من لون خلفية السمة، أو من وميض. السمة تُبقي اختيار السمة.'
  RIPPS2_CATEGORY_LAYOUT: تخطيط الفئات
  HINT_RIPPS2_CATEGORY_LAYOUT: 'أين توضع الفئات الثلاث: أسماؤها في الأعلى، أو أيقونات على طول الشريط الجانبي، لكل منها درج بصفحاتها (اليسار في قائمة يذهب إليه)، أو القائمة الرئيسية: لا شريط إطلاقاً، والفئات في قائمة START كما في سمة مصنوعة لـ OPL. السمة تُبقي تخطيط السمة.'
  RIPPS2_CACHE: التخزين المؤقت
  HINT_RIPPS2_CACHE: 'كيف تُحفظ قائمة ألعاب كل مصدر لتُفتح صفحته فوراً: Fast Cache، وقائمة القرص الصلب الداخلي، والتحديث التلقائي.'
  RIPPS2_FAST_CACHE: Fast Cache
  HINT_RIPPS2_FAST_CACHE: 'يحتفظ كل مصدر بآخر قائمة ألعاب له (RIPPS2.LST بجانب مجلدي CD وDVD) ويعرضها فور رد المصدر. Trust Cache يقرر هل يُقرأ المصدر مجدداً بعد ذلك. ايقاف: تُقرأ كل قائمة أولاً من مصدرها، كما في السابق.'
  HINT_RIPPS2_VIGNETTE: يعتّم حواف كل غلاف عدا المختار، ليبرز المختار. الضعيف نصف الكامل.
  RIPPS2_GRID_WIDE: تخطيط الشبكة للشاشة العريضة
  HINT_RIPPS2_GRID_WIDE: صفحة الشبكة على صورة 16:9 فقط (شاشة عريضة، 720p، 1080i)، حيث تُرسم الأغلفة أضيق ويتسع عدد أكبر منها في الصف. السمة تستخدم تخطيط السمة؛ ومثل تخطيط الشبكة يتبع تخطيط الشبكة.
  RIPPS2_BGBLUR: تمويه الخلفية
  HINT_RIPPS2_BGBLUR: مدى قوة تمويه الزجاج المصنفر لصورة خلفية اللعبة. السمة تستخدم قيمة السمة نفسها (ضعيف في RIPGRID وAdapt).
  HINT_RIPPS2_HINT_SLOT: التلميح في هذا المكان. التلميح الذي كان هنا ينتقل إلى المكان القديم للتلميح المختار.
  PS1_SAVE_GUIDANCE: ملفات حفظ PS1 تعتمد على Ember أو POPSTARTER؛ ولا تنطبق إعدادات VMC الخاصة بـ PS2.
  NEUTRINO_SHOW_ARGS: عرض وسائط التشغيل
  HINT_NEUTRINO_SHOW_ARGS: قبل كل تشغيل عبر Neutrino، يعرض كل وسيط سيتلقاه Neutrino ويسأل هل تتابع. الرجوع يعيدك إلى القائمة دون تشغيل.
  NEUTRINO_ARGS_CONFIRM: سيبدأ Neutrino بهذه الوسائط. تشغيل؟
  HINT_NARGS_EXTRA: أعلام Neutrino أخرى، مفصولة بمسافات، تُرسل بعد كل ما سبق. يضيف RIPPS2 دائماً -bsd و-dvd لمحرك اللعبة وملف ISO، و-mc0 و-mc1 لبطاقات VMC الخاصة بها، و-gsm لوضع الفيديو، وأوضاع التوافق الخاصة باللعبة. العلم الذي له صف خاص أعلاه (مثل -logo) ينتقل إلى ذلك الصف عند الحفظ، ولا يزال يُرسل.
  HINT_RIPPS2_THEME: مظهر كل صفحة. في قائمة الألعاب، اضغط مطولاً على SELECT لمدة 4.2 ثانية للانتقال إلى السمة التالية؛ والضغطة السريعة على SELECT لا تزال تحدّث القائمة.
  GAME_TYPE_LABELS: عرض تسميات [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: تعذّر حفظ قائمة الغش في مجلد Neutrino، لذا لا يستطيع Neutrino استخدامها. التشغيل دون غش؟
  AUTO_CREATE_VMC: إنشاء VMC عند أول تشغيل
  HINT_AUTO_CREATE_VMC: "تشغيل لعبة PS2 دون VMC في الفتحة 0 ينشئ بطاقة بحجم 8 MB على جهاز اللعبة، باسم تقترحه شاشة VMC (تتشاركها كل أقراص اللعبة)، ويعيّنها. مع Neutrino ليس على القرص الصلب APA (القرص الصلب exFAT يعمل)."
  AUTO_VMC_CREATING: جارٍ إنشاء VMC لهذه اللعبة...
  AUTO_VMC_FAILED: تعذّر إنشاء VMC لهذه اللعبة. تبدأ اللعبة دونه.
  RIPPS2_BIOS_MUSIC: موسيقى BIOS
  HINT_RIPPS2_BIOS_MUSIC: 'يكتب موسيقى قائمة هذا الجهاز (المقطوعة المحيطية لمتصفحه، نحو 15 ميغابايت بصيغة WAV) في مجلد AUDIO تختاره: بجانب RIPPS2، أو مجلد OPL على محرك مشغّل. كبيرة جداً لبطاقة ذاكرة. يُعرض حجمها أولاً.'
  SAVE_ICONS: أيقونات الحفظ ثلاثية الأبعاد
  HINT_SAVE_ICONS: يعرض أيقونة حفظ اللعبة المختارة وهي تدور، حيث يكون للسمة مكان لها. يقرأ VMC الخاص باللعبة أولاً، ثم بطاقات الذاكرة.
  NETBOOT_RESTART_NOW: يتغير بروتوكول الشبكة بعد إعادة التشغيل. حفظ الإعدادات وإعادة تشغيل OPL الآن؟
  HINT_NET_PROTOCOL: 'أي خدمة شبكة يستخدمها RiptOPL: مشاركة SMB، أو UDPFS، أو UDPBD، أو HTTP. الانتقال من خدمة تعمل بالفعل يتطلب إعادة تشغيل.'
  HINT_UDPFS_ACCESS: UDPFS فقط. الملفات يقرأ ملفات ISO المنفردة من مجلد ألعاب الخادم؛ وIMG يقرأ صورة قرص كمحرك. SMB وHTTP يستخدمان الملفات دائماً، وUDPBD يستخدم IMG دائماً.
  HINT_SMB_VERSION: أي إصدار من SMB يُستخدم للتخاطب مع مشاركة الحاسوب.
  HINT_NET_ADVANCED: يفتح وضع ارتباط Ethernet ومنفذ SMB للتحرير.
  HINT_ETH_LINK_MODE: يفرض سرعة ارتباط الشبكة ونمط الإرسال. اتركه على Auto ما لم ينقطع الارتباط باستمرار.
  HINT_IP_ADDR_TYPE: الثابت يستخدم العنوان أدناه؛ وDHCP يسأل الموجّه. UDPFS وUDPBD يستخدمان الثابت دائماً.
  HINT_PS2_IP: عنوان IP الخاص بجهاز PS2. اختر عنواناً لا يستخدمه أي جهاز آخر، في نطاق حاسوبك نفسه.
  HINT_NETMASK: قناع الشبكة الفرعية، عادةً 255.255.255.0.
  HINT_GATEWAY: عنوان الموجّه، عادةً بالأرقام الثلاثة الأولى نفسها وينتهي بـ .1.
  HINT_DNS: عنوان خادم DNS. عادةً هو نفسه عنوان البوابة.
  HINT_SMB_ADDR_TYPE: الوصول إلى الحاسوب عبر عنوان IP الخاص به أو اسم NetBIOS (اسم الحاسوب).
  HINT_SMB_ADDRESS: 'الحاسوب الذي يشارك ألعابك: عنوان IP الخاص به، أو اسم الحاسوب عندما يكون نوع العنوان NetBIOS.'
  HINT_SMB_PORT: 'منفذ SMB. يجب أن يطابق الحاسوب: يستخدم PS2 Servers المنفذ 1111، وتستخدم مشاركات Windows وSamba المنفذ 445.'
  HINT_SMB_USER: اسم مستخدم SMB. يعمل guest مع معظم المشاركات.
  HINT_HTTP_SERVER: عنوان IP لخادم ألعاب HTTP.
  HINT_HTTP_PORT: المنفذ الذي يستمع عليه خادم ألعاب HTTP.
  HINT_HTTP_BASE: المجلد على خادم HTTP الذي يحتوي games.csv. / هو جذر الخادم.
  HINT_HTTP_TEST: يجرّب خادم HTTP بالقيم أعلاه ويبلّغ بما وجده.
  HINT_RA_TELEMETRY: المفتاح الرئيسي لـ RetroAchievements. الإيقاف يشغّل الألعاب دون حزمة شبكة أو لقطات، كالإصدار العادي.
  HINT_RA_BADGES: يميّز الألعاب التي لها إنجازات في القائمة. يبقى داكناً ما دام القياس عن بُعد معطّلاً.
  HINT_POPS_NET_BUTTON: يحرّر ملفات الشبكة الخاصة بـ POPSTARTER (IPCONFIG.DAT وSMBCONFIG.DAT)، التي تحتاجها ألعاب PS1 عبر SMB.
  HINT_POPS_IP_TYPE: 'كيف يحصل PS2 على عنوانه أثناء تشغيل لعبة PS1 عبر SMB: ثابت أو DHCP.'
  HINT_POPS_IP: عنوان IP لجهاز PS2 أثناء تشغيل لعبة PS1 عبر SMB.
  HINT_POPS_SMB_IP: عنوان IP للحاسوب الذي يشارك ألعاب PS1 الخاصة بك.
  HINT_POPS_SMB_SHARE: اسم المشاركة على ذلك الحاسوب التي تحتوي مجلد POPS.
  HINT_LASTPLAYED: يبدأ على اللعبة التي شغّلتها آخر مرة.
  HINT_LANGUAGE: لغة القائمة. أضف المزيد بوضع ملفات lang_*.lng في مجلد LNG.
  HINT_GSM_DEFAULTS_BUTTON: إصلاحات وضع الفيديو التي تحصل عليها كل لعبة ما لم تكن لها إعدادات GSM خاصة.
  HINT_DEFDEVICE: الصفحة التي يفتحها RiptOPL عند الإقلاع.
  HINT_MMCE_MODE: 'ألعاب على SD2PSX أو MemCard PRO2. تلقائي يشغّله عند الإقلاع: الأسرع لبطاقة موصولة، وألعابها في كل الألعاب منذ البداية. يدوي يشغّله عندما تفتح صفحته، وايقاف يخفيه.'
  HINT_MMCE_SETTINGS_BUTTON: خيارات المنفذ وبطاقة إقلاع IGR وGameID والتوقيت لـ MMCE.
  HINT_ENABLE_USB: يحمّل برنامج تشغيل تخزين USB.
  HINT_ENABLE_MX4SIO: يحمّل برنامج تشغيل محوّل بطاقات SD من نوع MX4SIO.
  HINT_ENABLE_ILINK: يحمّل برنامج تشغيل تخزين iLink (FireWire).
  HINT_NETSTART: 'يشغّل الشبكة: التلقائي عند الإقلاع، واليدوي عند فتح صفحتها. الإيقاف يترك محوّل الشبكة دون تغيير.'
  HINT_APPMODE: صفحة البرامج. التلقائي يبدأ عند الإقلاع، واليدوي عند فتحها، والإيقاف يخفيها.
  HINT_FAVMODE: صفحة الألعاب المفضلة. التلقائي يبدأ عند الإقلاع، واليدوي عند فتحها، والإيقاف يخفيها.
  HINT_BDMA_BUTTON: أي برنامج تشغيل exFAT يستخدمه POPSTARTER لألعاب PS1 على USB أو MX4SIO أو MMCE أو القرص الصلب أو iLink.
