  The kept .tar is only replaced once the merged copy is whole.: لا يُستبدل ملف .tar المُبقى إلا حين تكتمل النسخة المدموجة.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: تعذرت كتابة الدمج على محرك %s (هل توجد مساحة؟). هو كما كان؛ لم يتغير شيء آخر.
