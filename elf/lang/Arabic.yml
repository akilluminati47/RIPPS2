  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'توقف الدمج بين عمليتي إعادة تسمية: ملف .tar المُبقى هو %s والمدموج %s. أعد تسميتهما بملفات الذاكرة.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
