  Remove the ART Pack in %s? The ART folders stay as they are.: إزالة حزمة ART في %s؟ تبقى مجلدات ART كما هي.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: توقّف. أُزيلت الحزمة غير المكتملة، وتُحمَّل الصور من مجلدات ART كما كانت.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'تعذّرت كتابة حزمة ART في %s (هل توجد مساحة على ذلك المحرك؟). لم يتغير شيء آخر: تُحمَّل الصور من مجلدات ART كما كانت.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: أُزيلت حزمة ART في %s. تُحمَّل الصور من مجلدات ART من جديد.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : لا يوجد مجلد ART فيه صور على المحركات التي بدأت. ابدأ المحركات التي عليها صورك (SELECT في صفحتها)، ثم عُد.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d صورة من %d مجلد ART تدخل في ملف واحد، %s. تبقى مجلدات ART كما هي: الحزمة نسخة. يمكنك نسخ art.tar إلى مجلد ART في محرك آخر بواسطة Memory Files، لكن بناءها على المحرك الذي تتصفح منه هو الأسرع، لذلك يأتي أسرع محرك أولًا. هل تبنيها الآن؟'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'حزمة ART جاهزة: %d صورة، %d MB، في %s (%d ث). من الآن تُحمَّل الصور منها، والألعاب الـ %d التي بُنيت لها لن يُسأل مجلد ART الخاص بها صورةً صورةً أبدًا. الصور التي يجلبها RIPPS2 أو يلتقطها تظهر فورًا؛ والتي تنسخها من حاسوب تظهر بعد أن تبني الحزمة من جديد.'
