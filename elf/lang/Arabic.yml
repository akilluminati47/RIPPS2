  ' (The configs found were set: %s.)': ' (ضُبطت الإعدادات التي عُثر عليها: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' احفظ إعداداته مرة واحدة بأداة الإعداد الخاصة به، ثم شغّل BOOT LOCK من جديد.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : لا يستطيع %s تشغيل RIPPS2 من مكانه الحالي (%s)، وRIPPS2 لا ينسخ نفسه. ضع RIPPS2.ELF على بطاقة ذاكرة أو محرك USB وشغّله من هناك.
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : تعذّر على BOOT LOCK كتابة إعدادات محمّل الإقلاع. تأكد أن بطاقة الذاكرة أو المحرك غير محميّ من الكتابة، ثم حاول مجدداً.
  BOOT LOCK found no boot loader config to change.: لم يجد BOOT LOCK إعدادات محمّل إقلاع لتغييرها.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK معطّل. يشغّل محمّل الإقلاع لديك ما كان يشغّله سابقاً (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK مفعّل. يشغّل %s الآن RIPPS2 عند التشغيل (%s)، ومع ترك مكان IGR فارغاً يعود EXIT اللعبة من الطريق نفسه. اضغط مطولاً على أحد أزراره أثناء بدء الجهاز للوصول إلى أي شيء آخر.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL on a memory card (Boot Loader).'
  : 'وضع BOOT LOCK برنامج RIPPS2 أولاً في قائمة OSDMenu (%s). لا يشغّل OSDMenu شيئاً من تلقاء نفسه: اختر RIPPS2 هناك، ويعود EXIT اللعبة إلى تلك القائمة. لجهاز يشغّل RIPPS2 فوراً، يضع BIBLE برنامج PS2BBL على بطاقة ذاكرة (محمّل الإقلاع).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: يعمل BOOT LOCK عبر محمّل إقلاع على بطاقة ذاكرة (PS2BBL أو FMCB أو OSDMenu)، ولا يوجد أي منها هنا.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: بطاقة الذاكرة في المنفذ %d تشغّل %s عند التشغيل، ولم يجد BOOT LOCK إعدادات له لتغييرها (يبحث عن %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'بطاقة الذاكرة في المنفذ %d تشغّل %s عند التشغيل، ولا يستطيع BOOT LOCK ضبطه: يعمل عبر PS2BBL وFMCB وOSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: يوجد على هذا الجهاز محمّل إقلاع مع قفل RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT للعبة: المتصفح، ثم محمّل الإقلاع لديك (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'قيد الاستخدام: %s، %d صورة، %d MB'
