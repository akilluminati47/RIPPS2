  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'شكراً لكل من يختبر على Discord ويفتح مشكلات على GitHub:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'لا يُستخدم IGR Path %s: بعد اللعبة لا يُحمَّل إلا ملف على بطاقة ذاكرة أو USB، ولا يُحمَّل RIPPS2 نفسه أبداً'
  an issue is the best way to get RIPPS2 updated.: فتح مشكلة هو أفضل طريقة لتحديث RIPPS2.
