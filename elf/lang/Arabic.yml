  'This disc is not compatible: it is a region %d DVD, and this console plays another region''s DVDs. Start it anyway?': 'هذا القرص غير متوافق: إنه قرص DVD للمنطقة %d، وهذا الجهاز يشغّل أقراص DVD لمنطقة أخرى. هل تريد تشغيله على أي حال؟'
