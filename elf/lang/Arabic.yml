  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'بجانب RIPPS2: %sAUDIO%s، يُقرأ أولًا عند الإقلاع'
  ? '- PS2BBL is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/SYS-CONF/PS2BBL.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- يربط الجهاز PS2BBL بهذه البطاقة ويكتبه باسم %s/%s.
  
    - إعداداته، mc%d:/SYS-CONF/PS2BBL.INI، تشغّل RIPPS2 من مكانه (%s) دون انتظار (0 ms، وهو ما لا يسمح به PS2BBL Extended)، مع تفعيل BOOT LOCK. لا يُنسخ RIPPS2 نفسه.
  
    يُعاد تشغيل معالج الإدخال والإخراج لذلك وتتوقف كل قراءة من المحرّكات حتى ينتهي؛ تعود الموسيقى والمحرّكات بعده. أبقِ البطاقة في مكانها والجهاز مشغّلًا حتى يقول إنه انتهى.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'قد تحمي بطاقة SD2PSX أو MMCE نفسها بعد رفض الكتابة: إن اختفت الآن بطاقة الذاكرة أو محرّك MMCE فأطفئ الجهاز ثم شغّله.'
  BOOT LOCK ON: BOOT LOCK مفعّل
  'Done: the memory card in slot %d starts what it started before BIBLE. BIBLE is kept in mc%d:/%s.': 'تم: بطاقة الذاكرة في المنفذ %d تشغّل ما كانت تشغّله قبل BIBLE. يبقى BIBLE محفوظًا في mc%d:/%s.'
  MEMORY CARD IN SLOT %d  (%s): بطاقة الذاكرة في المنفذ %d  (%s)
  ? PS2BBL cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : لا يستطيع PS2BBL تشغيل RIPPS2 من مكانه الحالي (يصل إلى بطاقات الذاكرة ومحرّكات USB وMX4SIO)، ولا ينسخ RIPPS2 نفسه. ضع RIPPS2.ELF على بطاقة ذاكرة أو محرّك USB وشغّله من هناك، أو استخدم PS2BBL Extended الذي يقرأ MMCE والقرص الصلب.
  RESTORE SLOT %d'S OLD BOOT LOADER: استعادة محمّل الإقلاع القديم في المنفذ %d
  ? 'RIPPS2: BIBLE is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: تم إعداد BIBLE على بطاقة الذاكرة في المنفذ %d (mc%d:/%s/%s) مع تفعيل BOOT LOCK: عند التشغيل يبدأ RIPPS2 من %s فورًا.'
  ? 'RIPPS2: Setting up BIBLE
  
    '
  : 'RIPPS2: جارٍ إعداد BIBLE
  
    '
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: جارٍ إعداد BIBLE
  
    يعمل RIPPS2 من %s، ولا يستطيع PS2BBL قراءته (يقرأ بطاقات الذاكرة وUSB وMX4SIO)، ولا ينسخ RIPPS2 نفسه. إعدادات PS2BBL Extended على هذه البطاقة (%s) تقرؤه: يفعّل START خاصية BOOT LOCK لتشغّل RIPPS2 من %s عند التشغيل. لا يتغير شيء آخر على البطاقة.'
  ? 'RIPPS2: Setting up BIBLE
  
    RIPPS2 runs from %s, which PS2BBL cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: جارٍ إعداد BIBLE
  
    يعمل RIPPS2 من %s، ولا يستطيع PS2BBL قراءته: فهو يشغّل البرامج من بطاقة ذاكرة أو محرّك USB أو MX4SIO، ولا ينسخ RIPPS2 نفسه. ضع RIPPS2.ELF على أحدها (مجلد APPS في بطاقة ذاكرة، أو محرّك USB)، وشغّله من هناك، ثم أعد إعداد BIBLE.'
  ? 'RIPPS2: Setting up BIBLE
  
    The memory card in slot %d: BIBLE (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: جارٍ إعداد BIBLE
  
    بطاقة الذاكرة في المنفذ %d: يُنقل BIBLE (mc%d:/%s) جانبًا، ويعود ما حلّ محلّه (mc%d:/%s) إلى مكانه. لا يُحذف شيء. تبقى إعدادات PS2BBL كما هي (يمكن لـ BOOT LOCK إيقاف القفل).'
  'RIPPS2: Setting up BIBLE (binding PS2BBL to the memory card)': 'RIPPS2: جارٍ إعداد BIBLE (ربط PS2BBL ببطاقة الذاكرة)'
  'RIPPS2: Setting up BIBLE (putting back what was there)': 'RIPPS2: جارٍ إعداد BIBLE (إعادة ما كان موجودًا)'
  'RIPPS2: Setting up BIBLE (restarting the I/O processor)': 'RIPPS2: جارٍ إعداد BIBLE (إعادة تشغيل معالج الإدخال والإخراج)'
  'RIPPS2: Setting up BIBLE (writing it to the memory card)': 'RIPPS2: جارٍ إعداد BIBLE (الكتابة على بطاقة الذاكرة)'
  SET UP BIBLE: إعداد BIBLE
  The memory card in slot %d has %d KB free, and BIBLE needs %d KB there. Free some space, then try again.: في بطاقة الذاكرة في المنفذ %d مساحة فارغة %d KB، ويحتاج BIBLE إلى %d KB عليها. أفرغ بعض المساحة ثم حاول مجددًا.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : رفضت بطاقة الذاكرة في المنفذ %d برنامج PS2BBL، لذا أبقى RIPPS2 البطاقة كما كانت. تحقق من مساحتها الفارغة ثم حاول مجددًا. (في DIAG.TXT بجانب RIPPS2 ما قالته البطاقة.)
  ? The memory card in slot %d would not move BIBLE aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : لم تنقل بطاقة الذاكرة في المنفذ %d برنامج BIBLE جانبًا، لذا لم يتغير شيء. (في DIAG.TXT بجانب RIPPS2 ما قالته البطاقة.)
  The memory card in slot %d would not take %s back, so BIBLE stayed. (DIAG.TXT beside RIPPS2 has what the card said.): لم تستعد بطاقة الذاكرة في المنفذ %d المجلد %s، لذا بقي BIBLE. (في DIAG.TXT بجانب RIPPS2 ما قالته البطاقة.)
  MUSIC: الموسيقى
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': 'لا يحتوي %s%s على %s. وجد RIPPOPS محاكي PS1 من Sony على %s: يقوم START بنسخ %s إلى هنا ويشغّل اللعبة.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
