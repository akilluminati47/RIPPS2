  PCCF_UNSUPPORTED_GAME: يدعم CF حالياً ألعاب PS2 الأصلية فقط. VMC على CF وتحميل PS1 وإنجازات الشبكة غير متاحة.
  HINT_ENABLE_DVR: اكتشاف تجريبي لملفات DESR DVR ISO. يتطلب تفعيل مصدر القرص الصلب؛ ويحتاج تشغيل اللعبة إلى Neutrino خارجي يدعم DVR.
  HINT_RIPPS2_IGR_PAGE: القائمة داخل اللعبة وRIPSHOT وطريقة تحميض اللقطات.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: صور للشاشة من القائمة داخل اللعبة، إلى ART لسماتك أو إلى MEDIA.
  RIPPS2_DEVELOP_SHOTS: تحميض اللقطات
  HINT_RIPPS2_DEVELOP_SHOTS: كيف تصبح اللقطات المنتظرة على بكرة كل لعبة ملفات PNG.
  RIPPS2_SETTINGS_HOME: حفظ الإعدادات في
  HINT_RIPPS2_SETTINGS_HOME: 'أين يحفظ RIPPS2 إعداداته: في حفظه الخاص على بطاقة ذاكرة، أو في مجلد RIPPS2 على وحدة تخزين (القرص الصلب الداخلي أو USB أو MX4SIO أو iLink أو MMCE)، أو في مجلد تكتبه.'
  RIPPS2_LAUNCHERS: المشغّلات
  RIPPS2_LOOK_NOW: ابحث الآن
  HINT_RIPPS2_LOOK_NOW: يبحث RIPPS2 في المحركات المشغّلة عن POPSTARTER، ملفات POPS، Ember، BIOS الخاص بمحاكي Ember، و Neutrino، ويحفظ مكان كل منها. كل تشغيل يقرؤها من هناك.
  RIPPS2_HIDE_GAME: إخفاء اللعبة
  RIPPS2_HIDDEN_GAMES: الألعاب المخفية
  HINT_RIPPS2_HIDDEN_GAMES: الألعاب المخفية بأمر إخفاء اللعبة، على المحركات المشغّلة. أظهر واحدة مجدداً، أو احذفها. كل محرك يحتفظ بقائمته الخاصة.
  HINT_RIPPS2_BDM_DEVICES: 'الأقراص التي يقرأ منها BDM الألعاب: USB وMX4SIO وبطاقة PC Card CF وقرص DVR في جهاز DESR وiLink. يتبع القرص الصلب الداخلي وضع تشغيل القرص الصلب.'
  HINT_RIPPS2_SCREEN: 'صورة القائمة: وضع الفيديو والشاشة العريضة وموضعها على التلفاز (H-POS وV-POS) وoverscan.'
  HINT_RIPPS2_LAYOUT: أين تقع الفئات وكيف تدخل الصفحة، ثم أغلفة RIPFLOW وشبكة RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: سماكة النص ولون السمة وتدرج الألوان وكل لون.
  HINT_RIPPS2_TEXT_WEIGHT: 'مدى سماكة نص RIPPS2 نفسه: تلميحات الإعدادات، والحالة، وحول. عادي كما كان؛ وعريض أسهل قراءة على صورة ناعمة. خطوط السمة نفسها تحتفظ بالسماكة التي تمنحها السمة.'
  HINT_RIPPS2_HDD_START: 'القرص الصلب الداخلي، APA أو exFAT: يقرؤه RIPPS2 أياً كان ويعرضه مرة واحدة، باسم العاب HDD. تلقائي (الأسرع مع وجود قرص) يشغّله عند الإقلاع؛ وايقاف يتركه وشأنه.'
  HINT_RIPPS2_THEME_COLOR: لون السمة نفسه. اختر مخصص كلون للسمة لتختاره بنفسك كما تُختار ألوان النص.
  HINT_RIPPS2_SWEEP: خمسة ألوان تتدرج عبرها السمة ببطء وسلاسة. قوس قزح، أو تدرج من كل لون سمة، أو تدرجك الخاص. إيقاف يبقي لون السمة ثابتًا.
  HINT_RIPPS2_SWEEP_COLORS: ألوان التدرج الخمسة وسرعته. غيّر أحد تدرجات RIPPS2 فيُحفظ كتدرجك الخاص بالاسم الذي تعطيه.
  HINT_RIPPS2_SWEEP_NAME: اسم تدرجك في قائمة تدرج الألوان.
  HINT_RIPPS2_SWEEP_COLOR: أحد الألوان الخمسة التي يتدرج عبرها، بالترتيب.
  HINT_RIPPS2_SWEEP_SPEED: 'مدة بقاء كل لون قبل أن يظهر التالي. حتى حيوي يبقى سلسًا: الألوان لا تومض أبدًا.'
  RIPPS2_HIDE_COMPRESS: إخفاء اللعبة والضغط
  HINT_RIPPS2_SELECT_HOLD: 'SELECT ممسوك 4.2 ث في قائمة ألعاب. قائمة: السمات في لوحة، اختر واحدة. تدوير: السمة التالية. إيقاف: لا شيء (الضغطة ما زالت تحدّث).'
  RIPPS2_RECENT_GAMES: الألعاب الأخيرة
  RIPPS2_SET_METADATA_RENAME: ضبط البيانات الوصفية (إعادة تسمية)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: ذراع التحكم أولاً (تجريبي)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'يقرأ SD2PSX عبر الناقل الذي يتشاركه مع ذراع التحكم، وأثناء القراءة لا يُسمع ذراع التحكم: تتأخر الضغطات أو تضيع أثناء تحميل الأغلفة. اشغال: تصل الأغلفة على أجزاء صغيرة ويُقرأ ذراع التحكم بينها، أبطأ قليلاً. ايقاف: بأقصى سرعة للبطاقة. عندما تكون مصادر البطاقة على تلقائي، تُحمَّل قائمتها مرة واحدة عند الإقلاع.'
  HINT_RIPPS2_TRUST_CACHE: 'القائمة المعروضة من ذاكرتها المؤقتة تبقى كما هي، جاهزة للتشغيل، حتى تضغط SELECT أو يغيّر RIPPS2 ذلك المصدر بنفسه. ايقاف: يُقرأ كل مصدر مجدداً في الخلفية بعد ظهور ذاكرته المؤقتة، وهي وقفة تُحس على بطاقة MMCE أو MX4SIO لأنهما تتشاركان ناقل ذراع التحكم.'
  RIPPS2_STATUS_OPEN: التحميل والمحركات
  HINT_RIPPS2_STATUS_OPEN: 'يفتح الحالة: من أين يقرأ الإقلاع الإعدادات وقوائم الألعاب، وأي مكان هو الأسرع، وإلى أين يذهب EXIT اللعبة، وكل محرك. إعدادات التخزين المؤقت هناك تعيدك إلى هنا.'
  RIPPS2_BADGE_SET: مجموعة الشارات
  HINT_RIPPS2_BADGE_SET: 'الشارات في صفحة معلومات اللعبة (التصنيف، اللاعبون، ESRB، وضع الفيديو، المسح، نسبة العرض). RIPPS2: مجموعته الخاصة، نفسها في كل سمة. السمة: صور السمة نفسها، أو صور RIPPS2 عندما تطلبها السمة.'
  RIPPS2_HINT_FADE: تلاشي التلميحات والرموز
  HINT_RIPPS2_HINT_FADE: 'تلميح الزر أو الرمز الذي يتغير يظهر تدريجياً، مثل الأغلفة، لحظة تغيّره؛ وما يبقى كما هو لا يُمس، في كل صفحة ورسالة. ايقاف: تظهر ببساطة. السمة: تقرر السمة (مفعّل ما لم تقل hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: نمط الشريط الجانبي
  HINT_RIPPS2_SIDEBAR_STYLE: 'كلاسيكي (مقسوم): الأيقونات في الشريط الداكن للشريط الجانبي مع الخط الملوّن بجانبه. XL (قطعة واحدة): شريط واحد أعرض، والأيقونات في وسطه. السمة: تقرر السمة.'
  HINT_EXITPATH: 'إلى أين يذهب EXIT في قائمة داخل اللعبة. الأفضل تركه فارغاً: يذهب EXIT إلى المتصفح، الذي يشغّل محمّل الإقلاع لديك (FreeMcBoot أو PS2BBL أو OSDMenu أو BIBLE) إن كان مثبتاً، ثم RIPPS2 من جديد مع تشغيل BOOT LOCK، كما عند التشغيل؛ ومن دونه، متصفح PS2. لا يُستخدم ELF مكتوب هنا إلا إذا أمكن تحميله بعد إعادة الضبط (على بطاقة ذاكرة أو محرك USB بنظام FAT32) ولم يكن RIPPS2 نفسه؛ وأي شيء آخر يذهب إلى المتصفح.'
  HINT_BDM_START: 'USB وiLink وMX4SIO والقرص الصلب exFAT. تلقائي يشغّلها عند الإقلاع: الأسرع للمحركات الموصولة، وألعابها في كل الألعاب منذ البداية. يدوي يشغّلها عندما تفتح صفحتها.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'لا يستطيع Neutrino استخدام VMC على القرص الصلب APA (يستطيع ذلك exFAT وUSB وMX4SIO): تبدأ هذه اللعبة بالبطاقة الحقيقية في تلك الفتحة.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'يقرأ الإقلاع محرّك RIPPS2 وحده: الإعدادات والأصوات بجانب RIPPS2.ELF (يخبر RIPPS2.FB هناك بمكانها) وكل قائمة من ذاكرتها المؤقتة. تنتظر المحرّكات الأخرى: يبدأ SELECT في صفحة ما محرّكاتها ويجلب صورها (مع التحديث التلقائي تبدأ عند الإقلاع). تفعيله ينسخ أصواتك، والموسيقى إن وُجدت مساحة، إلى AUDIO بجانب RIPPS2.'
  RIPPS2_ART_PACK: حزمة ART
  RIPPS2_ART_PACK_BUILD: بناء أو إزالة
  HINT_RIPPS2_ART_PACK: يحزم مجلد ART لكل محرك بدأ في ملف art.tar واحد على المحرك الذي تختاره (يُعرض الأسرع أولًا). تُحمَّل الأغلفة بعدها من ملف واحد بفهرس واحد، دون بحث لكل لعبة، فتبقى القوائم والموسيقى سلسة. تبقى مجلدات ART كما هي.
  RIPPS2_LIST_CFG_TEXT: العنوان والوصف في القائمة
  HINT_RIPPS2_LIST_CFG_TEXT: 'عنوان اللعبة ووصفها من ملف CFG بجانب القائمة. السمة: كما تعرضها السمة (سمة RIPPS2 لا تعرضهما). صفحة المعلومات تعرضهما دائمًا.'
  RIPPS2_PS1_PREFER: تكرارات PS1
  HINT_RIPPS2_PS1_PREFER: 'لعبة PS1 موجودة كملف VCD لـ POPSTARTER وكصورة Ember معًا. كلاهما: سطران. Ember: سطر Ember فقط. POPSTARTER: ملف VCD فقط. العنوان نفسه، دون معرّف القرص في أوله، هو اللعبة نفسها.'
  RIPPS2_MY_PADS: أذرع التحكم الخاصة بي
  HINT_RIPPS2_MY_PADS: 'ملفات تعريف .pad في مجلد PADS بجوار RIPPS2: ملف نصي لكل يد تحكم USB، باسم معرّفها (2563_0575.pad)، وكل واحد مفحوص. يد التحكم ذات الملف تقود القائمة وتلعب في الألعاب (مع تشغيل Pad Emulator).'
  RIPPS2_PAD_SETUP: ضبط يد تحكم USB
  HINT_RIPPS2_PAD_SETUP: وصّل يد تحكم USB لا يعرفها RIPPS2، واضغط كل زر يطلبه، فيكتب RIPPS2 ملف .pad الخاص بها في PADS. زر SELECT على يد تحكم PS2 يتخطى زرا.
