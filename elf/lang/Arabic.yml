# RIPPS2 in Arabic. strings: RIPPS2's own words (English as in _strings.yml: its translation); labels: Open PS2
# Loader labels its translations do not have yet (filled only where they have none). Keep %s, %d and the like
# as they are, in the same order, and the same capitals as the English (the code makes hints sentence case).
language: Arabic
strings:
  "SET UP, UPDATE OR RESTORE BIBLE": "BIBLE: تثبيت أو تحديث أو استعادة"
  "UPDATE BIBLE: SLOT %d HAS AN OLDER ONE": "تحديث BIBLE: في المنفذ %d نسخة أقدم"
  "Background": "الخلفية"
  "Sky": "السماء"
  "Black": "أسود"
  "Splash": "شاشة البداية"
  "Logo": "الشعار"
  "Logo and Names": "الشعار والأسماء"
  "Button Glyphs": "رموز الأزرار"
  "Face Buttons": "أزرار الحركة"
  "All Sixteen": "الستة عشر كلها"
  "Info Line": "سطر المعلومات"
  "Power-on Wait": "الانتظار عند التشغيل"
  "File name (as it appears in your games list)": "اسم الملف (كما يظهر في قائمة ألعابك)"
  "This list shows games from other drives. Rename a game on its own drive's page.": "تعرض هذه القائمة ألعابًا من أقراص أخرى. أعد تسمية اللعبة من صفحة قرصها."
  "A starred game cannot be renamed. Take off its star (R3), rename it, then star it again.": "لا يمكن إعادة تسمية لعبة عليها نجمة. أزل النجمة (R3) ثم أعد التسمية ثم ضع النجمة مجددًا."
  "This drive cannot rename its files. The details can still be set.": "لا يستطيع هذا القرص إعادة تسمية ملفاته. يمكن ضبط التفاصيل مع ذلك."
  "On an APA HDD a PS2 game's name lives in the partition table, so it cannot be renamed here. Its details can still be set.": "في قرص APA يوجد اسم لعبة PS2 في جدول الأقسام، فلا يمكن إعادة تسميتها هنا. يمكن ضبط تفاصيلها مع ذلك."
  "Renames the app in your list. Its ELF and its art keep their names.": "يعيد تسمية التطبيق في قائمتك. يبقى اسم ملف ELF والصور كما هما."
  "Renames the game on its drive. PS1 games find their art and settings by name, so RIPPS2 renames those with it. Art in an ART Pack needs the pack built again.": "يعيد تسمية اللعبة على قرصها. تجد ألعاب PS1 صورها وإعداداتها بالاسم، لذا يعيد RIPPS2 تسميتها معها. صور ART Pack تحتاج إلى إعادة بناء الحزمة."
  "Renames the game's file on its drive. PS2 games find their art and settings by game ID, so nothing is lost.": "يعيد تسمية ملف اللعبة على قرصها. تجد ألعاب PS2 صورها وإعداداتها بمعرّف اللعبة، فلا يضيع شيء."
  "Stop Disc at Launch": "إيقاف القرص عند التشغيل"
  "EDIT BIBLE'S SETTINGS FILE": "تعديل ملف إعدادات BIBLE"
  "BIBLE's settings file (%s) could not be written. Check that the memory card is in and has room, then try again.": "تعذرت كتابة ملف إعدادات BIBLE (%s). تأكد من أن بطاقة الذاكرة موصولة وفيها مساحة، ثم أعد المحاولة."
  "BIBLE's settings file (%s) was not found. SET UP, UPDATE OR RESTORE BIBLE writes one.": "لم يُعثر على ملف إعدادات BIBLE (%s). الخيار BIBLE: تثبيت أو تحديث أو استعادة يكتب واحدًا."
  "Boot sound On (fast): %s, handed over by BIBLE": "صوت الإقلاع تشغيل (سريع): %s، سلّمه BIBLE"
  "BIBLE: akilluminati47's PS2BBL Extended fork, every build signed by akilluminati47 (GPL-3)": "BIBLE: نسخة akilluminati47 المشتقة من PS2BBL Extended، كل إصدار موقّع من akilluminati47 (GPL-3)"
  "its IOPRP image binds BIBLE to your card (GPL-3): the console does the crypto, no keys": "صورة IOPRP الخاصة به تربط BIBLE ببطاقتك (GPL-3): الجهاز يقوم بالتشفير، دون مفاتيح"
  "KELFBinder by El Isra": "KELFBinder من El Isra"
  "source: github.com/akilluminati47/BIBLE": "المصدر: github.com/akilluminati47/BIBLE"
  "SLOT 0: %s\nSLOT 1: %s\n%s\nRIPPS2: Setting up BIBLE. BIBLE, akilluminati47's boot loader built on PS2BBL by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?": "المنفذ 0: %s\nالمنفذ 1: %s\n%s\nRIPPS2: جارٍ إعداد BIBLE. هذا BIBLE، مُحمِّل الإقلاع من akilluminati47 المبني على PS2BBL من El Isra، يعدّه RIPPS2 على بطاقة ذاكرة PS2 عادية بسعة 8 MB أو على القرص الصلب الداخلي: إقلاع خلال 0 ms عند التشغيل (لا يسمح PS2BBL Extended بـ 0)، وRIPPS2 أولًا من مكانه (لا يُنسخ أبدًا)، والزر المضغوط عند التشغيل ما زال يوصلك إلى المتصفح (TRIANGLE) وإلى قرص (START) وإلى ما كان قبله (CIRCLE). هل تريد إعداده أم إصلاحه أم استعادة ما حلّ محلّه؟"
  "RIPPS2: Setting up BIBLE\nThe card in slot %d is an SD2PSX or MMCE card. Its BOOT card can hold BIBLE in place of the PS2BBL it has (that one is moved aside, whole, first), if the console binds BIBLE to it. If the bind is refused, nothing on the card changes, and the card may stop answering until the console is turned off and on. START binds BIBLE to it.": "RIPPS2: جارٍ إعداد BIBLE\nالبطاقة في المنفذ %d بطاقة SD2PSX أو MMCE. يمكن لبطاقة BOOT الخاصة بها أن تحمل BIBLE بدل PS2BBL الموجود عليها (يُنقل جانبًا كاملًا أولًا) إن ربط الجهاز BIBLE بها. إن رُفض الربط فلن يتغير شيء على البطاقة، وقد تتوقف البطاقة عن الاستجابة حتى يُطفأ الجهاز ويُشغَّل. START يربط BIBLE بها."
  "BIND BIBLE": "ربط BIBLE"
  "(DIAG.TXT beside RIPPS2 has what the card said.)": "(في DIAG.TXT بجانب RIPPS2 ما قالته البطاقة.)"
  "For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 1's config before slot 0's.\n": "لبطاقة ذاكرة PS2 عادية بسعة 8 MB (بطاقة MagicGate، أو بطاقة BOOT من SD2PSX أو MMCE): التي في المنفذ %d. عند التشغيل يقرأ PS2BBL إعدادات المنفذ 1 قبل إعدادات المنفذ 0.\n"
  "The console would not bind BIBLE to the memory card in slot %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.": "لم يربط الجهاز BIBLE ببطاقة الذاكرة في المنفذ %d (فشلت خطوة MagicGate). لم يتغير شيء على البطاقة. البطاقة غير الأصلية أو غير المتوافقة مع MagicGate لا يمكنها حمل تحديث للنظام."
  "An SD2PSX or MMCE card can stop answering after a refused bind: if the memory card or the MMCE drive is missing now, turn the console off and on.": "قد تتوقف بطاقة SD2PSX أو MMCE عن الاستجابة بعد رفض الربط: إن اختفت الآن بطاقة الذاكرة أو محرّك MMCE فأطفئ الجهاز ثم شغّله."
  "RIP THIS CONSOLE'S AUDIO": "استخراج صوتيات هذا الجهاز"
  "sounds or music, from its BIOS": "أصوات أو موسيقى، من BIOS الخاص به"
  "Opens Audio settings on BIOS Sounds and BIOS Music: rip this console's own sounds or its menu music into AUDIO.": "يفتح إعدادات الصوت على أصوات BIOS وموسيقى BIOS: استخرج أصوات هذا الجهاز أو موسيقى قائمته إلى AUDIO."
  "Boot sound On (fast): %s on the memory card, as the pillars rise": "صوت الإقلاع تشغيل (سريع): %s على بطاقة الذاكرة، عند ارتفاع الأعمدة"
  "Boot sound On: %s on the memory card, as the pillars rise": "صوت الإقلاع تشغيل: %s على بطاقة الذاكرة، عند ارتفاع الأعمدة"
  "Boot sound On: %s, once its drive is up": "صوت الإقلاع تشغيل: %s، عند جاهزية قرصه"
  "This game starts through Neutrino, and RIPPS2 found none: not at Settings' path, on the game's drive, on the memory cards or on any started drive. Put Neutrino by rickgaiser (github.com/rickgaiser/neutrino) in a neutrino folder on the game's drive or a memory card, or point Game Launching > Neutrino at it.": "تبدأ هذه اللعبة عبر Neutrino، ولم يجد RIPPS2 أيًّا منه: لا في مسار الإعدادات، ولا على قرص اللعبة، ولا على بطاقات الذاكرة، ولا على أي قرص مُشغَّل. ضع Neutrino من rickgaiser (github.com/rickgaiser/neutrino) في مجلد neutrino على قرص اللعبة أو على بطاقة ذاكرة، أو وجّه تشغيل الألعاب > Neutrino إليه."
  "Where your Neutrino is, its video mode, and the arguments every Neutrino launch gets. Get Neutrino at github.com/rickgaiser/neutrino and put it in a neutrino folder on a drive or a memory card.": "مكان Neutrino الخاص بك، ووضع الفيديو الخاص به، والمعاملات التي يتلقاها كل تشغيل بـ Neutrino. احصل على Neutrino من github.com/rickgaiser/neutrino وضعه في مجلد neutrino على قرص أو بطاقة ذاكرة."
  "This Neutrino is older than 1.3, which cannot start games from the APA HDD. Point Game Launching > Neutrino at Neutrino 1.3 or newer.": "إصدار Neutrino هذا أقدم من 1.3، الذي لا يستطيع تشغيل الألعاب من القرص الصلب APA. وجّه تشغيل الألعاب > Neutrino إلى Neutrino 1.3 أو أحدث."
  "with rickgaiser's Neutrino as its second game core,": "مع Neutrino من rickgaiser نواةً ثانية للألعاب،"
  "the second game core, used from your drive or memory card (AFL-3.0)": "نواة الألعاب الثانية، تُستخدم من قرصك أو بطاقة ذاكرتك (AFL-3.0)"
