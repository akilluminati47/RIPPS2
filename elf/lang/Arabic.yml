  ? ' RIPPS2 can install BIBLE, PS2BBL set up to start RIPPS2, on a memory card; what starts from it now is kept in a backup folder. Install BIBLE?'
  : ' يستطيع RIPPS2 تثبيت BIBLE، وهو PS2BBL مضبوط لتشغيل RIPPS2، على بطاقة ذاكرة؛ وما يُشغَّل منها الآن يُحفظ في مجلد نسخة احتياطية. هل تريد تثبيت BIBLE؟'
  ' The HDD''s old boot program is kept (MANAGE > RESTORE).': ' يُحتفظ ببرنامج الإقلاع القديم للقرص الصلب (إدارة > استعادة).'
  ' The console would not take the setting that starts its HDD at power on: set it with the HDD utility, or install again.': ' لم يقبل الجهاز الإعداد الذي يشغّل قرصه الصلب عند التشغيل: اضبطه بأداة القرص الصلب، أو ثبّت مجدداً.'
  ' What was there before is kept in mc%d:/%s%s.': ' ما كان موجوداً سابقاً محفوظ في mc%d:/%s%s.'
  ' Your own PS2BBL config was kept (%s), BOOT LOCK set in it: its buttons are as you set them.': ' أُبقي على إعدادات PS2BBL الخاصة بك (%s)، وضُبط فيها BOOT LOCK: أزرارها كما ضبطتها.'
  ' Your own PS2BBL config was kept, BOOT LOCK set in it.': ' أُبقي على إعدادات PS2BBL الخاصة بك، وضُبط فيها BOOT LOCK.'
