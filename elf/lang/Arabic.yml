  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: دمج الحزمة الجديدة في ملف .tar آخر؟ تختار بعد ذلك ملف .tar الذي يُبقى عليه ويُحدَّث؛ تذهب إليه صور الحزمة الجديدة.
