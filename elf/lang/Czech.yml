  ? 'Fast Boot is on. RIPPS2 boots from its own drive (%s): the settings%s and every list from its cache. The other drives start when you press SELECT on their page, or launch one of their games.'
  : 'Fast Boot je zapnutý. RIPPS2 startuje ze své vlastní jednotky (%s): nastavení%s a každý seznam z jeho mezipaměti. Ostatní jednotky se spustí, když na jejich stránce stiskneš SELECT nebo spustíš některou z jejich her.'
  Fast Boot is on. The sounds take %d KB and the memory card RIPPS2 runs from has %d KB free, so they stay in %s.: Fast Boot je zapnutý. Zvuky zabírají %d KB a paměťová karta, ze které RIPPS2 běží, má volných %d KB, takže zůstanou v %s.
