  : 'Zvuky zabírají %d KB a tato paměťová karta má volných %d KB. Nic nebylo zapsáno. Uvolněte na kartě místo, nebo spusťte disk v Úložišti a extrahujte je znovu: RIPPS2 pak nabídne ten disk.'
  ? The sounds take %d KB and this memory card has %d KB free. START writes them to %sAUDIO/ on the drive instead, and RIPPS2 plays them from there.
  : Zvuky zabírají %d KB a tato paměťová karta má volných %d KB. START je místo toho zapíše do %sAUDIO/ na disku a RIPPS2 je odtamtud přehrává.
  There was not enough memory to make the sounds. Nothing was written.: Na vytvoření zvuků nebylo dost paměti. Nic nebylo zapsáno.
  ? BIBLE could not move %s aside to keep it, so it stopped there. Nothing on the card was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : BIBLE nedokázalo odsunout %s, aby ho uchovalo, takže se tam zastavilo. Na kartě se nic nezměnilo. (DIAG.TXT vedle RIPPS2 obsahuje, co karta odpověděla.)
  ? 'Memory Files opens now, on MEDIA, with the disc on its clipboard (RIPPED). Go to the drive and folder it should be in (any drive: USB, the HDD, the SD2PSX''s MEDIA), press TRIANGLE for ACTIONS and choose PASTE. RIPDISC then asks once more and reads the disc with your PS2''s laser, writing it there.'
  : 'Paměťové soubory se teď otevřou na MEDIA s diskem ve schránce (VYJMUTO). Přejděte na disk a do složky, kam má jít (jakýkoli disk: USB, HDD, MEDIA na SD2PSX), stiskněte TROJÚHELNÍK pro AKCE a zvolte VLOŽIT. RIPDISC se pak ještě jednou zeptá, přečte disk laserem vaší PS2 a zapíše ho tam.'
  RENAME THE GAME: PŘEJMENOVAT HRU
  ? 'This game starts through Neutrino, and RIPPS2 found none: not at Settings'' path, on the game''s drive, on the memory cards or on any started drive. RIPPS2 carries Neutrino by rickgaiser (AFL-3.0), its newest build: install it once, where you pick, and every Neutrino game uses it from there.'
  : 'Tato hra se spouští přes Neutrino a RIPPS2 ho nenašel: ani na cestě z Nastavení, ani na disku hry, ani na paměťových kartách, ani na žádném spuštěném disku. RIPPS2 obsahuje Neutrino od rickgaisera (AFL-3.0), jeho nejnovější sestavení: nainstalujte ho jednou, kam chcete, a každá hra s Neutrinem ho odtamtud použije.'
