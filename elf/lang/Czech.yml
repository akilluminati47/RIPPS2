  Cross: Křížek
  Down: Dolů
  Down on the d-pad: Dolů na směrovém kříži
  Found %04X:%04X. Let go of everything on it, sticks too, and wait.: Nalezeno %04X:%04X. Pusť na něm vše, i páčky, a počkej.
  Got it. Let go.: Mám to. Pusť.
  L3 (press the left stick in): L3 (zmáčkni levou páčku)
  Left on the d-pad: Vlevo na směrovém kříži
  Nothing was set up, so no file was written.: Nic nebylo nastaveno, takže se nezapsal žádný soubor.
  ? Plug in the USB pad you want to set up. If it is in already, take it out and plug it in again. Then press any button on it once.
  : Připoj USB ovladač, který chceš nastavit. Pokud už je připojený, odpoj ho a připoj znovu. Pak na něm jednou stiskni libovolné tlačítko.
  Press %s on the USB pad and hold it.: Stiskni %s na USB ovladači a drž.
  Push %s and hold it.: Vychyl %s a drž.
  R3 (press the right stick in): R3 (zmáčkni pravou páčku)
  Right on the d-pad: Vpravo na směrovém kříži
  Save: Uložit
  Saved as %s. The pad now steers the menu, and plays in games with the Pad Emulator on.: Uloženo jako %s. Ovladač teď ovládá menu a hraje ve hrách se zapnutým Pad Emulator.
  Skip: Přeskočit
  Square: Čtverec
  This pad cannot be described in a .pad yet (%s), so no file was written.: Tento ovladač zatím nejde popsat v souboru .pad (%s), takže se nezapsal žádný soubor.
  Triangle: Trojúhelník
  'Try it. What you hold shows here:': 'Vyzkoušej to. Co držíš, se ukáže zde:'
