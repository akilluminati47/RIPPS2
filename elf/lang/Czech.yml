  XERA_CONNECTION_ERROR: Seznam z xeRAbora nelze přečíst. Stiskněte Select pro nový pokus.
  CAD_PAIR_UDPFS: Caduceus není dosažitelný. Spárujte ART/CADUCEUS.KEY ve složce, kterou sdílí PS2-Servers, a nastavte IP pomocníka RA.
  RA_WL_NOT_SAVED: Seznam sledování nešlo uložit. Ověřte, že zařízení nebo sdílení hry je zapisovatelné, a pak zkontrolujte znovu.
  RA_UDPFS_LOAD_FIRST: Otevřete jednou stránku UDPFS, aby se načetl její síťový modul, a zkuste to znovu.
  CAD_UDPFS_IMG: 'Prohlížeč Caduceus potřebuje SMB nebo UDPFS Soubory: UDPFS IMG nemá sdílenou složku pro svůj klíč.'
  XERA_SET_CLOCK: Zatím není ve vaší knihovně RetroAchievements. Nastavte hodiny konzole v nastavení systému, abyste viděli celý seznam, nebo si ji jednou zahrajte s úspěchy.
  CFG_TITLES: Zobrazit názvy z CFG v seznamech her
  HINT_CFG_TITLES: Zobrazí Název z CFG každé hry místo názvu souboru a řadí podle něj. Při obnovení seznamu čte každý CFG, takže se seznamy načítají pomaleji. Jen zobrazení.
  AUTO_VMC_INVALID: Soubor VMC této hry existuje, ale není to platná paměťová karta, takže nebyl použit ani nahrazen. Hra se spustí bez něj; zkontrolujte ho v menu VMC.
  AUTO_VMC_STILL_RUNNING: VMC této hry se stále vytváří. Spusťte hru znovu za chvíli.
  NEUTRINO_DVR_QUICKBOOT: Spuštění DVR vyžaduje přechod do režimu PSX. Odstraňte -qb z globálních i herních argumentů Neutrina.
  NEUTRINO_DVR_FILE_MISSING: 'Instalace Neutrina pro DVR je neúplná. Chybí potřebný soubor:'
  PARENLOCK_GAME: Rodičovský zámek
  PARENLOCK_GAME_HINT: Pro spuštění této hry vyžadovat heslo rodičovského zámku.
  PARENLOCK_GAME_NO_PASSWORD: Nastavte heslo rodičovského zámku, jinak tato hra nebude zamčená.
  HINT_ENABLE_PCCF: CompactFlash v PC CARD raných japonských PS2. Jen nativní hry PS2; CF potřebuje výhradní přístup k PC CARD. Pro uvolnění restartujte.
  PCCF_GAMES: Hry PC CARD CF
  PCCF_UNAVAILABLE: 'CF nedostupné: vyžaduje ranou japonskou PS2 s PC CARD, kompatibilní kartu a žádný aktivní ovladač DEV9/HDD/sítě.'
  PCCF_UNSUPPORTED_GAME: CF zatím podporuje jen nativní hry PS2. VMC na CF, načítání PS1 a síťové úspěchy nejsou dostupné.
  HINT_ENABLE_DVR: Experimentální vyhledávání ISO DESR DVR. Vyžaduje zapnutý zdroj HDD; spuštění her vyžaduje externí Neutrino s podporou DVR.
  HINT_RIPPS2_IGR_PAGE: Menu ve hře, RIPSHOT a jak se snímky vyvolávají.
  RIPPS2_RIPSHOT: RIPSHOT
  HINT_RIPPS2_RIPSHOT: Snímky obrazovky z menu ve hře, do ART pro tvé motivy nebo do MEDIA.
  RIPPS2_DEVELOP_SHOTS: Vyvolávat snímky
  HINT_RIPPS2_DEVELOP_SHOTS: Jak se snímky čekající na filmu každé hry mění v PNG.
  RIPPS2_SETTINGS_HOME: Ukládat nastavení na
  HINT_RIPPS2_SETTINGS_HOME: 'Kam RIPPS2 ukládá nastavení: do vlastního uložení na paměťové kartě, do složky RIPPS2 na disku (interním HDD, USB, MX4SIO, iLink nebo MMCE) nebo do složky, kterou zadáš.'
  RIPPS2_LAUNCHERS: Spouštěče
  RIPPS2_LOOK_NOW: Hledat teď
  HINT_RIPPS2_LOOK_NOW: RIPPS2 hledá na spuštěných discích POPSTARTER, soubory POPS, Ember, BIOS Emberu a Neutrino a pamatuje si, kde každý je. Každé spuštění je čte odtamtud.
  RIPPS2_HIDE_GAME: Skrýt hru
  RIPPS2_HIDDEN_GAMES: Skryté hry
  HINT_RIPPS2_HIDDEN_GAMES: Hry skryté přes Skrýt hru, na spuštěných discích. Ukažte některou znovu, nebo ji smažte. Každý disk má vlastní seznam.
  HINT_RIPPS2_BDM_DEVICES: 'Disky, ze kterých BDM čte hry: USB, MX4SIO, PC Card CF, disk DVR v DESR a iLink. Vnitřní HDD se řídí režimem spuštění HDD.'
  HINT_RIPPS2_SCREEN: 'Obraz nabídky: režim obrazu, širokoúhlý obraz, jeho poloha na televizoru (H-POS, V-POS) a overscan.'
  HINT_RIPPS2_LAYOUT: Kde jsou kategorie a jak stránka přichází, pak obaly RIPFLOW a mřížka RIPGRID.
  HINT_RIPPS2_COLORS_TEXT: Tloušťka textu, barevný motiv, střídání barev a každá barva.
  HINT_RIPPS2_TEXT_WEIGHT: 'Jak silný je vlastní text RIPPS2: nápovědy v nastavení, STAV a O aplikaci. Normální je jako dřív; Tučné se lépe čte na měkkém obrazu. Vlastní písma motivu si ponechají tloušťky, které jim motiv dává.'
  HINT_RIPPS2_HDD_START: 'Interní HDD, APA nebo exFAT: RIPPS2 přečte, ať je jakýkoli, a ukáže ho jednou, jako HDD Hry. Automaticky (nejrychlejší s vloženým diskem) ho spustí při startu; Vyp ho nechá být.'
  HINT_RIPPS2_THEME_COLOR: Vlastní barva motivu. Zvolte Vlastní jako barevný motiv a vyberte ji sami, jako barvy textu.
  HINT_RIPPS2_SWEEP: Pět barev, kterými motiv pomalu a plynule přechází. Duha, střídání z každého barevného motivu nebo vaše vlastní. Vypnuto nechá motiv v klidu.
  HINT_RIPPS2_SWEEP_COLORS: Pět barev střídání a jeho rychlost. Změňte jedno z RIPPS2 a uloží se jako vaše, pod názvem, který mu dáte.
  HINT_RIPPS2_SWEEP_NAME: Jak se vaše střídání jmenuje v seznamu Střídání barev.
  HINT_RIPPS2_SWEEP_COLOR: Jedna z pěti barev, kterými střídání prochází, popořadě.
  HINT_RIPPS2_SWEEP_SPEED: 'Jak dlouho každá barva trvá, než přijde další. I Živě zůstává plynulé: barvy nikdy neblikají.'
  RIPPS2_HIDE_COMPRESS: Skrýt hru a komprese
  HINT_RIPPS2_SELECT_HOLD: 'SELECT podržený 4.2 s na seznamu her. Seznam: motivy v panelu, vyberte jeden. Dokola: další motiv. Vypnuto: nic (stisk stále obnovuje).'
  RIPPS2_RECENT_GAMES: Nedávné hry
  RIPPS2_SET_METADATA_RENAME: Nastavit metadata (přejmenovat)
  RIPPS2_TRUST_CACHE: Trust Cache
  RIPPS2_MMCE_PAD_FIRST: Nejdřív ovladač (experimentální)
  HINT_RIPPS2_MMCE_PAD_FIRST: 'SD2PSX čte po sběrnici, kterou sdílí ovladač, a během čtení není ovladač slyšet: stisky se zpožďují nebo ztrácejí, zatímco se načítají obaly. Zap: obaly přicházejí po malých kouscích a mezi nimi se čte ovladač, o něco pomaleji. Vyp: tak rychle, jak karta zvládne. Se zdroji karty na Automaticky se její seznam načte jednou, při startu.'
  HINT_RIPPS2_TRUST_CACHE: 'Seznam zobrazený z mezipaměti zůstane, jak je, připravený ke spuštění, dokud nestisknete SELECT nebo RIPPS2 sám ten zdroj nezmění. Vyp: každý zdroj se po zobrazení mezipaměti znovu načte na pozadí, pauza znatelná na kartě MMCE nebo MX4SIO, které sdílejí sběrnici ovladače.'
  RIPPS2_STATUS_OPEN: Načítání a disky
  HINT_RIPPS2_STATUS_OPEN: 'Otevře STAV: odkud start čte nastavení a seznamy her, které místo je nejrychlejší, kam vede EXIT hry, a každý disk. Jeho NASTAVENÍ MEZIPAMĚTI vede zpět sem.'
  RIPPS2_BADGE_SET: Sada odznaků
  HINT_RIPPS2_BADGE_SET: 'Odznaky na informační stránce hry (hodnocení, hráči, ESRB, video režim, skenování, poměr stran). RIPPS2: jeho vlastní sada, stejná v každém motivu. Motiv: obrázky motivu, nebo RIPPS2, když o ně motiv požádá.'
  RIPPS2_HINT_FADE: Prolínání nápověd a symbolů
  HINT_RIPPS2_HINT_FADE: 'Nápověda tlačítka nebo symbol, který se změní, se v okamžiku změny prolne, jako obaly; ty, které zůstávají, se nemění, na každé stránce i ve zprávě. Vyp: prostě se objeví. Motiv: rozhodne motiv (zap, pokud neuvádí hints_fade=0).'
  RIPPS2_SIDEBAR_STYLE: Styl postranního panelu
  HINT_RIPPS2_SIDEBAR_STYLE: 'Klasický (dělený): ikony v tmavém pruhu postranního panelu s barevným proužkem vedle. XL (z jednoho kusu): jeden širší pruh s ikonami uprostřed. Motiv: rozhodne motiv.'
  HINT_EXITPATH: 'Kam vede EXIT v nabídce ve hře. Nejlépe prázdné: EXIT vede do prohlížeče, který spustí tvůj zavaděč (FreeMcBoot, PS2BBL, OSDMenu nebo BIBLE), je-li nainstalován, a s BOOT LOCK znovu RIPPS2, jako po zapnutí; bez něj prohlížeč PS2. ELF zadaný zde se použije jen tehdy, když ho reset dokáže načíst (z paměťové karty nebo FAT32 USB disku) a není to samotný RIPPS2; vše ostatní vede do prohlížeče.'
  HINT_BDM_START: 'USB, iLink, MX4SIO a exFAT HDD. Automaticky je spustí při startu: nejrychlejší pro připojené disky, jejich hry jsou ve Všech hrách od začátku. Ručně je spustí, když otevřete jejich stránku.'
  NEUTRINO_VMC_HDD_UNSUPPORTED: 'Neutrino nemůže použít VMC na APA HDD (exFAT, USB a MX4SIO ano): tato hra se spustí se skutečnou kartou v tom slotu.'
  RIPPS2_FAST_BOOT: Fast Boot
  HINT_RIPPS2_FAST_BOOT: 'Start čte jen jednotku RIPPS2: nastavení a zvuky vedle RIPPS2.ELF (RIPPS2.FB tam říká kde) a každý seznam z jeho mezipaměti. Ostatní jednotky čekají: SELECT na stránce spustí její jednotky a načte jejich obrázky (s automatickým obnovením se spustí při startu). Zapnutí zkopíruje tvé zvuky, a když je místo i hudbu, do AUDIO vedle RIPPS2.'
  RIPPS2_ART_PACK: Balíček ART
  RIPPS2_ART_PACK_BUILD: Postavit nebo odstranit
  HINT_RIPPS2_ART_PACK: Zabalí složku ART každého spuštěného disku do jednoho art.tar na disku, který vybereš (nejrychlejší je nabídnut první). Obaly se pak načítají z jednoho souboru s jedním indexem, nikdy s hledáním pro každou hru, takže menu i hudba běží plynule. Složky ART zůstanou, jak jsou.
  RIPPS2_LIST_CFG_TEXT: Název a popis v seznamu
  HINT_RIPPS2_LIST_CFG_TEXT: 'Název a popis hry z jejího CFG vedle seznamu. Motiv: jak je motiv ukazuje (vlastní motiv RIPPS2 je vynechává). Stránka informací je vždy ponechá.'
  RIPPS2_PS1_PREFER: Duplikáty PS1
  HINT_RIPPS2_PS1_PREFER: 'Hra PS1, která je zároveň VCD pro POPSTARTER i obraz pro Ember. Obojí: dva řádky. Ember: jen řádek Ember. POPSTARTER: jen VCD. Stejný název, bez ID disku na začátku, je stejná hra.'
  RIPPS2_MY_PADS: Moje ovladače
  HINT_RIPPS2_MY_PADS: 'Profily .pad ve složce PADS vedle RIPPS2: jeden textový soubor na USB ovladač, pojmenovaný podle jeho ID (2563_0575.pad), každý zkontrolovaný. Ovladač s profilem ovládá menu a hraje ve hrách (Pad Emulator zapnutý).'
  RIPPS2_PAD_SETUP: Nastavit USB ovladač
  HINT_RIPPS2_PAD_SETUP: Připoj USB ovladač, který RIPPS2 nezná, stiskni každé tlačítko, o které požádá, a RIPPS2 zapíše jeho .pad do PADS. SELECT na tvém ovladači PS2 tlačítko přeskočí.
