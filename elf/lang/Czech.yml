  'BIBLE: putting the HDD''s boot program back': 'BIBLE: vracení zaváděcího programu HDD'
  'BIBLE: writing PS2BBL to the HDD''s boot area': 'BIBLE: zápis PS2BBL do zaváděcí oblasti HDD'
  ? 'INSTALL BIBLE ON THE INTERNAL HDD

    - RIPPS2 is copied to %s.

    - The HDD''s boot program now in __mbr is read out and kept in %s/RIPPS2 (RESTORE puts it back).

    - PS2BBL 1.2.0''s HDD build is written in its place, and the console set to start it at power on.

    - Its config (%s) starts RIPPS2 from %s first%s%s, BOOT LOCK on.

    This needs a console that boots from its HDD (a fat PS2 with the network adapter). Keep it on until it says done.'
  : 'NAINSTALOVAT BIBLE NA INTERNÍ HDD

    - RIPPS2 se zkopíruje do %s.

    - Zaváděcí program HDD, který je teď v __mbr, se přečte a uchová v %s/RIPPS2 (OBNOVIT ho vrátí).

    - Na jeho místo se zapíše sestavení PS2BBL 1.2.0 pro HDD a konzole se nastaví, aby ho při zapnutí spouštěla.

    - Jeho nastavení (%s) spouští RIPPS2 nejdřív z %s%s%s, BOOT LOCK zapnutý.

    Potřebujete konzoli, která startuje ze svého HDD (tlustou PS2 se síťovým adaptérem). Nechte ji zapnutou, dokud se neukáže hotovo.'
  INTERNAL HDD  (its boot area): INTERNÍ HDD  (jeho zaváděcí oblast)
  ? 'PUT BACK THE HDD''S OLD BOOT PROGRAM

    The one BIBLE kept (RIPPS2/MBR-BACKUP.KELF on the HDD) goes back in __mbr, in BIBLE''s place. RIPPS2 and the PS2BBL config stay where they are.'
  : 'VRÁTIT STARÝ ZAVÁDĚCÍ PROGRAM HDD

    Ten, který BIBLE uchovalo (RIPPS2/MBR-BACKUP.KELF na HDD), se vrátí do __mbr místo BIBLE. RIPPS2 a nastavení PS2BBL zůstanou, kde jsou.'
  RESTORE: OBNOVIT
  RESTORE THE HDD'S OLD BOOT PROGRAM: OBNOVIT STARÝ ZAVÁDĚCÍ PROGRAM HDD
  ? RIPPS2 cannot tell this console's region from its ROM, so it does not know which system-update folder it reads. BIBLE was not installed.
  : RIPPS2 nedokáže z ROM zjistit region této konzole, takže neví, kterou složku aktualizace systému čte. BIBLE nebylo nainstalováno.
  ? RIPPS2 could not open the HDD's __sysconf or __common partition (error %d), so BIBLE has nowhere to keep RIPPS2 and its config there. Nothing was changed.
  : RIPPS2 nedokázalo otevřít oddíl __sysconf ani __common na HDD (chyba %d), takže BIBLE nemá kde uchovat RIPPS2 a své nastavení. Nic se nezměnilo.
  RIPPS2 could not read the kept boot program. Nothing was changed.: RIPPS2 nedokázalo přečíst uchovaný zaváděcí program. Nic se nezměnilo.
  RIPPS2 could not write the boot program back. Try again; the kept copy is untouched.: RIPPS2 nedokázalo zapsat zaváděcí program zpět. Zkuste to znovu; uchovaná kopie je nedotčená.
  'RIPPS2 was busy reading a drive and could not restart the I/O processor. Nothing was changed: try again in a moment.': 'RIPPS2 bylo zaneprázdněné čtením disku a nemohlo restartovat procesor I/O. Nic se nezměnilo: zkuste to za chvíli znovu.'
  Reading the memory cards: Čtení paměťových karet
  The HDD partition BIBLE uses went away. Nothing was changed.: Oddíl HDD, který BIBLE používá, zmizel. Nic se nezměnilo.
  The HDD's old boot program is back. BIBLE no longer starts from the HDD.: Starý zaváděcí program HDD je zpět. BIBLE se už ze HDD nespouští.
  ? The console would not bind BIBLE to memory card %d (its MagicGate step failed). Nothing on the card was changed. A card that is not a genuine or MagicGate-compatible one cannot hold a system update.
  : Konzole nesvázala BIBLE s paměťovou kartou %d (krok MagicGate selhal). Na kartě se nic nezměnilo. Karta, která není originální nebo kompatibilní s MagicGate, nemůže nést aktualizaci systému.
  'The one that was there is kept in RIPPS2/MBR-BACKUP.KELF on the HDD: BOOT LOADER > MANAGE > RESTORE puts it back.': 'Ten, který tam byl, je uchován v RIPPS2/MBR-BACKUP.KELF na HDD: ZAVADĚČ > SPRAVOVAT > OBNOVIT ho vrátí.'
  The security module would not start on this console. Nothing on the memory card was changed.: Bezpečnostní modul se na této konzoli nespustil. Na paměťové kartě se nic nezměnilo.
  ? 'There is no formatted PS2 memory card in either slot, and no internal HDD. BIBLE lives on a memory card or the HDD: insert a card, then try again.'
  : 'V žádném slotu není naformátovaná paměťová karta PS2 a není tu ani interní HDD. BIBLE bydlí na paměťové kartě nebo HDD: vložte kartu a zkuste to znovu.'
  There is no kept boot program on this HDD. Nothing was changed.: Na tomto HDD není žádný uchovaný zaváděcí program. Nic se nezměnilo.
  ? This HDD has no __sysconf partition, so BIBLE's config has to go on a memory card (PS2BBL reads a card's first), and there is none in either slot. Insert one, then try again.
  : Tento HDD nemá oddíl __sysconf, takže nastavení BIBLE musí jít na paměťovou kartu (PS2BBL čte nejdřív to z karty), a v žádném slotu karta není. Vložte jednu a zkuste to znovu.
