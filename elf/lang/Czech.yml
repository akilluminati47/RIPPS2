  COPY IT OUT TO OPEN IT: ZKOPÍRUJTE VEN, ABY ŠLO OTEVŘÍT
  'Copying out: %s': 'Kopíruje se ven: %s'
  INVERT MARKS: OBRÁTIT OZNAČENÍ
  NO FILES ON THE CLIPBOARD: VE SCHRÁNCE NEJSOU SOUBORY
  SIZE AND FREE SPACE: VELIKOST A VOLNÉ MÍSTO
  ? CHEATS in the in-game menu turns each of the game's cheats on or off while you play. Changes apply on RESUME; a cheat turned off stops writing, what it wrote stays. Needs Cheats on for the game.
  : CHEATS v herním menu zapíná nebo vypíná každý cheat hry během hraní. Změny platí po RESUME; vypnutý cheat přestane zapisovat, co zapsal, zůstane. Vyžaduje zapnuté Cheats pro hru.
  'No CHEATS in the in-game menu: the cheats ticked before the launch run all game, as before.': 'Bez CHEATS v herním menu: cheaty zaškrtnuté před spuštěním běží celou hru, jako dřív.'
  BOOT SOUND WITH THE PILLARS: ZVUK SPUŠTĚNÍ SE SLOUPY
  'Boot Sound: On (fast)': 'Zvuk spuštění: Zap. (rychle)'
  'Boot sound On (fast): %s, as the pillars rise': 'Zvuk spuštění Zap. (rychle): %s, když sloupy rostou'
  'Boot sound On: from the AUDIO folder, once its drive is up': 'Zvuk spuštění Zap.: ze složky AUDIO, jakmile je její disk připraven'
  Boot sound off (Audio settings > Boot Sound): Zvuk spuštění vyp. (Nastavení zvuku > Zvuk spuštění)
  Copies boot.adp beside RIPPS2 on the memory card it starts from, where the boot reads it before any drive is up.: Zkopíruje boot.adp vedle RIPPS2 na paměťovou kartu, ze které startuje, kde ho start čte dřív, než je připraven jakýkoli disk.
  '%s could not be written.': '%s se nepodařilo zapsat.'
  '%s is there already and could not be put aside, so it was left as it was.': '%s už existuje a nepodařilo se ho odložit stranou, takže zůstal, jak byl.'
