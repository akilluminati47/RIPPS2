  'BESIDE RIPPS2: %sAUDIO%s, read first at boot': 'VEDLE RIPPS2: %sAUDIO%s, při startu se čte jako první'
  ? '- PS2BBL 1.2.0 is bound to this card by the console and written as %s/%s.
  
    - Its config, mc%d:/PS2BBL/CONFIG.INI, starts RIPPS2 where it is (%s) with no wait (0 ms, which PS2BBL Extended does not allow), BOOT LOCK on. RIPPS2 itself is not copied.
  
    The I/O processor restarts for this and every drive read stops until it is done; music and drives come back after. Keep the card in and the console on until it says done.'
  : '- Konzole sváže PS2BBL 1.2.0 s touto kartou a zapíše ho jako %s/%s.
  
    - Jeho konfigurace, mc%d:/PS2BBL/CONFIG.INI, spouští RIPPS2 tam, kde je (%s), bez čekání (0 ms, což PS2BBL Extended nedovoluje), BOOT LOCK zapnutý. Samotné RIPPS2 se nekopíruje.
  
    Vstupně-výstupní procesor se kvůli tomu restartuje a veškeré čtení jednotek se zastaví, dokud to neskončí; hudba a jednotky se pak vrátí. Nech kartu vloženou a konzoli zapnutou, dokud nenapíše hotovo.'
  ? 'An SD2PSX or MMCE card may protect itself after a refused write: if the memory card or the MMCE drive is missing now, turn the console off and on.'
  : 'Karta SD2PSX nebo MMCE se může po odmítnutém zápisu chránit: pokud teď chybí paměťová karta nebo jednotka MMCE, vypni a zapni konzoli.'
  BOOT LOCK ON: BOOT LOCK ZAPNUTÝ
  'Done: the memory card in slot %d starts what it started before BBL 1.20. BBL 1.20 is kept in mc%d:/%s.': 'Hotovo: paměťová karta ve slotu %d spouští to, co spouštěla před BBL 1.20. BBL 1.20 zůstává v mc%d:/%s.'
  ? 'For a standard 8 MB PS2 memory card (a MagicGate card, or an SD2PSX or MMCE BOOT card): the one in slot %d. At power on PS2BBL reads slot 2''s config before slot 1''s.
  
    '
  : 'Pro běžnou 8MB paměťovou kartu PS2 (kartu MagicGate nebo kartu BOOT SD2PSX či MMCE): tu ve slotu %d. Při zapnutí čte PS2BBL konfiguraci slotu 2 před konfigurací slotu 1.
  
    '
  MEMORY CARD IN SLOT %d  (%s): PAMĚŤOVÁ KARTA VE SLOTU %d  (%s)
  ? PS2BBL 1.2.0 cannot start RIPPS2 from where it is now (it reaches memory cards, USB drives and MX4SIO), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there, or use PS2BBL Extended, which reads MMCE and the HDD.
  : PS2BBL 1.2.0 nemůže spustit RIPPS2 z místa, kde teď je (dosáhne na paměťové karty, USB jednotky a MX4SIO), a RIPPS2 se samo nekopíruje. Dej RIPPS2.ELF na paměťovou kartu nebo USB jednotku a spusť ho odtud, nebo použij PS2BBL Extended, který čte MMCE a pevný disk.
  RESTORE SLOT %d'S OLD BOOT LOADER: OBNOVIT STARÝ ZAVADĚČ VE SLOTU %d
  ? 'RIPPS2: BBL 1.20 is set up on the memory card in slot %d (mc%d:/%s/%s), BOOT LOCK on: at power on it starts RIPPS2 from %s, at once.'
  : 'RIPPS2: BBL 1.20 je nastavený na paměťové kartě ve slotu %d (mc%d:/%s/%s), BOOT LOCK zapnutý: při zapnutí hned spustí RIPPS2 z %s.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    '
  : 'RIPPS2: nastavuje se BBL 1.20
  
    '
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read (it reads memory cards, USB and MX4SIO), and RIPPS2 does not copy itself. The PS2BBL Extended config on this card (%s) reads it: START turns BOOT LOCK on, so it starts RIPPS2 from %s at power on. Nothing else on the card changes.'
  : 'RIPPS2: nastavuje se BBL 1.20
  
    RIPPS2 běží z %s, což PS2BBL 1.2.0 neumí číst (čte paměťové karty, USB a MX4SIO), a RIPPS2 se samo nekopíruje. Konfigurace PS2BBL Extended na této kartě (%s) to čte: START zapne BOOT LOCK, takže při zapnutí spustí RIPPS2 z %s. Nic jiného se na kartě nezmění.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    RIPPS2 runs from %s, which PS2BBL 1.2.0 cannot read: it starts programs from a memory card, a USB drive or MX4SIO, and RIPPS2 does not copy itself. Put RIPPS2.ELF on one of those (a memory card''s APPS folder, or a USB drive), start it from there, then set up BIBLE again.'
  : 'RIPPS2: nastavuje se BBL 1.20
  
    RIPPS2 běží z %s, což PS2BBL 1.2.0 neumí číst: spouští programy z paměťové karty, USB jednotky nebo MX4SIO, a RIPPS2 se samo nekopíruje. Dej RIPPS2.ELF na jednu z nich (do složky APPS paměťové karty nebo na USB jednotku), spusť ho odtud a pak BIBLE nastav znovu.'
  ? 'RIPPS2: Setting up BBL 1.20
  
    The memory card in slot %d: BBL 1.20 (mc%d:/%s) moves aside, and what it replaced (mc%d:/%s) goes back in its place. Nothing is deleted. The PS2BBL config stays as it is (BOOT LOCK can turn the lock off).'
  : 'RIPPS2: nastavuje se BBL 1.20
  
    Paměťová karta ve slotu %d: BBL 1.20 (mc%d:/%s) se odsune stranou a to, co nahradil (mc%d:/%s), se vrátí na své místo. Nic se nemaže. Konfigurace PS2BBL zůstane, jak je (BOOT LOCK může zámek vypnout).'
  'RIPPS2: Setting up BBL 1.20 (binding PS2BBL to the memory card)': 'RIPPS2: nastavuje se BBL 1.20 (svazování PS2BBL s paměťovou kartou)'
  'RIPPS2: Setting up BBL 1.20 (putting back what was there)': 'RIPPS2: nastavuje se BBL 1.20 (vrací se to, co tu bylo)'
  'RIPPS2: Setting up BBL 1.20 (restarting the I/O processor)': 'RIPPS2: nastavuje se BBL 1.20 (restartuje se vstupně-výstupní procesor)'
  'RIPPS2: Setting up BBL 1.20 (writing it to the memory card)': 'RIPPS2: nastavuje se BBL 1.20 (zápis na paměťovou kartu)'
  SET UP BBL 1.20: NASTAVIT BBL 1.20
  ? 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: Setting up BBL 1.20. PS2BBL 1.2.0 by El Isra, set up by RIPPS2 on a standard 8 MB PS2 memory card or the internal HDD: a 0 ms start at power on (PS2BBL Extended does not allow 0), RIPPS2 first from where it is (it is never copied), and a button held at power on still reaches the browser (TRIANGLE), a disc (START) and what was there before (CIRCLE). Set it up, repair it or restore what it replaced?'
  : 'SLOT 1: %s
  
    SLOT 2: %s
  
    %s
  
    RIPPS2: nastavuje se BBL 1.20. PS2BBL 1.2.0 od El Isry, nastavený z RIPPS2 na běžné 8MB paměťové kartě PS2 nebo interním pevném disku: start za 0 ms při zapnutí (PS2BBL Extended 0 nedovoluje), nejdřív RIPPS2 z místa, kde je (nikdy se nekopíruje), a tlačítko držené při zapnutí pořád vede do prohlížeče (TRIANGLE), na disk (START) a k tomu, co tu bylo předtím (CIRCLE). Nastavit, opravit, nebo obnovit to, co nahradil?'
  The memory card in slot %d has %d KB free, and BBL 1.20 needs %d KB there. Free some space, then try again.: Paměťová karta ve slotu %d má volných %d KB a BBL 1.20 na ní potřebuje %d KB. Uvolni trochu místa a zkus to znovu.
  ? The memory card in slot %d refused PS2BBL, so RIPPS2 put the card back as it was. Check its free space, then try again. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Paměťová karta ve slotu %d odmítla PS2BBL, takže RIPPS2 nechalo kartu, jak byla. Zkontroluj volné místo a zkus to znovu. (DIAG.TXT vedle RIPPS2 obsahuje odpověď karty.)
  ? The memory card in slot %d would not move BBL 1.20 aside, so nothing was changed. (DIAG.TXT beside RIPPS2 has what the card said.)
  : Paměťová karta ve slotu %d nechtěla odsunout BBL 1.20, takže se nic nezměnilo. (DIAG.TXT vedle RIPPS2 obsahuje odpověď karty.)
  The memory card in slot %d would not take %s back, so BBL 1.20 stayed. (DIAG.TXT beside RIPPS2 has what the card said.): Paměťová karta ve slotu %d nechtěla vzít zpět %s, takže BBL 1.20 zůstal. (DIAG.TXT vedle RIPPS2 obsahuje odpověď karty.)
  MUSIC: HUDBA
  '%s%s has no %s. RIPPOPS found Sony''s PS1 emulator on %s: START copies %s here and starts the game.': '%s%s nemá %s. RIPPOPS našel emulátor PS1 od Sony na %s: START sem zkopíruje %s a spustí hru.'
  ? 'RIPPS2 does not see %s in %s%s. POPSTARTER needs POPS_IOX.PAK with POPS.PAK, or with POPS.ELF and IOPRP252.IMG: Sony''s PS1 emulator, from your own console. It may find them where RIPPS2 does not look (if your games start, it does). START launches, and this drive is not asked about again.'
  : 'RIPPS2 nevidí %s v %s%s. POPSTARTER potřebuje POPS_IOX.PAK s POPS.PAK, nebo s POPS.ELF a IOPRP252.IMG: emulátor PS1 od Sony z tvé vlastní konzole. Může je najít tam, kde RIPPS2 nehledá (když tvé hry startují, najde je). START spustí a na tuto jednotku se už nebude ptát.'
  ' (The configs found were set: %s.)': ' (Nalezená nastavení byla upravena: %s.)'
  ' Save its settings once with its own configurator, then turn BOOT LOCK on again.': ' Jednou uložte jeho nastavení v jeho vlastním konfigurátoru a pak BOOT LOCK znovu zapněte.'
  ? '%s cannot start RIPPS2 from where it is now (%s), and RIPPS2 does not copy itself. Put RIPPS2.ELF on a memory card or a USB drive and start it from there.'
  : '%s nemůže spustit RIPPS2 z místa, kde teď je (%s), a RIPPS2 se sám nekopíruje. Dejte RIPPS2.ELF na paměťovou kartu nebo USB disk a spusťte ho odtud.'
  ? BOOT LOCK could not write the boot loader's config. Check that the memory card or drive is not write protected, then try again.
  : BOOT LOCK nemohl zapsat nastavení zavaděče. Zkontrolujte, že paměťová karta nebo disk není chráněn proti zápisu, a zkuste to znovu.
  BOOT LOCK found no boot loader config to change.: BOOT LOCK nenašel žádné nastavení zavaděče ke změně.
  BOOT LOCK is off. Your boot loader starts what it started before (%s).: BOOT LOCK je vypnutý. Váš zavaděč spouští to, co spouštěl dřív (%s).
  ? BOOT LOCK is on. %s now starts RIPPS2 at power on (%s), and an empty IGR Path sends a game's EXIT back the same way. Hold one of its buttons while the console starts to reach anything else.%s
  : BOOT LOCK je zapnutý. %s teď při zapnutí spouští RIPPS2 (%s) a prázdná Cesta k IGR vrací EXIT ze hry stejnou cestou. Abyste se dostali jinam, držte při startu konzole jedno z jeho tlačítek.%s
  ? 'BOOT LOCK put RIPPS2 first in OSDMenu''s menu (%s). OSDMenu starts nothing by itself: pick RIPPS2 there, and a game''s EXIT comes back to that menu. For a console that starts RIPPS2 at once, BIBLE puts PS2BBL 1.2.0 on a memory card (Boot Loader).'
  : 'BOOT LOCK dal RIPPS2 na první místo v menu OSDMenu (%s). OSDMenu samo nic nespouští: vyberte tam RIPPS2 a EXIT ze hry se vrací do toho menu. Pro konzoli, která spustí RIPPS2 hned, nainstaluje BIBLE PS2BBL 1.2.0 na paměťovou kartu (Zavaděč).'
  BOOT LOCK works through a boot loader on a memory card (PS2BBL, FMCB or OSDMenu), and there is none here.: BOOT LOCK funguje přes zavaděč na paměťové kartě (PS2BBL, FMCB nebo OSDMenu) a tady žádný není.
  The memory card in slot %d starts %s at power on, and BOOT LOCK found no config of it to change (it looks for %s).: Paměťová karta ve slotu %d při zapnutí spouští %s a BOOT LOCK nenašel žádné jeho nastavení ke změně (hledá %s).
  'The memory card in slot %d starts %s at power on, which BOOT LOCK cannot set: it works through PS2BBL, FMCB and OSDMenu.': 'Paměťová karta ve slotu %d při zapnutí spouští %s, který BOOT LOCK nastavit neumí: funguje přes PS2BBL, FMCB a OSDMenu.'
  A boot loader with RIPPS2's lock is on this console.: Na této konzoli je zavaděč se zámkem RIPPS2.
  'A game''s EXIT: the browser, then your boot loader (BOOT LOCK)': 'EXIT ze hry: prohlížeč, pak váš zavaděč (BOOT LOCK)'
  'In use: %s, %d pictures, %d MB': 'Používá se: %s, %d obrázků, %d MB'
  'Measuring how fast each drive reads its art: %s': 'Měření, jak rychle každý disk čte své obrázky: %s'
  'None: each picture is read from its own ART folder.': 'Žádný: každý obrázek se čte z vlastní složky ART.'
  REMOVE the pack in %s (the ART folders stay as they are): ODSTRANIT balíček v %s (složky ART zůstanou, jak jsou)
  Remove the ART Pack in %s? The ART folders stay as they are.: Odstranit balíček ART v %s? Složky ART zůstanou, jak jsou.
  Stopped. The unfinished pack was removed, and art loads from the ART folders as before.: Zastaveno. Nedokončený balíček byl odstraněn a obrázky se načítají ze složek ART jako dřív.
  ? 'The ART Pack could not be written to %s (is there room on that drive?). Nothing else changed: art loads from the ART folders as before.'
  : 'Balíček ART se nepodařilo zapsat do %s (je na tom disku místo?). Nic jiného se nezměnilo: obrázky se načítají ze složek ART jako dřív.'
  The ART Pack in %s is removed. Art loads from the ART folders again.: Balíček ART v %s je odstraněn. Obrázky se opět načítají ze složek ART.
  ? There is no ART folder with pictures on the started drives. Start the drives your art is on (SELECT on their page), then come back.
  : Na spuštěných discích není žádná složka ART s obrázky. Spusť disky, na kterých máš obrázky (SELECT na jejich stránce), a pak se vrať.
  ? 'Pictures: %d. ART folders: %d. They go into one file, %s. The ART folders stay as they are: the pack is a copy. You can copy art.tar into another drive''s ART folder with Memory Files, but building it on the drive you browse from is quickest, so the fastest drive comes first. Build it now?'
  : '%d obrázků z %d složek ART půjde do jednoho souboru, %s. Složky ART zůstanou, jak jsou: balíček je kopie. art.tar můžeš zkopírovat do složky ART jiného disku pomocí Memory Files, ale nejrychlejší je postavit ho na disku, ze kterého procházíš, proto je nejrychlejší disk první. Postavit teď?'
  ? 'The ART Pack is built: %d pictures, %d MB, in %s (%d s). Art loads from it from now on, and the games it was built for (%d) never have their ART folder asked one picture at a time. Art RIPPS2 fetches or shoots shows at once; art you copy in on a PC shows after you build the pack again.'
  : 'Balíček ART je hotový: %d obrázků, %d MB, v %s (%d s). Od teď se obrázky načítají z něj a u %d her, pro které byl postaven, se už jejich složky ART nikdy neptá obrázek po obrázku. Obrázky, které RIPPS2 stáhne nebo vyfotí, se ukážou hned; obrázky zkopírované z PC se ukážou, až balíček postavíš znovu.'
  '%s free': '%s volno'
  '%sART/art.tar: reads %s/s, %s': '%sART/art.tar: čte %s/s, %s'
  '%sART/art.tar: reads %s/s, the fastest, %s': '%sART/art.tar: čte %s/s, nejrychlejší, %s'
  ART PACK: BALÍČEK ART
  About %d min: Asi %d min
  'Looking at the ART folders: %d pictures, %s': 'Prohlížení složek ART: %d obrázků, %s'
  ? 'No started drive has room for the ART Pack: it needs about %s. Free some room on the drive you browse from, then try again.'
  : 'Žádný spuštěný disk nemá místo na balíček ART: potřebuje asi %s. Uvolni místo na disku, ze kterého procházíš, a zkus to znovu.'
  PACKING THE ART: BALENÍ OBRÁZKŮ
  PICTURE %d OF %d: OBRÁZEK %d Z %d
  'Pictures: %d (%s). ART folders: %d.': 'Obrázky: %d (%s). Složky ART: %d.'
  Stop? The unfinished pack is removed; the ART folders stay as they are.: Zastavit? Nedokončený balíček se odstraní; složky ART zůstanou, jak jsou.
  'The ART folders stay as they are: the pack is a copy.': 'Složky ART zůstanou, jak jsou: balíček je kopie.'
  Under a minute: Méně než minuta
  free space unknown: volné místo neznámé
  'A game''s EXIT: the browser, or your boot loader when one is installed': 'EXIT ze hry: prohlížeč, nebo tvůj zavaděč, je-li nainstalován'
  Ogg Vorbis by Xiph.Org (BSD), minimp3 by lieff (CC0): Ogg Vorbis od Xiph.Org (BSD), minimp3 od lieff (CC0)
  RIPFLOW's type, and every message and notification: písmo RIPFLOW a každé zprávy a oznámení
  'Thanks to everyone testing on Discord and opening issues on GitHub:': 'Díky všem, kdo testují na Discordu a zakládají issues na GitHubu:'
  'The IGR Path %s is not used: after a game only a memory card file or USB can load, and never RIPPS2 itself': 'IGR Path %s se nepoužije: po hře lze načíst jen soubor z paměťové karty nebo USB, a nikdy samotný RIPPS2'
  an issue is the best way to get RIPPS2 updated.: issue je nejlepší cesta, jak RIPPS2 vylepšit.
  your Ogg and MP3 music, as RIPPS2 plays it: tvoje hudba Ogg a MP3, jak ji hraje RIPPS2
  Pop In and Name: Vyskočení a název
  ? '%s starts after the pillars, so the boot sound plays late. START copies boot.adp (%d KB) beside RIPPS2 on the memory card (%d KB free), where it plays as the pillars rise.'
  : '%s se spouští až po sloupech, takže zvuk spuštění hraje pozdě. START zkopíruje boot.adp (%d KB) vedle RIPPS2 na paměťovou kartu (%d KB volno), kde hraje, když se sloupy zvedají.'
  The boot sound could not be copied to %s. It still plays from %s.: Zvuk spuštění se nepodařilo zkopírovat do %s. Stále hraje z %s.
  Zoom: Přiblížení
  '%s could not be deleted; it stays as it was.': '%s se nepodařilo smazat; zůstává, jak byl.'
  '%s could not be read as a .tar archive. Nothing was changed.': '%s se nepodařilo přečíst jako archiv .tar. Nic se nezměnilo.'
  '%s is deleted. %s is kept.': '%s je smazán. %s se ponechává.'
  Art loads from it from now on.: Obrázky se od teď načítají z něj.
  ? 'Delete the merged-in .tar?
  
    DELETE: %s
  
    KEEP: %s (the destination, now with every picture of both)'
  : 'Smazat sloučený .tar?
  
    SMAZAT: %s
  
    PONECHAT: %s (cíl, nyní se všemi obrázky z obou)'
  Into %s (%s): Do %s (%s)
  ? 'KEPT and updated: %s (%d pictures)
  
    MERGED IN: %s (%d pictures)
  
    Pictures in both: %d. The merged-in one wins. The kept .tar is written again as a new file and swapped in only when it is whole, so a stop or a full drive leaves it as it was. Merge now?'
  : 'PONECHÁ SE a aktualizuje: %s (%d obrázků)
  
    SLUČUJE SE: %s (%d obrázků)
  
    Obrázky v obou: %d. Vyhrává sloučený. Ponechaný .tar se zapíše znovu jako nový soubor a vymění se, až když je celý, takže zastavení nebo plný disk ho nechají, jak byl. Sloučit teď?'
  MERGE .TAR: SLOUČIT .TAR
  MERGE a .tar into the pack in %s: SLOUČIT .tar do balíčku v %s
  MERGING THE ART: SLUČOVÁNÍ OBRÁZKŮ
  Merge in %s (%s): Sloučit %s (%s)
  Merge the new pack into another .tar? You pick the .tar to keep and update next; the new pack's pictures go into it.: Sloučit nový balíček do jiného .tar? Pak vybereš .tar, který se ponechá a aktualizuje; obrázky nového balíčku půjdou do něj.
  'Merged: %s now holds %d pictures (%d MB), %d s.': 'Sloučeno: %s teď obsahuje %d obrázků (%d MB), %d s.'
  'Pictures in: %d (%s). Same name in both: %d (the merged-in one wins).': 'Vstupuje obrázků: %d (%s). Stejný název v obou: %d (vyhrává sloučený).'
  'Reading the archives: %s': 'Čtení archivů: %s'
  Stop? The kept .tar stays as it was; the unfinished copy is removed.: Zastavit? Ponechaný .tar zůstane, jak byl; nedokončená kopie se odstraní.
  Stopped. %s is as it was; the unfinished copy was removed.: Zastaveno. %s je, jak byl; nedokončená kopie byla odstraněna.
  The kept .tar is only replaced once the merged copy is whole.: Ponechaný .tar se nahradí, až když je sloučená kopie celá.
  The merge could not be written on the drive of %s (is there room?). It is as it was; nothing else changed.: Sloučení se nepodařilo zapsat na disk s %s (je tam místo?). Je, jak byl; nic dalšího se nezměnilo.
  ? The merge needs about %s free on the drive of %s (the new archive is written beside the old one first). Free some room, then try again.
  : Sloučení potřebuje asi %s volného místa na disku s %s (nový archiv se nejdřív zapíše vedle starého). Uvolni trochu místa a zkus to znovu.
  'The merge stopped between two renames: the kept .tar is %s and the merged one %s. Rename them back with Memory Files.': 'Sloučení se zastavilo mezi dvěma přejmenováními: ponechaný .tar je %s a sloučený %s. Přejmenuj je zpět v Paměťových souborech.'
  ? The merged .tar was written but could not take the name %s (an MMCE renames from firmware 1.4.0 on). The new file was removed; the kept .tar is as it was.
  : Sloučený .tar byl zapsán, ale nemohl dostat název %s (MMCE přejmenovává od firmwaru 1.4.0). Nový soubor byl odstraněn; ponechaný .tar je, jak byl.
  ? There is no other .tar to merge into %s. Put it in this folder, in a drive's ART folder or at the top of a drive, then try again.
  : Není žádný další .tar ke sloučení do %s. Dej ho do této složky, do složky ART některého disku nebo do kořene disku a zkus to znovu.
  MERGE A .TAR INTO THIS: SLOUČIT .TAR DO TOHOTO
  ? '
  
    %d game button maps in GAMES'
  : '
  
    %d mapování tlačítek her v GAMES'
  ? '
  
    1 game button map in GAMES'
  : '
  
    1 mapování tlačítek hry v GAMES'
  (no name): (bez názvu)
  Both: Obojí
  ? 'None yet. A profile is a text file named after the pad''s ID, like 2563_0575.pad: the format is in RIPPS2''s repo (docs/plans/pad-spec.md).'
  : 'Zatím žádné. Profil je textový soubor pojmenovaný podle ID ovladače, např. 2563_0575.pad: formát je v repozitáři RIPPS2 (docs/plans/pad-spec.md).'
  On (fast): Zap. (rychle)
  'Pad profiles in %s:': 'Profily ovladačů v %s:'
  RIPPS2 %s lite (build %d) on RiptOPL %s: RIPPS2 %s lite (build %d) na RiptOPL %s
  RIPPS2 cannot tell where its folder is, so it cannot look for PADS.: RIPPS2 neví, kde je jeho složka, a nemůže tedy hledat PADS.
  could not be read: nelze přečíst
  About %d seconds left: Zbývá asi %d s
  About 1 second left: Zbývá asi 1 sekunda
  Taking longer than its last start (%d s so far): Trvá déle než poslední start (zatím %d s)
  ? 'Download the covers in HD (280 x 400)? Sharper on an HD screen, about 70 KB each. START: Standard (140 x 200, as Open PS2 Loader''s), about 20 KB each. A game that already has a cover keeps it.'
  : 'Stáhnout obaly v HD (280 x 400)? Ostřejší na HD obrazovce, asi 70 KB každý. START: Standard (140 x 200, jako Open PS2 Loader), asi 20 KB každý. Hra, která už obal má, si ho ponechá.'
  STANDARD: STANDARD
  '%d IN': '%d PŘIDÁNO'
  '%d IN, %d REPLACED': '%d PŘIDÁNO, %d NAHRAZENO'
  COULD NOT WRITE: NELZE ZAPSAT
  'Getting it ready: %s': 'Příprava: %s'
  NOT A .TAR: NENÍ TO .TAR
  NOTHING CHANGED: NIC SE NEZMĚNILO
  NOTHING TO PUT IN: NENÍ CO PŘIDAT
  ? On (fast) keeps the boot sound beside RIPPS2 on the memory card it starts from, and RIPPS2 did not start from one. The boot sound plays as On.
  : Zap. (rychle) drží zvuk spuštění vedle RIPPS2 na paměťové kartě, ze které startuje, a RIPPS2 nebyl spuštěn z karty. Zvuk spuštění hraje jako u Zap.
  'There is no boot sound to copy yet: Audio settings > BIOS Sounds rips this console''s.': 'Zatím není co kopírovat: Nastavení zvuku > Zvuky BIOSu vyjme zvuky této konzole.'
  ? This is RIPPS2 lite, which carries no PS2BBL, so it cannot set up BIBLE. The full RIPPS2.elf installs and repairs it; a boot loader already set up keeps starting RIPPS2 lite as it is.
  : Toto je RIPPS2 lite, které nenese PS2BBL, a nemůže tedy nastavit BIBLE. Plný RIPPS2.elf ho instaluje a opravuje; už nastavený zavaděč dál spouští RIPPS2 lite, jak je.
  '%d COPIED OUT': '%d ZKOPÍROVÁNO VEN'
  '%d ITEM   %d MARKED   %s': '%d POLOŽKA   %d OZNAČENO   %s'
  '%d ITEM   %d MARKED   %s   %s FREE': '%d POLOŽKA   %d OZNAČENO   %s   %s VOLNO'
  '%d ITEMS   %d MARKED   %s': '%d POLOŽEK   %d OZNAČENO   %s'
  '%d ITEMS   %d MARKED   %s   %s FREE': '%d POLOŽEK   %d OZNAČENO   %s   %s VOLNO'
  '%s IN %d': '%s V %d'
