# RIPPS2 built-in theme (replaces RiptOPL's embedded <OPL> layout at build time).
# Built-in themes must not set bg_color / text_color / sel_text_color / ui_text_color:
# the palette comes from RIPPS2's defaults (patch 0001) and stays user-editable.
# Canvas is 640x480; blocks must be numbered without gaps.
# Text colours are GS-modulated (0x80 = full) over a white font atlas, so each shows at twice its
# value: #676C7A renders as #CED9F5, #6E7480 as #DCE7FF, and #FFFFFF simply saturates to white.
#
# Storage page: the RIPPS2 shell draws the category bar on top (patch 0007). Left column: the drive
# row (L1 / name / R1) over the game list. Right: a 4:3 art viewport, built from two layers:
#   GameImage BG     - the selected game's background art (scaled=0: it always fills the panel)
#   Ripps2PanelGlass - navy tint (light over the art, deep under the text) and a thin frame; with no
#                      game selected it is clear glass over the pillars, nothing else
# The game's description sits inside the viewport on top of both.
# Info page (Square): no category bar. The same viewport, larger, holds the logo, the title, the
# metadata badges and rating, and the details (bare values, no "Genre:" prefixes: display=2). To the
# right, the disc stands above its case at true-to-life scale (a 120 mm disc over a 135 x 190 mm case,
# 0.99 px/mm), the case sitting on the viewport's bottom edge with its reflection spilling below.
# The right stick tilts the panel and the showcase, each about its own centre (tilt / tilt_x / tilt_y);
# the narrow showcase turns 2.5x further (tilt_scale=250) so it reads like a case turned in the hand.

default_font=builtin:ripps2
default_font_size=16
font1=builtin:ripps2
font1_size=20
font2=builtin:ripps2
font2_size=20
font3=builtin:ripps2
font3_size=13

