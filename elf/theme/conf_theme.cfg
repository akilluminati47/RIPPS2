# RIPPS2 built-in theme (replaces RiptOPL's embedded <OPL> layout at build time).
# Built-in themes must not set bg_color / text_color / sel_text_color / ui_text_color:
# the palette comes from RIPPS2's defaults (patch 0001) and stays user-editable.
# Canvas is 640x480; blocks must be numbered without gaps.

default_font=builtin:ripps2
default_font_size=19
font1=builtin:ripps2
font1_size=30

# ---- Games list ----
main0:
	type=Background
	pattern=BG
main1:
	type=MenuIcon
	x=28
	y=22
