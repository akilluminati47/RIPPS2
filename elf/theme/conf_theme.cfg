# RIPPS2 built-in theme (replaces RiptOPL's embedded <OPL> layout at build time).
# Built-in themes must not set bg_color / text_color / sel_text_color / ui_text_color:
# the palette comes from RIPPS2's defaults (patch 0001) and stays user-editable.
# Canvas is 640x480; blocks must be numbered without gaps.
# Text colours are GS-modulated (0x80 = full) over a white font atlas, so each shows at twice its
# value: #676C7A renders as #CED9F5, #6E7480 as #DCE7FF, and #FFFFFF simply saturates to white.
# Layout follows the RIPPS2 mockups: the category bar is drawn by the RIPPS2 shell (patch 0007);
# the theme lays out the drive tab with L1/R1, the game list on the left, and the selected
# game's ART (BG) inside a glass panel.

default_font=builtin:ripps2
default_font_size=16
font1=builtin:ripps2
font1_size=20
font2=builtin:ripps2
font2_size=20
font3=builtin:ripps2
font3_size=13

