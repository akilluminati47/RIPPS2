# RIPPS2 built-in theme (replaces RiptOPL's embedded <OPL> layout at build time).
# Built-in themes must not set bg_color / text_color / sel_text_color / ui_text_color:
# the palette comes from RIPPS2's defaults (patch 0001) and stays user-editable.
# Canvas is 640x480; blocks must be numbered without gaps.
# Text colours are GS-modulated (0x80 = full) over a white font atlas, so each shows at twice its
# value: #676C7A renders as #CED9F5, #474B59 as #8E96B2, and #FFFFFF simply saturates to white.
#
# Storage page (after the mockups): the RIPPS2 shell draws the category bar on top, the current
# category bright and the other two smaller and greyer, over a vignette at the top and bottom of the
# screen. Left half: the source name, small and grey, over the game list, whose rows are 24 px apart
# with the highlight filling the row. Right half: from the page's midline, a 4:3 art viewport: the
# game's art (~69% opaque, the pillars show through) under RIPPS2's glass, the game's title in RIPPS2
# Sleek Bold and its description in the main font. The right stick tilts the viewport and its text.
# Info page (Square): no category bar. A larger viewport holds the logo, the title, the metadata
# badges and rating, and the details (bare values, display=2); to the right the disc stands over
# its case at true scale (a 120 mm disc over a 135 x 190 mm case), the case's reflection spilling
# below. The right stick tilts the whole group as one plane (at 75% of the angle: the group is wide).
#
# Fonts: the main font (Planet N Compact) in the sizes the mockups use, including the viewport
# description; RIPPS2 Sleek Bold for menus and settings, the viewport title and the text beside big
# button glyphs (START DISC, START BROWSER, the formation name).

default_font=builtin:ripps2
default_font_size=16
font1=builtin:ripps2
font1_size=20
font2=builtin:ripps2
font2_size=20
font3=builtin:ripps2
font3_size=13
font4=builtin:ripps2sleekbold
font4_size=15
